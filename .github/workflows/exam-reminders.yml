name: Trigger speaking-exam reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the exam-reminders Supabase function
        run: |
          curl --fail --show-error --silent \
            -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/exam-reminders" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json"