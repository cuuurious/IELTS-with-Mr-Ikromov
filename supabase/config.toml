[functions.delete-student]
enabled = true
verify_jwt = false
import_map = "./functions/delete-student/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-student/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-student/*.html" ]

[functions.reset-student-password]
enabled = true
verify_jwt = false
entrypoint = "./functions/reset-student-password/index.ts"

[functions.cleanup-submission-storage]
verify_jwt = false

[functions.delete-group]
enabled = true
verify_jwt = false
entrypoint = "./functions/delete-group/index.ts"

[functions.rollback-failed-signup]
enabled = true
verify_jwt = false
entrypoint = "./functions/rollback-failed-signup/index.ts"

[functions.change-password]
enabled = true
verify_jwt = false
entrypoint = "./functions/change-password/index.ts"

[functions.create-student-account]
enabled = true
verify_jwt = false
entrypoint = "./functions/create-student-account/index.ts"

# Telegram calls this function directly (it's the webhook target Telegram's
# own servers POST to) and has no Supabase login/JWT of its own — without
# verify_jwt = false, Supabase's gateway rejects every delivery with a 401
# before our own code (which checks Telegram's own TELEGRAM_WEBHOOK_SECRET
# header instead) ever runs. Found 2026-09-26: getWebhookInfo showed
# last_error_message "Wrong response from the webhook: 401 Unauthorized"
# with 9 undelivered updates queued up — this was the actual, sole reason
# "Connect Telegram" never worked, even though the deep-link/token code on
# both ends was correct the whole time.
[functions.telegram-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/telegram-webhook/index.ts"