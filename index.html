<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Switched from favicon.svg (a vector lightning-bolt logo) to
         favicon.png — a photo can't be traced into a clean vector icon,
         and PNG favicons are universally supported anyway. This is what
         actually controls the browser tab icon. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IELTS with Mr Ikromov</title>

    <!-- Without this, Google guesses a description by grabbing text off
         the rendered page — which is how a personalized student progress
         line ended up as the search snippet. This fixes it in place. -->
    <meta
      name="description"
      content="IELTS preparation with Mr Jasur Ikromov — homework, writing mock tests, and personal feedback to help you reach your target band score."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
