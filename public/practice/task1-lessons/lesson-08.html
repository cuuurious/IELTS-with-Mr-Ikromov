function styleCheck(text){
  const items=[];
  for(const r of STYLE){const re=new RegExp(r.re.source,r.re.flags.includes("g")?r.re.flags:r.re.flags+"g");let m;
    while((m=re.exec(text))){if(!m[0])continue;
      if(r.id==="cont"&&/'s$/i.test(m[0])&&!/^(it|that|there)'s$/i.test(m[0]))continue;
      items.push({kind:"style",i:m.index,len:m[0].length,msg:r.msg,fix:r.fix,why:r.why})}}
  // repeated change verbs
  const dirs=dirsOf(text).filter(d=>!/peak/i.test(d[2]));const cnt={};
  for(const d of dirs){const k=d[2].toLowerCase().replace(/(ed|ing|s|d)$/,"");cnt[k]=(cnt[k]||[]);cnt[k].push(d)}
  for(const k in cnt)if(cnt[k].length>=2){const d=cnt[k][1];items.push({kind:"style",i:d[0],len:d[2].length,msg:"You used ‘"+d[2].toLowerCase()+"’ twice.",fix:"use a synonym: "+(d[1]==="U"?"rose · climbed · grew · went up to":"fell · dropped · declined · dipped"),why:"Varying vocabulary raises your Lexical Resource score."})}
  const words=text.trim().split(/\s+/).length;
  if(words>45)items.push({kind:"style",i:0,len:0,msg:"This sentence is very long ("+words+" words).",fix:"split it into two sentences",why:"Aim for 20–35 words per sentence so the reader does not get lost."});
  if(!/[.!?]\s*$/.test(text.trim()))items.push({kind:"style",i:Math.max(0,text.trimEnd().length-1),len:1,msg:"End the sentence with a full stop.",fix:".",why:"Punctuation is part of accuracy."});
  return items}

function spellCheck(text){
  const items=[];const re=/[A-Za-z][A-Za-z'’-]*/g;let m;const sents=sentences(text);
  while((m=re.exec(text))){const raw=m[0];const w=raw.toLowerCase().replace(/['’]s$/,"");
    if(w.length<4)continue;
    if(MISSP[w]){items.push({kind:"spelling",i:m.index,len:raw.length,msg:"Spelling: ‘"+raw+"’",fix:MISSP[w],why:"Correct spelling: "+MISSP[w]+".",hard:true});continue}
    if(known(w))continue;
    // capitalised word inside a sentence = a name
    const atStart=sents.some(s=>s.i===m.index);
    if(/^[A-Z]/.test(raw)&&!atStart)continue;
    if(w.includes("-"))continue;
    const near=nearWord(w);
    if(near)items.push({kind:"spelling",i:m.index,len:raw.length,msg:"Possible spelling mistake: ‘"+raw+"’",fix:near,why:"Check the spelling. Did you mean ‘"+near+"’?",hard:false})}
  return items}

/* ---- figures & years ---- */

/* ===== Overview coach (Lesson 5) ===== */
const UP2=/\b(gain\w*|expand\w*|more popular|more widespread|more common|widespread|higher than|ended higher|ended up|edged up\w*|upward\w*|growth|surg\w*)\b/gi;
const DOWN2=/\b(los[et]|lower|disappear\w*|ended lower|less popular|less common|edged down\w*|lag\w*|below)\b/gi;
const STABLE=/\b(stable|stability|unchanged|same level|same as|remained|stayed|constant|steady|steadily|level|flat|no change|did not change|almost the same|broadly)\b/i;
const DET=/\b(most|least|biggest|largest|smallest|highest|lowest|greatest|fastest|slowest|dramatic\w*|overtook|overtake\w*|overtaken|gap|narrow\w*|widen\w*|outnumber\w*|dominant|consistently|every year|throughout|remained the|ended as|became the|far more|far fewer|by far|substantial\w*|sharpest|steepest|replace\w*|exceed\w*|surpass\w*|leading|main source|stands? out|stood out|majority|larger|smaller|more than|fewer than|disappear\w*|biggest|only)\b/i;
function dset(s){
  const d=new Set();let m;const t=s.replace(/[’‘]/g,"'");
  for(const re of [UP,UP2]){re.lastIndex=0;while((m=re.exec(t))){if(!/peak/i.test(m[0]))d.add("U")}}
  for(const re of [DOWN,DOWN2]){re.lastIndex=0;while((m=re.exec(t)))d.add("D")}
  if(STABLE.test(t))d.add("S");
  return d}
function numOK(t,m){const w=m[0];
  if(/%$/.test(w))return false;
  if(/^(19|20|21)\d\d$/.test(w))return true;                       // years: 1960, 2050
  const i=m.index,end=i+w.length,after=t.slice(end,end+28);
  if(/^(st|nd|rd|th)\b/i.test(after))return true;
  const UNIT=/^\s*(million|thousand|billion|tonnes?|percent|per cent|units?|dollars?|euros?|pounds?|kg|litres?)\b/i;
  const rg=after.match(/^\s*[–-]\s*(\d+)(?![\d%.,]|\s*%)(.*)$/);
  if(+w<=99&&rg&&!UNIT.test(rg[2]))return true;                      // age range 15–64 (first number)
  if(+w<=99&&/\d\s*[–-]\s*$/.test(t.slice(Math.max(0,i-4),i))&&!UNIT.test(t.slice(end))&&!/^\s*%/.test(t.slice(end)))return true;   // second number of a range                    // 21st century
  const sent=t.slice(0,i).split(/[.!?]\s/).pop();                    // text before it, same sentence
  const AGE=/\b(aged?|ages|age groups?|under|over|below|above|younger than|older than|those aged|people aged)\b/gi;let k,last=-1,lastEnd=-1;
  while((k=AGE.exec(sent))){last=k.index;lastEnd=k.index+k[0].length}
  // a number that comes straight after an age word, or in a chain: aged 15 to 64 / 15–24 and 25–34 / 0-14, 15-64 and 65
  if(last>=0&&/^[\s\d,–\-+]*((\band\b|\bto\b|\bor\b|,)[\s\d,–\-+]*)*$/i.test(sent.slice(lastEnd)))return true;
  // age words AFTER the number: 65+ · 65 and over · 15–24 age group · 15 years old · 25-34 year olds
  if(/^\s*(?:(?:[-–]|\bto\b|\band\b|\bor\b|,)\s*\d+\s*)*(\+|(?:years?[- ]olds?|years of age|age[- ]?groups?|groups?|age bracket|and (?:over|above|older|under|below|younger)|or (?:over|above|older|under|below|younger)))/i.test(after))return true;

    const pre=t.slice(Math.max(0,i-16),i);
    if(!/\b(by|from|to|at|reached|reaching|of|around|about|approximately|roughly|nearly|just|than|rose|fell|dropped|grew|reaches|stood|stands)\s+$/i.test(pre)&&!/\bbetween\s+\d+\s+and\s+$/i.test(pre))return true}

function hasFig(t){const re=/\d+(?:[.,]\d+)*%?/g;let m;while((m=re.exec(t))){if(!numOK(t,m))return true}return false}
function splitOv(t){const ss=sentences(t);return ss}
function ovAnalyze(text,g,opt){
  opt=opt||{};

  const mss=sentences(g.model),m1=mss[0]?mss[0].txt:"",m2=mss[1]?mss[1].txt:"";
  if(t.split(/\s+/).length<8)return {ok:false,items:[{kind:"structure",msg:"Write the two sentences of the overview: Overall, … It is also clear that …",fix:"Overall, + general trends. It is also clear that + detail.",why:"An overview has two sentences."}],praise:[],hard:1};
  // ---- structure ----
  const wb=/what stands? out/i.exec(t);
  if(wb)add("structure",wb.index,wb[0].length,"Do not begin with ‘What stands out from the graph is that…’.","Overall, + the general trends","Start with Overall, and give the information directly. This phrase wastes words and examiners see it in thousands of scripts.");

  if(!starts&&!wb){const w=(s1.match(/^\S+/)||[""])[0];add("structure",ss[0]?ss[0].i:0,w.length,"Sentence 1 must begin with “Overall,”.","Overall, + what happened to every item (up, down or stable)","Formula: Sentence 1 = Overall, + general trends.")}
  if(/^overall\s+(?!,)/i.test(s1))add("grammar",0,7,"Put a comma after “Overall”.","Overall,","A linking word at the start of a sentence is followed by a comma.");
  if(ss.length<2)add("structure",Math.max(0,t.length-1),1,"Write a second sentence: It is also clear that + one or two complementary details.","It is also clear that + biggest change / size / what stands out","Formula: Sentence 2 = complementary detail.");
  else{
    if(!/^it is also (clear|noticeable|evident|apparent|notable|obvious)\s+that\b/i.test(s2))add("structure",ss[1].i,Math.min(s2.length,24),"Sentence 2 should begin “It is also clear that”.","It is also clear that + biggest change / size / what stands out","Use the formula from 5.1 so the detail is clearly separate from the trends.");
    if(ss.length>2)items.push({kind:"style",i:ss[2].i,len:Math.min(ss[2].txt.length,30),msg:"An overview is two sentences. Cut the third one.",fix:"keep the trends and ONE or TWO details",why:"More sentences usually means minor details and numbers."});
  }

    else{
      const nm={U:"rose / increased",D:"fell / decreased",S:"stayed the same"};
      for(const k of ["U","D"]){
        if(md.has(k)&&!sd.has(k))add("facts",ss[0].i,0,"Check the graph again: some items "+(k==="U"?"went UP":"went DOWN")+", but your first sentence does not say so.","include a verb like ‘"+nm[k]+"’","Sentence 1 must cover EVERY line, bar or row, not just one trend.");
        else if(!md.has(k)&&sd.has(k)&&!/fluctuat|vari(?:ed|ation)|ups and downs/i.test(m1)){const mm=k==="U"?(()=>{UP.lastIndex=0;UP2.lastIndex=0;return UP.exec(s1)||UP2.exec(s1)})():(()=>{DOWN.lastIndex=0;DOWN2.lastIndex=0;return DOWN.exec(s1)||DOWN2.exec(s1)})();
          add("facts",mm?ss[0].i+mm.index:ss[0].i,mm?mm[0].length:5,"Check the direction: according to the graph nothing "+(k==="U"?"went UP":"went DOWN")+" overall.","look at the first and last point of each line/bar","The verb must match the graph: this is part of Task Achievement (accuracy).")}}
      if(md.has("S")&&/\b(unchanged|same level|stayed the same|remained (?:stable|unchanged|constant|almost)|no change|stable)\b/i.test(m1)&&!sd.has("S"))items.push({kind:"style",i:ss[0].i,len:0,msg:"One item stayed the same on the graph. Mention it too.",fix:"…, while X remained stable / unchanged",why:"Every item should appear in the general trends."})}
  }
  // names need capital letters
  for(const w of String(g.ent||"").split("|")){if(!/^[A-Z][a-z]+(?: [A-Z][a-z]+)*$/.test(w))continue;
    const lo=new RegExp("\\b"+w.toLowerCase()+"\\b","g");let mm2;while((mm2=lo.exec(t))){if(t.slice(mm2.index,mm2.index+w.length)===w)continue;add("grammar",mm2.index,w.length,"Names of countries and places start with a capital letter.",w,"Capital letters: Finland, the United States, Sweden.")}}

  if(s2){
    const entRe=new RegExp("\\b(?:"+(g.ent||"zzzzz")+")","i");
    if(!DET.test(s2)&&!entRe.test(s2))add("structure",ss[1].i,0,"Sentence 2 needs a complementary detail.","the biggest (or smallest) change · the size of the changes · what stands out (highest, overtook, the gap)","Look for: which item changed most? Which is always higher? Did one overtake another?");
  }
  // ---- names covered in S1 (tip) ----
  // ---- praise ----
  if(starts)praise.push("Sentence 1 begins with “Overall,” as in the formula.");
  if(!hasFig(t)&&ss.length>=2)praise.push("No figures: it is a true overview.");
  if(!items.some(x=>x.kind==="facts"&&/direction|went/.test(x.msg))&&ss.length)praise.push("Your trends match the graph.");
  if(s2&&!items.some(x=>x.msg.startsWith("Sentence 2")))praise.push("Sentence 2 adds a complementary detail.");
  // ---- language ----
  const gr=grammarCheck(t),sp=spellCheck(t),st=styleCheck(t);
  items.push(...gr,...sp.filter(x=>!gr.some(y=>y.i===x.i)),...st.filter(x=>!(x.msg&&/very long/.test(x.msg)&&false)));
  if(!gr.length&&!sp.some(x=>x.hard))praise.push("No grammar errors found in the rules I check.");
  if(/\b(whereas|while|although|however|in contrast|by contrast)\b/i.test(t))praise.push("Nice linking words.");

/* ---- introductions ---- */
const PRES=/\b(show|shows|illustrate|illustrates|compare|compares|give|gives|present|presents|depict|depicts|display|displays|provide|provides|outline|outlines|summari[sz]es?|indicate|indicates|represent|represents|detail|details|describe|describes|track|tracks|reveal|reveals)\b/i;
const TYPES={line:[/\bline (graph|chart)s?\b/i,"line graph"],bar:[/\bbar (chart|graph)s?\b/i,"bar chart"],table:[/\btables?\b/i,"table"],pie:[/\bpie (chart|graph)s?\b/i,"pie chart"]};
function runLen(a,b){ // longest common run of words
  const x=(norm(a).match(/[a-z0-9]+/g)||[]),y=(norm(b).match(/[a-z0-9]+/g)||[]);let best=0;
  for(let i=0;i<x.length;i++)for(let j=0;j<y.length;j++){let k=0;while(i+k<x.length&&j+k<y.length&&x[i+k]===y[j+k])k++;if(k>best)best=k}
  return best}
function introAnalyze(text,g){
  const t=text.trim(),items=[],praise=[];
  const add=(kind,i,len,msg,fix,why)=>items.push({kind,i,len,msg,fix,why});
  if(t.split(/\s+/).length<7)return {ok:false,items:[{kind:"structure",msg:"Write a full introduction sentence.",fix:"The "+TYPES[g.type][1]+" shows … in … between … and …",why:"Introduction = type of graph + presenting verb + what + where + when."}],praise:[],hard:1};
  const ss=sentences(t);
  if(ss.length>1)items.push({kind:"style",i:ss[1].i,len:Math.min(20,ss[1].txt.length),msg:"The introduction is one sentence.",fix:"Keep to one sentence: type + verb + what + where + when",why:"Details belong in the overview and body paragraphs."});
  // type of graph
  const own=TYPES[g.type];
  if(!own[0].test(t)){
    const other=Object.keys(TYPES).filter(k=>k!==g.type&&TYPES[k][0].test(t))[0];
    if(other){const mm=TYPES[other][0].exec(t);add("facts",mm.index,mm[0].length,"This is a "+own[1]+", not a "+TYPES[other][1]+".","The "+own[1]+(g.type==="pie"||g.type==="line"&&false?"s":"")+" shows …","Name the correct type of graph. Check the picture.")}
    else add("structure",0,Math.min(12,t.length),"Name the type of graph.","The "+own[1]+" shows …","Introduction = type of graph + presenting verb + what + where + when.")}
  if(!PRES.test(t))add("structure",0,Math.min(14,t.length),"Use a presenting verb: shows, illustrates, compares, gives information about.","The "+own[1]+" illustrates …","You must tell the reader what the graph does, using a verb.");
  // years
  const need=(g.intro.match(/\b(19|20)\d\d\b/g)||[]);
  const have=(t.match(/\b\d{4}\b/g)||[]);
  const miss=need.filter(y=>!have.includes(y));
  if(miss.length)add("facts",Math.max(0,t.length-1),1,"Add the time period: "+miss.length+" year"+(miss.length>1?"s":"")+" missing (check the title).","… between YEAR and YEAR / in YEAR and YEAR","The time is part of the introduction.");
  const re=/\d+(?:[.,]\d+)*%?/g;let m;
  while((m=re.exec(t))){if(numOK(t,m))continue;add("facts",m.index,m[0].length,"No figures in an introduction.","just the time period (years)","Figures come later, in the detail paragraphs.")}
  const extra=have.filter(y=>!need.includes(y));
  for(const y of extra){const i=t.indexOf(y);add("facts",i,4,"The year "+y+" is not in the title. Check it.","use the years from the title","Accuracy: only use the time period shown.")}

  if(runLen(t,g.title)>=10)add("structure",0,Math.min(t.length,30),"You copied the title. Paraphrase it with different words.","e.g. share → proportion / percentage · six countries → six nations","The introduction must be a paraphrase, not a copy.");

    r.onset=v=>{const p=String(v||"").split("|");ins.forEach((x,k)=>{x.value=p[k]||""});if(!v)r.paint("")};
    const upd=()=>{r.ta.value=ins.map(x=>x.value).join("|");if(!ins.some(x=>x.value.trim()))r.ta.value=""};
    ins.forEach(x=>{x.addEventListener("input",()=>{upd();ST.saved[r.key]=r.ta.value;if(r.ok){setOk(r,false)}r.paint("");r.fb.className="fb";save()});
      x.addEventListener("change",()=>{upd();ST.saved[r.key]=r.ta.value;if(ins.every(y=>y.value.trim()))runSel(r,true)});
      x.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();upd();if(ins.every(y=>y.value.trim()))runSel(r,true)}})})})}
/* write items with the comparative checker; optional graph above each item */
function cwriteItems(si,ui,host,b){
  const card=cardOf(b);const regs0=REG.length;
  if(b.worked){const w=document.createElement("div");w.className="wk";w.innerHTML='<span class="l">Worked example</span><br>'+b.worked[0]+"<br><b>→</b> "+b.worked[1];card.appendChild(w)}
  b.items.forEach((q,i)=>{
    const d=document.createElement("div");d.className="q";
    const gr=q.g&&b.graphs!==false?'<div class="qg">'+DATA.GR[q.g].svg+'<div class="qgc">'+esc(DATA.GR[q.g].title)+" · "+esc(DATA.GR[q.g].unit)+"</div></div>":"";
    d.innerHTML='<div class="p"><span class="num">'+(i+1)+".</span>"+(q.tag?'<span class="tg">'+q.tag+"</span> ":"")+q.p+"</div>"+gr+
      mkInput({key:b.key+"_"+i,step:si,unit:ui,rows:b.rows||2,model:q.model+(q.why&&b.modelWhy?"  (Mistake: "+q.why.replace(/<[^>]+>/g,"")+")":""),prompt:plain(q.p),hint:q.hint||(q.st?fchips8(q.st):"Write one clear sentence."),ph:q.ph,check:t=>c8analyse(t,q)});
    card.appendChild(d)});
  card.appendChild(blockBar(REG.slice(regs0)));host.appendChild(card)}
/* learn: the seven structures */
function learn8Unit(si,ui,host){
  const card=document.createElement("div");card.className="card";
  card.innerHTML='<div class="nums" id="lnums"></div><div id="lpanel"></div>';host.appendChild(card);
  const nums=card.querySelector("#lnums");const keys=[1,2,3,4,5,6,7];
  nums.innerHTML=keys.map(n=>'<button class="sub" data-n="'+n+'">'+n+"</button>").join("");
  const panels={};
  keys.forEach(n=>{const S=DATA.STR[n];const div=document.createElement("div");div.style.display="none";
    const egs=S.story.map(x=>'<div class="eg"><span class="tg">Story</span><span>'+x+"</span></div>").join("")+S.real.map(x=>'<div class="eg real"><span class="tg">Real graph</span><span>'+x+"</span></div>").join("");
    div.innerHTML='<div class="lhd"><div class="big">'+n+'</div><h3>'+S.t+'</h3></div><div class="chiprow">'+DATA.CHIPS[n].map(c=>'<span class="chip '+c[1]+'">'+esc(c[0])+"</span>").join("")+'</div>'+
      '<div class="legend"><span><i style="background:var(--chipSt)"></i>item / data</span><span><i style="background:var(--chipVt)"></i>comparative</span><span><i style="background:var(--chipLt)"></i>key linking words</span><span><i style="background:var(--chipNt)"></i>second item + data</span></div>'+
      '<div class="two"><div>'+egs+'<div class="rule"><b>Rule.</b> '+S.rule+'</div><div class="trap"><b>Trap.</b> '+S.trap+'</div></div>'+
      '<div><div class="gbox">'+DATA.GR[S.g].svg+'</div><div class="gcap">'+esc(DATA.GR[S.g].title)+" ("+esc(DATA.GR[S.g].unit)+')</div></div></div>'+
      '<div class="yourturn"><h4>Your turn · write your own Structure '+n+' sentence</h4><div class="p" style="margin:0 0 6px">'+S.turn.p+'</div><div class="qg">'+DATA.GR[S.turn.g].svg+'<div class="qgc">'+esc(DATA.GR[S.turn.g].title)+" · "+esc(DATA.GR[S.turn.g].unit)+"</div></div>"+
      mkInput({key:"turn"+n,step:si,unit:ui,counted:false,model:S.turn.model,prompt:plain(S.turn.p),hint:fchips8(n),check:t=>c8analyse(t,S.turn)})+"</div>";
    card.querySelector("#lpanel").appendChild(div);panels[n]=div});
  const show=n=>{ST.seen[n]=1;[...nums.querySelectorAll(".sub")].forEach(b=>{b.classList.toggle("on",+b.dataset.n===n);b.classList.toggle("seen",!!ST.seen[b.dataset.n])});for(const k in panels)panels[k].style.display=+k===n?"":"none";save()};
  nums.onclick=e=>{const b=e.target.closest(".sub");if(b)show(+b.dataset.n)};
  card._show=show;setTimeout(()=>show(1),0)}

window.__lab={REG:REG};
/* ---------- page ---------- */
function build(){
  document.title=CH.title.replace(/<[^>]+>/g,"")+" · "+CH.kicker+" · Mr Ikromov's IELTS";
  document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header>'+
    '<nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">'+(CH.footer||"")+'</div><div id="toast"></div>';
  const nav=$("#steps"),main=$("#main");
  CH.steps.forEach((s,si)=>{
    nav.insertAdjacentHTML("beforeend",'<button class="step" id="st'+si+'" data-i="'+si+'"><span class="no">'+s.no+"</span>"+s.name+' <span class="ct"></span></button>');
    const sec=document.createElement("section");sec.className="sec";sec.id="sec"+si;sec.style.display="none";
    sec.innerHTML='<div class="sec-title"><span class="n">'+s.no+"</span><h2>"+s.title+"</h2></div>"+(s.lead?'<p class="lead">'+s.lead+"</p>":"")+(s.note?'<div class="note">'+s.note+"</div>":"");
    main.appendChild(sec);
    // units: each shown on its own (sub menu) when the step has more than one
    const units=[];
    for(const b of s.blocks){
      if(b.type==="html")units.push({label:b.tab||"Info",render:(ui,h)=>{const c=document.createElement("div");c.innerHTML=b.html;h.appendChild(c)}});
      else if(b.type==="learn8")units.push({label:b.label||"Learn",render:(ui,h)=>learn8Unit(si,ui,h)});
      else if(b.type==="cwrite")units.push({label:b.label,render:(ui,h)=>cwriteItems(si,ui,h,b)});
      else if(b.type==="pick")units.push({label:b.label,render:(ui,h)=>pickUnit(si,ui,h,b)});
      else if(b.type==="gaps")units.push({label:b.label,render:(ui,h)=>gapUnit(si,ui,h,b)});
    }
    s._units=units;
    const tabs=units.filter(u=>!u.inline);
    const sub=document.createElement("div");sub.className="subnav";if(s.subnav&&tabs.length>1)sec.appendChild(sub);
    const host=document.createElement("div");sec.appendChild(host);
    units.forEach((u,ui)=>{const box=document.createElement("div");box.className="unit";box.dataset.u=ui;u.render(ui,box);host.appendChild(box);u.box=box;
      if(s.subnav&&!u.inline&&tabs.length>1)sub.insertAdjacentHTML("beforeend",'<button class="sub" id="u'+si+'_'+ui+'" data-u="'+ui+'">'+esc(u.label)+" <small></small></button>")});
    if(s.subnav&&tabs.length>1){sub.onclick=e=>{const b=e.target.closest(".sub");if(b)showUnit(si,+b.dataset.u,true)}}
    const nb=document.createElement("div");nb.className="nextbar";
    nb.innerHTML=(si>0?'<button class="btn ghost" data-go="'+(si-1)+'">← '+CH.steps[si-1].name+"</button>":"<span></span>")+(si<CH.steps.length-1?'<button class="btn go" data-go="'+(si+1)+'">Next: '+CH.steps[si+1].name+" →</button>":'<span class="wc">This is the last step. Check your progress at the top.</span>');
    nb.onclick=e=>{const b=e.target.closest("[data-go]");if(b){showStep(+b.dataset.go);window.scrollTo(0,0)}};sec.appendChild(nb);
  });
  nav.onclick=e=>{const b=e.target.closest(".step");if(b){showStep(+b.dataset.i);window.scrollTo(0,0)}};
  bindInputs();
}
function showUnit(si,ui,scroll){const s=CH.steps[si];if(!s.subnav)return;ST.unit[si]=ui;
  s._units.forEach((u,k)=>{if(u.inline)return;u.box.style.display=k===ui?"":"none";const b=$("#u"+si+"_"+k);if(b)b.classList.toggle("on",k===ui)});
  $$("svg.chart",s._units[ui].box).forEach(c=>{c.classList.remove("draw");void c.getBoundingClientRect();c.classList.add("draw")});
  if(scroll){const t=$("#sec"+si);window.scrollTo({top:Math.max(0,t.getBoundingClientRect().top+window.scrollY-70)})}save()}
function showStep(si){ST.step=si;CH.steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});
  const b=$("#st"+si);if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"center"});
  const s=CH.steps[si];if(s.subnav)showUnit(si,Math.min(ST.unit[si]||0,s._units.length-1),false);save()}
function applyState(){
  for(const r of REG){const v=ST.saved[r.key];if(v==null||!r.ta)continue;r.ta.value=v;if(r.onset)r.onset(v);r.tries=ST.tries[r.key]||0;
    if(r.kind==="select"){if(v)runSel(r,false)}else{r.wc();if(ST.ok[r.key]){r.ta.className="ok";setOk(r,true)}}}
  showStep(Math.min(ST.step||0,CH.steps.length-1));progress();sendTexts()}

build();
// load saved progress: from the site (in the frame) or from this browser
let got=false;
window.addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="ielts-lab-state"||d.id!==CH.id)return;if(d.theme)setTheme(d.theme);if(!got){got=true;restore(d.data);if(!d.data)fallback()}});
function fallback(){try{restore(localStorage.getItem("ielts-lab:"+CH.id))}catch(e){}}
showStep(0);progress();
if(inFrame){try{parent.postMessage({type:"ielts-lab-load",id:CH.id},"*")}catch(e){}setTimeout(()=>{if(!got){got=true;fallback()}},900)}else{got=true;fallback()}
})();


</script>
