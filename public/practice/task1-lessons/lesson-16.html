<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson 16 · Introductions and Overviews for Processes · Writing Task 1 · Mr Ikromov's IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Writing Lab — shared look for every chapter (2026-11-07).
   Same colours, shapes and fonts as ieltswithmrikromov.com:
   lapis-to-turquoise band, Unbounded headings, Nunito Sans text,
   rounded rectangles only (12 / 14 / 20 / 28 px), one saffron button. */
:root{
  --ink:#f6f5f1;--panel:#fff;--panel2:#efede6;--line:#e3dfd4;--paper:#17213a;--dim:#3a4560;--mist:#55607a;
  --brass:#2456b0;--onbrass:#fff;--sage:#13807c;--sageT:#e2f2f0;--coral:#b23a48;--coralT:#f8e1e4;--amber:#9a5b12;--amberT:#fbefd9;
  --saffron:#e6a33a;--onsaffron:#17213a;--band:#22489a;
  --chipS:#dfe8fb;--chipSt:#1f4aa0;--chipV:#fbe0e6;--chipVt:#a02a44;--chipL:#fdf0d2;--chipLt:#8a5a0c;--chipN:#dcf3ef;--chipNt:#0f6b66;
  --mark:#fff2b3;--shadow:0 1px 2px rgba(23,33,58,.06),0 6px 18px -10px rgba(23,33,58,.18);
  --gUp:#13807c;--gDown:#b23a48;--gMix:#1f3a75;--g2:#c4622d;--grid:#e8e4da;--gtext:#55607a;
}
:root[data-theme="dark"]{
  --ink:#0f1626;--panel:#172036;--panel2:#1e2944;--line:#2b3858;--paper:#eef0f6;--dim:#c6ccda;--mist:#a3abbf;
  --brass:#7fa6f2;--onbrass:#0f1626;--sage:#7fd6d2;--sageT:#123a3c;--coral:#f29aa6;--coralT:#3e1c22;--amber:#f2c07a;--amberT:#3a2a12;
  --saffron:#f0b95a;--band:#1b3570;
  --chipS:#22335c;--chipSt:#b9cdf7;--chipV:#4a2230;--chipVt:#f5b8c6;--chipL:#453512;--chipLt:#f6d48b;--chipN:#153f3d;--chipNt:#9de3dc;
  --mark:#5a4a12;--shadow:none;
  --gUp:#5fd0c6;--gDown:#f08a99;--gMix:#a9bdf0;--g2:#f2a76b;--grid:#2b3858;--gtext:#a3abbf;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Unbounded,"Nunito Sans",system-ui,sans-serif;letter-spacing:-.01em}
b,strong{font-weight:800}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- band ---- */
.band{color:#fff;background:var(--band);background-image:linear-gradient(115deg,var(--band) 0%,#1f6fae 55%,#1a9bb5 100%);border-radius:0 0 28px 28px;padding:22px 0 20px}
.band .kick{font-size:13px;font-weight:800;opacity:.9;letter-spacing:.02em}
.band h1{margin:6px 0 6px;font-size:28px;line-height:1.15;font-weight:600}
.band p{margin:0;max-width:760px;font-size:15px;opacity:.92}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1;max-width:360px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:999px;transition:width .4s}
.prog b{font-size:14px;white-space:nowrap}

/* ---- step menu ---- */
.steps{position:sticky;top:0;z-index:20;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.steps .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.steps .row::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px}
.step .no{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--panel2);font-size:12px}
.step .ct{font-size:12px;color:var(--mist);font-weight:700}
.step.on{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.step.on .no{background:rgba(255,255,255,.22)}.step.on .ct{color:inherit;opacity:.85}
.step.full .ct{color:var(--sage)}.step.on.full .ct{color:inherit}

main{padding:20px 0 40px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.sec-title h2{margin:0;font-size:21px;font-weight:600}
.sec-title .n{font-family:Unbounded,sans-serif;font-size:13px;color:var(--brass);font-weight:600}
.lead{color:var(--dim);margin:0 0 14px;font-size:15px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600}
.card .ins{color:var(--dim);font-size:14px;margin-bottom:12px}
.note{border-radius:14px;background:var(--panel2);padding:12px 14px;font-size:14.5px;color:var(--dim);margin:0 0 16px}
.note b{color:var(--paper)}

/* ---- sub menu (structures, drills) ---- */
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sub{border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:6px 11px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.sub small{color:var(--mist);font-weight:700}
.sub.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass)}
.sub.full small{color:var(--sage)}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nums .sub{min-width:42px;justify-content:center;font-family:Unbounded,sans-serif;font-weight:600}
.nums .sub.seen:not(.on){background:var(--panel2)}

/* ---- learn panel ---- */
.lhd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lhd .big{font-family:Unbounded,sans-serif;font-size:30px;font-weight:600;color:var(--brass);line-height:1}
.lhd h3{font-size:17px;margin:0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.chip{border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px;white-space:pre}
.chip.s{background:var(--chipS);color:var(--chipSt)}.chip.v{background:var(--chipV);color:var(--chipVt)}
.chip.l{background:var(--chipL);color:var(--chipLt)}.chip.n{background:var(--chipN);color:var(--chipNt)}
.chip.p{padding:4px 2px;color:var(--mist)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mist);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.eg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.eg .tg{flex:0 0 auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);background:var(--panel2);border-radius:8px;padding:2px 7px;height:fit-content;margin-top:2px}
.eg.real .tg{background:var(--sageT);color:var(--sage)}
.eg b{background:var(--chipL);color:var(--chipLt);border-radius:6px;padding:0 3px}
.rule,.trap{border-radius:14px;padding:11px 13px;font-size:14.5px;margin-top:10px}
.rule{background:var(--sageT)}.rule>b:first-child{color:var(--sage)}
.trap{background:var(--coralT)}.trap>b:first-child{color:var(--coral)}
.trap s{color:var(--coral)}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.gcap{font-size:13px;color:var(--mist);margin:6px 2px 0}
.gmodel{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:14.5px;margin-top:8px}
.replay{margin-top:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:5px 11px;font-weight:800;font-size:13px}
.yourturn{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.yourturn h4{margin:0 0 8px;font-size:15px;color:var(--sage)}

table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.t th{text-align:left;background:var(--panel2);padding:9px 12px;font-weight:800}
.t td{padding:9px 12px;border-top:1px solid var(--line)}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mist .x,.mist .v{border-radius:14px;padding:10px 12px;font-size:14.5px}
.mist .x{background:var(--coralT)}.mist .x s{color:var(--coral)}
.mist .v{background:var(--sageT)}

/* ---- charts ---- */
svg.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--gtext);font-size:11px;font-family:"Nunito Sans",system-ui,sans-serif}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .lbl{font-size:11.5px;font-weight:800;font-family:"Nunito Sans",system-ui,sans-serif}
.chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.3s ease-out forwards}
@keyframes dl{to{stroke-dashoffset:0}}
.chart .key{font-size:11.5px;font-weight:700;fill:var(--paper);font-family:"Nunito Sans",system-ui,sans-serif}

/* ---- graph exercise cards ---- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.gcard .gt{font-weight:800;font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gcard .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--panel2);color:var(--mist);border-radius:8px;padding:2px 7px}
.gcard .gt span{font-weight:600;color:var(--mist);font-size:13px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-size:15px;margin-bottom:8px}
.q .p .num{font-weight:800;color:var(--brass);margin-right:6px}
.q .p .tg{display:inline-block;font-size:11px;font-weight:800;background:var(--chipS);color:var(--chipSt);border-radius:8px;padding:1px 7px;margin-right:4px}
.q .p .sm{font-size:13px;color:var(--mist)}
.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:14.5px;margin-bottom:6px}
.wk .l{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}
select.sel{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--paper);min-width:150px}
select.sel.ok{border-color:var(--sage);background:var(--sageT)}select.sel.no{border-color:var(--coral);background:var(--coralT)}

/* ---- input + coach ---- */
.iw{margin-top:6px}
.iw .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--paper);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:62px;outline:none}
textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:8px 16px;font-weight:800;font-size:14px;background:var(--brass);color:var(--onbrass)}
.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:12.5px;color:var(--mist)}
.done-tag{font-size:12.5px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:14px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.fb.on{display:block}
.fb .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px}
.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:12px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:15px;line-height:1.7;margin-bottom:6px}
.ann mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--amber)}
.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:14.5px}
.it .k{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}
.tryit{margin-top:3px;font-weight:800;color:var(--sage)}
.why{margin-top:2px;color:var(--mist);font-size:13.5px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:14.5px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.blockbar .score{font-weight:800;color:var(--dim);font-size:14px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.foot{color:var(--mist);font-size:12.5px;text-align:center;padding:10px 18px 30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);font-weight:800;border-radius:14px;padding:9px 16px;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .band{padding:16px 0 16px;border-radius:0 0 20px 20px}
  .band h1{font-size:22px}
  .band p{font-size:14px}
  .two,.ggrid,.mist{grid-template-columns:1fr}
  .card{padding:14px}
  .step{padding:7px 11px;font-size:13px}
  .sec-title h2{font-size:18px}
  .chip{font-size:13px}
}
@media print{.steps,.irow,.blockbar,.nextbar{display:none}.sec{display:block!important}}


/* ---- Lesson 5 additions ---- */
.gimg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.gimg img{max-width:100%;height:auto;max-height:360px}
.ovl{display:grid;grid-template-columns:1fr;gap:16px}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.ovc .gt{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ovc .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--brass);color:var(--onbrass);border-radius:8px;padding:2px 8px}
.ovc .gt span{font-weight:600;color:var(--mist);font-size:12.5px}
.phr{border-radius:14px;background:var(--amberT);padding:9px 12px;margin:10px 0 4px;font-size:13.5px}
.phr b{color:var(--amber);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.phr i{font-style:normal;font-weight:700;display:inline-block;margin:2px 4px 2px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.clue{font-size:13.5px;color:var(--dim);margin:2px 0 6px}
.clue u{text-decoration:none;font-weight:800;color:var(--paper)}
.step3{display:grid;grid-template-columns:1fr;gap:0}
.iw+.iw{margin-top:12px}
.iw .lab.i{color:#6d4bc2}.iw .lab.t{color:var(--brass)}.iw .lab.d{color:var(--amber)}.iw .lab.o{color:var(--sage)}
:root[data-theme="dark"] .iw .lab.i{color:#c3b0f5}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sent{border-radius:14px;padding:12px 14px;font-size:15px}
.sent .st{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.sent.s1{background:var(--chipS);border:1px solid color-mix(in srgb,var(--chipSt) 35%,transparent)}.sent.s1 .st{color:var(--chipSt)}
.sent.s2{background:var(--amberT);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent)}.sent.s2 .st{color:var(--amber)}
mark.t{background:var(--mark);color:inherit;border-radius:5px;padding:0 3px}
mark.d{background:#ffd9a8;color:#3a2a12;border-radius:5px;padding:0 3px}
:root[data-theme="dark"] mark.d{background:#6a4513;color:#fbe4c4}
.legend2{font-size:13px;color:var(--mist);margin:10px 0}
.stp{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;margin:0 0 8px}
.stp b.n{flex:0 0 auto;font-family:Unbounded,sans-serif;font-size:12px;border-radius:9px;padding:4px 9px;color:#fff;background:var(--brass)}
.stp b.n.d{background:#b7791f}
.stp em{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;color:var(--mist);white-space:nowrap}
ul.kf{list-style:none;margin:6px 0 10px;padding:0;font-size:14.5px}
ul.kf li{margin:3px 0}
ul.kf b.tg{display:inline-block;min-width:54px;text-align:center;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:7px;padding:1px 6px;margin-right:6px;color:#fff;background:var(--brass)}
ul.kf b.tg.d{background:#b7791f}
.exh{font-weight:800;font-size:15px;margin:0 0 6px}
.exov{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:15px;line-height:1.6}
.phg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phg h4{margin:0 0 6px;font-size:14px}
.phg .eg{padding:8px 0}
.q .sel{margin-top:2px}
.why5{border-radius:12px;background:var(--panel2);padding:8px 11px;font-size:14px;margin-top:8px}
@media (max-width:760px){.sc,.phg{grid-template-columns:1fr}.stp em{display:none}}
.gfig{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--panel)}
.gfig-t{font-weight:800;font-size:13.5px;margin-bottom:2px}.gfig-u{font-size:12px;color:var(--mist)}
.gref{color:var(--mist);font-size:12.5px;font-weight:600}
.qg{border:1px solid var(--line);border-radius:12px;padding:6px 10px 4px;margin:6px 0 8px;background:var(--panel);max-width:560px}
.qg svg{display:block}.qgc{font-size:12px;color:var(--mist);margin-top:2px}
.gbox svg{display:block}
.chip.s,.chip.v,.chip.l,.chip.n{white-space:pre-wrap}
.gapgrid{display:grid;grid-template-columns:1fr;gap:0}
.q.g .p{line-height:2.1}
input.gap{font:inherit;border:0;border-bottom:2px solid var(--line);background:transparent;color:inherit;text-align:center;padding:0 2px;margin:0 3px;outline:none;border-radius:4px 4px 0 0}
input.gap:focus{border-bottom-color:var(--brass);background:var(--panel2)}
input.gap.ok{border-bottom-color:var(--sage);background:var(--sageT)}
input.gap.no{border-bottom-color:var(--coral);background:var(--coralT)}
.clue{font-size:13.5px;color:var(--dim);margin:6px 0 0}
.jobs td:first-child{font-weight:700}

const CHAPTER={"id": "wt1-lesson16", "kicker": "Writing Task 1 · Lesson 16", "title": "Introductions and <span style=\"color:#ffd27a\">overviews for processes</span>", "lead": "Write the introduction and the overview of a process in the right way: paraphrase the diagram, give the number of stages, name the first and the last stage and add one general point. Practice on eight real process diagrams. The Writing Coach checks the <b>structure</b>, the <b>number of stages</b>, the <b>start and end</b>, the <b>tense</b>, the <b>grammar</b> and the <b>spelling</b>.", "footer": "Mr Ikromov's IELTS · Writing Task 1 · Lesson 16 · Introductions and Overviews for Processes. The Writing Coach is a teaching tool: it finds common mistakes and checks your answer against the diagram, but it is not an examiner. Another logical answer is accepted; compare with the model after you try.", "steps": [{"no": "16.1", "name": "Learn", "title": "The introduction and the overview of a process", "subnav": true, "lead": "One sentence for the introduction, two for the overview, and how to count the stages.", "blocks": [{"type": "html", "tab": "Introduction", "html": "<p class=\"lead\">The <b>introduction</b> is <b>one sentence</b>. It says what the diagram shows. Change the words of the question: do not copy it.</p><div class=\"card\"><div class=\"exh\">Formula</div><div class=\"formula\">The diagram / The pictures + shows / illustrates / depicts + how … is made / the process of …</div><div class=\"eg\"><span class=\"tg\">A</span><span>The diagram <b>illustrates how</b> electricity is <b>produced</b> from coal.</span></div><div class=\"eg\"><span class=\"tg\">B</span><span>The diagram <b>shows the process of building</b> an igloo from snow.</span></div><div class=\"eg\"><span class=\"tg\">C</span><span>The pictures <b>show the steps through which</b> tomato ketchup is <b>produced</b>.</span></div><div class=\"eg\"><span class=\"tg\">D</span><span>The diagram <b>depicts the stages in the production of</b> smoked fish.</span></div></div><div class=\"card\"><div class=\"exh\">Paraphrase the question</div><table class=\"t\"><thead><tr><th>Question says</th><th>Change it to</th></tr></thead><tbody><tr><td>The diagram below <b>shows</b></td><td>The diagram <b>illustrates / depicts / outlines</b> (leave out <i>below</i>)</td></tr><tr><td><b>how</b> X <b>is made</b></td><td><b>the process of making</b> X · <b>how</b> X <b>is produced / manufactured</b></td></tr><tr><td>the <b>production</b> of X</td><td>the <b>stages</b> in the <b>production</b> of X</td></tr><tr><td>The pictures show</td><td>The diagram shows · The illustrations show</td></tr></tbody></table></div><div class=\"card\"><div class=\"exh\">Examples</div><div class=\"eg\"><span class=\"tg\">Question</span><span>The diagram below shows how electricity is produced from coal.</span></div><div class=\"eg\"><span class=\"tg\">Intro</span><span>The diagram illustrates how electricity is produced from coal.</span></div><div class=\"eg\"><span class=\"tg\">Question</span><span>The diagram below shows how an igloo is made out of snow.</span></div><div class=\"eg\"><span class=\"tg\">Intro</span><span>The diagram shows the process of building an igloo from snow.</span></div><div class=\"eg\"><span class=\"tg\">Question</span><span>The pictures below show how tomato ketchup is made.</span></div><div class=\"eg\"><span class=\"tg\">Intro</span><span>The diagram shows the steps through which tomato ketchup is produced.</span></div><div class=\"eg\"><span class=\"tg\">Question</span><span>The diagram below shows how instant noodles are manufactured.</span></div><div class=\"eg\"><span class=\"tg\">Intro</span><span>The diagram illustrates how instant noodles are manufactured.</span></div><div class=\"eg\"><span class=\"tg\">Question</span><span>The pictures below show how plastic bottles are recycled.</span></div><div class=\"eg\"><span class=\"tg\">Intro</span><span>The pictures show how plastic bottles are recycled.</span></div></div><div class=\"note\"><b>Remember:</b> the diagram <b>shows</b> (singular, with -s) · the diagrams <b>show</b>. A process uses the <b>present simple</b>: <i>is made</i>, not <i>was made</i>. No details yet: no <i>first</i>, <i>then</i>, numbers or temperatures.</div>"}, {"type": "html", "tab": "Overview", "html": "<p class=\"lead\">A process overview is <b>two sentences</b>. It has no small details. It tells the reader how big the process is and what it looks like.</p><div class=\"card\"><div class=\"exh\">Four things to say</div><ul style=\"margin:4px 0 4px 18px\"><li><b>1 · How many</b> steps or stages there are.</li><li><b>2 · Divide</b> the steps into stages and name them (for long processes), or say where it <b>starts and ends</b>.</li><li><b>3 · Simple or complex?</b> Does it take much time or equipment?</li><li><b>4 · Machinery or manual?</b> Heavy machinery, special equipment, or people.</li></ul></div><div class=\"card\"><div class=\"exh\">Formula</div><div class=\"formula\">Overall, there are X steps in the process, starting from … and ending with … It is also clear that …</div><div class=\"eg\"><span class=\"tg\">Version 1</span><span>Overall, <b>there are eight stages</b> in the process, <b>starting with</b> the mining of coal and <b>ending with</b> the supply of electricity. <b>It is also clear that</b> waste heat is released twice.</span></div><div class=\"eg\"><span class=\"tg\">Version 2</span><span>Overall, the process <b>consists of / involves / has</b> five main stages, <b>which can be divided into</b> …</span></div></div><div class=\"card\"><div class=\"exh\">Two versions of one overview (bricks)</div><div class=\"eg\"><span class=\"tg\">List in a sentence</span><span>Overall, there are four main stages involved in this process, starting with processing the raw material and this is followed by producing half-ready bricks. After this, these bricks are fired, before the ready product is prepared for selling. Also, the process is a complex one, which requires much time and equipment to complete.</span></div><div class=\"eg\"><span class=\"tg\">Stages as a list</span><span>Overall, there are four main stages in the process: processing the raw material, producing half-ready bricks, firing them and preparing the product for selling. Also, the process is a complex one, which requires much time and equipment to complete.</span></div></div><div class=\"card\"><div class=\"exh\">Plastic bottles</div><div class=\"eg\"><span class=\"tg\">Overview</span><span>Overall, there are three main stages in this process, starting with the initial preparation of plastic bottles, followed by the actual recycling process, and lastly the production of a range of plastic items using the recycled material. While some manual labor is needed, the majority of the job is completed by specialized equipment.</span></div></div><div class=\"note\"><b>Present simple.</b> <i>There are, the process has, it is, the fish are</i>. Do not use <i>was / were</i> for a process.</div>"}, {"type": "html", "tab": "Counting stages", "html": "<p class=\"lead\">How do you count the stages? It depends on the diagram.</p><div class=\"card\"><div class=\"exh\">Three kinds of diagram</div><ul style=\"margin:4px 0 4px 18px\"><li><b>Numbered boxes:</b> count the numbers (igloo 7, fish 8, noodles 8).</li><li><b>Long process (12–15 pictures):</b> give the number and <b>group</b> the steps into 2–3 stages: <i>15 steps in three stages</i>.</li><li><b>Named stages</b> (a landfill: construction, use, closure): count the named stages.</li><li><b>A device</b> (a solar panel): no stages. Say what it is and what it does.</li></ul></div><div class=\"card\"><div class=\"exh\">Seven real overviews</div><table class=\"t\"><thead><tr><th>Process</th><th>How many</th><th>Starts with</th><th>Ends with</th><th>Extra point</th></tr></thead><tbody><tr><td>Coal</td><td>eight stages</td><td>mining of coal</td><td>supply of electricity to homes and factories</td><td>waste heat is released at two points</td></tr><tr><td>Igloo</td><td>seven stages</td><td>cutting blocks of snow</td><td>making air holes inside</td><td>the finished structure is a dome built entirely from snow</td></tr><tr><td>Smoked fish</td><td>eight stages</td><td>gutting the fish</td><td>packing and delivering</td><td>first prepared, then smoked and colored, finally packed</td></tr><tr><td>Landfill</td><td>three stages</td><td>construction</td><td>closure</td><td>layers protect the rock; liquid and gas are collected</td></tr><tr><td>Soft cheese</td><td>five stages</td><td>mixing milk and water</td><td>cooling the cheese</td><td>about a day; waste water is removed before the last stage</td></tr><tr><td>Ketchup</td><td>15 steps, three stages</td><td>picking tomatoes</td><td>labeling and distributing</td><td>rather simple, no heavy machinery</td></tr><tr><td>Noodles</td><td>eight steps, three stages</td><td>preparing dough</td><td>packaging the product</td><td>moderately complex, heavy machinery, no human involvement</td></tr></tbody></table></div><div class=\"note\"><b>Another correct count is accepted</b> if it is logical (for example, seven or nine stages for the coal diagram). Name the first and the last stage.</div>"}, {"type": "html", "tab": "Real diagrams", "html": "<p class=\"lead\">Three real diagrams, with the introduction and the overview.</p><div class=\"card\"><div class=\"exh\">How an igloo is made out of snow</div><div class=\"gimg\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAGJAvgDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAUBAgMEBgcI/8QAWhAAAQMDAgMDBwYKBAkKBgMBAQACAwQFERIhBjFBE1FhBxQiMnGBkRUWUqGx0SNCVVZicpKywdIkM3SCNDU2Q1NzlaLhFyVERWN1hJOj8CZUg7PC8Sc3pOL/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/xAAsEQEBAAIBBAEDBAEEAwAAAAAAAQIREgMhMVFBBBMUBSJSkXEjYYHwM ess was divided into seven stages.", "^(?!.*\\b(?:was|were)\\b)(?=.*\\bseven\\b)", "Overall, the process is divided into seven stages. / Overall, there are seven stages."], ["Overall, first blocks are cut, then they are arranged in a circle, next rows are built on top. (Give the number of stages instead: seven, from cutting blocks to making air holes.)", "\\b(?:seven|7)\\s+(?:main\\s+)?(?:stages|steps)\\b", "Overall, building an igloo involves seven stages, beginning with cutting blocks of snow and ending with making air holes inside."], ["Overall, there are some stages in the production of smoked fish. (Say the exact number: the diagram has eight.)", "\\b(?:eight|8)\\s+(?:main\\s+|distinct\\s+)?(?:stages|steps)\\b", "Overall, the process has eight stages."], ["The diagram below shows the production of smoked fish. (Paraphrase it: do not copy the question.)", "^(?!.*\\bbelow\\b)(?=.*\\b(?:illustrates|depicts|shows|presents|outlines)\\b)(?=.*\\b(?:process|stages|steps|how)\\b)", "The diagram illustrates the process of producing smoked fish."]]};
const D={"gmeta": {}, "texts": ["The introduction is one sentence. It says what the diagram shows. Change the words of the question: do not copy it.FormulaThe diagram / The pictures + shows / illustrates / depicts + how … is made / the process of …AThe diagram illustrates how electricity is produced from coal.BThe diagram shows the process of building an igloo from snow.CThe pictures show the steps through which tomato ketchup is produced.DThe diagram depicts the stages in the production of smoked fish.Paraphrase the questionQuestion saysChange it toThe diagram below showsThe diagram illustrates / depicts / outlines (leave out below)how X is madethe process of making X · how X is produced / manufacturedthe production of Xthe stages in the production of XThe pictures showThe diagram shows · The illustrations showExamplesQuestionThe diagram below shows how electricity is produced from coal.IntroThe diagram illustrates how electricity is produced from coal.QuestionThe diagram below shows how an igloo is made out of snow.IntroThe diagram shows the process of building an igloo from snow.QuestionThe pictures below show how tomato ketchup is made.IntroThe diagram shows the steps through which tomato ketchup is produced.QuestionThe diagram below shows how instant noodles are manufactured.IntroThe diagram illustrates how instant noodles are manufactured.QuestionThe pictures below show how plastic bottles are recycled.IntroThe pictures show how plastic bottles are recycled.Remember: the diagram shows (singular, with -s) · the diagrams show. A process uses the present simple: is made, not was made. No details yet: no first, then, numbers or temperatures.", "A process overview is two sentences. It has no small details. It tells the reader how big the process is and what it looks like.Four things to say1 · How many steps or stages there are.2 · Divide the steps into stages and name them (for long processes), or say where it starts and ends.3 · Simple or complex? Does it take much time or equipment?4 · Machinery or manual? Heavy machinery, special equipment, or people.FormulaOverall, there are X steps in the process, starting from … and ending with … It is also clear that …Version 1Overall, there are eight stages in the process, starting with the mining of coal and ending with the supply of electricity. It is also clear that waste heat is released twice.Version 2Overall, the process consists of / involves / has five main stages, which can be divided into …Two versions of one overview (bricks)List in a sentenceOverall, there are four main stages involved in this process, starting with processing the raw material and this is followed by producing half-ready bricks. After this, these bricks are fired, before the ready product is prepared for selling. Also, the process is a complex one, which requires much time and equipment to complete.Stages as a listOverall, there are four main stages in the process: processing the raw material, producing half-ready bricks, firing them and preparing the product for selling. Also, the process is a complex one, which requires much time and equipment to complete.Plastic bottlesOverviewOverall, there are three main stages in this process, starting with the initial preparation of plastic bottles, followed by the actual recycling process, and lastly the production of a range of plastic items using the recycled material. While some manual labor is needed, the majority of the job is completed by specialized equipment.Present simple. There are, the process has, it is, the fish are. Do not use was / were for a process.", "How do you count the stages? It depends on the diagram.Three kinds of diagramNumbered boxes: count the numbers (igloo 7, fish 8, noodles 8).Long process (12–15 pictures): give the number and group the steps into 2–3 stages: 15 steps in three stages.Named stages (a landfill: construction, use, closure): count the named stages.A device (a solar panel): no stages. Say what it is and what it does.Seven r ugh which tomato ketchup is produced.OverviewOverall, there are 15 steps in the process which can be divided into three stages: collecting and cleaning fresh tomatoes, preparing the ketchup itself, and labeling and distributing the end product. It is also clear that this process is rather simple and doesn't require any heavy machinery.The overview gives the number of stages, the start and the end, and one more general point.", "Check your introduction and overview.ChecklistIntroduction: one sentence, your own words, shows / illustrates, the name of the processOverview starts with OverallThe number of stages or steps is thereFirst stage and last stage namedOne more general point (simple / complex, machinery, finished product)No temperatures, times or single stepsPresent simple: there are, is madeCommon mistakes✗ Wrong✓ CorrectThe diagram show how …The diagram shows how …The diagram below shows how an igloo is made out of snow. (copy)The diagram illustrates the process of building an igloo.Overall, first blocks are cut, then …Overall, building an igloo involves seven stages, beginning with … and ending with …Overall, the process was …Overall, the process is …", "The diagram illustrates how electricity is produced from coal.\n\nOverall, the process consists of eight main stages, starting with the mining of coal and ending with the supply of electricity to homes and factories. It is also clear that waste heat is released at two points along the way.\n\nFirst, coal is extracted from a mine and then crushed into small pieces. The crushed coal is loaded onto a truck and transported to a gasifier, where it is converted into gas with the help of heat. Once the gas has been produced, it travels to a cooling unit, where waste heat is given off.\n\nAfter cooling, the gas passes through a cleaning stage and is then burned in a gas power plant, which also releases waste heat. Finally, the electricity that is generated is supplied to ordinary homes and to a factory. In this way, coal is turned into electricity in a series of connected steps, with waste heat released at both the cooling and the power plant stages.", "The diagram shows the process of building an igloo from snow.\n\nOverall, building an igloo involves seven stages, beginning with cutting blocks of snow and ending with making air holes inside. It is also clear that the finished structure is a dome built entirely from snow.\n\nFirst, blocks are cut from hard-packed snow using a snow saw. The blocks are then arranged in a circle about 4 meters across, leaving a gap for the entrance. Next, further rows are built on top of this circle to form a dome, with large blocks used at the bottom and smaller ones higher up, so that the walls curve inward.\n\nOnce the dome is nearly complete, a final block is placed in the center of the top to close it. The builder then fills any gaps in the exterior with loose snow, which makes the walls solid and 2 meters high. After that, the entrance is finished, and finally, air holes are drilled through the interior walls so that fresh air can enter.", "The diagram illustrates the process of producing smoked fish.\n\nOverall, the process has eight stages. It is also clear that the fish are first prepared, then smoked and colored, and finally packed and delivered.\n\nFirst, the fish are gutted with a knife. They are then soaked in salt water for 30 minutes, after which the water is heated for five minutes with the fish still inside. In the fourth stage, the fish are removed and left to dry. These first four stages prepare the fish for smoking and involve 35 minutes of timed treatment.\n\nNext, the dried fish are placed in a vat and smoked for 30 minutes, with a wooden lid on top and water at the bottom of the vat. After smoking, a yellow coloring is added to the fish. Finally, the fish are put in boxes, and these are loaded onto a truck and transported. In this way, a gutted fish becomes a smoked, colored product that is ready for sale.", "The diagram shows how a modern landfill site for household waste is designed and used.\n\nOverall, the landfill goes through three stages: construction, use and closure. It is also clear that the site is built with layers that protect the surrounding rock, and that liquid and gas are collected rather than allowed to escape.\n\nIn the construction stage, a large hole is first dug in the natural rock. The bottom and sides of the hole are lined with clay and a synthetic lining, and drainage pipes are laid at the bottom, connected to a drainage tank underneath. During the use stage, trucks dump household waste into the hole, where it builds up above the pipes, and any liquid that comes out of the waste flows down through the pipes into the tank.\n\nWhen the landfill is full, it is closed by covering the waste with a layer of clay. A pipe is then inserted through the cover so that the gases produced by the decomposing waste can be collected and released.", "The diagram illustrates how soft cheese is produced.\n\nOverall, the process has five main stages, starting with mixing milk and water and finishing with cooling the cheese. It is also clear that the whole process takes about a day, and that waste water is removed before the final stage.\n\nFirst, milk and water are poured into a tank and mixed. The mixture is then cooled to 9°C for two hours. After that, salt is added, and the mixture moves into a fermentation tank, where it is heated to 37°C and mixed for six hours.\n\nThe mixture then passes to an evaporation tank, where it is heated to 100°C for eight hours, and steam is released. After this, it goes through a filter, which separates the waste water from the thick mixture. Finally, the soft cheese is cooled to 5°C for eight hours. In this way, a liquid mixture is gradually turned into a thick, soft cheese through repeated heating and cooling.", "The diagrams illustrate how a simple solar panel is built and how it can be used to heat either air or water.\n\nOverall, the panel is a simple box with a transparent top, and it uses the energy of the sun to warm either air or water. It is also clear that the two versions work in much the same way, but the water version contains a pipe.\n\nThe panel consists of a box with a transparent top. It has an inlet on one side, which allows cold air or water to enter, and an outlet on the opposite side, through which warmed air or water leaves.\n\nTo heat air, sun rays pass through the transparent top and warm the inside of the box. Cool air enters through the inlet, is warmed as it moves through the box, and leaves through the outlet as warm air. To heat water, a water pipe is placed inside the box. Cool water flows into the pipe through the inlet, and the heat from the sun warms it, so that warm water comes out of the outlet.", "The diagram shows the steps through which tomato ketchup is produced.\n\nOverall, there are 15 steps in the process which can be divided into three stages: collecting and cleaning fresh tomatoes, preparing the ketchup itself, and labeling and distributing the end product. It is also clear that this process is rather simple and doesn't require any heavy machinery.\n\nThe process of producing ketchup begins with picking tomatoes and placing them in baskets, after which they are sorted into good ones and bad ones. Then, the good tomatoes are sent to a ketchup factory using a truck, where the production of tomato ketchup begins. Once the tomatoes have been delivered, their stalk, seeds, and skin are then removed, and they are placed in a container. In the next stage, the tomatoes in the container are crushed to pulp, and other ingredients, such as sugar, vinegar, and salt, are added. After that, the pulp is boiled and then cooled for two hours.\n\nHaving been cooled, it is then poured into bottles and labeled. Next, the ketchup goes through a quality control process, which inspects the quality of the product. Finally, the ketchup bottles are packed into boxes and sent to supermarkets, where customers buy the ketchup and eat it with burgers and fries.", "The diagram illustrates how instant noodles are manufactured.\n\nOverall, the production of instant noodles entails eight steps, which can be grouped into three distinct stages: preparing dough, cooking the noodles, and packaging the final product. It is also clear that this process is moderately complex, operates without human involvement, and relies on heavy machinery.\n\n\n\n", "Overall, there are four main stages involved in this process, starting with processing the raw material and this is followed by producing half-ready bricks. After this, these bricks are fired, before the ready product is prepared for selling. Also, the process is a complex one, which requires much time and equipment to complete.", "Overall, there are four main stages in the process: processing the raw material, producing half-ready bricks, firing them and preparing the product for selling. Also, the process is a complex one, which requires much time and equipment to complete.", "Overall, there are three main stages in this process, starting with the initial preparation of plastic bottles, followed by the actual recycling process, and lastly the production of a range of plastic items using the recycled material. While some manual labor is needed, the majority of the job is completed by specialized equipment.", "depict depicts depicted illustrates gasifier igloo ketchup landfill noodles manufactured manufacture entails inlet outlet silos mixer dough fermentation evaporation synthetic drainage colored labeling bricks half-ready"], "lesson": [], "A": []};

function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;

const PRES=/\b(show|shows|illustrate|illustrates|compare|compares|give|gives|present|presents|depict|depicts|display|displays|provide|provides|outline|outlines|summari[sz]es?|indicate|indicates|represent|represents|detail|details|describe|describes|track|tracks|reveal|reveals)\b/i;

function runLen(a,b){ // longest common run of words
  const x=(norm(a).match(/[a-z0-9]+/g)||[]),y=(norm(b).match(/[a-z0-9]+/g)||[]);let best=0;
  for(let i=0;i<x.length;i++)for(let j=0;j<y.length;j++){let k=0;while(i+k<x.length&&j+k<y.length&&x[i+k]===y[j+k])k++;if(k>best)best=k}
  return best}
function introAnalyze(text,g){
  const t=text.trim(),items=[],praise=[];

  if(t.split(/\s+/).length<7)return {ok:false,items:[{kind:"structure",msg:"Write a full introduction sentence.",fix:"The "+TYPES[g.type][1]+" shows … in … between … and …",why:"Introduction = type of graph + presenting verb + what + where + when."}],praise:[],hard:1};
  const ss=sentences(t);
  if(ss.length>1)items.push({kind:"style",i:ss[1].i,len:Math.min(20,ss[1].txt.length),msg:"The introduction is one sentence.",fix:"Keep to one sentence: type + verb + what + where + when",why:"Details belong in the overview and body paragraphs."});
  // type of graph
  const own=TYPES[g.type];
  if(!own[0].test(t)){
    const other=Object.keys(TYPES).filter(k=>k!==g.type&&TYPES[k][0].test(t))[0];
    if(other){const mm=TYPES[other][0].exec(t);add("facts",mm.index,mm[0].length,"This is a "+own[1]+", not a "+TYPES[other][1]+".","The "+own[1]+(g.type==="pie"||g.type==="line"&&false?"s":"")+" shows …","Name the correct type of graph. Check the picture.")}
    else add("structure",0,Math.min(12,t.length),"Name the type of graph.","The "+own[1]+" shows …","Introduction = type of graph + presenting verb + what + where + when.")}
  if(!PRES.test(t))add("structure",0,Math.min(14,t.length),"Use a presenting verb: shows, illustrates, compares, gives information about.","The "+own[1]+" illustrates …","You must tell the reader what the graph does, using a verb.");

function ovP(text,g){

  b.items.forEach((q,i)=>{const c=document.createElement("div");c.className="ovc";c.appendChild(drillSelect(si,ui,q,i,b.key));l.appendChild(c)});w.appendChild(l);wrapUnit(w,si,ui,host)}
function fixUnit(si,ui,host,b){const w=document.createElement("div");mkNote(w,b);const l=document.createElement("div");l.className="ovl";
  (DATA[b.data||"FIX"]).forEach((q,i)=>{const c=document.createElement("div");c.className="ovc";const d=document.createElement("div");
    d.innerHTML=drillType(si,ui,(b.data||"fx")+"_",i,'<span class="lab t">'+(i+1)+'.</span> '+(b.verb||"Correct the mistake")+': <i>'+esc(q[0])+"</i>",q[1],q[2],b.tip||"Find the missing word or the wrong form.");c.appendChild(d.firstElementChild);l.appendChild(c)});w.appendChild(l);wrapUnit(w,si,ui,host)}
const MODE={
 intro:{rows:3,lab:"Your introduction",task:"Write the <b>introduction</b>: one sentence. Paraphrase the question; do not copy it.",hint:"The diagram shows / illustrates how … is …",ph:"Write one sentence …",model:"intro"},
 ov:{rows:5,lab:"Your overview",task:"Write the <b>overview</b>: two sentences, starting with <i>Overall</i>.",hint:"Overall, there are … stages, starting with … and ending with … It is also clear that …",ph:"Overall, …",model:"ov"},
 full:{rows:16,lab:"Your answer",task:"Write the <b>full answer</b> in four paragraphs (blank line between them): introduction, overview, body 1, body 2. At least 150 words.",hint:"Paragraph 1: the diagram shows … Paragraph 2: Overall, … Paragraph 3 and 4: topic sentence + the stages.",ph:"Write your four paragraphs here. Leave a blank line between paragraphs …",model:"full"},
 both:{rows:8,lab:"Your introduction and overview",task:"Write the <b>introduction</b> (one sentence) and the <b>overview</b> (two sentences) as two short paragraphs.",hint:"Paragraph 1: the graphs show … Paragraph 2: Overall, … It is also clear that …",ph:"Introduction …\n\nOverview …",model:"both"}};
function wrUnit(si,ui,host,b){const w=document.createElement("div");mkNote(w,b);const l=document.createElement("div");l.className="ovl";const M=MODE[b.mode];
  b.refs.forEach(r=>{const m=DATA.TASKS[r];const c=document.createElement("div");c.className="ovc";
    c.innerHTML='<div class="gt"><i>'+(b.mode==="full"?"Test ":"")+m.n+'</i>'+m.title+'</div>'+imgBox(m.img)+'<div class="clue"><b>Question.</b> <i>'+esc(m.prompt)+'</i></div>'+(b.plan&&m.plan?'<div class="clue"><b>Plan.</b> '+m.plan+'</div>':"")+'<div class="clue"><b>Task.</b> '+M.task+'</div>';
    const model=M.model==="both"?m.intro+"\n\n"+m.ov:m[M.model];
    c.appendChild(inputCard(si,ui,{key:b.mode+m.n,step:si,unit:ui,label:'<span class="lab o">'+M.lab+'</span>',rows:M.rows,model:model,prompt:b.mode+" "+m.n,hint:M.hint,ph:M.ph,check:x=>CHK[b.mode](x,m)}));l.appendChild(c)});
  w.appendChild(l);wrapUnit(w,si,ui,host)}
function tsUnit(si,ui,host,b){const w=document.createElement("div");mkNote(w,b);const l=document.createElement("div");l.className="ovl";
  DATA.TS.forEach((g,i)=>{const m=DATA.TASKS[g.ti];const c=document.createElement("div");c.className="ovc";c.innerHTML='<div class="gt"><i>'+(i+1)+'</i>Topic sentence</div>'+imgBox(m.img)+'<div class="clue"><b>Task.</b> '+g.label+' Write the topic sentence.</div>';
    c.appendChild(inputCard(si,ui,{key:"ts"+i,step:si,unit:ui,label:'<span class="lab o">Your topic sentence</span>',rows:2,model:g.model,prompt:"Topic sentence "+(i+1),hint:"One general sentence: The first stage … · The next stage … · The first graph shows …",ph:"Write one sentence …",check:x=>topicP(x,g)}));l.appendChild(c)});
  w.appendChild(l);wrapUnit(w,si,ui,host)}
function drillSelect(si,ui,q,i,key){const id="s"+(uid++);const reg={id,key:key+i,step:si,unit:ui,counted:true,ok:false,kind:"select",acc:[q[2]],prompt:q[0],tries:0};REG.push(reg);
  const d=document.createElement("div");d.className="q";d.innerHTML='<div class="lab"><span class="lab t">'+(i+1)+'.</span> '+esc(q[0])+'</div><select class="sel" id="'+id+'" data-noreport="1" style="max-width:100%"><option value="">Choose…</option>'+q[1].map(o=>'<option value="'+esc(o)+'">'+esc(o)+'</option>').join("")+'</select><div class="fb" id="f'+id+'"></div>';
  reg.ta=d.querySelector("#"+id);reg.fb=d.querySelector("#f"+id);reg.wc=()=>{};
  reg.ta.addEventListener("change",()=>{ST.saved[reg.key]=reg.ta.value;const v=reg.ta.value;if(!v){setOk(reg,false);return}const ok=v===q[2];reg.tries++;reg.ta.className="sel "+(ok?"ok":"no");reg.fb.className="fb on "+(ok?"good":"bad");
    reg.fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"✓ Correct":"✗ Not quite")+'</span></div><div class="body"><div class="it '+(ok?"praise":"structure")+'"><div>'+(ok?"Yes. "+esc(q[3]||""):(reg.tries>=2?"Answer: <b>"+esc(q[2])+"</b>. "+esc(q[3]||""):"Think again."))+"</div></div></div>";setOk(reg,ok);save()});
  return d}
function drillType(si,ui,key,i,label,rx,model,tip){return mkInput({key:key+i,step:si,unit:ui,label:label,rows:3,model:model,prompt:label.replace(/<[^>]+>/g,""),hint:tip,ph:"Write the correct version …",check:x=>{const ok=new RegExp(rx,"i").test(x.trim());return finish(ok?[]:[{kind:"structure",msg:"Not yet. Look at the hint above the box.",fix:model}],ok?["Correct. Another good answer is possible too."]:[])}})}

/* ---------- page ---------- */
function build(){
  document.title=CH.title.replace(/<[^>]+>/g,"")+" · "+CH.kicker+" · Mr Ikromov's IELTS";
  document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header>'+
    '<nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">'+(CH.footer||"")+'</div><div id="toast"></div>';
  const nav=$("#steps"),main=$("#main");
  CH.steps.forEach((s,si)=>{
    nav.insertAdjacentHTML("beforeend",'<button class="step" id="st'+si+'" data-i="'+si+'"><span class="no">'+s.no+"</span>"+s.name+' <span class="ct"></span></button>');
    const sec=document.createElement("section");sec.className="sec";sec.id="sec"+si;sec.style.display="none";
    sec.innerHTML='<div class="sec-title"><span class="n">'+s.no+"</span><h2>"+s.title+"</h2></div>"+(s.lead?'<p class="lead">'+s.lead+"</p>":"")+(s.note?'<div class="note">'+s.note+"</div>":"");
    main.appendChild(sec);
    // units: each shown on its own (sub menu) when the step has more than one
    const units=[];
    for(const b of s.blocks){
      if(b.type==="html")units.push({label:b.tab||"Info",render:(ui,h)=>{const c=document.createElement("div");c.innerHTML=b.html;h.appendChild(c)}});
      else if(b.type==="sel")units.push({label:b.label,render:(ui,h)=>selUnit(si,ui,h,b)});
      else if(b.type==="fix")units.push({label:b.label,render:(ui,h)=>fixUnit(si,ui,h,b)});
      else if(b.type==="wr")units.push({label:b.label,render:(ui,h)=>wrUnit(si,ui,h,b)});
      else if(b.type==="ts")units.push({label:b.label,render:(ui,h)=>tsUnit(si,ui,h,b)});
    }
    s._units=units;
    const tabs=units.filter(u=>!u.inline);
    const sub=document.createElement("div");sub.className="subnav";if(s.subnav&&tabs.length>1)sec.appendChild(sub);
    const host=document.createElement("div");sec.appendChild(host);
    units.forEach((u,ui)=>{const box=document.createElement("div");box.className="unit";box.dataset.u=ui;u.render(ui,box);host.appendChild(box);u.box=box;
      if(s.subnav&&!u.inline&&tabs.length>1)sub.insertAdjacentHTML("beforeend",'<button class="sub" id="u'+si+'_'+ui+'" data-u="'+ui+'">'+esc(u.label)+" <small></small></button>")});
    if(s.subnav&&tabs.length>1){sub.onclick=e=>{const b=e.target.closest(".sub");if(b)showUnit(si,+b.dataset.u,true)}}
    const nb=document.createElement("div");nb.className="nextbar";
    nb.innerHTML=(si>0?'<button class="btn ghost" data-go="'+(si-1)+'">← '+CH.steps[si-1].name+"</button>":"<span></span>")+(si<CH.steps.length-1?'<button class="btn go" data-go="'+(si+1)+'">Next: '+CH.steps[si+1].name+" →</button>":'<span class="wc">This is the last step. Check your progress at the top.</span>');
    nb.onclick=e=>{const b=e.target.closest("[data-go]");if(b){showStep(+b.dataset.go);window.scrollTo(0,0)}};sec.appendChild(nb);
  });
  nav.onclick=e=>{const b=e.target.closest(".step");if(b){showStep(+b.dataset.i);window.scrollTo(0,0)}};
  bindInputs();
}
function showUnit(si,ui,scroll){const s=CH.steps[si];if(!s.subnav)return;ST.unit[si]=ui;
  s._units.forEach((u,k)=>{if(u.inline)return;u.box.style.display=k===ui?"":"none";const b=$("#u"+si+"_"+k);if(b)b.classList.toggle("on",k===ui)});
  $$("svg.chart",s._units[ui].box).forEach(c=>{c.classList.remove("draw");void c.getBoundingClientRect();c.classList.add("draw")});
  if(scroll){const t=$("#sec"+si);window.scrollTo({top:Math.max(0,t.getBoundingClientRect().top+window.scrollY-70)})}save()}
function showStep(si){ST.step=si;CH.steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});
  const b=$("#st"+si);if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"center"});
  const s=CH.steps[si];if(s.subnav)showUnit(si,Math.min(ST.unit[si]||0,s._units.length-1),false);save()}
function applyState(){
  for(const r of REG){const v=ST.saved[r.key];if(v==null||!r.ta)continue;r.ta.value=v;r.tries=ST.tries[r.key]||0;
    if(r.kind==="select"){if(v)runSel(r,false)}else{r.wc();if(ST.ok[r.key]){r.ta.className="ok";setOk(r,true)}}}
  showStep(Math.min(ST.step||0,CH.steps.length-1));progress();sendTexts()}

build();
// load saved progress: from the site (in the frame) or from this browser
let got=false;
window.addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="ielts-lab-state"||d.id!==CH.id)return;if(d.theme)setTheme(d.theme);if(!got){got=true;restore(d.data);if(!d.data)fallback()}});
function fallback(){try{restore(localStorage.getItem("ielts-lab:"+CH.id))}catch(e){}}
showStep(0);progress();
if(inFrame){try{parent.postMessage({type:"ielts-lab-load",id:CH.id},"*")}catch(e){}setTimeout(()=>{if(!got){got=true;fallback()}},900)}else{got=true;fallback()}
})();


</script>
</body>
</html>
