<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson 12 · Map Sentence Structures · Writing Task 1 · Mr Ikromov's IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Writing Lab — shared look for every chapter (2026-11-07).
   Same colours, shapes and fonts as ieltswithmrikromov.com:
   lapis-to-turquoise band, Unbounded headings, Nunito Sans text,
   rounded rectangles only (12 / 14 / 20 / 28 px), one saffron button. */
:root{
  --ink:#f6f5f1;--panel:#fff;--panel2:#efede6;--line:#e3dfd4;--paper:#17213a;--dim:#3a4560;--mist:#55607a;
  --brass:#2456b0;--onbrass:#fff;--sage:#13807c;--sageT:#e2f2f0;--coral:#b23a48;--coralT:#f8e1e4;--amber:#9a5b12;--amberT:#fbefd9;
  --saffron:#e6a33a;--onsaffron:#17213a;--band:#22489a;
  --chipS:#dfe8fb;--chipSt:#1f4aa0;--chipV:#fbe0e6;--chipVt:#a02a44;--chipL:#fdf0d2;--chipLt:#8a5a0c;--chipN:#dcf3ef;--chipNt:#0f6b66;
  --mark:#fff2b3;--shadow:0 1px 2px rgba(23,33,58,.06),0 6px 18px -10px rgba(23,33,58,.18);
  --gUp:#13807c;--gDown:#b23a48;--gMix:#1f3a75;--g2:#c4622d;--grid:#e8e4da;--gtext:#55607a;
}
:root[data-theme="dark"]{
  --ink:#0f1626;--panel:#172036;--panel2:#1e2944;--line:#2b3858;--paper:#eef0f6;--dim:#c6ccda;--mist:#a3abbf;
  --brass:#7fa6f2;--onbrass:#0f1626;--sage:#7fd6d2;--sageT:#123a3c;--coral:#f29aa6;--coralT:#3e1c22;--amber:#f2c07a;--amberT:#3a2a12;
  --saffron:#f0b95a;--band:#1b3570;
  --chipS:#22335c;--chipSt:#b9cdf7;--chipV:#4a2230;--chipVt:#f5b8c6;--chipL:#453512;--chipLt:#f6d48b;--chipN:#153f3d;--chipNt:#9de3dc;
  --mark:#5a4a12;--shadow:none;
  --gUp:#5fd0c6;--gDown:#f08a99;--gMix:#a9bdf0;--g2:#f2a76b;--grid:#2b3858;--gtext:#a3abbf;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Unbounded,"Nunito Sans",system-ui,sans-serif;letter-spacing:-.01em}
b,strong{font-weight:800}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- band ---- */
.band{color:#fff;background:var(--band);background-image:linear-gradient(115deg,var(--band) 0%,#1f6fae 55%,#1a9bb5 100%);border-radius:0 0 28px 28px;padding:22px 0 20px}
.band .kick{font-size:13px;font-weight:800;opacity:.9;letter-spacing:.02em}
.band h1{margin:6px 0 6px;font-size:28px;line-height:1.15;font-weight:600}
.band p{margin:0;max-width:760px;font-size:15px;opacity:.92}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1;max-width:360px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:999px;transition:width .4s}
.prog b{font-size:14px;white-space:nowrap}

/* ---- step menu ---- */
.steps{position:sticky;top:0;z-index:20;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.steps .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.steps .row::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px}
.step .no{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--panel2);font-size:12px}
.step .ct{font-size:12px;color:var(--mist);font-weight:700}
.step.on{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.step.on .no{background:rgba(255,255,255,.22)}.step.on .ct{color:inherit;opacity:.85}
.step.full .ct{color:var(--sage)}.step.on.full .ct{color:inherit}

main{padding:20px 0 40px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.sec-title h2{margin:0;font-size:21px;font-weight:600}
.sec-title .n{font-family:Unbounded,sans-serif;font-size:13px;color:var(--brass);font-weight:600}
.lead{color:var(--dim);margin:0 0 14px;font-size:15px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600}
.card .ins{color:var(--dim);font-size:14px;margin-bottom:12px}
.note{border-radius:14px;background:var(--panel2);padding:12px 14px;font-size:14.5px;color:var(--dim);margin:0 0 16px}
.note b{color:var(--paper)}

/* ---- sub menu (structures, drills) ---- */
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sub{border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:6px 11px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.sub small{color:var(--mist);font-weight:700}
.sub.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass)}
.sub.full small{color:var(--sage)}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nums .sub{min-width:42px;justify-content:center;font-family:Unbounded,sans-serif;font-weight:600}
.nums .sub.seen:not(.on){background:var(--panel2)}

/* ---- learn panel ---- */
.lhd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lhd .big{font-family:Unbounded,sans-serif;font-size:30px;font-weight:600;color:var(--brass);line-height:1}
.lhd h3{font-size:17px;margin:0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.chip{border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px;white-space:pre}
.chip.s{background:var(--chipS);color:var(--chipSt)}.chip.v{background:var(--chipV);color:var(--chipVt)}
.chip.l{background:var(--chipL);color:var(--chipLt)}.chip.n{background:var(--chipN);color:var(--chipNt)}
.chip.p{padding:4px 2px;color:var(--mist)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mist);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.eg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.eg .tg{flex:0 0 auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);background:var(--panel2);border-radius:8px;padding:2px 7px;height:fit-content;margin-top:2px}
.eg.real .tg{background:var(--sageT);color:var(--sage)}
.eg b{background:var(--chipL);color:var(--chipLt);border-radius:6px;padding:0 3px}
.rule,.trap{border-radius:14px;padding:11px 13px;font-size:14.5px;margin-top:10px}
.rule{background:var(--sageT)}.rule>b:first-child{color:var(--sage)}
.trap{background:var(--coralT)}.trap>b:first-child{color:var(--coral)}
.trap s{color:var(--coral)}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.gcap{font-size:13px;color:var(--mist);margin:6px 2px 0}
.gmodel{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:14.5px;margin-top:8px}
.replay{margin-top:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:5px 11px;font-weight:800;font-size:13px}
.yourturn{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.yourturn h4{margin:0 0 8px;font-size:15px;color:var(--sage)}

table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.t th{text-align:left;background:var(--panel2);padding:9px 12px;font-weight:800}
.t td{padding:9px 12px;border-top:1px solid var(--line)}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mist .x,.mist .v{border-radius:14px;padding:10px 12px;font-size:14.5px}
.mist .x{background:var(--coralT)}.mist .x s{color:var(--coral)}
.mist .v{background:var(--sageT)}

/* ---- charts ---- */
svg.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--gtext);font-size:11px;font-family:"Nunito Sans",system-ui,sans-serif}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .lbl{font-size:11.5px;font-weight:800;font-family:"Nunito Sans",system-ui,sans-serif}
.chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.3s ease-out forwards}
@keyframes dl{to{stroke-dashoffset:0}}
.chart .key{font-size:11.5px;font-weight:700;fill:var(--paper);font-family:"Nunito Sans",system-ui,sans-serif}

/* ---- graph exercise cards ---- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.gcard .gt{font-weight:800;font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gcard .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--panel2);color:var(--mist);border-radius:8px;padding:2px 7px}
.gcard .gt span{font-weight:600;color:var(--mist);font-size:13px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-size:15px;margin-bottom:8px}
.q .p .num{font-weight:800;color:var(--brass);margin-right:6px}
.q .p .tg{display:inline-block;font-size:11px;font-weight:800;background:var(--chipS);color:var(--chipSt);border-radius:8px;padding:1px 7px;margin-right:4px}
.q .p .sm{font-size:13px;color:var(--mist)}
.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:14.5px;margin-bottom:6px}
.wk .l{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}
select.sel{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--paper);min-width:150px}
select.sel.ok{border-color:var(--sage);background:var(--sageT)}select.sel.no{border-color:var(--coral);background:var(--coralT)}

/* ---- input + coach ---- */
.iw{margin-top:6px}
.iw .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--paper);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:62px;outline:none}
textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:8px 16px;font-weight:800;font-size:14px;background:var(--brass);color:var(--onbrass)}
.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:12.5px;color:var(--mist)}
.done-tag{font-size:12.5px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:14px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.fb.on{display:block}
.fb .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px}
.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:12px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:15px;line-height:1.7;margin-bottom:6px}
.ann mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--amber)}
.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:14.5px}
.it .k{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}
.tryit{margin-top:3px;font-weight:800;color:var(--sage)}
.why{margin-top:2px;color:var(--mist);font-size:13.5px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:14.5px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.blockbar .score{font-weight:800;color:var(--dim);font-size:14px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.foot{color:var(--mist);font-size:12.5px;text-align:center;padding:10px 18px 30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);font-weight:800;border-radius:14px;padding:9px 16px;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .band{padding:16px 0 16px;border-radius:0 0 20px 20px}
  .band h1{font-size:22px}
  .band p{font-size:14px}
  .two,.ggrid,.mist{grid-template-columns:1fr}
  .card{padding:14px}
  .step{padding:7px 11px;font-size:13px}
  .sec-title h2{font-size:18px}
  .chip{font-size:13px}
}
@media print{.steps,.irow,.blockbar,.nextbar{display:none}.sec{display:block!important}}


/* ---- Lesson 5 additions ---- */
.gimg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.gimg img{max-width:100%;height:auto;max-height:360px}
.ovl{display:grid;grid-template-columns:1fr;gap:16px}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.ovc .gt{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ovc .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--brass);color:var(--onbrass);border-radius:8px;padding:2px 8px}
.ovc .gt span{font-weight:600;color:var(--mist);font-size:12.5px}
.phr{border-radius:14px;background:var(--amberT);padding:9px 12px;margin:10px 0 4px;font-size:13.5px}
.phr b{color:var(--amber);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.phr i{font-style:normal;font-weight:700;display:inline-block;margin:2px 4px 2px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.clue{font-size:13.5px;color:var(--dim);margin:2px 0 6px}
.clue u{text-decoration:none;font-weight:800;color:var(--paper)}
.step3{display:grid;grid-template-columns:1fr;gap:0}
.iw+.iw{margin-top:12px}
.iw .lab.i{color:#6d4bc2}.iw .lab.t{color:var(--brass)}.iw .lab.d{color:var(--amber)}.iw .lab.o{color:var(--sage)}
:root[data-theme="dark"] .iw .lab.i{color:#c3b0f5}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sent{border-radius:14px;padding:12px 14px;font-size:15px}
.sent .st{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.sent.s1{background:var(--chipS);border:1px solid color-mix(in srgb,var(--chipSt) 35%,transparent)}.sent.s1 .st{color:var(--chipSt)}
.sent.s2{background:var(--amberT);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent)}.sent.s2 .st{color:var(--amber)}
mark.t{background:var(--mark);color:inherit;border-radius:5px;padding:0 3px}
mark.d{background:#ffd9a8;color:#3a2a12;border-radius:5px;padding:0 3px}
:root[data-theme="dark"] mark.d{background:#6a4513;color:#fbe4c4}
.legend2{font-size:13px;color:var(--mist);margin:10px 0}
.stp{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;margin:0 0 8px}
.stp b.n{flex:0 0 auto;font-family:Unbounded,sans-serif;font-size:12px;border-radius:9px;padding:4px 9px;color:#fff;background:var(--brass)}
.stp b.n.d{background:#b7791f}
.stp em{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;color:var(--mist);white-space:nowrap}
ul.kf{list-style:none;margin:6px 0 10px;padding:0;font-size:14.5px}
ul.kf li{margin:3px 0}
ul.kf b.tg{display:inline-block;min-width:54px;text-align:center;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:7px;padding:1px 6px;margin-right:6px;color:#fff;background:var(--brass)}
ul.kf b.tg.d{background:#b7791f}
.exh{font-weight:800;font-size:15px;margin:0 0 6px}
.exov{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:15px;line-height:1.6}
.phg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phg h4{margin:0 0 6px;font-size:14px}
.phg .eg{padding:8px 0}
.q .sel{margin-top:2px}
.why5{border-radius:12px;background:var(--panel2);padding:8px 11px;font-size:14px;margin-top:8px}
@media (max-width:760px){.sc,.phg{grid-template-columns:1fr}.stp em{display:none}}
.gfig{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--panel)}
.gfig-t{font-weight:800;font-size:13.5px;margin-bottom:2px}.gfig-u{font-size:12px;color:var(--mist)}
.gref{color:var(--mist);font-size:12.5px;font-weight:600}
.qg{border:1px solid var(--line);border-radius:12px;padding:6px 10px 4px;margin:6px 0 8px;background:var(--panel);max-width:560px}
.qg svg{display:block}.qgc{font-size:12px;color:var(--mist);margin-top:2px}
.gbox svg{display:block}
.chip.s,.chip.v,.chip.l,.chip.n{white-space:pre-wrap}
.gapgrid{display:grid;grid-template-columns:1fr;gap:0}
.q.g .p{line-height:2.1}
input.gap{font:inherit;border:0;border-bottom:2px solid var(--line);background:transparent;color:inherit;text-align:center;padding:0 2px;margin:0 3px;outline:none;border-radius:4px 4px 0 0}
input.gap:focus{border-bottom-color:var(--brass);background:var(--panel2)}
input.gap.ok{border-bottom-color:var(--sage);background:var(--sageT)}
input.gap.no{border-bottom-color:var(--coral);background:var(--coralT)}
.clue{font-size:13.5px;color:var(--dim);margin:6px 0 0}
.jobs td:first-child{font-weight:700}
.stdy td{vertical-align:top}.stdy td:first-child{font-weight:800;width:92px}
.stdy .two1{color:var(--mist);font-size:13px;margin-bottom:3px}

<script>
/* Writing Task 1 · Lesson 12 · Topic sentences and body paragraphs for comparative charts. */
const CHAPTER={"id": "wt1-lesson12", "kicker": "Writing Task 1 · Lesson 12", "title": "Map <span style=\"color:#ffd27a\">sentence structures</span>", "lead": "Learn eleven structures for describing maps, one at a time. Then write each one on the Ryemouth map and use them together on five real maps. The Writing Coach checks the <b>structure</b>, the <b>features</b>, the <b>direction of change</b>, the <b>tense</b>, the <b>grammar</b> and the <b>spelling</b>.", "footer": "Mr Ikromov's IELTS · Writing Task 1 · Lesson 12 · Map Sentence Structures. The Writing Coach is a teaching tool: it finds common mistakes and checks your sentences against the maps, but it is not an examiner. Another correct sentence is accepted; compare with the model after you try.", "steps": [{"no": "12.1", "name": "Learn", "title": "The eleven structures", "subnav": true, "lead": "Read the map, then learn each structure: formula, use, examples.", "blocks": [{"type": "html", "tab": "Read a map", "html": "<p class=\"lead\">A map answer describes <b>what was added, removed, replaced, moved or kept</b>. Before you write, read the maps.</p><div class=\"stp\"><b class=\"n\">1</b><span>Find the <b>dates</b> of the two maps (or <i>present</i> and <i>future</i>).</span><em>tense</em></div><div class=\"stp\"><b class=\"n d\">2</b><span>Find <b>north</b>. Use the compass: <i>north, south-east, in the west</i>, not left and right alone.</span><em>place</em></div><div class=\"stp\"><b class=\"n\">3</b><span>Mark what <b>stays the same</b>.</span><em>kept</em></div><div class=\"stp\"><b class=\"n d\">4</b><span>Mark what is <b>new, gone, replaced, moved or changed</b>.</span><em>change</em></div><div class=\"phg\" style=\"margin-top:10px\"><div><h4>Direction words</h4><table class=\"t\"><tbody><tr><td>north-west</td><td>north</td><td>north-east</td></tr><tr><td>west</td><td>center</td><td>east</td></tr><tr><td>south-west</td><td>south</td><td>south-east</td></tr></tbody></table></div><div><h4>Verbs of change</h4><div class=\"eg\"><span class=\"tg\">New</span><span><b>built · constructed · added · introduced · created</b></span></div><div class=\"eg\"><span class=\"tg\">Gone</span><span><b>demolished · removed · cleared · disappeared</b></span></div><div class=\"eg\"><span class=\"tg\">Changed</span><span><b>replaced · converted · turned into · extended · enlarged</b></span></div><div class=\"eg\"><span class=\"tg\">Moved</span><span><b>moved · relocated</b></span></div><div class=\"eg\"><span class=\"tg\">Same</span><span><b>remained intact · stayed the same · unchanged</b></span></div></div><div><h4>Tenses</h4><div class=\"eg\"><span class=\"tg\">Past</span><span>earlier map: <b>was / were</b> (In 1995, there was …)</span></div><div class=\"eg\"><span class=\"tg\">Now</span><span>changes up to now: <b>has been / have been</b> built · or past simple</span></div><div class=\"eg\"><span class=\"tg\">Future</span><span>plan: <b>will be</b> built / converted / replaced</span></div></div></div><div class=\"note\"><b>Eleven structures follow.</b> Do not use all in one paragraph: choose the structure that fits the change. Four or five different structures in a map answer show real grammatical range.</div>"}, {"type": "html", "tab": "Structures 1–4", "html": "<div class=\"card\"><div class=\"exh\">Structure 1 · There is X, with Y and Z located …</div><div class=\"formula\">There is / was X (place), with Y (place) and Z located / situated (place)</div><div class=\"legend2\"><b>Use it to</b></div><div>Describe the layout: one main feature first, then two more features attached to it.</div><div class=\"legend2\"><b>Sample map</b></div><div class=\"mapfig\"><svg class=\"mm1\" viewBox=\"-2 0 228 162\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><g transform=\"translate(0,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">2000</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><line x1=\"30\" y1=\"128\" x2=\"190\" y2=\"10\" stroke=\"#a7afbd\" stroke-width=\"7\" stroke-linecap=\"round\"/><rect x=\"10\" y=\"26\" width=\"62\" height=\"46\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"41.0\" y=\"52.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">housing</text><rect x=\"138\" y=\"78\" width=\"72\" height=\"50\" rx=\"3\" fill=\"#cfe8c0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"174.0\" y=\"106.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">park</text><text x=\"92\" y=\"92\" font-size=\"8.6\" font-style=\"italic\" fill=\"#475569\">main road</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g></svg></div><div class=\"eg\"><span class=\"tg\">On this map</span><span>In 2000, there was a main road, with housing along its western side and a park located in the east.</span></div><div class=\"legend2\"><b>More examples</b></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The access to the museum was from the South, with shops to the right and the temporary exhibition room located on the other side of the entrance.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The entrance to the museum was from the South, with a huge garden in the middle and a café located in the North.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>In 1995, there was a diagonal main road, with housing along its western side and a forest park located in the east.</span></div><div class=\"note\" style=\"margin-top:6px\">Join extra features with <b>with</b>. Do not repeat <i>there is</i> for every feature.</div></div><div class=\"card\"><div class=\"exh\">Structure 2 · X is (place), near which is Y</div><div class=\"formula\">X is (place), near which / next to which / behind which / between which / to the right (left, east, west, north, south) of which / adjacent to which is Y</div><div class=\"legend2\"><b>Use it to</b></div><div>Say where a second feature is in relation to the first. The verb comes <b>after</b> the <i>which</i> phrase.</div><div class=\"legend2\"><b>Sample map</b></div><div class=\"mapfig\"><svg class=\"mm1\" viewBox=\"-2 0 228 162\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><g transform=\"translate(0,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">2000</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"68\" x2=\"220\" y2=\"68\" stroke=\"#a7afbd\" stroke-width=\"7\" stroke-linecap=\"round\"/><rect x=\"12\" y=\"14\" width=\"80\" height=\"44\" rx=\"3\" fill=\"#cfe8c0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"52.0\" y=\"39.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">park</text><rect x=\"138\" y=\"14\" width=\"66\" height=\"40\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"171.0\" y=\"37.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">school</text><rect x=\"146\" y=\"84\" width=\"56\" height=\"38\" rx=\"3\" fill=\"#e5d3f0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"174.0\" y=\"106.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">library</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g></svg></div><div class=\"eg\"><span class=\"tg\">On this map</span><span>There was a school in the east of the town, near which was a library.</span></div><div class=\"legend2\"><b>More examples</b></div><div class=\"eg\"><span class=\"tg\">Example</span><span>There is a garden, near which is a football stadium.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>Further from the shop, there was a cloakroom, adjacent to which was a water closet.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>There was a hotel in the east of the village, near which was a café.</span></div><div class=\"note\" style=\"margin-top:6px\">The verb is <b>is / was / are / were</b> and agrees with Y: <i>near which <u>was</u> a café · next to which <u>were</u> two shops</i>.</div></div><div class=\"card\"><div class=\"exh\">Structure 3 · While X is (place), Y is (place)</div><div class=\"formula\">While X is (place), Y is (place)</div><div class=\"legend2\"><b>Use it to</b></div><div>Contrast two areas of the same map in one sentence.</div><div class=\"legend2\"><b>Sample map</b></div><div class=\"mapfig\"><svg class=\"mm1\" viewBox=\"-2 0 228 162\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><g transform=\"translate(0,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">2000</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"10\" y=\"10\" width=\"92\" height=\"50\" rx=\"3\" fill=\"#cfe8c0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"56.0\" y=\"38.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">park</text><rect x=\"14\" y=\"86\" width=\"72\" height=\"44\" rx=\"3\" fill=\"#f8d3b0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"50.0\" y=\"111.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">market</text><rect x=\"112\" y=\"86\" width=\"94\" height=\"44\" rx=\"3\" fill=\"#e3e5ea\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"159.0\" y=\"111.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">car park</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g></svg></div><div class=\"eg\"><span class=\"tg\">On this map</span><span>While the park occupied the north-west, the market and the car park were in the south.</span></div><div class=\"legend2\"><b>More examples</b></div><div class=\"eg\"><span class=\"tg\">Example</span><span>While the garden occupied the center, the café was in the North.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>While the auditorium and the main door stayed the same, most other areas were rearranged.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>While the farmland occupied the north-east, the fish market and the fishing port were in the south.</span></div><div class=\"note\" style=\"margin-top:6px\">Both parts need a place: <i>in the North · in the south · on the east side</i>.</div></div><div class=\"card\"><div class=\"exh\">Structure 4 · X is situated / located (place)</div><div class=\"formula\">X is / was / are / were + situated / located (place)</div><div class=\"legend2\"><b>Use it to</b></div><div>The simple way to give a position. Use it for features that stay the same.</div><div class=\"legend2\"><b>Sample map</b></div><div class=\"mapfig\"><svg class=\"mm1\" viewBox=\"-2 0 228 162\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><g transform=\"translate(0,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">2000</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"14\" y=\"40\" width=\"62\" height=\"56\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"45.0\" y=\"71.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">school</text><rect x=\"84\" y=\"40\" width=\"52\" height=\"56\" rx=\"3\" fill=\"#e5d3f0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"110.0\" y=\"71.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">library</text><rect x=\"150\" y=\"36\" width=\"56\" height=\"64\" rx=\"3\" fill=\"#bcdcf6\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"178.0\" y=\"71.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">pond</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g></svg></div><div class=\"eg\"><span class=\"tg\">On this map</span><span>The library is located in the center, to the east of the school.</span></div><div class=\"legend2\"><b>More examples</b></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The garden is located / situated in the center.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The vegetation is in the south-west corner, and the railway runs along the eastern edge.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The fishing port was situated in the sea, to the south of the fish market.</span></div><div class=\"note\" style=\"margin-top:6px\">A full verb is needed: <i>is, was, are, were</i>. ✗ <s>The garden located in the center.</s>  ✓ The garden <b>is</b> located in the center.</div></div>"}, {"type": "html", "tab": "Structures 5–8", "html": "<div class=\"card\"><div class=\"exh\">Structure 5 · X replaced Y · Y was replaced by X</div><div class=\"formula\">X replaced Y  =  Y was replaced by X  =  Y made way for X</div><div class=\"legend2\"><b>Use it to</b></div><div>Show that one thing took the place of another. The <b>new</b> thing replaces the <b>old</b> thing.</div><div class=\"legend2\"><b>Sample map</b></div><div class=\"mapfig\"><svg class=\"mm2\" viewBox=\"-2 0 458 162\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><g transform=\"translate(0,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">2000</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"14\" y=\"12\" width=\"110\" height=\"52\" rx=\"3\" fill=\"#cfe8c0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"69.0\" y=\"41.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">park</text><rect x=\"148\" y=\"20\" width=\"58\" height=\"52\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"177.0\" y=\"49.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">school</text><rect x=\"14\" y=\"92\" width=\"130\" height=\"36\" rx=\"3\" fill=\"#f8d3b0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"79.0\" y=\"113.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">row of shops</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g><g transform=\"translate(230,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">Today</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"14\" y=\"12\" width=\"110\" height=\"52\" rx=\"3\" fill=\"#cfe8c0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"69.0\" y=\"41.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">park</text><rect x=\"148\" y=\"20\" width=\"58\" height=\"52\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"177.0\" y=\"49.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">school</text><rect x=\"14\" y=\"92\" width=\"130\" height=\"36\" rx=\"3\" fill=\"#e5d3f0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"79.0\" y=\"113.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">cinema</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g></svg></div><div class=\"eg\"><span class=\"tg\">On this map</span><span>The row of shops has been replaced by a cinema.</span></div><div class=\"legend2\"><b>More examples</b></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The cloakroom and shop replaced the temporary exhibition room.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The temporary exhibition room was replaced by the cloakroom and shop.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The temporary exhibition room made way for the cloakroom and shop.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The farmland and the forest park have been replaced by a golf course with two tennis courts.</span></div><div class=\"note\" style=\"margin-top:6px\">What <b>disappears</b> is the subject of <i>was replaced by</i>. ✗ <s>The shops were demolished and a cinema was replaced.</s> ✓ The shops <b>were replaced by</b> a cinema.</div></div><div class=\"card\"><div class=\"exh\">Structure 6 · X was built, which resulted in the disappearance of Y</div><div class=\"formula\">X was built (constructed), which resulted in the disappearance of Y</div><div class=\"legend2\"><b>Use it to</b></div><div>Show cause and effect: a new feature caused another to disappear.</div><div class=\"legend2\"><b>Sample map</b></div><div class=\"mapfig\"><svg class=\"mm2\" viewBox=\"-2 0 458 162\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><g transform=\"translate(0,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">2000</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"14\" y=\"12\" width=\"110\" height=\"52\" rx=\"3\" fill=\"#cfe8c0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"69.0\" y=\"41.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">park</text><rect x=\"148\" y=\"20\" width=\"58\" height=\"52\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"177.0\" y=\"49.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">school</text><rect x=\"14\" y=\"92\" width=\"130\" height=\"36\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"79.0\" y=\"113.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">houses</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g><g transform=\"translate(230,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">Today</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"14\" y=\"12\" width=\"110\" height=\"52\" rx=\"3\" fill=\"#e3e5ea\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"69.0\" y=\"41.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">car park</text><rect x=\"148\" y=\"20\" width=\"58\" height=\"52\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"177.0\" y=\"49.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">school</text><rect x=\"14\" y=\"92\" width=\"130\" height=\"36\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"79.0\" y=\"113.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">houses</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g></svg></div><div class=\"eg\"><span class=\"tg\">On this map</span><span>A car park was built in the north, which resulted in the disappearance of the park.</span></div><div class=\"legend2\"><b>More examples</b></div><div class=\"eg\"><span class=\"tg\">Example</span><span>A school was built, which resulted in the disappearance of the forest.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>Two tennis courts have been built in the east, which resulted in the disappearance of the forest park.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The temporary exhibition room was moved to the left of the museum and a restaurant was also built nearby. These developments resulted in the disappearance of one of the permanent exhibition rooms.</span></div><div class=\"note\" style=\"margin-top:6px\">Say <b>resulted in the disappearance of</b> (not <s>resulted the disappearance</s>).</div></div><div class=\"card\"><div class=\"exh\">Structure 7 · Where X stood, there is now Y</div><div class=\"formula\">Where X stood, there is / are now Y  =  There is / are now Y, where X stood</div><div class=\"legend2\"><b>Use it to</b></div><div>Say what stands in a place where something else used to be. A very natural map sentence.</div><div class=\"legend2\"><b>Sample map</b></div><div class=\"mapfig\"><svg class=\"mm2\" viewBox=\"-2 0 458 162\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><g transform=\"translate(0,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">2000</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"120\" y=\"14\" width=\"86\" height=\"50\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"163.0\" y=\"42.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">houses</text><rect x=\"14\" y=\"84\" width=\"76\" height=\"46\" rx=\"3\" fill=\"#f8d3b0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"52.0\" y=\"110.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">market</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g><g transform=\"translate(230,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">Today</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"120\" y=\"14\" width=\"86\" height=\"50\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"163.0\" y=\"42.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">houses</text><rect x=\"14\" y=\"84\" width=\"76\" height=\"46\" rx=\"3\" fill=\"#e5d3f0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"52.0\" y=\"110.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">supermarket</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g></svg></div><div class=\"eg\"><span class=\"tg\">On this map</span><span>Where the market stood, there is now a supermarket.</span></div><div class=\"legend2\"><b>More examples</b></div><div class=\"eg\"><span class=\"tg\">Example</span><span>Where the temporary exhibition stood, there were now a cloakroom and shop.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>A café and three further houses stand where the grocer, the baker and the small house were.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>Where the fish market stood, there are now four apartment buildings.</span></div><div class=\"note\" style=\"margin-top:6px\"><b>Stood</b> is for the old feature. <i>there is / are</i> agrees with the new feature.</div></div><div class=\"card\"><div class=\"exh\">Structure 8 · X has gone and in its place is Y</div><div class=\"formula\">X has / had gone and in its place is / was Y</div><div class=\"legend2\"><b>Use it to</b></div><div>Say that something disappeared and something else appeared instead.</div><div class=\"legend2\"><b>Sample map</b></div><div class=\"mapfig\"><svg class=\"mm2\" viewBox=\"-2 0 458 162\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><g transform=\"translate(0,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">2000</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"120\" y=\"14\" width=\"86\" height=\"50\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"163.0\" y=\"42.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">houses</text><rect x=\"14\" y=\"76\" width=\"80\" height=\"52\" rx=\"3\" fill=\"#bcdcf6\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"54.0\" y=\"105.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">pond</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g><g transform=\"translate(230,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">Today</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"120\" y=\"14\" width=\"86\" height=\"50\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"163.0\" y=\"42.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">houses</text><rect x=\"14\" y=\"76\" width=\"80\" height=\"52\" rx=\"3\" fill=\"#cfe8c0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"54.0\" y=\"105.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">playground</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g></svg></div><div class=\"eg\"><span class=\"tg\">On this map</span><span>The pond has gone and in its place there is a playground.</span></div><div class=\"legend2\"><b>More examples</b></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The temporary exhibition room had gone and in its place were the cloakroom and shop.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The fish market and the fishing port have disappeared. In their place, four apartment buildings have been built along the waterfront.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The fishing port has gone and in its place there is now an area of open sea.</span></div><div class=\"note\" style=\"margin-top:6px\"><b>its</b> = one thing, <b>their</b> = more than one.</div></div>"}, {"type": "html", "tab": "Structures 9–11", "html": "<div class=\"card\"><div class=\"exh\">Structure 9 · X is in (place), which was previously occupied by Y</div><div class=\"formula\">X is in (place), which was previously occupied by Y</div><div class=\"legend2\"><b>Use it to</b></div><div>Say where a new feature is and what was there before.</div><div class=\"legend2\"><b>Sample map</b></div><div class=\"mapfig\"><svg class=\"mm2\" viewBox=\"-2 0 458 162\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><g transform=\"translate(0,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">2000</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"120\" y=\"14\" width=\"86\" height=\"50\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"163.0\" y=\"42.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">houses</text><rect x=\"10\" y=\"80\" width=\"72\" height=\"50\" rx=\"3\" fill=\"#f8d3b0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"46.0\" y=\"108.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">bus station</text><rect x=\"120\" y=\"80\" width=\"86\" height=\"50\" rx=\"3\" fill=\"#cfe8c0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"163.0\" y=\"108.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">park</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g><g transform=\"translate(230,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">Today</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"120\" y=\"14\" width=\"86\" height=\"50\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"163.0\" y=\"42.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">houses</text><rect x=\"10\" y=\"80\" width=\"72\" height=\"50\" rx=\"3\" fill=\"#e5d3f0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"46.0\" y=\"108.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">sports hall</text><rect x=\"120\" y=\"80\" width=\"86\" height=\"50\" rx=\"3\" fill=\"#cfe8c0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"163.0\" y=\"108.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">park</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g></svg></div><div class=\"eg\"><span class=\"tg\">On this map</span><span>The sports hall is in the south-west corner, which was previously occupied by the bus station.</span></div><div class=\"legend2\"><b>More examples</b></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The cloakroom and shop were now in the bottom left corner of the map, which was previously occupied by the temporary exhibition room.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>A new restaurant now occupies the south-west corner, where the old ticket office and admin office were.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>Four apartment buildings are along the waterfront, which was previously occupied by the fish market.</span></div><div class=\"note\" style=\"margin-top:6px\">Use <b>previously / formerly</b> and the passive: <i>occupied by</i>.</div></div><div class=\"card\"><div class=\"exh\">Structure 10 · While X remained intact, Y was turned into Z</div><div class=\"formula\">While X remained intact, Y was turned (converted, changed) into Z</div><div class=\"legend2\"><b>Use it to</b></div><div>Contrast what stayed with what was transformed. One sentence gives both.</div><div class=\"legend2\"><b>Sample map</b></div><div class=\"mapfig\"><svg class=\"mm2\" viewBox=\"-2 0 458 162\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><g transform=\"translate(0,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">2000</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"14\" y=\"16\" width=\"78\" height=\"46\" rx=\"3\" fill=\"#e5d3f0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"53.0\" y=\"42.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">library</text><rect x=\"120\" y=\"16\" width=\"86\" height=\"46\" rx=\"3\" fill=\"#f8d3b0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"163.0\" y=\"42.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">old cinema</text><rect x=\"14\" y=\"84\" width=\"192\" height=\"40\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"110.0\" y=\"107.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">houses</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g><g transform=\"translate(230,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">Today</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><rect x=\"14\" y=\"16\" width=\"78\" height=\"46\" rx=\"3\" fill=\"#e5d3f0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"53.0\" y=\"42.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">library</text><rect x=\"120\" y=\"16\" width=\"86\" height=\"46\" rx=\"3\" fill=\"#f5e6a6\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"163.0\" y=\"42.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">café</text><rect x=\"14\" y=\"84\" width=\"192\" height=\"40\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"110.0\" y=\"107.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">houses</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g></svg></div><div class=\"eg\"><span class=\"tg\">On this map</span><span>While the library remained intact, the old cinema was turned into a café.</span></div><div class=\"legend2\"><b>More examples</b></div><div class=\"eg\"><span class=\"tg\">Example</span><span>There were a school and shops in 1990. There are a school and a cinema (instead of shops) now. While the school remained intact, the shops were turned into a new cinema.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>The kitchen and canteen will be converted into two offices, while the storeroom will remain in the same position.</span></div><div class=\"eg\"><span class=\"tg\">Example</span><span>While the hotel remained intact, the row of shops was turned into a restaurant.</span></div><div class=\"note\" style=\"margin-top:6px\"><b>remained intact / unchanged / in the same place</b> for the part that stays. <b>turned / converted / changed into</b> for the part that is transformed.</div></div><div class=\"card\"><div class=\"exh\">Structure 11 · Other alterations included the construction of X, Y and Z</div><div class=\"formula\">Other alterations included the construction / introduction of X, Y and Z</div><div class=\"legend2\"><b>Use it to</b></div><div>Group the smaller changes in one sentence at the end of a paragraph.</div><div class=\"legend2\"><b>Sample map</b></div><div class=\"mapfig\"><svg class=\"mm2\" viewBox=\"-2 0 458 162\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><g transform=\"translate(0,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">2000</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"78\" x2=\"220\" y2=\"78\" stroke=\"#a7afbd\" stroke-width=\"7\" stroke-linecap=\"round\"/><rect x=\"14\" y=\"14\" width=\"70\" height=\"44\" rx=\"3\" fill=\"#d9dce8\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"49.0\" y=\"39.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">school</text><rect x=\"120\" y=\"14\" width=\"86\" height=\"44\" rx=\"3\" fill=\"#cfe8c0\" stroke=\"#6b7690\" stroke-width=\".9\"/><text x=\"163.0\" y=\"39.0\" font-size=\"8.6\" text-anchor=\"middle\" fill=\"#1f2937\">park</text></g><g transform=\"translate(206,2)\"><path d=\"M0 -1 L3.5 11 L0 9 L-3.5 11 Z\" fill=\"#16284f\"/><text x=\"9\" y=\"10\" font-size=\"9\" font-weight=\"700\" fill=\"#16284f\">N</text></g></g><g transform=\"translate(230,0)\"><text x=\"2\" y=\"12\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">Today</text><g transform=\"translate(0,18)\"><rect width=\"220\" height=\"140\" rx=\"6\" fill=\"#fbfcf7\" stroke=\"#8b95a7\" stroke-width=\"1.2\"/><line x1=\"0\" y1=\"78\" x2=\"220 const D={"gmeta": {}, "texts": ["There is X, with Y and Z located … The access to the museum was from the South, with shops to the right and the temporary exhibition room located on the other side of the entrance. The entrance to the museum was from the South, with a huge garden in the middle and a café located in the North. In 1995, there was a diagonal main road, with housing along its western side and a forest park located in the east. Describe the layout: one main feature first, then two more features attached to it.", "X is (place), near which is Y There is a garden, near which is a football stadium. Further from the shop, there was a cloakroom, adjacent to which was a water closet. There was a hotel in the east of the village, near which was a café. Say where a second feature is in relation to the first. The verb comes <b>after</b> the <i>which</i> phrase.", "While X is (place), Y is (place) While the garden occupied the center, the café was in the North. While the auditorium and the main door stayed the same, most other areas were rearranged. While the farmland occupied the north-east, the fish market and the fishing port were in the south. Contrast two areas of the same map in one sentence.", "X is situated / located (place) The garden is located / situated in the center. The vegetation is in the south-west corner, and the railway runs along the eastern edge. The fishing port was situated in the sea, to the south of the fish market. The simple way to give a position. Use it for features that stay the same.", "X replaced Y · Y was replaced by X The cloakroom and shop replaced the temporary exhibition room. The temporary exhibition room was replaced by the cloakroom and shop. The temporary exhibition room made way for the cloakroom and shop. The farmland and the forest park have been replaced by a golf course with two tennis courts. Show that one thing took the place of another. The <b>new</b> thing replaces the <b>old</b> thing.", "X was built, which resulted in the disappearance of Y A school was built, which resulted in the disappearance of the forest. Two tennis courts have been built in the east, which resulted in the disappearance of the forest park. The temporary exhibition room was moved to the left of the museum and a restaurant was also built nearby. These developments resulted in the disappearance of one of the permanent exhibition rooms. Show cause and effect: a new feature caused another to disappear.", "Where X stood, there is now Y Where the temporary exhibition stood, there were now a cloakroom and shop. A café and three further houses stand where the grocer, the baker and the small house were. Where the fish market stood, there are now four apartment buildings. Say what stands in a place where something else used to be. A very natural map sentence.", "X has gone and in its place is Y The temporary exhibition room had gone and in its place were the cloakroom and shop. The fish market and the fishing port have disappeared. In their place, four apartment buildings have been built along the waterfront. The fishing port has gone and in its place there is now an area of open sea. Say that something disappeared and something else appeared instead.", "X is in (place), which was previously occupied by Y The cloakroom and shop were now in the bottom left corner of the map, which was previously occupied by the temporary exhibition room. A new restaurant now occupies the south-west corner, where the old ticket office and admin office were. Four apartment buildings are along the waterfront, which was previously occupied by the fish market. Say where a new feature is and what was there before.", "While X remained intact, Y was turned into Z There were a school and shops in 1990. There are a school and a cinema (instead of shops) now. While the school remained intact, the shops were turned into a new cinema. The kitchen and canteen will be converted into two offices, while the storeroom will remain in the same position. While the hotel remained intact, the row of shops was turned into a restaurant. Contrast what stayed with what was transformed. One sentence gives both.", "Other alterations included the construction of X, Y and Z Other alterations included the construction of fountains and a café sitting area in the garden. Other alterations included the construction of a first aid room, a clinic and a laboratory along the southern edge. Other alterations included the construction of a car park, two tennis courts and two extra houses. Group the smaller changes in one sentence at the end of a paragraph.", "In 1995, there was a diagonal main road, with housing along its western side and a forest park located in the east. While the farmland occupied the north-east, the fish market and the fishing port were in the south. Today, two tennis courts have been built in the east, which resulted in the disappearance of the forest park, and the farmland has been replaced by a golf course. Where the fish market stood, there are now four apartment buildings, and the row of shops has been turned into a restaurant. Other alterations included the construction of a car park beside the hotel and two extra houses. The village of Ryemouth, 1995 and present", "In 1910, the triangle between School Road, London Road and High Street contained a large house surrounded by nine trees, with a grocer and a baker located on its southern edge. By 2010, the large house and the trees had been replaced by five houses. A café and three further houses stand where the grocer, the baker and the small house were. On School Road, a supermarket with a car park has replaced the butcher, and a bank now stands where the house at the northern tip used to be. Other alterations included the construction of seven houses along London Road, where there had been none. Shalton village in 1910 and 2010", "The grass football pitch has been upgraded to an all-weather one with a running track around it. While the swimming pool remained function norm(t){return t.toLowerCase().replace(/[’‘]/g,"'").replace(/[–—]/g,"-").replace(/\$/g,"").replace(/(\d),(?=\d{3}\b)/g,"$1").replace(/\s+/g," ").trim().replace(/[.!]+$/,"")}
function numsOf(t){return (norm(t).match(/\d+(?:\.\d+)?/g)||[]).map(x=>String(parseFloat(x)))}
function toks(t){return (norm(t).match(/[a-z]+/g)||[]).filter(w=>w.length>2&&!STOP.has(w))}
function overlap(model,stu){const m=toks(model),s=toks(stu);if(!m.length)return 1;let c=0;for(const w of m){if(s.some(x=>x.slice(0,4)===w.slice(0,4)))c++}return c/m.length}

function dirsOf(t){const out=[];const s=t.replace(/[’‘]/g,"'");const all=[];let m;
  UP.lastIndex=0;DOWN.lastIndex=0;
  while((m=UP.exec(s)))all.push([m.index,"U",m[0]]);

function buildVocab(D){
  const set=new Set(COMMON.map(w=>w.toLowerCase()));
  const feed=s=>{(String(s).toLowerCase().replace(/<[^>]+>/g," ").match(/[a-z]+/g)||[]).forEach(w=>set.add(w))};
  try{
    for(const k in D.gmeta){const m=D.gmeta[k];feed(m.title);feed(m.unit);(m.series||[]).forEach(feed);(m.sents||[]).forEach(feed)}
    const walk=o=>{if(!o)return;if(typeof o==="string"){feed(o);return}if(Array.isArray(o)){o.forEach(walk);return}if(typeof o==="object"){for(const k in o){if(k==="graphs")continue;walk(o[k])}}};
    for(const k in D){if(k!=="gmeta"&&k!=="graphs")walk(D[k])}
  }catch(e){}
  VOCAB=set;return set}
function stems(w){const o=[w];
  if(w.endsWith("ies"))o.push(w.slice(0,-3)+"y");
  if(w.endsWith("es"))o.push(w.slice(0,-2));
  if(w.endsWith("s"))o.push(w.slice(0,-1));
  if(w.endsWith("ied"))o.push(w.slice(0,-3)+"y");
  if(w.endsWith("ed")){o.push(w.slice(0,-2));o.push(w.slice(0,-1))}
  if(w.endsWith("ing")){o.push(w.slice(0,-3));o.push(w.slice(0,-3)+"e")}
  if(w.endsWith("ly")){o.push(w.slice(0,-2));o.push(w.slice(0,-3)+"y")}
  if(w.endsWith("ally"))o.push(w.slice(0,-4));
  if(w.endsWith("er"))o.push(w.slice(0,-2));
  if(w.endsWith("est"))o.push(w.slice(0,-3));
  if(w.endsWith("ment")||w.endsWith("ness"))o.push(w.slice(0,-4));
  if(/(.)\1ing$/.test(w))o.push(w.slice(0,-4));
  if(/(.)\1ed$/.test(w))o.push(w.slice(0,-3));
  return o}
function known(w){if(VOCAB.has(w))return true;return stems(w).some(s=>VOCAB.has(s))}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function nearWord(w){let best=null,bd=9;const lim=w.length>=8?2:1;
  for(const v of VOCAB){if(v.length<4||Math.abs(v.length-w.length)>lim)continue;if(v[0]!==w[0]&&v[1]!==w[1])continue;const d=lev(w,v);if(d<bd&&d<=lim){bd=d;best=v}}
  return best}

/* ---- sentence-level checks (functions) ---- */
function sentences(t){
  const out=[];const re=/[.!?]\s+(?=[A-Z"“])/g;let last=0,m;const cut=[];
  while((m=re.exec(t)))cut.push([last,m.index+1]),last=m.index+m[0].length;
  cut.push([last,t.length]);
  for(const [a,b] of cut){const raw=t.slice(a,b);const txt=raw.trim();if(txt.length>2&&/[a-z]/i.test(txt))out.push({txt,i:a+raw.indexOf(txt),raw})}
  return out}
const INTRO=/^(after|before|despite|while|although|though|whereas|starting|when|as|since|given)\b/i;

function grammarCheck(text){

    while((m=re.exec(text))){
      if(m[0].length===0){re.lastIndex++;continue}
      if(r.test&&!r.test(m,text,m.index))continue;
      let i=m.index,len=m[0].length;
      if(r.grp){ // highlight the group only
        const g=r.grp===0?m[0]:m[r.grp];if(g===undefined)continue;
        const off=m[0].indexOf(g,r.id==="nofv"?m[1].length:0);i=m.index+(off<0?0:off);len=g.length;if(r.id==="spB"){i=m.index;len=m[0].length}}
      const fix=typeof r.fix==="function"?r.fix(m):r.fix;
      add("grammar",i,len,r.msg,fix,r.why)}
  }
  // sentence-level
  for(const s of sentences(text)){
    const t=s.txt;
    if(/^[a-z]/.test(t)){const w0=(t.match(/^[a-z]+/)||[t[0]])[0];add("grammar",s.i,w0.length,"A sentence starts with a capital letter.",w0[0].toUpperCase()+w0.slice(1),"Capital letter at the start.")}

    const m=text.match(new RegExp("\\b(?:"+SUBJ+")\\s+"+ADV+"(rises|falls|increases|decreases|drops|declines|grows|reaches|climbs|dips|jumps|peaks|remains)\\b","i"));

function styleCheck(text){
  const items=[];
  for(const r of STYLE){const re=new RegExp(r.re.source,r.re.flags.includes("g")?r.re.flags:r.re.flags+"g");let m;
    while((m=re.exec(text))){if(!m[0])continue;
      if(r.id==="cont"&&/'s$/i.test(m[0])&&!/^(it|that|there)'s$/i.test(m[0]))continue;
      items.push({kind:"style",i:m.index,len:m[0].length,msg:r.msg,fix:r.fix,why:r.why})}}

  const dirs=dirsOf(text).filter(d=>!/peak/i.test(d[2]));const cnt={};
  for(const d of dirs){const k=d[2].toLowerCase().replace(/(ed|ing|s|d)$/,"");cnt[k]=(cnt[k]||[]);cnt[k].push(d)}
  for(const k in cnt)if(cnt[k].length>=2){const d=cnt[k][1];items.push({kind:"style",i:d[0],len:d[2].length,msg:"You used ‘"+d[2].toLowerCase()+"’ twice.",fix:"use a synonym: "+(d[1]==="U"?"rose · climbed · grew · went up to":"fell · dropped · declined · dipped"),why:"Varying vocabulary raises your Lexical Resource score."})}
  const words=text.trim().split(/\s+/).length;
  if(words>45)items.push({kind:"style",i:0,len:0,msg:"This sentence is very long ("+words+" words).",fix:"split it into two sentences",why:"Aim for 20–35 words per sentence so the reader does not get lost."});
  if(!/[.!?]\s*$/.test(text.trim()))items.push({kind:"style",i:Math.max(0,text.trimEnd().length-1),len:1,msg:"End the sentence with a full stop.",fix:".",why:"Punctuation is part of accuracy."});
  return items}

function spellCheck(text){
  const items=[];const re=/[A-Za-z][A-Za-z'’-]*/g;let m;const sents=sentences(text);
  while((m=re.exec(text))){const raw=m[0];const w=raw.toLowerCase().replace(/['’]s$/,"");
    if(w.length<4)continue;
    if(MISSP[w]){items.push({kind:"spelling",i:m.index,len:raw.length,msg:"Spelling: ‘"+raw+"’",fix:MISSP[w],why:"Correct spelling: "+MISSP[w]+".",hard:true});continue}
    if(known(w))continue;
    // capitalised word inside a sentence = a name
    const atStart=sents.some(s=>s.i===m.index);
    if(/^[A-Z]/.test(raw)&&!atStart)continue;
    if(w.includes("-"))continue;
    const near=nearWord(w);
    if(near)items.push({kind:"spelling",i:m.index,len:raw.length,msg:"Possible spelling mistake: ‘"+raw+"’",fix:near,why:"Check the spelling. Did you mean ‘"+near+"’?",hard:false})}
  return items}

function noteAnalyze(text,g,which){
  const t=text.trim(),items=[],praise=[];
  if(t.split(/\s+/).length<2)return {ok:false,items:[{kind:"structure",msg:"Write short notes, for example: ‘UK, USA: more tea · Canada, Germany: more coffee’.",why:"Notes help you plan before you write the sentence."}],praise:[],hard:1};
  const entRe=new RegExp("\\b(?:"+(g.ent||"zzzzz")+")","i");
  if(which==="trend"){
    if(!CMP9.test(t)&&!entRe.test(t)&&!/[<>=:]/.test(t))items.push({kind:"structure",msg:"Note the pattern: which group is higher / lower, or which category is the main one. Name the items.",fix:"A: higher in most · exception: B"});
    else praise.push("You noted a pattern.");
    if(hasFig(t))items.push({kind:"facts",msg:"No figures, even in notes. Words like higher / lower / most / least are enough.",why:"Train yourself to see the general pattern."});
  }else{
    if(!DET9.test(t)&&!entRe.test(t))items.push({kind:"structure",msg:"Note ONE or TWO details: the highest and lowest, the ranking, the biggest gap, or the exception.",fix:"X: the highest · Y: the lowest · gap biggest in Z"});

    if(hasFig(t))items.push({kind:"facts",msg:"No figures, even in notes.",why:"Names and words only."});
  }
  const hard=items.filter(x=>["structure","facts"].includes(x.kind));
  return {ok:hard.length===0,items,praise,hard:hard.length}}

const META10=/\b(this paragraph|the next paragraph|in this paragraph|i will|i am going to|will (?:talk|describe|discuss|write)|let us|let's)\b/i;
const SIG10=/\b(focus\w*|begin\w*|start\w*|turn\w*|when it comes to|in terms of|as for|regarding|in contrast|by contrast|conversely|remaining|other|others|larger|bigger|biggest|largest|highest|lowest|smallest|smaller|disparity|gap|differences?|diverg\w*|similar|whereas|while|first|second|next|former|latter|both|pronounced|striking|dominat\w*|led|lead\w*|trail\w*|figures?|categories|countries|groups?|older|younger|oldest|youngest|majority|minority|favour\w*|prefer\w*|strongest|weakest|most|least|higher|lower|more|less)\b/i;
function figsOf(t){const out=[];const re=/\$?\d[\d,]*(?:\.\d+)?/g;let m;while((m=re.exec(t))){const pc=t[m.index+m[0].length]==="%"||t[m.index-1]==="$";if(!pc&&(numOK(t,m)||/\b(?:ages?|aged)\s+(?:of\s+)?(?:[\d,–\-]+\s*(?:and|to|or)?\s*)*$/i.test(t.slice(Math.max(0,m.index-30),m.index))))continue;const raw=m[0].replace(/[$,]/g,"");if(raw==="")continue;out.push({i:m.index,len:m[0].length+(t[m.index+m[0].length]==="%"?1:0),x:parseFloat(raw)})}return out}

    for(const a of vals)for(const b of vals){if(Math.abs(x-Math.abs(a-b)*s)<=tol*s+1e-9&&Math.abs(a-b)>2*tol+0.5)return true}}

function tsAnalyse(text,g,idx){
  const t=text.trim(),items=[],praise=[];const add=(kind,i,len,msg,fix,why)=>items.push({kind,i,len,msg,fix,why});
  const w=t.split(/\s+/).length;
  if(w<6)return {ok:false,items:[{kind:"structure",msg:"Write a full topic sentence: a signpost + the group of items this paragraph covers.",fix:"Focusing on the bigger numbers first, … · When it comes to X and Y, … · In the remaining categories, …",why:"The topic sentence tells the reader what the paragraph is about."}],praise:[],hard:1};
  const ss=sentences(t);
  if(ss.length>1)add("structure",ss[1].i,Math.min(20,ss[1].txt.length),"A topic sentence is ONE sentence. Move the rest into the paragraph.","one sentence: signpost + group","The paragraph follows in the next box.");
  if(/^overall\b/i.test(t))add("structure",0,7,"“Overall” belongs to the overview, not to a body paragraph.","Begin with a signpost: Focusing on … / Turning to … / When it comes to …","Body paragraphs start with a topic sentence, not an overview.");

function bodyAnalyse(text,g,idx){
  const t=text.trim(),items=[],praise=[];const add=(kind,i,len,msg,fix,why)=>items.push({kind,i,len,msg,fix,why});
  const w=t.split(/\s+/).length;
  if(w<20)return {ok:false,items:[{kind:"structure",msg:"Write the whole paragraph: a topic sentence, then 2–4 sentences with figures.",fix:"topic sentence + figures compared in pairs",why:"A body paragraph is about 45–90 words."}],praise:[],hard:1};
  const ss=sentences(t);
  if(/^overall\b/i.test(t))add("structure",0,7,"A body paragraph does not begin with “Overall”. Begin with a topic sentence.","Turning first to … / In contrast, …","Overall belongs to the overview.");
  if(ss.length<3)add("structure",0,0,"Write at least three sentences: a topic sentence and two or more with figures.","topic sentence + 2–4 supporting sentences","Develop the paragraph with figures.");
  if(w<38)items.push({kind:"style",i:0,len:0,msg:"This paragraph is short (about "+w+" words). Aim for 45–90 words.",why:"Add one more pair of figures."});
  if(w>120)items.push({kind:"style",i:0,len:0,msg:"This paragraph is long (about "+w+" words). Cut minor details.",why:"Examiners reward selection, not completeness."});
  const fg=figsOf(t);
  if(fg.length<3)add("structure",0,0,"Give at least three figures from the graph and compare them.","X was 80,000 tonnes, compared with 50,000 for Y","Body paragraphs are the place for the data.");

  if(entCount(t,g)<2)add("structure",0,0,"Name at least two different items from the graph.","use the names of the countries / groups / categories","Say who or what each figure belongs to.");
  if(!/\b(than|whereas|while|compared|against|respectively|in contrast|by contrast|however|similar\w*|both|whilst|as opposed to|but|although|reverse|unlike|twice|half|double)\b/i.test(t))add("structure",0,0,"Compare the figures: use whereas / while / compared with / respectively.","X was …, whereas Y was …","In a comparative graph every sentence should put two figures side by side.");
  ruleItems(t,g,items);
  const first=ss[0]?ss[0].txt:"";
  if(first.split(/\s+/).length<4)add("structure",0,Math.min(first.length,20),"Your first sentence is very short. Make it a real topic sentence: signpost + group.","Turning first to X and Y, …","The first sentence tells the reader what the paragraph covers.");
  const mt=META10.exec(t);if(mt)add("style",mt.index,mt[0].length,"Do not announce the paragraph. Say the content directly.","","Direct writing is stronger.");
  if(!items.some(x=>x.kind==="facts"))praise.push("Your figures and comparisons match the graph.");
  if(fg.length>=3)praise.push("Enough figures to support the paragraph.");
  if(SIG10.test(first))praise.push("The first sentence works as a topic sentence.");
  if(/\b(whereas|while|respectively|compared|in contrast|by contrast)\b/i.test(t))praise.push("Good comparison language.");
  langItems(t,items,praise);return finish(items,praise)}
function noteAnalyse10(text,g){

function itemAnalyse(text,g,idx){

/* a whole map (12.3) */
function mapAnalyse(text,m){
  const t=text.trim(),items=[],praise=[];const add=(kind,i,len,msg,fix,why)=>items.push({kind,i,len,msg,fix,why});
  const w=t.split(/\s+/).length;
  if(w<25)return {ok:false,items:[{kind:"structure",msg:"Write at least four sentences about the changes.",fix:"Use the structure chips.",why:"Each sentence should use a different structure."}],praise:[],hard:1};
  const ss=sentences(t);if(ss.length<4)add("structure",0,0,"Write at least four sentences (you wrote "+ss.length+").","One structure in each sentence.","Four sentences, four structures.");
  if(/^overall\b/i.test(t))add("structure",0,7,"This is the body, not the overview. Start with a map sentence.","","Overviews belong to a different lesson.");
  if(w>170)items.push({kind:"style",i:0,len:0,msg:"Quite long ("+w+" words). Choose the main changes.",why:"Select the main changes; do not describe every detail."});

  else praise.push("Structures used: "+hits.map(k=>k+" ("+STRNAME12[k]+")").join(", ")+".");
  if(entN(t,m.ent)<m.need_ent)add("structure",0,0,"Name at least "+m.need_ent+" features from the map.","use the names on the map","Say what each feature is.");

    s._units=units;
    const tabs=units.filter(u=>!u.inline);
    const sub=document.createElement("div");sub.className="subnav";if(s.subnav&&tabs.length>1)sec.appendChild(sub);
    const host=document.createElement("div");sec.appendChild(host);
    units.forEach((u,ui)=>{const box=document.createElement("div");box.className="unit";box.dataset.u=ui;u.render(ui,box);host.appendChild(box);u.box=box;
      if(s.subnav&&!u.inline&&tabs.length>1)sub.insertAdjacentHTML("beforeend",'<button class="sub" id="u'+si+'_'+ui+'" data-u="'+ui+'">'+esc(u.label)+" <small></small></button>")});
    if(s.subnav&&tabs.length>1){sub.onclick=e=>{const b=e.target.closest(".sub");if(b)showUnit(si,+b.dataset.u,true)}}
    const nb=document.createElement("div");nb.className="nextbar";
    nb.innerHTML=(si>0?'<button class="btn ghost" data-go="'+(si-1)+'">← '+CH.steps[si-1].name+"</button>":"<span></span>")+(si<CH.steps.length-1?'<button class="btn go" data-go="'+(si+1)+'">Next: '+CH.steps[si+1].name+" →</button>":'<span class="wc">This is the last step. Check your progress at the top.</span>');
    nb.onclick=e=>{const b=e.target.closest("[data-go]");if(b){showStep(+b.dataset.go);window.scrollTo(0,0)}};sec.appendChild(nb);
  });
  nav.onclick=e=>{const b=e.target.closest(".step");if(b){showStep(+b.dataset.i);window.scrollTo(0,0)}};
  bindInputs();
}
function showUnit(si,ui,scroll){const s=CH.steps[si];if(!s.subnav)return;ST.unit[si]=ui;
  s._units.forEach((u,k)=>{if(u.inline)return;u.box.style.display=k===ui?"":"none";const b=$("#u"+si+"_"+k);if(b)b.classList.toggle("on",k===ui)});
  $$("svg.chart",s._units[ui].box).forEach(c=>{c.classList.remove("draw");void c.getBoundingClientRect();c.classList.add("draw")});
  if(scroll){const t=$("#sec"+si);window.scrollTo({top:Math.max(0,t.getBoundingClientRect().top+window.scrollY-70)})}save()}
function showStep(si){ST.step=si;CH.steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});
  const b=$("#st"+si);if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"center"});
  const s=CH.steps[si];if(s.subnav)showUnit(si,Math.min(ST.unit[si]||0,s._units.length-1),false);save()}
function applyState(){
  for(const r of REG){const v=ST.saved[r.key];if(v==null||!r.ta)continue;r.ta.value=v;r.tries=ST.tries[r.key]||0;
    if(r.kind==="select"){if(v)runSel(r,false)}else{r.wc();if(ST.ok[r.key]){r.ta.className="ok";setOk(r,true)}}}
  showStep(Math.min(ST.step||0,CH.steps.length-1));progress();sendTexts()}

build();
// load saved progress: from the site (in the frame) or from this browser
let got=false;
window.addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="ielts-lab-state"||d.id!==CH.id)return;if(d.theme)setTheme(d.theme);if(!got){got=true;restore(d.data);if(!d.data)fallback()}});
function fallback(){try{restore(localStorage.getItem("ielts-lab:"+CH.id))}catch(e){}}
showStep(0);progress();
if(inFrame){try{parent.postMessage({type:"ielts-lab-load",id:CH.id},"*")}catch(e){}setTimeout(()=>{if(!got){got=true;fallback()}},900)}else{got=true;fallback()}
})();


</script>
</body>
