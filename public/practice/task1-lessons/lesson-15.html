<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson 15 · Process Sentence Structures · Writing Task 1 · Mr Ikromov's IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Writing Lab — shared look for every chapter (2026-11-07).
   Same colours, shapes and fonts as ieltswithmrikromov.com:
   lapis-to-turquoise band, Unbounded headings, Nunito Sans text,
   rounded rectangles only (12 / 14 / 20 / 28 px), one saffron button. */
:root{
  --ink:#f6f5f1;--panel:#fff;--panel2:#efede6;--line:#e3dfd4;--paper:#17213a;--dim:#3a4560;--mist:#55607a;
  --brass:#2456b0;--onbrass:#fff;--sage:#13807c;--sageT:#e2f2f0;--coral:#b23a48;--coralT:#f8e1e4;--amber:#9a5b12;--amberT:#fbefd9;
  --saffron:#e6a33a;--onsaffron:#17213a;--band:#22489a;
  --chipS:#dfe8fb;--chipSt:#1f4aa0;--chipV:#fbe0e6;--chipVt:#a02a44;--chipL:#fdf0d2;--chipLt:#8a5a0c;--chipN:#dcf3ef;--chipNt:#0f6b66;
  --mark:#fff2b3;--shadow:0 1px 2px rgba(23,33,58,.06),0 6px 18px -10px rgba(23,33,58,.18);
  --gUp:#13807c;--gDown:#b23a48;--gMix:#1f3a75;--g2:#c4622d;--grid:#e8e4da;--gtext:#55607a;
}
:root[data-theme="dark"]{
  --ink:#0f1626;--panel:#172036;--panel2:#1e2944;--line:#2b3858;--paper:#eef0f6;--dim:#c6ccda;--mist:#a3abbf;
  --brass:#7fa6f2;--onbrass:#0f1626;--sage:#7fd6d2;--sageT:#123a3c;--coral:#f29aa6;--coralT:#3e1c22;--amber:#f2c07a;--amberT:#3a2a12;
  --saffron:#f0b95a;--band:#1b3570;
  --chipS:#22335c;--chipSt:#b9cdf7;--chipV:#4a2230;--chipVt:#f5b8c6;--chipL:#453512;--chipLt:#f6d48b;--chipN:#153f3d;--chipNt:#9de3dc;
  --mark:#5a4a12;--shadow:none;
  --gUp:#5fd0c6;--gDown:#f08a99;--gMix:#a9bdf0;--g2:#f2a76b;--grid:#2b3858;--gtext:#a3abbf;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Unbounded,"Nunito Sans",system-ui,sans-serif;letter-spacing:-.01em}
b,strong{font-weight:800}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- band ---- */
.band{color:#fff;background:var(--band);background-image:linear-gradient(115deg,var(--band) 0%,#1f6fae 55%,#1a9bb5 100%);border-radius:0 0 28px 28px;padding:22px 0 20px}
.band .kick{font-size:13px;font-weight:800;opacity:.9;letter-spacing:.02em}
.band h1{margin:6px 0 6px;font-size:28px;line-height:1.15;font-weight:600}
.band p{margin:0;max-width:760px;font-size:15px;opacity:.92}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1;max-width:360px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:999px;transition:width .4s}
.prog b{font-size:14px;white-space:nowrap}

/* ---- step menu ---- */
.steps{position:sticky;top:0;z-index:20;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.steps .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.steps .row::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px}
.step .no{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--panel2);font-size:12px}
.step .ct{font-size:12px;color:var(--mist);font-weight:700}
.step.on{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.step.on .no{background:rgba(255,255,255,.22)}.step.on .ct{color:inherit;opacity:.85}
.step.full .ct{color:var(--sage)}.step.on.full .ct{color:inherit}

main{padding:20px 0 40px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.sec-title h2{margin:0;font-size:21px;font-weight:600}
.sec-title .n{font-family:Unbounded,sans-serif;font-size:13px;color:var(--brass);font-weight:600}
.lead{color:var(--dim);margin:0 0 14px;font-size:15px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600}
.card .ins{color:var(--dim);font-size:14px;margin-bottom:12px}
.note{border-radius:14px;background:var(--panel2);padding:12px 14px;font-size:14.5px;color:var(--dim);margin:0 0 16px}
.note b{color:var(--paper)}

/* ---- sub menu (structures, drills) ---- */
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sub{border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:6px 11px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.sub small{color:var(--mist);font-weight:700}
.sub.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass)}
.sub.full small{color:var(--sage)}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nums .sub{min-width:42px;justify-content:center;font-family:Unbounded,sans-serif;font-weight:600}
.nums .sub.seen:not(.on){background:var(--panel2)}

/* ---- learn panel ---- */
.lhd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lhd .big{font-family:Unbounded,sans-serif;font-size:30px;font-weight:600;color:var(--brass);line-height:1}
.lhd h3{font-size:17px;margin:0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.chip{border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px;white-space:pre}
.chip.s{background:var(--chipS);color:var(--chipSt)}.chip.v{background:var(--chipV);color:var(--chipVt)}
.chip.l{background:var(--chipL);color:var(--chipLt)}.chip.n{background:var(--chipN);color:var(--chipNt)}
.chip.p{padding:4px 2px;color:var(--mist)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mist);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.eg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.eg .tg{flex:0 0 auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);background:var(--panel2);border-radius:8px;padding:2px 7px;height:fit-content;margin-top:2px}
.eg.real .tg{background:var(--sageT);color:var(--sage)}
.eg b{background:var(--chipL);color:var(--chipLt);border-radius:6px;padding:0 3px}
.rule,.trap{border-radius:14px;padding:11px 13px;font-size:14.5px;margin-top:10px}
.rule{background:var(--sageT)}.rule>b:first-child{color:var(--sage)}
.trap{background:var(--coralT)}.trap>b:first-child{color:var(--coral)}
.trap s{color:var(--coral)}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.gcap{font-size:13px;color:var(--mist);margin:6px 2px 0}
.gmodel{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:14.5px;margin-top:8px}
.replay{margin-top:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:5px 11px;font-weight:800;font-size:13px}
.yourturn{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.yourturn h4{margin:0 0 8px;font-size:15px;color:var(--sage)}

table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.t th{text-align:left;background:var(--panel2);padding:9px 12px;font-weight:800}
.t td{padding:9px 12px;border-top:1px solid var(--line)}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mist .x,.mist .v{border-radius:14px;padding:10px 12px;font-size:14.5px}
.mist .x{background:var(--coralT)}.mist .x s{color:var(--coral)}
.mist .v{background:var(--sageT)}

/* ---- charts ---- */
svg.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--gtext);font-size:11px;font-family:"Nunito Sans",system-ui,sans-serif}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .lbl{font-size:11.5px;font-weight:800;font-family:"Nunito Sans",system-ui,sans-serif}
.chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.3s ease-out forwards}
@keyframes dl{to{stroke-dashoffset:0}}
.chart .key{font-size:11.5px;font-weight:700;fill:var(--paper);font-family:"Nunito Sans",system-ui,sans-serif}

/* ---- graph exercise cards ---- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.gcard .gt{font-weight:800;font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gcard .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--panel2);color:var(--mist);border-radius:8px;padding:2px 7px}
.gcard .gt span{font-weight:600;color:var(--mist);font-size:13px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-size:15px;margin-bottom:8px}
.q .p .num{font-weight:800;color:var(--brass);margin-right:6px}
.q .p .tg{display:inline-block;font-size:11px;font-weight:800;background:var(--chipS);color:var(--chipSt);border-radius:8px;padding:1px 7px;margin-right:4px}
.q .p .sm{font-size:13px;color:var(--mist)}
.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:14.5px;margin-bottom:6px}
.wk .l{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}
select.sel{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--paper);min-width:150px}
select.sel.ok{border-color:var(--sage);background:var(--sageT)}select.sel.no{border-color:var(--coral);background:var(--coralT)}

/* ---- input + coach ---- */
.iw{margin-top:6px}
.iw .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--paper);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:62px;outline:none}
textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:8px 16px;font-weight:800;font-size:14px;background:var(--brass);color:var(--onbrass)}
.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:12.5px;color:var(--mist)}
.done-tag{font-size:12.5px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:14px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.fb.on{display:block}
.fb .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px}
.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:12px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:15px;line-height:1.7;margin-bottom:6px}
.ann mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--amber)}
.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:14.5px}
.it .k{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}
.tryit{margin-top:3px;font-weight:800;color:var(--sage)}
.why{margin-top:2px;color:var(--mist);font-size:13.5px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:14.5px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.blockbar .score{font-weight:800;color:var(--dim);font-size:14px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.foot{color:var(--mist);font-size:12.5px;text-align:center;padding:10px 18px 30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);font-weight:800;border-radius:14px;padding:9px 16px;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .band{padding:16px 0 16px;border-radius:0 0 20px 20px}
  .band h1{font-size:22px}
  .band p{font-size:14px}
  .two,.ggrid,.mist{grid-template-columns:1fr}
  .card{padding:14px}
  .step{padding:7px 11px;font-size:13px}
  .sec-title h2{font-size:18px}
  .chip{font-size:13px}
}
@media print{.steps,.irow,.blockbar,.nextbar{display:none}.sec{display:block!important}}


/* ---- Lesson 5 additions ---- */
.gimg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.gimg img{max-width:100%;height:auto;max-height:360px}
.ovl{display:grid;grid-template-columns:1fr;gap:16px}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.ovc .gt{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ovc .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--brass);color:var(--onbrass);border-radius:8px;padding:2px 8px}
.ovc .gt span{font-weight:600;color:var(--mist);font-size:12.5px}
.phr{border-radius:14px;background:var(--amberT);padding:9px 12px;margin:10px 0 4px;font-size:13.5px}
.phr b{color:var(--amber);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.phr i{font-style:normal;font-weight:700;display:inline-block;margin:2px 4px 2px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.clue{font-size:13.5px;color:var(--dim);margin:2px 0 6px}
.clue u{text-decoration:none;font-weight:800;color:var(--paper)}
.step3{display:grid;grid-template-columns:1fr;gap:0}
.iw+.iw{margin-top:12px}
.iw .lab.i{color:#6d4bc2}.iw .lab.t{color:var(--brass)}.iw .lab.d{color:var(--amber)}.iw .lab.o{color:var(--sage)}
:root[data-theme="dark"] .iw .lab.i{color:#c3b0f5}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sent{border-radius:14px;padding:12px 14px;font-size:15px}
.sent .st{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.sent.s1{background:var(--chipS);border:1px solid color-mix(in srgb,var(--chipSt) 35%,transparent)}.sent.s1 .st{color:var(--chipSt)}
.sent.s2{background:var(--amberT);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent)}.sent.s2 .st{color:var(--amber)}
mark.t{background:var(--mark);color:inherit;border-radius:5px;padding:0 3px}
mark.d{background:#ffd9a8;color:#3a2a12;border-radius:5px;padding:0 3px}
:root[data-theme="dark"] mark.d{background:#6a4513;color:#fbe4c4}
.legend2{font-size:13px;color:var(--mist);margin:10px 0}
.stp{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;margin:0 0 8px}
.stp b.n{flex:0 0 auto;font-family:Unbounded,sans-serif;font-size:12px;border-radius:9px;padding:4px 9px;color:#fff;background:var(--brass)}
.stp b.n.d{background:#b7791f}
.stp em{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;color:var(--mist);white-space:nowrap}
ul.kf{list-style:none;margin:6px 0 10px;padding:0;font-size:14.5px}
ul.kf li{margin:3px 0}
ul.kf b.tg{display:inline-block;min-width:54px;text-align:center;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:7px;padding:1px 6px;margin-right:6px;color:#fff;background:var(--brass)}
ul.kf b.tg.d{background:#b7791f}
.exh{font-weight:800;font-size:15px;margin:0 0 6px}
.exov{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:15px;line-height:1.6}
.phg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phg h4{margin:0 0 6px;font-size:14px}
.phg .eg{padding:8px 0}
.q .sel{margin-top:2px}
.why5{border-radius:12px;background:var(--panel2);padding:8px 11px;font-size:14px;margin-top:8px}
@media (max-width:760px){.sc,.phg{grid-template-columns:1fr}.stp em{display:none}}
.gfig{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--panel)}
.gfig-t{font-weight:800;font-size:13.5px;margin-bottom:2px}.gfig-u{font-size:12px;color:var(--mist)}
.gref{color:var(--mist);font-size:12.5px;font-weight:600}
.qg{border:1px solid var(--line);border-radius:12px;padding:6px 10px 4px;margin:6px 0 8px;background:var(--panel);max-width:560px}
.qg svg{display:block}.qgc{font-size:12px;color:var(--mist);margin-top:2px}
.gbox svg{display:block}
.chip.s,.chip.v,.chip.l,.chip.n{white-space:pre-wrap}
.gapgrid{display:grid;grid-template-columns:1fr;gap:0}
.q.g .p{line-height:2.1}
input.gap{font:inherit;border:0;border-bottom:2px solid var(--line);background:transparent;color:inherit;text-align:center;padding:0 2px;margin:0 3px;outline:none;border-radius:4px 4px 0 0}
input.gap:focus{border-bottom-color:var(--brass);background:var(--panel2)}
input.gap.ok{border-bottom-color:var(--sage);background:var(--sageT)}
input.gap.no{border-bottom-color:var(--coral);background:var(--coralT)}
.clue{font-size:13.5px;color:var(--dim);margin:6px 0 0}
.jobs td:first-child{font-weight:700}
.stdy td{vertical-align:top}.stdy td:first-child{font-weight:800;width:92px}
.stdy .two1{color:var(--mist);font-size:13px;margin-bottom:3px}

const CHAPTER={"id": "wt1-lesson15", "kicker": "Writing Task 1 · Lesson 15", "title": "Process <span style=\"color:#ffd27a\">sentence structures</span>", "lead": "Ten structures for describing the steps of a process: the passive, <b>Once</b>, <b>After being</b>, <b>after which</b>, <b>so that</b>, <b>which</b>, <b>where</b>, <b>Having been</b> and <b>before being</b>. Each has a drawn diagram, real examples and its own practice bank. The Writing Coach checks the <b>structure</b>, the <b>order of the steps</b>, the <b>tense</b>, the <b>grammar</b> and the <b>spelling</b>.", "footer": "Mr Ikromov's IELTS · Writing Task 1 · Lesson 15 · Process Sentence Structures. The Writing Coach is a teaching tool: it finds common mistakes and checks the structure and the order of the steps, but it is not an examiner. Another logical answer is accepted; compare with the model after you try.", "steps": [{"no": "15.1", "name": "Learn", "title": "Ten structures for process steps", "subnav": true, "lead": "Read a process, learn each structure with a drawn diagram, see them in five real diagrams.", "blocks": [{"type": "html", "tab": "Read a process", "html": "<p class=\"lead\">A <b>process diagram</b> shows the stages of how something is made or how it works. Describe the stages <b>in order</b>, in the <b>present simple passive</b>.</p><div class=\"card\"><div class=\"exh\">A process in four stages</div><div class=\"mapfig\"><svg class=\"pf\" viewBox=\"0 0 474 86\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><text x=\"6\" y=\"14\" font-size=\"10.5\" font-weight=\"700\" fill=\"#16284f\">How tea is made</text><rect x=\"6\" y=\"24\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"16\" cy=\"27\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"16\" y=\"30.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text><text x=\"54.0\" y=\"46.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Tea leaves are</text><text x=\"54.0\" y=\"57.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">picked</text><line x1=\"105\" y1=\"49\" x2=\"122\" y2=\"49\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M126 49 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"128\" y=\"24\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"138\" cy=\"27\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"138\" y=\"30.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text><text x=\"176.0\" y=\"46.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The leaves are</text><text x=\"176.0\" y=\"57.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">dried</text><line x1=\"227\" y1=\"49\" x2=\"244\" y2=\"49\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M248 49 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"250\" y=\"24\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"260\" cy=\"27\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"260\" y=\"30.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text><text x=\"298.0\" y=\"46.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The leaves are</text><text x=\"298.0\" y=\"57.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">crushed</text><line x1=\"349\" y1=\"49\" x2=\"366\" y2=\"49\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M370 49 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"372\" y=\"24\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"382\" cy=\"27\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"382\" y=\"30.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">4</text><text x=\"420.0\" y=\"52.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The tea is packed</text></svg></div><div class=\"eg\"><span class=\"tg\">Basic</span><span>First, the tea leaves are picked. Then they are dried. Next, they are crushed. Finally, the tea is packed.</span></div><div class=\"eg\"><span class=\"tg\">Better</span><span>The tea leaves are picked and dried, after which they are crushed. <b>Once crushed</b>, the tea is packed.</span></div></div><div class=\"card\"><div class=\"exh\">Three rules</div><ul style=\"margin:4px 0 4px 18px\"><li><b>Passive voice:</b> <i>is / are + past participle</i>. The action matters, not the worker.</li><li><b>Present simple:</b> no dates, so no <i>was / were</i>.</li><li><b>Order:</b> follow the numbers on the diagram, from the first stage to the last.</li></ul></div><div class=\"card\"><div class=\"exh\">Linking the steps</div><div>Beginners write <i>First, Next, Then, Finally</i> in every sentence. A strong answer uses these words only a few times and <b>joins steps with structures</b>.</div><div class=\"eg\"><span class=\"tg\">Linker</span><span>The fish are gutted. Then they are soaked in salt water.</span></div><div class=\"eg\"><span class=\"tg\">Structure</span><span><b>Once gutted</b>, the fish are soaked in salt water.</span></div></div><div class=\"note\">Learn <b>ten structures</b>. Each has a drawn diagram, three real examples and a practice bank. Three different structures in one answer is a good target.</div>"}, {"type": "html", "tab": "Structures 1–4", "html": "<div class=\"card\"><div class=\"exh\">Structure 1 · Passive voice</div><div class=\"formula\">is / are + past participle (V3)</div><div style=\"margin:2px 0 6px\">Use it for <b>most steps</b>: the action matters, not the person who does it.</div><div class=\"mapfig\"><svg class=\"pf\" viewBox=\"0 0 474 100\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><rect x=\"6\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"16\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"16\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text><text x=\"54.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Tea leaves are</text><text x=\"54.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">picked</text><line x1=\"105\" y1=\"33\" x2=\"122\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M126 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"128\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"138\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"138\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text><text x=\"176.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The leaves are</text><text x=\"176.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">dried</text><line x1=\"227\" y1=\"33\" x2=\"244\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M248 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"250\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"260\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"260\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text><text x=\"298.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The leaves are</text><text x=\"298.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">crushed</text><line x1=\"349\" y1=\"33\" x2=\"366\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M370 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"372\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"382\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"382\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">4</text><text x=\"420.0\" y=\"36.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The tea is packed</text><path d=\"M10 61 v5 h454 v-5\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"1.6\"/><text x=\"237.0\" y=\"80\" font-size=\"9.5\" font-weight=\"700\" fill=\"#b45309\" text-anchor=\"middle\">is / are + V3</text></svg></div><div class=\"eg\"><span class=\"tg\">On this diagram</span><span><b>The tea leaves are picked, dried and then crushed.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>Two sentences → one sentence</b></div><div class=\"eg\"><span class=\"tg\">Before</span><span>Workers pick the leaves. Workers dry the leaves.</span></div><div class=\"eg\"><span class=\"tg\">After</span><span><b>The leaves are picked and dried.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>In real diagrams</b></div><div class=\"eg\"><span class=\"tg\">igloo diagram</span><span>First, blocks are cut from hard-packed snow using a snow saw.</span></div><div class=\"eg\"><span class=\"tg\">landfill diagram</span><span>The bottom and sides of the hole are lined with clay and a synthetic lining.</span></div><div class=\"eg\"><span class=\"tg\">coal diagram</span><span>The crushed coal is loaded onto a truck and transported to a gasifier.</span></div><div class=\"note\" style=\"margin-top:6px\">Use the <b>present simple</b> passive (<i>is / are</i>). Do not use <i>was / were</i> when the diagram has no dates.</div></div><div class=\"card\"><div class=\"exh\">Structure 2 · Once + present perfect</div><div class=\"formula\">Once + X <u>has / have been</u> V3, Y is V3</div><div style=\"margin:2px 0 6px\">Two steps one after the other. The first step is <b>finished</b> before the second starts.</div><div class=\"mapfig\"><svg class=\"pf\" viewBox=\"0 0 352 100\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><rect x=\"6\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"16\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"16\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text><text x=\"54.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Wood is cut into</text><text x=\"54.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">chips</text><line x1=\"105\" y1=\"33\" x2=\"122\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M126 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"128\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"138\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"138\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text><text x=\"176.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The chips are</text><text x=\"176.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">boiled</text><line x1=\"227\" y1=\"33\" x2=\"244\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M248 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"250\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"260\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"260\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text><text x=\"298.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The pulp is</text><text x=\"298.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">pressed</text><path d=\"M10 61 v5 h210 v-5\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"1.6\"/><text x=\"115.0\" y=\"80\" font-size=\"9.5\" font-weight=\"700\" fill=\"#b45309\" text-anchor=\"middle\">Once … has been V3, …</text></svg></div><div class=\"eg\"><span class=\"tg\">On this diagram</span><span><b>Once the wood has been cut into chips, it is boiled.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>Two sentences → one sentence</b></div><div class=\"eg\"><span class=\"tg\">Before</span><span>The wood is cut into chips. Then it is boiled.</span></div><div class=\"eg\"><span class=\"tg\">After</span><span><b>Once the wood has been cut into chips, it is boiled.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>In real diagrams</b></div><div class=\"eg\"><span class=\"tg\">coal diagram</span><span>Once the gas has been produced, it travels to a cooling unit, where waste heat is given off.</span></div><div class=\"eg\"><span class=\"tg\">ketchup diagram</span><span>Once the ketchup has been boiled, it is then left for two hours to cool off.</span></div><div class=\"eg\"><span class=\"tg\">leather diagram</span><span>Once an animal skin has been dried, it is taken to the factory.</span></div><div class=\"note\" style=\"margin-top:6px\">Put a comma after the <i>Once</i> clause. The two clauses can have different subjects.</div></div><div class=\"card\"><div class=\"exh\">Structure 3 · Once + past participle</div><div class=\"formula\">Once + V3, X is V3</div><div style=\"margin:2px 0 6px\">The <b>same object</b> in both steps. It is shorter than <i>Once … has been</i>.</div><div class=\"mapfig\"><svg class=\"pf\" viewBox=\"0 0 352 100\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><rect x=\"6\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"16\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"16\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text><text x=\"54.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Tea leaves are</text><text x=\"54.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">picked</text><line x1=\"105\" y1=\"33\" x2=\"122\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M126 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"128\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"138\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"138\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text><text x=\"176.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Tea leaves are</text><text x=\"176.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">dried</text><line x1=\"227\" y1=\"33\" x2=\"244\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M248 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"250\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"260\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"260\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text><text x=\"298.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Tea leaves are</text><text x=\"298.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">crushed</text><path d=\"M132 61 v5 h210 v-5\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"1.6\"/><text x=\"237.0\" y=\"80\" font-size=\"9.5\" font-weight=\"700\" fill=\"#b45309\" text-anchor=\"middle\">Once dried, …</text></svg></div><div class=\"eg\"><span class=\"tg\">On this diagram</span><span><b>Once dried, the tea leaves are crushed.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>Two sentences → one sentence</b></div><div class=\"eg\"><span class=\"tg\">Before</span><span>The tea leaves are dried. Then they are crushed.</span></div><div class=\"eg\"><span class=\"tg\">After</span><span><b>Once dried, the tea leaves are crushed.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>In real diagrams</b></div><div class=\"eg\"><span class=\"tg\">smoked fish diagram</span><span>Once gutted, the fish are soaked in salt water for 30 minutes.</span></div><div class=\"eg\"><span class=\"tg\">smoked fish diagram</span><span>Once smoked, the fish are given a yellow coloring.</span></div><div class=\"eg\"><span class=\"tg\">ketchup diagram</span><span>Once boiled, the ketchup is then left for two hours to cool off.</span></div><div class=\"note\" style=\"margin-top:6px\">The subject after the comma must be the thing that was dried, smoked, gutted… <b>Not</b>: <i>Once dried, the workers crush the leaves.</i></div></div><div class=\"card\"><div class=\"exh\">Structure 4 · After + being + past participle</div><div class=\"formula\">After being V3 / After V-ing, X is V3</div><div style=\"margin:2px 0 6px\">The <b>same object</b> in both steps. Both forms are correct: <i>After being heated</i> and <i>After heating</i>.</div><div class=\"mapfig\"><svg class=\"pf\" viewBox=\"0 0 352 100\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><rect x=\"6\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"16\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"16\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text><text x=\"54.0\" y=\"36.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Rice is washed</text><line x1=\"105\" y1=\"33\" x2=\"122\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M126 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"128\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"138\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"138\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text><text x=\"176.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Rice is cooked in</text><text x=\"176.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">a steamer</text><line x1=\"227\" y1=\"33\" x2=\"244\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M248 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"250\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"260\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"260\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text><text x=\"298.0\" y=\"36.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Rice is served</text><path d=\"M10 61 v5 h210 v-5\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"1.6\"/><text x=\"115.0\" y=\"80\" font-size=\"9.5\" font-weight=\"700\" fill=\"#b45309\" text-anchor=\"middle\">After being washed, …</text></svg></div><div class=\"eg\"><span class=\"tg\">On this diagram</span><span><b>After being washed, the rice is cooked in a steamer.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>Two sentences → one sentence</b></div><div class=\"eg\"><span class=\"tg\">Before</span><span>The mixture is cooled to 9°C for two hours. Then salt is added.</span></div><div class=\"eg\"><span class=\"tg\">After</span><span><b>After being cooled to 9°C for two hours, the mixture has salt added to it.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>In real diagrams</b></div><div class=\"eg\"><span class=\"tg\">smoked fish diagram</span><span>After being soaked in salt water for 30 minutes, the fish are heated for five minutes.</span></div><div class=\"eg\"><span class=\"tg\">cheese diagram</span><span>After being cooled to 9°C for two hours, the mixture has salt added to it.</span></div><div class=\"eg\"><span class=\"tg\">smoked fish diagram</span><span>After smoking, a yellow coloring is added to the fish.</span></div><div class=\"note\" style=\"margin-top:6px\">Use <i>being</i> + V3 (passive) or V-ing (active). <b>Not</b>: <i>After heated, …</i></div></div>"}, {"type": "html", "tab": "Structures 5–7", "html": "<div class=\"card\"><div class=\"exh\">Structure 5 · …, after which …</div><div class=\"formula\">X is V3, <u>after which</u> Y is V3</div><div style=\"margin:2px 0 6px\">The second step <b>starts when the first one ends</b>. Often a new stage of the process.</div><div class=\"mapfig\"><svg class=\"pf\" viewBox=\"0 0 352 100\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><rect x=\"6\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"16\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"16\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text><text x=\"54.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Fish are soaked</text><text x=\"54.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">for 30 minutes</text><line x1=\"105\" y1=\"33\" x2=\"122\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M126 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"128\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"138\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"138\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text><text x=\"176.0\" y=\"25.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The water is</text><text x=\"176.0\" y=\"36.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">heated for 5</text><text x=\"176.0\" y=\"47.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">minutes</text><line x1=\"227\" y1=\"33\" x2=\"244\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M248 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"250\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"260\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"260\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text><text x=\"298.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The fish are</text><text x=\"298.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">dried</text><path d=\"M10 61 v5 h210 v-5\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"1.6\"/><text x=\"115.0\" y=\"80\" font-size=\"9.5\" font-weight=\"700\" fill=\"#b45309\" text-anchor=\"middle\">…, after which …</text></svg></div><div class=\"eg\"><span class=\"tg\">On this diagram</span><span><b>The fish are soaked in salt water for 30 minutes, after which the water is heated for five minutes.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>Two sentences → one sentence</b></div><div class=\"eg\"><span class=\"tg\">Before</span><span>The fish are soaked for 30 minutes. The water is then heated for five minutes.</span></div><div class=\"eg\"><span class=\"tg\">After</span><span><b>The fish are soaked for 30 minutes, after which the water is heated for five minutes.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>In real diagrams</b></div><div class=\"eg\"><span class=\"tg\">smoked fish diagram</span><span>They are then soaked in salt water for 30 minutes, after which the water is heated for five minutes with the fish still inside.</span></div><div class=\"eg\"><span class=\"tg\">cheese diagram</span><span>The mixture is heated to 37°C and mixed for six hours, after which it passes to an evaporation tank.</span></div><div class=\"eg\"><span class=\"tg\">coal diagram</span><span>The gas is burned in a gas power plant, after which the electricity is supplied to homes and a factory.</span></div><div class=\"note\" style=\"margin-top:6px\">Always put a <b>comma</b> before <i>after which</i>. A full clause follows it.</div></div><div class=\"card\"><div class=\"exh\">Structure 6 · … so that …</div><div class=\"formula\">X is V3 <u>so that</u> Y can / will …</div><div style=\"margin:2px 0 6px\">Shows the <b>purpose</b> or the <b>result</b> of a step: why it is done.</div><div class=\"mapfig\"><svg class=\"pf\" viewBox=\"0 0 352 100\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><rect x=\"6\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"16\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"16\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text><text x=\"54.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Large blocks at</text><text x=\"54.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">the bottom</text><line x1=\"105\" y1=\"33\" x2=\"122\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M126 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"128\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"138\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"138\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text><text x=\"176.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Smaller blocks</text><text x=\"176.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">higher up</text><line x1=\"227\" y1=\"33\" x2=\"244\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M248 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"250\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"260\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"260\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text><text x=\"298.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The walls curve</text><text x=\"298.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">inward</text><path d=\"M10 61 v5 h332 v-5\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"1.6\"/><text x=\"176.0\" y=\"80\" font-size=\"9.5\" font-weight=\"700\" fill=\"#b45309\" text-anchor=\"middle\">…, so that …</text></svg></div><div class=\"eg\"><span class=\"tg\">On this diagram</span><span><b>Large blocks are used at the bottom and smaller ones higher up, so that the walls curve inward.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>Two sentences → one sentence</b></div><div class=\"eg\"><span class=\"tg\">Before</span><span>A pipe is inserted through the cover. The gases can then be collected.</span></div><div class=\"eg\"><span class=\"tg\">After</span><span><b>A pipe is inserted through the cover so that the gases can be collected.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>In real diagrams</b></div><div class=\"eg\"><span class=\"tg\">igloo diagram</span><span>…with large blocks used at the bottom and smaller ones higher up, so that the walls curve inward.</span></div><div class=\"eg\"><span class=\"tg\">landfill diagram</span><span>A pipe is then inserted through the cover so that the gases produced by the decomposing waste can be collected and released.</span></div><div class=\"eg\"><span class=\"tg\">igloo diagram</span><span>…air holes are drilled through the interior walls so that fresh air can enter.</span></div><div class=\"note\" style=\"margin-top:6px\">After <i>so that</i> use <b>can / will</b> + verb, or the present simple for a fixed result.</div></div><div class=\"card\"><div class=\"exh\">Structure 7 · …, which …</div><div class=\"formula\">X is V3, <u>which</u> (also) does / produces Y</div><div style=\"margin:2px 0 6px\">Adds <b>extra information</b> about the whole step before it: a result or a side effect.</div><div class=\"mapfig\"><svg class=\"pf\" viewBox=\"0 0 352 100\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><rect x=\"6\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" in a power plant, which also releases waste heat.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>Two sentences → one sentence</b></div><div class=\"eg\"><span class=\"tg\">Before</span><span>The gas is burned in a power plant. The plant also releases waste heat.</span></div><div class=\"eg\"><span class=\"tg\">After</span><span><b>The gas is burned in a power plant, which also releases waste heat.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>In real diagrams</b></div><div class=\"eg\"><span class=\"tg\">coal diagram</span><span>The gas is then burned in a gas power plant, which also releases waste heat.</span></div><div class=\"eg\"><span class=\"tg\">cheese diagram</span><span>…it goes through a filter, which separates the waste water from the thick mixture.</span></div><div class=\"eg\"><span class=\"tg\">igloo diagram</span><span>The builder then fills any gaps in the exterior with loose snow, which makes the walls solid and 2 meters high.</span></div><div class=\"note\" style=\"margin-top:6px\"><i>Which</i> is followed directly by a verb (<i>releases, separates, makes</i>). Do not add a subject.</div></div>"}, {"type": "html", "tab": "Structures 8–10", "html": "<div class=\"card\"><div class=\"exh\">Structure 8 · …, where …</div><div class=\"formula\">X goes to a place, <u>where</u> Y is V3</div><div style=\"margin:2px 0 6px\">A step moves to a <b>place</b> (a tank, a factory) and something happens <b>there</b>.</div><div class=\"mapfig\"><svg class=\"pf\" viewBox=\"0 0 352 100\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><rect x=\"6\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"16\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"16\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text><text x=\"54.0\" y=\"36.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Coal is crushed</text><line x1=\"105\" y1=\"33\" x2=\"122\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M126 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"128\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"138\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"138\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text><text x=\"176.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Coal goes to a</text><text x=\"176.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">gasifier</text><line x1=\"227\" y1=\"33\" x2=\"244\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M248 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"250\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"260\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"260\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text><text x=\"298.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">Coal is converted</text><text x=\"298.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">into gas</text><path d=\"M132 61 v5 h210 v-5\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"1.6\"/><text x=\"237.0\" y=\"80\" font-size=\"9.5\" font-weight=\"700\" fill=\"#b45309\" text-anchor=\"middle\">…, where …</text></svg></div><div class=\"eg\"><span class=\"tg\">On this diagram</span><span><b>The crushed coal is transported to a gasifier, where it is converted into gas.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>Two sentences → one sentence</b></div><div class=\"eg\"><span class=\"tg\">Before</span><span>The gas travels to a cooling unit. Waste heat is given off there.</span></div><div class=\"eg\"><span class=\"tg\">After</span><span><b>The gas travels to a cooling unit, where waste heat is given off.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>In real diagrams</b></div><div class=\"eg\"><span class=\"tg\">coal diagram</span><span>The crushed coal is transported to a gasifier, where it is converted into gas with the help of heat.</span></div><div class=\"eg\"><span class=\"tg\">cheese diagram</span><span>The mixture then passes to an evaporation tank, where it is heated to 100°C for eight hours.</span></div><div class=\"eg\"><span class=\"tg\">landfill diagram</span><span>…trucks dump household waste into the hole, where it builds up above the pipes.</span></div><div class=\"note\" style=\"margin-top:6px\"><i>Where</i> needs a <b>full clause</b>: subject + verb. <b>Not</b>: <i>…a gasifier, where converted into gas.</i></div></div><div class=\"card\"><div class=\"exh\">Structure 9 · Having been + past participle</div><div class=\"formula\">Having been V3, X is V3</div><div style=\"margin:2px 0 6px\">A formal way to say the <b>first step is complete</b>. The <b>same object</b> is the subject of the next step.</div><div class=\"mapfig\"><svg class=\"pf\" viewBox=\"0 0 352 100\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><rect x=\"6\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"16\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"16\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text><text x=\"54.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The pulp is</text><text x=\"54.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">boiled</text><line x1=\"105\" y1=\"33\" x2=\"122\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M126 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"128\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"138\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"138\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text><text x=\"176.0\" y=\"25.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The pulp is</text><text x=\"176.0\" y=\"36.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">cooled for 2</text><text x=\"176.0\" y=\"47.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">hours</text><line x1=\"227\" y1=\"33\" x2=\"244\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M248 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"250\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"260\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"260\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text><text x=\"298.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The ketchup is</text><text x=\"298.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">bottled</text><path d=\"M10 61 v5 h210 v-5\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"1.6\"/><text x=\"115.0\" y=\"80\" font-size=\"9.5\" font-weight=\"700\" fill=\"#b45309\" text-anchor=\"middle\">Having been boiled, …</text></svg></div><div class=\"eg\"><span class=\"tg\">On this diagram</span><span><b>Having been boiled, the pulp is cooled for two hours.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>Two sentences → one sentence</b></div><div class=\"eg\"><span class=\"tg\">Before</span><span>The pulp is boiled. Then it is cooled for two hours.</span></div><div class=\"eg\"><span class=\"tg\">After</span><span><b>Having been boiled, the pulp is cooled for two hours.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>In real diagrams</b></div><div class=\"eg\"><span class=\"tg\">ketchup diagram</span><span>Having been boiled, the ketchup is then left for two hours to cool off.</span></div><div class=\"eg\"><span class=\"tg\">ketchup diagram</span><span>Having been cooled, it is then poured into bottles and labeled.</span></div><div class=\"eg\"><span class=\"tg\">smoked fish diagram</span><span>Having been gutted, the fish are soaked in salt water for 30 minutes.</span></div><div class=\"note\" style=\"margin-top:6px\">Same meaning as <i>Once V3</i>. Use it once in an answer, not in every sentence.</div></div><div class=\"card\"><div class=\"exh\">Structure 10 · Before + being</div><div class=\"formula\">X is V3 <u>before being</u> V3  ·  Before being V3, X is V3</div><div style=\"margin:2px 0 6px\">Says what happens <b>next</b> by looking forward: <i>before</i> a later step.</div><div class=\"mapfig\"><svg class=\"pf\" viewBox=\"0 0 352 100\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Helvetica,Arial,sans-serif\"><rect x=\"6\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"16\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"16\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text><text x=\"54.0\" y=\"30.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The fish are put</text><text x=\"54.0\" y=\"41.5\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">in boxes</text><line x1=\"105\" y1=\"33\" x2=\"122\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M126 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"128\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"138\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"138\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text><text x=\"176.0\" y=\"25.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The fish are</text><text x=\"176.0\" y=\"36.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">loaded onto a</text><text x=\"176.0\" y=\"47.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">truck</text><line x1=\"227\" y1=\"33\" x2=\"244\" y2=\"33\" stroke=\"#d97706\" stroke-width=\"2\"/><path d=\"M248 33 l-7 -4.5 l0 9 z\" fill=\"#d97706\"/><rect x=\"250\" y=\"8\" width=\"96\" height=\"50\" rx=\"7\" fill=\"#eef4ff\" stroke=\"#6b7fb0\" stroke-width=\"1.1\"/><circle cx=\"260\" cy=\"11\" r=\"8.5\" fill=\"#1d4ed8\"/><text x=\"260\" y=\"14.5\" font-size=\"9.5\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text><text x=\"298.0\" y=\"36.0\" font-size=\"8.8\" text-anchor=\"middle\" fill=\"#1f2937\">The truck leaves</text><path d=\"M10 61 v5 h210 v-5\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"1.6\"/><text x=\"115.0\" y=\"80\" font-size=\"9.5\" font-weight=\"700\" fill=\"#b45309\" text-anchor=\"middle\">… before being …</text></svg></div><div class=\"eg\"><span class=\"tg\">On this diagram</span><span><b>The fish are put in boxes before being loaded onto a truck.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>Two sentences → one sentence</b></div><div class=\"eg\"><span class=\"tg\">Before</span><span>The bottles are packed into boxes. Then the boxes are loaded onto a truck.</span></div><div class=\"eg\"><span class=\"tg\">After</span><span><b>The bottles are packed into boxes before being loaded onto a truck.</b></span></div><div class=\"exov\" style=\"margin:6px 0 2px\"><b>In real diagrams</b></div><div class=\"eg\"><span class=\"tg\">ketchup diagram</span><span>The ketchup bottles are packed in boxes before being loaded onto a truck.</span></div><div class=\"eg\"><span class=\"tg\">ketchup diagram</span><span>Before being loaded onto a truck, the ketchup bottles are packed in boxes.</span></div><div class=\"eg\"><span class=\"tg\">smoked fish diagram</span><span>The fish are dried before being smoked.</span></div><div class=\"note\" style=\"margin-top:6px\">In <i>X before being Y</i>, <b>X comes first</b> in time. In <i>Before being Y, X</i> the o le is first dug in the natural rock.</td><td style=\"text-align:center\"><b>1</b></td></tr><tr><td>The bottom and sides of the hole are lined with clay and a synthetic lining, and drainage pipes are laid at the bottom, connected to a drainage tank underneath.</td><td style=\"text-align:center\"><b>1</b></td></tr><tr><td>During the use stage, trucks dump household waste into the hole, where it builds up above the pipes, and any liquid that comes out of the waste flows down through the pipes into the tank.</td><td style=\"text-align:center\"><b>8</b></td></tr><tr><td>When the landfill is full, it is closed by covering the waste with a layer of clay.</td><td style=\"text-align:center\"><b>1</b></td></tr><tr><td>A pipe is then inserted through the cover so that the gases produced by the decomposing waste can be collected and released.</td><td style=\"text-align:center\"><b>1 · 6</b></td></tr></tbody></table></div><div class=\"card\"><div class=\"exh\">The process of making soft cheese</div><div class=\"gimg\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAFdAzQDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAQMEAgcI/8QAXhAAAQMDAQMDDgkHBwoEBgMBAQACAwQFEQYSITETQVEHFBUWIlVhcZKTlLLR0jI2UlNWdIGRoSMzNUJzsbNERVRicoLBFyQlJjRDY2R1hIOVovA3RqTD4fGFo8Li/8QAGgEBAAMBAQEAAAAAAAAAAAAAAAECAwQFBv/EAC4RAQACAQMEAgICAQIHAAAAAAABAhEDEmEEITFRE0EFFCIyFVKRQnGBsdHw8f/aAAwDAQACEQMRAD8A+/IiICIiAiIgIifagIiICIiAiIgIiICIiAic6ICIiAiIgIic6AiIgIiICIiAiIgj77dG2SxV10fEZW0kD5jGDgu2RnGV80p+rc0W+mutfpS60tnndsivBEjBvx0DO8H7ledenGgdQf8AT5vVK+N6X0prTWfUvtNmbWWqk05IS7b2XOqC0SOJBHD4WcfYg+/wVcFRTR1MUjXQyMEjHg7i0jIK2GRoxkgZ4ZPFfCqjR1JeurNUabqautZa6azwZjhmLDIGNa0B3g51z2+zW7WV/wBaO1HX1EclncYaKLrkximjYHAOA5/gt+9B9+LwBknAHHwI2Rj2hzSHA84OV+Z4b7dtQaU0LZ7vcKmK219wlgqqnlC10sbXNDWl3gDjx/wVm1hb6LqeaP1E3St7quWmdBHLR9dcp1m1x3vH6 gn:center\"><b>1</b></td></tr><tr><td>Same steps, other structures: After being cooled to 9°C for two hours, the mixture has salt added to it. · The mixture is heated to 37°C and mixed for six hours, after which it passes to an evaporation tank.</td><td style=\"text-align:center\"><b>4 · 5</b></td></tr></tbody></table></div><div class=\"card\"><div class=\"exh\">Key</div><table class=\"t\"><tbody><tr><td style=\"width:30px\"><b>1</b></td><td>Passive voice</td></tr><tr><td style=\"width:30px\"><b>2</b></td><td>Once + present perfect</td></tr><tr><td style=\"width:30px\"><b>3</b></td><td>Once + past participle</td></tr><tr><td style=\"width:30px\"><b>4</b></td><td>After + being + past participle</td></tr><tr><td style=\"width:30px\"><b>5</b></td><td>…, after which …</td></tr><tr><td style=\"width:30px\"><b>6</b></td><td>… so that …</td></tr><tr><td style=\"width:30px\"><b>7</b></td><td>…, which …</td></tr><tr><td style=\"width:30px\"><b>8</b></td><td>…, where …</td></tr><tr><td style=\"width:30px\"><b>9</b></td><td>Having been + past participle</td></tr><tr><td style=\"width:30px\"><b>10</b></td><td>Before + being</td></tr></tbody></table></div>"}, {"type": "html", "tab": "Which one?", "html": "<p class=\"lead\">Which structure should you choose? Look at what the <b>two steps</b> are.</p><div class=\"card\"><table class=\"t\"><thead><tr><th>The two steps are…</th><th>Use</th></tr></thead><tbody><tr><td>one after another, any objects</td><td><b>1</b> passive · <b>5</b> after which · <b>2</b> Once + has been</td></tr><tr><td>the same object in both steps</td><td><b>3</b> Once + V3 · <b>4</b> After being · <b>9</b> Having been · <b>10</b> before being</td></tr><tr><td>the second step is the <b>purpose</b> of the first</td><td><b>6</b> so that</td></tr><tr><td>the second step is <b>extra information</b> or a side effect</td><td><b>7</b> , which</td></tr><tr><td>the first step moves the material to a <b>place</b></td><td><b>8</b> , where</td></tr><tr><td>you want to say what comes <b>next</b></td><td><b>10</b> before being</td></tr></tbody></table></div><div class=\"note\"><b>Mix them.</b> In one answer use three or four different structures, and keep the passive for the simple steps.</div>"}, {"type": "html", "tab": "Common mistakes", "html": "<p class=\"lead\">Common mistakes in process answers.</p><div class=\"card\"><div class=\"exh\">Fix these</div><table class=\"t\"><thead><tr><th>✗ Wrong</th><th>✓ Correct</th></tr></thead><tbody><tr><td>The blocks cut from snow.</td><td>The blocks <b>are cut</b> from snow.</td></tr><tr><td>Once the gas produced, it travels…</td><td>Once the gas <b>has been produced</b>, it travels… / Once <b>produced</b>, the gas travels…</td></tr><tr><td>After heated, the water is cooled.</td><td>After <b>being heated</b> / After <b>heating</b>, the water is cooled.</td></tr><tr><td>…a gasifier, where converted into gas.</td><td>…a gasifier, where <b>it is converted</b> into gas.</td></tr><tr><td>Once dried, the workers crush the leaves.</td><td>Once dried, the <b>leaves are crushed</b>. (same subject)</td></tr><tr><td>The fish were gutted and then were soaked.</td><td>The fish <b>are</b> gutted and then soaked. (present simple)</td></tr><tr><td>…heated, which waste heat is released.</td><td>…heated, which <b>also releases</b> waste heat.</td></tr><tr><td>…soaked after which the water is heated.</td><td>…soaked<b>,</b> after which the water is heated. (comma)</td></tr></tbody></table></div>"}]}, {"no": "15.2", "name": "Practice bank", "title": "Three drawn items for every structure", "subnav": true, "lead": "Each item has its own diagram. Join the two highlighted steps in one sentence with the structure named.", "blocks": [{"type": "bank", "n": 1, "name": "Passive voice", "label": "1 · Passive voice", "note": "<b>is / are + past participle (V3).</b> Example: <i>The tea leaves are picked, dried and then crushed.</i>"}, {"type": "bank", "n": 2, "name": "Once + present perfect", "label": "2 · Once + present perfect", "note": "<b>Once + X <u>has / have been</u> V3, Y is V3.</b> Example: <i>Once the wood has been cut into chips, it is boiled.</i>"}, {"type": "bank", "n": 3, "name": "Once + past participle", "label": "3 · Once + past participle", "note": "<b>Once + V3, X is V3.</b> Example: <i>Once dried, the tea leaves are crushed.</i>"}, {"type": "bank", "n": 4, "name": "After + being + past participle", "label": "4 · After being", "note": "<b>After being V3 / After V-ing, X is V3.</b> Example: <i>After being washed, the rice is cooked in a steamer.</i>"}, {"type": "bank", "n": 5, "name": "…, after which …", "label": "5 · …, after which …", "note": "<b>X is V3, <u>after which</u> Y is V3.</b> Example: <i>The fish are soaked in salt water for 30 minutes, after which the water is heated for five minutes.</i>"}, {"type": "bank", "n": 6, "name": "… so that …", "label": "6 · … so that …", "note": "<b>X is V3 <u>so that</u> Y can / will ….</b> Example: <i>Large blocks are used at the bottom and smaller ones higher up, so that the walls curve inward.</i>"}, {"type": "bank", "n": 7, "name": "…, which …", "label": "7 · …, which …", "note": "<b>X is V3, <u>which</u> (also) does / produces Y.</b> Example: <i>The gas is burned in a power plant, which also releases waste heat.</i>"}, {"type": "bank", "n": 8, "name": "…, where …", "label": "8 · …, where …", "note": "<b>X goes to a place, <u>where</u> Y is V3.</b> Example: <i>The crushed coal is transported to a gasifier, where it is converted into gas.</i>"}, {"type": "bank", "n": 9, "name": "Having been + past participle", "label": "9 · Having been + past participle", "note": "<b>Having been V3, X is V3.</b> Example: <i>Having been boiled, the pulp is cooled for two hours.</i>"}, {"type": "bank", "n": 10, "name": "Before + being", "label": "10 · Before + being", "note": "<b>X is V3 <u>before being</u> V3  ·  Before being V3, X is V3.</b> Example: <i>The fish are put in boxes before being loaded onto a truck.</i>"}]}, {"no": "15.3", "nam const D={"gmeta": {}, "texts": ["A process diagram shows the stages of how something is made or how it works. Describe the stages in order, in the present simple passive.A process in four stagesHow tea is made1Tea leaves arepicked2The leaves aredried3The leaves arecrushed4The tea is packedBasicFirst, the tea leaves are picked. Then they are dried. Next, they are crushed. Finally, the tea is packed.BetterThe tea leaves are picked and dried, after which they are crushed. Once crushed, the tea is packed.Three rulesPassive voice: is / are + past participle. The action matters, not the worker.Present simple: no dates, so no was / were.Order: follow the numbers on the diagram, from the first stage to the last.Linking the stepsBeginners write First, Next, Then, Finally in every sentence. A strong answer uses these words only a few times and joins steps with structures.LinkerThe fish are gutted. Then they are soaked in salt water.StructureOnce gutted, the fish are soaked in salt water.Learn ten structures. Each has a drawn diagram, three real examples and a practice bank. Three different structures in one answer is a good target.", "Structure 1 · Passive voiceis / are + past participle (V3)Use it for most steps: the action matters, not the person who does it.1Tea leaves arepicked2The leaves aredried3The leaves arecrushed4The tea is packedis / are + V3On this diagramThe tea leaves are picked, dried and then crushed.Two sentences → one sentenceBeforeWorkers pick the leaves. Workers dry the leaves.AfterThe leaves are picked and dried.In real diagramsigloo diagramFirst, blocks are cut from hard-packed snow using a snow saw.landfill diagramThe bottom and sides of the hole are lined with clay and a synthetic lining.coal diagramThe crushed coal is loaded onto a truck and transported to a gasifier.Use the present simple passive (is / are). Do not use was / were when the diagram has no dates.Structure 2 · Once + present perfectOnce + X has / have been V3, Y is V3Two steps one after the other. The first step is finished before the second starts.1Wood is cut intochips2The chips areboiled3The pulp ispressedOnce … has been V3, …On this diagramOnce the wood has been cut into chips, it is boiled.Two sentences → one sentenceBeforeThe wood is cut into chips. Then it is boiled.AfterOnce the wood has been cut into chips, it is boiled.In real diagramscoal diagramOnce the gas has been produced, it travels to a cooling unit, where waste heat is given off.ketchup diagramOnce the ketchup has been boiled, it is then left for two hours to cool off.leather diagramOnce an animal skin has been dried, it is taken to the factory.Put a comma after the Once clause. The two clauses can have different subjects.Structure 3 · Once + past participleOnce + V3, X is V3The same object in both steps. It is shorter than Once … has been.1Tea leaves arepicked2Tea leaves aredried3Tea leaves arecrushedOnce dried, …On this diagramOnce dried, the tea leaves are crushed.Two sentences → one sentenceBeforeThe tea leaves are dried. Then they are crushed.AfterOnce dried, the tea leaves are crushed.In real diagramssmoked fish diagramOnce gutted, the fish are soaked in salt water for 30 minutes.smoked fish diagramOnce smoked, the fish are given a yellow coloring.ketchup diagramOnce boiled, the ketchup is then left for two hours to cool off.The subject after the comma must be the thing that was dried, smoked, gutted… Not: Once dried, the workers crush the leaves.Structure 4 · After + being + past participleAfter being V3 / After V-ing, X is V3The same object in both steps. Both forms are correct: After being heated and After heating.1Rice is washed2Rice is cooked ina steamer3Rice is servedAfter being washed, …On this diagramAfter being washed, the rice is cooked in a steamer.Two sentences → one sentenceBeforeThe mixture is cooled to 9°C for two hours. Then salt is added.AfterAfter being cooled to 9°C for two hours, the mixture has salt added to it.In real diagramssmoked fish diagramAfter being soaked in salt water for 30 minutes, the fish are heated for five minutes.cheese diagramAfter being cooled to 9°C for two hours, the mixture has salt added to it.smoked fish diagramAfter smoking, a yellow coloring is added to the fish.Use being + V3 (passive) or V-ing (active). Not: After heated, …", "Structure 5 · …, after which …X is V3, after which Y is V3The second step starts when the first one ends. Often a new stage of the process.1Fish are soakedfor 30 minutes2The water isheated for 5minutes3The fish aredried…, after which …On this diagramThe fish are soaked in salt water for 30 minutes, after which the water is heated for five minutes.Two sentences → one sentenceBeforeThe fish are soaked for 30 minutes. The water is then heated for five minutes.AfterThe fish are soaked for 30 minutes, after which the water is heated for five minutes.In real diagramssmoked fish diagramThey are then soaked in salt water for 30 minutes, after which the water is heated for five minutes with the fish still inside.cheese diagramThe mixture is heated to 37°C and mixed for six hours, after which it passes to an evaporation tank.coal diagramThe gas is burned in a gas power plant, after which the electricity is supplied to homes and a factory.Always put a comma before after which. A full clause follows it.Structure 6 · … so that …X is V3 so that Y can / will …Shows the purpose or the result of a step: why it is done.1Large blocks atthe bottom2Smaller blockshigher up3The walls curveinward…, so that …On this diagramLarge blocks are used at the bottom and smaller ones higher up, so that the walls curve inward.Two sentences → one sentenceBeforeA pipe is inserted through the cover. The gases can then be collected.AfterA pipe is inserted through the cover so that the gases can be collected.In real diagramsigloo diagram…with large blocks used at the bottom and smaller ones higher up, so that the walls curve inward.landfill diagramA pipe is then inserted through the cover so that the gases produced by the decomposing waste can be collected and released.igloo diagram…air holes are drilled through the interior walls so that fresh air can enter.After so that use can / will + verb, or the present simple for a fixed result.Structure 7 · …, which …X is V3, which (also) does / produces YAdds extra information about the whole step before it: a result or a side effect.1Gas is burned ina power plant2Waste heat isreleased3Electricity goesto homes…, which …On this diagramThe gas is burned in a power plant, which also releases waste heat.Two sentences → one sentenceBeforeThe gas is burned in a power plant. The plant also releases waste heat.AfterThe gas is burned in a power plant, which also releases waste heat.In real diagramscoal diagramThe gas is then burned in a gas power plant, which also releases waste heat.cheese diagram…it goes through a filter, which separates the waste water from the thick mixture.igloo diagramThe builder then fills any gaps in the exterior with loose snow, which makes the walls solid and 2 meters high.Which is followed directly by a verb (releases, separates, makes). Do not add a subject.", "Structure 8 · …, where …X goes to a place, where Y is V3A step moves to a place (a tank, a factory) and something happens there.1Coal is crushed2Coal goes to agasifier3Coal is convertedinto gas…, where …On this diagramThe crushed coal is transported to a gasifier, where it is converted into gas.Two sentences → one sentenceBeforeThe gas travels to a cooling unit. Waste heat is given off there.AfterThe gas travels to a cooling unit, where waste heat is given off.In real diagramscoal diagramThe crushed coal is transported to a gasifier, where it is converted into gas with the help of heat.cheese diagramThe mixture then passes to an evaporation tank, where it is heated to 100°C for eight hours.landfill diagram…trucks dump household waste into the hole, where it builds up above the pipes.Where needs a full clause: subject + verb. Not: …a gasifier, where converted into gas.Structure 9 · Having been + past participleHaving been V3, X is V3A formal way to say the first step is complete. The same object is the subject of the next step.1The pulp isboiled2The pulp iscooled for 2hours3The ketchup isbottledHaving been boiled, …On this diagramHaving been boiled, the pulp is cooled for two hours.Two sentences → one sentenceBeforeThe pulp is boiled. Then it is cooled for two hours.AfterHaving been boiled, the pulp is cooled for two hours.In real diagramsketchup diagramHaving been boiled, the ketchup is then left for two hours to cool off.ketchup diagramHaving been cooled, it is then poured into bottles and labeled.smoked fish diagramHaving been gutted, the fish are soaked in salt water for 30 minutes.Same meaning as Once V3. Use it once in an answer, not in every sentence.Structure 10 · Before + beingX is V3 before being V3  ·  Before being V3, X is V3Says what happens next by looking forward: before a later step.1The fish are putin boxes2The fish areloaded onto atruck3The truck leaves… before being …On this diagramThe fish are put in boxes before being loaded onto a truck.Two sentences → one sentenceBeforeThe bottles are packed into boxes. Then the boxes are loaded onto a truck.AfterThe bottles are packed into boxes before being loaded onto a truck.In real diagramsketchup diagramThe ketchup bottles are packed in boxes before being loaded onto a truck.ketchup diagramBefore being loaded onto a truck, the ketchup bottles are packed in boxes.smoked fish diagramThe fish are dried before being smoked.In X before being Y, X comes first in time. In Before being Y, X the order flips: Y is later, X is earlier.", "Five real process diagrams. The numbers show which structure each sentence uses (see the list below).Producing electricity from coalSentence from the model answerStructureFirst, coal is extracted from a mine and then crushed into small pieces.1The crushed coal is loaded onto a truck and transported to a gasifier, where it is converted into gas with the help of heat.1 · 8Once the gas has been produced, it travels to a cooling unit, where waste heat is given off.2 · 8After cooling, the gas passes through a cleaning stage and is then burned in a gas power plant, which also releases waste heat.4 · 7Finally, the electricity that is generated is supplied to ordinary homes and to a factory.1How an igloo is made out of snowSentence from the model answerStructureFirst, blocks are cut from hard-packed snow using a snow saw.1The blocks are then arranged in a circle about 4 meters across, leaving a gap for the entrance.1Next, further rows are built on top of this circle to form a dome, with large blocks used at the bottom and smaller ones higher up, so that the walls curve inward.1 · 6Once the dome is nearly complete, a final block is placed in the center of the top to close it.2The builder then fills any gaps in the exterior with loose snow, which makes the walls solid and 2 meters high.7After that, the entrance is finished, and finally, air holes are drilled through the interior walls so that fresh air can enter.1 · 6The production of smoked fishSentence from the model answerStructureFirst, the fish are gutted with a knife.1They are then soaked in salt water for 30 minutes, after which the water is heated for five minutes with the fish still inside.5In the fourth stage, the fish are removed and left to dry.1Next, the dried fish are placed in a vat and smoked for 30 minutes, with a wooden lid on top and water at the bottom of the vat.1After smoking, a yellow coloring is added to the fish.4Finally, the fish are put in boxes, and these are loaded onto a truck and transported.1Same steps, other structures: Once gutted, the fish are soaked in salt water for 30 minutes. · The fish are put in boxes before being loaded onto a truck.3 · 10The design of a modern landfillSentence from the model answerStructureIn the construction stage, a large hole is first dug in the natural rock.1The bottom and sides o function norm(t){return t.toLowerCase().replace(/[’‘]/g,"'").replace(/[–—]/g,"-").replace(/\$/g,"").replace(/(\d),(?=\d{3}\b)/g,"$1").replace(/\s+/g," ").trim().replace(/[.!]+$/,"")}

  if(w.endsWith("ing")){o.push(w.slice(0,-3));o.push(w.slice(0,-3)+"e")}
  if(w.endsWith("ly")){o.push(w.slice(0,-2));o.push(w.slice(0,-3)+"y")}

function sentences(t){

function styleCheck(text){
  const items=[];
  for(const r of STYLE){const re=new RegExp(r.re.source,r.re.flags.includes("g")?r.re.flags:r.re.flags+"g");let m;

  if(words>45)items.push({kind:"style",i:0,len:0,msg:"This sentence is very long ("+words+" words).",fix:"split it into two sentences",why:"Aim for 20–35 words per sentence so the reader does not get lost."});
  if(!/[.!?]\s*$/.test(text.trim()))items.push({kind:"style",i:Math.max(0,text.trimEnd().length-1),len:1,msg:"End the sentence with a full stop.",fix:".",why:"Punctuation is part of accuracy."});
