<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson 9 · Overviews for Comparative Charts · Writing Task 1 · Mr Ikromov's IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Writing Lab — shared look for every chapter (2026-11-07).
   Same colours, shapes and fonts as ieltswithmrikromov.com:
   lapis-to-turquoise band, Unbounded headings, Nunito Sans text,
   rounded rectangles only (12 / 14 / 20 / 28 px), one saffron button. */
:root{
  --ink:#f6f5f1;--panel:#fff;--panel2:#efede6;--line:#e3dfd4;--paper:#17213a;--dim:#3a4560;--mist:#55607a;
  --brass:#2456b0;--onbrass:#fff;--sage:#13807c;--sageT:#e2f2f0;--coral:#b23a48;--coralT:#f8e1e4;--amber:#9a5b12;--amberT:#fbefd9;
  --saffron:#e6a33a;--onsaffron:#17213a;--band:#22489a;
  --chipS:#dfe8fb;--chipSt:#1f4aa0;--chipV:#fbe0e6;--chipVt:#a02a44;--chipL:#fdf0d2;--chipLt:#8a5a0c;--chipN:#dcf3ef;--chipNt:#0f6b66;
  --mark:#fff2b3;--shadow:0 1px 2px rgba(23,33,58,.06),0 6px 18px -10px rgba(23,33,58,.18);
  --gUp:#13807c;--gDown:#b23a48;--gMix:#1f3a75;--g2:#c4622d;--grid:#e8e4da;--gtext:#55607a;
}
:root[data-theme="dark"]{
  --ink:#0f1626;--panel:#172036;--panel2:#1e2944;--line:#2b3858;--paper:#eef0f6;--dim:#c6ccda;--mist:#a3abbf;
  --brass:#7fa6f2;--onbrass:#0f1626;--sage:#7fd6d2;--sageT:#123a3c;--coral:#f29aa6;--coralT:#3e1c22;--amber:#f2c07a;--amberT:#3a2a12;
  --saffron:#f0b95a;--band:#1b3570;
  --chipS:#22335c;--chipSt:#b9cdf7;--chipV:#4a2230;--chipVt:#f5b8c6;--chipL:#453512;--chipLt:#f6d48b;--chipN:#153f3d;--chipNt:#9de3dc;
  --mark:#5a4a12;--shadow:none;
  --gUp:#5fd0c6;--gDown:#f08a99;--gMix:#a9bdf0;--g2:#f2a76b;--grid:#2b3858;--gtext:#a3abbf;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Unbounded,"Nunito Sans",system-ui,sans-serif;letter-spacing:-.01em}
b,strong{font-weight:800}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- band ---- */
.band{color:#fff;background:var(--band);background-image:linear-gradient(115deg,var(--band) 0%,#1f6fae 55%,#1a9bb5 100%);border-radius:0 0 28px 28px;padding:22px 0 20px}
.band .kick{font-size:13px;font-weight:800;opacity:.9;letter-spacing:.02em}
.band h1{margin:6px 0 6px;font-size:28px;line-height:1.15;font-weight:600}
.band p{margin:0;max-width:760px;font-size:15px;opacity:.92}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1;max-width:360px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:999px;transition:width .4s}
.prog b{font-size:14px;white-space:nowrap}

/* ---- step menu ---- */
.steps{position:sticky;top:0;z-index:20;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.steps .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.steps .row::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px}
.step .no{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--panel2);font-size:12px}
.step .ct{font-size:12px;color:var(--mist);font-weight:700}
.step.on{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.step.on .no{background:rgba(255,255,255,.22)}.step.on .ct{color:inherit;opacity:.85}
.step.full .ct{color:var(--sage)}.step.on.full .ct{color:inherit}

main{padding:20px 0 40px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.sec-title h2{margin:0;font-size:21px;font-weight:600}
.sec-title .n{font-family:Unbounded,sans-serif;font-size:13px;color:var(--brass);font-weight:600}
.lead{color:var(--dim);margin:0 0 14px;font-size:15px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600}
.card .ins{color:var(--dim);font-size:14px;margin-bottom:12px}
.note{border-radius:14px;background:var(--panel2);padding:12px 14px;font-size:14.5px;color:var(--dim);margin:0 0 16px}
.note b{color:var(--paper)}

/* ---- sub menu (structures, drills) ---- */
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sub{border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:6px 11px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.sub small{color:var(--mist);font-weight:700}
.sub.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass)}
.sub.full small{color:var(--sage)}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nums .sub{min-width:42px;justify-content:center;font-family:Unbounded,sans-serif;font-weight:600}
.nums .sub.seen:not(.on){background:var(--panel2)}

/* ---- learn panel ---- */
.lhd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lhd .big{font-family:Unbounded,sans-serif;font-size:30px;font-weight:600;color:var(--brass);line-height:1}
.lhd h3{font-size:17px;margin:0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.chip{border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px;white-space:pre}
.chip.s{background:var(--chipS);color:var(--chipSt)}.chip.v{background:var(--chipV);color:var(--chipVt)}
.chip.l{background:var(--chipL);color:var(--chipLt)}.chip.n{background:var(--chipN);color:var(--chipNt)}
.chip.p{padding:4px 2px;color:var(--mist)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mist);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.eg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.eg .tg{flex:0 0 auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);background:var(--panel2);border-radius:8px;padding:2px 7px;height:fit-content;margin-top:2px}
.eg.real .tg{background:var(--sageT);color:var(--sage)}
.eg b{background:var(--chipL);color:var(--chipLt);border-radius:6px;padding:0 3px}
.rule,.trap{border-radius:14px;padding:11px 13px;font-size:14.5px;margin-top:10px}
.rule{background:var(--sageT)}.rule>b:first-child{color:var(--sage)}
.trap{background:var(--coralT)}.trap>b:first-child{color:var(--coral)}
.trap s{color:var(--coral)}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.gcap{font-size:13px;color:var(--mist);margin:6px 2px 0}
.gmodel{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:14.5px;margin-top:8px}
.replay{margin-top:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:5px 11px;font-weight:800;font-size:13px}
.yourturn{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.yourturn h4{margin:0 0 8px;font-size:15px;color:var(--sage)}

table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.t th{text-align:left;background:var(--panel2);padding:9px 12px;font-weight:800}
.t td{padding:9px 12px;border-top:1px solid var(--line)}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mist .x,.mist .v{border-radius:14px;padding:10px 12px;font-size:14.5px}
.mist .x{background:var(--coralT)}.mist .x s{color:var(--coral)}
.mist .v{background:var(--sageT)}

/* ---- charts ---- */
svg.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--gtext);font-size:11px;font-family:"Nunito Sans",system-ui,sans-serif}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .lbl{font-size:11.5px;font-weight:800;font-family:"Nunito Sans",system-ui,sans-serif}
.chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.3s ease-out forwards}
@keyframes dl{to{stroke-dashoffset:0}}
.chart .key{font-size:11.5px;font-weight:700;fill:var(--paper);font-family:"Nunito Sans",system-ui,sans-serif}

/* ---- graph exercise cards ---- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.gcard .gt{font-weight:800;font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gcard .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--panel2);color:var(--mist);border-radius:8px;padding:2px 7px}
.gcard .gt span{font-weight:600;color:var(--mist);font-size:13px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-size:15px;margin-bottom:8px}
.q .p .num{font-weight:800;color:var(--brass);margin-right:6px}
.q .p .tg{display:inline-block;font-size:11px;font-weight:800;background:var(--chipS);color:var(--chipSt);border-radius:8px;padding:1px 7px;margin-right:4px}
.q .p .sm{font-size:13px;color:var(--mist)}
.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:14.5px;margin-bottom:6px}
.wk .l{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}
select.sel{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--paper);min-width:150px}
select.sel.ok{border-color:var(--sage);background:var(--sageT)}select.sel.no{border-color:var(--coral);background:var(--coralT)}

/* ---- input + coach ---- */
.iw{margin-top:6px}
.iw .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--paper);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:62px;outline:none}
textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:8px 16px;font-weight:800;font-size:14px;background:var(--brass);color:var(--onbrass)}
.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:12.5px;color:var(--mist)}
.done-tag{font-size:12.5px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:14px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.fb.on{display:block}
.fb .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px}
.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:12px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:15px;line-height:1.7;margin-bottom:6px}
.ann mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--amber)}
.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:14.5px}
.it .k{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}
.tryit{margin-top:3px;font-weight:800;color:var(--sage)}
.why{margin-top:2px;color:var(--mist);font-size:13.5px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:14.5px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.blockbar .score{font-weight:800;color:var(--dim);font-size:14px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.foot{color:var(--mist);font-size:12.5px;text-align:center;padding:10px 18px 30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);font-weight:800;border-radius:14px;padding:9px 16px;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .band{padding:16px 0 16px;border-radius:0 0 20px 20px}
  .band h1{font-size:22px}
  .band p{font-size:14px}
  .two,.ggrid,.mist{grid-template-columns:1fr}
  .card{padding:14px}
  .step{padding:7px 11px;font-size:13px}
  .sec-title h2{font-size:18px}
  .chip{font-size:13px}
}
@media print{.steps,.irow,.blockbar,.nextbar{display:none}.sec{display:block!important}}


/* ---- Lesson 5 additions ---- */
.gimg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.gimg img{max-width:100%;height:auto;max-height:360px}
.ovl{display:grid;grid-template-columns:1fr;gap:16px}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.ovc .gt{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ovc .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--brass);color:var(--onbrass);border-radius:8px;padding:2px 8px}
.ovc .gt span{font-weight:600;color:var(--mist);font-size:12.5px}
.phr{border-radius:14px;background:var(--amberT);padding:9px 12px;margin:10px 0 4px;font-size:13.5px}
.phr b{color:var(--amber);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.phr i{font-style:normal;font-weight:700;display:inline-block;margin:2px 4px 2px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.clue{font-size:13.5px;color:var(--dim);margin:2px 0 6px}
.clue u{text-decoration:none;font-weight:800;color:var(--paper)}
.step3{display:grid;grid-template-columns:1fr;gap:0}
.iw+.iw{margin-top:12px}
.iw .lab.i{color:#6d4bc2}.iw .lab.t{color:var(--brass)}.iw .lab.d{color:var(--amber)}.iw .lab.o{color:var(--sage)}
:root[data-theme="dark"] .iw .lab.i{color:#c3b0f5}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sent{border-radius:14px;padding:12px 14px;font-size:15px}
.sent .st{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.sent.s1{background:var(--chipS);border:1px solid color-mix(in srgb,var(--chipSt) 35%,transparent)}.sent.s1 .st{color:var(--chipSt)}
.sent.s2{background:var(--amberT);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent)}.sent.s2 .st{color:var(--amber)}
mark.t{background:var(--mark);color:inherit;border-radius:5px;padding:0 3px}
mark.d{background:#ffd9a8;color:#3a2a12;border-radius:5px;padding:0 3px}
:root[data-theme="dark"] mark.d{background:#6a4513;color:#fbe4c4}
.legend2{font-size:13px;color:var(--mist);margin:10px 0}
.stp{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;margin:0 0 8px}
.stp b.n{flex:0 0 auto;font-family:Unbounded,sans-serif;font-size:12px;border-radius:9px;padding:4px 9px;color:#fff;background:var(--brass)}
.stp b.n.d{background:#b7791f}
.stp em{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;color:var(--mist);white-space:nowrap}
ul.kf{list-style:none;margin:6px 0 10px;padding:0;font-size:14.5px}
ul.kf li{margin:3px 0}
ul.kf b.tg{display:inline-block;min-width:54px;text-align:center;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:7px;padding:1px 6px;margin-right:6px;color:#fff;background:var(--brass)}
ul.kf b.tg.d{background:#b7791f}
.exh{font-weight:800;font-size:15px;margin:0 0 6px}
.exov{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:15px;line-height:1.6}
.phg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phg h4{margin:0 0 6px;font-size:14px}
.phg .eg{padding:8px 0}
.q .sel{margin-top:2px}
.why5{border-radius:12px;background:var(--panel2);padding:8px 11px;font-size:14px;margin-top:8px}
@media (max-width:760px){.sc,.phg{grid-template-columns:1fr}.stp em{display:none}}
.gfig{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--panel)}
.gfig-t{font-weight:800;font-size:13.5px;margin-bottom:2px}.gfig-u{font-size:12px;color:var(--mist)}
.gref{color:var(--mist);font-size:12.5px;font-weight:600}
.qg{border:1px solid var(--line);border-radius:12px;padding:6px 10px 4px;margin:6px 0 8px;background:var(--panel);max-width:560px}
.qg svg{display:block}.qgc{font-size:12px;color:var(--mist);margin-top:2px}
.gbox svg{display:block}
.chip.s,.chip.v,.chip.l,.chip.n{white-space:pre-wrap}
.gapgrid{display:grid;grid-template-columns:1fr;gap:0}
.q.g .p{line-height:2.1}
input.gap{font:inherit;border:0;border-bottom:2px solid var(--line);background:transparent;color:inherit;text-align:center;padding:0 2px;margin:0 3px;outline:none;border-radius:4px 4px 0 0}
input.gap:focus{border-bottom-color:var(--brass);background:var(--panel2)}
input.gap.ok{border-bottom-color:var(--sage);background:var(--sageT)}
input.gap.no{border-bottom-color:var(--coral);background:var(--coralT)}
.clue{font-size:13.5px;color:var(--dim);margin:6px 0 0}
.jobs td:first-child{font-weight:700}

const CHAPTER={"id": "wt1-lesson09", "kicker": "Writing Task 1 · Lesson 9", "title": "Overviews for <span style=\"color:#ffd27a\">comparative charts</span>", "lead": "Charts with no change over time need a different overview. Learn the formula (pattern, exception, listing), then write the overview for 15 real graphs. The Writing Coach checks the <b>structure</b>, the <b>comparisons</b>, the <b>facts</b>, the <b>grammar</b> and the <b>spelling</b>, and explains every mistake.", "footer": "Mr Ikromov's IELTS · Writing Task 1 · Lesson 9 · Overviews for Comparative Charts. The Writing Coach is a teaching tool: it finds common mistakes and explains them, but it is not an examiner. It cannot read the graph for you: compare your answer with the model after you try.", "steps": [{"no": "9.1", "name": "Learn", "title": "The comparative overview", "subnav": true, "lead": "Two sentences again: the <b>pattern</b> (with its exception), then a <b>listing</b> or the biggest and smallest figures.", "blocks": [{"type": "html", "tab": "Formula", "html": "<div class=\"sc\"><div class=\"sent s1\"><div class=\"st\">Sentence 1 · the pattern (must)</div><b>Overall,</b> + what is true for <b>most</b> categories: <i>A was higher than B in most categories</i>. Add the <b>exception</b> if there is one: <i>with the exception of C</i> · <i>whereas the reverse is true for D</i>.</div><div class=\"sent s2\"><div class=\"st\">Sentence 2 · complementary detail (one or two)</div><b>It is also clear that</b> + <b>one</b> of these:<br>• a <b>listing</b>: biggest → smallest<br>• the <b>highest</b> and the <b>lowest</b> figures<br>• the <b>biggest gap</b> between categories, or items that are <b>similar</b></div></div><div class=\"note\"><b>No change over time.</b> These graphs show one moment, so the overview is about <b>patterns and differences</b>, not about rising and falling. Look for these two things: <b>1 · a pattern</b> (is something true for most categories? name the exception) and <b>2 · a listing</b> (rank the items from biggest to smallest: it works well with pie charts).</div><div class=\"trap\" style=\"margin-top:12px\"><b>Do not</b><br>• Write <b>figures</b> (numbers, percentages, amounts). Age groups and years are fine.<br>• Use <b>change verbs</b> (<s>rose</s>, <s>fell</s>, <s>increased</s>) when there are no years.<br>• Write <s>What stands out from the graph is that…</s> Begin with <b>Overall,</b><br>• Describe <b>only one</b> category: the overview covers the whole graph.</div><div class=\"legend2\"><mark class=\"t\">Yellow</mark> = the pattern (sentence 1) &nbsp; <mark class=\"d\">Orange</mark> = complementary detail (sentence 2)</div>"}, {"type": "html", "tab": "Key features", "html": "<p class=\"lead\">Do not write the overview in one go. First list the <b>key features</b>. Then put them into the two sentences.</p><div class=\"stp\"><b class=\"n\">Step 1</b><span>Read the title. <b>What is compared?</b> Two groups (men / women)? Several categories? Several countries?</span><em>look</em></div><div class=\"stp\"><b class=\"n\">Step 2</b><span>Compare the groups in <b>every</b> category. Is one group <b>higher in most</b> of them?</span><em>Sentence 1</em></div><div class=\"stp\"><b class=\"n\">Step 3</b><span>Find the <b>exception</b>: the category where the pattern is reversed or different.</span><em>Sentence 1</em></div><div class=\"stp\"><b class=\"n d\">Step 4</b><span><b>Rank</b> the items: which is the highest? Which is the lowest? Where is the <b>gap</b> biggest? Which items are <b>similar</b>?</span><em>Sentence 2</em></div><div class=\"stp\"><b class=\"n\">Step 5</b><span>Write the two sentences. Choose <b>one or two</b> details only. No figures.</span><em>write</em></div><div class=\"legend2\"><mark class=\"t\">Yellow</mark> = the pattern (sentence 1) &nbsp; <mark class=\"d\">Orange</mark> = complementary detail (sentence 2)</div><div class=\"note\"><b>Tip.</b> If you cannot find a pattern, use the <b>listing</b>: biggest → smallest. Pie charts almost always need a listing.</div>"}, {"type": "html", "tab": "Four examples", "html": "<p class=\"lead\">Each example shows the key features and the overview. Notice: <b>pattern first, detail second, no figures</b>.</p><div class=\"card\"><div class=\"exh\">Example 1 · Weekend hours by activity, women and men <span class=\"mtag\">Pattern + exception</span></div><div class=\"two\"><div class=\"gimg\"><svg viewBox=\"0 0 560 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Hours spent on five weekend activities\" style=\"width:100%;height:auto;font-family:Carlito,Calibri,Arial,sans-serif\"><text x=\"280.0\" y=\"16\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"currentColor\">Hours spent on five weekend activities</text><line x1=\"44\" y1=\"198.0\" x2=\"550\" y2=\"198.0\" stroke=\"#d5dbe6\" stroke-width=\"1\"/><text x=\"38\" y=\"202.0\" text-anchor=\"end\" font-size=\"10.5\" fill=\"currentColor\">0</text><line x1=\"44\" y1=\"164.4\" x2=\"550\" y2=\"164.4\" stroke=\"#d5dbe6\" stroke-width=\"1\"/><text x=\"38\" y=\"168.4\" text-anchor=\"end\" font-size=\"10.5\" fill=\"currentColor\">1</text><line x1=\"44\" y1=\"130.8\" x2=\"550\" y2=\"130.8\" stroke=\"#d5dbe6\" stroke-width=\"1\"/><text x=\"38\" y=\"134.8\" text-anchor=\"end\" font-size=\"10.5\" fill=\"currentColor\">2</text><line x1=\"44\" y1=\"97.2\" x2=\"550\" y2=\"97.2\" stroke=\"#d5dbe6\" stroke-width=\"1\"/><text x=\"38\" y=\"101.2\" text-anchor=\"end\" font-size=\"10.5\" fill=\"currentColor\">3</text><line x1=\"44\" y1=\"63.6\" x2=\"550\" y2=\"63.6\" stroke=\"#d5dbe6\" stroke-width=\"1\"/><text x=\"38\" y=\"67.6\" text-anchor=\"end\" font-size=\"10.5\" fill=\"currentColor\">4</text><line x1=\"44\" y1=\"30.0\" x2=\"550\" y2=\"30.0\" stroke=\"#d5dbe6\" stroke-width=\"1\"/><text x=\"38\" y=\"34.0\" text-anchor=\"end\" font-size=\"10.5\" fill=\"currentColor\">5</text><rect x=\"60.1\" y=\"80.4\" width=\"31.1\" height=\"117.6\" fill=\"#1d4ed8\"/><rect x=\"93.2\" y=\"147.6\" width=\"31.1\" height=\"50.4\" fill=\"#d97706\"/><text x=\"94.2\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">Cooking</text><rect x=\"160.5\" y=\"97.2\" width=\"31.1\" height=\"100.8\" fill=\"#1d4ed8\"/><rect x=\"193.6\" y=\"130.8\" width=\"31.1\" height=\"67.2\" fill=\"#d97706\"/><text x=\"194.6\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">Shopping</text><rect x=\"260.9\" y=\"63.6\" width=\"31.1\" height=\"134.4\" fill=\"#1d4ed8\"/><rect x=\"294.0\" y=\"114.0\" width=\"31.1\" height=\"84.0\" fill=\"#d97706\"/><text x=\"295.0\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">Childcare</text><rect x=\"361.3\" y=\"130.8\" width=\"31.1\" height=\"67.2\" fill=\"#1d4ed8\"/><rect x=\"394.4\" y=\"63.6\" width=\"31.1\" height=\"134.4\" fill=\"#d97706\"/><text x=\"395.4\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">Sport</text><rect x=\"461.7\" y=\"114.0\" width=\"31.1\" height=\"84.0\" fill=\"#1d4ed8\"/><rect x=\"494.8\" y=\"130.8\" width=\"31.1\" height=\"67.2\" fill=\"#d97706\"/><text x=\"495.8\" y=\"213\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">Reading</text><line x1=\"44\" y1=\"198\" x2=\"550\" y2=\"198\" stroke=\"#8a93a0\"/><text x=\"12\" y=\"114.0\" font-size=\"10.5\" fill=\"currentColor\" transform=\"rotate(-90 12 114.0)\" text-anchor=\"middle\">hours</text><rect x=\"190.0\" y=\"230\" width=\"11\" height=\"11\" fill=\"#1d4ed8\"/><text x=\"205.0\" y=\"239\" font-size=\"11.5\" fill=\"currentColor\">Women</text><rect x=\"290.0\" y=\"230\" width=\"11\" height=\"11\" fill=\"#d97706\"/><text x=\"305.0\" y=\"239\" font-size=\"11.5\" fill=\"currentColor\">Men</text></svg></div><div><div class=\"legend2\" style=\"margin-top:0\"><b>Key features</b></div><ul class=\"kf\"><li><b class=\"tg\">Pattern</b>Women: more time on cooking, shopping, childcare, reading</li><li><b class=\"tg\">Pattern</b>Exception: sport (men more)</li><li><b class=\"tg d\">Detail</b>Biggest figure for women: childcare; for men: sport</li></ul><div class=\"legend2\" style=\"margin-bottom:4px\"><b>Overview</b></div><div class=\"exov\"><mark class=\"t\">Overall, women devoted more time than men to most of the activities, with sport being the notable exception.</mark> It is also clear that <mark class=\"d\">childcare was the greatest commitment for women, whereas sport occupied the most time for men.</mark></div></div></div></div><div class=\"card\"><div class=\"exh\">Example 2 · How students travel to college (%) <span class=\"mtag\">Listing</span></div><div class=\"two\"><div class=\"gimg\"><svg viewBox=\"0 0 560 250\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Students&rsquo; main means of transport\" style=\"width:100%;height:auto;font-family:Carlito,Calibri,Arial,sans-serif\"><text x=\"280.0\" y=\"16\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"currentColor\">Students&rsquo; main means of transport</text><path d=\"M170,135 L170.0,50.0 A85,85 0 0 1 228.2,197.0 Z\" fill=\"#1d4ed8\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"219.0\" y=\"119.6\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">38%</text><rect x=\"330\" y=\"62\" width=\"12\" height=\"12\" fill=\"#1d4ed8\"/><text x=\"350\" y=\"73\" font-size=\"12.5\" fill=\"currentColor\">Bus</text><path d=\"M170,135 L228.2,197.0 A85,85 0 0 1 101.2,185.0 Z\" fill=\"#d97706\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"165.0\" y=\"191.5\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">27%</text><rect x=\"330\" y=\"88\" width=\"12\" height=\"12\" fill=\"#d97706\"/><text x=\"350\" y=\"99\" font-size=\"12.5\" fill=\"currentColor\">Walking</text><path d=\"M170,135 L101.2,185.0 A85,85 0 0 1 91.0,103.7 Z\" fill=\"#0f6b75\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"117.7\" y=\"145.6\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">16%</text><rect x=\"330\" y=\"114\" width=\"12\" height=\"12\" fill=\"#0f6b75\"/><text x=\"350\" y=\"125\" font-size=\"12.5\" fill=\"currentColor\">Car</text><path d=\"M170,135 L91.0,103.7 A85,85 0 0 1 129.1,60.5 Z\" fill=\"#7c3aed\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"130.5\" y=\"104.1\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">11%</text><rect x=\"330\" y=\"140\" width=\"12\" height=\"12\" fill=\"#7c3aed\"/><text x=\"350\" y=\"151\" font-size=\"12.5\" fill=\"currentColor\">Bicycle</text><path d=\"M170,135 L129.1,60.5 A85,85 0 0 1 170.0,50.0 Z\" fill=\"#94a3b8\" stroke=\"#fff\" stroke-width=\"1.5\"/><text x=\"156.9\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#fff\">8%</text><rect x=\"330\" y=\"166\" width=\"12\" height=\"12\" fill=\"#94a3b8\"/><text x=\"350\" y=\"177\" font-size=\"12.5\" fill=\"currentColor\">Train</text></svg></div><div><div class=\"legend2\" style=\"margin-top:0\"><b>Key features</b></div><ul class=\"kf\"><li><b class=\"tg\">Pattern</b>Rank: bus &gt; walking &gt; car &gt; bicycle &gt; train</li><li><b class=\"tg d\">Detail</b>Bus and walking: far ahead of the rest</li><li><b class=\"tg d\">Detail</b>Train: the smallest</li></ul><div class=\"legend2\" style=\"margin-bottom:4px\"><b>Overview</b></div><div class=\"exov\"><mark class=\"t\">Overall, the bus was by far the preferred mode of transport, followed by walking and the car, while the train was used by the fewest students.</mark> It is also clear that <mark class=\"d\">the bus and walking together comfortably outweighed the other three modes.</mark></div></div></div></div><div class=\"card\"><div class=\"exh\">Example 3 · Daily internet use by age group (%) <span class=\"mtag\">Pattern + exception</span></div><div class=\"two\"><div class=\"gimg\"><table class=\"gtab\"><thead><tr><th>Activity</th><th>Aged 18&ndash;34</th><th>Aged 55+</th></tr></thead><tbody><tr><td>Social media</td><td>85</td><td>32</td></tr><tr><td>Streaming video</td><td>78</td><td>30</td></tr><tr><td>Online shopping</td><td>61</td><td>45</td></tr><tr><td>Reading the news</td><td>52</td><td>60</td></tr><tr><td>Email</td><td>90</td><td>88</td></tr></tbody></table></div><div><div class=\"legend2\" style=\"margin-top:0\"><b>Key features</b></div><ul class=\"kf\"><li><b class=\"tg\">Pattern</b>Younger: higher in most activities</li><li><b class=\"tg\">Pattern</b>Exception: reading the news (older higher)</li><li><b class=\"tg d\">Detail</b>Biggest gap: social media</li><li><b class=\"tg d\">Detail</b>Email: almost the same</li></ul><div class=\"legend2\" style=\"margin-bottom:4px\"><b>Overview</b></div><div class=\"exov\"><mark class=\"t\">Overall, younger people engaged in most online activities considerably more than their older counterparts, with the exception of reading the news.</mark> It is also clear that <mark class=\"d\">the disparity was most striking for social media, whereas email use was virtually identical across the two groups.</mark></div></div></div></div><div class=\"card\"><div class=\"exh\">Example 4 · Average monthly rent in five cities ($) <span class=\"mtag\">Listing</span></div><div class=\"two\"><div class=\"gimg\"><svg viewBox=\"0 0 560 192\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Average monthly rent ($)\" style=\"width:100%;height:auto;font-family:Carlito,Calibri,Arial,sans-serif\"><text x=\"280.0\" y=\"15\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"currentColor\">Average monthly rent ($)</text><line x1=\"96\" y1=\"24\" x2=\"96\" y2=\"186\" stroke=\"#8a93a0\"/><text x=\"88\" y=\"44\" text-anchor=\"end\" font-size=\"12.5\" fill=\"currentColor\">Sydney</text><rect x=\"96\" y=\"28\" width=\"360.7\" height=\"22\" rx=\"2\" fill=\"#1d4ed8\"/><text x=\"462.7\" y=\"44\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">2,400</text><text x=\"88\" y=\"76\" text-anchor=\"end\" font-size=\"12.5\" fill=\"currentColor\">Melbourne</text><rect x=\"96\" y=\"60\" width=\"300.6\" height=\"22\" rx=\"2\" fill=\"#1d4ed8\"/><text x=\"402.6\" y=\"76\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">2,000</text><text x=\"88\" y=\"108\" text-anchor=\"end\" font-size=\"12.5\" fill=\"currentColor\">Brisbane</text><rect x=\"96\" y=\"92\" width=\"255.5\" height=\"22\" rx=\"2\" fill=\"#1d4ed8\"/><text x=\"357.5\" y=\"108\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">1,700</text><text x=\"88\" y=\"140\" text-anchor=\"end\" font-size=\"12.5\" fill=\"currentColor\">Perth</text><rect x=\"96\" y=\"124\" width=\"248.0\" height=\"22\" rx=\"2\" fill=\"#1d4ed8\"/><text x=\"350.0\" y=\"140\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">1,650</text><text x=\"88\" y=\"172\" text-anchor=\"end\" font-size=\"12.5\" fill=\"currentColor\">Adelaide</text><rect x=\"96\" y=\"156\" width=\"210.4\" height=\"22\" rx=\"2\" fill=\"#1d4ed8\"/><text x=\"312.4\" y=\"172\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">1,400</text></svg></div><div><div class=\"legend2\" style=\"margin-top:0\"><b>Key features</b></div><ul class=\"kf\"><li><b class=\"tg\">Pattern</b>Rank: Sydney &gt; Melbourne &gt; Brisbane &gt; Perth &gt; Adelaide</li><li><b class=\"tg d\">Detail</b>Sydney: the highest, Adelaide: the lowest</li><li><b class=\"tg d\">Detail</b>Brisbane and Perth: almost equal</li></ul><div class=\"legend2\" style=\"margin-bottom:4px\"><b>Overview</b></div><div class=\"exov\"><mark class=\"t\">Overall, rent was highest in Sydney and lowest in Adelaide, with Melbourne occupying second place.</mark> It is also clear that <mark class=\"d\">Brisbane and Perth were virtually level, and that Sydney was markedly more expensive than every other city.</mark></div></div></div></div>"}, {"type": "html", "tab": "Phrases", "html": "<div class=\"phg\"><div><h4>Pattern and exception (sentence 1)</h4><div class=\"eg\"><span class=\"tg\">Pattern</span><span>X <b>exceeded / outnumbered</b> Y <b>in every / almost every category</b>.</span></div><div class=\"eg\"><span class=\"tg\">Pattern</span><span>X was <b>consistently higher</b> than Y <b>regardless of</b> …</span></div><div class=\"eg\"><span class=\"tg\">Pattern</span><span>X was higher than Y <b>in all but one</b> category.</span></div><div class=\"eg\"><span class=\"tg\">Pattern</span><span>X and Y were <b>similar</b>, <b>whereas</b> Z <b>differed considerably</b>.</span></div><div class=\"eg\"><span class=\"tg\">Exception</span><span>… <b>with the exception of</b> Z / <b>except for</b> Z / <b>apart from</b> Z.</span></div><div class=\"eg\"><span class=\"tg\">Exception</span><span><b>While</b> X was higher in A and B, <b>the reverse is true for</b> C.</span></div><div class=\"eg\"><span class=\"tg\">Contrast</span><span>Group 1 preferred A, <b>whereas</b> Group 2 preferred B.</span></div></div><div><h4>Listing, extremes and gaps (sentence 2)</h4><div class=\"eg\"><span class=\"tg\">Listing</span><span>X was <b>the most popular</b>, <b>followed by</b> Y and Z, whereas W was <b>the least</b> common.</span></div><div class=\"eg\"><span class=\"tg\">Listing</span><span>X <b>accounted for the largest share</b>, while Y was <b>the smallest</b>.</span></div><div class=\"eg\"><span class=\"tg\">Extreme</span><span>X was <b>by far the highest</b> / <b>stood out</b> as the leader.</span></div><div class=\"eg\"><span class=\"tg\">Extreme</span><span>The <b>vast majority</b> / <b>a small minority</b> of …</span></div><div class=\"eg\"><span class=\"tg\">Gap</span><span><b>The gap was widest</b> / <b>narrowest</b> in X.</span></div><div class=\"eg\"><span class=\"tg\">Gap</span><span>X and Y were <b>roughly equal</b> / <b>almost the same</b>.</span></div></div></div><div class=\"note\" style=\"margin-top:10px\"><b>Tense.</b> A graph with a past date (2007, 2010) needs the <b>past simple</b>: <i>were, earned, imported</i>. A graph with no date can use the present simple.</div>"}, {"type": "html", "tab": "Weak vs strong", "html": "<p class=\"lead\">Compare wea ies facilities satisfied", "Overall, women devoted more time than men to most of the activities, with sport being the notable exception. It is also clear that childcare was the greatest commitment for women, whereas sport occupied the most time for men. Weekend hours by activity, women and men", "Overall, the bus was by far the preferred mode of transport, followed by walking and the car, while the train was used by the fewest students. It is also clear that the bus and walking together comfortably outweighed the other three modes. How students travel to college (%)", "Overall, younger people engaged in most online activities considerably more than their older counterparts, with the exception of reading the news. It is also clear that the disparity was most striking for social media, whereas email use was virtually identical across the two groups. Daily internet use by age group (%)", "Overall, rent was highest in Sydney and lowest in Adelaide, with Melbourne occupying second place. It is also clear that Brisbane and Perth were virtually level, and that Sydney was markedly more expensive than every other city. Average monthly rent in five cities ($)", "Overall, tea was the more popular product in the UK and the USA, while coffee was preferred in Canada and Germany. It is also clear that the gap between the two drinks was widest in the UK.", "Overall, bottled water was consumed more than soft drinks in two countries only, Italy and Germany. It is also clear that Japan had the lowest consumption of both drinks.", "Overall, doctors were better paid than other workers everywhere. It is also clear that American doctors earned by far the most of all, whereas Finnish doctors earned the least.", "Overall, men took in more salt than women at every age. It is also clear that the gap was biggest among teenagers and smallest among the youngest children, and that almost everyone was above the recommended level.", "Overall, the proportion of adults with a high school education wa function sentences(t){

function styleCheck(text){
  const items=[];
  for(const r of STYLE){const re=new RegExp(r.re.source,r.re.flags.includes("g")?r.re.flags:r.re.flags+"g");let m;

  if(words>45)items.push({kind:"style",i:0,len:0,msg:"This sentence is very long ("+words+" words).",fix:"split it into two sentences",why:"Aim for 20–35 words per sentence so the reader does not get lost."});
  if(!/[.!?]\s*$/.test(text.trim()))items.push({kind:"style",i:Math.max(0,text.trimEnd().length-1),len:1,msg:"End the sentence with a full stop.",fix:".",why:"Punctuation is part of accuracy."});

function spellCheck(text){
  const items=[];const re=/[A-Za-z][A-Za-z'’-]*/g;let m;const sents=sentences(text);
  while((m=re.exec(text))){const raw=m[0];const w=raw.toLowerCase().replace(/['’]s$/,"");
    if(w.length<4)continue;
    if(MISSP[w]){items.push({kind:"spelling",i:m.index,len:raw.length,msg:"Spelling: ‘"+raw+"’",fix:MISSP[w],why:"Correct spelling: "+MISSP[w]+".",hard:true});continue}
    if(known(w))continue;
    // capitalised word inside a sentence = a name
    const atStart=sents.some(s=>s.i===m.index);
    if(/^[A-Z]/.test(raw)&&!atStart)continue;
    if(w.includes("-"))continue;
    const near=nearWord(w);
    if(near)items.push({kind:"spelling",i:m.index,len:raw.length,msg:"Possible spelling mistake: ‘"+raw+"’",fix:near,why:"Check the spelling. Did you mean ‘"+near+"’?",hard:false})}
  return items}

/* ===== Overview coach (Lesson 5) ===== */
const UP2=/\b(gain\w*|expand\w*|more popular|more widespread|more common|widespread|higher than|ended higher|ended up|edged up\w*|upward\w*|growth|surg\w*)\b/gi;
const DOWN2=/\b(los[et]|lower|disappear\w*|ended lower|less popular|less common|edged down\w*|lag\w*|below)\b/gi;
const STABLE=/\b(stable|stability|unchanged|same level|same as|remained|stayed|constant|steady|steadily|level|flat|no change|did not change|almost the same|broadly)\b/i;
const DET=/\b(most|least|biggest|largest|smallest|highest|lowest|greatest|fastest|slowest|dramatic\w*|overtook|overtake\w*|overtaken|gap|narrow\w*|widen\w*|outnumber\w*|dominant|consistently|every year|throughout|remained the|ended as|became the|far more|far fewer|by far|substantial\w*|sharpest|steepest|replace\w*|exceed\w*|surpass\w*|leading|main source|stands? out|stood out|majority|larger|smaller|more than|fewer than|disappear\w*|biggest|only)\b/i;
function dset(s){

  for(const re of [UP,UP2]){re.lastIndex=0;while((m=re.exec(t))){if(!/peak/i.test(m[0]))d.add("U")}}
  for(const re of [DOWN,DOWN2]){re.lastIndex=0;while((m=re.exec(t)))d.add("D")}

function numOK(t,m){const w=m[0];
  if(/%$/.test(w))return false;
  if(/^(19|20|21)\d\d$/.test(w))return true;                       // years: 1960, 2050
  const i=m.index,end=i+w.length,after=t.slice(end,end+28);

  const UNIT=/^\s*(million|thousand|billion|tonnes?|percent|per cent|units?|dollars?|euros?|pounds?|kg|litres?)\b/i;

function hasFig(t){const re=/\d+(?:[.,]\d+)*%?/g;let m;while((m=re.exec(t))){if(!numOK(t,m))return true}return false}
function splitOv(t){const ss=sentences(t);return ss}

  if(g.nc){const c=CHG9.exec(t);if(c)add("facts",c.index,c[0].length,"This graph shows one moment in time, so nothing ‘"+c[0]+"’. Compare the categories instead.","higher than · lower than · more · less · the largest","Change verbs (rose, fell, increased) are for graphs with years. Here compare: X was higher than Y.")}
  // detail
  if(s2){const entRe=new RegExp("\\b(?:"+(g.ent||"zzzzz")+")","i");
    if(!DET9.test(s2)&&!entRe.test(s2))add("structure",ss[1].i,0,"Sentence 2 needs a complementary detail: a listing, the biggest and smallest, or the gap.","X was the highest, followed by Y · the gap was widest in Z","Look for: the highest and lowest, the biggest gap, an exception.")}
  // accuracy
  const wrong=[];for(const rule of (RULES9[g.key]||[])){if(clauseHit(t,rule)&&!wrong.includes(rule[1])){wrong.push(rule[1]);
    const mm=rule[0].exec(t);add("facts",mm?mm.index:0,mm?Math.min(mm[0].length,40):0,rule[1],"look at the graph again and compare the bars / slices / cells","Accuracy is part of Task Achievement.")}}
  // capital letters
  for(const w of String(g.ent||"").split("|")){if(!/^[A-Z][a-z]+(?: [A-Z][a-z]+)*$/.test(w))continue;
    const lo=new RegExp("\\b"+w.toLowerCase()+"\\b","g");let mm2;while((mm2=lo.exec(t))){if(t.slice(mm2.index,mm2.index+w.length)===w)continue;add("grammar",mm2.index,w.length,"Names of countries and places start with a capital letter.",w,"Capital letters: Egypt, the United States, South Africa.")}}
  {const hh=/\b[Hh]ospital [abc]\b|\b[Cc]ountry [ab]\b|\bhospital [ABC]\b/g;let q;while((q=hh.exec(t))){add("grammar",q.index,q[0].length,"Names and labels are capitalised: Hospital A, Country B.","Hospital A · Country B","Capital letters for labels.")}}
  // praise
  if(starts)praise.push("Sentence 1 begins with “Overall,” as in the formula.");
  if(!hasFig(t)&&ss.length>=2)praise.push("No figures: it is a true overview.");
  if(!items.some(x=>x.kind==="facts"&&/Check the/.test(x.msg||"")))praise.push("Your comparisons match the graph.");
  if(s2&&!items.some(x=>(x.msg||"").startsWith("Sentence 2")))praise.push("Sentence 2 adds a complementary detail.");
  if(/\b(whereas|while|although|however|in contrast|by contrast|the reverse|with the exception|except for|apart from)\b/i.test(t))praise.push("Good contrast language.");
  const gr=grammarCheck(t),sp=spellCheck(t),st=styleCheck(t);
  items.push(...gr,...sp.filter(x=>!gr.some(y=>y.i===x.i)),...st);
  if(!gr.length&&!sp.some(x=>x.hard))praise.push("No grammar errors found in the rules I check.");
  const hard=items.filter(x=>["structure","facts","grammar","tense"].includes(x.kind)||(x.kind==="spelling"&&x.hard));
  return {ok:hard.length===0,items,praise,hard:hard.length}}
function noteAnalyze(text,g,which){
  const t=text.trim(),items=[],praise=[];
  if(t.split(/\s+/).length<2)return {ok:false,items:[{kind:"structure",msg:"Write short notes, for example: ‘UK, USA: more tea · Canada, Germany: more coffee’.",why:"Notes help you plan before you write the sentence."}],praise:[],hard:1};
  const entRe=new RegExp("\\b(?:"+(g.ent||"zzzzz")+")","i");
  if(which==="trend"){
    if(!CMP9.test(t)&&!entRe.test(t)&&!/[<>=:]/.test(t))items.push({kind:"structure",msg:"Note the pattern: which group is higher / lower, or which category is the main one. Name the items.",fix:"A: higher in most · exception: B"});
    else praise.push("You noted a pattern.");
    if(hasFig(t))items.push({kind:"facts",msg:"No figures, even in notes. Words like higher / lower / most / least are enough.",why:"Train yourself to see the general pattern."});
  }else{
    if(!DET9.test(t)&&!entRe.test(t))items.push({kind:"structure",msg:"Note ONE or TWO details: the highest and lowest, the ranking, the biggest gap, or the exception.",fix:"X: the highest · Y: the lowest · gap biggest in Z"});
    else praise.push("You chose a detail for sentence 2.");
    if(hasFig(t))items.push({kind:"facts",msg:"No figures, even in notes.",why:"Names and words only."});
  }
  const hard=items.filter(x=>["structure","facts"].includes(x.kind));
  return {ok:hard.length===0,items,praise,hard:hard.length}}

function plain(h){return String(h||"").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").replace(/&rarr;/g,"→").replace(/&hellip;/g,"…").replace(/&ndash;/g,"–").replace(/&amp;/g,"&")}
function mkInput(spec){

    '<textarea id="'+id+'" data-noreport="1" rows="'+(spec.rows||2)+'" placeholder="'+(spec.ph||"Write here…")+'" spellcheck="false" autocomplete="off" autocapitalize="sentences"></textarea>'+
    '<div class="irow"><button class="btn" data-a="check">Check</button><button class="btn ghost" data-a="hint">Hint</button><span class="wc" id="wc'+id+'"></span><span class="done-tag" id="dt'+id+'"></span></div>'+

const KIND={structure:"Structure",facts:"Facts",warn:"Check",grammar:"Grammar",tense:"Tense",spelling:"Spelling",style:"Style"};
const isHard=x=>["structure","facts","grammar","tense","warn"].includes(x.kind)||(x.kind==="spelling"&&x.hard);
function annotate(text,items){const sp=items.filter(x=>x.len>0&&x.kind!=="warn").slice().sort((a,b)=>a.i-b.i);let out="",pos=0;
  for(const s of sp){if(s.i<pos)continue;out+=esc(text.slice(pos,s.i))+'<mark class="'+s.kind+'" title="'+esc(s.msg)+'">'+esc(text.slice(s.i,s.i+s.len))+"</mark>";pos=s.i+s.len}

function itemHTML(x){return '<div class="it '+x.kind+'"><div><span class="k">'+(KIND[x.kind]||"")+"</span>"+esc(x.msg)+(x.fix?'<div class="tryit">Try: '+esc(x.fix)+"</div>":"")+(x.why?'<div class="why">'+esc(x.why)+"</div>":"")+"</div></div>"}
function fbHTML(r,text,reg){
  const hard=r.items.filter(isHard),soft=r.items.filter(x=>!isHard(x)&&(x.kind==="spelling"||x.kind==="style"));
  const has=k=>r.items.some(x=>(k==="grammar"?["grammar","tense"].includes(x.kind):x.kind===k)&&(k!=="spelling"||x.hard));
  const verdict=r.ok?(soft.length?"✓ Correct — now polish it":"✓ Excellent! Accurate and correct"):(hard.length<=1?"Almost there — fix 1 thing":"Keep going — "+hard.length+" things to fix");
  const m=(l,bad)=>'<span class="'+(bad?"no":"ok")+'">'+(bad?"✗ ":"✓ ")+l+"</span>";
  let h='<div class="hd"><span class="vd">'+verdict+'</span><div class="meter">'+m("Structure",has("structure"))+m("Facts",has("facts")||r.items.some(x=>x.kind==="warn"))+m("Grammar",has("grammar"))+m("Spelling",has("spelling"))+'</div></div><div class="body">';
  h+='<div class="ann">'+annotate(text,r.items)+"</div>";
  if(hard.length)h+='<div class="grp">Fix these first</div>'+hard.map(itemHTML).join("");
  if(soft.length)h+='<div class="grp">Polish</div>'+soft.map(itemHTML).join("");
  if(r.praise.length)h+='<div class="grp">What you did well</div>'+r.praise.map(p=>'<div class="it praise"><div><span class="k">Good</span>'+esc(p)+"</div></div>").join("");
  if(reg.model){const show=r.ok||reg.tries>=2;h+=show?'<div class="mdl"><b>Model answer:</b> '+esc(reg.model)+"</div>":'<div class="irow"><button class="btn ghost" data-a="model">Show model answer</button><span class="wc">or try once more first</span></div>'}

function runCheck(reg,count){
  const t=(reg.ta.value||"").trim();
  if(!t){reg.fb.className="fb";reg.ta.className="";setOk(reg,false);return}
  if(count){reg.tries=(reg.tries||0)+1;ST.tries[reg.key]=reg.tries}
  let r;try{r=reg.check(t)}catch(e){r={ok:false,items:[{kind:"structure",msg:"The checker had a problem with this sentence. Try writing it again."}],praise:[]}}
  reg.ta.className=r.ok?"ok":"no";
  const hardN=r.items.filter(isHard).length;
  reg.fb.className="fb on "+(r.ok?"good":hardN<=1?"mid":"bad");reg.fb.innerHTML=fbHTML(r,t,reg);
  const was=reg.ok;setOk(reg,r.ok);if(r.ok&&!was&&count&&reg.counted)toast(reg.tries===1?"Correct on the first try!":"Correct — well done!");
  save()}
function setOk(reg,ok){reg.ok=ok;if(ok)ST.ok[reg.key]=1;else delete ST.ok[reg.key];const dt=document.getElementById("dt"+reg.id);if(dt)dt.textContent=ok&&reg.counted?"✓ Done":"";
  if(reg.kind==="select"){}progress()}
function bindInputs(root){
  for(const reg of REG){if(reg.kind!=="write"||reg.bound)continue;reg.ta=document.getElementById(reg.id);if(!reg.ta)continue;reg.bound=true;reg.fb=document.getElementById("f"+reg.id);
    const wc=document.getElementById("wc"+reg.id);reg.wc=()=>{const w=(reg.ta.value.trim().match(/\S+/g)||[]).length;wc.textContent=w?w+" words":""};
    reg.ta.addEventListener("input",()=>{ST.saved[reg.key]=reg.ta.value;reg.wc();if(reg.ok){setOk(reg,false);reg.ta.className=""}save();sendTexts()});
    reg.ta.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runCheck(reg,true)}});
    document.getElementById("w"+reg.id).addEventListener("click",e=>{const a=e.target.closest("[data-a]");if(!a)return;
      if(a.dataset.a==="check")runCheck(reg,true);
      else if(a.dataset.a==="hint"){const h=document.getElementById("h"+reg.id);h.innerHTML=reg.hint||"Write one clear sentence.";h.classList.toggle("on")}
      else if(a.dataset.a==="model"){reg.tries=Math.max(reg.tries,2);runCheck(reg,false)}})}}

      if(c){const sm=c.querySelector("small");if(sm)sm.textContent=rr.length?oo+"/"+rr.length:"";c.classList.toggle("full",rr.length>0&&oo===rr.length)}})});
  const k=ok+"/"+tot;if(inFrame&&k!==lastPost){lastPost=k;try{parent.postMessage({type:"ielts-workshop-score",score:ok,max:tot,parts:parts.slice(0,8),qs:[]},"*")}catch(e){}}}

function gOf(ref){if(typeof ref==="number"){return DATA.G[ref-1]}const m=DATA.META[ref];return Object.assign({key:ref,intro:"",img:DATA.LI[ref]},m)}
const CHIPS_OV='<div class="chiprow"><span class="chip s">Overall,</span><span class="chip v">the main PATTERN (+ the exception)</span></div><div class="chiprow"><span class="chip l">It is also clear that</span><span class="chip n">listing · highest and lowest · the biggest gap</span></div>';

function runSel(r,count){const v=r.ta.value;if(!v){r.fb.className="fb";r.ta.className="sel";setOk(r,false);return}

  bindInputs();
}
function showUnit(si,ui,scroll){const s=CH.steps[si];if(!s.subnav)return;ST.unit[si]=ui;
  s._units.forEach((u,k)=>{if(u.inline)return;u.box.style.display=k===ui?"":"none";const b=$("#u"+si+"_"+k);if(b)b.classList.toggle("on",k===ui)});
  $$("svg.chart",s._units[ui].box).forEach(c=>{c.classList.remove("draw");void c.getBoundingClientRect();c.classList.add("draw")});
  if(scroll){const t=$("#sec"+si);window.scrollTo({top:Math.max(0,t.getBoundingClientRect().top+window.scrollY-70)})}save()}
function showStep(si){ST.step=si;CH.steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});
  const b=$("#st"+si);if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"center"});
  const s=CH.steps[si];if(s.subnav)showUnit(si,Math.min(ST.unit[si]||0,s._units.length-1),false);save()}
function applyState(){
  for(const r of REG){const v=ST.saved[r.key];if(v==null||!r.ta)continue;r.ta.value=v;r.tries=ST.tries[r.key]||0;
    if(r.kind==="select"){if(v)runSel(r,false)}else{r.wc();if(ST.ok[r.key]){r.ta.className="ok";setOk(r,true)}}}
  showStep(Math.min(ST.step||0,CH.steps.length-1));progress();sendTexts()}

build();
// load saved progress: from the site (in the frame) or from this browser
let got=false;
window.addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="ielts-lab-state"||d.id!==CH.id)return;if(d.theme)setTheme(d.theme);if(!got){got=true;restore(d.data);if(!d.data)fallback()}});
function fallback(){try{restore(localStorage.getItem("ielts-lab:"+CH.id))}catch(e){}}
showStep(0);progress();
if(inFrame){try{parent.postMessage({type:"ielts-lab-load",id:CH.id},"*")}catch(e){}setTimeout(()=>{if(!got){got=true;fallback()}},900)}else{got=true;fallback()}
})();


</script>
</body>
