<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson 11 · Natural Comparison; Surveys, Money and Age · Writing Task 1 · Mr Ikromov's IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Writing Lab — shared look for every chapter (2026-11-07).
   Same colours, shapes and fonts as ieltswithmrikromov.com:
   lapis-to-turquoise band, Unbounded headings, Nunito Sans text,
   rounded rectangles only (12 / 14 / 20 / 28 px), one saffron button. */
:root{
  --ink:#f6f5f1;--panel:#fff;--panel2:#efede6;--line:#e3dfd4;--paper:#17213a;--dim:#3a4560;--mist:#55607a;
  --brass:#2456b0;--onbrass:#fff;--sage:#13807c;--sageT:#e2f2f0;--coral:#b23a48;--coralT:#f8e1e4;--amber:#9a5b12;--amberT:#fbefd9;
  --saffron:#e6a33a;--onsaffron:#17213a;--band:#22489a;
  --chipS:#dfe8fb;--chipSt:#1f4aa0;--chipV:#fbe0e6;--chipVt:#a02a44;--chipL:#fdf0d2;--chipLt:#8a5a0c;--chipN:#dcf3ef;--chipNt:#0f6b66;
  --mark:#fff2b3;--shadow:0 1px 2px rgba(23,33,58,.06),0 6px 18px -10px rgba(23,33,58,.18);
  --gUp:#13807c;--gDown:#b23a48;--gMix:#1f3a75;--g2:#c4622d;--grid:#e8e4da;--gtext:#55607a;
}
:root[data-theme="dark"]{
  --ink:#0f1626;--panel:#172036;--panel2:#1e2944;--line:#2b3858;--paper:#eef0f6;--dim:#c6ccda;--mist:#a3abbf;
  --brass:#7fa6f2;--onbrass:#0f1626;--sage:#7fd6d2;--sageT:#123a3c;--coral:#f29aa6;--coralT:#3e1c22;--amber:#f2c07a;--amberT:#3a2a12;
  --saffron:#f0b95a;--band:#1b3570;
  --chipS:#22335c;--chipSt:#b9cdf7;--chipV:#4a2230;--chipVt:#f5b8c6;--chipL:#453512;--chipLt:#f6d48b;--chipN:#153f3d;--chipNt:#9de3dc;
  --mark:#5a4a12;--shadow:none;
  --gUp:#5fd0c6;--gDown:#f08a99;--gMix:#a9bdf0;--g2:#f2a76b;--grid:#2b3858;--gtext:#a3abbf;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Unbounded,"Nunito Sans",system-ui,sans-serif;letter-spacing:-.01em}
b,strong{font-weight:800}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- band ---- */
.band{color:#fff;background:var(--band);background-image:linear-gradient(115deg,var(--band) 0%,#1f6fae 55%,#1a9bb5 100%);border-radius:0 0 28px 28px;padding:22px 0 20px}
.band .kick{font-size:13px;font-weight:800;opacity:.9;letter-spacing:.02em}
.band h1{margin:6px 0 6px;font-size:28px;line-height:1.15;font-weight:600}
.band p{margin:0;max-width:760px;font-size:15px;opacity:.92}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1;max-width:360px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:999px;transition:width .4s}
.prog b{font-size:14px;white-space:nowrap}

/* ---- step menu ---- */
.steps{position:sticky;top:0;z-index:20;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.steps .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.steps .row::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px}
.step .no{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--panel2);font-size:12px}
.step .ct{font-size:12px;color:var(--mist);font-weight:700}
.step.on{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.step.on .no{background:rgba(255,255,255,.22)}.step.on .ct{color:inherit;opacity:.85}
.step.full .ct{color:var(--sage)}.step.on.full .ct{color:inherit}

main{padding:20px 0 40px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.sec-title h2{margin:0;font-size:21px;font-weight:600}
.sec-title .n{font-family:Unbounded,sans-serif;font-size:13px;color:var(--brass);font-weight:600}
.lead{color:var(--dim);margin:0 0 14px;font-size:15px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600}
.card .ins{color:var(--dim);font-size:14px;margin-bottom:12px}
.note{border-radius:14px;background:var(--panel2);padding:12px 14px;font-size:14.5px;color:var(--dim);margin:0 0 16px}
.note b{color:var(--paper)}

/* ---- sub menu (structures, drills) ---- */
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sub{border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:6px 11px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.sub small{color:var(--mist);font-weight:700}
.sub.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass)}
.sub.full small{color:var(--sage)}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nums .sub{min-width:42px;justify-content:center;font-family:Unbounded,sans-serif;font-weight:600}
.nums .sub.seen:not(.on){background:var(--panel2)}

/* ---- learn panel ---- */
.lhd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lhd .big{font-family:Unbounded,sans-serif;font-size:30px;font-weight:600;color:var(--brass);line-height:1}
.lhd h3{font-size:17px;margin:0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.chip{border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px;white-space:pre}
.chip.s{background:var(--chipS);color:var(--chipSt)}.chip.v{background:var(--chipV);color:var(--chipVt)}
.chip.l{background:var(--chipL);color:var(--chipLt)}.chip.n{background:var(--chipN);color:var(--chipNt)}
.chip.p{padding:4px 2px;color:var(--mist)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mist);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.eg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.eg .tg{flex:0 0 auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);background:var(--panel2);border-radius:8px;padding:2px 7px;height:fit-content;margin-top:2px}
.eg.real .tg{background:var(--sageT);color:var(--sage)}
.eg b{background:var(--chipL);color:var(--chipLt);border-radius:6px;padding:0 3px}
.rule,.trap{border-radius:14px;padding:11px 13px;font-size:14.5px;margin-top:10px}
.rule{background:var(--sageT)}.rule>b:first-child{color:var(--sage)}
.trap{background:var(--coralT)}.trap>b:first-child{color:var(--coral)}
.trap s{color:var(--coral)}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.gcap{font-size:13px;color:var(--mist);margin:6px 2px 0}
.gmodel{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:14.5px;margin-top:8px}
.replay{margin-top:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:5px 11px;font-weight:800;font-size:13px}
.yourturn{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.yourturn h4{margin:0 0 8px;font-size:15px;color:var(--sage)}

table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.t th{text-align:left;background:var(--panel2);padding:9px 12px;font-weight:800}
.t td{padding:9px 12px;border-top:1px solid var(--line)}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mist .x,.mist .v{border-radius:14px;padding:10px 12px;font-size:14.5px}
.mist .x{background:var(--coralT)}.mist .x s{color:var(--coral)}
.mist .v{background:var(--sageT)}

/* ---- charts ---- */
svg.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--gtext);font-size:11px;font-family:"Nunito Sans",system-ui,sans-serif}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .lbl{font-size:11.5px;font-weight:800;font-family:"Nunito Sans",system-ui,sans-serif}
.chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.3s ease-out forwards}
@keyframes dl{to{stroke-dashoffset:0}}
.chart .key{font-size:11.5px;font-weight:700;fill:var(--paper);font-family:"Nunito Sans",system-ui,sans-serif}

/* ---- graph exercise cards ---- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.gcard .gt{font-weight:800;font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gcard .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--panel2);color:var(--mist);border-radius:8px;padding:2px 7px}
.gcard .gt span{font-weight:600;color:var(--mist);font-size:13px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-size:15px;margin-bottom:8px}
.q .p .num{font-weight:800;color:var(--brass);margin-right:6px}
.q .p .tg{display:inline-block;font-size:11px;font-weight:800;background:var(--chipS);color:var(--chipSt);border-radius:8px;padding:1px 7px;margin-right:4px}
.q .p .sm{font-size:13px;color:var(--mist)}
.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:14.5px;margin-bottom:6px}
.wk .l{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}
select.sel{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--paper);min-width:150px}
select.sel.ok{border-color:var(--sage);background:var(--sageT)}select.sel.no{border-color:var(--coral);background:var(--coralT)}

/* ---- input + coach ---- */
.iw{margin-top:6px}
.iw .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--paper);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:62px;outline:none}
textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:8px 16px;font-weight:800;font-size:14px;background:var(--brass);color:var(--onbrass)}
.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:12.5px;color:var(--mist)}
.done-tag{font-size:12.5px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:14px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.fb.on{display:block}
.fb .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px}
.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:12px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:15px;line-height:1.7;margin-bottom:6px}
.ann mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--amber)}
.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:14.5px}
.it .k{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}
.tryit{margin-top:3px;font-weight:800;color:var(--sage)}
.why{margin-top:2px;color:var(--mist);font-size:13.5px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:14.5px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.blockbar .score{font-weight:800;color:var(--dim);font-size:14px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.foot{color:var(--mist);font-size:12.5px;text-align:center;padding:10px 18px 30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);font-weight:800;border-radius:14px;padding:9px 16px;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .band{padding:16px 0 16px;border-radius:0 0 20px 20px}
  .band h1{font-size:22px}
  .band p{font-size:14px}
  .two,.ggrid,.mist{grid-template-columns:1fr}
  .card{padding:14px}
  .step{padding:7px 11px;font-size:13px}
  .sec-title h2{font-size:18px}
  .chip{font-size:13px}
}
@media print{.steps,.irow,.blockbar,.nextbar{display:none}.sec{display:block!important}}


/* ---- Lesson 5 additions ---- */
.gimg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.gimg img{max-width:100%;height:auto;max-height:360px}
.ovl{display:grid;grid-template-columns:1fr;gap:16px}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.ovc .gt{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ovc .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--brass);color:var(--onbrass);border-radius:8px;padding:2px 8px}
.ovc .gt span{font-weight:600;color:var(--mist);font-size:12.5px}
.phr{border-radius:14px;background:var(--amberT);padding:9px 12px;margin:10px 0 4px;font-size:13.5px}
.phr b{color:var(--amber);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.phr i{font-style:normal;font-weight:700;display:inline-block;margin:2px 4px 2px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.clue{font-size:13.5px;color:var(--dim);margin:2px 0 6px}
.clue u{text-decoration:none;font-weight:800;color:var(--paper)}
.step3{display:grid;grid-template-columns:1fr;gap:0}
.iw+.iw{margin-top:12px}
.iw .lab.i{color:#6d4bc2}.iw .lab.t{color:var(--brass)}.iw .lab.d{color:var(--amber)}.iw .lab.o{color:var(--sage)}
:root[data-theme="dark"] .iw .lab.i{color:#c3b0f5}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sent{border-radius:14px;padding:12px 14px;font-size:15px}
.sent .st{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.sent.s1{background:var(--chipS);border:1px solid color-mix(in srgb,var(--chipSt) 35%,transparent)}.sent.s1 .st{color:var(--chipSt)}
.sent.s2{background:var(--amberT);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent)}.sent.s2 .st{color:var(--amber)}
mark.t{background:var(--mark);color:inherit;border-radius:5px;padding:0 3px}
mark.d{background:#ffd9a8;color:#3a2a12;border-radius:5px;padding:0 3px}
:root[data-theme="dark"] mark.d{background:#6a4513;color:#fbe4c4}
.legend2{font-size:13px;color:var(--mist);margin:10px 0}
.stp{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;margin:0 0 8px}
.stp b.n{flex:0 0 auto;font-family:Unbounded,sans-serif;font-size:12px;border-radius:9px;padding:4px 9px;color:#fff;background:var(--brass)}
.stp b.n.d{background:#b7791f}
.stp em{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;color:var(--mist);white-space:nowrap}
ul.kf{list-style:none;margin:6px 0 10px;padding:0;font-size:14.5px}
ul.kf li{margin:3px 0}
ul.kf b.tg{display:inline-block;min-width:54px;text-align:center;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:7px;padding:1px 6px;margin-right:6px;color:#fff;background:var(--brass)}
ul.kf b.tg.d{background:#b7791f}
.exh{font-weight:800;font-size:15px;margin:0 0 6px}
.exov{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:15px;line-height:1.6}
.phg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phg h4{margin:0 0 6px;font-size:14px}
.phg .eg{padding:8px 0}
.q .sel{margin-top:2px}
.why5{border-radius:12px;background:var(--panel2);padding:8px 11px;font-size:14px;margin-top:8px}
@media (max-width:760px){.sc,.phg{grid-template-columns:1fr}.stp em{display:none}}
.gfig{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--panel)}
.gfig-t{font-weight:800;font-size:13.5px;margin-bottom:2px}.gfig-u{font-size:12px;color:var(--mist)}
.gref{color:var(--mist);font-size:12.5px;font-weight:600}
.qg{border:1px solid var(--line);border-radius:12px;padding:6px 10px 4px;margin:6px 0 8px;background:var(--panel);max-width:560px}
.qg svg{display:block}.qgc{font-size:12px;color:var(--mist);margin-top:2px}
.gbox svg{display:block}
.chip.s,.chip.v,.chip.l,.chip.n{white-space:pre-wrap}
.gapgrid{display:grid;grid-template-columns:1fr;gap:0}
.q.g .p{line-height:2.1}
input.gap{font:inherit;border:0;border-bottom:2px solid var(--line);background:transparent;color:inherit;text-align:center;padding:0 2px;margin:0 3px;outline:none;border-radius:4px 4px 0 0}
input.gap:focus{border-bottom-color:var(--brass);background:var(--panel2)}
input.gap.ok{border-bottom-color:var(--sage);background:var(--sageT)}
input.gap.no{border-bottom-color:var(--coral);background:var(--coralT)}
.clue{font-size:13.5px;color:var(--dim);margin:6px 0 0}
.jobs td:first-child{font-weight:700}

const CHAPTER={"id": "wt1-lesson11", "kicker": "Writing Task 1 · Lesson 11", "title": "Natural comparison, <span style=\"color:#ffd27a\">surveys, money and age</span>", "lead": "Make your comparisons sound natural. Learn the language of surveys, percentages, money and age groups, drill it, then use it on 12 real graphs. The Writing Coach checks the <b>figures</b>, the <b>target language</b>, the <b>facts</b>, the <b>grammar</b> and the <b>spelling</b>.", "footer": "Mr Ikromov's IELTS · Writing Task 1 · Lesson 11 · Natural Comparison; Surveys, Money and Age. The Writing Coach is a teaching tool: it finds common mistakes and checks your figures against the graph, but it is not an examiner. Another correct answer is accepted; compare with the model after you try.", "steps": [{"no": "11.1", "name": "Learn", "title": "The language of comparison", "subnav": true, "lead": "Four groups of language: natural comparison, surveys and percentages, age groups, money.", "blocks": [{"type": "html", "tab": "Natural comparison", "html": "<p class=\"lead\">Plain sentences are correct but flat. <b>Natural</b> comparison language links the two groups, signposts the topic and measures the gap.</p><div class=\"phg\"><div><h4>Link two groups</h4><div class=\"eg\"><span class=\"tg\">Pair</span><span>their male / female <b>counterparts</b></span></div><div class=\"eg\"><span class=\"tg\">Pair</span><span><b>the former</b> … <b>the latter</b></span></div><div class=\"eg\"><span class=\"tg\">Pair</span><span>with their <b>respective</b> figures at … · … at 5% and 8% <b>respectively</b></span></div><div class=\"eg\"><span class=\"tg\">Pair</span><span><b>regardless of</b> their gender</span></div><div class=\"eg\"><span class=\"tg\">Contrast</span><span><b>while / whereas / compared with / against</b></span></div></div><div><h4>Signpost the topic</h4><div class=\"eg\"><span class=\"tg\">Signpost</span><span><b>When it comes to</b> coffee, Canada led.</span></div><div class=\"eg\"><span class=\"tg\">Signpost</span><span><b>In terms of</b> pay, doctors earned more.</span></div><div class=\"eg\"><span class=\"tg\">Signpost</span><span><b>As for</b> clothing, … · <b>Regarding</b> food, …</span></div></div><div><h4>Measure the gap</h4><div class=\"eg\"><span class=\"tg\">Gap</span><span>a <b>small disparity</b> · a more noticeable <b>discrepancy</b></span></div><div class=\"eg\"><span class=\"tg\">Gap</span><span>reflecting a <b>difference of</b> $55</span></div><div class=\"eg\"><span class=\"tg\">Gap</span><span><b>twice as much as</b> · <b>three times as high as</b></span></div><div class=\"eg\"><span class=\"tg\">Gap</span><span><b>nearly identical</b> · <b>remarkably similar</b></span></div><div class=\"eg\"><span class=\"tg\">Gap</span><span>a <b>staggering</b> $202</span></div></div><div><h4>Rank the items</h4><div class=\"eg\"><span class=\"tg\">Rank</span><span><b>by far the highest</b> · the <b>lowest</b> of all</span></div><div class=\"eg\"><span class=\"tg\">Rank</span><span>the <b>third-highest</b> figure</span></div><div class=\"eg\"><span class=\"tg\">Rank</span><span>X <b>emerged as</b> the biggest …</span></div></div></div><table class=\"t\" style=\"margin-top:10px\"><thead><tr><th style=\"width:38%\">Plain</th><th>Natural</th></tr></thead><tbody><tr><td>Men earned $1,400 and women earned $900.</td><td>Men earned $1,400, while their female <b>counterparts</b> earned $900.</td></tr><tr><td>The UK imported 160,000 tonnes and the USA imported 120,000 tonnes.</td><td>The UK and the USA imported 160,000 and 120,000 tonnes <b>respectively</b>.</td></tr><tr><td>Rover spent less on TV than Renault.</td><td>Renault’s expenditure on TV was $59 million, <b>while</b> Rover expended less, at $45 million.</td></tr><tr><td>Couples spent $100 on food and singles $50.</td><td>Couples spent <b>twice as much</b> on food <b>as</b> singles, $100 <b>compared with</b> $50.</td></tr></tbody></table><div class=\"note\"><b>Do not use all of them in one paragraph.</b> Two or three well-chosen links make a paragraph sound natural; ten make it sound forced.</div>"}, {"type": "html", "tab": "Surveys and %", "html": "<p class=\"lead\">A survey reports what people <b>said</b>. Name the survey, then give the share of people.</p><div class=\"phg\"><div><h4>Survey language</h4><div class=\"eg\"><span class=\"tg\">Verb</span><span><b>Survey results revealed that</b> the majority of students were very satisfied.</span></div><div class=\"eg\"><span class=\"tg\">Who</span><span>15% of the students <b>who completed the survey</b> were not happy.</span></div><div class=\"eg\"><span class=\"tg\">Who</span><span>… <b>who participated in the questionnaire</b> …</span></div><div class=\"eg\"><span class=\"tg\">Who</span><span><b>The majority of the survey participants</b> …</span></div><div class=\"eg\"><span class=\"tg\">Who</span><span>Only 40% of <b>respondents</b> expected an improvement.</span></div></div><div><h4>The number-versus-percentage trap</h4><div class=\"trap\" style=\"margin:0\"><b>Full-time students:</b> 1,000 in total, 50% satisfied = <b>500</b> students.<br><b>Part-time students:</b> 10,000 in total, 20% satisfied = <b>2,000</b> students.<br>So <s>the number of full-time students was higher because 50% &gt; 20%</s> is <b>wrong</b>.</div><div class=\"note\" style=\"margin-top:6px\"><b>Percentage data</b> → <i>the percentage / proportion / share of …</i> (never <s>the number of</s>).<br><b>Counts</b> → <i>the number of</i> + plural noun.<br><b>Money / uncountable</b> → <i>the amount of</i>.</div></div></div><h4 style=\"margin:12px 0 4px\">Say a percentage in a more natural way</h4><table class=\"t\"><thead><tr><th>%</th><th>Say it</th><th>%</th><th>Say it</th></tr></thead><tbody><tr><td>80%</td><td>four-fifths</td><td>35%</td><td>more than a third</td></tr><tr><td>75%</td><td>three quarters</td><td>33%</td><td>a third</td></tr><tr><td>70%</td><td>seven in ten</td><td>30%</td><td>less than a third</td></tr><tr><td>66%</td><td>two-thirds</td><td>25%</td><td>a quarter</td></tr><tr><td>60%</td><td>three-fifths</td><td>20%</td><td>a fifth</td></tr><tr><td>55%</td><td>more than half</td><td>15%</td><td>less than a fifth</td></tr><tr><td>50%</td><td>half</td><td>10%</td><td>one in ten</td></tr><tr><td>40%</td><td>two-fifths</td><td>5%</td><td>one in twenty</td></tr></tbody></table><div class=\"phg\" style=\"margin-top:8px\"><div><h4>Add a qualifier</h4><div class=\"eg\"><span class=\"tg\">77%</span><span><b>just over</b> three quarters</span></div><div class=\"eg\"><span class=\"tg\">49%</span><span><b>nearly</b> half</span></div><div class=\"eg\"><span class=\"tg\">32%</span><span><b>almost</b> a third</span></div></div><div><h4>Words for size</h4><div class=\"eg\"><span class=\"tg\">75–85%</span><span>a <b>very large majority</b></span></div><div class=\"eg\"><span class=\"tg\">65–75%</span><span>a <b>significant proportion</b></span></div><div class=\"eg\"><span class=\"tg\">10–15%</span><span>a <b>small minority</b></span></div><div class=\"eg\"><span class=\"tg\">5%</span><span>a <b>very small number</b></span></div></div></div><div class=\"note\">Put the percentage at the start: <i>35% of British people went abroad, while only 28% of Australians did.</i> Do not use the same form in every sentence: vary with fractions.</div>"}, {"type": "html", "tab": "Age groups", "html": "<p class=\"lead\">Do not write <i>people aged 18–39</i> in every sentence. Choose from the list. The age range 7–14 is the example.</p><div class=\"phg\"><div><h4>Name a group</h4><div class=\"eg\"><span class=\"tg\">1</span><span>the <b>youngest age group</b></span></div><div class=\"eg\"><span class=\"tg\">2</span><span>the <b>oldest age group</b></span></div><div class=\"eg\"><span class=\"tg\">3</span><span><b>those aged</b> from 7 to 14</span></div><div class=\"eg\"><span class=\"tg\">4</span><span><b>people aged</b> from 7 to 14</span></div><div class=\"eg\"><span class=\"tg\">5</span><span>those from the 7–14 <b>age group / bracket / category</b></span></div><div class=\"eg\"><span class=\"tg\">6</span><span>people from the 7–14 age group</span></div></div><div><h4>More ways</h4><div class=\"eg\"><span class=\"tg\">7</span><span>the 7–14 <b>age range</b></span></div><div class=\"eg\"><span class=\"tg\">8</span><span>people <b>between the ages of</b> 7 and 14</span></div><div class=\"eg\"><span class=\"tg\">9</span><span><b>individuals within</b> the 7–14 <b>demographic</b></span></div><div class=\"eg\"><span class=\"tg\">10</span><span>people in the 7–14 <b>age set</b></span></div><div class=\"eg\"><span class=\"tg\">11</span><span><b>individuals belonging to</b> the 7–14 age bracket</span></div></div></div><div class=\"card\"><div class=\"exh\">Examples</div><div class=\"eg\"><span class=\"tg\">Model</span><span>Over a half of the <b>youngest age group</b> went cycling in this town.</span></div><div class=\"eg\"><span class=\"tg\">Model</span><span>By contrast, 42.2% of girls <b>from the 10–17 age demographic</b> rode bicycles.</span></div><div class=\"eg\"><span class=\"tg\">Model</span><span>In Germany, about 88% of <b>25–34-year-olds</b> and 83% of <b>55–64-year-olds</b> had finished high school.</span></div><div class=\"eg\"><span class=\"tg\">Model</span><span>Inactivity peaked <b>at 75 and over</b>, at 56% for women and 43% for men.</span></div></div><div class=\"note\"><b>Rule.</b> Name the group in full the first time. Then use <i>the youngest / the oldest / the older group / those aged …</i> so that the paragraph does not repeat itself.</div>"}, {"type": "html", "tab": "Money", "html": "<p class=\"lead\">Money graphs need money words. Vary them and use the right verb for the subject.</p><div class=\"phg\"><div><h4>Words for spending</h4><div class=\"eg\"><span class=\"tg\">Noun</span><span><b>expenditure</b> = money spent · <b>expense</b> · <b>outlay</b> · <b>an allocation</b></span></div><div class=\"eg\"><span class=\"tg\">Verb</span><span>to <b>spend</b> = to <b>expend</b> = to <b>allocate</b> to / for</span></div><div class=\"eg\"><span class=\"tg\">Verb</span><span>The total <b>amounted to</b> $2.6 billion.</span></div><div class=\"eg\"><span class=\"tg\">Verb</span><span>Housing <b>emerged as</b> a major expense.</span></div></div><div><h4>Ready-made phrases</h4><div class=\"eg\"><span class=\"tg\">Model</span><span>Women’s <b>expenditure</b> stood at $500 in 1995.</span></div><div class=\"eg\"><span class=\"tg\">Model</span><span>The <b>expenditure of</b> women on clothes <b>amounted to</b> $500 a month.</span></div><div class=\"eg\"><span class=\"tg\">Model</span><span>Renault’s expenditure on TV advertising was $59 million, while Rover <b>expended</b> less, at $45 million.</span></div><div class=\"eg\"><span class=\"tg\">Model</span><span>American doctors were <b>by far the best paid</b>, at about $120,000 a year.</span></div><div class=\"eg\"><span class=\"tg\">Model</span><span>The UK <b>allocated</b> $13 billion in 2010, the <b>second-largest</b> figure.</span></div></div></div><table class=\"t\" style=\"margin-top:10px\"><thead><tr><th style=\"width:50%\">Safest (always clear)</th><th>Common, but avoid if you can</th></tr></thead><tbody><tr><td>The 2010 figure was <b>three times as high as</b> the 2005 figure.<br>There were <b>twice as many</b> visitors in 2005 as in 2000.</td><td><s>three times higher than</s> …<br>Some examiners read it as “four times as high”. <i>As high as</i> is always clear.</td></tr></tbody></table><div class=\"note\"><b>Quantity patterns.</b> <i>The amount of</i> + uncountable (money, salt) · <i>The number of</i> + plural noun (singular verb) · <i>The percentage / proportion of</i> + noun (singular verb) · <i>The figures for</i> + noun (plural verb).</div>"}]}, {"no": "11.2", "name": "Drills", "title": "Quick drills", "subnav": true, "lead": "Choose, say it another way and rewrite. Any correct answer is accepted.", "blocks": [{"type": "drill", "kind": "select", "label": "Number or percentage?", "note": "<b>Choose</b> the correct word."}, {"type": "drill", "kind": "frac", "label": "Percentage or fraction?", "note": "<b>Say each figure in another way</b> with a fraction (add a qualifier if it is not exact)."}, {"type": "drill", "kind": "rew", "label": "Say it another way", "note": "<b>Rewrite</b> each sentence with the phrase given."}]}, {"no": "11.3", "name": "Practice", "title": "12 real graphs", "subnav": true, "lead": "Write 3 sentences for every graph and use at least 3 of the language chips. Figures are checked against the graph.", "blocks": [{"type": "task", "label": "A · Surveys", "refs": [0, 1, 2], "note": "<b>Part A.</b> Survey language, fractions, the percentage of."}, {"type": "task", "label": "B · Age groups", "refs": [3, 4, 5], "note": "<b>Part B.</b> Name the age groups in different ways."}, {"type": "task", "label": "C · Money", "refs": [6, 7, 8], "note": "<b>Part C.</b> Money words and multiples."}, {"type": "task", "label": "D · Natural comparison", "refs": [9, 10, 11], "note": "<b>Part D.</b> Signposts, multiples and contrast."}]}]};

age"], "percentage"], ["The ___ of salt consumed by men was 4,500 mg.", ["amount", "number"], "amount"], ["Full-time students: 1,000 in total, 50% satisfied. Part-time students: 10,000 in total, 20% satisfied. Which sentence is true?", ["More full-time students than part-time students were satisfied.", "More part-time students than full-time students were satisfied.", "The two numbers were the same."], "More part-time students than full-time students were satisfied."], ["A pie chart shows that 35% of the budget went on housing. Which is correct?", ["The number of housing was 35%.", "The share of the budget spent on housing was 35%."], "The share of the budget spent on housing was 35%."]], "FRAC": [["50%", "\\bhalf\\b", "half"], ["25%", "\\b(?:a|one) (?:quarter|fourth)\\b", "a quarter"], ["77%", "(?:three[- ]quarters|four[- ]fifths|seven in ten|over three quarters|more than three quarters)", "just over three quarters"], ["49%", "\\b(?:nearly|almost|just under|about|roughly|close to) (?:a )?half\\b", "nearly half"], ["10%", "\\b(?:one in ten|a tenth|one tenth|a small minority)\\b", "one in ten"], ["32%", "\\b(?:almost|nearly|just under|about|roughly|close to|around) (?:a )?(?:third|one third)\\b", "almost a third"], ["67%", "two[- ]thirds", "two-thirds"], ["5%", "\\b(?:one in (?:twenty|20)|a (?:very )?small (?:number|minority|fraction)|a twentieth)\\b", "one in twenty"]], "REW": [["People aged 25 to 34 had the highest rate.", "individuals belonging to …", "individuals (?:belonging|within|aged|from)", "Individuals belonging to the 25–34 age bracket had the highest rate."], ["Women spent $500 on clothes in 1995.", "expenditure … stood at", "expenditure[^.]*(?:stood at|was|amounted to|reached)", "Women’s expenditure on clothes stood at $500 in 1995."], ["Housing was the biggest cost for Mike.", "emerged as", "emerged as", "Housing emerged as a major expense for Mike."], ["The company spent $59 million on TV.", "allocated", "allocat", "The company allocated $59 million to const D={"gmeta": {}, "texts": ["Young people&rsquo;s expectations for five areas of life over 20 years The survey results revealed that communication between people was the only area where a majority, at 54%, expected an improvement. Opinion on food quality was almost evenly divided, with 49% optimistic and 51% pessimistic. By contrast, just under a quarter of respondents, at 23%, were hopeful about air quality in cities, while more than three quarters expected it to get worse.", "Student satisfaction with three university facilities, 2007 The percentage of undergraduates who were very satisfied with the school facilities was 85%, compared with only 43% of postgraduates. The picture was reversed for the cafeteria, where 73% of postgraduates were very satisfied against 52% of undergraduates. Opinions about school rooms were remarkably similar, at 62% and 63% respectively.", "Patient satisfaction with four aspects of three hospitals The percentage of patients satisfied with staff was highest at Hospital C, at 92%, followed by Hospital A with 74% and Hospital B with 65%. Hospital C also led on waiting time, with 82% of patients happy, whereas only 40% and 50% of those at Hospitals A and B respectively were satisfied. Hospital A, however, was ahead for treatment and aftercare, at 85% and 83%.", "Australian adults who do no physical activity, by age and gender Inactivity was highest among the oldest age group, with more than half of women aged 75 and over, at about 56%, taking no exercise, compared with roughly 43% of men. By contrast, just 14% of men and 18% of women aged 15 to 24 were inactive, and the figures for people between the ages of 25 and 34 were 17% and 22% respectively. The two sexes were identical at about 27% among those aged 35 to 44.", "Adults with high school education in six countries, 2010 In South Korea, 98% of 25–34-year-olds had completed high school, compared with only 43% of those aged 55–64, the widest gap of all six countries. Individuals belonging to the older group were also far behind in Brazil, at about 25% against 52% of the younger group. By contrast, the two generations were close in Germany, at about 88% and 83%, while the USA was the only country where the older group, on about 90%, edged ahead.", "Salt intake in the US by age and gender, 2000 Males in the 20–39 age group consumed the most salt, at 4,500 mg, compared with 3,100 mg for their female counterparts, a gap of 1,400 mg. Teenagers aged 12 to 19 showed a similar pattern, with 4,300 mg for males and 3,000 mg for females. By contrast, the youngest boys, those under 6, took in 2,200 mg, far more than the 1,300 mg consumed by girls of the same age.", "Annual pay of doctors and other workers in seven countries, 2004 American doctors were by far the best paid, at about $120,000 a year, far more than their counterparts in France and Switzerland, at around $70,000. Doctors’ pay in Italy and Finland was the lowest, at $60,000 and $50,000 respectively. Other workers earned much less everywhere: Czech doctors, for example, earned roughly three times as much as Czech workers, at $63,000 against $20,000.", "Advertising expenditure of four car companies in the UK, 2002 ($ million) Renault spent a total of $132 million on advertising, with TV emerging as its major expense at $59 million, followed by newspapers at $45 million. Vauxhall and Company D both allocated most of their budgets to TV, with the former spending $65 million and the latter $75 million. Every company invested the same amount, $15 million, in radio.", "Weekly spending needed by retired people to live comfortably in Australia ($) Couples needed more money than single retirees in every category, with the gap widest for leisure, at $202 compared with $140. Healthcare followed, reflecting a difference of $55, at $177 and $122 respectively, and couples spent twice as much on food, at $100 against $50. By contrast, expenditure on transport was nearly identical, at $107 for singles and $108 for couples.", "Tea and coffee imports of four countries, 2007 In terms of tea, the UK imported by far the most, at 160,000 tonnes, which was eight times its coffee imports of 20,000 tonnes. The USA showed a similar pattern, with 120,000 tonnes of tea against 40,000 tonnes of coffee. When it comes to coffee, Canada led with 80,000 tonnes, while Germany’s imports of the two drinks were almost balanced, at 50,000 tonnes of coffee and 40,000 of tea.", "Soft drink and bottled water consumption in five countries, 2002 In terms of soft drinks, Americans drank the most, at around 195 litres per person, whereas Japanese consumption was the lowest, at roughly 45 litres. As for bottled water, Germans consumed about 180 litres, which was more than seven times the Australian figure of 25 litres. Italy, by contrast, showed a clear preference for water, with 122 litres against only 68 litres of soft drinks.", "Water use by sector in four countries Agriculture accounted for the vast majority of water use in Egypt, at 82%, and for nearly two thirds in Saudi Arabia, at 64%. When it comes to industry, Canada devoted 70% of its water to it, or seven in ten, compared with just 10% for agriculture. In New Zealand, industry and agriculture took almost equal shares, at 46% and 44% respectively, with domestic use at only 10%.", "Plain sentences are correct but flat. Natural comparison language links the two groups, signposts the topic and measures the gap.Link two groupsPairtheir male / female counterpartsPairthe former … the latterPairwith their respective figures at … · … at 5% and 8% respectivelyPairregardless of their genderContrastwhile / whereas / compared with / againstSignpost the topicSignpostWhen it comes to coffee, Canada led.SignpostIn terms of pay, doctors earned more.SignpostAs for clothing, … · Regarding food, …Measure the gapGapa small disparity · a more noticeable discrepancyGapreflecting a difference of $55Gaptwice as much as · three times as high asGapnearly identical · /* ---- sentence-level checks (functions) ---- */
function sentences(t){
  const out=[];const re=/[.!?]\s+(?=[A-Z"“])/g;let last=0,m;const cut=[];
  while((m=re.exec(t)))cut.push([last,m.index+1]),last=m.index+m[0].length;
  cut.push([last,t.length]);

const INTRO=/^(after|before|despite|while|although|though|whereas|starting|when|as|since|given)\b/i;

function grammarCheck(text){

    while((m=re.exec(text))){

      if(r.test&&!r.test(m,text,m.index))continue;
      let i=m.index,len=m[0].length;

        const g=r.grp===0?m[0]:m[r.grp];if(g===undefined)continue;
        const off=m[0].indexOf(g,r.id==="nofv"?m[1].length:0);i=m.index+(off<0?0:off);len=g.length;if(r.id==="spB"){i=m.index;len=m[0].length}}

  for(const s of sentences(text)){
    const t=s.txt;
    if(/^[a-z]/.test(t)){const w0=(t.match(/^[a-z]+/)||[t[0]])[0];add("grammar",s.i,w0.length,"A sentence starts with a capital letter.",w0[0].toUpperCase()+w0.slice(1),"Capital letter at the start.")}

    // while + same direction
  }

  const yrs=(text.match(/\b(19|20)\d\d\b/g)||[]).map(Number);
  if(yrs.length&&Math.max(...yrs)<=2024){
    const m=text.match(new RegExp("\\b(?:"+SUBJ+")\\s+"+ADV+"(rises|falls|increases|decreases|drops|declines|grows|reaches|climbs|dips|jumps|peaks|remains)\\b","i"));
    if(m)add("tense",text.indexOf(m[1],m.index),m[1].length,"The years are in the past, so use the past simple.","rose · fell · increased · reached","Describing 2000–2020 data: past simple (rose, fell). Present simple is for facts that are true now.")}

  const out=[];let end=-1;for(const it of items){if(it.i>=end){out.push(it);end=it.i+it.len}else if(it.kind==="grammar"&&out.length&&out[out.length-1].len<=it.len){}}

function styleCheck(text){
  const items=[];
  for(const r of STYLE){const re=new RegExp(r.re.source,r.re.flags.includes("g")?r.re.flags:r.re.flags+"g");let m;
    while((m=re.exec(text))){if(!m[0])continue;
      if(r.id==="cont"&&/'s$/i.test(m[0])&&!/^(it|that|there)'s$/i.test(m[0]))continue;
      items.push({kind:"style",i:m.index,len:m[0].length,msg:r.msg,fix:r.fix,why:r.why})}}

  const dirs=dirsOf(text).filter(d=>!/peak/i.test(d[2]));const cnt={};
  for(const d of dirs){const k=d[2].toLowerCase().replace(/(ed|ing|s|d)$/,"");cnt[k]=(cnt[k]||[]);cnt[k].push(d)}
  for(const k in cnt)if(cnt[k].length>=2){const d=cnt[k][1];items.push({kind:"style",i:d[0],len:d[2].length,msg:"You used ‘"+d[2].toLowerCase()+"’ twice.",fix:"use a synonym: "+(d[1]==="U"?"rose · climbed · grew · went up to":"fell · dropped · declined · dipped"),why:"Varying vocabulary raises your Lexical Resource score."})}
  const words=text.trim().split(/\s+/).length;
  if(words>45)items.push({kind:"style",i:0,len:0,msg:"This sentence is very long ("+words+" words).",fix:"split it into two sentences",why:"Aim for 20–35 words per sentence so the reader does not get lost."});
  if(!/[.!?]\s*$/.test(text.trim()))items.push({kind:"style",i:Math.max(0,text.trimEnd().length-1),len:1,msg:"End the sentence with a full stop.",fix:".",why:"Punctuation is part of accuracy."});
  return items}

function spellCheck(text){
  const items=[];const re=/[A-Za-z][A-Za-z'’-]*/g;let m;const sents=sentences(text);
  while((m=re.exec(text))){const raw=m[0];const w=raw.toLowerCase().replace(/['’]s$/,"");
    if(w.length<4)continue;
    if(MISSP[w]){items.push({kind:"spelling",i:m.index,len:raw.length,msg:"Spelling: ‘"+raw+"’",fix:MISSP[w],why:"Correct spelling: "+MISSP[w]+".",hard:true});continue}
    if(known(w))continue;
    // capitalised word inside a sentence = a name
    const atStart=sents.some(s=>s.i===m.index);
    if(/^[A-Z]/.test(raw)&&!atStart)continue;
    if(w.includes("-"))continue;
    const near=nearWord(w);
    if(near)items.push({kind:"spelling",i:m.index,len:raw.length,msg:"Possible spelling mistake: ‘"+raw+"’",fix:near,why:"Check the spelling. Did you mean ‘"+near+"’?",hard:false})}
  return items}

/* ---- figures & years ---- */

/* ===== Overview coach (Lesson 5) ===== */
const UP2=/\b(gain\w*|expand\w*|more popular|more widespread|more common|widespread|higher than|ended higher|ended up|edged up\w*|upward\w*|growth|surg\w*)\b/gi;
const DOWN2=/\b(los[et]|lower|disappear\w*|ended lower|less popular|less common|edged down\w*|lag\w*|below)\b/gi;
const STABLE=/\b(stable|stability|unchanged|same level|same as|remained|stayed|constant|steady|steadily|level|flat|no change|did not change|almost the same|broadly)\b/i;
const DET=/\b(most|least|biggest|largest|smallest|highest|lowest|greatest|fastest|slowest|dramatic\w*|overtook|overtake\w*|overtaken|gap|narrow\w*|widen\w*|outnumber\w*|dominant|consistently|every year|throughout|remained the|ended as|became the|far more|far fewer|by far|substantial\w*|sharpest|steepest|replace\w*|exceed\w*|surpass\w*|leading|main source|stands? out|stood out|majority|larger|smaller|more than|fewer than|disappear\w*|biggest|only)\b/i;
function dset(s){
  const d=new Set();let m;const t=s.replace(/[’‘]/g,"'");
  for(const re of [UP,UP2]){re.lastIndex=0;while((m=re.exec(t))){if(!/peak/i.test(m[0]))d.add("U")}}
  for(const re of [DOWN,DOWN2]){re.lastIndex=0;while((m=re.exec(t)))d.add("D")}
  if(STABLE.test(t))d.add("S");
  return d}
function numOK(t,m){const w=m[0];
  if(/%$/.test(w))return false;
  if(/^(19|20|21)\d\d$/.test(w))return true;                       // years: 1960, 2050
  const i=m.index,end=i+w.length,after=t.slice(end,end+28);
  if(/^(st|nd|rd|th)\b/i.test(after))return true;
  const UNIT=/^\s*(million|thousand|billion|tonnes?|percent|per cent|units?|dollars?|euros?|pounds?|kg|litres?)\b/i;
  const rg=after.match(/^\s*[–-]\s*(\d+)(?![\d%.,]|\s*%)(.*)$/);
  if(+w<=99&&rg&&!UNIT.test(rg[2]))return true;                      // age range 15–64 (first number)
  if(+w<=99&&/\d\s*[–-]\s*$/.test(t.slice(Math.max(0,i-4),i))&&!UNIT.test(t.slice(end))&&!/^\s*%/.test(t.slice(end)))return true;   // second number of a range                    // 21st century
  const sent=t.slice(0,i).split(/[.!?]\s/).pop();                    // text before it, same sentence
  const AGE=/\b(aged?|ages|age groups?|under|over|below|above|younger than|older than|those aged|people aged)\b/gi;let k,last=-1,lastEnd=-1;
  while((k=AGE.exec(sent))){last=k.index;lastEnd=k.index+k[0].length}
  // a number that comes straight after an age word, or in a chain: aged 15 to 64 / 15–24 and 25–34 / 0-14, 15-64 and 65
  if(last>=0&&/^[\s\d,–\-+]*((\band\b|\bto\b|\bor\b|,)[\s\d,–\-+]*)*$/i.test(sent.slice(lastEnd)))return true;
  // age words AFTER the number: 65+ · 65 and over · 15–24 age group · 15 years old · 25-34 year olds
  if(/^\s*(?:(?:[-–]|\bto\b|\band\b|\bor\b|,)\s*\d+\s*)*(\+|(?:[- ]?years?[- ]olds?|years of age|age[- ]?groups?|groups?|age bracket|and (?:over|above|older|under|below|younger)|or (?:over|above|older|under|below|younger)))/i.test(after))return true;

  if(+w<=99&&!/[.,]/.test(w)&&!UNIT.test(after)&&!/^\s*(points?|pp|percentage points?)\b/i.test(after)){
    const pre=t.slice(Math.max(0,i-16),i);
    if(!/\b(by|from|to|at|reached|reaching|of|around|about|approximately|roughly|nearly|just|than|rose|fell|dropped|grew|reaches|stood|stands)\s+$/i.test(pre)&&!/\bbetween\s+\d+\s+and\s+$/i.test(pre))return true}

function hasFig(t){const re=/\d+(?:[.,]\d+)*%?/g;let m;while((m=re.exec(t))){if(!numOK(t,m))return true}return false}
function splitOv(t){const ss=sentences(t);return ss}
function ovAnalyze(text,g,opt){
  opt=opt||{};

  const add=(kind,i,len,msg,fix,why)=>items.push({kind,i,len,msg,fix,why});
  const ss=splitOv(t);
  const s1=ss[0]?ss[0].txt:"",s2=ss[1]?ss[1].txt:"";
  const mss=sentences(g.model),m1=mss[0]?mss[0].txt:"",m2=mss[1]?mss[1].txt:"";
  if(t.split(/\s+/).length<8)return {ok:false,items:[{kind:"structure",msg:"Write the two sentences of the overview: Overall, … It is also clear that …",fix:"Overall, + general trends. It is also clear that + detail.",why:"An overview has two sentences."}],praise:[],hard:1};
  // ---- structure ----
  const wb=/what stands? out/i.exec(t);
  if(wb)add("structure",wb.index,wb[0].length,"Do not begin with ‘What stands out from the graph is that…’.","Overall, + the general trends","Start with Overall, and give the information directly. This phrase wastes words and examiners see it in thousands of scripts.");

  if(!starts&&!wb){const w=(s1.match(/^\S+/)||[""])[0];add("structure",ss[0]?ss[0].i:0,w.length,"Sentence 1 must begin with “Overall,”.","Overall, + what happened to every item (up, down or stable)","Formula: Sentence 1 = Overall, + general trends.")}
  if(/^overall\s+(?!,)/i.test(s1))add("grammar",0,7,"Put a comma after “Overall”.","Overall,","A linking word at the start of a sentence is followed by a comma.");
  if(ss.length<2)add("structure",Math.max(0,t.length-1),1,"Write a second sentence: It is also clear that + one or two complementary details.","It is also clear that + biggest change / size / what stands out","Formula: Sentence 2 = complementary detail.");
  else{
    if(!/^it is also (clear|noticeable|evident|apparent|notable|obvious)\s+that\b/i.test(s2))add("structure",ss[1].i,Math.min(s2.length,24),"Sentence 2 should begin “It is also clear that”.","It is also clear that + biggest change / size / what stands out","Use the formula from 5.1 so the detail is clearly separate from the trends.");
    if(ss.length>2)items.push({kind:"style",i:ss[2].i,len:Math.min(ss[2].txt.length,30),msg:"An overview is two sentences. Cut the third one.",fix:"keep the trends and ONE or TWO details",why:"More sentences usually means minor details and numbers."});
  }
  // ---- no numbers ----
  const re=/\d+(?:[.,]\d+)*%?/g;let m;
  while((m=re.exec(t))){if(numOK(t,m))continue;
    add("facts",m.index,m[0].length,"No figures in an overview.","say ‘rose’ / ‘the biggest increase’ / ‘far higher’ instead","An overview gives the general picture only. Figures (numbers, percentages) belong in the detail paragraphs. A year such as ‘by 2050’ is fine.")}

    const sd=dset(s1),md=dset(m1);

    else{
      const nm={U:"rose / increased",D:"fell / decreased",S:"stayed the same"};
      for(const k of ["U","D"]){
        if(md.has(k)&&!sd.has(k))add("facts",ss[0].i,0,"Check the graph again: some items "+(k==="U"?"went UP":"went DOWN")+", but your first sentence does not say so.","include a verb like ‘"+nm[k]+"’","Sentence 1 must cover EVERY line, bar or row, not just one trend.");
        else if(!md.has(k)&&sd.has(k)&&!/fluctuat|vari(?:ed|ation)|ups and downs/i.test(m1)){const mm=k==="U"?(()=>{UP.lastIndex=0;UP2.lastIndex=0;return UP.exec(s1)||UP2.exec(s1)})():(()=>{DOWN.lastIndex=0;DOWN2.lastIndex=0;return DOWN.exec(s1)||DOWN2.exec(s1)})();
          add("facts",mm?ss[0].i+mm.index:ss[0].i,mm?mm[0].length:5,"Check the direction: according to the graph nothing "+(k==="U"?"went UP":"went DOWN")+" overall.","look at the first and last point of each line/bar","The verb must match the graph: this is part of Task Achievement (accuracy).")}}
      if(md.has("S")&&/\b(unchanged|same level|stayed the same|remained (?:stable|unchanged|constant|almost)|no change|stable)\b/i.test(m1)&&!sd.has("S"))items.push({kind:"style",i:ss[0].i,len:0,msg:"One item stayed the same on the graph. Mention it too.",fix:"…, while X remained stable / unchanged",why:"Every item should appear in the general trends."})}
  }
  // names need capital letters
  for(const w of String(g.ent||"").split("|")){if(!/^[A-Z][a-z]+(?: [A-Z][a-z]+)*$/.test(w))continue;
    const lo=new RegExp("\\b"+w.toLowerCase()+"\\b","g");let mm2;while((mm2=lo.exec(t))){if(t.slice(mm2.index,mm2.index+w.length)===w)continue;add("grammar",mm2.index,w.length,"Names of countries and places start with a capital letter.",w,"Capital letters: Finland, the United States, Sweden.")}}

  if(s2){
    const entRe=new RegExp("\\b(?:"+(g.ent||"zzzzz")+")","i");
    if(!DET.test(s2)&&!entRe.test(s2))add("structure",ss[1].i,0,"Sentence 2 needs a complementary detail.","the biggest (or smallest) change · the size of the changes · what stands out (highest, overtook, the gap)","Look for: which item changed most? Which is always higher? Did one overtake another?");
  }
  // ---- names covered in S1 (tip) ----
  // ---- praise ----
  if(starts)praise.push("Sentence 1 begins with “Overall,” as in the formula.");
  if(!hasFig(t)&&ss.length>=2)praise.push("No figures: it is a true overview.");
  if(!items.some(x=>x.kind==="facts"&&/direction|went/.test(x.msg))&&ss.length)praise.push("Your trends match the graph.");
  if(s2&&!items.some(x=>x.msg.startsWith("Sentence 2")))praise.push("Sentence 2 adds a complementary detail.");
  // ---- language ----
  const gr=grammarCheck(t),sp=spellCheck(t),st=styleCheck(t);

  const t=(reg.ta.value||"").trim();
  if(!t){reg.fb.className="fb";reg.ta.className="";setOk(reg,false);return}
  if(count){reg.tries=(reg.tries||0)+1;ST.tries[reg.key]=reg.tries}
  let r;try{r=reg.check(t)}catch(e){r={ok:false,items:[{kind:"structure",msg:"The checker had a problem with this sentence. Try writing it again."}],praise:[]}}
  reg.ta.className=r.ok?"ok":"no";
  const hardN=r.items.filter(isHard).length;
  reg.fb.className="fb on "+(r.ok?"good":hardN<=1?"mid":"bad");reg.fb.innerHTML=fbHTML(r,t,reg);
  const was=reg.ok;setOk(reg,r.ok);if(r.ok&&!was&&count&&reg.counted)toast(reg.tries===1?"Correct on the first try!":"Correct — well done!");
  save()}
function setOk(reg,ok){reg.ok=ok;if(ok)ST.ok[reg.key]=1;else delete ST.ok[reg.key];const dt=document.getElementById("dt"+reg.id);if(dt)dt.textContent=ok&&reg.counted?"✓ Done":"";
  if(reg.kind==="select"){}progress()}
function bindInputs(root){
  for(const reg of REG){if(reg.kind!=="write"||reg.bound)continue;reg.ta=document.getElementById(reg.id);if(!reg.ta)continue;reg.bound=true;reg.fb=document.getElementById("f"+reg.id);
    const wc=document.getElementById("wc"+reg.id);reg.wc=()=>{const w=(reg.ta.value.trim().match(/\S+/g)||[]).length;wc.textContent=w?w+" words":""};
    reg.ta.addEventListener("input",()=>{ST.saved[reg.key]=reg.ta.value;reg.wc();if(reg.ok){setOk(reg,false);reg.ta.className=""}save();sendTexts()});
    reg.ta.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runCheck(reg,true)}});
    document.getElementById("w"+reg.id).addEventListener("click",e=>{const a=e.target.closest("[data-a]");if(!a)return;
      if(a.dataset.a==="check")runCheck(reg,true);
      else if(a.dataset.a==="hint"){const h=document.getElementById("h"+reg.id);h.innerHTML=reg.hint||"Write one clear sentence.";h.classList.toggle("on")}
      else if(a.dataset.a==="model"){reg.tries=Math.max(reg.tries,2);runCheck(reg,false)}})}}

/* ---------- progress + score for the site ---------- */
let lastPost="";
function progress(){
  const counted=REG.filter(r=>r.counted),ok=counted.filter(r=>r.ok).length,tot=counted.length;
  $("#pbar").style.width=(tot?100*ok/tot:0)+"%";$("#pnum").textContent=ok+" / "+tot+" done";
  const parts=[];
  CH.steps.forEach((s,si)=>{const rs=counted.filter(r=>r.step===si),o=rs.filter(r=>r.ok).length;const b=$("#st"+si);
    if(b){b.querySelector(".ct").textContent=rs.length?o+"/"+rs.length:"";b.classList.toggle("full",rs.length>0&&o===rs.length)}
    if(rs.length)parts.push({label:s.name,score:o,max:rs.length});
    (s._units||[]).forEach((u,ui)=>{const rr=counted.filter(r=>r.step===si&&r.unit===ui),oo=rr.filter(r=>r.ok).length;const c=$("#u"+si+"_"+ui);
      if(c){const sm=c.querySelector("small");if(sm)sm.textContent=rr.length?oo+"/"+rr.length:"";c.classList.toggle("full",rr.length>0&&oo===rr.length)}})});
  const k=ok+"/"+tot;if(inFrame&&k!==lastPost){lastPost=k;try{parent.postMessage({type:"ielts-workshop-score",score:ok,max:tot,parts:parts.slice(0,8),qs:[]},"*")}catch(e){}}}
let textT=null;
function sendTexts(){if(!inFrame)return;clearTimeout(textT);textT=setTimeout(()=>{
  const lines=REG.filter(r=>r.kind==="write"&&r.counted&&(r.ta&&r.ta.value.trim())).map(r=>(r.ok?"✓ ":"✗ ")+plain(r.prompt).slice(0,90)+"\n   "+r.ta.value.trim());
  if(lines.length)try{parent.postMessage({type:"ielts-workshop-text",texts:[{id:"sentences",text:(CH.kicker+" — the student's sentences\n\n"+lines.join("\n")).slice(0,20000)}]},"*")}catch(e){}},900)}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),2000)}

/* ---------- blocks ---------- */
function blockBar(regs){
  const bar=document.createElement("div");bar.className="blockbar";
  bar.innerHTML='<button class="btn">Check all</button><button class="btn ghost">Clear</button><span class="score"></span>';
  const upd=()=>{bar.querySelector(".score").textContent=regs.filter(r=>r.ok).length+" / "+regs.length+" correct"};
  bar.children[0].onclick=()=>{regs.forEach(r=>{if(r.kind==="select")runSel(r,true);else if((r.ta.value||"").trim())runCheck(r,true)});upd()};
  bar.children[1].onclick=()=>{if(!confirm("Clear your answers in this exercise?"))return;regs.forEach(r=>{if(r.kind==="select"){r.ta.value="";r.ta.className="sel"}else{r.ta.value="";r.ta.className="";r.fb.className="fb";r.wc()}delete ST.saved[r.key];delete ST.tries[r.key];r.tries=0;setOk(r,false)});save();upd()};
  return bar}
/* ---------- Lesson 11 units ---------- */
function gOf(ref){return DATA.T[ref]}
const CATS11=DATA.CATS;
function chipsHTML(t){return '<div class="chips11">'+t.want.map(c=>'<span class="chip11" title="'+esc(CATS11[c][1])+'"><b>'+esc(CATS11[c][0])+'</b><i>'+esc(CATS11[c][1])+'</i></span>').join("")+'</div>'}
function taskCard(si,ui,t){
  const c=document.createElement("div");c.className="ovc";const k="t"+t.n;
  c.innerHTML='<div class="gt"><i>Graph '+t.n+"</i>"+t.title+'</div><div class="gimg">'+(t.tbl?t.tbl:'<img src="'+t.img+'" alt="">')+'</div><div class="clue"><b>Task.</b> '+t.prompt+' Use at least <b>'+t.need+'</b> of these:</div>'+chipsHTML(t);
  const d=document.createElement("div");d.innerHTML=mkInput({key:k,step:si,unit:ui,label:'<span class="lab o">Your sentences</span>',rows:6,model:t.model,prompt:"Graph "+t.n,hint:"Aim for 3 sentences with figures. Pair them with <i>whereas · compared with · respectively</i> and use the chips.",ph:"Write 2–4 sentences …",check:x=>langAnalyse(x,t)});
  c.appendChild(d.firstElementChild);return c}
function taskUnit(si,ui,host,b){
  const w=document.createElement("div");if(b.note){const n=document.createElement("div");n.className="note";n.innerHTML=b.note;w.appendChild(n)}
  const list=document.createElement("div");list.className="ovl";b.refs.forEach(r=>list.appendChild(taskCard(si,ui,gOf(r))));w.appendChild(list);
  w.appendChild(blockBar(REG.filter(r=>r.step===si&&r.unit===ui)));host.appendChild(w)}
/* drills */
function drillSelect(si,ui,q,i,key){const id="s"+(uid++);const reg={id,key:key+i,step:si,unit:ui,counted:true,ok:false,kind:"select",acc:[q[2]],prompt:q[0],tries:0};REG.push(reg);
  const d=document.createElement("div");d.className="q";d.innerHTML='<div class="lab"><span class="lab t">'+(i+1)+'.</span> '+esc(q[0])+'</div><select class="sel" id="'+id+'" data-noreport="1"><option value="">Choose…</option>'+q[1].map(o=>'<option value="'+esc(o)+'">'+esc(o)+'</option>').join("")+'</select><div class="fb" id="f'+id+'"></div>';
  reg.ta=d.querySelector("#"+id);reg.fb=d.querySelector("#f"+id);reg.wc=()=>{};
  reg.ta.addEventListener("change",()=>{ST.saved[reg.key]=reg.ta.value;const v=reg.ta.value;if(!v){setOk(reg,false);return}const ok=v===q[2];reg.tries++;reg.ta.className="sel "+(ok?"ok":"no");reg.fb.className="fb on "+(ok?"good":"bad");
    reg.fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"✓ Correct":"✗ Not quite")+'</span></div><div class="body"><div class="it '+(ok?"praise":"structure")+'"><div>'+(ok?"Yes: <b>"+esc(q[2])+"</b>.":(reg.tries>=2?"Answer: <b>"+esc(q[2])+"</b>.":"Think again: a percentage is not a number of people."))+"</div></div></div>";setOk(reg,ok);save()});
  return d}
function drillType(si,ui,key,i,label,rx,model,tip){return mkInput({key:key+i,step:si,unit:ui,label:label,rows:2,model:model,prompt:label.replace(/<[^>]+>/g,""),hint:tip,ph:"Write your answer …",check:x=>{const ok=new RegExp(rx,"i").test(x);return finish(ok?[]:[{kind:"structure",msg:"Use the required language. Look at the hint above the box.",fix:model}],ok?["Correct. Another good answer is possible too."]:[])}})}
function drillUnit(si,ui,host,b){const w=document.createElement("div");if(b.note){const n=document.createElement("div");n.className="note";n.innerHTML=b.note;w.appendChild(n)}
  if(b.kind==="select"){const l=document.createElement("div");l.className="ovl";DATA.SEL.forEach((q,i)=>{const c=document.createElement("div");c.className="ovc";c.appendChild(drillSelect(si,ui,q,i,"sel"));l.appendChild(c)});w.appendChild(l)}
  else{const l=document.createElement("div");l.className="ovl";const items=b.kind==="frac"?DATA.FRAC:DATA.REW;items.forEach((q,i)=>{const c=document.createElement("div");c.className="ovc";const d=document.createElement("div");
    if(b.kind==="frac")d.innerHTML=drillType(si,ui,"fr",i,'<span class="lab t">'+(i+1)+'.</span> Say <b>'+q[0]+"</b> in another way.",q[1],q[2],"Use a fraction: half, a quarter, two-thirds, one in ten … Add a qualifier if the figure is not exact (nearly, just over).");
    else d.innerHTML=drillType(si,ui,"rw",i,'<span class="lab t">'+(i+1)+'.</span> Rewrite: <i>'+esc(q[0])+"</i> Use <b>"+esc(q[1])+"</b>",q[2],q[3],"Use the phrase in bold.");
    c.appendChild(d.firstElementChild);l.appendChild(c)});w.appendChild(l)}
  w.appendChild(blockBar(REG.filter(r=>r.step===si&&r.unit===ui)));host.appendChild(w)}

/* ---------- page ---------- */
function build(){
  document.title=CH.title.replace(/<[^>]+>/g,"")+" · "+CH.kicker+" · Mr Ikromov's IELTS";
  document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header>'+
    '<nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">'+(CH.footer||"")+'</div><div id="toast"></div>';
  const nav=$("#steps"),main=$("#main");
  CH.steps.forEach((s,si)=>{
    nav.insertAdjacentHTML("beforeend",'<button class="step" id="st'+si+'" data-i="'+si+'"><span class="no">'+s.no+"</span>"+s.name+' <span class="ct"></span></button>');
    const sec=document.createElement("section");sec.className="sec";sec.id="sec"+si;sec.style.display="none";
    sec.innerHTML='<div class="sec-title"><span class="n">'+s.no+"</span><h2>"+s.title+"</h2></div>"+(s.lead?'<p class="lead">'+s.lead+"</p>":"")+(s.note?'<div class="note">'+s.note+"</div>":"");
    main.appendChild(sec);
    // units: each shown on its own (sub menu) when the step has more than one
    const units=[];
    for(const b of s.blocks){
      if(b.type==="html")units.push({label:b.tab||"Info",render:(ui,h)=>{const c=document.createElement("div");c.innerHTML=b.html;h.appendChild(c)}});
      else if(b.type==="task")units.push({label:b.label,render:(ui,h)=>taskUnit(si,ui,h,b)});
      else if(b.type==="drill")units.push({label:b.label,render:(ui,h)=>drillUnit(si,ui,h,b)});
    }
    s._units=units;
    const tabs=units.filter(u=>!u.inline);
    const sub=document.createElement("div");sub.className="subnav";if(s.subnav&&tabs.length>1)sec.appendChild(sub);
    const host=document.createElement("div");sec.appendChild(host);
    units.forEach((u,ui)=>{const box=document.createElement("div");box.className="unit";box.dataset.u=ui;u.render(ui,box);host.appendChild(box);u.box=box;
      if(s.subnav&&!u.inline&&tabs.length>1)sub.insertAdjacentHTML("beforeend",'<button class="sub" id="u'+si+'_'+ui+'" data-u="'+ui+'">'+esc(u.label)+" <small></small></button>")});
    if(s.subnav&&tabs.length>1){sub.onclick=e=>{const b=e.target.closest(".sub");if(b)showUnit(si,+b.dataset.u,true)}}
    const nb=document.createElement("div");nb.className="nextbar";
    nb.innerHTML=(si>0?'<button class="btn ghost" data-go="'+(si-1)+'">← '+CH.steps[si-1].name+"</button>":"<span></span>")+(si<CH.steps.length-1?'<button class="btn go" data-go="'+(si+1)+'">Next: '+CH.steps[si+1].name+" →</button>":'<span class="wc">This is the last step. Check your progress at the top.</span>');
    nb.onclick=e=>{const b=e.target.closest("[data-go]");if(b){showStep(+b.dataset.go);window.scrollTo(0,0)}};sec.appendChild(nb);
  });
  nav.onclick=e=>{const b=e.target.closest(".step");if(b){showStep(+b.dataset.i);window.scrollTo(0,0)}};
  bindInputs();
}
function showUnit(si,ui,scroll){const s=CH.steps[si];if(!s.subnav)return;ST.unit[si]=ui;
  s._units.forEach((u,k)=>{if(u.inline)return;u.box.style.display=k===ui?"":"none";const b=$("#u"+si+"_"+k);if(b)b.classList.toggle("on",k===ui)});
  $$("svg.chart",s._units[ui].box).forEach(c=>{c.classList.remove("draw");void c.getBoundingClientRect();c.classList.add("draw")});
  if(scroll){const t=$("#sec"+si);window.scrollTo({top:Math.max(0,t.getBoundingClientRect().top+window.scrollY-70)})}save()}
function showStep(si){ST.step=si;CH.steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});
  const b=$("#st"+si);if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"center"});
  const s=CH.steps[si];if(s.subnav)showUnit(si,Math.min(ST.unit[si]||0,s._units.length-1),false);save()}
function applyState(){
  for(const r of REG){const v=ST.saved[r.key];if(v==null||!r.ta)continue;r.ta.value=v;r.tries=ST.tries[r.key]||0;
    if(r.kind==="select"){if(v)runSel(r,false)}else{r.wc();if(ST.ok[r.key]){r.ta.className="ok";setOk(r,true)}}}
  showStep(Math.min(ST.step||0,CH.steps.length-1));progress();sendTexts()}

build();
// load saved progress: from the site (in the frame) or from this browser
let got=false;
window.addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="ielts-lab-state"||d.id!==CH.id)return;if(d.theme)setTheme(d.theme);if(!got){got=true;restore(d.data);if(!d.data)fallback()}});
function fallback(){try{restore(localStorage.getItem("ielts-lab:"+CH.id))}catch(e){}}
showStep(0);progress();
if(inFrame){try{parent.postMessage({type:"ielts-lab-load",id:CH.id},"*")}catch(e){}setTimeout(()=>{if(!got){got=true;fallback()}},900)}else{got=true;fallback()}
})();


</script>
</body>
</html>
