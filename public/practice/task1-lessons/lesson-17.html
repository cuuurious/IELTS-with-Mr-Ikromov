<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson 17 · Body Paragraphs and Full Process Answers · Writing Task 1 · Mr Ikromov's IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Writing Lab — shared look for every chapter (2026-11-07).
   Same colours, shapes and fonts as ieltswithmrikromov.com:
   lapis-to-turquoise band, Unbounded headings, Nunito Sans text,
   rounded rectangles only (12 / 14 / 20 / 28 px), one saffron button. */
:root{
  --ink:#f6f5f1;--panel:#fff;--panel2:#efede6;--line:#e3dfd4;--paper:#17213a;--dim:#3a4560;--mist:#55607a;
  --brass:#2456b0;--onbrass:#fff;--sage:#13807c;--sageT:#e2f2f0;--coral:#b23a48;--coralT:#f8e1e4;--amber:#9a5b12;--amberT:#fbefd9;
  --saffron:#e6a33a;--onsaffron:#17213a;--band:#22489a;
  --chipS:#dfe8fb;--chipSt:#1f4aa0;--chipV:#fbe0e6;--chipVt:#a02a44;--chipL:#fdf0d2;--chipLt:#8a5a0c;--chipN:#dcf3ef;--chipNt:#0f6b66;
  --mark:#fff2b3;--shadow:0 1px 2px rgba(23,33,58,.06),0 6px 18px -10px rgba(23,33,58,.18);
  --gUp:#13807c;--gDown:#b23a48;--gMix:#1f3a75;--g2:#c4622d;--grid:#e8e4da;--gtext:#55607a;
}
:root[data-theme="dark"]{
  --ink:#0f1626;--panel:#172036;--panel2:#1e2944;--line:#2b3858;--paper:#eef0f6;--dim:#c6ccda;--mist:#a3abbf;
  --brass:#7fa6f2;--onbrass:#0f1626;--sage:#7fd6d2;--sageT:#123a3c;--coral:#f29aa6;--coralT:#3e1c22;--amber:#f2c07a;--amberT:#3a2a12;
  --saffron:#f0b95a;--band:#1b3570;
  --chipS:#22335c;--chipSt:#b9cdf7;--chipV:#4a2230;--chipVt:#f5b8c6;--chipL:#453512;--chipLt:#f6d48b;--chipN:#153f3d;--chipNt:#9de3dc;
  --mark:#5a4a12;--shadow:none;
  --gUp:#5fd0c6;--gDown:#f08a99;--gMix:#a9bdf0;--g2:#f2a76b;--grid:#2b3858;--gtext:#a3abbf;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Unbounded,"Nunito Sans",system-ui,sans-serif;letter-spacing:-.01em}
b,strong{font-weight:800}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- band ---- */
.band{color:#fff;background:var(--band);background-image:linear-gradient(115deg,var(--band) 0%,#1f6fae 55%,#1a9bb5 100%);border-radius:0 0 28px 28px;padding:22px 0 20px}
.band .kick{font-size:13px;font-weight:800;opacity:.9;letter-spacing:.02em}
.band h1{margin:6px 0 6px;font-size:28px;line-height:1.15;font-weight:600}
.band p{margin:0;max-width:760px;font-size:15px;opacity:.92}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1;max-width:360px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:999px;transition:width .4s}
.prog b{font-size:14px;white-space:nowrap}

/* ---- step menu ---- */
.steps{position:sticky;top:0;z-index:20;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.steps .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.steps .row::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px}
.step .no{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--panel2);font-size:12px}
.step .ct{font-size:12px;color:var(--mist);font-weight:700}
.step.on{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.step.on .no{background:rgba(255,255,255,.22)}.step.on .ct{color:inherit;opacity:.85}
.step.full .ct{color:var(--sage)}.step.on.full .ct{color:inherit}

main{padding:20px 0 40px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.sec-title h2{margin:0;font-size:21px;font-weight:600}
.sec-title .n{font-family:Unbounded,sans-serif;font-size:13px;color:var(--brass);font-weight:600}
.lead{color:var(--dim);margin:0 0 14px;font-size:15px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600}
.card .ins{color:var(--dim);font-size:14px;margin-bottom:12px}
.note{border-radius:14px;background:var(--panel2);padding:12px 14px;font-size:14.5px;color:var(--dim);margin:0 0 16px}
.note b{color:var(--paper)}

/* ---- sub menu (structures, drills) ---- */
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sub{border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:6px 11px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.sub small{color:var(--mist);font-weight:700}
.sub.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass)}
.sub.full small{color:var(--sage)}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nums .sub{min-width:42px;justify-content:center;font-family:Unbounded,sans-serif;font-weight:600}
.nums .sub.seen:not(.on){background:var(--panel2)}

/* ---- learn panel ---- */
.lhd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lhd .big{font-family:Unbounded,sans-serif;font-size:30px;font-weight:600;color:var(--brass);line-height:1}
.lhd h3{font-size:17px;margin:0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.chip{border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px;white-space:pre}
.chip.s{background:var(--chipS);color:var(--chipSt)}.chip.v{background:var(--chipV);color:var(--chipVt)}
.chip.l{background:var(--chipL);color:var(--chipLt)}.chip.n{background:var(--chipN);color:var(--chipNt)}
.chip.p{padding:4px 2px;color:var(--mist)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mist);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.eg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.eg .tg{flex:0 0 auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);background:var(--panel2);border-radius:8px;padding:2px 7px;height:fit-content;margin-top:2px}
.eg.real .tg{background:var(--sageT);color:var(--sage)}
.eg b{background:var(--chipL);color:var(--chipLt);border-radius:6px;padding:0 3px}
.rule,.trap{border-radius:14px;padding:11px 13px;font-size:14.5px;margin-top:10px}
.rule{background:var(--sageT)}.rule>b:first-child{color:var(--sage)}
.trap{background:var(--coralT)}.trap>b:first-child{color:var(--coral)}
.trap s{color:var(--coral)}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.gcap{font-size:13px;color:var(--mist);margin:6px 2px 0}
.gmodel{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:14.5px;margin-top:8px}
.replay{margin-top:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:5px 11px;font-weight:800;font-size:13px}
.yourturn{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.yourturn h4{margin:0 0 8px;font-size:15px;color:var(--sage)}

table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.t th{text-align:left;background:var(--panel2);padding:9px 12px;font-weight:800}
.t td{padding:9px 12px;border-top:1px solid var(--line)}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mist .x,.mist .v{border-radius:14px;padding:10px 12px;font-size:14.5px}
.mist .x{background:var(--coralT)}.mist .x s{color:var(--coral)}
.mist .v{background:var(--sageT)}

/* ---- charts ---- */
svg.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--gtext);font-size:11px;font-family:"Nunito Sans",system-ui,sans-serif}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .lbl{font-size:11.5px;font-weight:800;font-family:"Nunito Sans",system-ui,sans-serif}
.chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.3s ease-out forwards}
@keyframes dl{to{stroke-dashoffset:0}}
.chart .key{font-size:11.5px;font-weight:700;fill:var(--paper);font-family:"Nunito Sans",system-ui,sans-serif}

/* ---- graph exercise cards ---- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.gcard .gt{font-weight:800;font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gcard .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--panel2);color:var(--mist);border-radius:8px;padding:2px 7px}
.gcard .gt span{font-weight:600;color:var(--mist);font-size:13px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-size:15px;margin-bottom:8px}
.q .p .num{font-weight:800;color:var(--brass);margin-right:6px}
.q .p .tg{display:inline-block;font-size:11px;font-weight:800;background:var(--chipS);color:var(--chipSt);border-radius:8px;padding:1px 7px;margin-right:4px}
.q .p .sm{font-size:13px;color:var(--mist)}
.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:14.5px;margin-bottom:6px}
.wk .l{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}
select.sel{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--paper);min-width:150px}
select.sel.ok{border-color:var(--sage);background:var(--sageT)}select.sel.no{border-color:var(--coral);background:var(--coralT)}

/* ---- input + coach ---- */
.iw{margin-top:6px}
.iw .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--paper);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:62px;outline:none}
textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:8px 16px;font-weight:800;font-size:14px;background:var(--brass);color:var(--onbrass)}
.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:12.5px;color:var(--mist)}
.done-tag{font-size:12.5px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:14px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.fb.on{display:block}
.fb .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px}
.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:12px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:15px;line-height:1.7;margin-bottom:6px}
.ann mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--amber)}
.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:14.5px}
.it .k{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}
.tryit{margin-top:3px;font-weight:800;color:var(--sage)}
.why{margin-top:2px;color:var(--mist);font-size:13.5px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:14.5px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.blockbar .score{font-weight:800;color:var(--dim);font-size:14px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.foot{color:var(--mist);font-size:12.5px;text-align:center;padding:10px 18px 30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);font-weight:800;border-radius:14px;padding:9px 16px;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .band{padding:16px 0 16px;border-radius:0 0 20px 20px}
  .band h1{font-size:22px}
  .band p{font-size:14px}
  .two,.ggrid,.mist{grid-template-columns:1fr}
  .card{padding:14px}
  .step{padding:7px 11px;font-size:13px}
  .sec-title h2{font-size:18px}
  .chip{font-size:13px}
}
@media print{.steps,.irow,.blockbar,.nextbar{display:none}.sec{display:block!important}}


/* ---- Lesson 5 additions ---- */
.gimg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.gimg img{max-width:100%;height:auto;max-height:360px}
.ovl{display:grid;grid-template-columns:1fr;gap:16px}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.ovc .gt{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ovc .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--brass);color:var(--onbrass);border-radius:8px;padding:2px 8px}
.ovc .gt span{font-weight:600;color:var(--mist);font-size:12.5px}
.phr{border-radius:14px;background:var(--amberT);padding:9px 12px;margin:10px 0 4px;font-size:13.5px}
.phr b{color:var(--amber);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.phr i{font-style:normal;font-weight:700;display:inline-block;margin:2px 4px 2px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.clue{font-size:13.5px;color:var(--dim);margin:2px 0 6px}
.clue u{text-decoration:none;font-weight:800;color:var(--paper)}
.step3{display:grid;grid-template-columns:1fr;gap:0}
.iw+.iw{margin-top:12px}
.iw .lab.i{color:#6d4bc2}.iw .lab.t{color:var(--brass)}.iw .lab.d{color:var(--amber)}.iw .lab.o{color:var(--sage)}
:root[data-theme="dark"] .iw .lab.i{color:#c3b0f5}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sent{border-radius:14px;padding:12px 14px;font-size:15px}
.sent .st{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.sent.s1{background:var(--chipS);border:1px solid color-mix(in srgb,var(--chipSt) 35%,transparent)}.sent.s1 .st{color:var(--chipSt)}
.sent.s2{background:var(--amberT);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent)}.sent.s2 .st{color:var(--amber)}
mark.t{background:var(--mark);color:inherit;border-radius:5px;padding:0 3px}
mark.d{background:#ffd9a8;color:#3a2a12;border-radius:5px;padding:0 3px}
:root[data-theme="dark"] mark.d{background:#6a4513;color:#fbe4c4}
.legend2{font-size:13px;color:var(--mist);margin:10px 0}
.stp{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;margin:0 0 8px}
.stp b.n{flex:0 0 auto;font-family:Unbounded,sans-serif;font-size:12px;border-radius:9px;padding:4px 9px;color:#fff;background:var(--brass)}
.stp b.n.d{background:#b7791f}
.stp em{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;color:var(--mist);white-space:nowrap}
ul.kf{list-style:none;margin:6px 0 10px;padding:0;font-size:14.5px}
ul.kf li{margin:3px 0}
ul.kf b.tg{display:inline-block;min-width:54px;text-align:center;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:7px;padding:1px 6px;margin-right:6px;color:#fff;background:var(--brass)}
ul.kf b.tg.d{background:#b7791f}
.exh{font-weight:800;font-size:15px;margin:0 0 6px}
.exov{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:15px;line-height:1.6}
.phg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phg h4{margin:0 0 6px;font-size:14px}
.phg .eg{padding:8px 0}
.q .sel{margin-top:2px}
.why5{border-radius:12px;background:var(--panel2);padding:8px 11px;font-size:14px;margin-top:8px}
@media (max-width:760px){.sc,.phg{grid-template-columns:1fr}.stp em{display:none}}
.gfig{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--panel)}
.gfig-t{font-weight:800;font-size:13.5px;margin-bottom:2px}.gfig-u{font-size:12px;color:var(--mist)}
.gref{color:var(--mist);font-size:12.5px;font-weight:600}
.qg{border:1px solid var(--line);border-radius:12px;padding:6px 10px 4px;margin:6px 0 8px;background:var(--panel);max-width:560px}
.qg svg{display:block}.qgc{font-size:12px;color:var(--mist);margin-top:2px}
.gbox svg{display:block}
.chip.s,.chip.v,.chip.l,.chip.n{white-space:pre-wrap}
.gapgrid{display:grid;grid-template-columns:1fr;gap:0}
.q.g .p{line-height:2.1}
input.gap{font:inherit;border:0;border-bottom:2px solid var(--line);background:transparent;color:inherit;text-align:center;padding:0 2px;margin:0 3px;outline:none;border-radius:4px 4px 0 0}
input.gap:focus{border-bottom-color:var(--brass);background:var(--panel2)}
input.gap.ok{border-bottom-color:var(--sage);background:var(--sageT)}
input.gap.no{border-bottom-color:var(--coral);background:var(--coralT)}
.clue{font-size:13.5px;color:var(--dim);margin:6px 0 0}
.jobs td:first-child{font-weight:700}

const CHAPTER={"id": "wt1-lesson17", "kicker": "Writing Task 1 · Lesson 17", "title": "Body paragraphs and <span style=\"color:#ffd27a\">full process answers</span>", "lead": "Organize the two body paragraphs of a process answer and write seven complete answers. Practice topic sentences, then write full answers. The Writing Coach checks the <b>paragraphs</b>, the <b>introduction</b>, the <b>overview</b>, the <b>stages</b>, the <b>passive voice</b>, the <b>structures</b>, the <b>tense</b>, the <b>grammar</b> and the <b>spelling</b>.", "footer": "Mr Ikromov's IELTS · Writing Task 1 · Lesson 17 · Body Paragraphs and Full Process Answers. The Writing Coach is a teaching tool: it finds common mistakes and checks your answer against the diagram, but it is not an examiner. Another logical answer is accepted; compare with the model after you try.", "steps": [{"no": "17.1", "name": "Learn", "title": "Organizing the body and writing a full process answer", "subnav": true, "lead": "Four paragraphs, three ways to split the body, topic sentences and two full model answers.", "blocks": [{"type": "html", "tab": "Four paragraphs", "html": "<p class=\"lead\">A full process answer has <b>four paragraphs</b> and at least <b>150 words</b>. Spend about 20 minutes.</p><div class=\"stp\"><b class=\"n\">1</b><span><b>Introduction</b> · one sentence: what the diagram shows.</span><em>Lesson 16</em></div><div class=\"stp\"><b class=\"n d\">2</b><span><b>Overview</b> · the number of stages, the start and the end, one general point.</span><em>Lesson 16</em></div><div class=\"stp\"><b class=\"n\">3</b><span><b>Body 1</b> · a topic sentence, then the first group of stages.</span><em>details</em></div><div class=\"stp\"><b class=\"n d\">4</b><span><b>Body 2</b> · a topic sentence, then the remaining stages.</span><em>details</em></div><div class=\"card\"><div class=\"exh\">Time plan · 20 minutes</div><ul style=\"margin:4px 0 4px 18px\"><li><b>3 min</b> · read the diagram: number the steps, find the start and the end</li><li><b>2 min</b> · decide where to split the body</li><li><b>2 min</b> · introduction</li><li><b>3 min</b> · overview</li><li><b>8 min</b> · two body paragraphs (about 60–80 words each)</li><li><b>2 min</b> · check tense, passive and spelling</li></ul></div><div class=\"note\"><b>Both layouts are correct.</b> The introduction and the overview can be two short paragraphs or one. Leave a blank line between paragraphs.</div>"}, {"type": "html", "tab": "Organizing the body", "html": "<p class=\"lead\">Write <b>every step</b>, in order. Split the steps into <b>two body paragraphs</b>. Decide where to split before you write.</p><div class=\"card\"><div class=\"exh\">Way 1 · by stage groups</div><div>Body 1 = the first group of stages. Body 2 = the rest. <b>Use it</b> when the process has named stages (preparing, processing, packing).</div></div><div class=\"card\"><div class=\"exh\">Way 2 · two halves</div><div>Body 1 = the first half of the steps. Body 2 = the second half. <b>Use it</b> when the steps are equal and there are no clear stages.</div></div><div class=\"card\"><div class=\"exh\">Way 3 · by function</div><div>Body 1 = the structure (what the device is made of). Body 2 = how it works. <b>Use it</b> for a device such as a solar panel.</div></div><div class=\"card\"><div class=\"exh\">Where the models split</div><table class=\"t\"><thead><tr><th>Diagram</th><th>Body 1</th><th>Body 2</th></tr></thead><tbody><tr><td>Producing electricity from coal</td><td>Mining, crushing and turning the coal into gas</td><td>Cooling, cleaning, burning and supplying electricity</td></tr><tr><td>How an igloo is made out of snow</td><td>Cutting blocks, building the circle and the dome</td><td>Closing the dome, filling gaps, the entrance and the air holes</td></tr><tr><td>The production of smoked fish</td><td>Preparing the fish: gutting, soaking, heating, drying</td><td>Smoking, coloring and packing</td></tr><tr><td>The design of a modern landfill</td><td>Construction and use</td><td>Closure</td></tr><tr><td>The process of making soft cheese</td><td>Mixing to fermentation</td><td>Evaporation to the finished cheese</td></tr><tr><td>How a simple solar panel works</td><td>The structure: box, transparent top, inlet and outlet</td><td>How it heats air and how it heats water</td></tr><tr><td>How tomato ketchup is made</td><td>Picking the tomatoes to cooling the pulp</td><td>Bottling to eating</td></tr></tbody></table></div><div class=\"note\"><b>Any logical split is accepted.</b> The table shows where the model answers split. <b>Never skip a step</b>: mention every stage.</div>"}, {"type": "html", "tab": "Topic sentences", "html": "<p class=\"lead\">The <b>topic sentence</b> opens each body paragraph. It starts the stage or the group of stages the paragraph covers.</p><div class=\"card\"><div class=\"exh\">Formulas</div><div class=\"eg\"><span class=\"tg\">Body 1</span><span><b>First</b>, blocks are cut from hard-packed snow… · <b>The first stage of the process requires</b> the involvement of several parties. · <b>The process begins with</b> picking tomatoes…</span></div><div class=\"eg\"><span class=\"tg\">Body 2</span><span><b>The next stage of the process starts when</b> the plastic goes through a machine… · <b>Once</b> the dome is nearly complete, … · <b>After cooling</b>, the gas passes through … · <b>Having been cooled</b>, the ketchup is poured into bottles.</span></div><div class=\"eg\"><span class=\"tg\">Device</span><span><b>The panel consists of</b> a box with a transparent top. · <b>To heat air</b>, sun rays pass through …</span></div><div class=\"eg\"><span class=\"tg\">Universal</span><span><b>Before</b> the plastic bottles are recycled, they go through a number of steps.</span></div></div><div class=\"card\"><div class=\"exh\">Linking the steps</div><table class=\"t\"><thead><tr><th>Type</th><th>Language</th></tr></thead><tbody><tr><td>Sequence</td><td>First, … · The first stage … · Next · Then · After that · Following this · Finally · The last / final step is …</td></tr><tr><td>Structures</td><td>Once + V3 · After being + V3 · Having been + V3 · …, after which … · …, where … · …, which … · so that · before being</td></tr><tr><td>Stages</td><td>The first stage of the process requires … · The next stage starts when … · In the final stage …</td></tr><tr><td>Result</td><td>In this way, … · As a result, …</td></tr></tbody></table></div><div class=\"card\"><div class=\"exh\">Rules for body paragraphs</div><ul style=\"margin:4px 0 4px 18px\"><li>Mention <b>every single step</b>.</li><li>Do <b>not</b> start every sentence with a linker (First, Next, Then, Finally). Join steps with the <b>structures from Lesson 15</b>.</li><li>Use the <b>present simple passive</b>: <i>is crushed, are cut</i>.</li><li>The last stage can close with <i>In this way, …</i> (one sentence).</li></ul></div><div class=\"note\"><b>Remember:</b> three different structures in the body is a good target: <i>once, after which, where, which, so that, having been, before being</i>.</div>"}, {"type": "html", "tab": "Full answers", "html": "<p class=\"lead\">Two complete answers. Read the topic sentences (highlighted) and the way the structures join the steps.</p><div class=\"card\"><div class=\"exh\">How an igloo is made out of snow · by stage groups</div><div class=\"gimg\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAGTAwwDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAUBAgMEBgcI/8QAWRAAAQMDAgMEBAoFBA0KBwEAAQACAwQFERIhBjFBE1FhcRQigZEHFRYyQlWVobHRI1JicsEzQ4KSJDQ1RFN0k5Sys9Lh8Bc2RVRjc3WDosIIJUZkhKPx4v/EABkBAQEBAQEBAAAAAAAAAAAAAAABAgMEBf/EAC8RAQEAAgEEAgEDAgUFAQAAAAABAhEDEiExUQRBExRhkUJxBSIyUvAVYqHR4fH/2gAMAwEAAhEDEQA/APfkREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAXPXXi+32jia2WKojqDVXH+RcxoLBvjc525LoV438J4r3fCbwq21v  process of building an igloo from snow.</span></div><div class=\"eg\"><span class=\"tg\">Overview</span><span>Overall, building an igloo involves seven stages, beginning with cutting blocks of snow and ending with making air holes inside. It is also clear that the finished structure is a dome built entirely from snow.</span></div><div class=\"eg\"><span class=\"tg\">Body 1</span><span><mark class=\"t\">First, blocks are cut from hard-packed snow using a snow saw.</mark> The blocks are then arranged in a circle about 4 meters across, leaving a gap for the entrance. Next, further rows are built on top of this circle to form a dome, with large blocks used at the bottom and smaller ones higher up, so that the walls curve inward.</span></div><div class=\"eg\"><span class=\"tg\">Body 2</span><span><mark class=\"t\">Once the dome is nearly complete, a final block is placed in the center of the top to close it.</mark> The builder then fills any gaps in the exterior with loose snow, which makes the walls solid and 2 meters high. After that, the entrance is finished, and finally, air holes are drilled through the interior walls so that fresh air can enter.</span></div><div class=\"note\" style=\"margin-top:6px\">Highlighted: the <b>topic sentence</b> of each body paragraph. <b>Body 1:</b> Cutting blocks, building the circle and the dome. <b>Body 2:</b> Closing the dome, filling gaps, the entrance and the air holes.</div></div><div class=\"card\"><div class=\"exh\">How tomato ketchup is made · by stage groups</div><div class=\"gimg\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAI2AwwDASIAAhEBAxEB/8QAHAAAAQQDAQAAAAAAAAAAAAAAAAEFBgcCAwQI/8QAXxAAAQMDAgMEBAgHBhQFAgcBAQIDBAAFEQYhEjFBBxNRYRQicYEVIzKRobHB0RYkQlJicrIXM4KSotIIJSY0NTZDREVTY2RzdIOTo7PC4VRVhJTw0+IYJ0ZWZXWFlf/EABsBAQAC ith burgers and fries.</span></div><div class=\"note\" style=\"margin-top:6px\">Highlighted: the <b>topic sentence</b> of each body paragraph. <b>Body 1:</b> Picking the tomatoes to cooling the pulp. <b>Body 2:</b> Bottling to eating.</div></div>"}, {"type": "html", "tab": "Checklist", "html": "<p class=\"lead\">Check your answer before you finish.</p><div class=\"card\"><div class=\"exh\">Checklist</div><ul style=\"margin:4px 0 4px 18px\"><li>Four paragraphs, with a blank line between them</li><li>The introduction is one sentence, in your own words</li><li>The overview starts with <i>Overall</i>: number of stages, start, end, one general point</li><li>Each body paragraph starts with a topic sentence</li><li>Every stage is mentioned, in order</li><li>Present simple passive, no <i>was / were</i></li><li>At least three different structures</li><li>About 160–200 words</li></ul></div><div class=\"note\"><b>Select, do not copy.</b> You may use any logical order of the structures. The coach checks the features, the tense and the structures.</div>"}]}, {"no": "17.2", "name": "Practice", "title": "Short drills", "subnav": true, "lead": "Choose the organization, choose and write topic sentences, and fix body paragraphs.", "blocks": [{"type": "sel", "key": "org", "label": "Choose the organization", "note": "<b>Choose</b> the best way to split the body.", "items": [["A diagram has three named stages: construction, use and closure. The first two are long, the last is short.", ["By stage groups (first stage, then the rest)", "Two halves (steps 1–4, steps 5–8)", "By function (structure, then how it works)"], "By stage groups (first stage, then the rest)", "Group the stages: Body 1 = the first stages, Body 2 = the last stage."], ["A diagram shows what a device is made of and how it works in two ways.", ["By stage groups (first stage, then the rest)", "Two halves (steps 1–4, steps 5–8)", "By function (structure, then how it works)"], "By function (structure, then how it works)", "S onsists of eight main stages, starting with the mining of coal and ending with the supply of electricity to homes and factories. It is also clear that waste heat is released at two points along the way.", "full": "The diagram illustrates how electricity is produced from coal.\n\nOverall, the process consists of eight main stages, starting with the mining of coal and ending with the supply of electricity to homes and factories. It is also clear that waste heat is released at two points along the way.\n\nFirst, coal is extracted from a mine and then crushed into small pieces. The crushed coal is loaded onto a truck and transported to a gasifier, where it is converted into gas with the help of heat. Once the gas has been produced, it travels to a cooling unit, where waste heat is given off.\n\nAfter cooling, the gas passes through a cleaning stage and is then burned in a gas power plant, which also releases waste heat. Finally, the electricity that is generated is supplied to ordinary homes and to a factory. In this way, coal is turned into electricity in a series of connected steps, with waste heat released at both the cooling and the power plant stages.", "subj": "electricity|coal", "start": "min(?:e|ing)|extract", "end": "electricity|homes|factor|suppl", "nset": [7, 8, 9], "kind": "stages", "ent": ["\\bmine", "crush", "truck", "gasifier", "\\bgas\\b", "cool", "clean", "power plant", "electricity", "homes?|factor", "waste heat"], "minpas": 4, "minstr": 3, "plan": "Suggested organization: <b>by stage groups</b>. <b>Body 1:</b> Mining, crushing and turning the coal into gas. <b>Body 2:</b> Cooling, cleaning, burning and supplying electricity. Another logical organization is accepted."}, {"n": 2, "key": "igloo", "title": "How an igloo is made out of snow", "prompt": "The diagram below shows how an igloo is made out of snow.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA at the site is built with layers that protect the surrounding rock, and that liquid and gas are collected rather than allowed to escape.", "full": "The diagram shows how a modern landfill site for household waste is designed and used.\n\nOverall, the landfill goes through three stages: construction, use and closure. It is also clear that the site is built with layers that protect the surrounding rock, and that liquid and gas are collected rather than allowed to escape.\n\nIn the construction stage, a large hole is first dug in the natural rock. The bottom and sides of the hole are lined with clay and a synthetic lining, and drainage pipes are laid at the bottom, connected to a drainage tank underneath. During the use stage, trucks dump household waste into the hole, where it builds up above the pipes, and any liquid that comes out of the waste flows down through the pipes into the tank.\n\nWhen the landfill is full, it is closed by covering the waste with a layer of clay. A pipe is then inserted through the cover so that the gases produced by the decomposing waste can be collected and released.", "subj": "landfill", "start": "construct|dug|hole", "end": "clos|cover|clay|gas", "nset": [3, 4, 5, 6, 7], "kind": "stages", "ent": ["\\bhole|dug", "clay", "lining", "drain|pipe", "tank", "waste", "dump|truck", "cover", "gas"], "minpas": 4, "minstr": 3, "plan": "Suggested organization: <b>by stage</b>. <b>Body 1:</b> Construction and use. <b>Body 2:</b> Closure. Another logical organization is accepted."}, {"n": 5, "key": "cheese", "title": "The process of making soft cheese", "prompt": "The diagram below shows the process of making soft cheese.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAGqA+gDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAEGAgUHBAMI/8QAXxAAAQMDAQMGCAgICAoJBA  cooled to 9°C for two hours. After that, salt is added, and the mixture moves into a fermentation tank, where it is heated to 37°C and mixed for six hours.\n\nThe mixture then passes to an evaporation tank, where it is heated to 100°C for eight hours, and steam is released. After this, it goes through a filter, which separates the waste water from the thick mixture. Finally, the soft cheese is cooled to 5°C for eight hours. In this way, a liquid mixture is gradually turned into a thick, soft cheese through repeated heating and cooling.", "subj": "cheese", "start": "mix|milk|water", "end": "cool|cheese", "nset": [5, 6, 7], "kind": "stages", "ent": ["milk|water", "\\btank", "9\\s*°|cool", "salt", "ferment|37", "evaporat|100", "steam", "filter", "5\\s*°|soft cheese"], "minpas": 4, "minstr": 3, "plan": "Suggested organization: <b>by stage groups</b>. <b>Body 1:</b> Mixing to fermentation. <b>Body 2:</b> Evaporation to the finished cheese. Another logical organization is accepted."}, {"n": 6, "key": "solar", "title": "How a simple solar panel works", "prompt": "The diagrams below show the structure of a simple solar panel and how it works.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAJ3A+gDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAEGAgQFBwMI/8QAXBAAAQMDAQQDBw4ICggFBQEAAQACAwQFEQYSITFRE0FhBxQicZGT0RUWMjU2VFV0dYGSlLGyI0JSU2Khs9IXMzRERVZyc8HhJCUmQ0Zkg/AnY4KEojdllcLxo//EABoBAQADAQEBAAAAAAAAAAAAAAABAgMEBQb/xAAyEQEAAgIBBAICAQMDAwQDAAAAAQIDERIEITFREzIUQWEFIlIGI4FCU3EVQ5HwM6HB/9oADAMBAAIRAxEAPwD35ERAUKUQQilQglEUIJRQpQFCnCIIRThMICIiAiIgIiICKFKAiKEEogWLyGjJOB15QTuKLnWa8Ul8ppaijeZIY5nRdJjAeW4yR2b/ANS6OyOSAinZCbIQQmVOyO1RsjkgZTKnZHJFAhFKIIRSiCMopx2JhBCeRSpUjHyIpRBCKVKDFFOOxSgxTeslGAgjf1plZIgxRSpQYHKLNEHzwcrJZIko0xRZIiWKLJEGKLJENsUWSIMUWSIMUWSIMUWSIMU3rJEEfMnzKUQYoskQYossJhBiilSgx d to heat either air or water.\n\nOverall, the panel is a simple box with a transparent top, and it uses the energy of the sun to warm either air or water. It is also clear that the two versions work in much the same way, but the water version contains a pipe.\n\nThe panel consists of a box with a transparent top. It has an inlet on one side, which allows cold air or water to enter, and an outlet on the opposite side, through which warmed air or water leaves.\n\nTo heat air, sun rays pass through the transparent top and warm the inside of the box. Cool air enters through the inlet, is warmed as it moves through the box, and leaves through the outlet as warm air. To heat water, a water pipe is placed inside the box. Cool water flows into the pipe through the inlet, and the heat from the sun warms it, so that warm water comes out of the outlet.", "subj": "solar panel|panel", "start": "", "end": "", "nset": [], "kind": "device", "ent": ["box", "transparent", "inlet", "outlet", "sun", "cool|cold", "warm", "pipe", "air", "water"], "minpas": 2, "minstr": 2, "plan": "Suggested organization: <b>by function</b>. <b>Body 1:</b> The structure: box, transparent top, inlet and outlet. <b>Body 2:</b> How it heats air and how it heats water. Another logical organization is accepted."}, {"n": 7, "key": "ketchup", "title": "How tomato ketchup is made", "prompt": "The pictures below show how tomato ketchup is made.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCALMA9oDASIAAhEBAxEB/8QAHAAAAQQDAQAAAAAAAAAAAAAAAAECBgcDBAUI/8QAXRAAAQMDAwEEBQYIBQ8KBwADAQACAwQFEQYSITEHE0FRFCJhcYEVMpGhsdEWIzNCUmKywRckcpKTCCUmNDVDU2NzdIKDorPhJzY3REVUZISUo0ZVZcLS8PEYldP/xAAbAQEAAgMBAQAAAAAAAAAAAAAAAQMCBAUGB//EADgRAQACAgEEAQIEBQMCBQUAAAABAgMRBAUSITFBE1EUIjJhBhVScZFCgaEjMxYksdHwU1RywfH/2gAMAwEAAhEDEQA/ALlYeqeOqY  ketchup factory using a truck, where the production of tomato ketchup begins. Once the tomatoes have been delivered, their stalk, seeds, and skin are then removed, and they are placed in a container. In the next stage, the tomatoes in the container are crushed to pulp, and other ingredients, such as sugar, vinegar, and salt, are added. After that, the pulp is boiled and then cooled for two hours.\n\nHaving been cooled, it is then poured into bottles and labeled. Next, the ketchup goes through a quality control process, which inspects the quality of the product. Finally, the ketchup bottles are packed into boxes and sent to supermarkets, where customers buy the ketchup and eat it with burgers and fries.", "subj": "ketchup", "start": "pick|collect", "end": "eat|burger|supermarket|distribut|label|box", "nset": [3, 14, 15, 16], "kind": "stages", "ent": ["pick", "sort", "truck|factory|sent", "stalk|seeds|skin|remov", "crush|pulp", "sugar|vinegar|salt", "boil", "two hours|cool", "bottle", "label", "quality", "box|pack", "supermarket", "burger|fries"], "minpas": 4, "minstr": 3, "plan": "Suggested organization: <b>by stage groups</b>. <b>Body 1:</b> Picking the tomatoes to cooling the pulp. <b>Body 2:</b> Bottling to eating. Another logical organization is accepted."}], "TS": [{"ti": 0, "label": "Coal · Body 1 covers the mining, crushing and gasifying.", "rx": "first|begin|start|mine|extract|crush", "model": "First, coal is extracted from a mine and then crushed into small pieces."}, {"ti": 0, "label": "Coal · Body 2 covers the cooling, cleaning, burning and supply.", "rx": "after|next|then|cool|clean|burn|power|electric|second|once", "model": "After cooling, the gas passes through a cleaning stage and is then burned in a gas power plant."}, {"ti": 1, "label": "Igloo · Body 2 covers the closing of the dome, the gaps, the entrance and the air holes.", "rx": "dome|final|once|complete|after|next|top|gap|close", "model": "Once the dome is nearly complete, a final block is placed in the center of the top to close it."}, {"ti": 3, "label": "Landfill · Body 2 covers the closure of the full landfill.", "rx": "full|clos|cover|clay|finally|when|once|after", "model": "When the landfill is full, it is closed by covering the waste with a layer of clay."}, {"ti": 6, "label": "Ketchup · Body 1 covers the picking, sorting, sending, removing and crushing.", "rx": "begin|start|first|pick|process|tomatoes", "model": "The process of producing ketchup begins with picking tomatoes and placing them in baskets."}, {"ti": 6, "label": "Ketchup · Body 2 covers the bottling, quality control, packing and selling.", "rx": "once|after|cool|bottle|pour|next|having|then|finally|final|second|stage", "model": "Having been cooled, the ketchup is poured into bottles and labeled."}, {"ti": 5, "label": "Solar panel · Body 1 covers the structure of the device.", "rx": "consist|box|structure|made|has|transparent|comprise|compose", "model": "The panel consists of a box with a transparent top."}, {"ti": 4, "label": "Cheese · Body 2 covers the evaporation, filtering and final cooling.", "rx": "evaporat|then|passes|next|after|second|stage|once", "model": "The mixture then passes to an evaporation tank, where it is heated to 100°C for eight hours."}], "PFIX": [["First, the fish were gutted. Then they were soaked in salt water. Then they were heated.", "^(?!.*\\b(?:was|were)\\b)(?=.*\\b(?:are|is)\\s+gutted\\b)(?=.*\\b(?:soaked|heated)\\b)", "First, the fish are gutted. They are then soaked in salt water, after which they are heated."], ["Then coal is mined. Then it is crushed. Then it is loaded onto a truck. Then it is taken to a gasifier.", "^(?!(?:.*\\bthen\\b){3,})(?=.*\\b(?:once|after|where|which|before|so that|having|and)\\b)", "Once mined, the coal is crushed and loaded onto a truck, which takes it to a gasifier."], ["Workers cut blocks of snow. Workers arrange the blocks in a circle. Workers build rows on top.", "(?=.*\\bcut\\b)(?=.*\\barranged\\b)(?=.*\\bbuilt\\b)(?=.*\\b nd closure. It is also clear that the site is built with layers that protect the surrounding rock, and that liquid and gas are collected rather than allowed to escape.\n\nIn the construction stage, a large hole is first dug in the natural rock. The bottom and sides of the hole are lined with clay and a synthetic lining, and drainage pipes are laid at the bottom, connected to a drainage tank underneath. During the use stage, trucks dump household waste into the hole, where it builds up above the pipes, and any liquid that comes out of the waste flows down through the pipes into the tank.\n\nWhen the landfill is full, it is closed by covering the waste with a layer of clay. A pipe is then inserted through the cover so that the gases produced by the decomposing waste can be collected and released.", "The diagram illustrates how soft cheese is produced.\n\nOverall, the process has five main stages, starting with mixing milk and water and finishing with cooling the cheese. It is also clear that the whole process takes about a day, and that waste water is removed before the final stage.\n\nFirst, milk and water are poured into a tank and mixed. The mixture is then cooled to 9°C for two hours. After that, salt is added, and the mixture moves into a fermentation tank, where it is heated to 37°C and mixed for six hours.\n\nThe mixture then passes to an evaporation tank, where it is heated to 100°C for eight hours, and steam is released. After this, it goes through a filter, which separates the waste water from the thick mixture. Finally, the soft cheese is cooled to 5°C for eight hours. In this way, a liquid mixture is gradually turned into a thick, soft cheese through repeated heating and cooling.", "The diagrams illustrate how a simple solar panel is built and how it can be used to heat either air or water.\n\nOverall, the panel is a simple box with a transparent top, and it uses the energy of the sun to warm either air or water. It is also clear that the two versions work function dirsOf(t){const out=[];const s=t.replace(/[’‘]/g,"'");const all=[];let m;

    const walk=o=>{if(!o)return;if(typeof o==="string"){feed(o);return}if(Array.isArray(o)){o.forEach(walk);return}if(typeof o==="object"){for(const k in o){if(k==="graphs")continue;walk(o[k])}}};

  if(w.endsWith("ed")){o.push(w.slice(0,-2));o.push(w.slice(0,-1))}
  if(w.endsWith("ing")){o.push(w.slice(0,-3));o.push(w.slice(0,-3)+"e")}
  if(w.endsWith("ly")){o.push(w.slice(0,-2));o.push(w.slice(0,-3)+"y")}

function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;

function nearWord(w){let best=null,bd=9;const lim=w.length>=8?2:1;

function styleCheck(text){
  const items=[];
  for(const r of STYLE){const re=new RegExp(r.re.source,r.re.flags.includes("g")?r.re.flags:r.re.flags+"g");let m;

  if(words>45)items.push({kind:"style",i:0,len:0,msg:"This sentence is very long ("+words+" words).",fix:"split it into two sentences",why:"Aim for 20–35 words per sentence so the reader does not get lost."});
  if(!/[.!?]\s*$/.test(text.trim()))items.push({kind:"style",i:Math.max(0,text.trimEnd().length-1),len:1,msg:"End the sentence with a full stop.",fix:".",why:"Punctuation is part of accuracy."});

function spellCheck(text){
  const items=[];const re=/[A-Za-z][A-Za-z'’-]*/g;let m;const sents=sentences(text);
  while((m=re.exec(text))){const raw=m[0];const w=raw.toLowerCase().replace(/['’]s$/,"");
    if(w.length<4)continue;
    if(MISSP[w]){items.push({kind:"spelling",i:m.index,len:raw.length,msg:"Spelling: ‘"+raw+"’",fix:MISSP[w],why:"Correct spelling: "+MISSP[w]+".",hard:true});continue}
    if(known(w))continue;
    // capitalised word inside a sentence = a name
    const atStart=sents.some(s=>s.i===m.index);
    if(/^[A-Z]/.test(raw)&&!atStart)continue;
    if(w.includes("-"))continue;
    const near=nearWord(w);
    if(near)items.push({kind:"spelling",i:m.index,len:raw.length,msg:"Possible spelling mistake: ‘"+raw+"’",fix:near,why:"Check the spelling. Did you mean ‘"+near+"’?",hard:false})}
  return items}

  if(!starts&&!wb){const w=(s1.match(/^\S+/)||[""])[0];add("structure",ss[0]?ss[0].i:0,w.length,"Sentence 1 must begin with “Overall,”.","Overall, + what happened to every item (up, down or stable)","Formula: Sentence 1 = Overall, + general trends.")}

  if(ss.length<2)add("structure",Math.max(0,t.length-1),1,"Write a second sentence: It is also clear that + one or two complementary details.","It is also clear that + biggest change / size / what stands out","Formula: Sentence 2 = complementary detail.");
  else{
    if(!/^it is also (clear|noticeable|evident|apparent|notable|obvious)\s+that\b/i.test(s2))add("structure",ss[1].i,Math.min(s2.length,24),"Sentence 2 should begin “It is also clear that”.","It is also clear that + biggest change / size / what stands out","Use the formula from 5.1 so the detail is clearly separate from the trends.");
    if(ss.length>2)items.push({kind:"style",i:ss[2].i,len:Math.min(ss[2].txt.length,30),msg:"An overview is two sentences. Cut the third one.",fix:"keep the trends and ONE or TWO details",why:"More sentences usually means minor details and numbers."});
  }
  // ---- no numbers ----
  const re=/\d+(?:[.,]\d+)*%?/g;let m;
  while((m=re.exec(t))){if(numOK(t,m))continue;
    add("facts",m.index,m[0].length,"No figures in an overview.","say ‘rose’ / ‘the biggest increase’ / ‘far higher’ instead","An overview gives the general picture only. Figures (numbers, percentages) belong in the detail paragraphs. A year such as ‘by 2050’ is fine.")}
  // ---- direction accuracy in sentence 1 ----
  if(ss.length&&starts||true){
    const sd=dset(s1),md=dset(m1);
    if(!sd.has("U")&&!sd.has("D")&&!sd.has("S"))add("structure",ss[0]?ss[0].i:0,0,"Sentence 1 must say what happened: up, down or stable.","rose · fell · remained stable","The trends are the most important part of the overview.");
    else{
      const nm={U:"rose / increased",D:"fell / decreased",S:"stayed the same"};
      for(const k of ["U","D"]){
        if(md.has(k)&&!sd.has(k))add("facts",ss[0].i,0,"Check the graph again: some items "+(k==="U"?"went UP":"went DOWN")+", but your first sentence does not say so.","include a verb like ‘"+nm[k]+"’","Sentence 1 must cover EVERY line, bar or row, not just one trend.");
        else if(!md.has(k)&&sd.has(k)&&!/fluctuat|vari(?:ed|ation)|ups and downs/i.test(m1)){const mm=k==="U"?(()=>{UP.lastIndex=0;UP2.lastIndex=0;return UP.exec(s1)||UP2.exec(s1)})():(()=>{DOWN.lastIndex=0;DOWN2.lastIndex=0;return DOWN.exec(s1)||DOWN2.exec(s1)})();
          add("facts",mm?ss[0].i+mm.index:ss[0].i,mm?mm[0].length:5,"Check the direction: according to the graph nothing "+(k==="U"?"went UP":"went DOWN")+" overall.","look at the first and last point of each line/bar","The verb must match the graph: this is part of Task Achievement (accuracy).")}}
      if(md.has("S")&&/\b(unchanged|same level|stayed the same|remained (?:stable|unchanged|constant|almost)|no change|stable)\b/i.test(m1)&&!sd.has("S"))items.push({kind:"style",i:ss[0].i,len:0,msg:"One item stayed the same on the graph. Mention it too.",fix:"…, while X remained stable / unchanged",why:"Every item should appear in the general trends."})}
  }
  // names need capital letters
  for(const w of String(g.ent||"").split("|")){if(!/^[A-Z][a-z]+(?: [A-Z][a-z]+)*$/.test(w))continue;
    const lo=new RegExp("\\b"+w.toLowerCase()+"\\b","g");let mm2;while((mm2=lo.exec(t))){if(t.slice(mm2.index,mm2.index+w.length)===w)continue;add("grammar",mm2.index,w.length,"Names of countries and places start with a capital letter.",w,"Capital letters: Finland, the United States, Sweden.")}}
  // ---- complementary detail ----
  if(s2){
    const entRe=new RegExp("\\b(?:"+(g.ent||"zzzzz")+")","i");
    if(!DET.test(s2)&&!entRe.test(s2))add("structure",ss[1].i,0,"Sentence 2 needs a complementary detail.","the biggest (or smallest) change · the size of the changes · what stands out (highest, overtook, the gap)","Look for: which item changed most? Which is always higher? Did one overtake another?");
  }
  // ---- names covered in S1 (tip) ----
  // ---- praise ----
  if(starts)praise.push("Sentence 1 begins with “Overall,” as in the formula.");
  if(!hasFig(t)&&ss.length>=2)praise.push("No figures: it is a true overview.");
  if(!items.some(x=>x.kind==="facts"&&/direction|went/.test(x.msg))&&ss.length)praise.push("Your trends match the graph.");
  if(s2&&!items.some(x=>x.msg.startsWith("Sentence 2")))praise.push("Sentence 2 adds a complementary detail.");
  // ---- language ----
  const gr=grammarCheck(t),sp=spellCheck(t),st=styleCheck(t);
  items.push(...gr,...sp.filter(x=>!gr.some(y=>y.i===x.i)),...st.filter(x=>!(x.msg&&/very long/.test(x.msg)&&false)));
  if(!gr.length&&!sp.some(x=>x.hard))praise.push("No grammar errors found in the rules I check.");
  if(/\b(whereas|while|although|however|in contrast|by contrast)\b/i.test(t))praise.push("Nice linking words.");
  const hard=items.filter(x=>["structure","facts","grammar","tense"].includes(x.kind)||(x.kind==="spelling"&&x.hard));
  return {ok:hard.length===0,items,praise,hard:hard.length}}

/* ---- introductions ---- */
const PRES=/\b(show|shows|illustrate|illustrates|compare|compares|give|gives|present|presents|depict|depicts|display|displays|provide|provides|outline|outlines|summari[sz]es?|indicate|indicates|represent|represents|detail|details|describe|describes|track|tracks|reveal|reveals)\b/i;
const TYPES={line:[/\bline (graph|chart)s?\b/i,"line graph"],bar:[/\bbar (chart|graph)s?\b/i,"bar chart"],table:[/\btables?\b/i,"table"],pie:[/\bpie (chart|graph)s?\b/i,"pie chart"]};
function runLen(a,b){ // longest common run of words
  const x=(norm(a).match(/[a-z0-9]+/g)||[]),y=(norm(b).match(/[a-z0-9]+/g)||[]);let best=0;
  for(let i=0;i<x.length;i++)for(let j=0;j<y.length;j++){let k=0;while(i+k<x.length&&j+k<y.length&&x[i+k]===y[j+k])k++;if(k>best)best=k}
  return best}
function introAnalyze(text,g){
  const t=text.trim(),items=[],praise=[];
  const add=(kind,i,len,msg,fix,why)=>items.push({kind,i,len,msg,fix,why});
  if(t.split(/\s+/).length<7)return {ok:false,items:[{kind:"structure",msg:"Write a full introduction sentence.",fix:"The "+TYPES[g.type][1]+" shows … in … between … and …",why:"Introduction = type of graph + presenting verb + what + where + when."}],praise:[],hard:1};
  const ss=sentences(t);
  if(ss.length>1)items.push({kind:"style",i:ss[1].i,len:Math.min(20,ss[1].txt.length),msg:"The introduction is one sentence.",fix:"Keep to one sentence: type + verb + what + where + when",why:"Details belong in the overview and body paragraphs."});
  // type of graph
  const own=TYPES[g.type];
  if(!own[0].test(t)){
    const other=Object.keys(TYPES).filter(k=>k!==g.type&&TYPES[k][0].test(t))[0];
    if(other){const mm=TYPES[other][0].exec(t);add("facts",mm.index,mm[0].length,"This is a "+own[1]+", not a "+TYPES[other][1]+".","The "+own[1]+(g.type==="pie"||g.type==="line"&&false?"s":"")+" shows …","Name the correct type of graph. Check the picture.")}
    else add("structure",0,Math.min(12,t.length),"Name the type of graph.","The "+own[1]+" shows …","Introduction = type of graph + presenting verb + what + where + when.")}
  if(!PRES.test(t))add("structure",0,Math.min(14,t.length),"Use a presenting verb: shows, illustrates, compares, gives information about.","The "+own[1]+" illustrates …","You must tell the reader what the graph does, using a verb.");
  // years
  const need=(g.intro.match(/\b(19|20)\d\d\b/g)||[]);
  const have=(t.match(/\b\d{4}\b/g)||[]);
  const miss=need.filter(y=>!have.includes(y));
  if(miss.length)add("facts",Math.max(0,t.length-1),1,"Add the time period: "+miss.length+" year"+(miss.length>1?"s":"")+" missing (check the title).","… between YEAR and YEAR / in YEAR and YEAR","The time is part of the introduction.");
  const re=/\d+(?:[.,]\d+)*%?/g;let m;
  while((m=re.exec(t))){if(numOK(t,m))continue;add("facts",m.index,m[0].length,"No figures in an introduction.","just the time period (years)","Figures come later, in the detail paragraphs.")}
  const extra=have.filter(y=>!need.includes(y));
  for(const y of extra){const i=t.indexOf(y);add("facts",i,4,"The year "+y+" is not in the title. Check it.","use the years from the title","Accuracy: only use the time period shown.")}
  // not copied, but on topic
  if(runLen(t,g.title)>=10)add("structure",0,Math.min(t.length,30),"You copied the title. Paraphrase it with different words.","e.g. share → proportion / percentage · six countries → six nations","The introduction must be a paraphrase, not a copy.");
  const ov1=Math.max(overlap(g.title,t),overlap(g.intro,t));
  if(ov1<0.28)add("facts",0,0,"Your sentence does not say clearly what the graph is about. Re-read the title.","paraphrase the title: same information, different words","Name the subject, the place and the time.");
  // praise
  if(own[0].test(t)&&PRES.test(t))praise.push("Type of graph and a presenting verb: correct.");
  if(!miss.length&&need.length)praise.push("The time period is complete.");
  if(runLen(t,g.title)<10&&ov1>=0.28)praise.push("You paraphrased the title.");
  const gr=grammarCheck(t),sp=spellCheck(t),st=styleCheck(t);
  items.push(...gr,...sp.filter(x=>!gr.some(y=>y.i===x.i)),...st);
  if(!gr.length&&!sp.some(x=>x.hard))praise.push("No grammar errors found in the rules I check.");
  const hard=items.filter(x=>["structure","facts","grammar","tense"].includes(x.kind)||(x.kind==="spelling"&&x.hard));
  return {ok:hard.length===0,items,praise,hard:hard.length}}

/* ---- trend / detail notes (guided graphs) ---- */
function noteAnalyze(text,g,which){
  const t=text.trim(),items=[],praise=[];
  if(t.split(/\s+/).length<2)return {ok:false,items:[{kind:"structure",msg:"Write short notes, for example: ‘Germany: up · Chile: up · Iceland: down’.",why:"Notes help you plan before you write the sentence."}],praise:[],hard:1};
  if(which==="trend"){
    const d=dset(t);if(/\b(up|higher|increase)\b/i.test(t))d.add("U");if(/\b(down|lower|decrease)\b/i.test(t))d.add("D");if(/\b(flat|same|unchanged|constant|steady)\b/i.test(t))d.add("S");
    if(!d.has("U")&&!d.has("D")&&!d.has("S"))items.push({kind:"structure",msg:"Say for each item: up, down or stable.",fix:"X: up · Y: down · Z: stable"});
    else praise.push("You noted the direction of the changes.");
    if(hasFig(t))items.push({kind:"facts",msg:"No figures (percentages or amounts), even in notes. Years and age groups are fine. Just up / down / stable.",why:"Train yourself to see the general trend."});
  }else{
    const entRe=new RegExp("\\b(?:"+(g.ent||"zzzzz")+")","i");
    if(!DET.test(t)&&!entRe.test(t))items.push({kind:"structure",msg:"Note ONE detail: the biggest change, the size of the changes, or what stands out.",fix:"X: the biggest change · Y: always highest"});
    else praise.push("You chose a detail to add to sentence 2.");
  }
  const hard=items.filter(x=>["structure","facts"].includes(x.kind));
  return {ok:hard.length===0,items,praise,hard:hard.length}}

// load saved progress: from the site (in the frame) or from this browser
let got=false;
window.addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="ielts-lab-state"||d.id!==CH.id)return;if(d.theme)setTheme(d.theme);if(!got){got=true;restore(d.data);if(!d.data)fallback()}});
function fallback(){try{restore(localStorage.getItem("ielts-lab:"+CH.id))}catch(e){}}
showStep(0);progress();
if(inFrame){try{parent.postMessage({type:"ielts-lab-load",id:CH.id},"*")}catch(e){}setTimeout(()=>{if(!got){got=true;fallback()}},900)}else{got=true;fallback()}
})();


</script>
</body>
</html>
