/* Writing Lab — shared look for every chapter (2026-11-07).

:root{

  --chipS:#dfe8fb;--chipSt:#1f4aa0;--chipV:#fbe0e6;--chipVt:#a02a44;--chipL:#fdf0d2;--chipLt:#8a5a0c;--chipN:#dcf3ef;--chipNt:#0f6b66;

}
:root[data-theme="dark"]{
  --ink:#0f1626;--panel:#172036;--panel2:#1e2944;--line:#2b3858;--paper:#eef0f6;--dim:#c6ccda;--mist:#a3abbf;
  --brass:#7fa6f2;--onbrass:#0f1626;--sage:#7fd6d2;--sageT:#123a3c;--coral:#f29aa6;--coralT:#3e1c22;--amber:#f2c07a;--amberT:#3a2a12;
  --saffron:#f0b95a;--band:#1b3570;
  --chipS:#22335c;--chipSt:#b9cdf7;--chipV:#4a2230;--chipVt:#f5b8c6;--chipL:#453512;--chipLt:#f6d48b;--chipN:#153f3d;--chipNt:#9de3dc;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:19px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Unbounded,"Nunito Sans",system-ui,sans-serif;letter-spacing:-.01em}
b,strong{font-weight:800}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- band ---- */
.band{color:#fff;background:var(--band);background-image:linear-gradient(115deg,var(--band) 0%,#1f6fae 55%,#1a9bb5 100%);border-radius:0 0 28px 28px;padding:22px 0 20px}
.band .kick{font-size:15.3px;font-weight:800;opacity:.9;letter-spacing:.02em}
.band h1{margin:6px 0 6px;font-size:33px;line-height:1.15;font-weight:600}
.band p{margin:0;max-width:760px;font-size:17.7px;opacity:.92}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1;max-width:360px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:999px;transition:width .4s}
.prog b{font-size:16.5px;white-space:nowrap}

/* ---- step menu ---- */
.steps{position:sticky;top:0;z-index:20;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}

.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:800;font-size:16.5px}
.step .no{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--panel2);font-size:14.2px}
.step .ct{font-size:14.2px;color:var(--mist);font-weight:700}
.step.on{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.step.on .no{background:rgba(255,255,255,.22)}.step.on .ct{color:inherit;opacity:.85}
.step.full .ct{color:var(--sage)}.step.on.full .ct{color:inherit}

main{padding:20px 0 40px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.sec-title h2{margin:0;font-size:24.8px;font-weight:600}

.note{border-radius:14px;background:var(--panel2);padding:12px 14px;font-size:17.1px;color:var(--dim);margin:0 0 16px}

.sub small{color:var(--mist);font-weight:700}

.nums{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nums .sub{min-width:42px;justify-content:center;font-family:Unbounded,sans-serif;font-weight:600}

/* ---- learn panel ---- */

.eg .tg{flex:0 0 auto;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);background:var(--panel2);border-radius:8px;padding:2px 7px;height:fit-content;margin-top:2px}

.mist .v{background:var(--sageT)}

/* ---- charts ---- */
svg.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--gtext);font-size:13px;font-family:"Nunito Sans",system-ui,sans-serif}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .lbl{font-size:13.6px;font-weight:800;font-family:"Nunito Sans",system-ui,sans-serif}
.chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.3s ease-out forwards}
@keyframes dl{to{stroke-dashoffset:0}}
.chart .key{font-size:13.6px;font-weight:700;fill:var(--paper);font-family:"Nunito Sans",system-ui,sans-serif}

/* ---- graph exercise cards ---- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.gcard .gt{font-weight:800;font-size:17.7px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gcard .gt i{font-style:normal;font-size:13px;font-weight:800;background:var(--panel2);color:var(--mist);border-radius:8px;padding:2px 7px}
.gcard .gt span{font-weight:600;color:var(--mist);font-size:15.3px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-size:17.7px;margin-bottom:8px}
.q .p .num{font-weight:800;color:var(--brass);margin-right:6px}
.q .p .tg{display:inline-block;font-size:13px;font-weight:800;background:var(--chipS);color:var(--chipSt);border-radius:8px;padding:1px 7px;margin-right:4px}
.q .p .sm{font-size:15.3px;color:var(--mist)}
.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:17.1px;margin-bottom:6px}
.wk .l{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}
select.sel{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--paper);min-width:150px}
select.sel.ok{border-color:var(--sage);background:var(--sageT)}select.sel.no{border-color:var(--coral);background:var(--coralT)}

/* ---- input + coach ---- */
.iw{margin-top:6px}
.iw .lab{font-size:14.2px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}
textarea{width:100%;font:inherit;font-size:18.9px;line-height:1.5;color:var(--paper);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:62px;outline:none}
textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:8px 16px;font-weight:800;font-size:16.5px;background:var(--brass);color:var(--onbrass)}
.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:17.7px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:14.8px;color:var(--mist)}
.done-tag{font-size:14.8px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:16.5px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.fb.on{display:block}
.fb .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px}
.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:14.2px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:17.7px;line-height:1.7;margin-bottom:6px}
.ann mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--amber)}
.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:13.6px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:17.1px}
.it .k{display:inline-block;font-size:13px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}
.tryit{margin-top:3px;font-weight:800;color:var(--sage)}
.why{margin-top:2px;color:var(--mist);font-size:15.9px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:17.1px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.blockbar .score{font-weight:800;color:var(--dim);font-size:16.5px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.foot{color:var(--mist);font-size:14.8px;text-align:center;padding:10px 18px 30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);font-weight:800;border-radius:14px;padding:9px 16px;transition:.25s;pointer-events:none;z-index:50}

}
@media print{.steps,.irow,.blockbar,.nextbar{display:none}.sec{display:block!important}}

.gimg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.gimg img{max-width:100%;height:auto;max-height:340px}
.ovl{display:grid;grid-template-columns:1fr;gap:16px}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}

<script>
(function(){
const CH={id:"wt2-l20-body-causes",kicker:"Writing Task 2 · Lesson 20 · Effects and solutions body paragraphs",title:'How to write <span style="color:#ffd27a">strong body paragraphs</span> for effects and solutions essays',
lead:"Learn from your teacher’s own sample essays: write one paragraph for the effects and one for the solutions, with fully developed ideas. Then practise on 10 questions."};
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];

const TOPICS=[{"n": 1, "q": "Many parents complain about violence promoted to their children through video games, TV programs and other media. What are the effects of this? What can be done to deal with it?", "cause": ["Desensitization → children see violence on screens every day → real aggression starts to feel normal", "Aggressive behavior → young viewers copy what they watch → fights and bullying increase at school"], "sol": ["Parental supervision → limit screen time and block age-restricted content → children see far less violence", "Government control → technology companies build filters → minors cannot stream violent material"], "m1": "To begin with, violent content can have several damaging effects on children. The first one is desensitization. Since children see violence on screens every day, they gradually stop reacting to it. As a result, real aggression starts to feel normal to them. Another consequence is aggressive behavior. Young viewers often copy what they watch, which means that fights and bullying become more common at school.", "m2": "Several solutions can help to protect children from violent content. The first one is stronger parental supervision. This can be done by limiting screen time and blocking age-restricted content. As a result, children are exposed to far less violence. Another measure is government control. Authorities should require technology companies to build filters, which means that minors cannot stream violent material."}, {"n": 2, "q": "In many countries, people do not do enough to recycle their used materials (glass, paper, and metal). What problems does this cause? What can be done to solve it?", "cause": ["Resource shortage → more raw materials are extracted → natural supplies run low", "Pollution → waste fills landfills → soil and water become contaminated"], "sol": ["Awareness campaigns → schools and media explain the value of recycling → habits change", "Recycling centers → local authorities build them near homes → recycling becomes convenient"], "m1": "To begin with, low recycling rates cause several serious problems. The first one is a shortage of resources. Since new products are made from raw materials, supplies of wood, metal and sand run low when used items are thrown away. As a result, prices rise and the environment is damaged by extraction. Another effect is pollution. Waste that is not recycled fills landfills, which means that harmful chemicals leak into the soil and water.", "m2": "A range of solutions can encourage people to recycle more. The most effective one is awareness campaigns. Schools and the media should explain the value of recycling, which gradually changes people's habits. More specifically, this can be done by running school projects and television advertisements. Another measure is building recycling centers close to homes. Local authorities could fund them, and as a result recycling becomes convenient for every resident."}, {"n": 3, "q": "Many young people today will never be able to afford to buy a house. What problems can this cause? What can be done to remedy it?", "cause": ["Delayed independence → young adults cannot afford homes → they stay with their parents for years", "Social strain → couples postpone marriage and children → birth rates fall"], "sol": ["Affordable housing → government builds low-cost apartments → young families can rent or buy", "Cheap loans → banks offer low-interest mortgages → buying a home becomes realistic"], "m1": "To start, the unaffordability of housing has several damaging effects on young people. The first one is delayed independence. Since most young adults cannot afford their own homes, they stay with their parents well into their thirties. This means that they have little privacy and limited control over their lives. Another consequence is social strain. Many couples postpone marriage and children because they lack a stable place to live, which in turn causes birth rates to fall.", "m2": "A number of solutions can make housing more accessible. The first one is affordable public housing. This can be done by building low-cost apartments for young families, which means that they can rent or buy without borrowing heavily. Another measure is cheap loans. Banks should offer low-interest mortgages with state support, and as a result buying a home becomes a realistic goal."}, {"n": 4, "q": "Art is considered an essential part of all cultures throughout the world. However, these days fewer and fewer people appreciate art and turn their focus to science, technology and business. What problems can this cause? What could be done to encourage more people to take interest in the arts?", "cause": ["Cultural loss → traditions are no longer passed on → national identity weakens", "Less creativity → people stop practicing creative thinking → innovation suffers"], "sol": ["Arts in schools → compulsory lessons in music, painting and theater → children learn to enjoy art", "Public funding → free museums and festivals → art becomes accessible to everyone"], "m1": "To start, the decline of interest in art can have several negative effects. The first one is cultural loss. When fewer people take an interest in painting, music and literature, traditions are no longer passed on to younger generations. As a result, a nation's identity gradually weakens. Another consequence is a drop in creativity. Because people who ignore the arts rarely practice creative thinking, innovation suffers in every field, including science and business.", "m2": "Several solutions can bring people back to the arts. The first one is teaching arts in schools. Lessons in music, painting and theater should become compulsory, which means that children learn to enjoy art from an early age. Another measure is public funding. This can be done by redirecting part of tourism taxes to museums and festivals, and as a result art would become accessible to everyone."}, {"n": 5, "q": "Experts say older people were happier and healthier in the ement → clear limits between work and leisure → personal time is protected"], "m1": "To begin with, a poor balance between work and personal life leads to several problems. The first one is burnout. Since many employees work long hours without proper rest, they become exhausted. As a result, their productivity falls and mistakes become more common. Another effect is strained relationships. Because people have little time for family and friends, conflicts at home and loneliness increase.", "m2": "Several solutions can help people achieve a healthier balance. The first one is flexible working. Employers should allow remote work and shorter weeks, which means that employees gain extra free time. Another measure is better time management. This can be done by setting clear limits between work and leisure and by switching off devices after hours. As a result, people protect time for their families."}, {"n": 7, "q": "Nowadays people waste a lot of food that was bought from shops and restaurants. What are the effects of this? What can be done to reduce the amount of food they throw away?", "cause": ["Environmental damage → rotting food releases methane → greenhouse gases increase", "Wasted money → households buy food they never eat → family budgets shrink"], "sol": ["Smaller portions → restaurants and shops sell smaller sizes → less food is thrown away", "Education → schools and media teach meal planning → households buy only what they need"], "m1": "To start, food waste causes several harmful effects. The first one is damage to the environment. Since rotting food in landfills releases methane, greenhouse gases increase. This means that climate change becomes harder to control. Another effect is wasted money. Because households regularly buy food they never eat, family budgets shrink and the cost of living feels higher.", "m2": "A number of solutions can reduce the amount of food people throw away. The first one is smaller portions. This can be done by encouraging restaurants and shops to sell food in smaller sizes. As a result, less food ends up in the bin. Another measure is education. Schools and the media should teach meal planning, which means that households buy only what they need."}, {"n": 8, "q": "Poor attendance among school children is growing in many countries. What problems does this cause? Suggest some solutions.", "cause": ["Falling behind → missed lessons leave gaps in knowledge → grades drop", "Risk of expulsion → repeated absence breaks school rules → students can be expelled"], "sol": ["Engaging lessons → teachers use interactive materials → pupils want to attend", "Personal support → counseling and after-class help → personal problems stop keeping pupils at home"], "m1": "To begin with, skipping school has several serious consequences for pupils. The first one is falling behind. Since each missed lesson leaves a gap in knowledge, pupils struggle to follow new topics. As a result, their grades drop. Another effect is the risk of expulsion. Because repeated absence breaks school rules, students may be forced to leave school altogether.", "m2": "A range of solutions can encourage pupils to attend school. The first one is more engaging lessons. Teachers should use interactive materials and group projects, which means that pupils want to come to class. Another measure is personal support. This can be done through counseling and after-class academic help. As a result, personal problems stop keeping pupils at home."}, {"n": 9, "q": "Some people believe that nowadays too much money is being spent on weddings and birthdays. What problems can this cause? What can be done to improve the situation?", "cause": ["Family debt → parents borrow to pay for lavish parties → years of repayments", "Social pressure → costly parties set the standard → poorer families feel ashamed"], "sol": ["Guest limits → restaurants and halls limit seats → cost of each party falls", "Social campaigns → media promote simple celebrations → culture of thrift grows"], "m1": "To start, overspending on weddings and birthdays can have several negative effects. The first one is family debt. Since many parents borrow money to pay for lavish parties, they spend years repaying loans. This means that savings for more important needs disappear. Another consequence is social pressure. Because expensive celebrations become the norm, poorer families feel ashamed of simple events.", "m2": "Several solutions can limit excessive spending on celebrations. The first one is setting guest limits. This can be done by limiting the number of seats at restaurants and wedding halls. As a result, the cost of each party falls. Another measure is social campaigns. Television and the Internet should promote simple celebrations, which means that a culture of thrift gradually replaces a culture of showing off."}, {"n": 10, "q": "Many university students regularly miss lectures and classes. What problems can this cause? What can be done to solve this problem?", "cause": ["Poor academic results → students who miss classes fall behind → exam grades suffer", "Wasted resources → half-empty lecture halls → teaching that students never receive"], "sol": ["Attendance policies → universities link attendance to marks → students come regularly", "Interesting teaching → lecturers use practical activities and discussions → classes feel worthwhile"], "m1": "To begin with, regular absence from lectures has several damaging effects. The first one is poor academic results. Since students who miss classes fall behind, they struggle with assignments. As a result, their exam grades suffer. Another consequence is wasted resources. Because lecture halls are half empty, universities and families pay for teaching that students never receive.", "m2": "A range of solutions can bring students back to lectures. The first one is a stricter attendance policy. This can be done by linking attendance to part of the final mark, which means that students have a clear reason to come. Another measure is more interesting teaching. Lecturers should use practical activities and discussions. As a result, classes feel worthwhile."}];

const REAS=/\b(effects?|consequences?|implications?|problems?|issues?|repercussions?|ramifications?|outcomes?|negative|damaging|harmful|serious|lead(s)? to)\b/i;
const SOLN=/\b(solutions?|measures?|steps?|ways|remed\w+|counter\w*|mitigat\w+|curb\w*|tackl\w+|address\w*|propos\w+|suggest\w*|actions?|solv\w+|resolv\w+|discourag\w+|combat\w*)\b/i;
const CNO=/\b(solutions?|measures?|steps|should|must|can be done|could be done|ought to)\b/i;
const EXPL=/\b(when people|once people|those people|because|since|this is why|due to|in other words|that is|this is|which means|owing to|this can be attributed|more specifically|as it|as they|as the|seeing as|so that|whereas|thanks to|by (hosting|\w+ing))\b/i;
const RESU=/\b(has proved|allow for|bring people together|these problems|in return|it works|as a result|therefore|thus|consequently|this leads|leads to|this means|which means|in turn|hence|results in|resulting|means that|so they|so it|so that|so the|so people|and this|gives? rise|causing|as such|in this way|this way|for this reason|which leads|which makes|which causes|which results|which can|which may|which pushes|so )\b/i;
const ADD=/\b(furthermore|further|not only that|the second|moreover|besides|in addition|another|also|what is more|apart from|on top of|one other|finally|firstly|secondly|first|second|next)\b/i;
const ACT=/\b(should|could|can be|would|must|need to|needs to|ought|requires?|entails?|are needed|is needed)\b/i;
const HOW=/\b(this can be done|can be done|by \w+ing|through|more specifically|this requires|this entails|this involves|in practice|for example|such as)\b/i;
const W=t=>(t.toLowerCase().match(/[a-z']+/g)||[]);
function run(a,b){let best=0;for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)if(a[i]===b[j]){let k=0;while(i+k<a.length&&j+k<b.length&&a[i+k]===b[j+k])k++;if(k>best)best=k}return best}
const chainText=c=>c.replace(/→/g," ");
const stem=s=>[...new Set((s.toLowerCase().match(/[a-z]+/g)||[]).filter(w=>w.length>=5).map(w=>w.slice(0,5)))];
function checkBody5(text,tp){
  const w=W(text),n=w.length,ss=text.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>1);
  const first=ss[0]||"",sol=tp.kind==="sol";
  const kwList=tp.kw||stem(tp.ch.join(" "));
  const kwHit=kwList.filter(k=>text.toLowerCase().includes(k)).length;
  const cp=Math.max(run(w,W(chainText(tp.ch[0]))),run(w,W(chainText(tp.ch[1]))));
  const hasI=/\b(i|my|we|me|our)\b/i.test(text);
  const c=[
   sol?{ok:(SOLN.test(first)||/in response/i.test(first)),crit:1,label:"Topic sentence",bad:"Start the solutions paragraph by promising solutions: “A range of solutions can be offered…”, “Several solutions can help…”, “There are a few ways …”.",good:"Your topic sentence introduces the solutions."}
       :{ok:REAS.test(first)&&!SOLN.test(first),crit:1,label:"Topic sentence",bad:"Start the effects paragraph by naming the effects: “To begin with, … has several negative effects.”, “The consequences of … are serious.”, “… can trigger two interconnected problems.”",good:"Your topic sentence introduces the effects."},
   sol?{ok:ACT.test(text),crit:1,label:"Action",bad:"Say what should be done: “should”, “could”, “would”, “can be …”.",good:"You say what should be done."}
       :{ok:!CNO.test(text),crit:1,label:"Effects only",bad:"Body 1 is only about effects. Remove “should”, “measures” and “solutions”: they belong in Body 2.",good:"Only effects: correct."},
   sol?{ok:HOW.test(text),crit:1,label:"How",bad:"Explain HOW the solution works: “This can be done by…”, “More specifically, …”, “through …”.",good:"You show how."}
       :{ok:EXPL.test(text),crit:1,label:"Explain",bad:"Explain WHY: “This is because…”, “Since…”, “Because…”, “which means…”.",good:"You explain."},
   {ok:RESU.test(text),crit:1,label:"Result",bad:"Show the RESULT: “As a result,…”, “This means that…”, “This way,…”.",good:"You show results."},
   {ok:ADD.test(text),crit:1,label:"Second idea",bad:"Start your second idea with “Another factor/measure is…”, “Furthermore,…” or “Besides,…”.",good:"You link to a second idea."},
   {ok:!hasI,crit:1,label:"No opinion",bad:"Remove “I”, “my” and “we”. Write in a neutral voice.",good:"No opinion: correct."},
   {ok:ss.length>=4,crit:1,label:"4+ sentences",bad:"A full body paragraph has two ideas, each explained: about 5–8 sentences.",good:ss.length+" sentences."},
   {ok:cp<9,crit:1,label:"Own words",bad:"You copied "+cp+" words in a row from the ideas. Use your own words.",good:"Written in your own words."},
   {ok:kwHit>=3,crit:1,label:"On idea",bad:"Develop the two ideas shown. Use their key words or synonyms.",good:"Develops the ideas."},
   {ok:n>=45&&n<=190,crit:0,label:"Length",bad:n<45?"A bit short ("+n+" words). A body paragraph is about 70–120 words.":"A bit long ("+n+" words). Aim for 70–120 words.",good:n+" words: a good length."},
   {ok:text.indexOf("→")<0,crit:0,label:"Full sentences",bad:"Replace the arrows with full sentences.",good:"Full sentences."}].filter(x=>!(x.ok&&!x.crit&&!x.bad));
  const crit=c.filter(x=>x.crit),okc=crit.filter(x=>x.ok).length,tips=c.filter(x=>!x.crit&&!x.ok).length;
  return {c,v:okc===crit.length&&tips===0?"good":okc>=crit.length-1?"mid":"bad"}}
function checkBody(t,tp){return checkBody5(t,tp)}
function fbHTML(r,done){
  const vd={good:done||"Well done!",mid:"Nearly there: add the missing move.",bad:"Not yet. Fix the red points and check again."}[r.v];
  return '<div class="hd"><span class="vd">'+vd+'</span><span class="meter">'+r.c.map(x=>'<span class="'+(x.ok?"ok":(x.crit?"no":"tip"))+'">'+(x.ok?"✓ ":"✗ ")+x.label+'</span>').join("")+'</span></div><div class="body">'+
  r.c.filter(x=>!x.ok).map(x=>'<div class="it '+(x.crit?"structure":"style")+'"><div><span class="k">'+(x.crit?"must fix":"tip")+'</span>'+esc(x.bad)+'</div></div>').join("")+
  r.c.filter(x=>x.ok).map(x=>'<div class="it praise"><div><span class="k">ok</span>'+esc(x.good)+'</div></div>').join("")+'</div>'}

let REG=[];
function selQ(key,label,opts,ans,expl,num){
  REG.push({key,kind:"sel",ans,expl});
  return '<div class="q" data-key="'+key+'"><div class="p"><span class="num">'+num+'</span>'+label+'</div><select class="sel" data-key="'+key+'"><option value="">Choose…</option>'+opts.map((o,i)=>'<option value="'+i+'">'+esc(o)+'</option>').join("")+'</select><div class="fb" id="fb_'+key+'"></div></div>'}
function rng(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
function shuf(a,seed){const r=rng(seed),b=a.map((x,i)=>i);for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function selS(key,label,opts,ans,expl,num){const p=shuf(opts,key);return selQ(key,label,p.map(i=>opts[i]),p.indexOf(ans),expl,num)}

const seg=(c,l,t)=>'<div class="seg '+c+'"><div class="st">'+l+'</div>'+esc(t)+'</div>';

const EXC=DATA.EX,G=DATA.G;
steps.push({label:"1 Learn",html:()=>{
 const e1=EXC[0];
 let h='<div class="sec-title"><span class="n">STEP 1</span><h2>Learn: body paragraphs for “effects and solutions” essays</h2></div>';
 h+='<div class="card"><h3>1 · The essay map</h3><p class="lead">Your teacher’s sample essays have <b>two body paragraphs</b>: Body 1 explains the <b>effects</b> (problems), Body 2 gives the <b>solutions</b>. Each paragraph has two ideas. There is no opinion, so both are written in a neutral voice.</p><table class="t"><tr><th>Paragraph</th><th>Its job</th><th>It starts with…</th></tr>'
 +'<tr><td><b>Introduction</b></td><td>Paraphrase + promise effects and solutions (Lesson 19)</td><td>This issue can lead to many other problems, so several measures should be taken …</td></tr>'

 h+='<div class="card"><h3>3 · The key skill: turn an argument into a developed idea</h3><p class="lead">In your notes an idea is only a few words (“breakdown of communities”, “community spirit”). A <b>developed idea</b> answers three questions. Effects and solutions use the same pattern, but the middle step is different.</p><table class="t"><tr><th>Question</th><th>Body 1 · an effect</th><th>Body 2 · a solution</th></tr>'
 +'<tr><td><b>What?</b></td><td><b>Claim:</b> Perhaps the most concerning outcome is … · The first one is … · Another consequence of … is …</td><td><b>Claim:</b> One measure would be … · One immediate solution is … · Encouraging people to … would be the most effective measure.</td></tr>'
 +'<tr><td><b>Why / How?</b></td><td><b>Explain (why):</b> Since … · Once people … · When people …, they …</td><td><b>How:</b> This can be done by … · More specifically, … · This entails …</td></tr>'
 +'<tr><td><b>So what?</b></td><td><b>Result:</b> This can lead to … · These problems, in turn, … · This means …</td><td><b>Result:</b> This way, … · Having done that, … · As a result, …</td></tr></table></div>';
 const LAD=[["Level 1 · Idea only","Developing community spirit.","This is only a claim. A paragraph made of these stays empty."],["Level 2 · + How","The most practical solution would be to develop community spirit. This can be done by arranging public events and gatherings such as festivals and neighborhood clean-ups.","Better: now the reader knows how it works."],["Level 3 · + Result","The most practical solution would be to develop community spirit. This can be done by arranging public events and gatherings such as festivals and neighborhood clean-ups. More than just helping entertain people and beautify cities, such events bring people together for a common cause and allow for mutual interaction.","Fully developed: claim → how → result. This is the real sample (neighbors)."]];
 h+='<div class="card"><h3>4 · From an idea to a fully developed solution</h3><p class="lead">One solution from your teacher’s sample essay, built in three levels. An effect is built the same way: claim → why → result.</p>'+LAD.map((r,i)=>'<div class="seg '+["s","v","n"][i]+'" style="margin:6px 0"><div class="st">'+r[0]+'</div>'+esc(r[1])+'<div style="font-size:14px;margin-top:4px;color:#445">▸ '+esc(r[2])+'</div></div>').join("")+'<div class="note"><b>Rule:</b> every idea needs a <b>Claim</b> and a <b>Why / How</b>. Strong ideas also show a <b>Result</b>.</div></div>';
 const S1=[["1 · Topic sentence","Promise the effects.","To begin with, … has several negative effects. · … can trigger two interconnected problems. · Initially, it is important to consider some problems arising …"],
 ["2 · Claim (first effect)","Name the first effect in one sentence.","Perhaps the most concerning outcome is … · The first one is … · A decline in … is one obvious consequence of …"],
 ["3 · Explain","Say why it happens.","Since … · Once people … · When people …, they … · Those people who … are more likely to …"],
 ["4 · Result","Show what follows.","These problems, in turn, … · This can lead to … · This, in return, creates …"],
 ["5 · Second effect","Start a new effect with a link. Repeat steps 2–4 in a shorter form.","Another consequence of … is … · Not only that, but there is also a concern over … · A further problem arising from … can be …"]];
 const S2=[["1 · Topic sentence","Promise the solutions.","A range of solutions can be offered … · There are a few ways … · Possible solutions … require …"],
 ["2 · Claim (first solution)","Name the first solution in one sentence.","One measure would be … · One immediate solution is … · … would arguably be the most effective measure."],
 ["3 · How","Say how it can be done.","This can be done by … · More specifically, … · This entails … · It should charge … with the task of …"],
 ["4 · Result","Show what it achieves.","This way, … · Having done that, … · As a result, …"],
 ["5 · Second solution","Start a new solution with a link. Repeat steps 2–4 in a shorter form.","Furthermore, … · Another measure is … · … is also indispensable."]];
 h+='<div class="card"><h3>5 · Build the paragraphs in order: five steps each</h3><div class="grp">Body 1 · effects</div><table class="t"><tr><th>Step</th><th>What you do</th><th>Phrases from the samples</th></tr>'+S1.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join("")+'</table><div class="grp">Body 2 · solutions</div><table class="t"><tr><th>Step</th><th>What you do</th><th>Phrases from the samples</th></tr>'+S2.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join("")+'</table><div class="grp">Real Body 2 · '+e1.src+'</div>'+cparts(e1.b2)+'<div class="note">'+esc(e1.note)+'</div></div>';
 h+='<div class="card"><h3>6 · Do and don’t</h3><table class="t"><tr><th>Do ✓</th><th>Don’t ✗</th></tr><tr><td>Body 1 for the effects, Body 2 for the solutions.<br>Give two ideas in each paragraph.<br>Explain every effect: “Since…”, “Once people…”<br>Show how every solution works: “This can be done by…”<br>Show a result: “As a result…”, “This way…”.</td><td>Don’t write “I think” or give an opinion.<br>Don’t put solutions in Body 1 or effects in Body 2.<br>Don’t just repeat the idea in new words.<br>Don’t list ideas without explaining them.</td></tr></table></div>';
 return h}});

/* ---------- build */
function build(){
 REG=[];
 document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header><nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">MrIkromov’s IELTS · Instagram @ustoz_jasur · Telegram @TeamMrIkromov</div><div id="toast"></div>';
 const st=$("#steps"),mn=$("#main");
 steps.forEach((s,si)=>{
  const b=document.createElement("button");b.className="step";b.id="st"+si;b.innerHTML=s.label+'<span class="ct" id="ct'+si+'"></span>';b.onclick=()=>showStep(si);st.appendChild(b);
  const sec=document.createElement("section");sec.id="sec"+si;sec.style.display="none";
  if(s.subnav){
   sec.innerHTML='<div class="sec-title"><span class="n">STEP 4</span><h2>Practice tests · 10 questions</h2></div><p class="lead">Use what you learned. For each question, write two body paragraphs: the effects, then the solutions. Earn a ⭐ for each!</p><div class="nums" id="nv'+si+'"></div><div id="uv'+si+'"></div>';
   mn.appendChild(sec);
   const nv=$("#nv"+si,sec),uv=$("#uv"+si,sec);
   s.units.forEach((u,ui)=>{const nb=document.createElement("button");nb.className="sub";nb.id="u"+si+"_"+ui;nb.textContent=ui+1;nb.onclick=()=>showUnit(si,ui);nv.appendChild(nb);const bx=document.createElement("div");bx.innerHTML=u.html();bx.style.display="none";u.box=bx;uv.appendChild(bx)});
  }else{sec.innerHTML=s.html();mn.appendChild(sec)}
 });
 wire();applyState()}
function showStep(si){ST.step=si;steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});if(steps[si].subnav)showUnit(si,Math.min(ST.unit[si]||0,steps[si].units.length-1));window.scrollTo({top:0});save()}
function showUnit(si,ui){ST.unit[si]=ui;steps[si].units.forEach((u,k)=>{u.box.style.display=k===ui?"":"none";$("#u"+si+"_"+k).classList.toggle("on",k===ui)});save()}
function stepKeys(si){const root=$("#sec"+si);return $$("[data-key]",root).map(e=>e.dataset.key).filter((v,i,a)=>a.indexOf(v)===i&&REG.some(r=>r.key===v))}
function progress(){let tot=REG.length,done=REG.filter(r=>ST.ok[r.key]).length;$("#pbar").style.width=Math.round(done/tot*100)+"%";$("#pnum").textContent=done+" / "+tot+" done";
 steps.forEach((s,si)=>{const ks=stepKeys(si),d=ks.filter(k=>ST.ok[k]).length;const c=$("#ct"+si);if(c){c.textContent=ks.length?d+"/"+ks.length:"";$("#st"+si).classList.toggle("full",ks.length>0&&d===ks.length)}});stars()}
const CHEER=["Great job! 🎉","Excellent! ⭐","You nailed it! 💪","Superb idea! 🚀","Well done! 👏"];
function cheer(){toast(CHEER[Math.floor(Math.random()*CHEER.length)])}
function stars(){let n=0;TOPICS.forEach((t,ui)=>{const a=ST.ok["B1_"+t.n]&&ST.ok["B2_"+t.n];n+=a?1:0;const el=document.getElementById("u3_"+ui);if(el)el.textContent=(ui+1)+(a?" ⭐":"")});const p=document.getElementById("pnum");if(p)p.textContent+="  ·  ⭐ "+n+"/"+TOPICS.length}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function wire(){
 $$("select.sel").forEach(el=>el.addEventListener("change",()=>runSel(el.dataset.key,true)));
 $$("textarea").forEach(ta=>ta.addEventListener("input",()=>{const id=ta.id;if(id.startsWith("ta_")){const k=id.slice(3);ST.saved[k]=ta.value;wc(k)}else{ST.saved[id]=ta.value}save()}));
 document.body.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const k=b.dataset.key,a=b.dataset.act;
  if(a==="hint")$("#hint_"+k).classList.toggle("on");
  if(a==="model")$("#md_"+k).style.display="";
  if(a==="check")runWrite(k);
})}
function wc(k){const ta=$("#ta_"+k),n=nw(ta.value);$("#wc_"+k).textContent=n+" words"}
function runSel(k,say){const r=REG.find(x=>x.key===k),el=$('select[data-key="'+k+'"]'),fb=$("#fb_"+k);if(el.value==="")return;const ok=+el.value===r.ans;el.className="sel "+(ok?"ok":"no");
 const msg=r.fbs?r.fbs[+el.value]:(ok?r.expl:"");
 fb.className="fb on "+(ok?"good":"bad");fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"Correct! ":"Not quite. ")+'</span></div><div class="body">'+esc(msg||"")+'</div>';
 ST.saved[k]=el.value;if(ok){ST.ok[k]=1}else delete ST.ok[k];if(say)save();progress()}
function runWrite(k){const r=REG.find(x=>x.key===k),ta=$("#ta_"+k);if(!ta.value.trim()){toast("Write your paragraph first");return}
 const res=checkBody(ta.value,r.tp),fb=$("#fb_"+k);fb.className="fb on "+res.v;fb.innerHTML=fbHTML(res,"Well done! This is a developed body paragraph.");ta.className=res.v==="good"?"ok":(res.v==="bad"?"no":"");
 if(res.v!=="bad"){if(!ST.ok[k])cheer();ST.ok[k]=1;$("#dn_"+k).textContent="✓ done";$("#md_"+k).style.display=""}else{delete ST.ok[k];$("#dn_"+k).textContent=""}
 save();progress()}
function applyState(){
 REG.forEach(r=>{if(r.kind==="sel"){const v=ST.saved[r.key];if(v==null)return;const el=$('select[data-key="'+r.key+'"]');el.value=v;runSel(r.key,false)}
  else if(r.kind==="write"){const v=ST.saved[r.key];if(v==null)return;const ta=$("#ta_"+r.key);ta.value=v;wc(r.key);{const pv=ST.saved["pl_"+r.key],pe=$("#pl_"+r.key);if(pv!=null&&pe)pe.value=pv}if(ST.ok[r.key])$("#dn_"+r.key).textContent="✓ done"}
});
 showStep(Math.min(ST.step||0,steps.length-1));progress()}
build();window.__T=TOPICS;window.runWrite=runWrite;
})();
