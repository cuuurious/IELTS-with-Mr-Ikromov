<style>
/* Writing Lab — shared look for every chapter (2026-11-07).
   Same colours, shapes and fonts as ieltswithmrikromov.com:
   lapis-to-turquoise band, Unbounded headings, Nunito Sans text,
   rounded rectangles only (12 / 14 / 20 / 28 px), one saffron button. */
:root{
  --ink:#f6f5f1;--panel:#fff;--panel2:#efede6;--line:#e3dfd4;--paper:#17213a;--dim:#3a4560;--mist:#55607a;
  --brass:#2456b0;--onbrass:#fff;--sage:#13807c;--sageT:#e2f2f0;--coral:#b23a48;--coralT:#f8e1e4;--amber:#9a5b12;--amberT:#fbefd9;
  --saffron:#e6a33a;--onsaffron:#17213a;--band:#22489a;
  --chipS:#dfe8fb;--chipSt:#1f4aa0;--chipV:#fbe0e6;--chipVt:#a02a44;--chipL:#fdf0d2;--chipLt:#8a5a0c;--chipN:#dcf3ef;--chipNt:#0f6b66;
  --mark:#fff2b3;--shadow:0 1px 2px rgba(23,33,58,.06),0 6px 18px -10px rgba(23,33,58,.18);
  --gUp:#13807c;--gDown:#b23a48;--gMix:#1f3a75;--g2:#c4622d;--grid:#e8e4da;--gtext:#55607a;
}
:root[data-theme="dark"]{
  --ink:#0f1626;--panel:#172036;--panel2:#1e2944;--line:#2b3858;--paper:#eef0f6;--dim:#c6ccda;--mist:#a3abbf;
  --brass:#7fa6f2;--onbrass:#0f1626;--sage:#7fd6d2;--sageT:#123a3c;--coral:#f29aa6;--coralT:#3e1c22;--amber:#f2c07a;--amberT:#3a2a12;
  --saffron:#f0b95a;--band:#1b3570;
  --chipS:#22335c;--chipSt:#b9cdf7;--chipV:#4a2230;--chipVt:#f5b8c6;--chipL:#453512;--chipLt:#f6d48b;--chipN:#153f3d;--chipNt:#9de3dc;
  --mark:#5a4a12;--shadow:none;
  --gUp:#5fd0c6;--gDown:#f08a99;--gMix:#a9bdf0;--g2:#f2a76b;--grid:#2b3858;--gtext:#a3abbf;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:19px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Unbounded,"Nunito Sans",system-ui,sans-serif;letter-spacing:-.01em}
b,strong{font-weight:800}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- band ---- */
.band{color:#fff;background:var(--band);background-image:linear-gradient(115deg,var(--band) 0%,#1f6fae 55%,#1a9bb5 100%);border-radius:0 0 28px 28px;padding:22px 0 20px}
.band .kick{font-size:15.3px;font-weight:800;opacity:.9;letter-spacing:.02em}
.band h1{margin:6px 0 6px;font-size:33px;line-height:1.15;font-weight:600}
.band p{margin:0;max-width:760px;font-size:17.7px;opacity:.92}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1;max-width:360px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:999px;transition:width .4s}
.prog b{font-size:16.5px;white-space:nowrap}

/* ---- step menu ---- */
.steps{position:sticky;top:0;z-index:20;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.steps .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.steps .row::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:800;font-size:16.5px}
.step .no{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--panel2);font-size:14.2px}
.step .ct{font-size:14.2px;color:var(--mist);font-weight:700}
.step.on{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.step.on .no{background:rgba(255,255,255,.22)}.step.on .ct{color:inherit;opacity:.85}
.step.full .ct{color:var(--sage)}.step.on.full .ct{color:inherit}

main{padding:20px 0 40px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.sec-title h2{margin:0;font-size:24.8px;font-weight:600}
.sec-title .n{font-family:Unbounded,sans-serif;font-size:15.3px;color:var(--brass);font-weight:600}
.lead{color:var(--dim);margin:0 0 14px;font-size:17.7px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card h3{margin:0 0 4px;font-size:18.9px;font-weight:600}
.card .ins{color:var(--dim);font-size:16.5px;margin-bottom:12px}
.note{border-radius:14px;background:var(--panel2);padding:12px 14px;font-size:17.1px;color:var(--dim);margin:0 0 16px}
.note b{color:var(--paper)}

/* ---- sub menu (structures, drills) ---- */
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sub{border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:6px 11px;font-weight:800;font-size:15.3px;display:flex;gap:6px;align-items:center}
.sub small{color:var(--mist);font-weight:700}
.sub.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass)}
.sub.full small{color:var(--sage)}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nums .sub{min-width:42px;justify-content:center;font-family:Unbounded,sans-serif;font-weight:600}
.nums .sub.seen:not(.on){background:var(--panel2)}

/* ---- learn panel ---- */
.lhd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lhd .big{font-family:Unbounded,sans-serif;font-size:35.4px;font-weight:600;color:var(--brass);line-height:1}
.lhd h3{font-size:20.1px;margin:0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}

.chip.s{background:var(--chipS);color:var(--chipSt)}.chip.v{background:var(--chipV);color:var(--chipVt)}
.chip.l{background:var(--chipL);color:var(--chipLt)}.chip.n{background:var(--chipN);color:var(--chipNt)}
.chip.p{padding:4px 2px;color:var(--mist)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:14.8px;color:var(--mist);margin-bottom:12px}

.two{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.eg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:17.7px}
.eg .tg{flex:0 0 auto;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);background:var(--panel2);border-radius:8px;padding:2px 7px;height:fit-content;margin-top:2px}
.eg.real .tg{background:var(--sageT);color:var(--sage)}
.eg b{background:var(--chipL);color:var(--chipLt);border-radius:6px;padding:0 3px}
.rule,.trap{border-radius:14px;padding:11px 13px;font-size:17.1px;margin-top:10px}
.rule{background:var(--sageT)}.rule>b:first-child{color:var(--sage)}

.gcap{font-size:15.3px;color:var(--mist);margin:6px 2px 0}

.replay{margin-top:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:5px 11px;font-weight:800;font-size:15.3px}

table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:17.1px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.t th{text-align:left;background:var(--panel2);padding:9px 12px;font-weight:800}
.t td{padding:9px 12px;border-top:1px solid var(--line)}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mist .x,.mist .v{border-radius:14px;padding:10px 12px;font-size:17.1px}
.mist .x{background:var(--coralT)}.mist .x s{color:var(--coral)}
.mist .v{background:var(--sageT)}

/* ---- charts ---- */
svg.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--gtext);font-size:13px;font-family:"Nunito Sans",system-ui,sans-serif}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .lbl{font-size:13.6px;font-weight:800;font-family:"Nunito Sans",system-ui,sans-serif}
.chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.3s ease-out forwards}
@keyframes dl{to{stroke-dashoffset:0}}
.chart .key{font-size:13.6px;font-weight:700;fill:var(--paper);font-family:"Nunito Sans",system-ui,sans-serif}

/* ---- graph exercise cards ---- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.gcard .gt{font-weight:800;font-size:17.7px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gcard .gt i{font-style:normal;font-size:13px;font-weight:800;background:var(--panel2);color:var(--mist);border-radius:8px;padding:2px 7px}
.gcard .gt span{font-weight:600;color:var(--mist);font-size:15.3px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-size:17.7px;margin-bottom:8px}
.q .p .num{font-weight:800;color:var(--brass);margin-right:6px}
.q .p .tg{display:inline-block;font-size:13px;font-weight:800;background:var(--chipS);color:var(--chipSt);border-radius:8px;padding:1px 7px;margin-right:4px}
.q .p .sm{font-size:15.3px;color:var(--mist)}
.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:17.1px;margin-bottom:6px}
.wk .l{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}
select.sel{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--paper);min-width:150px}
select.sel.ok{border-color:var(--sage);background:var(--sageT)}select.sel.no{border-color:var(--coral);background:var(--coralT)}

/* ---- input + coach ---- */
.iw{margin-top:6px}
.iw .lab{font-size:14.2px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}
textarea{width:100%;font:inherit;font-size:18.9px;line-height:1.5;color:var(--paper);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:62px;outline:none}
textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:8px 16px;font-weight:800;font-size:16.5px;background:var(--brass);color:var(--onbrass)}
.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:17.7px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:14.8px;color:var(--mist)}
.done-tag{font-size:14.8px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:16.5px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.fb.on{display:block}
.fb .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px}
.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:14.2px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:17.7px;line-height:1.7;margin-bottom:6px}
.ann mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--amber)}
.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:13.6px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:17.1px}
.it .k{display:inline-block;font-size:13px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}
.tryit{margin-top:3px;font-weight:800;color:var(--sage)}
.why{margin-top:2px;color:var(--mist);font-size:15.9px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:17.1px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.blockbar .score{font-weight:800;color:var(--dim);font-size:16.5px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.foot{color:var(--mist);font-size:14.8px;text-align:center;padding:10px 18px 30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);font-weight:800;border-radius:14px;padding:9px 16px;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .band{padding:16px 0 16px;border-radius:0 0 20px 20px}
  .band h1{font-size:26px}
  .band p{font-size:16.5px}
  .two,.ggrid,.mist{grid-template-columns:1fr}
  .card{padding:14px}
  .step{padding:7px 11px;font-size:15.3px}
  .sec-title h2{font-size:21.2px}
  .chip{font-size:15.3px}
}
@media print{.steps,.irow,.blockbar,.nextbar{display:none}.sec{display:block!important}}

.gimg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.gimg img{max-width:100%;height:auto;max-height:340px}
.ovl{display:grid;grid-template-columns:1fr;gap:16px}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.ovc .gt{font-weight:800;font-size:17.7px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ovc .gt i{font-style:normal;font-size:14.2px;font-weight:800;background:var(--brass);color:var(--onbrass);border-radius:8px;padding:2px 9px}
.ovc .gt span{font-weight:600;color:var(--mist);font-size:14.8px}
.iw+.iw{margin-top:12px}

:root[data-theme="dark"] .iw .lab.s1{color:#c3b0f5}
.clue{font-size:15.9px;color:var(--dim);margin:6px 0 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 12px}
.three .card{margin:0}
.phg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phg .card{margin:0}
.sub-h{font-size:18.9px;margin:18px 0 8px}
.sent{border-radius:14px;padding:12px 14px;font-size:17.7px}
.sent .st{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.sent.s1{background:var(--chipS);border:1px solid color-mix(in srgb,var(--chipSt) 35%,transparent)}.sent.s1 .st{color:var(--chipSt)}
mark.t{background:var(--mark);color:inherit;border-radius:5px;padding:0 3px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);margin:6px 0 12px;border-radius:12px;overflow:hidden;font-size:14.8px;font-weight:800;text-align:center;color:#fff}
.scale span{padding:7px 2px}.scale span:nth-child(1){background:#7aa7b0}.scale span:nth-child(2){background:#4f98a6}.scale span:nth-child(3){background:#2f7f8e}.scale span:nth-child(4){background:#1f6573}.scale span:nth-child(5){background:#134a58}
.fstack{display:grid;gap:8px;margin:0 0 12px}

.fs>b{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:var(--brass);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Unbounded,sans-serif}
.fs .ff{font-weight:800;font-size:17.1px}.fs .fe{font-size:17.7px}
.fstack.small .fs{padding:7px 12px}.fstack.small .fs>b{width:26px;height:26px;font-size:14.2px}

.fc b{flex:0 0 auto;background:var(--brass);color:#fff;border-radius:7px;padding:0 7px;font-family:Unbounded,sans-serif;font-size:14.2px}
.rule{background:var(--panel2)}
.gapgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.q.g .p{line-height:2.1}

<body>
<script>
(function(){
const CH={id:"wt2-l22-intro-two-part",kicker:"Writing Task 2 · Lesson 22 · Two-part question introductions",title:'How to write a <span style=\"color:#ffd27a\">clear introduction</span> for two-part questions',
lead:"Learn from your teacher’s own sample essays: paraphrase the situation, then promise the reasons and give your position. Then practise on 10 questions."};
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];

const OPIN=/\b(i (believe|think|feel|consider|regard|would argue|see|personally|tend to think|share the view|am (of the opinion|convinced|certain|sure))|in my (opinion|view|mind)|to my mind|to me|personally)\b/i;

const CONC=/^\s*(while|although|though)\b/i;

function run(a,b){let best=0;for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)if(a[i]===b[j]){let k=0;while(i+k<a.length&&j+k<b.length&&a[i+k]===b[j+k])k++;if(k>best)best=k}return best}

   {ok:first.split(/\s+/).length>=8&&!REAS.test(first)&&!STANCE.test(first)&&!OPIN.test(first)&&!/\?/.test(first),crit:1,label:"Paraphrase",bad:"Start with a sentence that paraphrases the situation (no reasons and no opinion yet): “It is not uncommon to see …”, “Recent years have seen a rise in …”, “More and more people these days …”.",good:"Your first sentence paraphrases the situation."},

 h+=EXC.map(x=>'<div class="card"><h3>Example '+(EXC.indexOf(x)+1)+' · '+x.src+'</h3><div class="seg s"><div class="st">Question</div>'+esc(x.q)+'</div><div class="grp">Introduction · '+PNAME[x.pat]+'</div>'+cparts(x.parts)+'<div class="note">'+esc(x.note)+'</div></div>').join("");
 return h}});
steps.push({label:"3 Guided practice",html:()=>{
 let h='<div class="sec-title"><span class="n">STEP 3</span><h2>Guided practice</h2></div><p class="lead">Part A: choose the best introduction. Part B: write two introductions. Everything comes from your teacher’s sample essays.</p>';
 h+='<div class="card"><h3>Part A · Choose the best introduction</h3>'+G.picks.map((g,i)=>'<div class="seg p"><div class="st">'+g.src+' · topic</div>'+esc(g.topic)+'</div>'+pickQ("GP"+(i+1),{label:"Introduction "+(i+1),opts:g.opts,ans:g.ans,fb:g.fb},i+1)).join("")+'</div>';
 [G.w1,G.w2].forEach((w,i)=>{
  const tp=Object.assign({},w,{hint:hintFor(w)});
  h+='<div class="card"><h3>Part B'+(i+1)+' · Write an introduction ('+w.src+')</h3><div class="seg s"><div class="st">Question</div>'+esc(w.q)+'</div><div class="seg" style="background:var(--card2,#f4f1ea);border-left:5px solid #2f6fd0"><div class="st">Your plan</div><b>'+PNAME[w.pat]+'</b> · no real ideas</div>'+writeQ("GW"+(i+1),tp)+'</div>';});
 return h}});
steps.push({label:"4 Practice tests",subnav:true,units:TOPICS.map(t=>({label:"Topic "+t.n,html:()=>{
 const tp=Object.assign({},t,{hint:hintFor(t)});
 let h='<div class="card"><div class="lhd"><div class="big">'+t.n+'</div><div><h3>Write an introduction 🌱</h3><div class="ins" style="margin:0">Paraphrase the situation, then promise the reasons and give your position. Earn a ⭐!</div></div></div><div class="seg s" style="margin-bottom:10px"><div class="st">Question</div>'+esc(t.q)+'</div>'
 +'<div class="seg" style="background:var(--card2,#f4f1ea);border-left:5px solid #2f6fd0"><div class="st">Your plan</div><b>'+PNAME[t.pat]+'</b> · no real ideas<div style="margin-top:6px;font-size:14px"><b>Paraphrase help:</b> '+t.para.map(p=>esc(p[0])+' → <b>'+esc(p[1])+'</b>').join(' · ')+'</div></div>'+writeQ("C_"+t.n,tp)+'</div>';
 return h}}))});

/* ---------- build */
function build(){
 REG=[];
 document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header><nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">MrIkromov’s IELTS · Instagram @ustoz_jasur · Telegram @TeamMrIkromov</div><div id="toast"></div>';
 const st=$("#steps"),mn=$("#main");
 steps.forEach((s,si)=>{
  const b=document.createElement("button");b.className="step";b.id="st"+si;b.innerHTML=s.label+'<span class="ct" id="ct'+si+'"></span>';b.onclick=()=>showStep(si);st.appendChild(b);
  const sec=document.createElement("section");sec.id="sec"+si;sec.style.display="none";
  if(s.subnav){
   sec.innerHTML='<div class="sec-title"><span class="n">STEP 4</span><h2>Practice tests · 10 questions</h2></div><p class="lead">Use what you learned. For each question, write one introduction (2–3 sentences). Earn a ⭐ for each!</p><div class="nums" id="nv'+si+'"></div><div id="uv'+si+'"></div>';
   mn.appendChild(sec);
   const nv=$("#nv"+si,sec),uv=$("#uv"+si,sec);
   s.units.forEach((u,ui)=>{const nb=document.createElement("button");nb.className="sub";nb.id="u"+si+"_"+ui;nb.textContent=ui+1;nb.onclick=()=>showUnit(si,ui);nv.appendChild(nb);const bx=document.createElement("div");bx.innerHTML=u.html();bx.style.display="none";u.box=bx;uv.appendChild(bx)});
  }else{sec.innerHTML=s.html();mn.appendChild(sec)}
 });
 wire();applyState()}
function showStep(si){ST.step=si;steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});if(steps[si].subnav)showUnit(si,Math.min(ST.unit[si]||0,steps[si].units.length-1));window.scrollTo({top:0});save()}
function showUnit(si,ui){ST.unit[si]=ui;steps[si].units.forEach((u,k)=>{u.box.style.display=k===ui?"":"none";$("#u"+si+"_"+k).classList.toggle("on",k===ui)});save()}
function stepKeys(si){const root=$("#sec"+si);return $$("[data-key]",root).map(e=>e.dataset.key).filter((v,i,a)=>a.indexOf(v)===i&&REG.some(r=>r.key===v))}
function progress(){let tot=REG.length,done=REG.filter(r=>ST.ok[r.key]).length;$("#pbar").style.width=Math.round(done/tot*100)+"%";$("#pnum").textContent=done+" / "+tot+" done";
 steps.forEach((s,si)=>{const ks=stepKeys(si),d=ks.filter(k=>ST.ok[k]).length;const c=$("#ct"+si);if(c){c.textContent=ks.length?d+"/"+ks.length:"";$("#st"+si).classList.toggle("full",ks.length>0&&d===ks.length)}});stars()}
const CHEER=["Great job! 🎉","Excellent! ⭐","You nailed it! 💪","Superb idea! 🚀","Well done! 👏"];
function cheer(){toast(CHEER[Math.floor(Math.random()*CHEER.length)])}
function stars(){let n=0;TOPICS.forEach((t,ui)=>{const a=ST.ok["C_"+t.n];n+=a?1:0;const el=document.getElementById("u3_"+ui);if(el)el.textContent=(ui+1)+(a?" ⭐":"")});const p=document.getElementById("pnum");if(p)p.textContent+="  ·  ⭐ "+n+"/"+TOPICS.length}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function wire(){
 $$("select.sel").forEach(el=>el.addEventListener("change",()=>runSel(el.dataset.key,true)));
 $$("textarea").forEach(ta=>ta.addEventListener("input",()=>{const id=ta.id;if(id.startsWith("ta_")){const k=id.slice(3);ST.saved[k]=ta.value;wc(k)}else{ST.saved[id]=ta.value}save()}));
 document.body.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const k=b.dataset.key,a=b.dataset.act;
  if(a==="hint")$("#hint_"+k).classList.toggle("on");
  if(a==="model")$("#md_"+k).style.display="";
  if(a==="check")runWrite(k);
})}
function wc(k){const ta=$("#ta_"+k),n=nw(ta.value);$("#wc_"+k).textContent=n+" words"}
function runSel(k,say){const r=REG.find(x=>x.key===k),el=$('select[data-key="'+k+'"]'),fb=$("#fb_"+k);if(el.value==="")return;const ok=+el.value===r.ans;el.className="sel "+(ok?"ok":"no");
 const msg=r.fbs?r.fbs[+el.value]:(ok?r.expl:"");
 fb.className="fb on "+(ok?"good":"bad");fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"Correct! ":"Not quite. ")+'</span></div><div class="body">'+esc(msg||"")+'</div>';
 ST.saved[k]=el.value;if(ok){ST.ok[k]=1}else delete ST.ok[k];if(say)save();progress()}
function runWrite(k){const r=REG.find(x=>x.key===k),ta=$("#ta_"+k);if(!ta.value.trim()){toast("Write your introduction first");return}
 const res=checkBody(ta.value,r.tp),fb=$("#fb_"+k);fb.className="fb on "+res.v;fb.innerHTML=fbHTML(res,"Well done! This is a clear introduction.");ta.className=res.v==="good"?"ok":(res.v==="bad"?"no":"");
 if(res.v!=="bad"){if(!ST.ok[k])cheer();ST.ok[k]=1;$("#dn_"+k).textContent="✓ done";$("#md_"+k).style.display=""}else{delete ST.ok[k];$("#dn_"+k).textContent=""}
 save();progress()}
function applyState(){
 REG.forEach(r=>{if(r.kind==="sel"){const v=ST.saved[r.key];if(v==null)return;const el=$('select[data-key="'+r.key+'"]');el.value=v;runSel(r.key,false)}
  else if(r.kind==="write"){const v=ST.saved[r.key];if(v==null)return;const ta=$("#ta_"+r.key);ta.value=v;wc(r.key);{const pv=ST.saved["pl_"+r.key],pe=$("#pl_"+r.key);if(pv!=null&&pe)pe.value=pv}if(ST.ok[r.key])$("#dn_"+r.key).textContent="✓ done"}
});
 showStep(Math.min(ST.step||0,steps.length-1));progress()}
build();window.__T=TOPICS;window.runWrite=runWrite;
})();

</script>
</body>
</html>
