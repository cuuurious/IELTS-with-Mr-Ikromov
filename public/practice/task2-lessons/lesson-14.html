const TOPICS=[{"n": 1, "q": "Young people are often influenced by their peers. Do the advantages of peer pressure outweigh the disadvantages?", "side": "dis", "lose": ["Healthy competition → students see classmates doing well → they work harder to catch up"], "win": ["Bad habits → teenagers copy smoking and drinking to be accepted → health problems and addiction", "Loss of individuality → teenagers dress and act like the group → they hide their real personality and interests"], "m1": "Admittedly, peer pressure can be beneficial in some respects. The most obvious benefit is healthy competition at school. This is because a teenager who sees classmates doing well is likely to study harder to catch up with them. As a result, student performance improves thanks to a push from friends.", "m2": "Despite these benefits, I would argue that peer pressure does more harm than good. First of all, it pushes teenagers towards bad habits. Many start smoking or drinking alcohol simply because their friends do, since they want to be accepted by the group. As a result, they may suffer lasting health problems and addiction. Besides, peer pressure damages individuality. Teenagers who dress and behave like everyone else hide their real personality, which means they never develop their own interests. In the long run, this leaves them less confident adults."}, {"n": 2, "q": "Recent advances in medicine have resulted in an increase in life expectancy. Do you think that the advantages outweigh the disadvantages?", "side": "dis", "lose": ["Economic gain → the retirement age can be raised → experienced workers stay productive"], "win": ["Overpopulation → more people need food and space → shortages and environmental damage", "Pressure on healthcare → older people fall ill more often → hospitals are overloaded and costs rise"], "m1": "To start, a longer life expectancy has some clear benefits. The most obvious one is economic. Since people now stay healthy for longer, governments can raise the retirement age to 70 or more. As a result, experienced and wise employees remain in the workforce, which means higher productivity.", "m2": "However, I believe the downsides of living longer are more serious. The chief problem is overpopulation. As people live longer, the world’s population grows, so demand for food and space keeps rising. This leads to shortages and environmental damage, because countries use more natural resources to meet these needs. Another drawback is the burden on healthcare. Older people become ill more often, which means hospitals are overloaded and treatment costs rise. As a result, societies struggle to look after everybody."}, {"n": 3, "q": "Some people say patriotism causes problems and is negative overall. Others feel it is beneficial for society at large. Do the advantages of patriotism outweigh its disadvantages?", "side": "dis", "lose": ["Stronger sense of community → citizens share a common goal → a peaceful and united society"], "win": ["Putting national interests first → governments pursue their goals at all costs → trade wars and conflicts", "Closed-mindedness → people distrust foreigners → prejudice and discrimination"], "m1": "On the one hand, patriotism has some real advantages. It creates a stronger sense of community. This is because citizens who love their homeland share a common goal, so they are more willing to cooperate. As a result, society becomes more peaceful and united.", "m2": "That said, I would argue that the drawbacks of patriotism are more significant. To begin with, patriotic people tend to put their country’s interests above everyone else’s. This means governments pursue national goals at all costs, which leads to trade wars and even armed conflicts. Besides, patriotism can make people close-minded. This is because those who believe their nation is the best may distrust foreigners, so prejudice and discrimination spread. In no way can such attitudes be justified."}, {"n": 4, "q": "Social media has replaced the traditional methods of communicating and people use more and more social media to follow news and events. Do the advantages outweigh the disadvantages?", "side": "dis", "lose": ["Ease of communication → messages reach anyone instantly → friends and families stay in touch across the world"], "win": ["Addiction → endless feeds and notifications are hard to resist → hours are wasted and face-to-face relationships suffer", "Fake news → anyone can post without checking facts → false information spreads quickly and misleads the public"], "m1": "Admittedly, social media has some clear benefits. The main one is ease of communication. This is because messages can reach anyone in seconds, whether they live next door or abroad. As a result, friends and relatives stay in touch even when they are thousands of kilometres apart.", "m2": "Despite this, I believe the downsides of social media are more worrying. First, it is highly addictive. Endless feeds and constant alerts are difficult to ignore, so people lose hours of their day online. As a result, their real-life relationships suffer. Another problem is fake news. Since anybody can post without checking facts, lies travel fast, which means ordinary readers can easily be misled. This is particularly dangerous during elections, when voters need honest information."}, {"n": 5, "q": "Online education and training is becoming increasingly popular in the business world. Do the advantages of this development outweigh the disadvantages?", "side": "adv", "lose": ["Lack of hands-on experience → trainees watch lessons and answer tests instead of practising → they struggle with real situations at work"], "win": ["Savings of time and money → no commuting or transport costs → more resources left for learning", "Use of technology → trainees practise with online software → faster learning and more efficiency"], "m1": "Admittedly, online training is not without its drawbacks. The main concern is a lack of hands-on experience. This is because trainees mostly watch lessons and answer tests instead of practising real tasks. As a result, many of them struggle when they face real challenges at work.", "m2": "Despite these drawbacks, I believe the advantages of online training are more significant. First of all, it saves time and money. Because trainees do not have to commute, they spend nothing on transport and lose no working hours. This means more resources can be spent on learning itself. Besides, online courses make use of technology. Trainees practise with spreadsheets and business software during the course, which leads to faster learning. As a result, companies gain more efficient employees."}, {"n": 6, "q": "Many people now work from home instead of going to an office. Do the advantages outweigh the disadvantages?", "side": "adv", "lose": ["Isolation → employees spend the day alone instead of chatting with colleagues → loneliness and weaker teamwork"], "win": ["Savings of time and money → no commuting → more free time and lower costs", "Better work-life balance → flexible hours and family nearby → less stress and higher productivity"], "m1": "On the one hand, working from home has some drawbacks. The main one is isolation. This is because workers sit by themselves all day and rarely speak to their colleagues. As a result, they can feel lonely, and cooperation within a team may become weaker.", "m2": "Having said that, I would argue that the advantages of remote work are more significant. To begin with, it saves time and money. Since employees do not commute, they gain a few hours a day and spend nothing on fuel or tickets. This means they can use the extra time for rest or hobbies. Besides, working from home improves work-life balance. People can arrange flexible hours around their families, which leads to less stress. As a result, many employees become more productive."}, {"n": 7, "q": "Many schools now allow students to use smartphones in the classroom. Do the advantages outweigh the disadvantages?", "side": "dis", "lose": ["Quick access to information → students look up facts in seconds → lessons become more interactive"], "win": ["Distraction → games and messages are tempting → students stop paying attention and their grades fall", "Cheating → phones give instant access to answers → unfair test results and weaker learning"], "m1": "To start, smartphones in the classroom can be beneficial in some respects. They give students quick access to information. This is because a student can look up a fact in seconds instead of waiting for the teacher. As a result, lessons become more interactive.", "m2": "In spite of this, I believe the drawbacks of phones in class are more serious. First of all, they are a major distraction. Games and messages are very tempting, so students stop paying attention to the lesson. As a result, their grades fall. Another problem is cheating. Since a phone can give instant access to answers, students may copy during tests, which means results become unfair. In the end, learning becomes weaker."}, {"n": 8, "q": "More and more shops accept only card or mobile payments instead of cash. Do the advantages outweigh the disadvantages?", "side": "adv", "lose": ["Security risks → card details can be hacked or stolen → customers lose money"], "win": ["Speed and convenience → no cash or change is needed → shorter queues and quicker shopping", "Lower crime → shops and taxis hold less cash → fewer robberies and safer streets"], "m1": "Admittedly, cashless payments are not free of drawbacks. The main concern is security. This is because card details can be hacked or stolen, especially on unprotected websites. As a result, some customers lose money and find it hard to get it back.", "m2": "However, I believe the advantages of going cashless are more significant. First of all, it is fast and convenient. Customers do not need to carry cash or wait for change, since a payment takes only a few seconds. As a result, queues become shorter and shopping becomes quicker. Besides, cashless payments make streets safer. Shops and taxis hold less money, which means thieves have less to steal. In this way, robberies become less common."}, {"n": 9, "q": "Computer games are becoming more and more popular among teenagers. Do the advantages outweigh the disadvantages?", "side": "dis", "lose": ["Problem-solving skills → many games need planning and quick decisions → players think more sharply"], "win": ["Addiction → players spend many hours at the screen → they neglect homework and sleep", "Poor health → sitting for long hours → obesity and eye strain"], "m1": "To begin with, computer games can be beneficial in some ways. They develop problem-solving skills. This is because many games require careful planning and quick decisions from the player. As a result, regular players learn to think more sharply, even under pressure.", "m2": "Despite this, I would argue that games do teenagers more harm than good. First of all, they can be addictive. Players spend many hours in front of a screen, so they neglect their homework and sleep. As a result, their school performance falls. Another drawback is poor health. Sitting for long hours leads to obesity and eye strain, which means young gamers often face medical problems later on. In this way, a hobby that seems harmless slowly damages their wellbeing."}, {"n": 10, "q": "Many countries are building more nuclear power plants to produce electricity. Do the advantages outweigh the disadvantages?", "side": "adv", "lose": ["Danger of accidents → a radiation leak can contaminate land for decades → serious illness and costly clean-up"], "win": ["Clean electricity → plants emit almost no carbon dioxide → slower climate change and cleaner air", "Reliable supply → plants run day and night in any weather → stable energy for factories and homes"], "m1": "Admittedly, nuclear power has some serious drawbacks. The main concern is the danger of accidents. This is because a radiation leak can contaminate the surrounding land for decades. As a result, local people may fall seriously ill, and clean-up operations cost billions of dollars.", "m2": "Despite this, I believe the advantages of nuclear energy are more significant. First of all, it produces clean electricity. Since plants emit almost no carbon dioxide while operating, they help slow down climate change and keep the air clean. Besides, nuclear power is reliable. Plants can run day and night in any weather, which means factories and homes enjoy a stable supply of energy. As a result, countries depend less on imported fuel."}];

, I would argue…” and develops three ideas, so it is longer and stronger."}, {"src": "Information technology", "side": "adv", "q": "Information technology is changing many aspects of our lives and now dominates our home, leisure and work activities. Do you think the benefits of information technology outweigh the disadvantages?", "l1": "the other side (disadvantages)", "l2": "my side (advantages)", "b1": [["Admittedly, the frequent use of information technology in our daily lives can sometimes prove undesirable.", "T"], ["The main concern is over health: both physical and mental health of an individual is at risk when they are overexposed to technology.", "C"], ["While computers at work make people sedentary, excessive use of social media leads to social isolation and depression.", "E"], ["As a result, one’s overall well-being suffers.", "R"]], "b2": [["Despite the possible downsides, information technology has more advantages to offer.", "T"], ["First of all, it has increased productivity at work.", "C"], ["Thanks to technologies such as the internet and smartphones, employees are able to create, process, store and share information at remarkable speed.", "E"], ["Swift exchange of information, in turn, results in greater efficiency and output.", "R"], ["The benefits of information technologies also extend to personal life.", "B"], ["It is information technology that has made entertainment more accessible and affordable.", "E"], ["People can now enjoy an extensive range of recreational media such as movies and music at their convenience and at negligible cost.", "R"], ["Netflix and Spotify are some examples of online platforms where one can stream a movie or music of their choice with great ease.", "X"]], "note": "The same shape: a short paragraph for the other side (“Admittedly…”), then a longer paragraph for the side the writer supports. An example (Netflix and Spotify) is optional but makes an idea concrete."}, {"src": "Cars", "side": "adv", "q": "As countries develop, more and more people buy and use their own cars. Do the advantages for individuals outweigh the disadvantages for the environment?", "l1": "the other side (disadvantages)", "l2": "my side (advantages)", "b1": [["On the one hand, some well-known effects of cars on the environment should be acknowledged.", "T"], ["Cars are known to spew gases and particles that have long been found to be detrimental to our ecosystem.", "C"], ["Condoning the growing purchase of personal vehicles knowing the harm they do to our planet can be viewed as suicide by some people.", "R"], ["Another way automobiles might affect nature is closely related to their energy consumption.", "B"], ["Despite the growing popularity of electric cars, combustion engine cars remain to account for most cars being bought and produced.", "E"], ["This means more natural reserves of fossil fuel might have to be used to meet the new demand from new car owners.", "R"]], "b2": [["Having said that, I still think that benefits to individuals are more significant.", "T"], ["To begin with, cars allow people greater mobility; one can run errands and attend to their personal affairs at their convenience.", "C"], ["As a person who does not own a personal vehicle, I am rather limited in my ability to move around or do tasks that might require travelling.", "X"], ["Having a personal car also comes with a lot of comforts: air conditioning, access to entertainment and most importantly privacy.", "B"], ["When presented with a chance to have these comforts, most people would not hesitate at the thought of buying a car.", "E"], ["Lastly, greater demand for cars has led to improvements in car design which has ultimately benefitted car owners.", "B"]], "note": "“On the one hand” starts the other side, and “Having said that, I still think…” turns back to the writer’s own side. The personal example in Body 2 is allowed because it supports an idea."}, {"src": "Fast food", "side": "adv", "q": "In many countries, fast food is b e and harmful addictions like compulsive TV-watching and playing video games.", "E"], ["In no way can the use of technology among children be justified if their health is at risk.", "Z"]], "note": "Now the writer supports the disadvantages. Body 1 admits the advantages (“Admittedly…”) and Body 2 argues the disadvantages. The closing sentence (“In no way can … be justified”) is an optional strong ending."}], "G": {"picks": [{"src": "Gap year", "topic": "Body 2 · the topic sentence for the side you support (the advantages)", "arg": "Your opinion: a gap year has more advantages.", "opts": ["Despite these drawbacks, I would argue that a year off school does more good than harm.", "Taking a gap year can prove unfavorable to students in some respects.", "Gap years are good. I like gap years because they are fun.", "In conclusion, a gap year is better than going straight to university."], "ans": 0, "fb": ["", "This is the topic sentence for Body 1: it admits the downside. Body 2 must turn to your own side.", "Too weak: no turn word, and no clear side. A topic sentence should name the advantages and turn from the paragraph before it.", "“In conclusion” belongs to the last paragraph, not to Body 2."]}, {"src": "Fast food", "topic": "Body 1 · the paragraph for the side that loses (the disadvantages)", "arg": "Your opinion: fast food has more advantages.", "opts": ["To start, some issues stemming from fast food being readily available cannot be overlooked. The primary concern is excessive consumption and its harm to health. This is because studies link junk food to obesity and heart disease.", "Fast food saves time at work. A quick lunch means employees finish tasks sooner, so fast food is the best choice for everyone.", "I think fast food is very bad for health and I hate it. I never eat it and nobody should.", "Fast food is unhealthy. Fast food is bad for health. Many people say fast food is unhealthy."], "ans": 0, "fb": ["", "This is the wrong side: Body 1 should admit the h hurts their employment prospects in the long run."}, "w2": {"src": "Fast food", "kind": "win", "side": "adv", "tag": "Body 2 · my side (advantages)", "q": "In many countries, fast food is becoming cheaper and more widely available. Do the disadvantages of this outweigh the advantages?", "ch": ["Higher productivity at work → short lunch breaks are possible → the time saved is used for more tasks", "Better taste → most people prefer it to traditional food → people enjoy their meals more"], "model": "However, I would argue that widely available fast food has made our lives better. To begin with, it raises productivity at work. Because a quick meal takes about half an hour instead of two hours, employees can return to their tasks sooner. As a result, they accomplish more during the day. Besides, fast food simply tastes better to most people. This is why many would rather eat a burger than traditional food, which means more people enjoy their meals."}}};

const EXPL=/\b(because|since|this is why|due to|in other words|that is|this is|which means|owing to|this can be attributed|more specifically|as it|as they|as the|for the reason|seeing as|so that|whereas|indeed)\b/i;

const UPW=/\b(advantages?|benefits?|beneficial|upsides?|merits?|positive|advantageous|virtuous|boon|favou?rable|perks?|clear gains?|good|better|improv\w*|sensible|worthwhile|useful)\b/i;
const DOWNW=/\b(drawbacks?|downsides?|disadvantages?|disadvantageous|concerns?|harm\w*|issues?|problems?|challenges?|negative|not without|not free of|shortcomings?|difficult\w*|worrying|worse|serious|unhealthy|undesirable|unfavou?rable|detrimental|risks?)\b/i;

const TURNB=/\b(however|despite|in spite of|that said|having said that|nevertheless|on the other hand|even so|but|nonetheless)\b/i;
const OPI=/\b(i|my|we|me|our)\b/i;
const W=t=>(t.toLowerCase().match(/[a-z']+/g)||[]);
function run(a,b){let best=0;for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)if(a[i]===b[j]){let k=0;while(i+k<a.length&&j+k<b.length&&a[i+k]===b[j+k])k++;if(k>best)best=k}return best}
const chainText=c=>c.replace(/→/g," ");

   {ok:kwHit>=(lose?2:3),crit:1,label:"On idea",bad:lose?"Develop the idea shown. Use its key words or synonyms.":"Develop the two ideas shown. Use their key words or synonyms.",good:lose?"Develops the idea.":"Develops the ideas."},
   {ok:lose?(n>=40&&n<=125):(n>=70&&n<=200),crit:0,label:"Length",bad:lose?(n<40?"A bit short ("+n+" words). Aim for 50–90 words.":"A bit long ("+n+" words). This paragraph is shorter than the next one: 50–90 words."):(n<70?"A bit short ("+n+" words). Aim for 100–150 words.":"A bit long ("+n+" words). Aim for 100–150 words."),good:n+" words: a good length."},
   {ok:text.indexOf("→")<0,crit:0,label:"Full sentences",bad:"Replace the arrows with full sentences.",good:"Full sentences."}].filter(x=>x&&!(x.ok&&!x.crit&&!x.bad));
  const crit=c.filter(x=>x.crit),okc=crit.filter(x=>x.ok).length,tips=c.filter(x=>!x.crit&&!x.ok).length;
  return {c,v:okc===crit.length&&tips===0?"good":okc>=crit.length-1?"mid":"bad"}}
function checkBody(t,tp){return checkBody5(t,tp)}
function fbHTML(r,done){
  const vd={good:done||"Well done!",mid:"Nearly there: add the missing move.",bad:"Not yet. Fix the red points and check again."}[r.v];
  return '<div class="hd"><span class="vd">'+vd+'</span><span class="meter">'+r.c.map(x=>'<span class="'+(x.ok?"ok":(x.crit?"no":"tip"))+'">'+(x.ok?"✓ ":"✗ ")+x.label+'</span>').join("")+'</span></div><div class="body">'+
  r.c.filter(x=>!x.ok).map(x=>'<div class="it '+(x.crit?"structure":"style")+'"><div><span class="k">'+(x.crit?"must fix":"tip")+'</span>'+esc(x.bad)+'</div></div>').join("")+
  r.c.filter(x=>x.ok).map(x=>'<div class="it praise"><div><span class="k">ok</span>'+esc(x.good)+'</div></div>').join("")+'</div>'}

/* ---------- builders */
let REG=[];
function selQ(key,label,opts,ans,expl,num){
  REG.push({key,kind:"sel",ans,expl});
  return '<div class="q" data-key="'+key+'"><div class="p"><span class="num">'+num+'</span>'+label+'</div><select class="sel" data-key="'+key+'"><option value="">Choose…</option>'+opts.map((o,i)=>'<option value="'+i+'">'+esc(o)+'</option>').join("")+'</select><div class="fb" id="fb_'+key+'"></div></div>'}
function rng(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
function shuf(a,seed){const r=rng(seed),b=a.map((x,i)=>i);for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function selS(key,label,opts,ans,expl,num){const p=shuf(opts,key);return selQ(key,label,p.map(i=>opts[i]),p.indexOf(ans),expl,num)}
function pickQ(key,g,num){
  REG.push({key,kind:"sel",ans:g.ans,fbs:g.fb});
  return '<div class="q" data-key="'+key+'"><div class="p"><span class="num">'+num+'</span><b>'+g.label+'</b> · choose the best sentence</div><select class="sel" data-key="'+key+'"><option value="">Choose…</option>'+g.opts.map((o,i)=>'<option value="'+i+'">'+esc(o)+'</option>').join("")+'</select><div class="fb" id="fb_'+key+'"></div></div>'}
function writeQ(key,tp){
  REG.push({key,kind:"write",tp});
  return '<div class="iw"><div class="lab">Your body paragraph</div><textarea id="ta_'+key+'" placeholder="Write your body paragraph (70–120 words)" style="min-height:230px"></textarea><div class="irow"><button class="btn go" data-act="check" data-key="'+key+'">Check my paragraph</button><button class="btn ghost" data-act="hint" data-key="'+key+'">Hint</button><button class="btn ghost" data-act="model" data-key="'+key+'">Show model</button><span class="wc" id="wc_'+key+'"></span><span class="done-tag" id="dn_'+key+'"></span></div><div class="hint" id="hint_'+key+'">'+tp.hint+'</div><div class="fb" id="fb_'+key+'"></div><div class="mdl" id="md_'+key+'" style="display:none"><b>Model paragraph:</b><div style="margin-top:6px">'+esc(tp.model)+'</div></div></div>'}
const seg=(c,l,t)=>'<div class="seg '+c+'"><div class="st">'+l+'</div>'+esc(t)+'</div>';
const legend='<div class="legend"><span><i style="background:#efe6f7"></i>topic sentence / closing</span><span><i style="background:var(--chipS)"></i>idea</span><span><i style="background:var(--chipV)"></i>explain</span><span><i style="background:var(--chipN)"></i>result</span><span><i style="background:var(--chipL)"></i>example (optional)</span></div>';



/* ---------- steps */
const steps=[];
const CC={T:["p","Topic sentence"],C:["s","First idea"],B:["s","Next idea"],E:["v","Explain"],R:["n","Result"],X:["l","Example"],Z:["p","Closing"]};
const cparts=parts=>'<div class="cp">'+parts.map(p=>'<span class="seg '+CC[p[1]][0]+'" style="display:inline-block;margin:3px 4px 3px 0;padding:6px 10px"><span class="st" style="display:block">'+CC[p[1]][1]+'</span>'+esc(p[0])+'</span>').join("")+'</div>';
const SIDE={adv:"advantages",dis:"disadvantages"};
const HINT={lose:'<b>Plan (Body 1, the other side):</b> <b>Admittedly, … / On the one hand, … / To start, …</b> (name the side that loses) → ONE idea: claim, <b>This is because…</b>, <b>As a result…</b>. No “I”. Short: 50–90 words.',
 win:'<b>Plan (Body 2, my side):</b> <b>Despite these …, I would argue that … / However, I believe … / Having said that, …</b> (name your side) → Idea 1: claim, <b>This is because…</b>, <b>As a result…</b> → <b>Besides, / Another … / Finally,</b> Idea 2 → explain, result. 100–150 words.'};
const ideasBox=(ch,label)=>'<div style="margin-top:6px">'+ch.map((c,i)=>'<span class="seg v" style="display:block;margin:4px 0;padding:6px 10px"><span class="st" style="display:block">'+label+' · Idea '+(i+1)+'</span>'+esc(c)+'</span>').join("")+'</div>';
const EXC=DATA.EX,G=DATA.G;
steps.push({label:"1 Learn",html:()=>{
 const e1=EXC[0];
 let h='<div class="sec-title"><span class="n">STEP 1</span><h2>Learn: body paragraphs when you must give an opinion</h2></div>';
 h+='<div class="card"><h3>1 · The essay map</h3><p class="lead">Your teacher’s sample essays have <b>two body paragraphs</b>. Body 1 admits <b>the side you do NOT support</b>. Body 2 argues <b>the side you support</b>.</p><table class="t"><tr><th>Paragraph</th><th>Its job</th><th>It starts with…</th></tr>'
 +'<tr><td><b>Introduction</b></td><td>Paraphrase + other side + your opinion (Lesson 13)</td><td>While …, I believe …</td></tr>'
 +'<tr><td><b>Body 1</b><br>the other side</td><td><b>Short.</b> One idea, fully developed. No “I”.</td><td>Admittedly, … · On the one hand, … · To start, …</td></tr>'
 +'<tr><td><b>Body 2</b><br>my side</td><td><b>Longer.</b> Two ideas, fully developed. “I” is allowed in the topic sentence.</td><td>Despite these …, I would argue that … · However, I believe … · Having said that, …</td></tr>'
 +'<tr><td><b>Conclusion</b></td><td>Repeat your opinion</td><td>In conclusion, …</td></tr></table>'+legend+'</div>';
 h+='<div class="card"><h3>2 · Which side goes where?</h3><p class="lead">Look at <b>your opinion</b>, not at the order in the question.</p><table class="t"><tr><th>Your opinion</th><th>Body 1</th><th>Body 2</th></tr><tr><td>The <b>advantages</b> are bigger</td><td>The disadvantages (admit them)</td><td>The advantages (argue them)</td></tr><tr><td>The <b>disadvantages</b> are bigger</td><td>The advantages (admit them)</td><td>The disadvantages (argue them)</td></tr></table><div class="note">Careful: “Do the <b>dis</b>advantages outweigh the advantages?” (fast food) – the writer said <b>no</b>, so the advantages still go in Body 2.</div></div>';
 h+='<div class="card"><h3>3 · Topic sentences from the samples</h3><table class="t"><tr><th>Body 1 · admit the other side</th><th>Body 2 · turn to my side</th></tr>'
 +'<tr><td>Admittedly, the frequent use of information technology in our daily lives can sometimes prove undesirable.</td><td>Despite the possible downsides, information technology has more advantages to offer.</td></tr>'
 +'<tr><td>Taking a gap year can prove unfavorable to students in some respects.</td><td>Despite these drawbacks, I would argue that a year off school does more good than harm.</td></tr>'
 +'<tr><td>Admittedly, new technologies children use in their free time benefit both them and their parents.</td><td>In spite of being somewhat beneficial, I believe new technologies do children more harm than good.</td></tr>'
 +'<tr><td>To start, some issues stemming from fast food being readily available cannot be overlooked.</td><td>However, I would argue that the ever-increasing availability of fast food has made our lives better.</td></tr>'
 +'<tr><td>On the one hand, some well-known effects of cars on the environment should be acknowledged.</td><td>Having said that, I still think that benefits to individuals are more significant.</td></tr></table></div>';
 h+='<div class="card"><h3>4 · Every idea: claim, why, result</h3><p class="lead">An argument in your notes is only a few words. Turn it into a <b>developed idea</b>.</p><table class="t"><tr><th>Question</th><th>What you write</th><th>Phrases from the samples</th></tr>'
 +'<tr><td><b>What?</b></td><td><b>Claim</b></td><td>The main concern is … · First of all, … · Another problem is …</td></tr>'
 +'<tr><td><b>Why?</b></td><td><b>Explain</b></td><td>This is because … · Since … · That is, …</td></tr>'
 +'<tr><td><b>So what?</b></td><td><b>Result</b></td><td>As a result, … · This means … · This, in turn, … · Once distracted, … </td></tr>'
 +'<tr><td><b>Example?</b> (optional)</td><td><b>Example</b></td><td>… such as … · … are some examples of …</td></tr></table></div>';
 const ST=[["Body 1 · 1","Admit the other side with one of the three openers. Name that side.","Admittedly, … can prove undesirable · On the one hand, … has some drawbacks · To start, … has some clear benefits"],
 ["Body 1 · 2","ONE idea: claim, then why, then result.","The main concern is … · This is because … · As a result, …"],
 ["Body 2 · 1","Turn to your side. “I” is allowed here. Name your side.","Despite these drawbacks, I would argue that … · However, I believe … · Having said that, I still think …"],
 ["Body 2 · 2","First idea: claim, why, result.","First of all, … · This is because … · As a result, …"],
 ["Body 2 · 3","Second idea with a link: claim, why, result. A third idea or example is optional.","Besides, … · Another … is … · Not only that, … · Finally, …"],
 ["Body 2 · 4","Optional closing line with a strong verdict.","In no way can … be justified."]];
 h+='<div class="card"><h3>5 · Build both paragraphs in order</h3><table class="t"><tr><th>Step</th><th>What you do</th><th>Phrases from the samples</th></tr>'+ST.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join("")+'</table><div class="grp">Real Body 1 and Body 2 · '+e1.src+'</div>'+cparts(e1.b1)+cparts(e1.b2)+'<div class="note">'+esc(e1.note)+'</div></div>';
 h+='<div class="card"><h3>6 · Do and don’t</h3><table class="t"><tr><th>Do ✓</th><th>Don’t ✗</th></tr><tr><td>Body 1: admit the other side, one idea, short.<br>Body 2: turn clearly, two ideas, longer.<br>Develop every idea: claim, why, result.<br>Use your opinion words only in Body 2 (“I would argue”).</td><td>Don’t put “I” in Body 1.<br>Don’t mix both sides in one paragraph.<br>Don’t make Body 1 longer than Body 2.<br>Don’t list ideas without explaining them.</td></tr></table></div>';
 return h}});
steps.push({label:"2 Examples",html:()=>{
 let h='<div class="sec-title"><span class="n">STEP 2</span><h2>Five real examples</h2></div><p class="lead">Read each pair of paragraphs from the sample essays. Every part has a job.</p>'+legend;
 h+=EXC.map((x,i)=>'<div class="card"><h3>Example '+(i+1)+' · '+x.src+'</h3><div class="seg s"><div class="st">Question</div>'+esc(x.q)+'</div><div class="grp">Body 1 · '+x.l1+'</div>'+cparts(x.b1)+'<div class="grp">Body 2 · '+x.l2+'</div>'+cparts(x.b2)+'<div class="note">'+esc(x.note)+'</div></div>').join("");
 return h}});
steps.push({label:"3 Guided practice",html:()=>{
 let h='<div class="sec-title"><span class="n">STEP 3</span><h2>Guided practice</h2></div><p class="lead">Part A: choose the best paragraph. Part B: write Body 1 and Body 2. Everything comes from the sample essays.</p>';
 h+='<div class="card"><h3>Part A · Choose the best answer</h3>'+G.picks.map((g,i)=>'<div class="seg p"><div class="st">'+g.src+'</div><b>'+esc(g.arg)+'</b> · '+esc(g.topic)+'</div>'+pickQ("GP"+(i+1),{label:"Option "+(i+1),opts:g.opts,ans:g.ans,fb:g.fb},i+1)).join("")+'</div>';
 [G.w1,G.w2].forEach((w,i)=>{
  const tp=Object.assign({},w,{hint:HINT[w.kind]});
  h+='<div class="card"><h3>Part B'+(i+1)+' · '+w.tag+' · '+w.src+'</h3><div class="seg s"><div class="st">Question</div>'+esc(w.q)+'</div><div class="seg" style="background:var(--card2,#f4f1ea);border-left:5px solid #2f6fd0"><div class="st">Remember</div><b>'+(w.kind==="lose"?"Your opinion: the "+SIDE[w.side]+" are bigger. Here you admit the other side. One idea. No “I”.":"Your opinion: the "+SIDE[w.side]+" are bigger. Here you argue your side. Two ideas. “I” is allowed in the topic sentence.")+'</b>'+ideasBox(w.ch,w.kind==="lose"?"Other side":"My side")+'</div>'+writeQ("GW"+(i+1),tp)+'</div>';});
 return h}});
steps.push({label:"4 Practice tests",subnav:true,units:TOPICS.map(t=>({label:"Topic "+t.n,html:()=>{
 const t1={kind:"lose",side:t.side,ch:t.lose,model:t.m1,q:t.q,hint:HINT.lose},t2={kind:"win",side:t.side,ch:t.win,model:t.m2,q:t.q,hint:HINT.win};
 const lw=t.side==="adv"?"disadvantages":"advantages";
 let h='<div class="card"><div class="lhd"><div class="big">'+t.n+'</div><div><h3>Write two body paragraphs 🌱</h3><div class="ins" style="margin:0">Your opinion: the <b>'+SIDE[t.side]+'</b> are bigger. Body 1 admits the '+lw+'. Body 2 argues the '+SIDE[t.side]+'. Earn a ⭐ for both!</div></div></div><div class="seg s" style="margin-bottom:10px"><div class="st">Question</div>'+esc(t.q)+'</div></div>'
 +'<div class="card"><h3>Body 1 · the other side ('+lw+')</h3>'+ideasBox(t.lose,"Other side")+writeQ("B1_"+t.n,t1)+'</div>'
 +'<div class="card"><h3>Body 2 · my side ('+SIDE[t.side]+')</h3>'+ideasBox(t.win,"My side")+writeQ("B2_"+t.n,t2)+'</div>';

/* ---------- build */
function build(){
 REG=[];
 document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header><nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">MrIkromov’s IELTS · Instagram @ustoz_jasur · Telegram @TeamMrIkromov</div><div id="toast"></div>';
 const st=$("#steps"),mn=$("#main");
 steps.forEach((s,si)=>{
  const b=document.createElement("button");b.className="step";b.id="st"+si;b.innerHTML=s.label+'<span class="ct" id="ct'+si+'"></span>';b.onclick=()=>showStep(si);st.appendChild(b);
  const sec=document.createElement("section");sec.id="sec"+si;sec.style.display="none";
  if(s.subnav){
   sec.innerHTML='<div class="sec-title"><span class="n">STEP 4</span><h2>Practice tests · 10 questions</h2></div><p class="lead">Use what you learned. For each question, write two body paragraphs: the other side, then your own side. Earn a ⭐ for each!</p><div class="nums" id="nv'+si+'"></div><div id="uv'+si+'"></div>';
   mn.appendChild(sec);
   const nv=$("#nv"+si,sec),uv=$("#uv"+si,sec);
   s.units.forEach((u,ui)=>{const nb=document.createElement("button");nb.className="sub";nb.id="u"+si+"_"+ui;nb.textContent=ui+1;nb.onclick=()=>showUnit(si,ui);nv.appendChild(nb);const bx=document.createElement("div");bx.innerHTML=u.html();bx.style.display="none";u.box=bx;uv.appendChild(bx)});
  }else{sec.innerHTML=s.html();mn.appendChild(sec)}
 });
 wire();applyState()}
function showStep(si){ST.step=si;steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});if(steps[si].subnav)showUnit(si,Math.min(ST.unit[si]||0,steps[si].units.length-1));window.scrollTo({top:0});save()}
function showUnit(si,ui){ST.unit[si]=ui;steps[si].units.forEach((u,k)=>{u.box.style.display=k===ui?"":"none";$("#u"+si+"_"+k).classList.toggle("on",k===ui)});save()}
function stepKeys(si){const root=$("#sec"+si);return $$("[data-key]",root).map(e=>e.dataset.key).filter((v,i,a)=>a.indexOf(v)===i&&REG.some(r=>r.key===v))}
function progress(){let tot=REG.length,done=REG.filter(r=>ST.ok[r.key]).length;$("#pbar").style.width=Math.round(done/tot*100)+"%";$("#pnum").textContent=done+" / "+tot+" done";
 steps.forEach((s,si)=>{const ks=stepKeys(si),d=ks.filter(k=>ST.ok[k]).length;const c=$("#ct"+si);if(c){c.textContent=ks.length?d+"/"+ks.length:"";$("#st"+si).classList.toggle("full",ks.length>0&&d===ks.length)}});stars()}
const CHEER=["Great job! 🎉","Excellent! ⭐","You nailed it! 💪","Superb idea! 🚀","Well done! 👏"];
function cheer(){toast(CHEER[Math.floor(Math.random()*CHEER.length)])}
function stars(){let n=0;TOPICS.forEach((t,ui)=>{const a=ST.ok["B1_"+t.n]&&ST.ok["B2_"+t.n];n+=a?1:0;const el=document.getElementById("u3_"+ui);if(el)el.textContent=(ui+1)+(a?" ⭐":"")});const p=document.getElementById("pnum");if(p)p.textContent+="  ·  ⭐ "+n+"/"+TOPICS.length}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function wire(){
 $$("select.sel").forEach(el=>el.addEventListener("change",()=>runSel(el.dataset.key,true)));
 $$("textarea").forEach(ta=>ta.addEventListener("input",()=>{const id=ta.id;if(id.startsWith("ta_")){const k=id.slice(3);ST.saved[k]=ta.value;wc(k)}else{ST.saved[id]=ta.value}save()}));
 document.body.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const k=b.dataset.key,a=b.dataset.act;
  if(a==="hint")$("#hint_"+k).classList.toggle("on");
  if(a==="model")$("#md_"+k).style.display="";
  if(a==="check")runWrite(k);
})}
function wc(k){const ta=$("#ta_"+k),n=nw(ta.value);$("#wc_"+k).textContent=n+" words"}
function runSel(k,say){const r=REG.find(x=>x.key===k),el=$('select[data-key="'+k+'"]'),fb=$("#fb_"+k);if(el.value==="")return;const ok=+el.value===r.ans;el.className="sel "+(ok?"ok":"no");
 const msg=r.fbs?r.fbs[+el.value]:(ok?r.expl:"");
 fb.className="fb on "+(ok?"good":"bad");fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"Correct! ":"Not quite. ")+'</span></div><div class="body">'+esc(msg||"")+'</div>';
 ST.saved[k]=el.value;if(ok){ST.ok[k]=1}else delete ST.ok[k];if(say)save();progress()}
function runWrite(k){const r=REG.find(x=>x.key===k),ta=$("#ta_"+k);if(!ta.value.trim()){toast("Write your paragraph first");return}
 const res=checkBody(ta.value,r.tp),fb=$("#fb_"+k);fb.className="fb on "+res.v;fb.innerHTML=fbHTML(res,"Well done! This is a developed body paragraph.");ta.className=res.v==="good"?"ok":(res.v==="bad"?"no":"");
 if(res.v!=="bad"){if(!ST.ok[k])cheer();ST.ok[k]=1;$("#dn_"+k).textContent="✓ done";$("#md_"+k).style.display=""}else{delete ST.ok[k];$("#dn_"+k).textContent=""}
 save();progress()}
function applyState(){
 REG.forEach(r=>{if(r.kind==="sel"){const v=ST.saved[r.key];if(v==null)return;const el=$('select[data-key="'+r.key+'"]');el.value=v;runSel(r.key,false)}
  else if(r.kind==="write"){const v=ST.saved[r.key];if(v==null)return;const ta=$("#ta_"+r.key);ta.value=v;wc(r.key);{const pv=ST.saved["pl_"+r.key],pe=$("#pl_"+r.key);if(pv!=null&&pe)pe.value=pv}if(ST.ok[r.key])$("#dn_"+r.key).textContent="✓ done"}
});
 showStep(Math.min(ST.step||0,steps.length-1));progress()}
build();window.__T=TOPICS;window.runWrite=runWrite;
})();
