textarea.ok{border-color:var(--sage);background:var(--sageT)}

.meter{display:flex;gap:5px;flex-wrap:wrap}

.ann{font-size:17.7px;line-height:1.7;margin-bottom:6px}

.grp{font-size:13.6px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:17.1px}

.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}

<script>
(function(){
const CH={id:"wt2-l24-conclusion-two-part",kicker:"Writing Task 2 · Lesson 24 · Two-part question conclusions",title:'How to write a <span style="color:#ffd27a">clear conclusion</span> for two-part questions',
lead:"Learn from your teacher’s own sample essays: sum up the main reasons and give your position. Then practise on 10 questions."};
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];

/* ---------- checker */
const LINK=/^\s*(in conclusion|to conclude|to sum up|in summary|all in all|overall)/i;
const RSN=/\b(reasons?|factors?|causes?|explain\w*|why|due to|behind|underl\w+|attributed|ascribed|stem\w*|owing to)\b/i;
const OPIN=/\b(i (believe|think|feel|consider|regard|would argue|see|personally|tend to think|share the view|reckon|am (of the opinion|convinced|certain|sure))|i,? however,? (believe|think|consider|regard)|in my (opinion|view|mind)|to my mind|to me|personally)\b/i;
const STANCE=/\b(positive|negative|change for the (better|worse)|favou?rable|unfavou?rable|desirable|undesirable|beneficial|harmful|detrimental|worrying|welcome)\b/i;
const BOTH=/\b(both|as much|equally|partly|in some ways)\b/i;
const NEWEX=/\b(for instance|for example|e\.g\.|case in point|an example|moreover|furthermore|in addition|besides|last (year|week|month)|in my (country|town|city|village|family|school|company)|my (friend|father|mother|brother|sister|uncle|teacher|cousin))\b/i;
const W=t=>(t.toLowerCase().match(/[a-z']+/g)||[]);
function run(a,b){let best=0;for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)if(a[i]===b[j]){let k=0;while(i+k<a.length&&j+k<b.length&&a[i+k]===b[j+k])k++;if(k>best)best=k}return best}
const stem=s=>[...new Set((s.toLowerCase().match(/[a-z]+/g)||[]).filter(w=>w.length>=5).map(w=>w.slice(0,5)))];
function checkConc(text,tp){
  const w=W(text),n=w.length,ss=text.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>1);
  const A=tp.pat==="A";
  const ri=text.search(RSN),oi=text.search(OPIN);
  const pat=A?(ss.length===1&&ri>=0&&oi>ri)
            :(ss.length===2&&RSN.test(ss[0])&&!OPIN.test(ss[0])&&!STANCE.test(ss[0])&&OPIN.test(ss[1])&&STANCE.test(ss[1]));
  const kwList=tp.kw||stem((tp.rea||[]).concat(tp.pos||[]).join(" "));
  const kwHit=kwList.filter(k=>text.toLowerCase().includes(k)).length;
  const cp=run(w,W(tp.q));
  const c=[
   {ok:LINK.test(text),crit:1,label:"Linker",bad:"Start with a linker: “In conclusion,…”, “To conclude,…” or “To sum up,…”.",good:"You start with a linker."},
   {ok:RSN.test(text),crit:1,label:"Reasons",bad:"Sum up the reasons: “… are the main reasons why …”, “… are the main factors behind …”, “… explain …”.",good:"You sum up the reasons."},
   {ok:OPIN.test(text)&&STANCE.test(text),crit:1,label:"Position",bad:"Give your position clearly: “I believe it is a change for the worse.”, “to my mind, it is a positive development”.",good:"You give your position."},
   {ok:!BOTH.test(text),crit:1,label:"One side",bad:"Choose ONE side: positive or negative. Do not write “both”, “as much … as” or “equally”.",good:"One clear side."},
   {ok:pat,crit:1,label:A?"Pattern A":"Pattern B",bad:A?"Pattern A is ONE sentence: “In conclusion, [reason 1] and [reason 2] are the main reasons why …, and I believe it is a change for the worse seeing as [point 1] and [point 2].” Reasons first, position second.":"Pattern B is TWO sentences: first the reasons (“… are the main reasons behind …”), then the position (“I consider this trend a negative one seeing as …”).",good:"The pattern is correct."},
   {ok:kwHit>=3,crit:1,label:"Real ideas",bad:"Sum up the real ideas from your body paragraphs in a few words (see the list). Do not only write “reasons” and “position”.",good:"You sum up the real ideas."},
   {ok:!NEWEX.test(text),crit:1,label:"Nothing new",bad:"Do not give an example, advice or a new point. Only sum up the ideas of the body paragraphs.",good:"No new ideas."},
   {ok:cp<8,crit:1,label:"Own words",bad:"You copied "+cp+" words in a row from the question. Use your own words.",good:"Written in your own words."},
   {ok:n>=22&&n<=75,crit:0,label:"Length",bad:n<22?"A bit short ("+n+" words). Aim for 30–60 words.":"A bit long ("+n+" words). Aim for 30–60 words.",good:n+" words: a good length."},
   {ok:text.indexOf("→")<0,crit:0,label:"Full sentences",bad:"Replace the arrows with full sentences.",good:"Full sentences."}].filter(x=>!(x.ok&&!x.crit&&!x.bad));
  const crit=c.filter(x=>x.crit),okc=crit.filter(x=>x.ok).length,tips=c.filter(x=>!x.crit&&!x.ok).length;
  return {c,v:okc===crit.length&&tips===0?"good":okc>=crit.length-1?"mid":"bad"}}
function checkBody(t,tp){return checkConc(t,tp)}

function rng(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
function shuf(a,seed){const r=rng(seed),b=a.map((x,i)=>i);for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function selS(key,label,opts,ans,expl,num){const p=shuf(opts,key);return selQ(key,label,p.map(i=>opts[i]),p.indexOf(ans),expl,num)}

steps.push({label:"3 Guided practice",html:()=>{
 let h='<div class="sec-title"><span class="n">STEP 3</span><h2>Guided practice</h2></div><p class="lead">Part A: choose the best conclusion. Part B: write two conclusions. Everything comes from your teacher’s sample essays.</p>';
 h+='<div class="card"><h3>Part A · Choose the best conclusion</h3>'+G.picks.map((g,i)=>'<div class="seg p"><div class="st">'+g.src+'</div>'+esc(g.intro)+'</div>'+pickQ("GP"+(i+1),{label:"Conclusion "+(i+1),opts:g.opts,ans:g.ans,fb:g.fb},i+1)).join("")+'</div>';
 [G.w1,G.w2].forEach((w,i)=>{
  const tp=Object.assign({},w,{hint:hintFor(w)});
  h+='<div class="card"><h3>Part B'+(i+1)+' · Write a conclusion ('+w.src+')</h3><div class="seg s"><div class="st">Question</div>'+esc(w.q)+'</div>'+ptsBox(w)+'<div style="margin-top:6px;font-size:14px">'+PATS[w.pat]+'</div>'+writeQ("GW"+(i+1),tp)+'</div>';});
 return h}});
steps.push({label:"4 Practice tests",subnav:true,units:TOPICS.map(t=>({label:"Topic "+t.n,html:()=>{
 const tp=Object.assign({},t,{hint:hintFor(t)});
 let h='<div class="card"><div class="lhd"><div class="big">'+t.n+'</div><div><h3>Write a conclusion 🌱</h3><div class="ins" style="margin:0">Sum up the reasons and give your position. Earn a ⭐!</div></div></div><div class="seg s" style="margin-bottom:10px"><div class="st">Question</div>'+esc(t.q)+'</div>'
 +ptsBox(t)+'<div style="margin-top:6px;font-size:14px">'+PATS[t.pat]+'</div>'+writeQ("C_"+t.n,tp)+'</div>';
 return h}}))});

/* ---------- build */
function build(){
 REG=[];
 document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header><nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">MrIkromov’s IELTS · Instagram @ustoz_jasur · Telegram @TeamMrIkromov</div><div id="toast"></div>';
 const st=$("#steps"),mn=$("#main");
 steps.forEach((s,si)=>{
  const b=document.createElement("button");b.className="step";b.id="st"+si;b.innerHTML=s.label+'<span class="ct" id="ct'+si+'"></span>';b.onclick=()=>showStep(si);st.appendChild(b);
  const sec=document.createElement("section");sec.id="sec"+si;sec.style.display="none";
  if(s.subnav){
   sec.innerHTML='<div class="sec-title"><span class="n">STEP 4</span><h2>Practice tests · 10 questions</h2></div><p class="lead">Use what you learned. For each question, write one short conclusion (1–2 sentences). Earn a ⭐ for each!</p><div class="nums" id="nv'+si+'"></div><div id="uv'+si+'"></div>';
   mn.appendChild(sec);
   const nv=$("#nv"+si,sec),uv=$("#uv"+si,sec);
   s.units.forEach((u,ui)=>{const nb=document.createElement("button");nb.className="sub";nb.id="u"+si+"_"+ui;nb.textContent=ui+1;nb.onclick=()=>showUnit(si,ui);nv.appendChild(nb);const bx=document.createElement("div");bx.innerHTML=u.html();bx.style.display="none";u.box=bx;uv.appendChild(bx)});
  }else{sec.innerHTML=s.html();mn.appendChild(sec)}
 });
 wire();applyState()}
function showStep(si){ST.step=si;steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});if(steps[si].subnav)showUnit(si,Math.min(ST.unit[si]||0,steps[si].units.length-1));window.scrollTo({top:0});save()}
function showUnit(si,ui){ST.unit[si]=ui;steps[si].units.forEach((u,k)=>{u.box.style.display=k===ui?"":"none";$("#u"+si+"_"+k).classList.toggle("on",k===ui)});save()}
function stepKeys(si){const root=$("#sec"+si);return $$("[data-key]",root).map(e=>e.dataset.key).filter((v,i,a)=>a.indexOf(v)===i&&REG.some(r=>r.key===v))}
function progress(){let tot=REG.length,done=REG.filter(r=>ST.ok[r.key]).length;$("#pbar").style.width=Math.round(done/tot*100)+"%";$("#pnum").textContent=done+" / "+tot+" done";
 steps.forEach((s,si)=>{const ks=stepKeys(si),d=ks.filter(k=>ST.ok[k]).length;const c=$("#ct"+si);if(c){c.textContent=ks.length?d+"/"+ks.length:"";$("#st"+si).classList.toggle("full",ks.length>0&&d===ks.length)}});stars()}
const CHEER=["Great job! 🎉","Excellent! ⭐","You nailed it! 💪","Superb idea! 🚀","Well done! 👏"];
function cheer(){toast(CHEER[Math.floor(Math.random()*CHEER.length)])}
function stars(){let n=0;TOPICS.forEach((t,ui)=>{const a=ST.ok["C_"+t.n];n+=a?1:0;const el=document.getElementById("u3_"+ui);if(el)el.textContent=(ui+1)+(a?" ⭐":"")});const p=document.getElementById("pnum");if(p)p.textContent+="  ·  ⭐ "+n+"/"+TOPICS.length}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function wire(){
 $$("select.sel").forEach(el=>el.addEventListener("change",()=>runSel(el.dataset.key,true)));
 $$("textarea").forEach(ta=>ta.addEventListener("input",()=>{const id=ta.id;if(id.startsWith("ta_")){const k=id.slice(3);ST.saved[k]=ta.value;wc(k)}else{ST.saved[id]=ta.value}save()}));
 document.body.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const k=b.dataset.key,a=b.dataset.act;
  if(a==="hint")$("#hint_"+k).classList.toggle("on");
  if(a==="model")$("#md_"+k).style.display="";
  if(a==="check")runWrite(k);
})}
function wc(k){const ta=$("#ta_"+k),n=nw(ta.value);$("#wc_"+k).textContent=n+" words"}
function runSel(k,say){const r=REG.find(x=>x.key===k),el=$('select[data-key="'+k+'"]'),fb=$("#fb_"+k);if(el.value==="")return;const ok=+el.value===r.ans;el.className="sel "+(ok?"ok":"no");
 const msg=r.fbs?r.fbs[+el.value]:(ok?r.expl:"");
 fb.className="fb on "+(ok?"good":"bad");fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"Correct! ":"Not quite. ")+'</span></div><div class="body">'+esc(msg||"")+'</div>';
 ST.saved[k]=el.value;if(ok){ST.ok[k]=1}else delete ST.ok[k];if(say)save();progress()}
function runWrite(k){const r=REG.find(x=>x.key===k),ta=$("#ta_"+k);if(!ta.value.trim()){toast("Write your conclusion first");return}
 const res=checkBody(ta.value,r.tp),fb=$("#fb_"+k);fb.className="fb on "+res.v;fb.innerHTML=fbHTML(res,"Well done! This is a clear conclusion.");ta.className=res.v==="good"?"ok":(res.v==="bad"?"no":"");
 if(res.v!=="bad"){if(!ST.ok[k])cheer();ST.ok[k]=1;$("#dn_"+k).textContent="✓ done";$("#md_"+k).style.display=""}else{delete ST.ok[k];$("#dn_"+k).textContent=""}
 save();progress()}
function applyState(){
 REG.forEach(r=>{if(r.kind==="sel"){const v=ST.saved[r.key];if(v==null)return;const el=$('select[data-key="'+r.key+'"]');el.value=v;runSel(r.key,false)}
  else if(r.kind==="write"){const v=ST.saved[r.key];if(v==null)return;const ta=$("#ta_"+r.key);ta.value=v;wc(r.key);{const pv=ST.saved["pl_"+r.key],pe=$("#pl_"+r.key);if(pv!=null&&pe)pe.value=pv}if(ST.ok[r.key])$("#dn_"+r.key).textContent="✓ done"}
});
 showStep(Math.min(ST.step||0,steps.length-1));progress()}
build();window.__T=TOPICS;window.runWrite=runWrite;
})();

</script>
</body>
</html>
