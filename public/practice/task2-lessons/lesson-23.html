<style>

:root{

}
:root[data-theme="dark"]{

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:19px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}

.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- band ---- */
.band{color:#fff;background:var(--band);background-image:linear-gradient(115deg,var(--band) 0%,#1f6fae 55%,#1a9bb5 100%);border-radius:0 0 28px 28px;padding:22px 0 20px}
.band .kick{font-size:15.3px;font-weight:800;opacity:.9;letter-spacing:.02em}
.band h1{margin:6px 0 6px;font-size:33px;line-height:1.15;font-weight:600}
.band p{margin:0;max-width:760px;font-size:17.7px;opacity:.92}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1;max-width:360px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:999px;transition:width .4s}

/* ---- step menu ---- */
.steps{position:sticky;top:0;z-index:20;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}

.step .ct{font-size:14.2px;color:var(--mist);font-weight:700}
.step.on{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.step.on .no{background:rgba(255,255,255,.22)}.step.on .ct{color:inherit;opacity:.85}

main{padding:20px 0 40px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}

/* ---- charts ---- */
svg.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--gtext);font-size:13px;font-family:"Nunito Sans",system-ui,sans-serif}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .lbl{font-size:13.6px;font-weight:800;font-family:"Nunito Sans",system-ui,sans-serif}
.chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.3s ease-out forwards}

.chart .key{font-size:13.6px;font-weight:700;fill:var(--paper);font-family:"Nunito Sans",system-ui,sans-serif}

/* ---- graph exercise cards ---- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.gcard .gt{font-weight:800;font-size:17.7px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gcard .gt i{font-style:normal;font-size:13px;font-weight:800;background:var(--panel2);color:var(--mist);border-radius:8px;padding:2px 7px}
.gcard .gt span{font-weight:600;color:var(--mist);font-size:15.3px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-size:17.7px;margin-bottom:8px}
.q .p .num{font-weight:800;color:var(--brass);margin-right:6px}
.q .p .tg{display:inline-block;font-size:13px;font-weight:800;background:var(--chipS);color:var(--chipSt);border-radius:8px;padding:1px 7px;margin-right:4px}
.q .p .sm{font-size:15.3px;color:var(--mist)}
.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:17.1px;margin-bottom:6px}
.wk .l{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}
select.sel{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--paper);min-width:150px}
select.sel.ok{border-color:var(--sage);background:var(--sageT)}select.sel.no{border-color:var(--coral);background:var(--coralT)}

/* ---- input + coach ---- */
.iw{margin-top:6px}
.iw .lab{font-size:14.2px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}
textarea{width:100%;font:inherit;font-size:18.9px;line-height:1.5;color:var(--paper);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:62px;outline:none}
textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:8px 16px;font-weight:800;font-size:16.5px;background:var(--brass);color:var(--onbrass)}
.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:17.7px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:14.8px;color:var(--mist)}
.done-tag{font-size:14.8px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:16.5px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.fb.on{display:block}
.fb .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px}
.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:14.2px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:17.7px;line-height:1.7;margin-bottom:6px}
.ann mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--amber)}
.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:13.6px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:17.1px}
.it .k{display:inline-block;font-size:13px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}
.tryit{margin-top:3px;font-weight:800;color:var(--sage)}
.why{margin-top:2px;color:var(--mist);font-size:15.9px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:17.1px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.blockbar .score{font-weight:800;color:var(--dim);font-size:16.5px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.foot{color:var(--mist);font-size:14.8px;text-align:center;padding:10px 18px 30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);font-weight:800;border-radius:14px;padding:9px 16px;transition:.25s;pointer-events:none;z-index:50}

  .two,.ggrid,.mist{grid-template-columns:1fr}

}
@media print{.steps,.irow,.blockbar,.nextbar{display:none}.sec{display:block!important}}

.gimg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.gimg img{max-width:100%;height:auto;max-height:340px}
.ovl{display:grid;grid-template-columns:1fr;gap:16px}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.ovc .gt{font-weight:800;font-size:17.7px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

<body>
<script>
(function(){
const CH={id:"wt2-l23-body-two-part",kicker:"Writing Task 2 · Lesson 23 · Two-part question body paragraphs",title:'How to write <span style="color:#ffd27a">strong body paragraphs</span> for two-part questions',
lead:"Learn from your teacher’s own sample essays: write one paragraph for the reasons and one for your position, with fully developed ideas. Then practise on 10 questions."};
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];

const TOPICS=[{"n": 1, "q": "In their advertising, businesses nowadays usually emphasize that their products are new in some way. Why is this? Do you think it is a positive or negative development?", "rea": ["Consumer appeal → shoppers link the word new with better quality → they choose these products over older ones", "Fierce competition → many similar products fill the shelves → the label new helps one product stand out"], "pos": ["Overconsumption → constant novelty makes belongings feel outdated → people replace items that still work", "Environmental damage → more products are made and thrown away → landfills fill up and resources run low"], "m1": "The first reason behind this practice is consumer appeal. Since shoppers tend to link the word new with better quality, products described this way seem more modern and reliable. As a result, customers often choose them over older alternatives. Another major factor is fierce competition. Because many similar products fill the shelves, companies need a point of difference, which means that the label new helps one item stand out from the rest.", "m2": "Despite these reasons, I share the view that stressing novelty is an unfavorable change. The main problem is overconsumption. Since constant novelty makes people's belongings feel outdated, they replace items that still work perfectly well. As a result, a lot of money is wasted. Another concern is damage to the environment. Because more products are made and discarded every year, landfills fill up, which means that natural resources run low."}, {"n": 2, "q": "In today’s world, people spend a lot of money on appearance because they want to look younger. What are the reasons for this? Is this a positive or negative development?", "rea": ["Social pressure → media and society value youthfulness → people fear looking old and buy creams and treatments", "Workplace competition → employers prefer young-looking staff → older workers spend to protect their jobs"], "pos": ["Financial strain → expensive products and treatments drain savings → less money for essentials", "Low self-esteem → people judge themselves by appearance → natural ageing feels like a failure"], "m1": "The most common reason is social pressure. Since the media and society place a high value on youthfulness, many people fear looking old. This is why they buy creams and cosmetic treatments in large quantities. Another driver is competition at work. Because employers often prefer younger-looking staff, older employees feel they must protect their jobs, which in turn pushes them to spend on their looks.", "m2": "In my opinion, this habit is a change for the worse. To begin with, it causes financial strain. Since expensive creams and treatments drain people's savings, they have less money left for essentials such as housing and food. As a result, some even fall into debt. Another problem is low self-esteem. Because people judge themselves by their appearance, natural ageing starts to feel like a failure, which leads to constant dissatisfaction."}, {"n": 3, "q": "Online currencies have become more common in recent years. Why is this the case? Is this a positive or negative development?", "rea": ["Convenience → payments are made instantly from a phone → people prefer them to banks and cash", "Internet access → more people own smartphones → wallets are easy to open and adoption grows"], "pos": ["Lower costs → sending money abroad is cheaper than through banks → ordinary users save on fees", "Financial inclusion → people without bank accounts can use phone wallets → more people join the economy"], "m1": "One key reason is convenience. Since payments can be made instantly from a phone, people no longer need to visit a bank or carry cash. As a result, many users prefer digital money to traditional methods. Another factor is wider internet access. Because more people now own smartphones, opening a digital wallet takes only a few minutes, which means that adoption keeps growing.", "m2": "I would argue that this trend is a positive development. The first benefit is lower costs. Since sending money abroad through digital currencies is much cheaper than using banks, ordinary users save on fees. As a result, families who rely on foreign income keep more of it. Another advantage is financial inclusion. People without bank accounts can still use a phone wallet, which means that they can join the economy."}, {"n": 4, "q": "Today, most people get married and give birth in their thirties rather than when they are younger. What are the reasons for this? Is this a positive or negative development?", "rea": ["Career focus → young adults use their twenties for study and for building a career → marriage waits for a stable job", "Cost of living → housing and weddings are expensive → couples delay until they can afford a family"], "pos": ["Health risks → women who have a first child later face more complications → difficulty conceiving", "Generation gap → parents are older when children grow up → less energy to keep up with them"], "m1": "The primary reason is a focus on careers. Since young adults spend their twenties studying and building a profession, they want a stable job before committing to marriage. As a result, the average age at which people settle down keeps rising. Another factor is the high cost of living. Because housing and weddings are expensive, couples often delay starting a family until they can afford one.", "m2": "Although there are reasons for it, I consider this shift an unfavorable one. The main concern is health. Since women who have a first child later in life face more complications, many struggle to conceive at all. As a result, they may need costly medical treatment. Another drawback is the generation gap. Because parents are older when their children grow up, they have less energy to keep up with them, which can weaken their bond."}, {"n": 5, "q": "Many supermarkets are selling more and more products that are imported from other countries instead of selling food that is locally sourced. Why is this happening? Is this a positive or negative development?", "rea": ["Year-round availability → local crops depend on the season → imports fill the shelves in winter", "Lower prices → farms abroad produce more cheaply → supermarkets share the savings with customers"], "pos": ["Wider choice → shoppers can try exotic fruit and vegetables → diets become more varied", "Stable supply → imports fill the gap after poor local harvests → empty shelves and sudden price rises are avoided"], "m1": "The main reason is year-round availability. Since local crops depend on the season, supermarkets would have empty shelves in winter without imports. As a result, customers can buy the same produce every month. Another driver is lower prices. Because farms abroad can produce food more cheaply, supermarkets share the savings with customers, which means that imported goods attract more buyers.", "m2": "In my view, this trend is a change for the better. First of all, it gives consumers a wider choice. Since shoppers can try exotic fruit and vegetables, their diets become more varied. As a result, they get a broader range of nutrients. Another advantage is a stable supply. Because imports cover for poor local harvests, shortages and price spikes are avoided, which means that families can plan their budgets."}, {"n": 6, "q": "Some people believe that there will be a reduction in air travel in the future. Why might this happen? Do you think that this trend is a positive or negative development?", "rea": ["Environmental awareness → people learn that flights release large emissions → they choose to fly less", "Remote technology → video calls replace business trips → companies spend less and travel less"], "pos": ["Cleaner air → fewer flights release less carbon → global warming slows", "Local tourism → people take holidays near home → spending stays within local economies and jobs are created"], "m1": "One likely reason is growing environmental awareness. Since more people learn that flights release large amounts of emissions, they choose to fly less. As a result, demand for air travel may fall. Another factor is remote technology. Because video calls can replace many business trips, companies spend less and travel less, which means that fewer flights are needed.", "m2": "I believe this would be a positive development. The first advantage is cleaner air. Since fewer flights mean lower carbon emissions, climate change slows down. As a result, future generations inherit a healthier planet. Another benefit is local tourism. Because people holiday closer to home, money stays in local economies, which means that more jobs are created in nearby towns."}, {"n": 7, "q": "More people live alone today than they did in the past. Why is this the case? Do you think this is a positive or negative development?", "rea": ["Financial independence → more people earn good salaries → they can pay for a home of their own and choose privacy", "Changing values → people marry later and prize independence → families expect less from them"], "pos": ["Loneliness → nobody to talk to after work → isolation and low mood", "Weaker ties → people rarely see relatives and neighbors → older people lack care and support"], "m1": "A leading reason is financial independence. Since more people now earn good salaries, they can afford their own homes. As a result, many choose privacy over shared housing. Another factor is changing values. Because people marry later and value independence, there is little pressure to live with relatives, which means that leaving the family home has become normal.", "m2": "I would argue that this is a change for the worse. The main problem is loneliness. Since people who live alone have nobody to talk to after work, they often feel isolated. As a result, low mood becomes common. Another concern is weaker social ties. Because people rarely see relatives and neighbors, older individuals lack care and support, which puts more pressure on public services."}, {"n": 8, "q": "These days some people spend a lot of money on tickets to go to sporting or cultural events. Why do you think this is? Do you think this is a positive or negative development?", "rea": ["Higher incomes → people have more spare money → they pay for experiences rather than objects", "Social media → friends post photos of events → fans fear missing out and pay any price"], "pos": ["Economic boost → money from tickets goes to artists, staff and local shops → jobs are created", "Wellbeing → live events ease stress and build shared memories → people feel happier and closer"], "m1": "One reason is higher incomes. Since people have more spare money, they prefer to spend it on experiences rather than objects. As a result, demand for tickets rises and prices follow. Another factor is social media. Because friends post photos and videos of events, fans fear missing out, which means that they are ready to pay almost any price.", "m2": "In my opinion, this is a change for the better. The first advantage is a boost to the economy. Since ticket sales pay artists, staff and local businesses, many jobs are created. As a result, whole neighborhoods around stadiums and theaters prosper. Another benefit is wellbeing. Because live events relieve stress and create shared memories, people feel happier and more connected."}, {"n": 9, "q": "In many countries, people now wear western clothes such as suits and jeans rather than traditional clothing. What are the reasons for this? Is this a positive or negative development?", "rea": ["Globalization → films, TV and the internet promote western fashion → young people imitate the styles they watch", "Practicality and price → suits and jeans are affordable and simple to wear → they fit hectic urban routines"], "pos": ["Loss of identity → traditional dress carries history → younger generations lose their connection to it", "Damage to local industries → weavers and tailors lose business → traditional skills and jobs vanish"], "m1": "The first reason is globalization. Since films, television and the internet constantly show western fashion, young people copy what they see. As a result, the trend spreads quickly across borders. Another factor is practicality. Because suits and jeans are cheap and easy to wear, they suit busy city lives, which means that more people choose them every day.", "m2": "Personally, I regard this shift as a change for the worse. The main problem is the loss of cultural identity. Since traditional dress carries a nation's history, fewer people wearing it means that younger generations lose their connection to the past. As a result, customs fade. Another concern is damage to local industries. Because weavers and tailors lose customers, craft skills and jobs disappear, which hurts many communities."}, {"n": 10, "q": "Nowadays, internet and television have given ordinary people a chance to become famous. Why is this? Do you think this is a positive or negative development?", "rea": ["Social media platforms → anyone can upload videos at no cost → one clip can reach millions overnight", "Reality TV and talent shows → producers cast ordinary people → relatable faces become stars"], "pos": ["Unrealistic expectations → young people think fame is easy → they neglect studies and fail to build careers", "Mental pressure → public criticism and lost privacy → stress, anxiety and depression"], "m1": "A major reason is social media platforms. Since anyone can post videos for free, a single clip can reach millions of viewers overnight. As a result, ordinary people gain followers very quickly. Another driver is reality television and talent shows. Because producers like to cast ordinary people, audiences see relatable faces, which means that regular individuals can become stars.", "m2": "I am convinced that this is a change for the worse. The first problem is unrealistic expectations. Since fame looks easy online, young people neglect their studies. As a result, many fail to build stable careers. Another concern is mental pressure. Because famous people face public criticism and lose their privacy, they often suffer from stress, which can lead to anxiety and depression."}];

h the position (“Despite these reasons, I share the view that … unfavorable change”) and then gives two points that support it."}, {"src": "Plastic surgery", "q": "An increasing number of people are choosing plastic surgery. Why do people choose to change the way they look? Do you think it is a positive or negative development?", "l1": "Reasons", "l2": "Position", "b1": [["The first reason why more and more people today undergo plastic surgery has to do with the shift in social patterns and trends.", "C"], ["While in the past the definition of beauty in most cultures primarily included personal qualities such as kindness, generosity, and good looks, these days to most people it is only the latter.", "E"], ["This redefined perception of beauty has been relentlessly promoted on social media platforms where so-called “influencers” endorse beauty products and treatments to their followers.", "E"], ["This, in turn, creates an impression among people, especially young ones, that they have to buy those products or register a beauty treatment to meet that very measure of beauty.", "R"], ["The second reason is arguably the fact that plastic surgery is more affordable than ever owing to the advances in technology and treatment processes coupled with improvements in living standards.", "B"], ["Having earned a higher income, more and more people today can afford looks through artificial beautification.", "R"]], "b2": [["In my opinion, more people turning to surgery to enhance their looks can bring more damage than good.", "T"], ["Although it helps some people gain more confidence and turn around their lives, beauty achieved through unnatural means can create a false image of perfection among common people.", "C"], ["This can already be seen in many societies where people admire and give more preference to beauty models who have enlarged their body parts and removed facial imperfections.", "E"], ["Besides, it is entirely possible that such beautification processes can sometimes r place of work.", "R"], ["Secondly, trying new jobs creates chances for personal growth.", "B"], ["People can improve their personal skills such as problem solving and communication when they embark on a new career path.", "E"], ["They also become more open-minded and adaptable in the process of adjusting to a new workplace environment, which is critical to their overall personal growth.", "R"]], "note": "The position can be positive. The topic sentence of Body 2 looks back (“Having shed light on the reasons…”) and then gives the position. “Firstly” and “Secondly” mark the two points."}, {"src": "Getting things done instantly", "q": "Nowadays more and more people want to get things done instantly. Why is it? Do you think it is a positive or negative development?", "l1": "Reasons", "l2": "Position", "b1": [["To start, I believe that there are two main factors underlying people’s desire to get things done fast.", "T"], ["The first and obvious one is modern life and changes that come with it.", "C"], ["To illustrate, increasingly more people today work longer hours to keep up with high living standards.", "E"], ["These people often live with the impression that the only way to keep pace with people around them is to make the most of the time they have by doing the greatest number of things possible.", "R"], ["Advanced technology can be found to be another main culprit.", "B"], ["Technology has come a long way in the past decades, so has the speed at which things are done in many places of work.", "E"], ["In effect, more and more people today find themselves competing against machines that rarely tire and rest.", "R"]], "b2": [["In my mind, it is only a matter of time before this development proves itself to be undesirable.", "T"], ["One apparent problem stemming from the growing urge to get things done faster is a decline in the quality of work.", "C"], ["If people are pressurized to work faster and not allowed to operate at their own pace, they might become less attentive to the rather subtle aspects of their work.", "E"], ["This, in turn, can lead to poor performance and low quality products.", "R"], ["Another long-term effect is likely to be the weakening of social ties.", "B"], ["As people become more speed-driven, they might grow jealous of their time and start spending less of it with family and friends.", "E"]], "note": "Body 1 starts with a topic sentence that promises two factors. Body 2 starts with the position and then names the problems that prove it (“a decline in the quality of work”, “the weakening of social ties”)."}, {"src": "Celebrities and politicians", "q": "Nowadays celebrities earn more money than politicians. What are the reasons for this? Is it a positive or negative development?", "l1": "Reasons", "l2": "Position", "b1": [["When it comes to the chief reason why celebrities like athletes and movie stars are in a better position to make more than politicians, the Internet should be the immediate answer.", "C"], ["The Internet lends celebrities the ability to market themselves in ways that were not simply possible in the past.", "E"], ["Whereas in retrospect TV and in-person events were some of the limited options to commercialize celebrities’ talents, famous people today can reach wider audiences through social media.", "E"], ["This certainly enables them to sign more lucrative deals and endorsement campaigns, thus allowing them to earn significantly more than politicians.", "R"], ["Another obvious reason would be the fact that most politicians are falling out of favor and becoming less credible in the eyes of the common man.", "B"]], "b2": [["I would argue that people should see this trend in a negative light.", "T"], ["Most celebrities are known to lead irresponsible lives, especially when it has to do with money.", "C"], ["Their extravagant lifestyles are indicative of how much they appreciate what they earn.", "E"], ["It is also not uncommon to see them get involved in lesser acts such as drug and alcohol abuse.", "B"], ["These aspects of the issue make one wonder how different the world would be if this money were in the hand of policy-makers.", "R"]], "note": "The position sentence can be short and direct. Notice the two points: reckless spending and drug and alcohol abuse. The paragraph ends by showing what the money could do instead."}], "G": {"picks": [{"src": "Plastic surgery", "arg": "Plastic surgery is more affordable than ever.", "topic": "Body 1 · a reason", "opts": ["The second reason is arguably that plastic surgery is more affordable than ever. Thanks to advances in technology and treatment processes, procedures cost less, and as living standards improve, more people can afford them.", "The second reason is arguably that plastic surgery is more affordable than ever. Affordable surgery is a big reason. Many people choose it because it is affordable.", "The second reason is arguably that plastic surgery is more affordable than ever, which is a terrible change because it creates a false image of perfection.", "The second reason is arguably that plastic surgery is more affordable than ever. My aunt had an operation last year and she paid very little."], "ans": 0, "fb": ["", "The reason is only repeated in new words. Where is the explanation (why) and the result?", "This gives an opinion. Body 1 explains the reasons; your position goes in Body 2.", "A personal story is not an explanation. Say WHY it is cheaper and what follows."]}, {"src": "Children and smartphones", "arg": "Smartphones distract children.", "topic": "Body 2 · a point that supports the position", "opts": ["This is primarily because smartphones can be a source of distraction. Unlimited entertainment pulls children away from their studies and extra-curriculars, so they develop a short attention span, which harms their academic performance.", "This is primarily because smartphones can be a source of distraction. Distraction is a serious issue. Smartphones distract children a lot.", "This is primarily because children enjoy music, games and videos, and schools now welcome electronics in the classroom.", "This is primarily because smartphones can be a source of distraction. I think it is bad and I would never give a phone to my child."], "ans": 0, "fb": ["", "This only repeats the point. Say WHY it happens and what follows.", "This gives reasons for the trend. Body 2 gives points that support your position.", "An opinion or a story does not develop the point. Add the explanation and the result."]}, {"src": "Celebrities and politicians", "arg": "Celebrities spend recklessly.", "topic": "Body 2 · a point that supports the position", "opts": ["Most celebrities are known to lead irresponsible lives, especially with money. Their extravagant lifestyles show how little they value what they earn, so a large part of their income is wasted instead of being put to good use.", "Most celebrities are known to lead irresponsible lives, especially with money. They are irresponsible and spend recklessly.", "Most celebrities earn more because the Internet lets them market themselves and reach wider audiences through social media.", "Most celebrities are irresponsible. I do not like them and I never watch their shows."], "ans": 0, "fb": ["", "This only repeats the point. Say HOW it shows and what follows.", "This explains why celebrities earn more (a reason for Body 1). Body 2 supports the position.", "An opinion is not a developed point. Add the explanation and the result."]}], "w1": {"src": "Alternative energy", "kind": "rea", "tag": "Body 1 · reasons", "q": "Alternative sources of energy such as wind and solar have been encouraged by some countries instead of fossil fuels. Why is this happening? Is this a positive or negative development?", "ch": ["Climate concerns → coal, oil and gas burn and release greenhouse gases → governments want cleaner energy", "Falling costs → wind and solar technology has become cheaper → countries can pay for big projects"], "model": "The first reason is climate concerns. Since burning coal, oil and gas releases large amounts of greenhouse gases, governments want cleaner sources of energy. As a result, they offer support to wind and solar projects. Another factor is falling costs. Because renewable technology has become cheaper, countries can afford large projects, which means that clean energy is now a realistic option."}, "w2": {"src": "Similar cultures", "kind": "pos", "tag": "Body 2 · position", "q": "Modern cultures around the world have become similar compared to the past. Why is this happening? Is this a positive or negative development?", "ch": ["Loss of diversity → local customs, languages and dress disappear → the world grows duller", "Lost heritage → young people abandon local traditions → knowledge of the past is lost"], "model": "I would argue that this is a negative development. The main problem is the loss of diversity. Since local customs, languages and clothing are being replaced by global habits, the world becomes a less interesting place. As a result, travelers find fewer unique experiences. Another concern is lost heritage. Because young people drop local traditions, knowledge from the past disappears, which means that future generations know little about their roots."}}};
/* ---------- checker */
const RSN=/\b(reasons?|factors?|causes?|catalysts?|drivers?|culprits?|explain\w*|why|due to|has to do with|behind|underl\w+|attributed|ascribed|answer)\b/i;
const OPIN=/\b(i (believe|think|feel|consider|regard|would argue|see|personally|tend to think|share the view|am (of the opinion|convinced|certain|sure)|will now explain)|in my (opinion|view|mind)|to my mind|to me|personally)\b/i;
const STANCE=/\b(positive|negative|change for the (better|worse)|favou?rable|unfavou?rable|desirable|undesirable|beneficial|harmful|detrimental|worrying|welcome|more (damage|harm|good) than)\b/i;
const EXPL=/\b(when people|once people|those people|because|since|this is why|due to|in other words|that is|this is|which means|owing to|this can be attributed|more specifically|as it|as they|as the|seeing as|so that|whereas|thanks to|being|while in the past|to illustrate|this certainly|which is why|can already be seen|if people|are indicative of|as people|is known to)\b/i;
const RESU=/\b(has proved|allow for|these problems|in return|as a result|therefore|thus|consequently|this leads|leads to|lead to|this means|which means|in turn|hence|results in|resulting|means that|so they|so it|so that|so the|so people|and this|gives? rise|causing|as such|in this way,|this way,|for this reason|which leads|which makes|which causes|which results|which can|which may|which pushes|which puts|this can|this certainly|thus allowing|in effect|might lead to|very likely to|make one wonder|can create|feel content|which is critical|so )\b/i;
const ADD=/\b(furthermore|further|not only that|the second|moreover|besides|in addition|another|also|what is more|apart from|on top of|one other|finally|firstly|secondly|first|second|next|more concerning)\b/i;
const W=t=>(t.toLowerCase().match(/[a-z']+/g)||[]);
function run(a,b){let best=0;for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)if(a[i]===b[j]){let k=0;while(i+k<a.length&&j+k<b.length&&a[i+k]===b[j+k])k++;if(k>best)best=k}return best}
const chainText=c=>c.replace(/→/g," ");
const stem=s=>[...new Set((s.toLowerCase().match(/[a-z]+/g)||[]).filter(w=>w.length>=5).map(w=>w.slice(0,5)))];
function checkBody5(text,tp){
  const w=W(text),n=w.length,ss=text.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>1);
  const first=ss[0]||"",rest=ss.slice(1).join(" "),pos=tp.kind==="pos";
  const kwList=tp.kw||stem(tp.ch.join(" "));
  const kwHit=kwList.filter(k=>text.toLowerCase().includes(k)).length;
  const cp=Math.max(run(w,W(chainText(tp.ch[0]))),run(w,W(chainText(tp.ch[1]))));
  const hasI=/\b(i|my|we|me|our)\b/i.test(rest);
  const c=[
   pos?{ok:OPIN.test(first)&&STANCE.test(first),crit:1,label:"Topic sentence",bad:"Start Body 2 with your position: “Despite these reasons, I share the view that … is an unfavorable change.”, “In my opinion, … is a change for the worse.”, “I would argue that …”.",good:"Your topic sentence gives your position."}
      :{ok:RSN.test(first)&&!STANCE.test(first),crit:1,label:"Topic sentence",bad:"Start Body 1 by naming the first reason: “The primary reason … is …”, “Arguably, the most common reason why … is …”.",good:"Your topic sentence introduces the reasons."},
   pos?{ok:!RSN.test(first)||STANCE.test(first),crit:1,label:"Position, not reasons",bad:"Body 2 is about your position, not the reasons. Give two points that show why it is positive or negative.",good:"You support your position."}
      :{ok:!STANCE.test(text),crit:1,label:"Reasons only",bad:"Body 1 is only about reasons. Remove words like “positive”, “negative”, “better” and “worse”: your position belongs in Body 2.",good:"Only reasons: correct."},
   {ok:EXPL.test(rest),crit:1,label:"Explain",bad:"Explain WHY: “Since…”, “Because…”, “which means that…”.",good:"You explain."},
   {ok:RESU.test(rest),crit:1,label:"Result",bad:"Show the RESULT: “As a result,…”, “This means that…”, “…, which in turn…”.",good:"You show results."},
   {ok:ADD.test(rest),crit:1,label:"Second idea",bad:"Start your second idea with “Another factor is…”, “Another concern is…” or “Furthermore,…”.",good:"You link to a second idea."},
   {ok:!hasI,crit:1,label:"No “I” after the topic sentence",bad:"Use “I” only in the topic sentence. Write the rest in a neutral voice.",good:"Neutral voice after the topic sentence."},
   {ok:ss.length>=4,crit:1,label:"4+ sentences",bad:"A full body paragraph has two ideas, each explained: about 5–8 sentences.",good:ss.length+" sentences."},
   {ok:cp<9,crit:1,label:"Own words",bad:"You copied "+cp+" words in a row from the ideas. Use your own words.",good:"Written in your own words."},
   {ok:kwHit>=3,crit:1,label:"On idea",bad:"Develop the two ideas shown. Use their key words or synonyms.",good:"Develops the ideas."},
   {ok:n>=45&&n<=190,crit:0,label:"Length",bad:n<45?"A bit short ("+n+" words). A body paragraph is about 70–120 words.":"A bit long ("+n+" words). Aim for 70–120 words.",good:n+" words: a good length."},
   {ok:text.indexOf("→")<0,crit:0,label:"Full sentences",bad:"Replace the arrows with full sentences.",good:"Full sentences."}].filter(x=>!(x.ok&&!x.crit&&!x.bad));
  const crit=c.filter(x=>x.crit),okc=crit.filter(x=>x.ok).length,tips=c.filter(x=>!x.crit&&!x.ok).length;
  return {c,v:okc===crit.length&&tips===0?"good":okc>=crit.length-1?"mid":"bad"}}
function checkBody(t,tp){return checkBody5(t,tp)}
function fbHTML(r,done){
  const vd={good:done||"Well done!",mid:"Nearly there: add the missing move.",bad:"Not yet. Fix the red points and check again."}[r.v];
  return '<div class="hd"><span class="vd">'+vd+'</span><span class="meter">'+r.c.map(x=>'<span class="'+(x.ok?"ok":(x.crit?"no":"tip"))+'">'+(x.ok?"✓ ":"✗ ")+x.label+'</span>').join("")+'</span></div><div class="body">'+
  r.c.filter(x=>!x.ok).map(x=>'<div class="it '+(x.crit?"structure":"style")+'"><div><span class="k">'+(x.crit?"must fix":"tip")+'</span>'+esc(x.bad)+'</div></div>').join("")+
  r.c.filter(x=>x.ok).map(x=>'<div class="it praise"><div><span class="k">ok</span>'+esc(x.good)+'</div></div>').join("")+'</div>'}

let REG=[];
function selQ(key,label,opts,ans,expl,num){

function rng(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
function shuf(a,seed){const r=rng(seed),b=a.map((x,i)=>i);for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function selS(key,label,opts,ans,expl,num){const p=shuf(opts,key);return selQ(key,label,p.map(i=>opts[i]),p.indexOf(ans),expl,num)}

steps.push({label:"1 Learn",html:()=>{
 const e1=EXC[0];

 h+='<div class="card"><h3>3 · The key skill: turn an argument into a developed idea</h3><p class="lead">In your notes an idea is only a few words (“low pay”, “distraction”). A <b>developed idea</b> answers three questions. Reasons and position points use the same pattern.</p><table class="t"><tr><th>Question</th><th>Body 1 · a reason</th><th>Body 2 · a point for your position</th></tr>'
 +'<tr><td><b>What?</b></td><td><b>Claim:</b> The first reason is … · Another major factor is … · … is another main culprit.</td><td><b>Claim:</b> The main problem is … · More concerning is … · Another benefit is …</td></tr>'
 +'<tr><td><b>Why?</b></td><td><b>Explain:</b> Since … · Because … · That is, … · To illustrate, …</td><td><b>Explain:</b> Since … · This is because … · If people …, they might …</td></tr>'
 +'<tr><td><b>So what?</b></td><td><b>Result:</b> As a result, … · This means that … · This, in turn, creates …</td><td><b>Result:</b> As a result, … · This, in turn, can lead to … · …, which is detrimental to …</td></tr></table></div>';
 const LAD=[["Level 1 · Idea only","Affordable surgery.","This is only a claim. A paragraph made of these stays empty."],["Level 2 · + Why","The second reason is arguably the fact that plastic surgery is more affordable than ever owing to the advances in technology and treatment processes coupled with improvements in living standards.","Better: now the reader knows why it is affordable."],["Level 3 · + Result","The second reason is arguably the fact that plastic surgery is more affordable than ever owing to the advances in technology and treatment processes coupled with improvements in living standards. Having earned a higher income, more and more people today can afford looks through artificial beautification.","Fully developed: claim → why → result. This is the real sample (plastic surgery)."]];
 h+='<div class="card"><h3>4 · From an idea to a fully developed reason</h3><p class="lead">One reason from your teacher’s sample essay, built in three levels. A point for your position is built the same way.</p>'+LAD.map((r,i)=>'<div class="seg '+["s","v","n"][i]+'" style="margin:6px 0"><div class="st">'+r[0]+'</div>'+esc(r[1])+'<div style="font-size:14px;margin-top:4px;color:#445">▸ '+esc(r[2])+'</div></div>').join("")+'<div class="note"><b>Rule:</b> every idea needs a <b>Claim</b> and a <b>Why</b>. Strong ideas also show a <b>Result</b>.</div></div>';
 const S1=[["1 · Topic sentence + first reason","Name the first reason in one sentence.","The primary reason … is … · The first reason why … has to do with … · Arguably, the most common reason why … is …"],
 ["2 · Explain","Say why it is a reason.","Since … · Because … · That is, … · To illustrate, …"],
 ["3 · Result","Show what follows.","As a result, … · This, in turn, creates … · This means that …"],
 ["4 · Second reason","Start a new reason with a link. Repeat steps 2–3 in a shorter form.","Another major factor is … · … is also … · … is another main culprit."]];
 const S2=[["1 · Topic sentence","Give your position: positive or negative. This is the only sentence with “I”.","Despite these reasons, I share the view that … · In my opinion, … · I would argue that … · I will now explain why I believe …"],
 ["2 · First point","Name the first point that supports your position.","The main problem is … · This is primarily because … · Firstly, … can help …"],
 ["3 · Explain + result","Say why, then what follows.","Since … · If people …, they might … · As a result, … · This, in turn, can lead to …"],
 ["4 · Second point","Start a new point with a link. Explain it and show the result.","More concerning is … · Another concern is … · Secondly, … · Besides, …"]];
 h+='<div class="card"><h3>5 · Build the paragraphs in order</h3><div class="grp">Body 1 · reasons</div><table class="t"><tr><th>Step</th><th>What you do</th><th>Phrases from the samples</th></tr>'+S1.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join("")+'</table><div class="grp">Body 2 · position</div><table class="t"><tr><th>Step</th><th>What you do</th><th>Phrases from the samples</th></tr>'+S2.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join("")+'</table><div class="grp">Real Body 2 · '+e1.src+'</div>'+cparts(e1.b2)+'<div class="note">'+esc(e1.note)+'</div></div>';

/* ---------- build */
function build(){
 REG=[];
 document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header><nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">MrIkromov’s IELTS · Instagram @ustoz_jasur · Telegram @TeamMrIkromov</div><div id="toast"></div>';
 const st=$("#steps"),mn=$("#main");
 steps.forEach((s,si)=>{
  const b=document.createElement("button");b.className="step";b.id="st"+si;b.innerHTML=s.label+'<span class="ct" id="ct'+si+'"></span>';b.onclick=()=>showStep(si);st.appendChild(b);
  const sec=document.createElement("section");sec.id="sec"+si;sec.style.display="none";
  if(s.subnav){
   sec.innerHTML='<div class="sec-title"><span class="n">STEP 4</span><h2>Practice tests · 10 questions</h2></div><p class="lead">Use what you learned. For each question, write two body paragraphs: the reasons, then your position. Earn a ⭐ for each!</p><div class="nums" id="nv'+si+'"></div><div id="uv'+si+'"></div>';
   mn.appendChild(sec);
   const nv=$("#nv"+si,sec),uv=$("#uv"+si,sec);
   s.units.forEach((u,ui)=>{const nb=document.createElement("button");nb.className="sub";nb.id="u"+si+"_"+ui;nb.textContent=ui+1;nb.onclick=()=>showUnit(si,ui);nv.appendChild(nb);const bx=document.createElement("div");bx.innerHTML=u.html();bx.style.display="none";u.box=bx;uv.appendChild(bx)});
  }else{sec.innerHTML=s.html();mn.appendChild(sec)}
 });
 wire();applyState()}
function showStep(si){ST.step=si;steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});if(steps[si].subnav)showUnit(si,Math.min(ST.unit[si]||0,steps[si].units.length-1));window.scrollTo({top:0});save()}
function showUnit(si,ui){ST.unit[si]=ui;steps[si].units.forEach((u,k)=>{u.box.style.display=k===ui?"":"none";$("#u"+si+"_"+k).classList.toggle("on",k===ui)});save()}
function stepKeys(si){const root=$("#sec"+si);return $$("[data-key]",root).map(e=>e.dataset.key).filter((v,i,a)=>a.indexOf(v)===i&&REG.some(r=>r.key===v))}
function progress(){let tot=REG.length,done=REG.filter(r=>ST.ok[r.key]).length;$("#pbar").style.width=Math.round(done/tot*100)+"%";$("#pnum").textContent=done+" / "+tot+" done";
 steps.forEach((s,si)=>{const ks=stepKeys(si),d=ks.filter(k=>ST.ok[k]).length;const c=$("#ct"+si);if(c){c.textContent=ks.length?d+"/"+ks.length:"";$("#st"+si).classList.toggle("full",ks.length>0&&d===ks.length)}});stars()}
const CHEER=["Great job! 🎉","Excellent! ⭐","You nailed it! 💪","Superb idea! 🚀","Well done! 👏"];
function cheer(){toast(CHEER[Math.floor(Math.random()*CHEER.length)])}
function stars(){let n=0;TOPICS.forEach((t,ui)=>{const a=ST.ok["B1_"+t.n]&&ST.ok["B2_"+t.n];n+=a?1:0;const el=document.getElementById("u3_"+ui);if(el)el.textContent=(ui+1)+(a?" ⭐":"")});const p=document.getElementById("pnum");if(p)p.textContent+="  ·  ⭐ "+n+"/"+TOPICS.length}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function wire(){
 $$("select.sel").forEach(el=>el.addEventListener("change",()=>runSel(el.dataset.key,true)));
 $$("textarea").forEach(ta=>ta.addEventListener("input",()=>{const id=ta.id;if(id.startsWith("ta_")){const k=id.slice(3);ST.saved[k]=ta.value;wc(k)}else{ST.saved[id]=ta.value}save()}));
 document.body.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const k=b.dataset.key,a=b.dataset.act;
  if(a==="hint")$("#hint_"+k).classList.toggle("on");
  if(a==="model")$("#md_"+k).style.display="";
  if(a==="check")runWrite(k);
})}
function wc(k){const ta=$("#ta_"+k),n=nw(ta.value);$("#wc_"+k).textContent=n+" words"}
function runSel(k,say){const r=REG.find(x=>x.key===k),el=$('select[data-key="'+k+'"]'),fb=$("#fb_"+k);if(el.value==="")return;const ok=+el.value===r.ans;el.className="sel "+(ok?"ok":"no");
 const msg=r.fbs?r.fbs[+el.value]:(ok?r.expl:"");
 fb.className="fb on "+(ok?"good":"bad");fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"Correct! ":"Not quite. ")+'</span></div><div class="body">'+esc(msg||"")+'</div>';
 ST.saved[k]=el.value;if(ok){ST.ok[k]=1}else delete ST.ok[k];if(say)save();progress()}
function runWrite(k){const r=REG.find(x=>x.key===k),ta=$("#ta_"+k);if(!ta.value.trim()){toast("Write your paragraph first");return}
 const res=checkBody(ta.value,r.tp),fb=$("#fb_"+k);fb.className="fb on "+res.v;fb.innerHTML=fbHTML(res,"Well done! This is a developed body paragraph.");ta.className=res.v==="good"?"ok":(res.v==="bad"?"no":"");
 if(res.v!=="bad"){if(!ST.ok[k])cheer();ST.ok[k]=1;$("#dn_"+k).textContent="✓ done";$("#md_"+k).style.display=""}else{delete ST.ok[k];$("#dn_"+k).textContent=""}
 save();progress()}
function applyState(){
 REG.forEach(r=>{if(r.kind==="sel"){const v=ST.saved[r.key];if(v==null)return;const el=$('select[data-key="'+r.key+'"]');el.value=v;runSel(r.key,false)}
  else if(r.kind==="write"){const v=ST.saved[r.key];if(v==null)return;const ta=$("#ta_"+r.key);ta.value=v;wc(r.key);{const pv=ST.saved["pl_"+r.key],pe=$("#pl_"+r.key);if(pv!=null&&pe)pe.value=pv}if(ST.ok[r.key])$("#dn_"+r.key).textContent="✓ done"}
});
 showStep(Math.min(ST.step||0,steps.length-1));progress()}
build();window.__T=TOPICS;window.runWrite=runWrite;
})();
