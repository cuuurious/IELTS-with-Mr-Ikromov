<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing Task 2 · Lesson 2 · Developing Ideas · MrIkromov's IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Writing Lab — shared look for every chapter (2026-11-07).
   Same colours, shapes and fonts as ieltswithmrikromov.com:
   lapis-to-turquoise band, Unbounded headings, Nunito Sans text,
   rounded rectangles only (12 / 14 / 20 / 28 px), one saffron button. */
:root{
  --ink:#f6f5f1;--panel:#fff;--panel2:#efede6;--line:#e3dfd4;--paper:#17213a;--dim:#3a4560;--mist:#55607a;
  --brass:#2456b0;--onbrass:#fff;--sage:#13807c;--sageT:#e2f2f0;--coral:#b23a48;--coralT:#f8e1e4;--amber:#9a5b12;--amberT:#fbefd9;
  --saffron:#e6a33a;--onsaffron:#17213a;--band:#22489a;
  --chipS:#dfe8fb;--chipSt:#1f4aa0;--chipV:#fbe0e6;--chipVt:#a02a44;--chipL:#fdf0d2;--chipLt:#8a5a0c;--chipN:#dcf3ef;--chipNt:#0f6b66;
  --mark:#fff2b3;--shadow:0 1px 2px rgba(23,33,58,.06),0 6px 18px -10px rgba(23,33,58,.18);
  --gUp:#13807c;--gDown:#b23a48;--gMix:#1f3a75;--g2:#c4622d;--grid:#e8e4da;--gtext:#55607a;
}
:root[data-theme="dark"]{
  --ink:#0f1626;--panel:#172036;--panel2:#1e2944;--line:#2b3858;--paper:#eef0f6;--dim:#c6ccda;--mist:#a3abbf;
  --brass:#7fa6f2;--onbrass:#0f1626;--sage:#7fd6d2;--sageT:#123a3c;--coral:#f29aa6;--coralT:#3e1c22;--amber:#f2c07a;--amberT:#3a2a12;
  --saffron:#f0b95a;--band:#1b3570;
  --chipS:#22335c;--chipSt:#b9cdf7;--chipV:#4a2230;--chipVt:#f5b8c6;--chipL:#453512;--chipLt:#f6d48b;--chipN:#153f3d;--chipNt:#9de3dc;
  --mark:#5a4a12;--shadow:none;
  --gUp:#5fd0c6;--gDown:#f08a99;--gMix:#a9bdf0;--g2:#f2a76b;--grid:#2b3858;--gtext:#a3abbf;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:19px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Unbounded,"Nunito Sans",system-ui,sans-serif;letter-spacing:-.01em}
b,strong{font-weight:800}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- band ---- */
.band{color:#fff;background:var(--band);background-image:linear-gradient(115deg,var(--band) 0%,#1f6fae 55%,#1a9bb5 100%);border-radius:0 0 28px 28px;padding:22px 0 20px}
.band .kick{font-size:15.3px;font-weight:800;opacity:.9;letter-spacing:.02em}
.band h1{margin:6px 0 6px;font-size:33px;line-height:1.15;font-weight:600}
.band p{margin:0;max-width:760px;font-size:17.7px;opacity:.92}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1;max-width:360px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:999px;transition:width .4s}
.prog b{font-size:16.5px;white-space:nowrap}

/* ---- step menu ---- */
.steps{position:sticky;top:0;z-index:20;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.steps .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.steps .row::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:800;font-size:16.5px}
.step .no{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--panel2);font-size:14.2px}
.step .ct{font-size:14.2px;color:var(--mist);font-weight:700}
.step.on{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.step.on .no{background:rgba(255,255,255,.22)}.step.on .ct{color:inherit;opacity:.85}
.step.full .ct{color:var(--sage)}.step.on.full .ct{color:inherit}

main{padding:20px 0 40px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.sec-title h2{margin:0;font-size:24.8px;font-weight:600}
.sec-title .n{font-family:Unbounded,sans-serif;font-size:15.3px;color:var(--brass);font-weight:600}
.lead{color:var(--dim);margin:0 0 14px;font-size:17.7px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card h3{margin:0 0 4px;font-size:18.9px;font-weight:600}
.card .ins{color:var(--dim);font-size:16.5px;margin-bottom:12px}
.note{border-radius:14px;background:var(--panel2);padding:12px 14px;font-size:17.1px;color:var(--dim);margin:0 0 16px}
.note b{color:var(--paper)}

/* ---- sub menu (structures, drills) ---- */
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sub{border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:6px 11px;font-weight:800;font-size:15.3px;display:flex;gap:6px;align-items:center}
.sub small{color:var(--mist);font-weight:700}
.sub.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass)}
.sub.full small{color:var(--sage)}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nums .sub{min-width:42px;justify-content:center;font-family:Unbounded,sans-serif;font-weight:600}
.nums .sub.seen:not(.on){background:var(--panel2)}

/* ---- learn panel ---- */
.lhd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lhd .big{font-family:Unbounded,sans-serif;font-size:35.4px;font-weight:600;color:var(--brass);line-height:1}
.lhd h3{font-size:20.1px;margin:0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.chip{border-radius:12px;padding:4px 10px;font-weight:800;font-size:16.5px;white-space:pre}
.chip.s{background:var(--chipS);color:var(--chipSt)}.chip.v{background:var(--chipV);color:var(--chipVt)}
.chip.l{background:var(--chipL);color:var(--chipLt)}.chip.n{background:var(--chipN);color:var(--chipNt)}
.chip.p{padding:4px 2px;color:var(--mist)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:14.8px;color:var(--mist);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.eg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:17.7px}
.eg .tg{flex:0 0 auto;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);background:var(--panel2);border-radius:8px;padding:2px 7px;height:fit-content;margin-top:2px}
.eg.real .tg{background:var(--sageT);color:var(--sage)}
.eg b{background:var(--chipL);color:var(--chipLt);border-radius:6px;padding:0 3px}
.rule,.trap{border-radius:14px;padding:11px 13px;font-size:17.1px;margin-top:10px}
.rule{background:var(--sageT)}.rule>b:first-child{color:var(--sage)}
.trap{background:var(--coralT)}.trap>b:first-child{color:var(--coral)}
.trap s{color:var(--coral)}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.gcap{font-size:15.3px;color:var(--mist);margin:6px 2px 0}
.gmodel{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:17.1px;margin-top:8px}
.replay{margin-top:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:5px 11px;font-weight:800;font-size:15.3px}
.yourturn{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.yourturn h4{margin:0 0 8px;font-size:17.7px;color:var(--sage)}

table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:17.1px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.t th{text-align:left;background:var(--panel2);padding:9px 12px;font-weight:800}
.t td{padding:9px 12px;border-top:1px solid var(--line)}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mist .x,.mist .v{border-radius:14px;padding:10px 12px;font-size:17.1px}
.mist .x{background:var(--coralT)}.mist .x s{color:var(--coral)}
.mist .v{background:var(--sageT)}

/* ---- charts ---- */
svg.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--gtext);font-size:13px;font-family:"Nunito Sans",system-ui,sans-serif}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .lbl{font-size:13.6px;font-weight:800;font-family:"Nunito Sans",system-ui,sans-serif}
.chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.3s ease-out forwards}
@keyframes dl{to{stroke-dashoffset:0}}
.chart .key{font-size:13.6px;font-weight:700;fill:var(--paper);font-family:"Nunito Sans",system-ui,sans-serif}

/* ---- graph exercise cards ---- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.gcard .gt{font-weight:800;font-size:17.7px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gcard .gt i{font-style:normal;font-size:13px;font-weight:800;background:var(--panel2);color:var(--mist);border-radius:8px;padding:2px 7px}
.gcard .gt span{font-weight:600;color:var(--mist);font-size:15.3px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-size:17.7px;margin-bottom:8px}
.q .p .num{font-weight:800;color:var(--brass);margin-right:6px}
.q .p .tg{display:inline-block;font-size:13px;font-weight:800;background:var(--chipS);color:var(--chipSt);border-radius:8px;padding:1px 7px;margin-right:4px}
.q .p .sm{font-size:15.3px;color:var(--mist)}
.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:17.1px;margin-bottom:6px}
.wk .l{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}
select.sel{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--paper);min-width:150px}
select.sel.ok{border-color:var(--sage);background:var(--sageT)}select.sel.no{border-color:var(--coral);background:var(--coralT)}

/* ---- input + coach ---- */
.iw{margin-top:6px}
.iw .lab{font-size:14.2px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}
textarea{width:100%;font:inherit;font-size:18.9px;line-height:1.5;color:var(--paper);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:62px;outline:none}
textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:8px 16px;font-weight:800;font-size:16.5px;background:var(--brass);color:var(--onbrass)}
.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:17.7px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:14.8px;color:var(--mist)}
.done-tag{font-size:14.8px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:16.5px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.fb.on{display:block}
.fb .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px}
.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:14.2px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:17.7px;line-height:1.7;margin-bottom:6px}
.ann mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--amber)}
.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:13.6px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:17.1px}
.it .k{display:inline-block;font-size:13px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}
.tryit{margin-top:3px;font-weight:800;color:var(--sage)}
.why{margin-top:2px;color:var(--mist);font-size:15.9px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:17.1px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.blockbar .score{font-weight:800;color:var(--dim);font-size:16.5px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.foot{color:var(--mist);font-size:14.8px;text-align:center;padding:10px 18px 30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);font-weight:800;border-radius:14px;padding:9px 16px;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .band{padding:16px 0 16px;border-radius:0 0 20px 20px}
  .band h1{font-size:26px}
  .band p{font-size:16.5px}
  .two,.ggrid,.mist{grid-template-columns:1fr}
  .card{padding:14px}
  .step{padding:7px 11px;font-size:15.3px}
  .sec-title h2{font-size:21.2px}
  .chip{font-size:15.3px}
}
@media print{.steps,.irow,.blockbar,.nextbar{display:none}.sec{display:block!important}}

.gimg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.gimg img{max-width:100%;height:auto;max-height:340px}
.ovl{display:grid;grid-template-columns:1fr;gap:16px}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.ovc .gt{font-weight:800;font-size:17.7px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ovc .gt i{font-style:normal;font-size:14.2px;font-weight:800;background:var(--brass);color:var(--onbrass);border-radius:8px;padding:2px 9px}
.ovc .gt span{font-weight:600;color:var(--mist);font-size:14.8px}
.iw+.iw{margin-top:12px}
.iw .lab.s0{color:var(--brass)}.iw .lab.s1{color:#6d4bc2}.iw .lab.s2{color:var(--amber)}.iw .lab.s3{color:var(--sage)}
:root[data-theme="dark"] .iw .lab.s1{color:#c3b0f5}
.clue{font-size:15.9px;color:var(--dim);margin:6px 0 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 12px}
.three .card{margin:0}
.phg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phg .card{margin:0}
.sub-h{font-size:18.9px;margin:18px 0 8px}
.sent{border-radius:14px;padding:12px 14px;font-size:17.7px}
.sent .st{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.sent.s1{background:var(--chipS);border:1px solid color-mix(in srgb,var(--chipSt) 35%,transparent)}.sent.s1 .st{color:var(--chipSt)}
mark.t{background:var(--mark);color:inherit;border-radius:5px;padding:0 3px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);margin:6px 0 12px;border-radius:12px;overflow:hidden;font-size:14.8px;font-weight:800;text-align:center;color:#fff}
.scale span{padding:7px 2px}.scale span:nth-child(1){background:#7aa7b0}.scale span:nth-child(2){background:#4f98a6}.scale span:nth-child(3){background:#2f7f8e}.scale span:nth-child(4){background:#1f6573}.scale span:nth-child(5){background:#134a58}
.fstack{display:grid;gap:8px;margin:0 0 12px}
.fs{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px}
.fs>b{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:var(--brass);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Unbounded,sans-serif}
.fs .ff{font-weight:800;font-size:17.1px}.fs .fe{font-size:17.7px}
.fstack.small .fs{padding:7px 12px}.fstack.small .fs>b{width:26px;height:26px;font-size:14.2px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.fc{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;font-size:15.3px;display:flex;gap:8px;align-items:flex-start}
.fc b{flex:0 0 auto;background:var(--brass);color:#fff;border-radius:7px;padding:0 7px;font-family:Unbounded,sans-serif;font-size:14.2px}
.rule{background:var(--panel2)}
.gapgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.q.g .p{line-height:2.1}
input.gap{font:inherit;border:0;border-bottom:2px solid var(--line);background:transparent;color:inherit;text-align:center;padding:0 2px;margin:0 3px;outline:none;border-radius:4px 4px 0 0}
input.gap:focus{border-bottom-color:var(--brass);background:var(--panel2)}
input.gap.ok{border-bottom-color:var(--sage);background:var(--sageT)}
input.gap.no{border-bottom-color:var(--coral);background:var(--coralT)}
@media (max-width:760px){.three,.phg,.gapgrid{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr 1fr}}
.seg{border-radius:14px;padding:11px 14px;font-size:17.7px;margin:0 0 8px;border:1px solid var(--line);background:var(--panel)}
.seg .st{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.seg.l{background:var(--chipL)}.seg.l .st{color:var(--chipLt)}
.seg.s{background:var(--chipS)}.seg.s .st{color:var(--chipSt)}
.seg.n{background:var(--chipN)}.seg.n .st{color:var(--chipNt)}
.seg.v{background:var(--chipV)}.seg.v .st{color:var(--chipVt)}

.seg.p{background:#efe6f7}.seg.p .st{color:#6b3fa0}.seg textarea{width:100%;box-sizing:border-box}
select.sel{max-width:100%;width:100%;white-space:normal}</style>

<body>
<script>
(function(){
const CH={id:"wt2-l02-develop",kicker:"Writing Task 2 · Lesson 2 · Developing ideas",title:'How body paragraphs are <span style="color:#ffd27a">organized, expanded and supported</span>',
lead:"Learn from your teacher’s own sample essays how a paragraph is built, how one idea grows, and how examples are given. Then practise on 10 questions."};
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const TOPICS=[{"n": 1, "tn": 41, "q": "Some people believe that it is the responsibility of individuals to take care of their own health and diet. Others, however, believe that governments should ensure that their citizens have a healthy diet. Discuss both views and give your opinion.", "main": "who is responsible for people's diet and health", "ch": [["Individuals", "People decide what they eat every day → nobody else controls their daily choices → so responsibility lies with them"], ["Individuals", "Government control limits freedom → a “nanny state” is unpopular → so adults should be trusted to choose"], ["Governments", "Poor people buy cheap, unhealthy food → healthy food is expensive or hard to find → so governments must act"], ["Governments", "Public health costs everyone → obesity and diabetes overload hospitals → so taxes on junk food and rules on advertising help"]], "ex": ["Parents setting habits for life", "Fears of further restrictions on pleasures", "Fast-food outlets and vending machines in schools"], "kw": ["choic", "contr", "daily", "decid", "nobod", "respo"], "model": "To start, I believe that individuals are ultimately responsible for their own diet. This is because nobody except the person themselves controls what goes on their plate every day, whether they cook at home or order takeaway. As a result, even the best public campaigns have little effect unless people choose to change their habits. Parents setting habits for life is a good case in point: children who are taught to enjoy vegetables at home usually keep doing so as adults, without any help from the government.", "sec": "Besides, strict government control over food can limit personal freedom. Many adults dislike being told what to eat, and a so-called nanny state is rarely popular. For this reason, it is wiser to trust adults to make their own choices, as they do in every other part of their lives.", "ex4": [[3, "A person choosing a salad or a burger at lunch"], [3, "An adult told what he may order in a restaurant"], [2, "A low-income family choosing the cheapest meal"], [1, "Countries that tax sugary drinks, such as the UK or Mexico"]], "p2": "On the other hand, governments should play an active role in protecting public diets. This is because low-income families often buy the cheapest food, which is usually unhealthy, while fresh and nutritious products are expensive or hard to find in their area. As a result, only state action such as subsidies or price controls can make healthy eating a realistic option for everyone. For instance, a family on a tight budget will choose a cheap burger meal over fresh vegetables unless the state changes the price. Besides, public health affects every taxpayer. Obesity and diabetes fill hospital beds and drain public money, which means that taxes on junk food and tighter rules for advertisers protect everyone, as countries like the UK and Mexico have shown with sugary drinks.", "kw1": ["adult", "choic", "choos", "contr", "every", "freed", "gover", "limit", "nanny", "nobod", "respo", "state", "trust"], "kw2": ["adver", "cheap", "diabe", "every", "expen", "gover", "healt", "hospi", "obesi", "publi", "rules", "taxes", "unhea"]}, {"n": 2, "tn": 42, "q": "Some people believe that children should start school at a very early age, while others think they should not go to school until they are older. Discuss both views and give your own opinion.", "main": "the best age to start school", "ch": [["Early start", "Young children learn quickly → early learning builds language and numbers → so they get a head start at school"], ["Early start", "Working parents need childcare → schools help families → so parents can work"], ["Late start", "Children need time to play → play develops creativity and social skills → so they have a happier childhood"], ["Late start", "Children mature at different speeds → pushing them early causes stress → so they may lose interest in learning"]], "ex": ["Stories, rhymes and conversation", "Studies in the United States and Britain", "Making friends before formal lessons"], "kw": ["build", "child", "early", "langu", "learn", "numbe", "quick", "schoo", "start", "young"], "model": "Firstly, starting school at an early age gives children a valuable head start. This is because young children learn language and numbers remarkably quickly, so stories, rhymes and conversation in the classroom can lay a strong foundation for later learning. As a result, those who begin early arrive at primary school already familiar with letters and counting. For instance, studies in the United States and Britain suggest that children who attended early programs tend to read more fluently in later years.", "sec": "Another benefit is that early schooling supports working families. Many parents need somewhere safe for their children during the day, and a school place provides exactly that. As a result, parents are able to go to work without worrying about childcare.", "ex4": [[5, "Studies on early learning"], [3, "A mother who can return to work because school looks after her child"], [1, "Finland, where formal lessons start at seven"], [4, "A classmate who started school too early and struggled"]], "p2": "In contrast, I believe children should begin school later, because they need time to play. Play is not a waste of time: through games, young children develop creativity and learn to share and cooperate with others. This leads to a happier childhood and better social skills later in life. For example, in Finland children begin formal lessons at the age of seven and still perform very well. Besides, children mature at different speeds. Forcing a small child to sit in a classroom can cause stress, and this may make some pupils lose interest in learning altogether.", "kw1": ["child", "early", "famil", "langu", "learn", "numbe", "paren", "quick", "schoo", "start", "worki", "young"], "kw2": ["cause", "child", "creat", "devel", "diffe", "happi", "inter", "learn", "matur", "skill", "socia", "speed", "stres"]}, {"n": 3, "tn": 44, "q": "Films and computer games containing violence are popular. Some people believe that they negatively affect society and should be banned, while others consider them harmless forms of relaxation. Discuss both views and give your opinion.", "main": "violence in films and computer games", "ch": [["Harmful and should be banned", "Violent content makes viewers used to violence → violence seems normal → so aggression increases"], ["Harmful and should be banned", "Children may imitate games and films → they do not separate fiction from reality → so real people get hurt"], ["Harmless relaxation", "Most viewers know it is fiction → watching violence does not turn them violent → so it is only entertainment"], ["Harmless relaxation", "A ban is unrealistic → content moves online and abroad → so age ratings and parental control work better"]], "ex": ["Children copying fighting moves", "Short-term rises in aggressive thoughts", "Children obtaining adult games"], "kw": ["aggre", "conte", "desen", "norma", "seems", "viewe", "viole"], "model": "Some argue that violent films and games should be banned since they desensitize viewers. When people watch violence for hours, it begins to look normal and unremarkable, and aggressive behavior may start to seem acceptable. In turn, this could lead to more aggression in real life. For example, researchers have recorded short-term rises in aggressive thoughts among teenagers after playing violent games.", "sec": "Besides, children may imitate what they see on the screen. Because young viewers cannot always separate fiction from reality, they may copy fighting moves in the playground, and this can lead to real harm. Children copying fighting moves is a worrying example.", "ex4": [[5, "Research linking violent games and aggressive thoughts"], [2, "A child copying fighting moves from a film"], [3, "A man who plays a shooting game after work and stays calm"], [2, "Children getting adult games online despite age limits"]], "p2": "I, however, share the view that violent films and games are mostly harmless relaxation. Most viewers know perfectly well that what they see on screen is fiction, so watching a fight scene does not turn them into violent people. It is simply entertainment, in the same way as a thriller novel. For example, a man who plays a shooting game after a stressful day at work usually feels calmer, not angrier. Besides, a ban would be unrealistic. Content would simply move online or abroad, which means that age ratings and parental control are a far better answer than prohibition.", "kw1": ["aggre", "child", "ficti", "films", "games", "imita", "norma", "reali", "separ", "viewe", "viole"], "kw2": ["abroa", "bette", "conte", "contr", "enter", "ficti", "onlin", "paren", "ratin", "unrea", "viewe", "viole", "watch"]}, {"n": 4, "tn": 46, "q": "Some people believe that children who commit crimes should be punished, while others think that their parents should be punished instead. Discuss both views and give your opinion.", "main": "punishing children or parents for children's crimes", "ch": [["Children punished", "Children know right from wrong → punishment teaches responsibility → so crime decreases"], ["Children punished", "Without punishment there is no deterrent → young offenders keep offending → so public safety suffers"], ["Parents punished", "Parents shape behavior → neglect and poor supervision lead to crime → so parents should be held accountable"], ["Parents punished", "Punishing parents encourages supervision → they take more care of their children → so there are fewer crimes"]], "ex": ["Friends planning a shop break-in", "A child blaming his parents", "A rebellious teenager from a loving home"], "kw": ["child", "crime", "decre", "punis", "respo", "right", "teach", "wrong"], "model": "First of all, children who commit crimes should be punished because they know right from wrong. Teenagers are able to plan their actions, so treating them as if they bear no responsibility sends the wrong message. This means that proper punishment teaches them to take responsibility and, in the long run, helps crime decrease. For instance, friends who plan a shop break-in and are then made to repay the owner will think twice before doing it again.", "sec": "Besides, without punishment there is no deterrent. If young offenders see that nothing happens when they break the law, they are likely to keep offending, which puts public safety at risk.", "ex4": [[3, "Friends planning a shop break-in who must repay the owner"], [2, "A teenager who steals again because nothing happened"], [3, "A child left alone every night by his parents"], [1, "Places where parents can be fined for a child's crime"]], "p2": "On the other hand, parents should share the blame when their children commit crimes. Parents shape the way a child behaves, so neglect and poor supervision often lead to offending. This is why the adults who raise the child should be held accountable. For example, a boy left alone every night by his parents may drift into a gang of troublemakers. Besides, punishing parents encourages them to supervise more closely. Once they know they will face a fine, they take greater care of their children, which results in fewer crimes.", "kw1": ["child", "crime", "decre", "deter", "offen", "publi", "punis", "respo", "right", "safet", "teach", "witho", "wrong", "young"], "kw2": ["accou", "behav", "child", "crime", "encou", "fewer", "negle", "paren", "punis", "shape", "shoul", "super"]}, {"n": 5, "tn": 48, "q": "Some people think that parents should read or tell stories to their children. Others believe that parents do not need to do this, as children can read books or watch TV and movies by themselves. Discuss both views and give your own opinion.", "main": "parents reading or telling stories to children", "ch": [["Parents should read or tell stories", "Shared stories build closeness → children feel loved and secure → so the parent-child bond grows stronger"], ["Parents should read or tell stories", "Hearing stories improves vocabulary and imagination → children learn to read sooner → so they succeed at school"], ["Children can do it alone", "Children enjoy books and screens by themselves → they have a wide choice → so parents need not spend time"], ["Children can do it alone", "Busy parents have limited time → reading alone builds confidence → so children learn self-reliance"]], "ex": ["Programs teaching letters and numbers", "Reading alone before sleep", "Listening in the car"], "kw": ["build", "child", "close", "loved", "paren", "secur", "share", "stori", "stron"], "model": "Firstly, reading or telling stories to children builds a close bond between parent and child. This is because sharing a story means spending calm, undivided time together, which makes children feel loved and secure. As a result, they are more likely to trust their parents and talk to them openly later in life. For example, many families have a bedtime routine of ten or fifteen minutes of reading, and children often remember these moments fondly for years.", "sec": "Moreover, hearing stories improves a child's vocabulary and imagination. Children who listen to stories regularly tend to learn to read sooner, and this often leads to success at school. For example, discussing why a character is sad helps them understand feelings and new words at the same time.", "ex4": [[4, "Your own bedtime stories as a child"], [5, "Research on children who are read to"], [4, "A child reading alone before sleep"], [3, "A busy parent who gets home at 8 pm"]], "p2": "On the other hand, parents do not always have to read to their children. Children today enjoy books and screens by themselves, and they have a wide choice of stories at their fingertips. As a result, parents need not spend every evening on this task. For instance, a child who reads alone before sleep can enjoy a story at his own pace. Besides, many parents are busy and have little free time. Reading alone builds a child's confidence, which means that children also learn self-reliance.", "kw1": ["build", "child", "close", "heari", "imagi", "impro", "learn", "loved", "paren", "schoo", "secur", "soone", "stori", "succe", "vocab"], "kw2": ["alone", "books", "build", "child", "choic", "confi", "enjoy", "learn", "paren", "readi", "relia", "scree", "spend", "thems"]}, {"n": 6, "tn": 50, "q": "Some people think that it is good for a country’s culture to import foreign films and TV programmes. Others think that it is better to produce them locally. Discuss both views and give your own opinion.", "main": "foreign versus locally produced films and TV", "ch": [["Importing", "Foreign films are high quality → large budgets and special effects → so viewers get better entertainment"], ["Importing", "Foreign films show other cultures → viewers learn about different ways of life → so tolerance and understanding grow"], ["Producing locally", "Local films express national culture → language, traditions and stories are preserved → so national identity gets stronger"], ["Producing locally", "Local production creates jobs → actors, writers and technicians are hired → so money stays in the economy"]], "ex": ["Foreign programs with subtitles for language learners", "Nigerian and Korean viewers", "Local studios improving"], "kw": ["bette", "budge", "effec", "enter", "films", "forei", "large", "quali", "speci"], "model": "On the one hand, importing foreign films and programs can be beneficial because they are usually of high quality. Large budgets and special effects mean that foreign productions often look more impressive than local ones. This results in better entertainment for viewers. Moreover, foreign programs with subtitles can help language learners, such as students who improve their English by watching foreign series.", "sec": "Furthermore, foreign programs show viewers other cultures. People learn about different ways of life, which can lead to greater tolerance and understanding. For instance, viewers who watch series from Korea or Spain often become curious about those countries.", "ex4": [[0, "Hollywood films or Korean dramas"], [2, "A viewer learning about Japan from a foreign series"], [1, "Nigeria's local film industry"], [2, "A local film crew: actors, writers, camera operators"]], "p2": "On the other hand, producing films and programmes locally is better for a country's culture. Local films express national life, so language, traditions and stories are preserved for new generations. This results in a stronger identity. For example, Nigeria's film industry tells local stories that foreign studios would never think of. Besides, local production creates jobs. Actors, writers, directors and technicians are hired for every project, which means that the money stays in the national economy.", "kw1": ["bette", "budge", "cultu", "diffe", "effec", "enter", "films", "forei", "large", "learn", "quali", "speci", "toler", "under", "viewe"], "kw2": ["actor", "creat", "cultu", "econo", "expre", "films", "hired", "ident", "langu", "local", "money", "natio", "prese", "produ", "stays", "stori", "stron", "techn", "tradi", "write"]}, {"n": 7, "tn": 52, "q": "Some people think that governments should ban dangerous sports, while others believe that people should have the freedom to participate in any sport or activity. Discuss both views and give your own opinion.", "main": "banning dangerous sports or leaving people free to choose", "ch": [["Ban dangerous sports", "Serious injuries and deaths happen → rescue and treatment cost public money → so the state must protect its citizens"], ["Ban dangerous sports", "Young people copy risky behavior → bad examples spread → so more accidents happen"], ["Freedom to choose", "Adults can judge risk → personal freedom is a basic right → so the government should not interfere"], ["Freedom to choose", "Sports bring benefits like fitness, courage and tourism income → a ban would waste them → so people should be free to choose"]], "ex": ["Emergency staff risking their own lives", "Seatbelt laws once criticized", "Overconfident beginners"], "kw": ["death", "happe", "injur", "money", "prote", "publi", "rescu", "serio", "state", "treat"], "model": "To start, those in favor of a ban point out that dangerous sports lead to serious injuries and even deaths. This is because rescue and treatment are paid for with public money, so the state has a duty to protect its citizens. As a result, many believe that some activities should be restricted. Emergency staff who risk their own lives during mountain or sea rescues are a good case in point.", "sec": "Furthermore, young people often copy risky behavior. When bad examples spread, more of them get hurt. Overconfident beginners who try dangerous stunts without training are a typical case.", "ex4": [[2, "Rescue teams sent to help an injured climber"], [3, "A teenager copying a stunt seen online"], [2, "An adult who knows the risks of mountain climbing"], [1, "Mountain regions that earn money from adventure tourism"]], "p2": "On the other hand, adults should be free to choose their own sports. Grown-ups can judge risk for themselves, and personal freedom is a basic right that the government should not interfere with. This is because a ban treats citizens like children. For example, an adult who knows the dangers of mountain climbing has the right to accept them. Besides, sports bring many benefits such as fitness, courage and tourism income. In other words, a ban would waste these advantages, so that society loses more than it gains.", "kw1": ["behav", "death", "examp", "injur", "money", "prote", "publi", "rescu", "risky", "serio", "sprea", "state", "treat", "young"], "kw2": ["adult", "basic", "benef", "bring", "choos", "coura", "fitne", "freed", "gover", "incom", "inter", "judge", "perso", "right", "shoul", "sport", "touri", "waste"]}, {"n": 8, "tn": 54, "q": "Some people believe that the purpose of education is to prepare individuals to be /* ---------- checker */
const EXPL=/\b(because|since|this is why|due to|in other words|that is|this is|which means|owing to|this can be attributed|more specifically|as it|as they|as the|for the reason)\b/i;
const RESU=/\b(as a result|therefore|thus|consequently|this leads|leads to|this means|which means|in turn|hence|results in|resulting|means that|can bring about|so that|this results|will think twice|will be able|so they|and this|gives? rise|causing|promotes?|encourag\w+|enable[sd]?|allow(s|ed)?)\b/i;
const EXAM=/\b(for instance|for example|such as|take |case in point|e\.g\.|one example|an example|prime example|consider |like |illustration)/i;
const ADD=/\b(furthermore|moreover|besides|in addition|another|also|what is more|beyond this|apart from|on top of)\b/i;
const W=t=>(t.toLowerCase().match(/[a-z']+/g)||[]);
function run(a,b){let best=0;for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)if(a[i]===b[j]){let k=0;while(i+k<a.length&&j+k<b.length&&a[i+k]===b[j+k])k++;if(k>best)best=k}return best}
const nw=t=>(t.match(/\S+/g)||[]).length;
const chainText=c=>c.replace(/→/g," ");
function boxChecks(v,tp,chain){
  const cp=run(W(v[0]+" "+v[1]),W(chainText(chain)));
  const kw=tp.kw.filter(k=>(v.join(" ")).toLowerCase().includes(k)).length;
  return [
   {l:"Claim",ok:nw(v[0])>=8&&run(W(v[0]),W(chainText(chain)))<8&&kw>=1,msg:"Say the idea in one clear sentence of 8+ words, in your own words (do not copy the chain)."},
   {l:"Explain",ok:nw(v[1])>=8&&(EXPL.test(v[1])||/\b(when|if|while|whereas|so|and|which)\b/i.test(v[1]))&&!/^(for instance|for example|take |one example)/i.test(v[1])&&run(W(v[1]),W(chainText(chain)))<8,msg:"Explain WHY or HOW: start with “This is because…” or “In other words,…” (8+ words)."},
   {l:"Result",ok:nw(v[2])>=6&&RESU.test(v[2]),msg:"Show the RESULT: start with “As a result,…” or “This means that…” (6+ words)."},
   {l:"Example",ok:nw(v[3])>=10&&EXAM.test(v[3]),msg:"Give a specific EXAMPLE of 10+ words: “For instance,…” or “… is a good case in point.”"}];}
function checkBody(text,tp){
  const w=W(text),n=w.length,ss=text.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>1);
  const kwHit=tp.kw.filter(k=>text.toLowerCase().includes(k)).length;
  const cp=Math.max(run(w,W(chainText(tp.ch[0][1]))),run(w,W(chainText(tp.ch[1][1]))));
  const c=[
   {ok:ss.length>=6,crit:1,label:"6+ sentences",bad:"A full body paragraph has two reasons, each with claim, explanation, result or example: about 6–9 sentences.",good:ss.length+" sentences."},
   {ok:EXPL.test(text),crit:1,label:"Explanation",bad:"Explain WHY: “This is because…”, “In other words,…”.",good:"You explain."},
   {ok:RESU.test(text),crit:1,label:"Result",bad:"Show the RESULT: “As a result,…”, “This means that…”.",good:"You show results."},
   {ok:EXAM.test(text),crit:1,label:"Example",bad:"Add an EXAMPLE: “For instance,…”, “… is a good case in point.”.",good:"You give an example."},
   {ok:ADD.test(text),crit:1,label:"Second reason",bad:"Start your second reason with “Besides,…”, “Furthermore,…” or “Another reason is…”.",good:"You link to a second reason."},
   {ok:cp<8,crit:1,label:"Own words",bad:"You copied "+cp+" words in a row from the ideas. Use your own words.",good:"Written in your own words."},
   {ok:kwHit>=3,crit:1,label:"On idea",bad:"Develop the two ideas shown (View 1). Use their key words or synonyms.",good:"Develops the ideas."},
   {ok:n>=75&&n<=200,crit:0,label:"Length",bad:n<90?"A bit short ("+n+" words). A body paragraph is about 80–150 words.":"A bit long ("+n+" words). Aim for 80–150 words.",good:n+" words: a good length."},
   {ok:text.indexOf("→")<0,crit:0,label:"Full sentences",bad:"Replace the arrows with full sentences.",good:"Full sentences."}];
  const crit=c.filter(x=>x.crit),okc=crit.filter(x=>x.ok).length,tips=c.filter(x=>!x.crit&&!x.ok).length;
  return {c,v:okc===crit.length&&tips===0?"good":okc>=crit.length-1?"mid":"bad"}}
function fbHTML(r,done){
  const vd={good:done||"Well done!",mid:"Nearly there: add the missing move.",bad:"Not yet. Fix the red points and check again."}[r.v];
  return '<div class="hd"><span class="vd">'+vd+'</span><span class="meter">'+r.c.map(x=>'<span class="'+(x.ok?"ok":(x.crit?"no":"tip"))+'">'+(x.ok?"✓ ":"✗ ")+x.label+'</span>').join("")+'</span></div><div class="body">'+
  r.c.filter(x=>!x.ok).map(x=>'<div class="it '+(x.crit?"structure":"style")+'"><div><span class="k">'+(x.crit?"must fix":"tip")+'</span>'+esc(x.bad)+'</div></div>').join("")+
  r.c.filter(x=>x.ok).map(x=>'<div class="it praise"><div><span class="k">ok</span>'+esc(x.good)+'</div></div>').join("")+'</div>'}

function selQ(key,label,opts,ans,expl,num){

function rng(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
function shuf(a,seed){const r=rng(seed),b=a.map((x,i)=>i);for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function selS(key,label,opts,ans,expl,num){const p=shuf(opts,key);return selQ(key,label,p.map(i=>opts[i]),p.indexOf(ans),expl,num)}
function pickQ(key,g,num){
  REG.push({key,kind:"sel",ans:g.ans,fbs:g.fb});

const STARTS=["Say the idea in one sentence…","This is because …","As a result, …","For instance, …"];
function boxes(key,tp,chain,model,hints){

  const L=["Claim","Explain","Result","Example"],C=["s","v","n","l"],H=hints||["The idea in one clear sentence.","Why or how? Start: “This is because…”","So what? Start: “As a result,…”","A specific example. Start: “For instance,…”"];const SB=["Some people believe… · It is true that… · One strong reason is that…","This is because… · In other words,… · Since…","As a result,… · This means that… · Consequently,…","For instance,… · Take … as an example. · … is a good case in point."];

  '<div class="irow"><button class="btn go" data-act="checkbox" data-key="'+key+'">Check the 4 boxes</button><button class="btn ghost" data-act="boxmodel" data-key="'+key+'">Show model</button><span class="done-tag" id="dn_'+key+'"></span></div><div class="fb" id="fb_'+key+'"></div><div class="mdl" id="as_'+key+'" style="display:none"></div></div>'}

const seg=(c,l,t)=>'<div class="seg '+c+'"><div class="st">'+l+'</div>'+esc(t)+'</div>';

ue, this course of action may create some animosity across the manufacturing industry, but the health benefits to people from this decision are more significant.", "c"]], "n1": "Body 1 gives the other side fairly: two ideas, each with a reason.", "n2": "Body 2 uses an imagined situation as the example and ends with a concession."}, {"src": "Success in sport", "q": "Some people believe that to be successful at a sport you need natural ability and others think that hard work and practice can make you successful. Discuss both views and give your opinion.", "b1": [["On the one hand, the role of natural ability in outstanding sport performance cannot be neglected.", "p"], ["In several sports such as basketball and American football, athletes are expected to measure up to set standards in terms of height, weight, and size if they are to stand any chances of winning.", "s"], ["These measurements, in turn, are generally determined by a person’s genes.", "n"], ["This can be seen in the examples of world-famous professional basketball players, Kobe Bryant and Shaq O’neal, who owe some of their success to their body size.", "l"], ["One other area of sport is chess where success ultimately comes down to inherent intelligence.", "s"], ["It is true that chess players hone their skills through many hours of learning and practice.", "c"], ["However, a simple comparison of their intelligence quotient statistics reveals us what really makes up their success formula.", "v"]], "b2": [["Conversely, I firmly believe that hard work and practice are stronger predictors of success in sports than natural ability.", "p"], ["Examples of great athletes who worked diligently to achieve highest levels of athletic proficiency prove that one does not have to be born gifted to succeed in sports.", "v"], ["Such instances vary from long time known football stars Messi and C. Ronaldo to a recent UFC fighter Khabib who is known for having been training his entire life to rise to fame in sports.", "l"], function runSel(k,say){const r=REG.find(x=>x.key===k),el=$('select[data-key="'+k+'"]'),fb=$("#fb_"+k);if(el.value==="")return;const ok=+el.value===r.ans;el.className="sel "+(ok?"ok":"no");
 const msg=r.fbs?r.fbs[+el.value]:(ok?r.expl:"");
 fb.className="fb on "+(ok?"good":"bad");fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"Correct! ":"Not quite. ")+'</span></div><div class="body">'+esc(msg||"")+'</div>';
 ST.saved[k]=el.value;if(ok){ST.ok[k]=1}else delete ST.ok[k];if(say)save();progress()}
function runBoxes(k){const r=REG.find(x=>x.key===k);const v=[0,1,2,3].map(i=>$("#bx_"+k+"_"+i).value.trim());
 if(v.some(x=>!x)){toast("Fill in all four boxes first");return}
 const c=boxChecks(v,r.tp,r.chain),all=c.every(x=>x.ok),fb=$("#fb_"+k);
 fb.className="fb on "+(all?"good":"mid");
 fb.innerHTML='<div class="hd"><span class="vd">'+(all?"Well done! All four moves are there.":"Fix the red boxes.")+'</span><span class="meter">'+c.map(x=>'<span class="'+(x.ok?"ok":"no")+'">'+(x.ok?"✓ ":"✗ ")+x.l+'</span>').join("")+'</span></div><div class="body">'+c.filter(x=>!x.ok).map(x=>'<div class="it structure"><div><span class="k">'+x.l+'</span>'+esc(x.msg)+'</div></div>').join("")+'</div>';
 const as=$("#as_"+k);if(all){as.style.display="";as.innerHTML='<b>Your paragraph:</b><div style="margin-top:6px">'+esc(v.join(" "))+'</div>';ST.ok[k]=1;$("#dn_"+k).textContent="✓ done";cheer()}else{as.style.display="none";delete ST.ok[k];$("#dn_"+k).textContent=""}
 save();progress()}
function runWrite(k){const r=REG.find(x=>x.key===k),ta=$("#ta_"+k);if(!ta.value.trim()){toast("Write your paragraph first");return}
 const res=checkBody(ta.value,r.tp),fb=$("#fb_"+k);fb.className="fb on "+res.v;fb.innerHTML=fbHTML(res,"Well done! This is a developed body paragraph.");ta.className=res.v==="good"?"ok":(res.v==="bad"?"no":"");
 if(res.v!=="bad"){if(!ST.ok[k])cheer();ST.ok[k]=1;$("#dn_"+k).textContent="✓ done";$("#md_"+k).style.display=""}else{delete ST.ok[k];$("#dn_"+k).textContent=""}
 save();progress()}
function applyState(){
 REG.forEach(r=>{if(r.kind==="sel"){const v=ST.saved[r.key];if(v==null)return;const el=$('select[data-key="'+r.key+'"]');el.value=v;runSel(r.key,false)}
  else if(r.kind==="write"){const v=ST.saved[r.key];if(v==null)return;const ta=$("#ta_"+r.key);ta.value=v;wc(r.key);{const pv=ST.saved["pl_"+r.key],pe=$("#pl_"+r.key);if(pv!=null&&pe)pe.value=pv}if(ST.ok[r.key])$("#dn_"+r.key).textContent="✓ done"}
  else if(r.kind==="boxes"){for(let i=0;i<4;i++){const v=ST.saved["bx_"+r.key+"_"+i];if(v!=null)$("#bx_"+r.key+"_"+i).value=v}if(ST.ok[r.key])$("#dn_"+r.key).textContent="✓ done"}});
 showStep(Math.min(ST.step||0,steps.length-1));progress()}
build();window.__T=TOPICS;window.__run=function(k){runBoxes(k)};window.runWrite=runWrite;window.runBoxes=runBoxes;
})();

</script>
</body>
