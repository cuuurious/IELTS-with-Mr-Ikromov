/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}

.iw .lab{font-size:14.2px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}

textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}

.wc{font-size:14.8px;color:var(--mist)}
.done-tag{font-size:14.8px;font-weight:800;color:var(--sage)}

.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:14.2px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:17.7px;line-height:1.7;margin-bottom:6px}

.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:13.6px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:17.1px}
.it .k{display:inline-block;font-size:13px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}

.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:17.1px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

<body>
<script>
(function(){
const CH={id:"wt2-l05-body-agree",kicker:"Writing Task 2 · Lesson 5 · Agree / disagree body paragraphs",title:'How to write <span style="color:#ffd27a">strong body paragraphs</span> for agree / disagree essays',
lead:"Learn from your teacher’s own sample essays: give the other view fairly, then give your own view with explained ideas. Then practise on 10 questions."};
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];

const TOPICS=[{"n": 1, "q": "The advantages of the spread of English as a global language will continue to outweigh its disadvantages. To what extent do you agree or disagree?", "op": "Agree", "pat": "A", "mine": ["A shared language removes barriers → business, science and tourism run on English → faster cooperation and growth", "Learners gain access to knowledge → most research, software and online content is in English → better education and job prospects"], "oth": ["Minority languages are pushed aside → parents choose English for their children's future → loss of cultural identity and heritage", "Native speakers gain an unfair edge → others spend years and money learning → unequal opportunities in jobs and study"], "m1": "To begin with, the worldwide spread of English has some serious drawbacks. Firstly, smaller languages are being pushed aside. This is because many parents now pick English for their children’s future, so local languages are used less at home. As a result, communities risk losing their cultural identity and heritage. Besides, native English speakers enjoy an unfair advantage over everyone else. Other people spend years and a great deal of money learning the language, which creates unequal opportunities in jobs and education.", "m2": "Having said that, I believe the advantages of English clearly outweigh these problems. A common language removes barriers between nations. This is because business, science and tourism now run largely in English, so people can communicate without translators. As a result, countries cooperate faster and economies grow. Besides, English opens the door to knowledge. Research papers, software and websites are mostly written in English, which means that learners who master it can reach better education and job prospects."}, {"n": 2, "q": "Although families have an influence on children’s development, factors outside the home play a bigger part in their lives nowadays. To what extent do you agree or disagree?", "op": "Disagree", "pat": "D", "mine": ["Family shapes basic values and personality in the early years → behavior learned at home stays for life → later influences build on this foundation", "Parents choose schools, friends and activities → they control the environment outside the home → outside factors are often an extension of family decisions"], "oth": ["Children spend most of the day at school and with friends → peers shape habits, tastes and ambitions → friends sometimes outweigh parents", "Media and the internet expose children to ideas from everywhere → they absorb values from influencers and online content → parental influence is diluted"], "m1": "Admittedly, there are good reasons to think that outside factors now matter more than the family. To begin with, children are at school and with friends for most of their waking hours. This is because classmates shape their habits, tastes and ambitions, so a close friend can sometimes outweigh a parent. Moreover, the internet exposes young people to ideas from all over the world. They pick up values from online influencers, and as a result the guidance of parents is weakened.", "m2": "However, I would argue that the family still plays the bigger role. Parents shape a child’s basic values and personality in the early years. This is because behavior learned at home tends to stay for life, so every later influence builds on that foundation. In addition, parents decide which schools, friends and activities their children have. In other words, they control the world outside the home, which means many outside factors are really an extension of family decisions."}, {"n": 3, "q": "Media coverage of violent crime frightens people and encourages criminals. Some people say it should be banned from newspapers and TV programmes. To what extent do you agree or disagree?", "op": "Agree", "pat": "A", "mine": ["Graphic coverage frightens people → constant crime stories make them feel unsafe → anxiety even where crime is falling", "Detailed reports can inspire copycat crimes → criminals learn methods and gain notoriety → more offenses"], "oth": ["The public has a right to know → reports warn people and help police catch suspects → safer communities", "A ban is a form of censorship → a free press holds authorities accountable → hiding crime would weaken trust in the media"], "m1": "To begin with, it is worth considering why some people oppose such a ban. First, the public has a right to know what is happening in society. This is because news about crime warns people of danger and helps the police to find suspects, which makes communities safer. Another argument is that a ban would amount to censorship. A free press holds the authorities accountable, so hiding crime from view would weaken public trust in the media.", "m2": "Having said that, I support limiting violent crime coverage for two reasons. Firstly, graphic reports frighten people. This is because constant stories of murder and robbery make viewers feel unsafe, and as a result they suffer anxiety even in areas where crime is actually falling. Besides, detailed reporting can inspire copycat crimes. Offenders may learn methods from the news and enjoy the fame it brings, which means more offenses."}, {"n": 4, "q": "The best way to understand other cultures is to work for a multinational organisation. To what extent do you agree or disagree?", "op": "Disagree", "pat": "D", "mine": ["Travel and living abroad give first-hand experience → people see daily life, food and traditions → richer and more personal understanding", "Workplace culture is dominated by the company → staff follow one corporate style → contact stays superficial and mostly professional"], "oth": ["Colleagues from many nations work side by side → daily contact shows different habits and views → deeper understanding than reading about them", "Multinationals train staff in cross-cultural communication → employees learn etiquette and negotiation styles → fewer misunderstandings"], "m1": "Admittedly, working for a multinational company does offer some cultural benefits. Colleagues from many countries work side by side every day. This is because contact with them shows employees different habits and views, which gives a deeper understanding than reading about other cultures. Furthermore, large firms often run courses on working across cultures. Staff learn manners and negotiating habits from other countries, so there are fewer misunderstandings at work.", "m2": "However, I do not think this is the best way to understand other cultures. Living and travelling abroad gives first-hand experience. This is because people see daily life, food and traditions with their own eyes, and as a result their understanding is richer and more personal. On top of that, the atmosphere inside a multinational is set by the company itself. Staff follow one corporate style, so relationships with colleagues stay superficial and mostly professional."}, {"n": 5, "q": "Criminals should be educated while in prison in order to reduce crime and help them find employment after they are released. To what extent do you agree or disagree?", "op": "Agree", "pat": "A", "mine": ["Education gives prisoners skills → qualified ex-offenders can find jobs → less likelihood of returning to crime", "Learning changes attitudes → inmates gain confidence and discipline → better behavior inside and outside prison"], "oth": ["Prison budgets are limited → money could prevent crime or help victims → education seems a low priority", "Some prisoners are not interested → resources are wasted on those who refuse to change → punishment, not education, should be the focus"], "m1": "To begin with, critics of prison education make some valid points. Prison budgets are limited, and the money could be spent on preventing crime or helping victims. As a result, teaching inmates can seem a low priority. It is also argued that some prisoners have no interest in studying. This is because resources are wasted on people who refuse to change, so punishment, not education, should be the focus.", "m2": "Having said that, I believe prisoners should be educated. Lessons give them useful skills. This is because ex-prisoners with qualifications can find work after release, which makes it less likely that they will return to crime. In addition, learning changes the way inmates think. They gain confidence and self-discipline, so their behavior improves both inside the prison and after they leave."}, {"n": 6, "q": "When elderly people are no longer physically, mentally or financially able to look after themselves, younger family members should be legally responsible for supporting them. To what extent do you agree or disagree?", "op": "Disagree", "pat": "D", "mine": ["A legal duty cannot create love → forced care may be poor or resentful → relationships suffer", "Some families cannot afford it → low-income households would be punished for being poor → government should help instead"], "oth": ["Parents raised and supported their children → children owe them care in return → fairness between generations", "State care is limited or costly → law protects elderly people from neglect → no one is left without help"], "m1": "To begin with, some people believe that children should be legally responsible for their elderly parents. Parents raised and supported their children for many years. As a result, it seems fair that children should give care in return, which creates fairness between generations. Another point is that state care is limited or costly. This is because public services often cannot cope, so a law would protect elderly people from neglect and nobody would be left without help.", "m2": "However, I do not agree with making this a legal duty. A law cannot create love. This is because care that is forced may be poor or resentful, and as a result family relationships suffer. Besides, some families simply cannot afford to look after an elderly relative. Poor households would effectively be penalized for their poverty, so it is the government that should help instead."}, {"n": 7, "q": "University students should pay the full cost of their education because university education benefits individuals rather than society. To what extent do you agree or disagree?", "op": "Disagree", "pat": "D", "mine": ["Society needs doctors, engineers and teachers → education produces skilled workers → whole country benefits", "Full fees limit access → talented students from poor families cannot enroll → waste of talent and inequality"], "oth": ["Graduates earn higher salaries → the main benefit goes to the individual → students should repay the cost", "Public money is limited → taxpayers who never attended university should not pay → fairness"], "m1": "Admittedly, there are some arguments for making students pay the whole cost. First, graduates earn higher salaries than other workers. This is because a degree opens better jobs, so the chief gain belongs to the graduate personally, and students should repay the cost. Moreover, public money is limited. It would be unfair to ask taxpayers who skipped university to fund other people’s studies.", "m2": "Despite this, I strongly disagree with the idea. Society needs doctors, engineers and teachers. This is because universities produce these skilled workers, and as a result the whole country benefits, not just graduates. In addition, full fees would limit access to education. Talented students from poor families could not enroll, which leads to wasted talent and greater inequality."}, {"n": 8, "q": "All large companies should provide sports and social facilities in the local community. To what extent do you agree or disagree?", "op": "Agree", "pat": "A", "mine": ["Large companies earn large profits → they have a duty to give something back → stronger communities", "Facilities improve health and social life → local people enjoy sports and meet neighbors → better quality of life"], "oth": ["The first duty of a company is to its business → providing facilities adds cost → higher prices or job cuts", "Governments, not companies, should provide public facilities → taxes already pay for this → companies would be forced to do someone else's job"], "m1": "To begin with, critics argue that providing facilities is not a company’s job. A company’s main responsibility is towards its own business. This is because building sports and social facilities adds cost, which can lead to higher prices or job cuts. Another argument is that public facilities belong to the state. Citizens already fund them through taxes, so companies would be doing someone else’s job.", "m2": "Having said that, I agree that large companies should provide such facilities. Large companies earn big profits from the communities around them. For this reason, they have a duty to give something back, which makes those communities stronger. Besides, facilities improve health and social life. This is because local people can play sports and meet their neighbors, so their quality of life improves."}, {"n": 9, "q": "People believe that they should be able to keep all the money they earn and should not pay taxes to the state. To what extent do you agree or disagree?", "op": "Disagree", "pat": "D", "mine": ["Taxes fund health, education and roads → private individuals cannot afford these → everyone benefits", "Taxes reduce inequality → rich pay more to support the poor → a fairer and more stable society"], "oth": ["People earn the money by their own work → paying part of it feels unfair → they should decide how to spend it", "Governments often waste or misuse taxes → corruption and inefficiency → citizens could use money better"], "m1": "To begin with, it is worth considering why some people want to keep all their income. They earn the money through their own work, so paying part of it can feel unfair. This is because they believe the choice of how to spend it is theirs. Besides, public money is often wasted by governments. Corruption and poor management are common, which means citizens might use the money better themselves.", "m2": "However, I strongly disagree with abolishing taxes. Taxes fund health, education and roads. This is because private individuals cannot afford these services on their own, so everyone benefits when they are paid for together. In addition, taxes reduce inequality. The rich pay more to support the poor, which leads to a fairer and more stable society."}, {"n": 10, "q": "Doctors, nurses and teachers make a great contribution to society and should be paid more than entertainment and sports celebrities. Do you agree or disagree?", "op": "Agree", "pat": "A", "mine": ["These professions save lives and educate the young → society depends on them → they deserve higher pay", "Low pay causes shortages → talented people avoid these careers → public services suffer"], "oth": ["Celebrities earn money from private demand → fans and sponsors pay willingly → it is not public money", "Pay depends on supply and demand → few people have celebrity talent → market value is high"], "m1": "To begin with, some people defend the high pay of celebrities. They earn their money from private demand. This is because fans and sponsors pay willingly, so it is not public money. Another argument is that the market sets the price. Very few people can match a star’s talent, which means that talent is worth a lot.", "m2": "Nevertheless, I strongly agree that doctors, nurses and teachers deserve more. These jobs protect health and teach children. This is because society depends on them, so they deserve higher pay. Besides, poor salaries lead to a lack of workers. Capable people choose other careers, and as a result public services suffer."}];
const DATA={"EX": [{"src": "Uniforms at work", "q": "It is suggested that wearing a uniform should be mandatory in the workplace. Do you agree or disagree?", "b1": [["Some advantages of a uniform mandate among employees are worth considering.", "T"], ["The main argument here is increased productivity.", "C"], ["Uniforms, as well as adding a professional look to the workplace, tend to evoke feelings of work and responsibility in the mind of employees.", "E"], ["They, in most cases, help shift one’s mind from a casual, home state to that of duty as people often associate workplace attire with work.", "R"], ["Another important factor is convenience.", "B"], ["Most workers consider uniforms practical since they are relatively inexpensive and save the wearer the hassle of deciding what to wear for the day.", "E"]], "b2": [["I am, however, strongly opposed to all employees wearing an identical outfit.", "T"], ["My objection has to do with the restriction of personal freedom.", "C"], ["Having been required to put on workplace attire, employees might feel restricted and possibly oppressed seeing as they have no say in outfit choice.", "E"], ["This tends to create a sense of inferiority, which can trigger contempt towards the workplace.", "R"], ["More than suppressing one’s freedom, uniforms stifle expression of one’s self.", "B"], ["This is because our dressing preferences are a reflection of our personality and how we want to be perceived.", "E"], ["As such, employees who have limited chances to express themselves generally feel less driven to work.", "R"]], "note": "Body 1 gives the other view fairly: two ideas, each with its explanation. Then “however” turns to my view. Notice the second idea in each paragraph starts with “Another important factor…” / “More than…”."}, {"src": "Plastic bags", "q": "Plastic shopping bags cause many environmental problems. Some people say they should be banned. Do you agree or disagree?", "b1": [["To start, one should acknowledge that the less common use of plastic bags at stores can help save the environment in some ways.", "T"], ["It is a well-known fact that plastic takes longer to recycle naturally than other packaging materials such as glass and paper, so banning it would be one logical argument to make as far as environmental sustainability is concerned.", "E"], ["Once banned, plastic would no longer add to major environmental issues like pollution and carbon emission from dump fields.", "R"], ["This, as a result, means better life quality for people not just living around those areas, but also millions of others who suffer from the harmful effects of plastic in some indirect ways.", "R"]], "b2": [["In my mind, however, removal of plastic bags from stores further accelerates this so-called “environmental suicide” rather than slow it down.", "T"], ["This is because substitutes for plastic have been found to cause even more harm to the environment, contrary to what most people think.", "E"], ["Alternative packaging materials including glass and paper tend to involve manufacturing and distribution practices that have come under harsh criticism for being environmentally unfriendly.", "E"], ["While glass is heavier and thus requires more fuel to transport, making paper packaging requires cutting down precious rainforest, which is a primary source of clean oxygen.", "X"], ["Finally, it is a real challenge trying to design non-plastic packages suitable for all purposes.", "B"], ["In this sense, the role of plastic as a versatile packaging tool is rather irreplaceable.", "R"]], "note": "The example here (glass and paper) comes in the middle of the explanation. The second idea is short: “Finally, …” and one result sentence."}, {"src": "First moon landing", "q": "The first moon landing did not affect the lives of most people. Do you agree or disagree?", "b1": [["Moon landing can, in a sense, be viewed as a significant progress.", "T"], ["It ushered in a new era of space exploration by setting an example for other countries as well as drumming up public interest in the mysteries of the universe.", "E"], ["Prior to this historic achievement, the public was generally skeptical of the possibility of going to Earth’s orbit, much less traveling to another planet, and few governments deemed it necessary to invest in this particular area of science.", "E"], ["Moon landing, however, dispelled much of the skepticism around the prospect of space exploration and arguably encouraged other countries such as China and India to set up their own space agencies and join the space race.", "X"]], "b2": [["Nevertheless, this historic event has had negligible impact on the lives of ordinary people.", "T"], ["From an economic standpoint, progress is not progress unless it has tangible benefits to common men.", "E"], ["Though moon landing might have marked a significant milestone for the scientific community, it did little in the way of improving the quality of life of most people around the globe.", "R"], ["Adding to this is the fact that it takes years for space breakthroughs to translate into real world applications.", "B"], ["Sadly, it was true in the instance of moon landing as well; it has been almost 60 years since the first man walked on the moon, but there are still no colonies there.", "X"]], "note": "A short example can close a paragraph: the last sentence of Body 2 is the example. The turn word here is “Nevertheless”."}, {"src": "Computers for older people", "q": "Is teaching people over 65 to use computers the best way to spend government money? To what extent do you agree or disagree?", "b1": [["To begin with, government-subsidized programs aimed at making people aged 65 or older computer literate can help this segment of the population lead more interesting lives.", "T"], ["With the ability to use a computer, old people would gain better access to the Internet, and as such tap into a world of information and ideas that concern their lives.", "E"], ["More than this, they could find online communities where they can interact with people of their age and mind.", "B"], ["In this way, governments can ensure that old people live fuller lives and have a substitute for the much-needed social interaction they are missing out on in the real world.", "R"], ["Finally, it is not surprising to see some old people today making a living on social media platforms such as TikTok by creating content on a range of topics from cooking to life advice.", "X"], ["This shows that money spent on teaching old people computer skills may not be a complete waste after all.", "Z"]], "b2": [["However, I do not see how, in the long term, getting old people computer-educated can be the best spending of government budget.", "T"], ["Having lived long and sometimes stressful lives, people tend to seek peace and comfort in their old age.", "E"], ["However, teaching them computer skills would be tantamount to throwing them into a jungle called the Internet.", "R"], ["Being exposed to an unrestricted flow of information that is often not curated is quite the opposite of what they need at an old age.", "R"], ["Besides, there are quite a few other, better ways of spending public money to help old people.", "B"], ["To my mind, one of these ways is to fund poorly-run nursing homes where quality of care is not up to scratch.", "X"], ["Old people residing in those places would definitely prefer better care services to computer literacy programs if given a choice.", "R"]], "note": "A closing sentence (“This shows that…”) is optional. It sums up the paragraph without adding a new idea."}, {"src": "Top salaries", "q": "Some people think it is a good thing for senior managers to have much higher salaries than other employees. To what extent do you agree or disagree?", "b1": [["To begin with, it can be argued that companies are justified in their decision to pay senior management staff premium salaries.", "T"], ["These people working at top positions assume huge responsibilities that come with high workloads and stress.", "E"], ["The average senior manager is expected to create agendas, make important decisions and handle other business of the company, unlike other workers who only specialize in a small set of tasks.", "E"], ["Another reason behind paying senior managers well might have to do with encouraging other workers to work harder and strive for the top positions in the company.", "B"], ["Knowing that they will be paid significantly more, junior staff would work extra hours in pursuit of a promotion.", "R"]], "b2": [["On the other hand, I think this trend can have adverse effects on company culture.", "T"], ["Firstly, it can create a huge pay gap between workers at the two ends of the company hierarchy.", "C"], ["This might further lead to problems within the company after workers realize that its earnings are not being fairly distributed.", "R"], ["This, indeed, was the case with Amazon recently, when workers at some branches complained that they were underpaid while top managers were lining their pockets from the large profit margins the company was making.", "X"], ["One other disadvantage of a large remuneration to senior managers is that after making a certain amount of wealth, they can become laid-back and take their jobs lightly.", "B"], ["The creation of this sort of mentality among senior managers is likely to affect other workers down the company structure.", "R"]], "note": "Body 2 gives two problems and starts the first with “Firstly,” and the second with “One other disadvantage…”. The example (Amazon) supports the first problem."}], "G": {"picks": [{"src": "Plastic bags", "topic": "Body 2 · my view. The writer’s opinion: banning plastic bags does more harm than good.", "opts": ["Plastic bags are bad.", "For example, in my town people already use paper bags.", "In my mind, however, removal of plastic bags from stores further accelerates this so-called “environmental suicide” rather than slow it down.", "Both views are right and I cannot decide."], "ans": 2, "fb": ["Too vague: it does not say why. A topic sentence names the main idea of the paragraph.", "An example is not a topic sentence. First say the main idea, and use examples later.", "", "In the body you must take a clear side. Say your view."]}, {"src": "First moon landing", "topic": "Body 1 · the other view. The writer’s opinion: the moon landing had little effect on ordinary people.", "opts": ["Moon landing can, in a sense, be viewed as a significant progress.", "I think the moon landing was a waste of time and money.", "Many things happened in 1969.", "However, I disagree that it was a great achievement."], "ans": 0, "fb": ["", "This is MY view, but Body 1 gives the other view fairly. Keep “I” for Body 2.", "Too vague and not connected to the other view.", "“However…” turns to my side. That belongs to Body 2."]}, {"src": "Top salaries", "topic": "Body 2 · my view. The writer’s opinion: very high pay for senior managers is a bad trend.", "opts": ["Senior managers have many responsibilities and a lot of stress.", "On the other hand, I think this trend can have adverse effects on company culture.", "This essay will discuss high salaries.", "Amazon workers complained about low pay."], "ans": 1, "fb": ["Does not turn to my view: it repeats the other side’s idea.", "", "“This essay will discuss…” is not a topic sentence. State the idea.", "Do not begin with an example. Say the main idea first."]}], "w1": {"src": "Uniforms at work", "kind": "mine", "tag": "Body 2 · my view", "q": "Should all employees wear a uniform at work?", "stance": "I am opposed to uniforms for all employees.", "ch": ["Uniforms restrict personal freedom → employees feel they have no say and feel oppressed → they develop contempt for the workplace", "Uniforms stifle self-expression → clothing reflects personality → people feel less driven to work"], "model": "I am, however, strongly opposed to all employees wearing an identical outfit. My objection has to do with the restriction of personal freedom. Having been required to put on workplace attire, employees might feel restricted and possibly oppressed seeing as they have no say in outfit choice. This tends to create a sense of inferiority, which can trigger contempt towards the workplace. More than suppressing one’s freedom, uniforms stifle expression of one’s self. This is because our dressing preferences are a reflection of our personality and how we want to be perceived. As such, employees who have limited chances to express themselves generally feel less driven to work."}, "w2": {"src": "Computers for older people", "kind": "other", "tag": "Body 1 · the other view", "q": "Is teaching people over 65 to use computers the best way to spend government money?", "stance": "The writer is against it, but Body 1 gives the arguments in favor.", "ch": ["Computer skills give older people access to information and ideas → the Internet covers topics that concern their lives → more interesting lives", "Online communities let older people meet others of their age → they replace missing real-world social contact → fuller lives"], "model": "To begin with, government-subsidized programs aimed at making people aged 65 or older computer literate can help this segment of the population lead more interesting lives. With the ability to use a computer, old people would gain better access to the Internet, and as such tap into a world of information and ideas that concern their lives. More than this, they could find online communities where they can interact with people of their age and mind. In this way, governments can ensure that old people live fuller lives and have a substitute for the much-needed social interaction they are missing out on in the real world. This is because many older people live alone and rarely meet others. Furthermore, the programs would give them confidence, which means they can enjoy modern life instead of feeling left behind."}}};

const RESU=/\b(as a result|therefore|thus|consequently|this leads|leads to|this means|which means|in turn|hence|results in|resulting|means that|so they|so it|so that|so the|so people|so everyone|and this|gives? rise|causing|as such|in this way|for this reason|this tends|this creates|which leads|which makes|which causes|which results|which can|which may|so )\b/i;
const ADD=/\b(furthermore|moreover|besides|in addition|another|also|what is more|beyond this|apart from|on top of|more than|one other|finally|firstly|secondly|adding to this|second|next)\b/i;

function run(a,b){let best=0;for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)if(a[i]===b[j]){let k=0;while(i+k<a.length&&j+k<b.length&&a[i+k]===b[j+k])k++;if(k>best)best=k}return best}

  const hasI=/\b(i|my|we|me)\b/i.test(first);
  const c=[

       :{ok:!hasI,crit:1,label:"Topic sentence",bad:"Start Body 1 with the other view, without “I”: “To begin with, …”, “Admittedly, …”, “It is worth considering why some people…”.",good:"Your topic sentence introduces the other view."},
   {ok:ss.length>=5,crit:1,label:"5+ sentences",bad:"A full body paragraph has a topic sentence and two ideas, each explained: about 5–8 sentences.",good:ss.length+" sentences."},
   {ok:EXPL.test(text),crit:1,label:"Explanation",bad:"Explain WHY: “This is because…”, “In other words,…”.",good:"You explain."},
   {ok:RESU.test(text),crit:1,label:"Result",bad:"Show the RESULT: “As a result,…”, “This means that…”.",good:"You show results."},
   {ok:ADD.test(text),crit:1,label:"Second idea",bad:"Start your second idea with “Besides,…”, “Another reason is…”, “Furthermore,…” or “Finally,…”.",good:"You link to a second idea."},
   {ok:cp<9,crit:1,label:"Own words",bad:"You copied "+cp+" words in a row from the ideas. Use your own words.",good:"Written in your own words."},
   {ok:kwHit>=3,crit:1,label:"On idea",bad:"Develop the two ideas shown. Use their key words or synonyms.",good:"Develops the ideas."},
   {ok:n>=45&&n<=190,crit:0,label:"Length",bad:n<45?"A bit short ("+n+" words). A body paragraph is about 70–120 words.":"A bit long ("+n+" words). Aim for 70–120 words.",good:n+" words: a good length."},
   {ok:text.indexOf("→")<0,crit:0,label:"Full sentences",bad:"Replace the arrows with full sentences.",good:"Full sentences."}].filter(x=>!(x.ok&&!x.crit&&!x.bad));
  const crit=c.filter(x=>x.crit),okc=crit.filter(x=>x.ok).length,tips=c.filter(x=>!x.crit&&!x.ok).length;
  return {c,v:okc===crit.length&&tips===0?"good":okc>=crit.length-1?"mid":"bad"}}
function checkBody(t,tp){return checkBody5(t,tp)}

  const vd={good:done||"Well done!",mid:"Nearly there: add the missing move.",bad:"Not yet. Fix the red points and check again."}[r.v];
  return '<div class="hd"><span class="vd">'+vd+'</span><span class="meter">'+r.c.map(x=>'<span class="'+(x.ok?"ok":(x.crit?"no":"tip"))+'">'+(x.ok?"✓ ":"✗ ")+x.label+'</span>').join("")+'</span></div><div class="body">'+
  r.c.filter(x=>!x.ok).map(x=>'<div class="it '+(x.crit?"structure":"style")+'"><div><span class="k">'+(x.crit?"must fix":"tip")+'</span>'+esc(x.bad)+'</div></div>').join("")+
  r.c.filter(x=>x.ok).map(x=>'<div class="it praise"><div><span class="k">ok</span>'+esc(x.good)+'</div></div>').join("")+'</div>'}

/* ---------- builders */
let REG=[];
function selQ(key,label,opts,ans,expl,num){
  REG.push({key,kind:"sel",ans,expl});
  return '<div class="q" data-key="'+key+'"><div class="p"><span class="num">'+num+'</span>'+label+'</div><select class="sel" data-key="'+key+'"><option value="">Choose…</option>'+opts.map((o,i)=>'<option value="'+i+'">'+esc(o)+'</option>').join("")+'</select><div class="fb" id="fb_'+key+'"></div></div>'}
function rng(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
function shuf(a,seed){const r=rng(seed),b=a.map((x,i)=>i);for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function selS(key,label,opts,ans,expl,num){const p=shuf(opts,key);return selQ(key,label,p.map(i=>opts[i]),p.indexOf(ans),expl,num)}
function pickQ(key,g,num){
  REG.push({key,kind:"sel",ans:g.ans,fbs:g.fb});
  return '<div class="q" data-key="'+key+'"><div class="p"><span class="num">'+num+'</span><b>'+g.label+'</b> · choose the best sentence</div><select class="sel" data-key="'+key+'"><option value="">Choose…</option>'+g.opts.map((o,i)=>'<option value="'+i+'">'+esc(o)+'</option>').join("")+'</select><div class="fb" id="fb_'+key+'"></div></div>'}
function writeQ(key,tp){
  REG.push({key,kind:"write",tp});
  return '<div class="iw"><div class="lab">Your body paragraph</div><textarea id="ta_'+key+'" placeholder="Write your body paragraph (70–120 words)" style="min-height:230px"></textarea><div class="irow"><button class="btn go" data-act="check" data-key="'+key+'">Check my paragraph</button><button class="btn ghost" data-act="hint" data-key="'+key+'">Hint</button><button class="btn ghost" data-act="model" data-key="'+key+'">Show model</button><span class="wc" id="wc_'+key+'"></span><span class="done-tag" id="dn_'+key+'"></span></div><div class="hint" id="hint_'+key+'">'+tp.hint+'</div><div class="fb" id="fb_'+key+'"></div><div class="mdl" id="md_'+key+'" style="display:none"><b>Model paragraph:</b><div style="margin-top:6px">'+esc(tp.model)+'</div></div></div>'}
const seg=(c,l,t)=>'<div class="seg '+c+'"><div class="st">'+l+'</div>'+esc(t)+'</div>';
const legend='<div class="legend"><span><i style="background:#efe6f7"></i>topic sentence / closing</span><span><i style="background:var(--chipS)"></i>idea</span><span><i style="background:var(--chipV)"></i>explain</span><span><i style="background:var(--chipN)"></i>result</span><span><i style="background:var(--chipL)"></i>example (optional)</span></div>';



/* ---------- steps */
const steps=[];
const CC={T:["p","Topic sentence"],C:["s","First idea"],B:["s","Second idea"],E:["v","Explain"],R:["n","Result"],X:["l","Example"],Z:["p","Closing"]};
const cparts=parts=>'<div class="cp">'+parts.map(p=>'<span class="seg '+CC[p[1]][0]+'" style="display:inline-block;margin:3px 4px 3px 0;padding:6px 10px"><span class="st" style="display:block">'+CC[p[1]][1]+'</span>'+esc(p[0])+'</span>').join("")+'</div>';
const HINT={other:'<b>Plan:</b> Topic sentence (<b>To begin with, / Admittedly,</b> the other view, no “I”) → Idea 1: claim, <b>This is because…</b>, <b>As a result…</b> → <b>Another… / Besides, / Moreover,</b> Idea 2 → explain and result. (70–120 words)',
 mine:'<b>Plan:</b> Topic sentence (<b>Having said that, I… / However, I…</b>) → Idea 1: claim, <b>This is because…</b>, <b>As a result…</b> → <b>Besides, / Another reason is… / Furthermore,</b> Idea 2 → explain and result. (70–120 words)'};
const ideasBox=(ch,label)=>'<div style="margin-top:6px">'+ch.map((c,i)=>'<span class="seg v" style="display:block;margin:4px 0;padding:6px 10px"><span class="st" style="display:block">'+label+' · Idea '+(i+1)+'</span>'+esc(c)+'</span>').join("")+'</div>';
const EXC=DATA.EX,G=DATA.G;
steps.push({label:"1 Learn",html:()=>{
 const e1=EXC[0];
 let h='<div class="sec-title"><span class="n">STEP 1</span><h2>Learn: body paragraphs for agree / disagree essays</h2></div>';
 h+='<div class="card"><h3>1 · The essay map</h3><p class="lead">Most of the sample essays have <b>two body paragraphs</b>: first the <b>other view</b>, then <b>my view</b>.</p><table class="t"><tr><th>Paragraph</th><th>Its job</th><th>It starts with…</th></tr>'
 +'<tr><td><b>Introduction</b></td><td>Paraphrase the question + my position (Lesson 4)</td><td>It is argued that… I disagree…</td></tr>'
 +'<tr><td><b>Body 1</b><br>other view</td><td>Give the other side <b>fairly</b>: two ideas. No “I”.</td><td>To begin with, … · Admittedly, …</td></tr>'
 +'<tr><td><b>Body 2</b><br>my view</td><td>Give <b>my side</b>: two ideas. Stronger and clear.</td><td>Having said that, I … · However, I …</td></tr>'
 +'<tr><td><b>Conclusion</b></td><td>Repeat my position and sum up</td><td>In conclusion, …</td></tr></table>'+legend+'</div>';
 h+='<div class="card"><h3>2 · Topic sentences from the samples</h3><table class="t"><tr><th>Body 1 · other view (no “I”)</th><th>Body 2 · my view (“I” + turn word)</th></tr>'
 +'<tr><td>To begin with, it can be argued that companies are justified in their decision to pay senior managers premium salaries.</td><td>On the other hand, I think this trend can have adverse effects on company culture.</td></tr>'
 +'<tr><td>Admittedly, illegalizing extreme sports can be justified on several grounds.</td><td>Despite the reasons stated above, I am opposed to imposing limitations on extreme sports.</td></tr>'
 +'<tr><td>To start, one should acknowledge that the less common use of plastic bags can help save the environment.</td><td>In my mind, however, removal of plastic bags from stores accelerates this so-called “environmental suicide”.</td></tr>'
 +'<tr><td>It is worth considering why some advocate buying food only locally.</td><td>I, on the other hand, support the importation of food from other countries for several reasons.</td></tr>'
 +'<tr><td>On the one hand, there are some people who might argue that…</td><td>Having said that, I still think that… should not be left out.</td></tr></table></div>';
 const ST7=[["1 · Topic sentence","Say the main idea of the paragraph. Body 1: the other view. Body 2: my view.","To begin with, … · Admittedly, … · Having said that, I … · However, I …"],
 ["2 · First idea","Name your first idea in one sentence.","The main argument here is … · Firstly, … · My objection has to do with …"],
 ["3 · Explain","Say why or how.","This is because … · That is, … · In other words, … · More specifically, …"],
 ["4 · Result","Show what happens because of it.","As a result, … · As such, … · In this way, … · This tends to …"],
 ["5 · Example (optional)","A short, specific example. You can skip it.","… such as … · This was the case with … · Take … for instance"],
 ["6 · Second idea","Start a new idea with a link. Repeat steps 2–4 in a shorter form.","Another important factor is … · More than …, … · Besides, … · One other point to consider is … · Adding to this is the fact that … · Finally, …"],
 ["7 · Closing (optional)","One sentence that sums up. No new idea.","This shows that … · In these regards, … · In this sense, …"]];
 h+='<div class="card"><h3>3 · Build a paragraph in order: seven steps</h3><table class="t"><tr><th>Step</th><th>What you do</th><th>Phrases from the samples</th></tr>'+ST7.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join("")+'</table><div class="grp">Real Body 2 · '+e1.src+'</div>'+cparts(e1.b2)+'<div class="note">'+esc(e1.note)+'</div></div>';
 h+='<div class="card"><h3>4 · Body 1 and Body 2: what is different?</h3><table class="t"><tr><th></th><th>Body 1 · other view</th><th>Body 2 · my view</th></tr>'
 +'<tr><td><b>Voice</b></td><td>Neutral: “some people”, “it can be argued”</td><td>Personal and firm: “I believe”, “I would argue”</td></tr>'
 +'<tr><td><b>Turn</b></td><td>Starts the paragraph</td><td>“However / Having said that” turns away from Body 1</td></tr>'
 +'<tr><td><b>Length</b></td><td>Two ideas, a little shorter</td><td>Two ideas, a little fuller</td></tr>'
 +'<tr><td><b>Ideas</b></td><td>The real arguments of the other side</td><td>My reasons from the introduction</td></tr></table></div>';
 h+='<div class="card"><h3>5 · If you do not discuss the other view</h3><p class="lead">In the one-sided approach every reason gets <b>its own paragraph</b>. You can open the paragraphs like this:</p><table class="t"><tr><th>Paragraph</th><th>Frame</th></tr><tr><td>Reason 1</td><td>[The topic] usually has some adverse effects. / One main reason is that …</td></tr><tr><td>Reason 2</td><td><b>Another concern over</b> [the topic] <b>is that</b> …</td></tr><tr><td>Reason 3</td><td><b>A final argument in favor of</b> [the topic] <b>is that</b> …</td></tr></table><div class="note">Keep the same three steps in each paragraph: idea → explain → result. Use the same reasons as in your introduction.</div></div>';
 h+='<div class="card"><h3>6 · Do and don’t</h3><table class="t"><tr><th>Do ✓</th><th>Don’t ✗</th></tr><tr><td>Give two ideas in each body paragraph.<br>Explain every idea: “This is because…”<br>Show a result: “As a result…”<br>Turn clearly in Body 2: “However, I…”.</td><td>Don’t write “I think” in Body 1.<br>Don’t mix both views in one paragraph.<br>Don’t list ideas without explaining them.<br>Don’t copy the question or the ideas.</td></tr></table></div>';
 return h}});
steps.push({label:"2 Examples",html:()=>{
 let h='<div class="sec-title"><span class="n">STEP 2</span><h2>Five real examples</h2></div><p class="lead">Read each pair of paragraphs from the sample essays. Every part has a job.</p>'+legend;
 h+=EXC.map((x,i)=>'<div class="card"><h3>Example '+(i+1)+' · '+x.src+'</h3><div class="seg s"><div class="st">Question</div>'+esc(x.q)+'</div><div class="grp">Body 1 · the other view</div>'+cparts(x.b1)+'<div class="grp">Body 2 · my view</div>'+cparts(x.b2)+'<div class="note">'+esc(x.note)+'</div></div>').join("");
 return h}});
steps.push({label:"3 Guided practice",html:()=>{
 let h='<div class="sec-title"><span class="n">STEP 3</span><h2>Guided practice</h2></div><p class="lead">Part A: choose the best topic sentence. Part B: write two body paragraphs. Everything comes from the sample essays.</p>';
 h+='<div class="card"><h3>Part A · Choose the best topic sentence</h3>'+G.picks.map((g,i)=>'<div class="seg p"><div class="st">'+g.src+'</div>'+esc(g.topic)+'</div>'+pickQ("GP"+(i+1),{label:"Topic sentence "+(i+1),opts:g.opts,ans:g.ans,fb:g.fb},i+1)).join("")+'</div>';
 [G.w1,G.w2].forEach((w,i)=>{
  const tp=Object.assign({},w,{hint:HINT[w.kind]});
  h+='<div class="card"><h3>Part B'+(i+1)+' · '+w.tag+' · '+w.src+'</h3><div class="seg s"><div class="st">Question</div>'+esc(w.q)+'</div><div class="seg" style="background:var(--card2,#f4f1ea);border-left:5px solid #2f6fd0"><div class="st">Remember</div><b>'+esc(w.stance)+'</b>'+ideasBox(w.ch,w.kind==="mine"?"My view":"Other view")+'</div>'+writeQ("GW"+(i+1),tp)+'</div>';});
 return h}});
steps.push({label:"4 Practice tests",subnav:true,units:TOPICS.map(t=>({label:"Topic "+t.n,html:()=>{
 const t1={kind:"other",ch:t.oth,model:t.m1,q:t.q,hint:HINT.other},t2={kind:"mine",ch:t.mine,model:t.m2,q:t.q,hint:HINT.mine};
 let h='<div class="card"><div class="lhd"><div class="big">'+t.n+'</div><div><h3>Write two body paragraphs 🌱</h3><div class="ins" style="margin:0">Body 1 gives the other view. Body 2 gives my view. Earn a ⭐ for both!</div></div></div><div class="seg s" style="margin-bottom:10px"><div class="st">Question</div>'+esc(t.q)+'</div>'
 +'<div class="seg" style="background:var(--card2,#f4f1ea);border-left:5px solid #2f6fd0"><div class="st">My opinion</div><b>'+esc(t.op)+'</b></div></div>'
 +'<div class="card"><h3>Body 1 · the other view</h3>'+ideasBox(t.oth,"Other view")+writeQ("B1_"+t.n,t1)+'</div>'
 +'<div class="card"><h3>Body 2 · my view</h3>'+ideasBox(t.mine,"My view")+writeQ("B2_"+t.n,t2)+'</div>';
 return h}}))});

/* ---------- build */
function build(){
 REG=[];
 document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header><nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">MrIkromov’s IELTS · Instagram @ustoz_jasur · Telegram @TeamMrIkromov</div><div id="toast"></div>';
 const st=$("#steps"),mn=$("#main");
 steps.forEach((s,si)=>{
  const b=document.createElement("button");b.className="step";b.id="st"+si;b.innerHTML=s.label+'<span class="ct" id="ct'+si+'"></span>';b.onclick=()=>showStep(si);st.appendChild(b);
  const sec=document.createElement("section");sec.id="sec"+si;sec.style.display="none";
  if(s.subnav){
   sec.innerHTML='<div class="sec-title"><span class="n">STEP 4</span><h2>Practice tests · 10 questions</h2></div><p class="lead">Use what you learned. For each question, write two body paragraphs: the other view, then your view. Earn a ⭐ for each!</p><div class="nums" id="nv'+si+'"></div><div id="uv'+si+'"></div>';
   mn.appendChild(sec);
   const nv=$("#nv"+si,sec),uv=$("#uv"+si,sec);
   s.units.forEach((u,ui)=>{const nb=document.createElement("button");nb.className="sub";nb.id="u"+si+"_"+ui;nb.textContent=ui+1;nb.onclick=()=>showUnit(si,ui);nv.appendChild(nb);const bx=document.createElement("div");bx.innerHTML=u.html();bx.style.display="none";u.box=bx;uv.appendChild(bx)});
  }else{sec.innerHTML=s.html();mn.appendChild(sec)}
 });
 wire();applyState()}
function showStep(si){ST.step=si;steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});if(steps[si].subnav)showUnit(si,Math.min(ST.unit[si]||0,steps[si].units.length-1));window.scrollTo({top:0});save()}
function showUnit(si,ui){ST.unit[si]=ui;steps[si].units.forEach((u,k)=>{u.box.style.display=k===ui?"":"none";$("#u"+si+"_"+k).classList.toggle("on",k===ui)});save()}
function stepKeys(si){const root=$("#sec"+si);return $$("[data-key]",root).map(e=>e.dataset.key).filter((v,i,a)=>a.indexOf(v)===i&&REG.some(r=>r.key===v))}
function progress(){let tot=REG.length,done=REG.filter(r=>ST.ok[r.key]).length;$("#pbar").style.width=Math.round(done/tot*100)+"%";$("#pnum").textContent=done+" / "+tot+" done";
 steps.forEach((s,si)=>{const ks=stepKeys(si),d=ks.filter(k=>ST.ok[k]).length;const c=$("#ct"+si);if(c){c.textContent=ks.length?d+"/"+ks.length:"";$("#st"+si).classList.toggle("full",ks.length>0&&d===ks.length)}});stars()}
const CHEER=["Great job! 🎉","Excellent! ⭐","You nailed it! 💪","Superb idea! 🚀","Well done! 👏"];
function cheer(){toast(CHEER[Math.floor(Math.random()*CHEER.length)])}
function stars(){let n=0;TOPICS.forEach((t,ui)=>{const a=ST.ok["B1_"+t.n]&&ST.ok["B2_"+t.n];n+=a?1:0;const el=document.getElementById("u3_"+ui);if(el)el.textContent=(ui+1)+(a?" ⭐":"")});const p=document.getElementById("pnum");if(p)p.textContent+="  ·  ⭐ "+n+"/"+TOPICS.length}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function wire(){
 $$("select.sel").forEach(el=>el.addEventListener("change",()=>runSel(el.dataset.key,true)));
 $$("textarea").forEach(ta=>ta.addEventListener("input",()=>{const id=ta.id;if(id.startsWith("ta_")){const k=id.slice(3);ST.saved[k]=ta.value;wc(k)}else{ST.saved[id]=ta.value}save()}));
 document.body.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const k=b.dataset.key,a=b.dataset.act;
  if(a==="hint")$("#hint_"+k).classList.toggle("on");
  if(a==="model")$("#md_"+k).style.display="";
  if(a==="check")runWrite(k);
})}
function wc(k){const ta=$("#ta_"+k),n=nw(ta.value);$("#wc_"+k).textContent=n+" words"}
function runSel(k,say){const r=REG.find(x=>x.key===k),el=$('select[data-key="'+k+'"]'),fb=$("#fb_"+k);if(el.value==="")return;const ok=+el.value===r.ans;el.className="sel "+(ok?"ok":"no");
 const msg=r.fbs?r.fbs[+el.value]:(ok?r.expl:"");
 fb.className="fb on "+(ok?"good":"bad");fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"Correct! ":"Not quite. ")+'</span></div><div class="body">'+esc(msg||"")+'</div>';
 ST.saved[k]=el.value;if(ok){ST.ok[k]=1}else delete ST.ok[k];if(say)save();progress()}
function runWrite(k){const r=REG.find(x=>x.key===k),ta=$("#ta_"+k);if(!ta.value.trim()){toast("Write your paragraph first");return}
 const res=checkBody(ta.value,r.tp),fb=$("#fb_"+k);fb.className="fb on "+res.v;fb.innerHTML=fbHTML(res,"Well done! This is a developed body paragraph.");ta.className=res.v==="good"?"ok":(res.v==="bad"?"no":"");
 if(res.v!=="bad"){if(!ST.ok[k])cheer();ST.ok[k]=1;$("#dn_"+k).textContent="✓ done";$("#md_"+k).style.display=""}else{delete ST.ok[k];$("#dn_"+k).textContent=""}
 save();progress()}
function applyState(){
 REG.forEach(r=>{if(r.kind==="sel"){const v=ST.saved[r.key];if(v==null)return;const el=$('select[data-key="'+r.key+'"]');el.value=v;runSel(r.key,false)}
  else if(r.kind==="write"){const v=ST.saved[r.key];if(v==null)return;const ta=$("#ta_"+r.key);ta.value=v;wc(r.key);{const pv=ST.saved["pl_"+r.key],pe=$("#pl_"+r.key);if(pv!=null&&pe)pe.value=pv}if(ST.ok[r.key])$("#dn_"+r.key).textContent="✓ done"}
});
 showStep(Math.min(ST.step||0,steps.length-1));progress()}
build();window.__T=TOPICS;window.runWrite=runWrite;
})();

</script>
