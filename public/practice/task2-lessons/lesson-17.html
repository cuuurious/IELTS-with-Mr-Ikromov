textarea.ok{border-color:var(--sage);background:var(--sageT)}

.meter{display:flex;gap:5px;flex-wrap:wrap}

.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:17.7px;line-height:1.7;margin-bottom:6px}

.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:13.6px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}

.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}

<script>
(function(){
const CH={id:"wt2-l17-body-causes",kicker:"Writing Task 2 · Lesson 17 · Causes and solutions body paragraphs",title:'How to write <span style="color:#ffd27a">strong body paragraphs</span> for causes and solutions essays',
lead:"Learn from your teacher’s own sample essays: write one paragraph for the reasons and one for the solutions, with fully developed ideas. Then practise on 10 questions."};
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];

const TOPICS=[{"n": 1, "q": "In many countries, people do not do enough to recycle their used materials (glass, paper, and metal). What do you think are the reasons for this? What do you think can be done to solve this problem?", "cause": ["No sense of need → people see little use in recycling → they were never taught its importance at school", "No facilities → few places to dispose of paper and glass → people throw everything away"], "sol": ["School programs → teach children about recycling early → they grow into responsible adults", "Recycling centers → businesses are paid to build them → residents are rewarded for recycling"], "m1": "To start, two main reasons lie behind the low level of recycling. The first one is a lack of awareness. Many people see little use in recycling because they were never taught its importance at school. As a result, they grow into adults who feel no responsibility towards the environment. Another factor is the absence of facilities. Since most neighborhoods have no places to dispose of paper and glass, people simply throw everything away. This means that even those who want to recycle cannot do so.", "m2": "Several solutions can help to tackle this problem. The most effective one is to strengthen school programs on recycling. This can be done by teaching children about the environment from an early age. As a result, they grow into responsible adults who recycle by habit. Another measure is to build recycling centers in every neighborhood. Governments should pay businesses that set up these centers, and the centers could reward residents who bring their waste. In this way, recycling becomes easy and rewarding."}, {"n": 2, "q": "Many parents complain about violence promoted to their children through video games, TV programs and other media. Why is it happening? What can be the solution for it?", "cause": ["Graphic images excite children → they rarely see violence in real life → they keep watching", "Profit motive → producers use violence to hold attention → more viewers mean more money"], "sol": ["Parental supervision → parents monitor screen time → age-restricted content is blocked", "Government control → tech firms build filters → children cannot stream violent content"], "m1": "To start, a few reasons explain why violent content has become so common. First, graphic images excite children because they rarely see violence in real life. As a result, they keep watching, and the content holds their attention. Another factor is profit. Since game and film producers earn more when children watch longer, they deliberately use violence as a tool. This means that the more violence children see, the more money the industry makes.", "m2": "Two solutions can protect children from violent content. The first one is stronger parental supervision. Parents should monitor how long their children use electronic devices and what they watch. More specifically, this can be done by blocking age-restricted content or allowing screen time only in the presence of adults. Another measure is government control. Authorities could require technology companies to build filters that stop children from streaming violent content. In this way, children are shielded before the damage is done."}, {"n": 3, "q": "Many young people today will never be able to afford to buy a house. What has led to this situation? What can be done to remedy it?", "cause": ["Rising prices → land costs and taxes go up → salaries stay the same", "Rural migration → people move to cities for jobs → demand pushes prices higher"], "sol": ["Cheap loans → the state and banks offer low-interest mortgages → young people feel confident to buy", "Saving habits → young people avoid unnecessary spending → they can save for a deposit"], "m1": "To begin with, several reasons explain why many young people cannot afford a home. The most obvious one is rising prices. Land costs and taxes have gone up in recent years, whereas salaries have remained almost the same. As a result, buying a house is far beyond the budget of young earners. Another factor is rural migration. Since more and more people move to cities in search of jobs, demand for housing keeps growing, which pushes prices even higher.", "m2": "Possible solutions to this problem require both state and individual effort. First, the government could help young people to get loans at very low interest rates. This can be done by working with banks to offer special mortgages. As a result, young people would feel more confident about buying a home. Furthermore, young people should avoid unnecessary spending so that they can save money for a deposit. In this way, owning a home becomes a realistic goal."}, {"n": 4, "q": "Art is considered an essential part of all cultures throughout the world. However, these days fewer and fewer people appreciate art and turn their focus to science, technology and business. Why do you think that is? What could be done to encourage more people to take interest in the arts?", "cause": ["Technology everywhere → devices replace manual crafts → little time or reason to practice art", "Practical mindset → schools favor exact sciences over humanities → the arts seem unimportant"], "sol": ["Art through technology → people create music and drawings online → they earn money per view", "More art classes → schools add painting and sculpting → students rediscover interest"], "m1": "To start, a couple of reasons can explain why interest in the arts has fallen. The first one is the spread of technology. Devices now replace many tasks people once did by hand, so there is little time or reason to practice art. As a result, fewer people value crafts such as writing letters by hand. Another factor is a more practical mindset. Since schools give exact sciences more priority than humanities, young people grow up thinking that the arts are unimportant.", "m2": "Two practical measures can bring art back to its former stature. The first one is to combine art with technology. People should be encouraged to create music and drawings on digital devices and to share them on online platforms. This can be done by paying creators for every view, which means that artists can earn a living from their work. Another solution is to add more art classes to the school curriculum. Subjects such as painting and sculpting would help students rediscover their interest in the arts."}, {"n": 5, "q": "Experts say older people were happier and healthier in the past because they did more exercise and spent more time with family and friends, whereas many now suffer from loneliness and health problems. What are the causes of this and what are some solutions?", "cause": ["Changes in family life → more divorces → loneliness in retirement", "Technology → old people stay indoors → less exercise and poor health"], "sol": ["Family values → campaigns and policies → divorce becomes less attractive in later life", "Fitness culture → easier access to sports and health centers → old people become healthier"], "m1": "To begin with, two main reasons explain why older people are less happy and healthy than before. The first one is a change in family life. Since single life has become more attractive, divorce rates have risen, which means loneliness for many retired people. Another factor is technology. Because old people spend more time indoors with screens, they exercise less. As a result, their health suffers.", "m2": "Swift and effective solutions are needed to improve their situation. One measure is to revive family values. Governments should launch social campaigns and reform policies so that divorce becomes a less attractive option later in life. Another solution is to build a culture of fitness among older people. This can be done by making sports facilities and health centers easier to reach, which requires government funds. As a result, older people would be healthier and more active."}, {"n": 6, "q": "Nowadays most people are not as fit and active as they were in the past. What are the main causes of this situation? Suggest some possible solutions.", "cause": ["Processed food → cheap and easy to get → poor diet", "Indoor entertainment → video games and TV replace sport → little physical activity"], "sol": ["Awareness campaigns → media warn about processed food → people choose healthier diets", "Outdoor events → sports events and gatherings → people become more active"], "m1": "To start, one of the main reasons why people are less fit is a change in lifestyle. Processed food is now cheap and easy to get, whereas organic produce is expensive. As a result, many people have a poor diet, which affects their fitness. Another factor is indoor entertainment. Since people spend their free time playing video games and watching TV instead of playing sports, they get very little physical activity.", "m2": "A combined solution is needed to tackle this problem. First, people should be warned about the side-effects of processed food. This can be done through media outlets and government campaigns, which means that more people would choose a healthier diet. Another measure is to encourage outdoor activities. Authorities could organize sporting events and public gatherings that draw people out of their homes. In this way, being active becomes a normal part of daily life."}, {"n": 7, "q": "Some people believe that nowadays too much money is being spent on weddings and birthdays. Why do you think it is happening? What can be done to improve the situation?", "cause": ["Wealth statement → lavish parties show people can afford luxury → raises social rank", "Better economy → more families earn a good living → they can afford expensive celebrations"], "sol": ["Sensible restrictions → limit guests at venues → spending falls", "Social campaigns → TV and the Internet promote thrift → extravagance is frowned upon"], "m1": "To start, reasons for lavish spending on weddings and birthdays vary. The most obvious one is the wish to make a wealth statement. By hosting a luxury party, people try to show that they can afford things others cannot. This means that an expensive celebration helps them raise their rank in society. Another factor is a better economy. Since more families now earn a good living, they can afford costly celebrations.", "m2": "There are a few ways to bring this trend under control. One measure is to set sensible limits on the number of guests. This can be done by restricting the number of seats at restaurants and cafes, which means that governments can curb spending indirectly. Another solution is to run social campaigns on TV and the Internet that promote thrift. As a result, society would frown upon extravagance and accept wise spending."}, {"n": 8, "q": "Poor attendance among school children is growing in many countries. What are the causes? Suggest some solutions.", "cause": ["Lack of motivation → boring lessons and poor equipment → pupils see no point in coming", "Personal and health issues → bullying and illness keep pupils at home → they fall behind"], "sol": ["More engaging lessons → better materials and equipment → pupils enjoy school", "Support for pupils → counseling and after-class help → they feel safe and catch up"], "m1": "To begin with, several factors lie behind poor attendance. The first one is a lack of motivation. Because lessons are often boring and equipment is poor, pupils see no point in coming to school. Another factor is personal and health issues. Bullying and illness keep some pupils at home, which means that they fall behind and lose interest even further.", "m2": "Schools can tackle this problem in two practical ways. The first one is to make lessons more engaging. Teachers should use better materials and modern equipment, which means that pupils would enjoy coming to class. Another solution is to offer support to pupils with personal problems. This can be done through counseling and after-class academic help. As a result, pupils would feel safe at school and catch up with their studies."}, {"n": 9, "q": "Nowadays people waste a lot of food that was bought from shops and restaurants. Why do you think people waste food? What can be done to reduce the amount of food they throw away?", "cause": ["Abundance of food → modern farming makes food cheap → people waste it", "Impulsive buying → food adverts tempt shoppers → they buy more than they need"], "sol": ["Awareness campaigns → social media shows the results of wasting food → people value food again", "Limits on food advertising → less exposure → people buy in moderation"], "m1": "To start, the main reason why people throw away food is its abundance. Modern farming produces food on an industrial scale, which has made it cheaper and easier to get than ever. As a result, people no longer value it and waste it. Another factor is impulsive buying. Since shoppers see a constant stream of food advertisements, they are tempted to buy far more than they need, and most of it ends up in the bin.", "m2": "Two practical solutions can discourage this habit. The first one is to raise public awareness. This can be done through social media campaigns that show the results of wasting food, such as shortages and higher prices. As a result, people would value food again. Another measure is to restrict food advertising. Authorities could limit how often commercials appear, so that people are exposed to fewer temptations and buy in moderation."}, {"n": 10, "q": "Many university students regularly miss lectures and classes. What are the causes of this? What can be done to solve this problem?", "cause": ["Lack of interest → lectures feel dull or irrelevant → students stay away", "Pressure and personal matters → burnout and health problems → they need a break"], "sol": ["Engaging classes → lecturers use compelling materials → students want to attend", "Student support → counseling and academic help after class → fewer reasons to skip"], "m1": "To start, a number of reasons explain why undergraduates skip classes. The main one is a lack of interest. Since many lectures feel dull or irrelevant, students see little reason to attend. As a result, they stay away and study alone. Another factor is academic pressure and personal matters. Burnout and health problems push some students to take a break from classes, which means that absences keep growing.", "m2": "Universities can tackle this problem in two ways. The first one is to make classes more engaging. Lecturers should use compelling materials and interactive tasks, which means that students would want to attend. Another solution is to offer support outside the classroom. This can be done through counseling on personal issues and extra academic help after class. As a result, students would face fewer reasons to skip lessons."}];
const DATA={"EX": [{"src": "Housing", "q": "Many young people today will never be able to afford to buy a house. What has led to this situation? What can be done to remedy it?", "l1": "Reasons", "l2": "Solutions", "b1": [["To start, several reasons can be cited as the main causes to explain why young adults today cannot afford a house.", "T"], ["One such obvious reason is that housing prices in general have risen much over the last years.", "C"], ["This was mainly caused by price surges in space cost and higher taxes.", "E"], ["In my hometown, for instance, the cost of one-square-meter space has gone up by 12% since last year whereas average salary one makes remained virtually the same.", "X"], ["Another significant factor at work is rural migration.", "B"], ["As more and more people move from the countryside in search of jobs and better living standards, there is now greater demand for housing than ever, which also leads to increases in real-estate prices.", "E"]], "b2": [["Possible solutions to deal with this socio-economic problem require both state and individual effort.", "T"], ["Government intervention might be required to help young individuals to receive loans from profitable banks in the area at very low or, if possible, no interest rates.", "C"], ["Having received initial financial support from the state and banks, these people would be more confident and in a better position to make the choice of purchasing a house.", "R"], ["Furthermore, as individuals, young people should also make conscious efforts to avoid frivolous spending so that they can save funds to buy a house later in the future.", "B"]], "note": "Body 1: the topic sentence promises reasons, then each reason gets a claim and an explanation. Body 2: the topic sentence promises solutions; the first solution has a claim and a result, and “Furthermore” starts the second."}, {"src": "Weddings", "q": "Some people believe that nowadays too much money is being spent on weddings and birthdays. Why do you think it is happening? What can be done to improve the situation?", "l1": "Reasons", "l2": "Solutions", "b1": [["Reasons why people spend an excessive amount of money on celebrations such as weddings and birthdays vary.", "T"], ["The most obvious one is to make a wealth statement.", "C"], ["By hosting a lavish party for friends and family in celebration of their birthday or marriage, people often try to create the impression that they can afford luxuries other people cannot.", "E"], ["In a way, this particular display of wealth at parties helps people assert their rank in social hierarchy.", "R"], ["Better economic conditions is another significant factor.", "B"], ["More and more families nowadays earn a good living thanks to the thriving economy, which affords them luxury parties.", "E"]], "b2": [["There are a few ways the trend of overspending at weddings and birthdays can be improved.", "T"], ["One measure would be imposing sensible and sensitive restrictions, one example of which is setting guest limits.", "C"], ["This can be done in a tactful manner by limiting the number of seats available at restaurants and cafes.", "H"], ["This way, government could indirectly curb excessive spending on celebration of special occasions.", "R"], ["Furthermore, social campaigns stressing the importance of frugality and thriftiness should be broadcast on TV and the Internet.", "B"], ["Having done that, government can nurture a culture where extravagance is frowned upon and wise spending practices are socially approved.", "R"]], "note": "A clean model. Body 1: claim, why, result for the first reason, then a shorter second reason. Body 2: measure, “This can be done…” (how), “This way…” (result), then a second measure."}, {"src": "City life", "q": "In some countries the quality of life in larger cities is declining. Why do you think this is happening? What measures can be taken to stop it?", "l1": "Reasons", "l2": "Solutions", "b1": [["The causes of declining life quality in large cities vary.", "T"], ["It is, however, fair to say that the main one is urban overpopulation.", "C"], ["More and more people migrate to megacities such as New York and Hong Kong from their rural dwelling in pursuit of better job prospects and living conditions.", "E"], ["This, as a result, leads to poor management of resources in cities and inevitable harm to the environment, which are two major contributing factors to poor life quality in urban areas.", "R"]], "b2": [["A range of solutions can be offered to address these problems.", "T"], ["Encouraging people to move to the countryside would arguably be the most effective measure by far.", "C"], ["This can be done by facilitating a desirable life in rural areas through the creation of more affordable facilities like healthcare centers, schools, shopping malls as well as offering well-paid jobs.", "H"], ["This way, problems arising from overcrowding, which clearly compromise urban life quality, can effectively be alleviated.", "R"], ["Environmental issues, on the other hand, require a compound solution.", "B"], ["More specifically, the introduction of clean transportation such as electric vehicles in cities, combined with more efficient water and waste treatment systems go a long way to minimizing the harmful effects of ecological problems.", "H"]], "note": "The solution matches the reason: overpopulation is answered by rural development; environmental damage by clean transport and waste systems."}, {"src": "Media violence", "q": "Many parents complain about violence promoted to their children through video games, TV programs and other media. Why is it happening? What can be the solution for it?", "l1": "Reasons", "l2": "Solutions", "b1": [["To start, it is important to understand why violence has become so mainstream these days.", "T"], ["Seeing graphic images excites children as they do not normally encounter violence in the real world.", "C"], ["Entertainment companies, video game and movie producers by extension, leverage on this fact and use it as a tool to keep children interested.", "E"], ["The more violence children see, the longer they are likely to keep watching, which means more profit for those providing such content.", "R"], ["Studies also have shown that constant exposure to violence desensitize children to it and normalize criminal conduct.", "B"]], "b2": [["Given this, certain measures should be taken before children become victims of violent content.", "T"], ["One immediate solution is more parental supervision.", "C"], ["Parents should act more vigilant and carefully monitor how their children spend their time on electronic devices.", "E"], ["More specifically, this can be done by setting limitations on age-restricted content by allowing children to watch media content only in the presence of parents or letting them to do it for a set amount of time.", "H"], ["Government’s role in tackling this issue is also indispensable.", "B"], ["It should charge technology companies with the task of creating algorithms that do not allow children to stream violent content.", "H"]], "note": "Even when the topic sentence is not a promise, it points the right way: “why violence has become so mainstream” (reasons) and “certain measures should be taken” (solutions)."}, {"src": "Older people", "q": "Experts say older people were happier and healthier in the past because they did more exercise and spent more time with family and friends, whereas many now suffer from loneliness and health problems. What are the causes of this and what are some solutions?", "l1": "Reasons", "l2": "Solutions", "b1": [["To start, the chief reason why fewer elderly people are content with their lives and in good shape has evidently to do with changes in social structure and norms.", "T"], ["That is, the growing appeal of single life is partly to blame for higher divorce rates, which ultimately means loneliness for retired people.", "E"], ["This sharply contrasts with the past when divorce was frowned upon and people found happiness in having a loving family.", "X"], ["Technology, as well as helping improve the lives of many, has brought on discontent and poor health among old people.", "B"], ["Were it not for technology, people, old ones in particular, would spend more time outdoors and take up some form of exercise for entertainment.", "E"]], "b2": [["Given the alarming nature of the situation, solutions have to be effective and swift.", "T"], ["One immediate measure is revitalizing family values through government tools.", "C"], ["This, in essence, entails launching social campaigns and making policy reforms that makes divorce the least attractive option after a certain age.", "H"], ["Furthermore, nurturing fitness and health culture among old-age demographics is sure to raise healthiness levels among this target population.", "B"], ["This can be done by facilitating easier access to sport facilities and health centers, which clearly requires government funds.", "H"]], "note": "Body 2 names a solution, says HOW it works (“This … entails …”, “This can be done by …”) and shows the effect. “How” is the extra step that solutions need."}], "G": {"picks": [{"src": "Weddings", "arg": "People want to make a wealth statement.", "topic": "Body 1 · a reason", "opts": ["The most obvious reason is to make a wealth statement. By hosting a lavish party for friends and family, people often try to create the impression that they can afford luxuries other people cannot. In a way, this display of wealth helps people assert their rank in social hierarchy.", "The most obvious reason is to make a wealth statement. People want to show their wealth. Showing wealth is a common reason for big parties.", "The most obvious reason is to make a wealth statement. I think this is stupid, and people should not do it because it is a waste of money.", "The most obvious reason is to make a wealth statement, so the government should limit the number of guests at every wedding."], "ans": 0, "fb": ["", "The reason is only repeated in new words. Where is the explanation (why) and the result?", "This is an opinion, not an explanation. Say WHY people do it and what follows.", "This jumps to a solution. Body 1 explains the reason first; solutions come in Body 2."]}, {"src": "Weddings", "arg": "Limit the number of guests.", "topic": "Body 2 · a solution", "opts": ["One measure would be setting guest limits. This can be done in a tactful manner by limiting the number of seats available at restaurants and cafes. This way, government could indirectly curb excessive spending on special occasions.", "One measure would be setting guest limits. Guest limits are a good solution. They would be very helpful for everybody.", "Guest limits are needed because people want to show their wealth, and parties are now much more expensive than before.", "One measure would be setting guest limits. I believe it is a great idea and I would like it to happen in my country."], "ans": 0, "fb": ["", "The solution is only repeated. Say HOW it can be done and what the result is.", "This explains a cause, not a solution. Body 2 should say what to do and how.", "An opinion with “I believe” does not show how the solution works. Add the how and the result."]}, {"src": "Housing", "arg": "People move from the countryside to cities.", "topic": "Body 1 · a reason", "opts": ["Another significant factor is rural migration. As more and more people move from the countryside in search of jobs and better living standards, there is now greater demand for housing than ever, which leads to higher prices.", "Another significant factor is rural migration. Rural migration is a big problem. Many people move and this is a problem for young people.", "Another significant factor is rural migration, so the government should build new houses in villages and give loans to families.", "Another significant factor is rural migration. Last year my cousin moved to Tashkent and now he pays too much for his flat."], "ans": 0, "fb": ["", "This only repeats the reason. Say WHY migration makes houses expensive.", "This turns into a solution. Keep Body 1 for reasons.", "A personal story is not an explanation. Say WHY migration raises prices and what follows."]}], "w1": {"src": "Graduates’ skills", "kind": "cause", "tag": "Body 1 · reasons", "q": "Some businesses observe that new employees who just graduated from a college or university seem to lack the interpersonal skills needed for communication with their colleagues. What could be the reason for this? What solutions can help address this problem?", "ch": ["Weak practical training → few chances to work with others at college → social skills stay undeveloped", "Exam-based assessment → students work alone → they never learn teamwork"], "model": "To start, two main reasons explain why new graduates lack interpersonal skills. The first one is weak practical training. Since most colleges offer few chances to work with others, students never develop their social skills. Another factor is the way colleges assess students. Because grades depend on individual papers and exams, students work alone for years. As a result, they enter the workplace without any experience of teamwork."}, "w2": {"src": "City life", "kind": "sol", "tag": "Body 2 · solutions", "q": "In some countries the quality of life in larger cities is declining. Why do you think this is happening? What measures can be taken to stop it?", "ch": ["Rural development → build hospitals, schools and jobs outside cities → fewer people move to cities", "Clean technology → electric transport and better waste systems → less pollution"], "model": "A range of solutions can improve life in large cities. The most effective one is to make rural areas more attractive. Governments should build hospitals, schools and shopping centers in the countryside and offer well-paid jobs there. As a result, fewer people would move to overcrowded cities. Another measure is to introduce clean technology. This can be done by promoting electric vehicles and building efficient waste and water treatment systems, which means that pollution would fall."}}};
/* ---------- checker */
const REAS=/\b(reasons?|causes?|factors?|explained?|explain|attributed|underlying|behind|stem\w*|give(n)? rise to|root|why)\b/i;
const SOLN=/\b(solutions?|measures?|steps?|ways|remed\w+|counter\w*|mitigat\w+|curb\w*|tackl\w+|address\w*|propos\w+|suggest\w*|actions?|improv\w+|solv\w+|resolv\w+|discourag\w+|reduc\w+|revive|reverse|fix\w*|combat\w*|prevent\w*|stop\w*)\b/i;
const CNO=/\b(solutions?|measures?|steps|should|must|can be done|could be done|ought to)\b/i;
const EXPL=/\b(because|since|this is why|due to|in other words|that is|this is|which means|owing to|this can be attributed|more specifically|as it|as they|as the|seeing as|so that|whereas|thanks to|by (hosting|\w+ing))\b/i;
const RESU=/\b(as a result|therefore|thus|consequently|this leads|leads to|this means|which means|in turn|hence|results in|resulting|means that|so they|so it|so that|so the|so people|and this|gives? rise|causing|as such|in this way|this way|for this reason|which leads|which makes|which causes|which results|which can|which may|which pushes|so )\b/i;
const ADD=/\b(furthermore|moreover|besides|in addition|another|also|what is more|apart from|on top of|one other|finally|firstly|secondly|first|second|next)\b/i;
const ACT=/\b(should|could|can be|would|must|need to|needs to|ought|requires?|entails?|are needed|is needed)\b/i;
const HOW=/\b(this can be done|can be done|by \w+ing|through|more specifically|this requires|this entails|this involves|in practice|for example|such as)\b/i;
const W=t=>(t.toLowerCase().match(/[a-z']+/g)||[]);
function run(a,b){let best=0;for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)if(a[i]===b[j]){let k=0;while(i+k<a.length&&j+k<b.length&&a[i+k]===b[j+k])k++;if(k>best)best=k}return best}
const chainText=c=>c.replace(/→/g," ");
const stem=s=>[...new Set((s.toLowerCase().match(/[a-z]+/g)||[]).filter(w=>w.length>=5).map(w=>w.slice(0,5)))];
function checkBody5(text,tp){
  const w=W(text),n=w.length,ss=text.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>1);
  const first=ss[0]||"",sol=tp.kind==="sol";
  const kwList=tp.kw||stem(tp.ch.join(" "));
  const kwHit=kwList.filter(k=>text.toLowerCase().includes(k)).length;
  const cp=Math.max(run(w,W(chainText(tp.ch[0]))),run(w,W(chainText(tp.ch[1]))));
  const hasI=/\b(i|my|we|me|our)\b/i.test(text);
  const c=[
   sol?{ok:SOLN.test(first)&&!/\b(reasons?|causes?|factors?)\b/i.test(first),crit:1,label:"Topic sentence",bad:"Start the solutions paragraph by promising solutions: “A range of solutions can be offered…”, “There are a few ways … can be improved.”, “Possible solutions … require …”.",good:"Your topic sentence introduces the solutions."}
       :{ok:REAS.test(first)&&!SOLN.test(first),crit:1,label:"Topic sentence",bad:"Start the reasons paragraph by naming the reasons: “To start, several reasons can be cited…”, “The causes of … vary.”, “To begin with, two main factors lie behind …”.",good:"Your topic sentence introduces the reasons."},
   sol?{ok:ACT.test(text),crit:1,label:"Action",bad:"Say what should be done: “should”, “could”, “would”, “can be …”.",good:"You say what should be done."}
       :{ok:!CNO.test(text),crit:1,label:"Reasons only",bad:"Body 1 is only about reasons. Remove “should”, “measures” and “solutions”: they belong in Body 2.",good:"Only reasons: correct."},
   sol?{ok:HOW.test(text),crit:1,label:"How",bad:"Explain HOW the solution works: “This can be done by…”, “More specifically, …”, “through …”.",good:"You show how."}
       :{ok:EXPL.test(text),crit:1,label:"Explain",bad:"Explain WHY: “This is because…”, “Since…”, “Because…”, “which means…”.",good:"You explain."},
   {ok:RESU.test(text),crit:1,label:"Result",bad:"Show the RESULT: “As a result,…”, “This means that…”, “This way,…”.",good:"You show results."},
   {ok:ADD.test(text),crit:1,label:"Second idea",bad:"Start your second idea with “Another factor/measure is…”, “Furthermore,…” or “Besides,…”.",good:"You link to a second idea."},
   {ok:!hasI,crit:1,label:"No opinion",bad:"Remove “I”, “my” and “we”. Write in a neutral voice.",good:"No opinion: correct."},
   {ok:ss.length>=5,crit:1,label:"5+ sentences",bad:"A full body paragraph has a topic sentence and two ideas, each explained: about 5–8 sentences.",good:ss.length+" sentences."},
   {ok:cp<9,crit:1,label:"Own words",bad:"You copied "+cp+" words in a row from the ideas. Use your own words.",good:"Written in your own words."},
   {ok:kwHit>=3,crit:1,label:"On idea",bad:"Develop the two ideas shown. Use their key words or synonyms.",good:"Develops the ideas."},
   {ok:n>=45&&n<=190,crit:0,label:"Length",bad:n<45?"A bit short ("+n+" words). A body paragraph is about 70–120 words.":"A bit long ("+n+" words). Aim for 70–120 words.",good:n+" words: a good length."},
   {ok:text.indexOf("→")<0,crit:0,label:"Full sentences",bad:"Replace the arrows with full sentences.",good:"Full sentences."}].filter(x=>!(x.ok&&!x.crit&&!x.bad));
  const crit=c.filter(x=>x.crit),okc=crit.filter(x=>x.ok).length,tips=c.filter(x=>!x.crit&&!x.ok).length;
  return {c,v:okc===crit.length&&tips===0?"good":okc>=crit.length-1?"mid":"bad"}}
function checkBody(t,tp){return checkBody5(t,tp)}
function fbHTML(r,done){
  const vd={good:done||"Well done!",mid:"Nearly there: add the missing move.",bad:"Not yet. Fix the red points and check again."}[r.v];
  return '<div class="hd"><span class="vd">'+vd+'</span><span class="meter">'+r.c.map(x=>'<span class="'+(x.ok?"ok":(x.crit?"no":"tip"))+'">'+(x.ok?"✓ ":"✗ ")+x.label+'</span>').join("")+'</span></div><div class="body">'+
  r.c.filter(x=>!x.ok).map(x=>'<div class="it '+(x.crit?"structure":"style")+'"><div><span class="k">'+(x.crit?"must fix":"tip")+'</span>'+esc(x.bad)+'</div></div>').join("")+
  r.c.filter(x=>x.ok).map(x=>'<div class="it praise"><div><span class="k">ok</span>'+esc(x.good)+'</div></div>').join("")+'</div>'}

let REG=[];
function selQ(key,label,opts,ans,expl,num){
  REG.push({key,kind:"sel",ans,expl});
  return '<div class="q" data-key="'+key+'"><div class="p"><span class="num">'+num+'</span>'+label+'</div><select class="sel" data-key="'+key+'"><option value="">Choose…</option>'+opts.map((o,i)=>'<option value="'+i+'">'+esc(o)+'</option>').join("")+'</select><div class="fb" id="fb_'+key+'"></div></div>'}
function rng(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
function shuf(a,seed){const r=rng(seed),b=a.map((x,i)=>i);for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function selS(key,label,opts,ans,expl,num){const p=shuf(opts,key);return selQ(key,label,p.map(i=>opts[i]),p.indexOf(ans),expl,num)}
function pickQ(key,g,num){

const seg=(c,l,t)=>'<div class="seg '+c+'"><div class="st">'+l+'</div>'+esc(t)+'</div>';

const HINT={cause:'<b>Plan:</b> Topic sentence (<b>To start, … reasons … / The causes of … vary</b>) → Reason 1: claim, <b>This is because…</b>, <b>As a result…</b> → <b>Another factor is…</b> Reason 2 → explain and result. Reasons only. No “I”. (70–120 words)',

const EXC=DATA.EX,G=DATA.G;
steps.push({label:"1 Learn",html:()=>{
 const e1=EXC[1];
 let h='<div class="sec-title"><span class="n">STEP 1</span><h2>Learn: body paragraphs for “causes and solutions” essays</h2></div>';
 h+='<div class="card"><h3>1 · The essay map</h3><p class="lead">Your teacher’s sample essays have <b>two body paragraphs</b>: Body 1 explains the <b>reasons</b>, Body 2 gives the <b>solutions</b>. Each paragraph has two ideas. There is no opinion, so both are written in a neutral voice.</p><table class="t"><tr><th>Paragraph</th><th>Its job</th><th>It starts with…</th></tr>'
 +'<tr><td><b>Introduction</b></td><td>Paraphrase + promise reasons and solutions (Lesson 16)</td><td>There are several reasons why …, and … can be addressed in two ways.</td></tr>'

 h+='<div class="card"><h3>2 · Topic sentences from the samples</h3><table class="t"><tr><th>Body 1 · reasons</th><th>Body 2 · solutions</th></tr>'
 +'<tr><td>To start, several reasons can be cited as the main causes to explain why young adults today cannot afford a house.</td><td>Possible solutions to deal with this socio-economic problem require both state and individual effort.</td></tr>'
 +'<tr><td>Reasons why people spend an excessive amount of money on celebrations such as weddings and birthdays vary.</td><td>There are a few ways the trend of overspending at weddings and birthdays can be improved.</td></tr>'

 h+='<div class="card"><h3>3 · The key skill: turn an argument into a developed idea</h3><p class="lead">In your notes an idea is only a few words (“wealth statement”, “guest limits”). A <b>developed idea</b> answers three questions. Reasons and solutions use the same pattern, but the middle step is different.</p><table class="t"><tr><th>Question</th><th>Body 1 · a reason</th><th>Body 2 · a solution</th></tr>'
 +'<tr><td><b>What?</b></td><td><b>Claim:</b> The most obvious one is … · Another significant factor at work is … · Better economic conditions is another significant factor.</td><td><b>Claim:</b> One measure would be … · One immediate solution is … · Encouraging people to … would be the most effective measure.</td></tr>'
 +'<tr><td><b>Why / How?</b></td><td><b>Explain (why):</b> This is because … · As more and more people … · By hosting …, people try to …</td><td><b>How:</b> This can be done by … · More specifically, … · This entails …</td></tr>'
 +'<tr><td><b>So what?</b></td><td><b>Result:</b> This, as a result, leads to … · In a way, this helps … · This means …</td><td><b>Result:</b> This way, … · Having done that, … · As a result, …</td></tr></table></div>';
 const LAD=[["Level 1 · Idea only","Setting guest limits.","This is only a claim. A paragraph made of these stays empty."],["Level 2 · + How","One measure would be imposing sensible restrictions, one example of which is setting guest limits. This can be done in a tactful manner by limiting the number of seats available at restaurants and cafes.","Better: now the reader knows how it works."],["Level 3 · + Result","One measure would be imposing sensible restrictions, one example of which is setting guest limits. This can be done in a tactful manner by limiting the number of seats available at restaurants and cafes. This way, government could indirectly curb excessive spending on celebration of special occasions.","Fully developed: claim → how → result. This is the real sample (weddings)."]];
 h+='<div class="card"><h3>4 · From an idea to a fully developed solution</h3><p class="lead">One solution from your teacher’s sample essay, built in three levels. A reason is built the same way: claim → why → result.</p>'+LAD.map((r,i)=>'<div class="seg '+["s","v","n"][i]+'" style="margin:6px 0"><div class="st">'+r[0]+'</div>'+esc(r[1])+'<div style="font-size:14px;margin-top:4px;color:#445">▸ '+esc(r[2])+'</div></div>').join("")+'<div class="note"><b>Rule:</b> every idea needs a <b>Claim</b> and a <b>Why / How</b>. Strong ideas also show a <b>Result</b>.</div></div>';
 const S1=[["1 · Topic sentence","Promise the reasons.","To start, several reasons … · The causes of … vary. · … can be cited as the main causes"],
 ["2 · Claim (first reason)","Name the first reason in one sentence.","The most obvious one is … · One such obvious reason is that … · The main one is …"],
 ["3 · Explain","Say why it is a reason.","This is because … · As more and more people … · That is, … · By …, people …"],
 ["4 · Result","Show what happens because of it.","This, as a result, leads to … · This means … · In a way, this helps …"],
 ["5 · Second reason","Start a new reason with a link. Repeat steps 2–4 in a shorter form.","Another significant factor at work is … · … is another significant factor. · Finally, …"]];
 const S2=[["1 · Topic sentence","Promise the solutions.","A range of solutions can be offered … · There are a few ways … · Possible solutions … require …"],
 ["2 · Claim (first solution)","Name the first solution in one sentence.","One measure would be … · One immediate solution is … · … would arguably be the most effective measure."],
 ["3 · How","Say how it can be done.","This can be done by … · More specifically, … · This entails … · It should charge … with the task of …"],
 ["4 · Result","Show what it achieves.","This way, … · Having done that, … · As a result, …"],
 ["5 · Second solution","Start a new solution with a link. Repeat steps 2–4 in a shorter form.","Furthermore, … · Another measure is … · … is also indispensable."]];
 h+='<div class="card"><h3>5 · Build the paragraphs in order: five steps each</h3><div class="grp">Body 1 · reasons</div><table class="t"><tr><th>Step</th><th>What you do</th><th>Phrases from the samples</th></tr>'+S1.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join("")+'</table><div class="grp">Body 2 · solutions</div><table class="t"><tr><th>Step</th><th>What you do</th><th>Phrases from the samples</th></tr>'+S2.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join("")+'</table><div class="grp">Real Body 2 · '+e1.src+'</div>'+cparts(e1.b2)+'<div class="note">'+esc(e1.note)+'</div></div>';
 h+='<div class="card"><h3>6 · Do and don’t</h3><table class="t"><tr><th>Do ✓</th><th>Don’t ✗</th></tr><tr><td>Body 1 for the reasons, Body 2 for the solutions.<br>Give two ideas in each paragraph.<br>Explain every reason: “This is because…”<br>Show how every solution works: “This can be done by…”<br>Show a result: “As a result…”, “This way…”.</td><td>Don’t write “I think” or give an opinion.<br>Don’t put solutions in Body 1 or reasons in Body 2.<br>Don’t just repeat the idea in new words.<br>Don’t list ideas without explaining them.</td></tr></table></div>';
 return h}});

/* ---------- build */
function build(){
 REG=[];
 document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header><nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">MrIkromov’s IELTS · Instagram @ustoz_jasur · Telegram @TeamMrIkromov</div><div id="toast"></div>';
 const st=$("#steps"),mn=$("#main");
 steps.forEach((s,si)=>{
  const b=document.createElement("button");b.className="step";b.id="st"+si;b.innerHTML=s.label+'<span class="ct" id="ct'+si+'"></span>';b.onclick=()=>showStep(si);st.appendChild(b);
  const sec=document.createElement("section");sec.id="sec"+si;sec.style.display="none";
  if(s.subnav){
   sec.innerHTML='<div class="sec-title"><span class="n">STEP 4</span><h2>Practice tests · 10 questions</h2></div><p class="lead">Use what you learned. For each question, write two body paragraphs: the reasons, then the solutions. Earn a ⭐ for each!</p><div class="nums" id="nv'+si+'"></div><div id="uv'+si+'"></div>';
   mn.appendChild(sec);
   const nv=$("#nv"+si,sec),uv=$("#uv"+si,sec);
   s.units.forEach((u,ui)=>{const nb=document.createElement("button");nb.className="sub";nb.id="u"+si+"_"+ui;nb.textContent=ui+1;nb.onclick=()=>showUnit(si,ui);nv.appendChild(nb);const bx=document.createElement("div");bx.innerHTML=u.html();bx.style.display="none";u.box=bx;uv.appendChild(bx)});
  }else{sec.innerHTML=s.html();mn.appendChild(sec)}
 });
 wire();applyState()}
function showStep(si){ST.step=si;steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});if(steps[si].subnav)showUnit(si,Math.min(ST.unit[si]||0,steps[si].units.length-1));window.scrollTo({top:0});save()}
function showUnit(si,ui){ST.unit[si]=ui;steps[si].units.forEach((u,k)=>{u.box.style.display=k===ui?"":"none";$("#u"+si+"_"+k).classList.toggle("on",k===ui)});save()}
function stepKeys(si){const root=$("#sec"+si);return $$("[data-key]",root).map(e=>e.dataset.key).filter((v,i,a)=>a.indexOf(v)===i&&REG.some(r=>r.key===v))}
function progress(){let tot=REG.length,done=REG.filter(r=>ST.ok[r.key]).length;$("#pbar").style.width=Math.round(done/tot*100)+"%";$("#pnum").textContent=done+" / "+tot+" done";
 steps.forEach((s,si)=>{const ks=stepKeys(si),d=ks.filter(k=>ST.ok[k]).length;const c=$("#ct"+si);if(c){c.textContent=ks.length?d+"/"+ks.length:"";$("#st"+si).classList.toggle("full",ks.length>0&&d===ks.length)}});stars()}
const CHEER=["Great job! 🎉","Excellent! ⭐","You nailed it! 💪","Superb idea! 🚀","Well done! 👏"];
function cheer(){toast(CHEER[Math.floor(Math.random()*CHEER.length)])}
function stars(){let n=0;TOPICS.forEach((t,ui)=>{const a=ST.ok["B1_"+t.n]&&ST.ok["B2_"+t.n];n+=a?1:0;const el=document.getElementById("u3_"+ui);if(el)el.textContent=(ui+1)+(a?" ⭐":"")});const p=document.getElementById("pnum");if(p)p.textContent+="  ·  ⭐ "+n+"/"+TOPICS.length}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function wire(){
 $$("select.sel").forEach(el=>el.addEventListener("change",()=>runSel(el.dataset.key,true)));
 $$("textarea").forEach(ta=>ta.addEventListener("input",()=>{const id=ta.id;if(id.startsWith("ta_")){const k=id.slice(3);ST.saved[k]=ta.value;wc(k)}else{ST.saved[id]=ta.value}save()}));
 document.body.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const k=b.dataset.key,a=b.dataset.act;
  if(a==="hint")$("#hint_"+k).classList.toggle("on");
  if(a==="model")$("#md_"+k).style.display="";
  if(a==="check")runWrite(k);
})}
function wc(k){const ta=$("#ta_"+k),n=nw(ta.value);$("#wc_"+k).textContent=n+" words"}
function runSel(k,say){const r=REG.find(x=>x.key===k),el=$('select[data-key="'+k+'"]'),fb=$("#fb_"+k);if(el.value==="")return;const ok=+el.value===r.ans;el.className="sel "+(ok?"ok":"no");
 const msg=r.fbs?r.fbs[+el.value]:(ok?r.expl:"");
 fb.className="fb on "+(ok?"good":"bad");fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"Correct! ":"Not quite. ")+'</span></div><div class="body">'+esc(msg||"")+'</div>';
 ST.saved[k]=el.value;if(ok){ST.ok[k]=1}else delete ST.ok[k];if(say)save();progress()}
function runWrite(k){const r=REG.find(x=>x.key===k),ta=$("#ta_"+k);if(!ta.value.trim()){toast("Write your paragraph first");return}
 const res=checkBody(ta.value,r.tp),fb=$("#fb_"+k);fb.className="fb on "+res.v;fb.innerHTML=fbHTML(res,"Well done! This is a developed body paragraph.");ta.className=res.v==="good"?"ok":(res.v==="bad"?"no":"");
 if(res.v!=="bad"){if(!ST.ok[k])cheer();ST.ok[k]=1;$("#dn_"+k).textContent="✓ done";$("#md_"+k).style.display=""}else{delete ST.ok[k];$("#dn_"+k).textContent=""}
 save();progress()}
function applyState(){
 REG.forEach(r=>{if(r.kind==="sel"){const v=ST.saved[r.key];if(v==null)return;const el=$('select[data-key="'+r.key+'"]');el.value=v;runSel(r.key,false)}
  else if(r.kind==="write"){const v=ST.saved[r.key];if(v==null)return;const ta=$("#ta_"+r.key);ta.value=v;wc(r.key);{const pv=ST.saved["pl_"+r.key],pe=$("#pl_"+r.key);if(pv!=null&&pe)pe.value=pv}if(ST.ok[r.key])$("#dn_"+r.key).textContent="✓ done"}
});
 showStep(Math.min(ST.step||0,steps.length-1));progress()}
build();window.__T=TOPICS;window.runWrite=runWrite;
})();
