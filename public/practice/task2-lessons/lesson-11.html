<script>
(function(){
const CH={id:"wt2-l11-body-advdis",kicker:"Writing Task 2 · Lesson 11 · Advantages and disadvantages body paragraphs",title:'How to write <span style="color:#ffd27a">strong body paragraphs</span> for advantages and disadvantages essays',

const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];

const TOPICS=[{"n": 1, "q": "The personal information of many individuals is held by large internet companies and organizations. What are the advantages and the disadvantages of this?", "adv": ["Free access to platforms → advertisers pay for the services → users pay nothing", "Better targeted adverts → firms use personal data to tailor offers → customers see products that suit their needs"], "dis": ["Concerns over privacy → hackers and companies can track online activity → personal details leak or are used as leverage", "Abuse of power → algorithms and censorship shape what people see → election results can be manipulated"], "m1": "To start, large online companies holding users’ data brings some clear benefits. The most obvious one is free access to popular platforms. This is because advertisers pay for these services, so users do not have to. As a result, billions of people can communicate and entertain themselves at no cost. Besides, personal data lets firms tailor advertisements to each customer’s needs. This means that shoppers see offers that suit them, which makes buying and selling more meaningful for both sides.", "m2": "That said, the practice is not without its drawbacks. The main concern is privacy. Powerful companies and hackers can track people’s online activity, so personal details may leak or be used as leverage against users. As a result, many people feel exposed and unsafe online. Another drawback is abuse of power. Some platforms use algorithms and censorship to shape what voters see, which means election results can be manipulated. In this way, a few firms gain too much influence over public life."}, {"n": 2, "q": "Recent advances in medicine have resulted in an increase in life expectancy. What are the advantages and disadvantages?", "adv": ["A bigger workforce → retirement age can rise to 70 or more → labor shortages ease and the economy benefits", "More time with family → people spent their younger years working → they enjoy children and grandchildren in old age"], "dis": ["Fewer jobs for young people → employers keep older workers → young people face economic hardship", "Overpopulation → more people need food, space and resources → shortages and pollution"], "m1": "To begin with, a longer life expectancy has some clear advantages. One is a bigger workforce. Since people now stay healthy for longer, the retirement age can be raised to 70 or above. This means that labor shortages ease, which benefits the economy. Another benefit is more time with family. Most people spend their younger years working, so they have little time for relatives. Thanks to modern medicine, they can now enjoy the company of their children and grandchildren in old age.", "m2": "However, longer life expectancy is not without its downsides. The first drawback is fewer jobs for the young. Because employers can keep older workers without losing productivity, fewer positions are left for school leavers. As a result, young people face economic hardship. Another problem is overpopulation. As more people live longer, demand for food, housing and resources keeps growing, which leads to shortages and pollution. In the long run, this puts heavy pressure on societies."}, {"n": 3, "q": "In the future, all cars, buses and trucks will be driverless. The only people travelling inside these vehicles will be passengers. What are the advantages and the disadvantages?", "adv": ["Safety → computers control the cars so human error disappears → fewer road accidents", "Efficiency → AI picks the best route and speed → fewer traffic jams and less fuel used"], "dis": ["Unemployment → truck and taxi drivers lose their jobs → families lose income and the economy suffers", "Cost and security → cars are expensive and can be hacked → ordinary people cannot afford them and traffic could stop"], "m1": "To start, driverless vehicles would bring several advantages. The most obvious benefit is safety. This is because most accidents are caused by human error, so computer-controlled vehicles should be involved in far fewer crashes. As a result, fewer people would be injured on the roads. Besides, vehicles guided by AI can choose the best route and speed. This means less congestion and lower fuel use, which saves time and money.", "m2": "Nevertheless, cars without drivers are not free of drawbacks. One major concern is unemployment. Millions of people work as truck and taxi drivers, so automation would leave many of them without a job. As a result, families would lose their income and the economy could suffer. Another disadvantage is cost and security. Most self-driving cars are very expensive, which means ordinary people cannot afford them. Moreover, a single hack could stop traffic, since the vehicles depend on software."}, {"n": 4, "q": "Some students take one year off between finishing high school and going to university, in order to travel or to work. What are the advantages and disadvantages?", "adv": ["Maturity and independence → travelling widens their outlook → more mature students", "Earning money → savings pay for tuition → a better education becomes affordable"], "dis": ["Academic life suffers → students fall behind their peers → university courses are hard to catch up with", "Loss of interest in studying → earning gives a false sense of financial security → education takes a back seat"], "m1": "To start, taking a gap year has some obvious advantages. Firstly, travelling makes students more mature. This is because seeing new places broadens their outlook and teaches them to be independent. As a result, they start university better prepared for adult life. Besides, working during the year allows them to earn money. This means they can save for tuition, which makes a better education affordable.", "m2": "Despite this, a gap year is not without its downsides. The most evident one is that studies may suffer. Students who pause their education often struggle to catch up with their peers, since university courses are more complex. As a result, their grades can drop. Another problem is loss of interest. Once they earn their own money, they develop a false sense of financial security, which means education takes a back seat to work."}, {"n": 5, "q": "The increasing demand for oil and gas has made it necessary to look for these energy sources in remote and untouched natural places. What are the advantages and disadvantages of locating oil and gas in these areas?", "adv": ["A practical energy solution → extra supply lowers fuel prices → producers raise their revenue", "More jobs → drilling and transport need workers → people earn a living and the economy grows"], "dis": ["Environmental damage → drilling destroys wildlife and habitats → pristine wilderness degrades", "Resource depletion → oil and gas are non-renewable → energy crisis and recession"], "m1": "To begin with, searching for oil in remote areas offers economic benefits. First, it is a practical answer to growing energy needs. This is because extra supply can lower fuel prices while producers increase their revenue. As a result, both consumers and companies gain. Furthermore, new drilling sites create jobs, since workers are needed to extract and transport the fuel. This means more people earn a living, which supports economic growth.", "m2": "That said, the practice has serious drawbacks. The most concerning one is environmental damage. Drilling destroys wildlife and its habitat and causes pollution, so pristine wilderness slowly degrades. As a result, ecosystems that took centuries to form may be lost. Another concern is the depletion of resources. Oil and gas are non-renewable, which means expanding production drains limited reserves. In turn, this could lead to an energy crisis and a global recession."}, {"n": 6, "q": "The development of tourism contributed to English becoming the most prominent language in the world. Some people think that this will lead to English becoming the only language to be spoken globally. What are the advantages and disadvantages to having one language in the world?", "adv": ["Easier communication → no language barrier → fewer misunderstandings, simpler travel and trade", "Stronger links between nations → people understand each other’s mindsets → better cooperation"], "dis": ["Loss of minority cultures → languages carry traditions → customs and heritage disappear", "A language elite → native speakers gain an edge → learners are left behind"], "m1": "To start, a single world language would bring some real benefits. The most immediate one is easier communication. Since everyone could understand each other, language barriers and misunderstandings would largely disappear. As a result, travel, trade and study abroad would become much simpler. Another advantage is stronger links between nations. This is because people who share a language are more willing to understand each other’s mindsets, which leads to better cooperation.", "m2": "However, there are concerns about having one dominant language. For one, minority cultures could be lost. This is because languages carry traditions and customs, so when a language is abandoned, its heritage fades. As a result, much of the world’s cultural variety may vanish. Another drawback is the rise of a language elite. Native speakers of the dominant language would gain an edge in jobs and education, which means those still learning it would be left behind."}, {"n": 7, "q": "People are using a lot of online language translation apps. What are the advantages and disadvantages?", "adv": ["Instant communication → apps translate between speakers → no human interpreter is needed", "Low cost → many apps are free or cheap → much cheaper than professionals"], "dis": ["Mistakes → programs make errors in grammar, word choice and context → meanings change", "Over-reliance by learners → students copy translations → weaker language skills"], "m1": "To start with the benefits, translation apps allow instant communication. People can talk to foreigners without needing a human interpreter, because software translates their words immediately. As a result, travelling and doing business abroad become far more convenient. Besides, these tools save money. Many apps are free, and paid ones cost much less than a professional translator since millions of users share the cost.", "m2": "Having said that, online translators are not without their downsides. One major issue is mistakes. These programs often make errors in grammar, word choice and context, so the meaning of a text can change. As a result, readers may misunderstand important messages. Another drawback is that language learners start to rely on them. Because students can simply copy a translation, they practice less, which means their own skills improve more slowly."}, {"n": 8, "q": "Nowadays online education has become popular as more institutions and companies are offering courses online. However, many people prefer the traditional, classroom training or study. Discuss the advantages and disadvantages of both methods.", "adv": ["Online study is cheaper → no transport or food costs → people on a tight budget can afford to study", "Classroom study is social → contact with classmates and feedback → an experience online cannot copy"], "dis": ["Online technical problems → poor connections and power cuts → lessons are interrupted", "Classroom availability → employees must take time off work → lost working hours"], "m1": "To start, both methods of learning have clear advantages. Online study costs less. Since learners do not travel to a school, they spend nothing on transport, and they also save on food and clothing. This means that those on a tight budget can still afford to study. As for classroom learning, its main benefit is social experience. Talking to classmates and receiving feedback in person is hard to copy online, which is why many students value it.", "m2": "Nevertheless, neither method is without drawbacks. The main challenge of online study is technical trouble. Poor internet connections and power cuts, especially in remote villages, can interrupt lessons. As a result, learners fall behind and lose confidence in distance learning. Classroom courses have a different problem: availability. Employees must take time off work to attend them, which means they lose working hours unless their schedule is flexible. Moreover, this can be inconvenient for companies."}, {"n": 9, "q": "Many university students live with their families, while others live away from home because their universities are in different places. What are the advantages and disadvantages of both situations?", "adv": ["Staying with family → emotional stability since they know the place and people → less anxiety", "Living away → students make their own decisions → more confidence and maturity"], "dis": ["Staying at home → fewer chances to try new things → slow personal growth and dependence on parents", "Living away → students manage their own money → risk of reckless spending and social disorientation"], "m1": "To start, both choices have clear benefits. Living with parents offers emotional stability. Because students already know the place and its people, they do not need to adapt to a new environment. This means they avoid much of the anxiety that newcomers feel. Besides, living away from home builds independence. When students make decisions about money, food and their future on their own, their confidence grows, which helps them mature faster.", "m2": "However, both options come with drawbacks. Students who stay at home have fewer chances to try new things. This is because they remain in a familiar routine, so they may depend too much on their parents. As a result, their personal growth can be slow. Moreover, those who move away must manage their own money, which means reckless spending is a real risk. They may also feel social disorientation while adjusting to the norms of an unfamiliar place."}, {"n": 10, "q": "Nowadays a few people take their family with them abroad whenever they go on a business trip. What are the advantages and disadvantages for them and for their family?", "adv": ["Peace of mind → workers miss their families on long trips → comfort and focus on the job", "New experiences → relatives see new places and try local food → a broader outlook, especially for children"], "dis": ["Distraction → problems with accommodation or sick children → lower productivity", "Social disorientation → children change schools too often → they feel disconnected from their surroundings"], "m1": "To start, taking relatives along on a business trip brings some benefits. The first is peace of mind. Workers naturally miss their families when away for a long time. This is because they are far from home, so having them nearby is a great comfort. This means they can focus on their duties without feeling lonely. Besides, relatives get a chance to experience new cultures. Visiting new places and trying local food broadens their outlook, which is valuable for children in particular.", "m2": "However, the arrangement is not without its drawbacks. Family members can be a real source of distraction. Problems such as finding suitable accommodation or looking after sick children may take attention away from work, which means productivity falls. As a result, the quality of the business trip suffers. Another downside concerns children. If parents travel constantly, children change schools too often, so they may suffer social disorientation and feel disconnected from their surroundings."}];
const DATA={"EX": [{"src": "Public transport", "q": "In some countries the government promotes public transport as the primary means of transportation, and discourages private vehicle ownership. What are the advantages and disadvantages of this policy?", "l1": "Advantages", "l2": "Disadvantages", "b1": [["Two primary benefits of pursuing the policy of prioritizing public transportation over private vehicles are environmental conservation and improved safety.", "T"], ["Human detriment to the environment is minimized when people choose to travel by public transport such as buses and trains seeing as this mode of travelling diminishes carbon output and release of harmful pollutants.", "E"], ["This, in turn, helps alleviate the effects of global warming as well as curbing air pollution.", "R"], ["Coupled with environmental advantage is greater travel safety.", "B"], ["Because many forms of public transportation such as trains and underground are highly automated and follow designated routes, they are less prone to traffic accidents.", "E"], ["The fewer the road accidents, the fewer people are harmed.", "R"]], "b2": [["Limiting car ownership while promoting public transportation can, however, prove disadvantageous.", "T"], ["First of all, it can give rise to public disapproval.", "C"], ["Many people consider public transportation inconvenient for being crammed, unhygienic, and at times, late.", "E"], ["Hence, forcing travelers and commuters to switch to public transportation is likely to be met with strong objection from the public.", "R"], ["Furthermore, the policy in question is not viable from an economic standpoint.", "B"], ["The car manufacturing industry as well as many related businesses like car dealerships, gas stations, mechanics and servicing stores, which constitute a considerable share of the national economy, will sustain major job and profit losses as a result of a decline in car ownership.", "E"], ["This will ultimately lead to economic setbacks.", "R"]], "note": "Body 1 names two benefits in the topic sentence, then develops each: claim, why, result. Body 2 turns with “however” and develops two drawbacks the same way. Notice the result sentences (“This will ultimately lead to economic setbacks”)."}, {"src": "Living abroad", "q": "These days more and more people are going to other countries for a significant period of time either to find a job or study. Discuss the advantages and disadvantages of living and working in a foreign country.", "l1": "Advantages", "l2": "Disadvantages", "b1": [["The benefits of migrating to another country for work or education vary.", "T"], ["First of all, one can have better job prospects when they move to another country, especially a developed one.", "C"], ["For instance, countries of the West like the US and Canada offer competitive salaries and working conditions compared to less developed countries like India.", "X"], ["With a better income, in turn, people can afford better living standards.", "R"], ["Furthermore, living overseas is a sensible choice from a personal growth standpoint.", "B"], ["Having moved abroad, one can enjoy greater autonomy and expose oneself to different cultures.", "E"], ["This, as a result, helps them grow into a mature and well-rounded individual.", "R"]], "b2": [["Living abroad as a foreigner does not always prove favorable.", "T"], ["Expatriates often report experiencing culture shock - maladjustment to the host country.", "C"], ["This phenomenon manifests itself in various forms ranging from sensitivity to food and weather to difficulties blending in with the local culture.", "E"], ["Unless counteracted, this phenomenon leads to a feeling of social alienation and possibly, physical sickness.", "R"], ["One other common issue has to do with the cost of living abroad.", "B"], ["People living abroad may face financial challenges due to prohibitive costs associated with housing and basic essentials as it is the case in major immigration hubs such as New York and Tokyo.", "E"], ["Immigrants who fail to pay for rent and food consequently end up homeless or are deported to their home country.", "R"]], "note": "Here the first idea has an example (the US and Canada vs India), and the result comes right after it (“With a better income, in turn…”). Examples are optional but make an idea convincing."}, {"src": "Rural migration", "q": "Nowadays in many countries, young people leave rural areas to study or work in cities. What are the benefits and drawbacks?", "l1": "Advantages", "l2": "Disadvantages", "b1": [["The main upside to moving to a city for youngsters is access to better education and employment opportunities.", "T"], ["That is, having relocated to an urban area, young people are offered a chance to gain a decent qualification and enter the workforce, unlike in the countryside where their future prospects are generally limited to agriculture farming.", "E"], ["Once they obtain a degree and secure a job, they can afford better living quality, not just for themselves, but also their future children.", "R"], ["Besides, moving away from home marks the first step towards independent life for people of young ages.", "B"], ["This is because when young people are away from their family, they naturally have to take charge of their finances and daily problems.", "E"], ["This maturation process prepares them for adult life.", "R"]], "b2": [["On the other hand, the decision to move to a city can have some negative implications for young people and society as a whole.", "T"], ["The main problem associated with city life is high cost of living.", "C"], ["It is a common fact that living expenses such as food, rent, utilities, and travelling in cities are considerable in cities compared to the countryside.", "E"], ["In this regard, city life can prove costly to many people, who often come from rather a disadvantaged background.", "R"], ["From an economic standpoint, exodus of young people to cities will result in lack of labor force in the countryside.", "B"], ["Once more and more young people move to cities in pursuit of better education and job opportunities, shortage of workers to do farmwork in the countryside will ensue.", "E"], ["This, in turn, will mean serious setbacks in food supply.", "R"]], "note": "The topic sentence of Body 1 is also its first idea. The second idea of Body 2 (“lack of labor force”) shows the effect spreading from young people to the whole country: “society as a whole”."}, {"src": "Tourism", "q": "A lot of places in the world rely on tourism as a main source of income. Unfortunately, tourism can also be a source of problems if it is not well-managed. What are the advantages and disadvantages of tourism in the modern world?", "l1": "Disadvantages", "l2": "Advantages", "b1": [["To start, tourism has some concerning externalities to consider, the main one of which is environmental damage.", "T"], ["Severe environmental harm is done to the host country when hotels and restaurants are built at the expense of natural habitats to serve incoming visitors.", "E"], ["Loss of natural habitats not only disturbs the wildlife of the host country, but also locals whose livelihood depend on those places of nature.", "R"], ["Additionally, there is an increased risk disease outbreak with constant movement of people around the world.", "B"], ["The fact that modern transportation has enabled instant travel is a contributing factor to global pandemics, with COVID-19 being a salient example.", "X"], ["Unless carefully monitored, it is quite likely that more global pandemics will occur as a result of mass tourism.", "R"]], "b2": [["Tourism, on the other hand, can be equally virtuous.", "T"], ["Evidently, it is a boon to the economy.", "C"], ["Many jobs are created in the hospitality industry with the growth of tourism around the world seeing as staff is required to cater for the needs of tourists.", "E"], ["This means more and more people can earn a living, make purchases, and essentially, be a meaningful part of the economy.", "R"], ["My hometown, Bukhara, has benefitted greatly from tourism with the creation of jobs for tour guides, taxi drivers, restaurant workers and hotel employees.", "X"], ["Furthermore, tourism reinforces deeper cultural understanding and exchange.", "B"], ["That is, people gain thorough insights into other cultures when they visit historical monuments, attend foreign traditional festivals and try foreign cuisine.", "E"], ["This, in turn, fosters stronger intercultural bonds among nations.", "R"]], "note": "The order can change: this writer puts the disadvantages first. What matters is that one paragraph is for each side. The example “COVID-19” and “Bukhara” are specific, not general."}, {"src": "Human cloning", "q": "Soon it may be scientifically possible to clone humans. What are the advantages and disadvantages of this?", "l1": "Advantages", "l2": "Disadvantages", "b1": [["To start with the benefits, human cloning could certainly be mainstream in the entertainment industry.", "T"], ["No longer would movie producers have to use stuntmen when it is possible to make an exact replica of an actor.", "E"], ["This would also mean that no actual human lives is jeopardized on movie sets, especially on those involving dangerous scenes.", "R"], ["Another area of human endeavor that can greatly benefit from clone humans is space exploration.", "B"], ["Once there are entities which perfectly imitate human biology as well as mind, they can be sent on risky space missions to expand our inquiry into space, and possibly one day we might discover habitable planets with their help.", "E"]], "b2": [["On the other hand, some argue that such a scientific project is not without its downsides.", "T"], ["One immediate concern is public backlash from people who believe that human life might lose its worth as soon as it becomes possible to copy it.", "C"], ["This concern is justified not only in questioning the ethicality of this possibility, but also in the idea that some people may exploit this opportunity to benefit themselves.", "E"], ["For instance, if it were scientifically possible to create human copies, who is to say that some unscrupulous wealthy businessman would not have an army of these copies work for him as slaves?", "X"], ["Furthermore, it is entirely possible that these clones might be used in political meetings to act as representatives like a diplomat or a president.", "B"], ["Although this would be acceptable on safety and security grounds, common men would highly disapprove of a fake human speaking on their behalf.", "E"]], "note": "A good idea can also be built from a “no longer would…” scenario: it shows the benefit by describing what changes. The second paragraph uses an imagined example to prove the concern is real."}], "G": {"picks": [{"src": "Public transport", "arg": "Public transport makes travel safer.", "topic": "Body 1 · advantages", "opts": ["Greater travel safety is another advantage. Because many forms of public transport, such as trains and the underground, are highly automated and follow designated routes, they are less prone to accidents. The fewer the road accidents, the fewer people are harmed.", "Public transport is safer. It is very safe and people feel safe when they use it. Safety is a big advantage of public transport.", "Public transport is safer. Last year I took the metro every day and I never had a problem, so I like it.", "Public transport is safer, so the government should build more trains and ban cars in every city."], "ans": 0, "fb": ["", "The idea is only repeated in new words. Where is the explanation (why) and the result?", "A personal story is not an explanation. Say WHY it is safer and what follows.", "It jumps to a solution. First explain WHY it is safer, then show the result."]}, {"src": "Tourism", "arg": "Tourism creates jobs.", "topic": "Body 2 · advantages", "opts": ["Tourism is a boon to the economy. Many jobs are created in hospitality because staff are needed to cater for the needs of tourists. This means more people can earn a living and be a meaningful part of the economy.", "Tourism creates jobs. Jobs are important for people. Many people need jobs in every country.", "Tourism creates jobs, but it also damages nature and raises prices in many towns.", "Tourism is good. It is good for the economy and for everybody who lives there."], "ans": 0, "fb": ["", "This repeats the argument without explaining why jobs appear or what follows.", "This changes sides in the middle of the idea. Keep to one idea: jobs.", "Too vague: “good” explains nothing. Say what exactly happens and why."]}, {"src": "Living abroad", "arg": "Living abroad can cause culture shock.", "topic": "Body 2 · disadvantages", "opts": ["Expatriates often report experiencing culture shock. It shows itself in many ways, from sensitivity to food and weather to difficulty blending in with local people. Unless it is dealt with, it leads to social alienation and even physical sickness.", "Living abroad is difficult. I have a cousin in London and he does not like the weather there.", "Culture shock is a big problem. It is a big problem for people who live abroad and for their families.", "Living abroad is easy, because people quickly get used to new countries and customs."], "ans": 0, "fb": ["", "A personal story is not an explanation. Say WHY culture shock happens and what follows.", "The idea is only repeated. Where is the explanation and the result?", "This is the opposite of the argument."]}], "w1": {"src": "Living abroad", "kind": "adv", "tag": "Body 1 · advantages", "q": "Discuss the advantages and disadvantages of living and working in a foreign country.", "ch": ["Better job prospects → developed countries offer higher salaries → people afford a better standard of living", "Personal growth → greater independence and contact with other cultures → a mature, well-rounded person"], "model": "To start, moving to another country for work or study has several benefits. First of all, people can find better jobs, especially in developed countries. This is because countries such as the US and Canada offer higher salaries and better working conditions than many poorer nations. As a result, workers can afford a better standard of living. Furthermore, living abroad helps personal growth. Away from home, a person gains independence and meets different cultures, which means they grow into a mature and well-rounded individual."}, "w2": {"src": "Human cloning", "kind": "dis", "tag": "Body 2 · disadvantages", "q": "Soon it may be scientifically possible to clone humans. What are the advantages and disadvantages of this?", "ch": ["Public backlash → people feel human life loses its worth if it can be copied → strong opposition to cloning", "Misuse → wealthy people could use copies as workers or political representatives → exploitation and distrust"], "model": "On the other hand, cloning humans is not without its downsides. One immediate concern is public backlash. Many people believe that human life would lose its worth if it could be copied, so they would strongly oppose the idea. This is because cloning raises serious ethical questions. Another drawback is misuse. A wealthy person could use copies as cheap workers, or clones could speak for politicians. As a result, exploitation and public distrust would follow."}}};

const EXPL=/\b(because|since|this is why|due to|in other words|that is|this is|which means|owing to|this can be attributed|more specifically|as it|as they|as the|for the reason|seeing as|so that|whereas)\b/i;
const RESU=/\b(as a result|therefore|thus|consequently|this leads|leads to|this means|which means|in turn|hence|results in|resulting|means that|so they|so it|so that|so the|so people|so everyone|and this|gives? rise|causing|as such|in this way|for this reason|this tends|this creates|which leads|which makes|which causes|which results|which can|which may|so )\b/i;
const ADD=/\b(furthermore|moreover|besides|in addition|another|also|what is more|beyond this|apart from|on top of|more than|one other|finally|firstly|secondly|adding to this|second|next)\b/i;
const UPW=/\b(advantages?|benefits?|beneficial|upsides?|merits?|positive|advantageous|virtuous|boon|favorable|perks?|clear gains?)\b/i;
const DOWNW=/\b(drawbacks?|downsides?|disadvantages?|disadvantageous|concerns?|harms?|issues?|problems?|challenges?|negative|not without|shortcomings?|not free of|difficult\w*|worrying|favorable)\b/i;
const TURN=/\b(however|nevertheless|that said|having said that|despite|on the other hand|even so|at the same time|admittedly|but)\b/i;
const W=t=>(t.toLowerCase().match(/[a-z']+/g)||[]);
function run(a,b){let best=0;for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)if(a[i]===b[j]){let k=0;while(i+k<a.length&&j+k<b.length&&a[i+k]===b[j+k])k++;if(k>best)best=k}return best}
const nw=t=>(t.match(/\S+/g)||[]).length;
const chainText=c=>c.replace(/→/g," ");
const stem=s=>[...new Set((s.toLowerCase().match(/[a-z]+/g)||[]).filter(w=>w.length>=5).map(w=>w.slice(0,5)))];
function checkBody5(text,tp){
  const w=W(text),n=w.length,ss=text.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>1);
  const first=ss[0]||"",dis=tp.kind==="dis";
  const kwList=tp.kw||stem(tp.ch.join(" "));
  const kwHit=kwList.filter(k=>text.toLowerCase().includes(k)).length;
  const cp=Math.max(run(w,W(chainText(tp.ch[0]))),run(w,W(chainText(tp.ch[1]))));
  const hasI=/\b(i|my|we|me|our)\b/i.test(text.replace(/\bMy hometown\b/g,""));
  const c=[
   dis?{ok:TURN.test(first)&&DOWNW.test(first),crit:1,label:"Topic sentence",bad:"Start the disadvantages paragraph with a turn word and name the bad side: “However, … is not without its downsides.” · “That said, … has some drawbacks.” · “Nevertheless, … has its drawbacks.”",good:"Your topic sentence turns to the disadvantages."}
       :{ok:UPW.test(first)&&!TURN.test(first.split(/[,]/)[0]),crit:1,label:"Topic sentence",bad:"Start the advantages paragraph by naming the good side: “To start, … has some clear benefits.” · “To begin with, … has several advantages.”",good:"Your topic sentence introduces the advantages."},
   {ok:!hasI,crit:1,label:"No opinion",bad:"This essay has no opinion. Remove “I”, “my” and “we”.",good:"No opinion: correct."},
   {ok:ss.length>=5,crit:1,label:"5+ sentences",bad:"A full body paragraph has a topic sentence and two ideas, each explained: about 5–8 sentences.",good:ss.length+" sentences."},
   {ok:EXPL.test(text),crit:1,label:"Explanation",bad:"Explain WHY: “This is because…”, “Since…”, “In other words,…”.",good:"You explain."},
   {ok:RESU.test(text),crit:1,label:"Result",bad:"Show the RESULT: “As a result,…”, “This means that…”.",good:"You show results."},
   {ok:ADD.test(text),crit:1,label:"Second idea",bad:"Start your second idea with “Besides,…”, “Another benefit is…”, “Furthermore,…” or “Finally,…”.",good:"You link to a second idea."},
   {ok:cp<9,crit:1,label:"Own words",bad:"You copied "+cp+" words in a row from the ideas. Use your own words.",good:"Written in your own words."},
   {ok:kwHit>=3,crit:1,label:"On idea",bad:"Develop the two ideas shown. Use their key words or synonyms.",good:"Develops the ideas."},
   {ok:n>=45&&n<=190,crit:0,label:"Length",bad:n<45?"A bit short ("+n+" words). A body paragraph is about 70–120 words.":"A bit long ("+n+" words). Aim for 70–120 words.",good:n+" words: a good length."},
   {ok:text.indexOf("→")<0,crit:0,label:"Full sentences",bad:"Replace the arrows with full sentences.",good:"Full sentences."}].filter(x=>!(x.ok&&!x.crit&&!x.bad));
  const crit=c.filter(x=>x.crit),okc=crit.filter(x=>x.ok).length,tips=c.filter(x=>!x.crit&&!x.ok).length;
  return {c,v:okc===crit.length&&tips===0?"good":okc>=crit.length-1?"mid":"bad"}}
function checkBody(t,tp){return checkBody5(t,tp)}
function fbHTML(r,done){
  const vd={good:done||"Well done!",mid:"Nearly there: add the missing move.",bad:"Not yet. Fix the red points and check again."}[r.v];
  return '<div class="hd"><span class="vd">'+vd+'</span><span class="meter">'+r.c.map(x=>'<span class="'+(x.ok?"ok":(x.crit?"no":"tip"))+'">'+(x.ok?"✓ ":"✗ ")+x.label+'</span>').join("")+'</span></div><div class="body">'+
  r.c.filter(x=>!x.ok).map(x=>'<div class="it '+(x.crit?"structure":"style")+'"><div><span class="k">'+(x.crit?"must fix":"tip")+'</span>'+esc(x.bad)+'</div></div>').join("")+
  r.c.filter(x=>x.ok).map(x=>'<div class="it praise"><div><span class="k">ok</span>'+esc(x.good)+'</div></div>').join("")+'</div>'}

let REG=[];
function selQ(key,label,opts,ans,expl,num){
  REG.push({key,kind:"sel",ans,expl});
  return '<div class="q" data-key="'+key+'"><div class="p"><span class="num">'+num+'</span>'+label+'</div><select class="sel" data-key="'+key+'"><option value="">Choose…</option>'+opts.map((o,i)=>'<option value="'+i+'">'+esc(o)+'</option>').join("")+'</select><div class="fb" id="fb_'+key+'"></div></div>'}
function rng(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
function shuf(a,seed){const r=rng(seed),b=a.map((x,i)=>i);for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function selS(key,label,opts,ans,expl,num){const p=shuf(opts,key);return selQ(key,label,p.map(i=>opts[i]),p.indexOf(ans),expl,num)}
function pickQ(key,g,num){

const seg=(c,l,t)=>'<div class="seg '+c+'"><div class="st">'+l+'</div>'+esc(t)+'</div>';

const HINT={adv:'<b>Plan:</b> Topic sentence (<b>To start, … has some clear benefits</b>) → Idea 1: claim, <b>This is because…</b>, <b>As a result…</b> → <b>Besides, / Another benefit is… / Furthermore,</b> Idea 2 → explain and result. No “I”. (70–120 words)',

const EXC=DATA.EX,G=DATA.G;
steps.push({label:"1 Learn",html:()=>{
 const e1=EXC[0];
 let h='<div class="sec-title"><span class="n">STEP 1</span><h2>Learn: body paragraphs for “advantages and disadvantages” essays</h2></div>';
 h+='<div class="card"><h3>1 · The essay map</h3><p class="lead">Your teacher’s sample essays have <b>two body paragraphs</b>: one for the <b>advantages</b> and one for the <b>disadvantages</b>. There is no opinion, so both are written in the same neutral voice.</p><table class="t"><tr><th>Paragraph</th><th>Its job</th><th>It starts with…</th></tr>'
 +'<tr><td><b>Introduction</b></td><td>Paraphrase + both sides (Lesson 10)</td><td>…, it is not without its downsides.</td></tr>'
 +'<tr><td><b>Body 1</b><br>advantages</td><td>One or two benefits, each fully developed.</td><td>To start, … · To begin with, … · The benefits of … vary.</td></tr>'

 h+='<div class="card"><h3>2 · Topic sentences from the samples</h3><table class="t"><tr><th>Body 1 · advantages</th><th>Body 2 · disadvantages (turn word + drawbacks)</th></tr>'
 +'<tr><td>To start, autonomous cars will improve our lives in numerous ways.</td><td>Nevertheless, cars of the future are not without their drawbacks.</td></tr>'
 +'<tr><td>To start with the benefits, arguably the most important and immediate one is instant and direct communication.</td><td>Having said that, it should be acknowledged that online translation applications are not without their downsides.</td></tr>'
 +'<tr><td>To start, there are some clear advantages of taking a gap year for travelling and working.</td><td>Despite that, one should not be dismissive of some possible drawbacks of taking a gap year.</td></tr>'
 +'<tr><td>Exploring energy options in uncharted territories has some economic benefits to offer.</td><td>However, the decision to travel with family on business trips is not without its downsides.</td></tr>'
 +'<tr><td>To start, a rise in human lifespan can prove beneficial in several ways.</td><td>Nevertheless, longer life expectancy is not virtuous in all respects.</td></tr></table></div>';
 h+='<div class="card"><h3>3 · The key skill: turn an argument into a developed idea</h3><p class="lead">In your notes an <b>argument</b> is only a few words (“safety”, “unemployment”). A <b>developed idea</b> answers three questions. Add the question words and you never run out of things to write.</p><table class="t"><tr><th>Question</th><th>What you write</th><th>Phrases from the samples</th></tr>'
 +'<tr><td><b>What?</b></td><td><b>Claim:</b> name the argument in one sentence.</td><td>The most obvious benefit is … · One major issue is … · Price point is another major disadvantage. · Concerns have been raised over …</td></tr>'
 +'<tr><td><b>Why?</b></td><td><b>Explain:</b> the reason or the way it works.</td><td>This is because … · Since … · That is, … · Indeed, …</td></tr>'
 +'<tr><td><b>So what?</b></td><td><b>Result:</b> what happens because of it, one step further.</td><td>This, in turn, … · This means … · As a result, … · Hence, … · This will ultimately lead to …</td></tr>'
 +'<tr><td><b>Example?</b><br>(optional)</td><td><b>Example:</b> a real country, company or place.</td><td>For instance, … · … is a good case in point. · … such as …</td></tr></table></div>';
 const LAD=[["Level 1 · Argument only","Fewer jobs for young people.","This is only a claim. A paragraph with ten of these would stay empty."],["Level 2 · + Explain (Why?)","As well as solving the labor shortage issue, such a development might also saturate the labor market for young people. As employers can retain old workers without much concern over loss of productivity, there will be fewer job prospects available for young demographics.","Better: now the reader knows why."],["Level 3 · + Result (So what?)","As well as solving the labor shortage issue, such a development might also saturate the labor market for young people. As employers can retain old workers without much concern over loss of productivity, there will be fewer job prospects available for young demographics. This, as a result, means economic hardships for young people.","Fully developed: claim → why → result. This is the real sample paragraph (living longer)."]];
 h+='<div class="card"><h3>4 · From an argument to a fully developed idea</h3><p class="lead">One argument from your teacher’s sample essay, built in three levels.</p>'+LAD.map((r,i)=>'<div class="seg '+["s","v","n"][i]+'" style="margin:6px 0"><div class="st">'+r[0]+'</div>'+esc(r[1])+'<div style="font-size:14px;margin-top:4px;color:#445">▸ '+esc(r[2])+'</div></div>').join("")+'<div class="note"><b>Rule:</b> every idea needs at least <b>Claim + Why</b>. Strong ideas also show a <b>Result</b>.</div></div>';
 const ST7=[["1 · Topic sentence","Name the side: advantages or disadvantages. Body 2 starts with a turn word.","To start, … has some clear benefits · However, … is not without its downsides"],
 ["2 · Claim (first idea)","Name your first idea in one sentence.","The most obvious benefit is … · One major issue is … · The most evident downside is …"],
 ["3 · Explain","Say why or how.","This is because … · Since … · That is, … · Indeed, …"],
 ["4 · Result","Show what happens because of it.","As a result, … · This, in turn, … · Hence, … · This will ultimately lead to …"],
 ["5 · Example (optional)","A short, specific example. You can skip it.","For instance, … · … is a good case in point. · … such as …"],
 ["6 · Second idea","Start a new idea with a link. Repeat steps 2–4 in a shorter form.","Besides, … · Another benefit is … · Price point is another major disadvantage. · Furthermore, … · Finally, …"],
 ["7 · Closing (optional)","One sentence that sums up. No new idea.","In this sense, … · In this regard, …"]];
 h+='<div class="card"><h3>5 · Build a paragraph in order: seven steps</h3><table class="t"><tr><th>Step</th><th>What you do</th><th>Phrases from the samples</th></tr>'+ST7.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join("")+'</table><div class="grp">Real Body 2 · '+e1.src+'</div>'+cparts(e1.b2)+'<div class="note">'+esc(e1.note)+'</div></div>';
 h+='<div class="card"><h3>6 · One idea in depth or two shorter ideas</h3><table class="t"><tr><th>Choice</th><th>How it looks</th><th>From the samples</th></tr>'
 +'<tr><td><b>Two ideas</b></td><td>Each gets a claim, a reason and a short result. The most common choice.</td><td>Public transport: environmental conservation + safety</td></tr>'
 +'<tr><td><b>One idea in depth</b></td><td>One claim with a reason, an example and a result, then a closing line.</td><td>Oil and gas: an economically viable solution (with the Siberia example)</td></tr></table><div class="note">Either way, every idea must be explained. Never just list arguments.</div></div>';
 h+='<div class="card"><h3>7 · Do and don’t</h3><table class="t"><tr><th>Do ✓</th><th>Don’t ✗</th></tr><tr><td>One paragraph for the advantages, one for the disadvantages.<br>Give two ideas in each (or one in depth).<br>Explain every idea: “This is because…”<br>Show a result: “As a result…”<br>Turn clearly in Body 2: “However, …”.</td><td>Don’t write “I think” or give an opinion.<br>Don’t mix advantages and disadvantages in one paragraph.<br>Don’t just repeat the argument in new words.<br>Don’t list ideas without explaining them.</td></tr></table></div>';
 return h}});

/* ---------- build */
function build(){
 REG=[];
 document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header><nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">MrIkromov’s IELTS · Instagram @ustoz_jasur · Telegram @TeamMrIkromov</div><div id="toast"></div>';
 const st=$("#steps"),mn=$("#main");
 steps.forEach((s,si)=>{
  const b=document.createElement("button");b.className="step";b.id="st"+si;b.innerHTML=s.label+'<span class="ct" id="ct'+si+'"></span>';b.onclick=()=>showStep(si);st.appendChild(b);
  const sec=document.createElement("section");sec.id="sec"+si;sec.style.display="none";
  if(s.subnav){
   sec.innerHTML='<div class="sec-title"><span class="n">STEP 4</span><h2>Practice tests · 10 questions</h2></div><p class="lead">Use what you learned. For each question, write two body paragraphs: the advantages, then the disadvantages. Earn a ⭐ for each!</p><div class="nums" id="nv'+si+'"></div><div id="uv'+si+'"></div>';
   mn.appendChild(sec);
   const nv=$("#nv"+si,sec),uv=$("#uv"+si,sec);
   s.units.forEach((u,ui)=>{const nb=document.createElement("button");nb.className="sub";nb.id="u"+si+"_"+ui;nb.textContent=ui+1;nb.onclick=()=>showUnit(si,ui);nv.appendChild(nb);const bx=document.createElement("div");bx.innerHTML=u.html();bx.style.display="none";u.box=bx;uv.appendChild(bx)});
  }else{sec.innerHTML=s.html();mn.appendChild(sec)}
 });
 wire();applyState()}
function showStep(si){ST.step=si;steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});if(steps[si].subnav)showUnit(si,Math.min(ST.unit[si]||0,steps[si].units.length-1));window.scrollTo({top:0});save()}
function showUnit(si,ui){ST.unit[si]=ui;steps[si].units.forEach((u,k)=>{u.box.style.display=k===ui?"":"none";$("#u"+si+"_"+k).classList.toggle("on",k===ui)});save()}
function stepKeys(si){const root=$("#sec"+si);return $$("[data-key]",root).map(e=>e.dataset.key).filter((v,i,a)=>a.indexOf(v)===i&&REG.some(r=>r.key===v))}
function progress(){let tot=REG.length,done=REG.filter(r=>ST.ok[r.key]).length;$("#pbar").style.width=Math.round(done/tot*100)+"%";$("#pnum").textContent=done+" / "+tot+" done";
 steps.forEach((s,si)=>{const ks=stepKeys(si),d=ks.filter(k=>ST.ok[k]).length;const c=$("#ct"+si);if(c){c.textContent=ks.length?d+"/"+ks.length:"";$("#st"+si).classList.toggle("full",ks.length>0&&d===ks.length)}});stars()}
const CHEER=["Great job! 🎉","Excellent! ⭐","You nailed it! 💪","Superb idea! 🚀","Well done! 👏"];
function cheer(){toast(CHEER[Math.floor(Math.random()*CHEER.length)])}
function stars(){let n=0;TOPICS.forEach((t,ui)=>{const a=ST.ok["B1_"+t.n]&&ST.ok["B2_"+t.n];n+=a?1:0;const el=document.getElementById("u3_"+ui);if(el)el.textContent=(ui+1)+(a?" ⭐":"")});const p=document.getElementById("pnum");if(p)p.textContent+="  ·  ⭐ "+n+"/"+TOPICS.length}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function wire(){
 $$("select.sel").forEach(el=>el.addEventListener("change",()=>runSel(el.dataset.key,true)));
 $$("textarea").forEach(ta=>ta.addEventListener("input",()=>{const id=ta.id;if(id.startsWith("ta_")){const k=id.slice(3);ST.saved[k]=ta.value;wc(k)}else{ST.saved[id]=ta.value}save()}));
 document.body.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const k=b.dataset.key,a=b.dataset.act;
  if(a==="hint")$("#hint_"+k).classList.toggle("on");
  if(a==="model")$("#md_"+k).style.display="";
  if(a==="check")runWrite(k);
})}
function wc(k){const ta=$("#ta_"+k),n=nw(ta.value);$("#wc_"+k).textContent=n+" words"}
function runSel(k,say){const r=REG.find(x=>x.key===k),el=$('select[data-key="'+k+'"]'),fb=$("#fb_"+k);if(el.value==="")return;const ok=+el.value===r.ans;el.className="sel "+(ok?"ok":"no");
 const msg=r.fbs?r.fbs[+el.value]:(ok?r.expl:"");
 fb.className="fb on "+(ok?"good":"bad");fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"Correct! ":"Not quite. ")+'</span></div><div class="body">'+esc(msg||"")+'</div>';
 ST.saved[k]=el.value;if(ok){ST.ok[k]=1}else delete ST.ok[k];if(say)save();progress()}
function runWrite(k){const r=REG.find(x=>x.key===k),ta=$("#ta_"+k);if(!ta.value.trim()){toast("Write your paragraph first");return}
 const res=checkBody(ta.value,r.tp),fb=$("#fb_"+k);fb.className="fb on "+res.v;fb.innerHTML=fbHTML(res,"Well done! This is a developed body paragraph.");ta.className=res.v==="good"?"ok":(res.v==="bad"?"no":"");
 if(res.v!=="bad"){if(!ST.ok[k])cheer();ST.ok[k]=1;$("#dn_"+k).textContent="✓ done";$("#md_"+k).style.display=""}else{delete ST.ok[k];$("#dn_"+k).textContent=""}
 save();progress()}
function applyState(){
 REG.forEach(r=>{if(r.kind==="sel"){const v=ST.saved[r.key];if(v==null)return;const el=$('select[data-key="'+r.key+'"]');el.value=v;runSel(r.key,false)}
  else if(r.kind==="write"){const v=ST.saved[r.key];if(v==null)return;const ta=$("#ta_"+r.key);ta.value=v;wc(r.key);{const pv=ST.saved["pl_"+r.key],pe=$("#pl_"+r.key);if(pv!=null&&pe)pe.value=pv}if(ST.ok[r.key])$("#dn_"+r.key).textContent="✓ done"}
});
 showStep(Math.min(ST.step||0,steps.length-1));progress()}
build();window.__T=TOPICS;window.runWrite=runWrite;
})();
