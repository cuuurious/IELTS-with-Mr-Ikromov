*{box-sizing:border-box}

.gcard .gt span{font-weight:600;color:var(--mist);font-size:15.3px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}

.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:17.1px;margin-bottom:6px}

.iw .lab{font-size:14.2px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}

textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}

.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:17.7px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:14.8px;color:var(--mist)}
.done-tag{font-size:14.8px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:16.5px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}

.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:14.2px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:17.7px;line-height:1.7;margin-bottom:6px}

.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:13.6px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:17.1px}
.it .k{display:inline-block;font-size:13px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}

.why{margin-top:2px;color:var(--mist);font-size:15.9px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:17.1px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

.foot{color:var(--mist);font-size:14.8px;text-align:center;padding:10px 18px 30px}

<body>
<script>
(function(){
const CH={id:"wt2-l08-body-posneg",kicker:"Writing Task 2 · Lesson 8 · Positive or negative body paragraphs",title:'How to write <span style="color:#ffd27a">strong body paragraphs</span> for positive or negative development essays',
lead:"Learn from your teacher’s own sample essays: give the other side fairly, then give your own side with fully developed ideas. Then practise on 10 questions."};
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];

const TOPICS=[{"n": 1, "q": "Today, more people are putting their personal information, such as their addresses, telephone numbers, and credit card details, online to carry out daily activities such as banking, shopping, and socializing. Is this a positive or negative development?", "op": "Negative", "mine": ["Data can be stolen → hackers use cards and addresses → fraud and identity theft", "Companies collect and sell data → targeted advertising and surveillance → loss of privacy"], "oth": ["Online services save time → banking and shopping at home → convenience and efficiency", "Details are stored → faster checkout and quicker access to services → smoother daily life"], "m1": "Admittedly, entering personal details online can make everyday life easier in some ways. The main advantage is convenience, since people can pay bills, order goods and transfer money from the comfort of their homes. This is because they no longer have to queue in banks or travel to shops. As a result, a great deal of time and effort is saved. Besides, many websites store customers’ addresses and card numbers, which means checkout is much faster the next time. In this way, routine tasks become smoother and people can enjoy a more efficient daily life.", "m2": "I, however, regard the sharing of private data online as largely a change for the worse. The main danger is theft. Hackers can break into websites and steal addresses and card details, because online security is often weak. As a result, victims may lose money or even have their identity stolen, which is very hard to repair. Another concern is loss of privacy. Companies collect and sell personal information, which allows them to send targeted advertising and to track what people do. This means that ordinary users are constantly watched, so their private lives are no longer private.", "pat": "A"}, {"n": 2, "q": "These days, young people prefer to spend their leisure time in shopping centers instead of doing organized activities, such as sports or music. Do you think it is a negative or positive development?", "op": "Negative", "mine": ["Teenagers miss sports and music → no skills, teamwork or fitness → health and talents are neglected", "Malls encourage spending → advertising tempts young people to buy → materialism and debt"], "oth": ["Malls are safe and social → teenagers meet friends in a controlled place → relaxation and social contact", "Shopping is a break from study → time to relax → less stress"], "m1": "To start, it is worth acknowledging that shopping centers offer teenagers some advantages. They are safe and well-lit places where young people can meet their friends under supervision. This is because security guards and cameras make a mall more controlled than the street. As a result, teenagers can relax and enjoy social contact without risk. Furthermore, a trip to the shops gives students a break from their studies. Since young people spend long hours at school and on homework, spending free time this way helps them relax, which leads to less stress.", "m2": "However, I believe that replacing organized activities with shopping is damaging. The first problem is that teenagers miss out on sports and music. This is because they spend their free time walking around shops instead of training or practicing. As a result, they gain no new skills, teamwork or fitness, and their health and talents are neglected. Another issue is that malls push teenagers to spend more. Shop adverts tempt young customers into buying things they do not need, which means many develop materialistic habits. In the long run, this can lead to debt and poor money management.", "pat": "B"}, {"n": 3, "q": "Space travel has been possible for some time, and some people believe that space tourism could be developed in the future. Do you think this would be a positive or negative development?", "op": "Positive", "mine": ["Space tourism could fund research → income supports technology → scientific advances for everyone", "It gives a new industry and jobs → engineers and tourism staff are needed → economic growth"], "oth": ["Rockets cause pollution → launches release gases and damage the atmosphere → more climate harm", "Only the rich can afford it → money goes to a luxury, not urgent problems → deepens inequality"], "m1": "Admittedly, there are some serious objections to tourist flights into space. One concern is pollution. Rocket launches release large amounts of gases that damage the atmosphere, so more frequent flights would add to climate problems. This is because every launch burns huge quantities of fuel. As a result, space tourism could worsen global warming. Another objection is inequality. Only wealthy people can afford a ticket, which means that large sums of money go to a luxury rather than to urgent problems such as hunger or disease. In this way, the gap between rich and poor may deepen.", "m2": "Despite these concerns, I regard space tourism as a change for the better. To begin with, it could pay for scientific research. The income from ticket sales would support the development of new technology, since space agencies are short of funds. As a result, discoveries made for tourism could later benefit everyone, for example in medicine and communication. Furthermore, a new industry would create jobs. Engineers, pilots and tourism staff would all be needed, which means more employment and economic growth in many countries.", "pat": "A"}, {"n": 4, "q": "In some countries, governments have attempted to reduce traffic by imposing congestion charges during rush hour. Is this a positive or negative development?", "op": "Positive", "mine": ["Charges reduce rush-hour traffic → drivers avoid peak times or use public transport → less congestion", "Money funds public transport → income is reinvested → better services and cleaner air"], "oth": ["Poorer drivers pay a larger share of income → they cannot avoid the charge → unfair", "Businesses and shops in the centre lose customers → people avoid the zone → local economy suffers"], "m1": "To begin with, congestion charges raise some fair concerns. The most obvious one is that they are unfair to poorer drivers. A fixed fee takes a larger share of a low income, so people with little money cannot easily avoid it. As a result, the charge feels like a penalty for being poor. Besides, shops and businesses in the city center may suffer. This is because many people avoid the charged zone, which means fewer customers walk through their doors. In turn, the local economy could weaken.", "m2": "I, however, believe that charging drivers at peak hours is a change for the better. The main benefit is less traffic. Because drivers must pay to enter busy areas, many avoid rush hour or switch to public transport. As a result, roads become less crowded and journeys are quicker. Another advantage is the money raised. The income can be reinvested in buses and trains, which means better services for everyone. In this way, cities also enjoy cleaner air.", "pat": "A"}, {"n": 5, "q": "In many parts of the world, some famous people are considered role models, and they have an increasing influence on young people. Is this a positive or negative development?", "op": "Negative", "mine": ["Fame is often about looks and wealth → youngsters want quick success → unrealistic expectations", "Celebrities' mistakes are copied → risky behavior and extreme diets spread → harm to followers"], "oth": ["Successful people inspire hard work → young people see that effort pays off → ambition and discipline", "Celebrities can promote good causes → charity and healthy living reach millions → positive behavior"], "m1": "To start, celebrities can have a positive influence on young people. Successful athletes and actors show that hard work pays off. This is because their fame usually follows years of training and effort. As a result, many teenagers become more ambitious and disciplined. In addition, famous people often support good causes. When a star promotes charity or a healthy lifestyle, the message reaches millions of followers, which encourages positive behavior on a large scale.", "m2": "I, on the other hand, think that the growing influence of celebrities is a change for the worse. The main problem is unrealistic expectations. Fame today is often linked to looks and wealth, so youngsters begin to dream of quick success without real effort. As a result, they may feel disappointed or ignore their studies. Another problem is imitation. Followers copy their idols’ mistakes, which means risky behavior and extreme diets can spread quickly. This is because young people trust the people they admire, so their health may suffer.", "pat": "B"}, {"n": 6, "q": "In the modern world, it is possible to shop, work, and communicate with people via the internet and live without any face-to-face contact with others. Is this a positive or negative development?", "op": "Negative", "mine": ["People may feel lonely → online contact is shallow → anxiety and depression", "Social skills weaken → less practice in face-to-face talk → trouble in relationships and teamwork"], "oth": ["Everything can be done from home → work, shopping and communication save time → convenience and flexibility", "Technology helps those who cannot leave home → disabled or remote people stay connected → greater inclusion"], "m1": "Admittedly, living without face-to-face contact has some advantages. The main one is convenience. Since work, shopping and communication can all be done from home, people save a great deal of time. As a result, they enjoy more flexibility in their daily routines. Another benefit is inclusion. Technology helps those who cannot leave their homes, such as disabled people or those in remote villages, to stay connected. This is because online tools give them access to services and conversations that were once out of reach, which leads to greater participation in society.", "m2": "I, however, believe that a life without personal contact is largely a change for the worse. The main danger is loneliness. Online communication tends to be shallow, because people cannot see real expressions or share a physical space. As a result, many feel anxious or even depressed. Another problem is that social skills weaken. People who rarely talk face to face have less practice, which means they find it harder to build relationships and to work in a team. In the long term, this can damage communities.", "pat": "A"}, {"n": 7, "q": "Many people no longer read newspapers or watch TV news programmes. Instead, they get news about the world from the Internet. Is this a positive or negative development?", "op": "Positive", "mine": ["News is instant and free → people check updates anytime → better informed", "Many sources and viewpoints → users compare reports → wider understanding"], "oth": ["Fake news spreads → anyone can post without checking → confusion and mistrust", "Algorithms show what we like → people see one viewpoint → division and echo chambers"], "m1": "To begin with, getting news online has serious drawbacks. The main one is fake news. Since anyone can post a story without checking the facts, false information spreads quickly. As a result, readers can become confused and lose trust in the media. Besides, websites and apps use algorithms that show people what they already like. This is because the more users click on a topic, the more of it they see. Consequently, many only hear one viewpoint, which leads to division and echo chambers.", "m2": "I, however, consider the shift to online news a change for the better. First, news is instant and usually free. People can check the latest updates at any time of day, because stories appear online within minutes, so they are better informed than readers of yesterday’s paper. Furthermore, the internet offers many sources and viewpoints. This means users can compare different reports on the same event. As a result, they gain a wider understanding of world affairs, provided they choose their sources carefully.", "pat": "B"}, {"n": 8, "q": "In many countries today, people can buy a wider range of household goods, such as microwaves, televisions, and rice cookers, than ever before. Is this a positive or negative development?", "op": "Positive", "mine": ["Appliances save time and effort → cooking and cleaning are quicker → more free time", "More choice and competition → better products at lower prices → higher living standards"], "oth": ["Consumerism grows → people buy things they do not need → debt and waste", "Discarded electronics create waste → landfills and pollution → environmental damage"], "m1": "Admittedly, a wider choice of goods has some downsides. The first is consumerism. When shops offer so many products, people are tempted to buy things they do not need. This is because advertising makes new models look essential. As a result, many households fall into debt and throw away items that still work. Another concern is waste. Discarded electronics end up in landfills, where they release harmful substances, which means pollution and damage to the environment.", "m2": "I, on the other hand, think this development is a change for the better. The main advantage is that appliances save time and effort. Washing and cooking are much quicker with a microwave or washing machine, so people gain more free time. Besides, greater choice means competition between producers. This is because companies must offer better products at lower prices to win customers. As a result, ordinary families enjoy a higher standard of living.", "pat": "B"}, {"n": 9, "q": "Many supermarkets are selling more and more products that are imported from other countries instead of selling food that is locally sourced. Is this a positive or negative development?", "op": "Positive", "mine": ["Imports create a competitive market → local farmers must improve quality and price → higher consumer satisfaction", "Foreign produce is easy to find → no travel needed to try other cultures’ food → new experiences at little effort"], "oth": ["Local farmers lose out → foreign producers have better technology and market access → farmers go out of business and unemployment rises", "Imported food costs more → processing, packaging and shipping add costs → poor value for money"], "m1": "To start, a growing reliance on imported food does have costs. The most serious is the harm to local farmers. Foreign producers often have better technology and easier access to world markets, so they can sell more cheaply. As a result, many local farmers lose customers and go out of business, which pushes up unemployment in rural areas. Besides, imported food can be poor value for money. This is because processing, packaging and shipping add extra costs, which are passed on to the shopper.", "m2": "I, however, see the sale of imported produce as a change for the better. One benefit is a more competitive market. Local farmers must now compete with overseas suppliers, so they try to improve the quality and price of their products. As a result, shoppers are more satisfied. Another benefit is variety. Foreign produce is easy to find in the supermarket, which means people can taste dishes from other cultures without travelling. In this way, new experiences are available with very little effort.", "pat": "A"}, {"n": 10, "q": "Modern cultures around the world have become similar when compared to the past. Is it a positive or negative development?", "op": "Positive", "mine": ["Cultures become alike → people accept each other → better mutual understanding", "Shared beliefs and priorities → people from different backgrounds cooperate better → higher workplace productivity"], "oth": ["Dominant cultures replace minority ones → unique traditions disappear → people lose their identity", "People follow the same trends → creativity and novelty decline → a uniform, less rich world"], "m1": "Admittedly, cultures becoming alike has some drawbacks. The main one is loss of identity. Dominant cultures, especially those of the West, replace minority ones, so unique traditions slowly disappear. This is because young people copy what they see in films and on social media. As a result, communities risk losing their sense of who they are. Another issue is a decline in creativity. When people follow the same trends, they produce fewer original ideas, which leads to a uniform and less colorful world.", "m2": "Despite this, I believe that the growing similarity between cultures is a change for the better. The main reason is better mutual understanding. As people accept each other’s customs, they become more alike in their views. This means that old misunderstandings fade, since people who share habits find it easier to communicate. Another benefit is productivity at work. Staff in multinational companies share similar beliefs and priorities, so they cooperate more smoothly. As a result, the company produces more.", "pat": "A"}];

ine currencies", "q": "Online currencies have become more common in recent years. Is this a positive or negative development?", "op": "Positive", "b1": [["It can be argued that the growing popularity of online currencies is unfavorable.", "T"], ["The main issue with them is their volatility.", "C"], ["Since the value of an online currency is not determined by any bank or governing authority and also because it is highly sensitive to economic and political factors, it can make the global financial market unstable.", "E"], ["For instance, banning of Bitcoin in China was followed by a major drop in its price, which meant substantial losses for many multinational companies and hedge funds holding their earning in cryptocurrency as well as individual investors.", "X"], ["In this regard, this form of currency can not only be a risky investment, but also contribute to financial instability.", "Z"]], "b2": [["Despite having some downsides, the ever-increasing use of online currencies is largely a positive trend.", "T"], ["The primary advantage of this medium of exchange is security.", "C"], ["Unlike with fiat money, transactions made with cryptocurrencies are more secure seeing as they can be tracked by everyone.", "E"], ["Such transparency ensures that there is limited risk of fraud.", "R"], ["More important is individual freedom that cryptocurrencies confer to individuals.", "B"], ["The fact that digital currencies are decentralized means neither banks nor governments can withhold them in case of malicious lawsuits and political conflicts.", "E"], ["Therefore, individuals have more autonomy and access to their personal holdings with online currencies than they do with traditional ones.", "R"]], "note": "Body 1 develops ONE idea fully (claim, reason, example, closing sentence). Body 2 develops two ideas. A paragraph can have one deep idea or two shorter ones."}, {"src": "Western clothes", "q": "In many countries, people now wear western clothes such as suits and jeans rather than traditional clothing. Is this a positive or negative development?", "op": "Positive", "b1": [["At the outset, there are some valid concerns over this rising trend of wearing modern, western outfits.", "T"], ["The most concerning aspect of this phenomenon is loss of cultural values.", "C"], ["Because traditional clothes are representative of our cultural identity, less common use of this type of clothes is likely to lead to the disappearance of our cultural norms.", "E"], ["Popularity of western attire might also spell doom for local businesses that specialize in making of traditional items of clothing.", "B"], ["As more and more people purchase modern outfits, there will be less of market available to domestic manufacturers.", "E"], ["This is further compounded by the idea that the skill of traditional clothes making might be lost as a result of the trend in question.", "R"]], "b2": [["I, on the other hand, see the growing popularity of western clothes as a positive turn of events.", "T"], ["The main reason here is practicality.", "C"], ["Most western clothes tend to be flexible and durable compared with traditional ones due to the fact that the former is made of synthetic fabric, which is known for being elastic and long-lasting.", "E"], ["A western coat with several layers of coating is clearly superior to a single-layered quill Uzbek chapan.", "X"], ["Besides, western outfits are preferable as far as professional representation is concerned.", "B"], ["This can be reflected in the instance of white-collar workers who tend to wear a black suit and a white shirt, as opposed to blue collar workers wear jeans and a T-shirt.", "X"]], "note": "The writer names the idea (“practicality”), explains it with facts about fabric, and proves it with a comparison (coat vs chapan). The second idea is introduced with “Besides”."}, {"src": "Air travel", "q": "Some people believe that there will be a reduction in air travel in the future. Do you think that this trend is a positive or negative development?", "op": "Negative", "b1": [["To start, one cannot dismiss some positive changes that would follow once people travelled less frequently.", "T"], ["The most immediate benefit would be to the environment.", "C"], ["Air travel has received a bad press for being detrimental to the environment since it requires substantially more fuel than the other forms of transport and is responsible for massive greenhouse gas emissions annually.", "E"], ["For this reason, environmentalists are adamant that these problems will be remedied at once if there is a move away from travelling by air.", "R"], ["A fall in migration patterns is also argued to be one other positive outcome of reduced air travel.", "B"], ["It is a well-known fact that human migration to far-off destinations accelerated with the instant availability of airlines, so one can expect migration rates to fall back down to more acceptable levels once air travel falls out of favor.", "E"]], "b2": [["That said, I consider that the infrequent use of airlines to travel is, on the whole, a negative development.", "T"], ["First, industries that rely on air transportation such as tourism and delivery will suffer.", "C"], ["This is because these two industries, in particular, owe their success to air travel, without which people would be less encouraged to take long trips and international delivery would be less practical.", "E"], ["Other major industries that branch out from these fields such as hotel business and international wholesale would not be as successful as these services bank on the availability of airlines.", "R"], ["Furthermore, a reduction in airline use is likely to lead to major setbacks in business operations.", "B"], ["Most people who go on business trips generally prefer air transportation for its convenience and comfort: once this travel option is made unavailable, fewer people will be interested in travelling for business purposes.", "E"]], "note": "The result sentence (“Other major industries… would not be as successful”) shows that the effect spreads: not only tourism suffers, but hotels and wholesale too. A good result goes one step further than the claim."}, {"src": "Fame online", "q": "Nowadays, the internet and television have given ordinary people a chance to become famous. Is this a positive or negative development?", "op": "Positive", "b1": [["Admittedly, the fact that everyday people can become instantly famous on some platforms such as the Internet and TV is undesirable in some ways.", "T"], ["For a start, it promotes a rather skewed idea of success.", "C"], ["When people with no expertise or decent education background rise to fame through the Internet, it creates the impression that one can become successful without a school degree and hard work.", "E"], ["As a result, more and more teenagers, who are often easily influenced by celebrities, quit school and bet their entire future on becoming internet famous.", "R"], ["Even if they make it in the world of fame, their success is often short-lived.", "B"], ["This is because one’s success on the Internet and TV hinges on their talent and creativity level, which tend to vary over time.", "E"]], "b2": [["I, on the other hand, see this change in a more positive light.", "T"], ["The main reason is because the Internet and TV allow common men to make a fortune with minimal effort.", "C"], ["YouTube content creators such as PewDiePie and Ninja, who come from underprivileged families, now make millions with the means of the Internet using their limited skillset.", "X"], ["Were it not for the Internet, these people would have a slim chance of succeeding in life.", "R"], ["This phenomenon has also helped level the playing field.", "B"], ["In the past, people mostly became famous through connections like family and friends.", "E"], ["However, now everyone has equal chances to rise to fame thanks to the Internet and TV as long as they are talented and creative.", "R"]], "note": "Here the actly happens and why.", "It jumps to a solution. First explain WHY late marriage lowers birth rates, then show the result."]}, {"src": "Air travel", "arg": "Less air travel will hurt tourism and delivery.", "topic": "Body 2 · my side (negative)", "opts": ["Tourism and delivery will suffer. Hotels are also important. I like flying very much.", "Tourism and delivery will suffer a lot. It will be very bad for the economy of every country.", "Industries that rely on air transportation such as tourism and delivery will suffer. This is because they owe their success to air travel, without which people would take fewer long trips and international delivery would be less practical. As a result, hotels and wholesalers that depend on them would also do worse.", "Air travel is expensive, so tourism and delivery will not suffer."], "ans": 2, "fb": ["Not a full idea: it lists facts but gives no reason and no result.", "The sentence is vague. “Very bad” says nothing: explain WHY and show what happens next.", "", "This is the opposite of the argument (“will not suffer”)."]}], "w1": {"src": "Living alone", "kind": "mine", "tag": "Body 2 · my view", "q": "More people live alone today than they did in the past. Is this a positive or negative development?", "stance": "The writer’s opinion: negative. Turn the two arguments below into fully developed ideas.", "ch": ["People living alone lack companionship and help → nobody to talk to or support them → loneliness, anxiety and stress", "Nobody looks after them in old age → they have to cope on their own → serious health and care problems"], "model": "However, I would contend that the growing popularity of living alone is generally a negative phenomenon. People living independently are bound to experience a lack of companionship and help. This is because no one is around to talk to or to support them when problems arise. As a result, loneliness, anxiety and stress can follow. Another problem is that there may be nobody to look after them    {ok:ADD.test(text),crit:1,label:"Second idea",bad:"Start your second idea with “Besides,…”, “Another reason is…”, “Furthermore,…” or “Finally,…”.",good:"You link to a second idea."},
   {ok:cp<9,crit:1,label:"Own words",bad:"You copied "+cp+" words in a row from the ideas. Use your own words.",good:"Written in your own words."},
   {ok:kwHit>=3,crit:1,label:"On idea",bad:"Develop the two ideas shown. Use their key words or synonyms.",good:"Develops the ideas."},
   {ok:n>=45&&n<=190,crit:0,label:"Length",bad:n<45?"A bit short ("+n+" words). A body paragraph is about 70–120 words.":"A bit long ("+n+" words). Aim for 70–120 words.",good:n+" words: a good length."},
   {ok:text.indexOf("→")<0,crit:0,label:"Full sentences",bad:"Replace the arrows with full sentences.",good:"Full sentences."}].filter(x=>!(x.ok&&!x.crit&&!x.bad));
  const crit=c.filter(x=>x.crit),okc=crit.filter(x=>x.ok).length,tips=c.filter(x=>!x.crit&&!x.ok).length;
  return {c,v:okc===crit.length&&tips===0?"good":okc>=crit.length-1?"mid":"bad"}}
function checkBody(t,tp){return checkBody5(t,tp)}
function fbHTML(r,done){
  const vd={good:done||"Well done!",mid:"Nearly there: add the missing move.",bad:"Not yet. Fix the red points and check again."}[r.v];
  return '<div class="hd"><span class="vd">'+vd+'</span><span class="meter">'+r.c.map(x=>'<span class="'+(x.ok?"ok":(x.crit?"no":"tip"))+'">'+(x.ok?"✓ ":"✗ ")+x.label+'</span>').join("")+'</span></div><div class="body">'+
  r.c.filter(x=>!x.ok).map(x=>'<div class="it '+(x.crit?"structure":"style")+'"><div><span class="k">'+(x.crit?"must fix":"tip")+'</span>'+esc(x.bad)+'</div></div>').join("")+
  r.c.filter(x=>x.ok).map(x=>'<div class="it praise"><div><span class="k">ok</span>'+esc(x.good)+'</div></div>').join("")+'</div>'}

let REG=[];
function selQ(key,label,opts,ans,expl,num){
  REG.push({key,kind:"sel",ans,expl});
  return '<div class="q" data-key="'+key+'"><div class="p"><span class="num">'+num+'</span>'+label+'</div><select class="sel" data-key="'+key+'"><option value="">Choose…</option>'+opts.map((o,i)=>'<option value="'+i+'">'+esc(o)+'</option>').join("")+'</select><div class="fb" id="fb_'+key+'"></div></div>'}
function rng(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000}}
function shuf(a,seed){const r=rng(seed),b=a.map((x,i)=>i);for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function selS(key,label,opts,ans,expl,num){const p=shuf(opts,key);return selQ(key,label,p.map(i=>opts[i]),p.indexOf(ans),expl,num)}
function pickQ(key,g,num){

const seg=(c,l,t)=>'<div class="seg '+c+'"><div class="st">'+l+'</div>'+esc(t)+'</div>';
const legend='<div class="legend"><span><i style="background:#efe6f7"></i>topic sentence / closing</span><span><i style="background:var(--chipS)"></i>idea</span><span><i style="background:var(--chipV)"></i>explain</span><span><i style="background:var(--chipN)"></i>result</span><span><i style="background:var(--chipL)"></i>example (optional)</span></div>';

const HINT={other:'<b>Plan:</b> Topic sentence (<b>To start, / Admittedly,</b> the other side, no “I”) → Idea 1: claim, <b>This is because…</b>, <b>As a result…</b> → <b>Another… / Besides, / Moreover,</b> Idea 2 → explain and result. (70–120 words)',

const EXC=DATA.EX,G=DATA.G;
const OPW={Positive:"Positive (a change for the better)",Negative:"Negative (a change for the worse)"};
steps.push({label:"1 Learn",html:()=>{
 const e1=EXC[0];
 let h='<div class="sec-title"><span class="n">STEP 1</span><h2>Learn: body paragraphs for “positive or negative development?” essays</h2></div>';
 h+='<div class="card"><h3>1 · The essay map</h3><p class="lead">Your teacher’s sample essays have <b>two body paragraphs</b>: first the <b>side I do NOT choose</b> (fairly), then <b>my side</b>.</p><table class="t"><tr><th>Paragraph</th><th>Its job</th><th>It starts with…</th></tr>'
 +'<tr><td><b>Introduction</b></td><td>Paraphrase + my position (Lesson 7)</td><td>It has become common to… I believe it is a change for the worse.</td></tr>'
 +'<tr><td><b>Body 1</b><br>the other side</td><td>Give the arguments for the side I did not choose: one or two ideas. No “I”.</td><td>Admittedly, … · To start, … · At the outset, …</td></tr>'
 +'<tr><td><b>Body 2</b><br>my side</td><td>Give my arguments: two ideas. Stronger and clear.</td><td>I, however, believe … · Despite this, I … · That said, I consider …</td></tr>'

 h+='<div class="card"><h3>2 · Topic sentences from the samples</h3><table class="t"><tr><th>Body 1 · the other side (no “I”)</th><th>Body 2 · my side (“I” + turn word)</th></tr>'
 +'<tr><td>Admittedly, delayed marriage can have some positive implications for both individuals and society.</td><td>I, however, believe starting a family in one’s thirties is generally a negative trend.</td></tr>'

 h+='<div class="card"><h3>3 · The key skill: turn an argument into a developed idea</h3><p class="lead">An <b>argument</b> is only a few words (“security”, “falling birth rates”). A <b>developed idea</b> answers three questions. Add the question words and you never run out of things to write.</p><table class="t"><tr><th>Question</th><th>What you write</th><th>Phrases from the samples</th></tr>'
 +'<tr><td><b>What?</b></td><td><b>Claim:</b> name the argument in one sentence.</td><td>The main advantage is … · The most concerning aspect is … · The primary advantage of … is … · One downside is …</td></tr>'
 +'<tr><td><b>Why?</b></td><td><b>Explain:</b> the reason or the way it works.</td><td>This is because … · Since … · Unlike with …, … · That is, …</td></tr>'
 +'<tr><td><b>So what?</b></td><td><b>Result:</b> what happens because of it, one step further.</td><td>As a result, … · Therefore, … · Such transparency ensures that … · If this trend persists, …</td></tr>'
 +'<tr><td><b>Example?</b><br>(optional)</td><td><b>Example:</b> a real country, company or person.</td><td>Germany and Japan are … · For instance, … · Take … as an example</td></tr></table></div>';
 const LAD=[["Level 1 · Argument only","Online currencies are secure.","This is only a claim. A paragraph with ten of these would stay empty."],["Level 2 · + Explain (Why?)","The primary advantage of this medium of exchange is security. Unlike with fiat money, transactions made with cryptocurrencies are more secure seeing as they can be tracked by everyone.","Better: now the reader knows why."],["Level 3 · + Result (So what?)","The primary advantage of this medium of exchange is security. Unlike with fiat money, transactions made with cryptocurrencies are more secure seeing as they can be tracked by everyone. Such transparency ensures that there is limited risk of fraud.","Fully developed: claim → why → result. This is the real sample paragraph."]];
 h+='<div class="card"><h3>4 · From an argument to a fully developed idea</h3><p class="lead">One argument from your teacher’s sample essay, built in three levels.</p>'+LAD.map((r,i)=>'<div class="seg '+["s","v","n"][i]+'" style="margin:6px 0"><div class="st">'+r[0]+'</div>'+esc(r[1])+'<div style="font-size:14px;margin-top:4px;color:#445">▸ '+esc(r[2])+'</div></div>').join("")+'<div class="note"><b>Rule:</b> every idea needs at least <b>Claim + Why</b>. Strong ideas also show a <b>Result</b>.</div></div>';
 const ST7=[["1 · Topic sentence","Say the main idea of the paragraph. Body 1: the other side. Body 2: my side.","Admittedly, … · To start, … · I, however, believe … · That said, I consider …"],
 ["2 · Claim (first idea)","Name your first idea in one sentence.","The main issue is … · The primary advantage is … · The most concerning aspect is …"],
 ["3 · Explain","Say why or how.","This is because … · Since … · That is, … · In other words, …"],
 ["4 · Result","Show what happens because of it.","As a result, … · Therefore, … · This means that … · In this way, …"],
 ["5 · Example (optional)","A short, specific example. You can skip it.","… such as … · For instance, … · Germany and Japan are …"],
 ["6 · Second idea","Start a new idea with a link. Repeat steps 2–4 in a shorter form.","Another downside is … · More important is … · Besides, … · Furthermore, … · A fall in … is also argued to be …"],
 ["7 · Closing (optional)","One sentence that sums up. No new idea.","In this regard, … · In this sense, …"]];
 h+='<div class="card"><h3>5 · Build a paragraph in order: seven steps</h3><table class="t"><tr><th>Step</th><th>What you do</th><th>Phrases from the samples</th></tr>'+ST7.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join("")+'</table><div class="grp">Real Body 2 · '+e1.src+'</div>'+cparts(e1.b2)+'<div class="note">'+esc(e1.note)+'</div></div>';
 h+='<div class="card"><h3>6 · Body 1 and Body 2: what is different?</h3><table class="t"><tr><th></th><th>Body 1 · the other side</th><th>Body 2 · my side</th></tr>'
 +'<tr><td><b>Voice</b></td><td>Neutral: “it can be argued”, “one cannot dismiss”</td><td>Personal and firm: “I believe”, “I consider”</td></tr>'

 return h}});

/* ---------- build */
function build(){
 REG=[];
 document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header><nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">MrIkromov’s IELTS · Instagram @ustoz_jasur · Telegram @TeamMrIkromov</div><div id="toast"></div>';
 const st=$("#steps"),mn=$("#main");
 steps.forEach((s,si)=>{
  const b=document.createElement("button");b.className="step";b.id="st"+si;b.innerHTML=s.label+'<span class="ct" id="ct'+si+'"></span>';b.onclick=()=>showStep(si);st.appendChild(b);
  const sec=document.createElement("section");sec.id="sec"+si;sec.style.display="none";
  if(s.subnav){
   sec.innerHTML='<div class="sec-title"><span class="n">STEP 4</span><h2>Practice tests · 10 questions</h2></div><p class="lead">Use what you learned. For each question, write two body paragraphs: the other side, then your side. Earn a ⭐ for each!</p><div class="nums" id="nv'+si+'"></div><div id="uv'+si+'"></div>';
   mn.appendChild(sec);
   const nv=$("#nv"+si,sec),uv=$("#uv"+si,sec);
   s.units.forEach((u,ui)=>{const nb=document.createElement("button");nb.className="sub";nb.id="u"+si+"_"+ui;nb.textContent=ui+1;nb.onclick=()=>showUnit(si,ui);nv.appendChild(nb);const bx=document.createElement("div");bx.innerHTML=u.html();bx.style.display="none";u.box=bx;uv.appendChild(bx)});
  }else{sec.innerHTML=s.html();mn.appendChild(sec)}
 });
 wire();applyState()}
function showStep(si){ST.step=si;steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});if(steps[si].subnav)showUnit(si,Math.min(ST.unit[si]||0,steps[si].units.length-1));window.scrollTo({top:0});save()}
function showUnit(si,ui){ST.unit[si]=ui;steps[si].units.forEach((u,k)=>{u.box.style.display=k===ui?"":"none";$("#u"+si+"_"+k).classList.toggle("on",k===ui)});save()}
function stepKeys(si){const root=$("#sec"+si);return $$("[data-key]",root).map(e=>e.dataset.key).filter((v,i,a)=>a.indexOf(v)===i&&REG.some(r=>r.key===v))}
function progress(){let tot=REG.length,done=REG.filter(r=>ST.ok[r.key]).length;$("#pbar").style.width=Math.round(done/tot*100)+"%";$("#pnum").textContent=done+" / "+tot+" done";
 steps.forEach((s,si)=>{const ks=stepKeys(si),d=ks.filter(k=>ST.ok[k]).length;const c=$("#ct"+si);if(c){c.textContent=ks.length?d+"/"+ks.length:"";$("#st"+si).classList.toggle("full",ks.length>0&&d===ks.length)}});stars()}
const CHEER=["Great job! 🎉","Excellent! ⭐","You nailed it! 💪","Superb idea! 🚀","Well done! 👏"];
function cheer(){toast(CHEER[Math.floor(Math.random()*CHEER.length)])}
function stars(){let n=0;TOPICS.forEach((t,ui)=>{const a=ST.ok["B1_"+t.n]&&ST.ok["B2_"+t.n];n+=a?1:0;const el=document.getElementById("u3_"+ui);if(el)el.textContent=(ui+1)+(a?" ⭐":"")});const p=document.getElementById("pnum");if(p)p.textContent+="  ·  ⭐ "+n+"/"+TOPICS.length}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function wire(){
 $$("select.sel").forEach(el=>el.addEventListener("change",()=>runSel(el.dataset.key,true)));
 $$("textarea").forEach(ta=>ta.addEventListener("input",()=>{const id=ta.id;if(id.startsWith("ta_")){const k=id.slice(3);ST.saved[k]=ta.value;wc(k)}else{ST.saved[id]=ta.value}save()}));
 document.body.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const k=b.dataset.key,a=b.dataset.act;
  if(a==="hint")$("#hint_"+k).classList.toggle("on");
  if(a==="model")$("#md_"+k).style.display="";
  if(a==="check")runWrite(k);
})}
function wc(k){const ta=$("#ta_"+k),n=nw(ta.value);$("#wc_"+k).textContent=n+" words"}
function runSel(k,say){const r=REG.find(x=>x.key===k),el=$('select[data-key="'+k+'"]'),fb=$("#fb_"+k);if(el.value==="")return;const ok=+el.value===r.ans;el.className="sel "+(ok?"ok":"no");
 const msg=r.fbs?r.fbs[+el.value]:(ok?r.expl:"");
 fb.className="fb on "+(ok?"good":"bad");fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"Correct! ":"Not quite. ")+'</span></div><div class="body">'+esc(msg||"")+'</div>';
 ST.saved[k]=el.value;if(ok){ST.ok[k]=1}else delete ST.ok[k];if(say)save();progress()}
function runWrite(k){const r=REG.find(x=>x.key===k),ta=$("#ta_"+k);if(!ta.value.trim()){toast("Write your paragraph first");return}
 const res=checkBody(ta.value,r.tp),fb=$("#fb_"+k);fb.className="fb on "+res.v;fb.innerHTML=fbHTML(res,"Well done! This is a developed body paragraph.");ta.className=res.v==="good"?"ok":(res.v==="bad"?"no":"");
 if(res.v!=="bad"){if(!ST.ok[k])cheer();ST.ok[k]=1;$("#dn_"+k).textContent="✓ done";$("#md_"+k).style.display=""}else{delete ST.ok[k];$("#dn_"+k).textContent=""}
 save();progress()}
function applyState(){
 REG.forEach(r=>{if(r.kind==="sel"){const v=ST.saved[r.key];if(v==null)return;const el=$('select[data-key="'+r.key+'"]');el.value=v;runSel(r.key,false)}
  else if(r.kind==="write"){const v=ST.saved[r.key];if(v==null)return;const ta=$("#ta_"+r.key);ta.value=v;wc(r.key);{const pv=ST.saved["pl_"+r.key],pe=$("#pl_"+r.key);if(pv!=null&&pe)pe.value=pv}if(ST.ok[r.key])$("#dn_"+r.key).textContent="✓ done"}
});
 showStep(Math.min(ST.step||0,steps.length-1));progress()}
build();window.__T=TOPICS;window.runWrite=runWrite;
})();
