<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing Task 1 · Chapter 3 · Mr Ikromov's IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Writing Lab — shared look for every chapter (2026-11-07).
   Same colours, shapes and fonts as ieltswithmrikromov.com:
   lapis-to-turquoise band, Unbounded headings, Nunito Sans text,
   rounded rectangles only (12 / 14 / 20 / 28 px), one saffron button. */
:root{
  --ink:#f6f5f1;--panel:#fff;--panel2:#efede6;--line:#e3dfd4;--paper:#17213a;--dim:#3a4560;--mist:#55607a;
  --brass:#2456b0;--onbrass:#fff;--sage:#13807c;--sageT:#e2f2f0;--coral:#b23a48;--coralT:#f8e1e4;--amber:#9a5b12;--amberT:#fbefd9;
  --saffron:#e6a33a;--onsaffron:#17213a;--band:#22489a;
  --chipS:#dfe8fb;--chipSt:#1f4aa0;--chipV:#fbe0e6;--chipVt:#a02a44;--chipL:#fdf0d2;--chipLt:#8a5a0c;--chipN:#dcf3ef;--chipNt:#0f6b66;
  --mark:#fff2b3;--shadow:0 1px 2px rgba(23,33,58,.06),0 6px 18px -10px rgba(23,33,58,.18);
  --gUp:#13807c;--gDown:#b23a48;--gMix:#1f3a75;--g2:#c4622d;--grid:#e8e4da;--gtext:#55607a;
}
:root[data-theme="dark"]{
  --ink:#0f1626;--panel:#172036;--panel2:#1e2944;--line:#2b3858;--paper:#eef0f6;--dim:#c6ccda;--mist:#a3abbf;
  --brass:#7fa6f2;--onbrass:#0f1626;--sage:#7fd6d2;--sageT:#123a3c;--coral:#f29aa6;--coralT:#3e1c22;--amber:#f2c07a;--amberT:#3a2a12;
  --saffron:#f0b95a;--band:#1b3570;
  --chipS:#22335c;--chipSt:#b9cdf7;--chipV:#4a2230;--chipVt:#f5b8c6;--chipL:#453512;--chipLt:#f6d48b;--chipN:#153f3d;--chipNt:#9de3dc;
  --mark:#5a4a12;--shadow:none;
  --gUp:#5fd0c6;--gDown:#f08a99;--gMix:#a9bdf0;--g2:#f2a76b;--grid:#2b3858;--gtext:#a3abbf;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Unbounded,"Nunito Sans",system-ui,sans-serif;letter-spacing:-.01em}
b,strong{font-weight:800}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- band ---- */
.band{color:#fff;background:var(--band);background-image:linear-gradient(115deg,var(--band) 0%,#1f6fae 55%,#1a9bb5 100%);border-radius:0 0 28px 28px;padding:22px 0 20px}
.band .kick{font-size:13px;font-weight:800;opacity:.9;letter-spacing:.02em}
.band h1{margin:6px 0 6px;font-size:28px;line-height:1.15;font-weight:600}
.band p{margin:0;max-width:760px;font-size:15px;opacity:.92}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1;max-width:360px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:999px;transition:width .4s}
.prog b{font-size:14px;white-space:nowrap}

/* ---- step menu ---- */
.steps{position:sticky;top:0;z-index:20;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.steps .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.steps .row::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px}
.step .no{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--panel2);font-size:12px}
.step .ct{font-size:12px;color:var(--mist);font-weight:700}
.step.on{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.step.on .no{background:rgba(255,255,255,.22)}.step.on .ct{color:inherit;opacity:.85}
.step.full .ct{color:var(--sage)}.step.on.full .ct{color:inherit}

main{padding:20px 0 40px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.sec-title h2{margin:0;font-size:21px;font-weight:600}
.sec-title .n{font-family:Unbounded,sans-serif;font-size:13px;color:var(--brass);font-weight:600}
.lead{color:var(--dim);margin:0 0 14px;font-size:15px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600}
.card .ins{color:var(--dim);font-size:14px;margin-bottom:12px}
.note{border-radius:14px;background:var(--panel2);padding:12px 14px;font-size:14.5px;color:var(--dim);margin:0 0 16px}
.note b{color:var(--paper)}

/* ---- sub menu (structures, drills) ---- */
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sub{border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:6px 11px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.sub small{color:var(--mist);font-weight:700}
.sub.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass)}
.sub.full small{color:var(--sage)}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nums .sub{min-width:42px;justify-content:center;font-family:Unbounded,sans-serif;font-weight:600}
.nums .sub.seen:not(.on){background:var(--panel2)}

/* ---- learn panel ---- */
.lhd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lhd .big{font-family:Unbounded,sans-serif;font-size:30px;font-weight:600;color:var(--brass);line-height:1}
.lhd h3{font-size:17px;margin:0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.chip{border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px;white-space:pre}
.chip.s{background:var(--chipS);color:var(--chipSt)}.chip.v{background:var(--chipV);color:var(--chipVt)}
.chip.l{background:var(--chipL);color:var(--chipLt)}.chip.n{background:var(--chipN);color:var(--chipNt)}
.chip.p{padding:4px 2px;color:var(--mist)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mist);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.eg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.eg .tg{flex:0 0 auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);background:var(--panel2);border-radius:8px;padding:2px 7px;height:fit-content;margin-top:2px}
.eg.real .tg{background:var(--sageT);color:var(--sage)}
.eg b{background:var(--chipL);color:var(--chipLt);border-radius:6px;padding:0 3px}
.rule,.trap{border-radius:14px;padding:11px 13px;font-size:14.5px;margin-top:10px}
.rule{background:var(--sageT)}.rule>b:first-child{color:var(--sage)}
.trap{background:var(--coralT)}.trap>b:first-child{color:var(--coral)}
.trap s{color:var(--coral)}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.gcap{font-size:13px;color:var(--mist);margin:6px 2px 0}
.gmodel{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:14.5px;margin-top:8px}
.replay{margin-top:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:5px 11px;font-weight:800;font-size:13px}
.yourturn{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.yourturn h4{margin:0 0 8px;font-size:15px;color:var(--sage)}

table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.t th{text-align:left;background:var(--panel2);padding:9px 12px;font-weight:800}
.t td{padding:9px 12px;border-top:1px solid var(--line)}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mist .x,.mist .v{border-radius:14px;padding:10px 12px;font-size:14.5px}
.mist .x{background:var(--coralT)}.mist .x s{color:var(--coral)}
.mist .v{background:var(--sageT)}

/* ---- charts ---- */
svg.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--gtext);font-size:11px;font-family:"Nunito Sans",system-ui,sans-serif}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .lbl{font-size:11.5px;font-weight:800;font-family:"Nunito Sans",system-ui,sans-serif}
.chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.3s ease-out forwards}
@keyframes dl{to{stroke-dashoffset:0}}
.chart .key{font-size:11.5px;font-weight:700;fill:var(--paper);font-family:"Nunito Sans",system-ui,sans-serif}

/* ---- graph exercise cards ---- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.gcard .gt{font-weight:800;font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gcard .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--panel2);color:var(--mist);border-radius:8px;padding:2px 7px}
.gcard .gt span{font-weight:600;color:var(--mist);font-size:13px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-size:15px;margin-bottom:8px}
.q .p .num{font-weight:800;color:var(--brass);margin-right:6px}
.q .p .tg{display:inline-block;font-size:11px;font-weight:800;background:var(--chipS);color:var(--chipSt);border-radius:8px;padding:1px 7px;margin-right:4px}
.q .p .sm{font-size:13px;color:var(--mist)}
.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:14.5px;margin-bottom:6px}
.wk .l{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}
select.sel{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--paper);min-width:150px}
select.sel.ok{border-color:var(--sage);background:var(--sageT)}select.sel.no{border-color:var(--coral);background:var(--coralT)}

/* ---- input + coach ---- */
.iw{margin-top:6px}
.iw .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--paper);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:62px;outline:none}
textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:8px 16px;font-weight:800;font-size:14px;background:var(--brass);color:var(--onbrass)}
.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:12.5px;color:var(--mist)}
.done-tag{font-size:12.5px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:14px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.fb.on{display:block}
.fb .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px}
.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:12px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:15px;line-height:1.7;margin-bottom:6px}
.ann mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--amber)}
.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:14.5px}
.it .k{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}
.tryit{margin-top:3px;font-weight:800;color:var(--sage)}
.why{margin-top:2px;color:var(--mist);font-size:13.5px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:14.5px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.blockbar .score{font-weight:800;color:var(--dim);font-size:14px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.foot{color:var(--mist);font-size:12.5px;text-align:center;padding:10px 18px 30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);font-weight:800;border-radius:14px;padding:9px 16px;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .band{padding:16px 0 16px;border-radius:0 0 20px 20px}
  .band h1{font-size:22px}
  .band p{font-size:14px}
  .two,.ggrid,.mist{grid-template-columns:1fr}
  .card{padding:14px}
  .step{padding:7px 11px;font-size:13px}
  .sec-title h2{font-size:18px}
  .chip{font-size:13px}
}
@media print{.steps,.irow,.blockbar,.nextbar{display:none}.sec{display:block!important}}

/* added 2026-11-09 (Chapter 3): gaps, wider charts, chart marks, forecast shade */
input.gap{font:inherit;font-weight:700;color:var(--paper);background:var(--panel2);border:0;border-bottom:2px solid var(--brass);border-radius:8px 8px 0 0;padding:2px 6px;margin:0 3px;max-width:100%;min-height:30px}
input.gap:focus{outline:2px solid var(--brass);outline-offset:1px}
input.gap.ok{border-bottom-color:var(--sage);background:var(--sageT)}
input.gap.no{border-bottom-color:var(--coral);background:var(--coralT)}
.q .p.gp{line-height:2.1}
.gbox.wide{max-width:560px;margin:8px auto 0}
.chart .shade{fill:var(--panel2);opacity:.85}
.chart .mark circle{fill:var(--brass)}
.chart .mark text{fill:var(--onbrass);font:800 10px "Nunito Sans",system-ui,sans-serif}

</style>
</head>
<body>
<script>
/* Writing Task 1 · Chapter 3 · The language of change.
   Written from Mr Ikromov's IELTS Writing Task 1 Course Book, Chapter 3 (Nov 2026):
   the same steps, graphs, exercises and answers as the book.
   Build: node tools/writing-lab/build.mjs wt1-ch03  →  public/practice/writing-lab/task1-ch03.html */
const CHAPTER={
 id:"wt1-ch03",
 kicker:"Writing Task 1 · Chapter 3",
 title:"The language of <span style=\"color:#ffd27a\">change</span>",
 lead:"Verbs, adverbs, nouns and adjectives for every trend. Learn the words, then use them on real graphs. The Writing Coach checks the <b>words</b>, the <b>figures</b>, the <b>direction</b>, the <b>grammar</b> and the <b>spelling</b> of every sentence.",
 footer:"Mr Ikromov's IELTS · Writing Task 1 · Chapter 3. The Writing Coach is a teaching tool: it finds common mistakes and explains them, but it is not an examiner. Compare with the model answer and ask your teacher.",
 grammar:[
  {re:"\\b(an?|the)\\s+(?!early|only|likely|yearly|monthly|daily|weekly|quarterly|elderly)(\\w+ly)\\s+(rise|increase|fall|decline|drop|decrease|growth|reduction|fluctuation|recovery|improvement|dip|climb|jump)\\b",msg:"A noun needs an adjective, not an adverb: a significant increase, not a significantly increase.",fix:"a significant increase · a slight decline",why:"Never put an adverb (-ly) before a noun."},
  {re:"\\b(doubled|halved|tripled|doubles|halves|double|halve)\\s+(dramatically|significantly|considerably|sharply|slightly|noticeably|markedly|rapidly|steadily|gradually|substantially)\\b",msg:"Do not use an adverb with double / halve: they already say how big the change is.",fix:"The figure doubled."},
  {re:"\\ban?\\s+(level off|levels off|remain stable|go up|go down)\\b",msg:"Level off, remain stable and go up / down are verbs. They cannot be nouns.",fix:"levelled off · a period of stability · a rise"},
  {re:"\\bbetween\\s+\\$?\\d[\\d,.]*\\s*(%|per ?cent)?\\s+to\\b",msg:"Use between … and, or from … to (not between … to).",fix:"between 2004 and 2008 · from 2004 to 2008"},
  {re:"\\b(rise|fall|increase|decrease|decline|drop|growth|reduction)\\s+on\\s+the\\b",msg:"A change in something: a fall in the number of cars.",fix:"a fall in the number of …"}
 ],
 steps:[
  {no:"3.1",name:"Verbs & adverbs",title:"Verbs and adverbs",subnav:true,
   lead:"Choose the verb for the direction. Choose the adverb for the size of the change.",
   blocks:[
    {type:"html",title:"Step 1 · Choose the verb",html:'<table class="t"><thead><tr><th>Going up</th><th>Going down</th></tr></thead><tbody><tr><td>to increase · to rise · to improve · to go up · to grow · to climb · to double*</td><td>to decrease · to fall · to drop · to go down · to decline · to reduce · to halve*</td></tr></tbody></table><p class="sm">* <b>double</b> and <b>halve</b> already say how big the change is. Do not use adverbs with them.</p>'},
    {type:"html",title:"Step 2 · Verbs with a special meaning",html:'<table class="t"><thead><tr><th>Verb</th><th>Meaning</th><th>Real example</th></tr></thead><tbody><tr><td><b>fluctuate</b></td><td>go up and down</td><td>Germany’s rate fluctuated slightly between about 1.55% and 1.8%.</td></tr><tr><td><b>remain stable</b></td><td>stay at the same level</td><td>The self-employed figure stabilized at that level from 1997.</td></tr><tr><td><b>level off</b></td><td>remain stable after a rise or a fall</td><td>It rose to 250,000 in 2004 and then levelled off at about that figure.</td></tr><tr><td><b>recover</b></td><td>improve after dropping</td><td>Finland recovered steadily to reach 24% again in 2011.</td></tr></tbody></table><div class="mist"><div class="v">Simon’s earnings fell from $25 to $20 but then recovered to $40.</div><div class="x"><s>Simon earned $20 on Tuesday but $40 on Wednesday. Simon’s earnings recovered.</s> (no fall first: “recover” needs a drop before it)</div></div>'},
    {type:"html",title:"Step 3 · Choose the adverb",html:'<table class="t"><thead><tr><th>Big changes</th><th>Small changes</th><th>Steady changes</th></tr></thead><tbody><tr><td>dramatically · significantly · considerably · noticeably · markedly</td><td>slightly · minimally · negligibly · marginally</td><td>gradually · steadily · consistently</td></tr></tbody></table><p class="sm"><b>Fluctuate</b> takes its own adverbs: <b>mildly</b> for small ups and downs, <b>wildly</b> for big ones.</p><table class="t"><thead><tr><th>Real change</th><th>Sentence</th><th>Size</th></tr></thead><tbody><tr><td>Germany 30% → 32%</td><td>Germany’s figure edged up / rose slightly.</td><td>small</td></tr><tr><td>UK 17% → 22%</td><td>The UK’s figure grew gradually.</td><td>steady</td></tr><tr><td>Ferry 3% → 11%</td><td>Ferry use rose noticeably.</td><td>medium</td></tr><tr><td>USA 1.8 million → 1 million</td><td>It plunged / fell dramatically.</td><td>big</td></tr><tr><td>Italy 2% → 22.5%</td><td>Italy’s figure rose dramatically / surged.</td><td>very big</td></tr></tbody></table><div class="note"><b>Verbs that already contain the adverb.</b> Big: surge, soar, rocket, plummet, plunge. Small: edge up, creep up, inch up, dip. Use them only when the change really is big or small.</div>'},
    {type:"choose",generic:true,data:"special",key:"sv",label:"Special verbs",title:"Practice · Which special verb?",ins:"Choose the verb that matches each description.",pick:"Choose a verb",options:["fluctuated","remained stable","levelled off","recovered"]},

  {no:"3.2",name:"Nouns & adjectives",title:"Nouns and adjectives",subnav:true,
   lead:"Every verb has a noun. A noun needs an adjective, not an adverb. This gives you a second way to write every sentence.",
   blocks:[
    {type:"html",html:'<table class="t"><thead><tr><th>Nouns</th><th>Adjectives</th></tr></thead><tbody><tr><td>an increase · a rise · an improvement · a growth · a fluctuation · a reduction · a decrease · a fall · a drop · a decline · a recovery</td><td>dramatic · significant · considerable · noticeable · marked · slight · minimal · negligible · marginal · gradual · steady · consistent · mild · wild</td></tr></tbody></table><div class="mist"><div class="x"><s>a significantly increase</s></div><div class="v">a significant increase</div><div class="x"><s>a remain stable · a level off · a go up</s></div><div class="v">a period of stability · a rise · a levelling off</div></div>'},
    {type:"html",title:"Three patterns with nouns",html:'<table class="t"><tbody><tr><td><b>Verb</b></td><td>The number of cars <b>rose noticeably</b>.</td></tr><tr><td><b>A</b></td><td>The number of cars <b>saw a noticeable rise</b>. (sees / witnesses / undergoes / experiences + a(n) + adjective + noun)</td></tr><tr><td><b>B</b></td><td><b>There was a noticeable rise</b> in the number of cars.</td></tr><tr><td><b>C</b></td><td><b>A noticeable rise was observed</b> in the number of cars. (passive: was seen / was observed)</td></tr></tbody></table>'},

  {no:"3.3",name:"Real graphs",title:"Seen on real graphs",
   lead:"Here are the five ways of writing about change, on one real task: sugar production and consumption in India.",
   blocks:[
    {type:"html",graph:"SU",html:'<table class="t"><tbody><tr><td><b>Verb + adverb</b></td><td>Consumption <b>rose slowly but steadily</b> over the decade.</td></tr><tr><td><b>Strong verb</b></td><td>Production <b>soared</b> to a peak of 28 million tonnes in 2007.</td></tr><tr><td><b>Noun</b></td><td>Production fell to 16.5 million in 2009, <b>a collapse</b> of more than 10 million tonnes.</td></tr><tr><td><b>Recover</b></td><td>After a collapse to 16.5 million in 2009, production <b>recovered</b> to about 25.5 million in 2011.</td></tr><tr><td><b>Adjective</b></td><td>The sugar graph shows a <b>dramatic</b> peak and a <b>sharp</b> fall in production.</td></tr></tbody></table>'}]},

   lead:"Before you write about real graphs, you must see the shape and say it in one sentence. Graphs A–I are in the past; J–L are forecasts.",
   note:"<b>Choose the tense from the time words.</b> Past dates → past simple (<i>rose, fell</i>). Future dates → forecasts (<i>is predicted to, is expected to, will</i>). No dates at all → present simple. Name the subject, the verb or noun of change and one or two figures. Do not use the same verb twice.",
   blocks:[{type:"graphs",data:"d3"}]},
  {no:"3.5",name:"Connect the trends",title:"Connect the trends",
   lead:"A good sentence does not describe one change. It joins two. If the second change continues the first, you add. If it reverses it, you contrast.",
   blocks:[
    {type:"html",html:'<table class="t"><thead><tr><th>Addition: the trend continues</th><th>Contrast: the trend turns</th></tr></thead><tbody><tr><td>and then · and this was followed by · continued to · then · reaching · before reaching</td><td>however · but · although · while · before falling · in contrast · after which</td></tr></tbody></table><div class="mist"><div class="v"><b>Addition.</b> Mobile phone users rose gradually from 4 million in 1990 to 12 million in 2000, and then continued their upward trend over the next fifteen years, reaching 85 million in 2015.</div><div class="v"><b>Contrast.</b> Newspaper sales increased sharply from 20,000 in 1990 to a high of 90,000 in 2005; however, they then began to decline steadily to 56,000 by 2015.</div></div>'},

  {no:"3.7",name:"Prepositions",title:"The right preposition",subnav:true,
   lead:"One small word can make a sentence wrong. Learn the job of each preposition.",
   blocks:[
    {type:"html",html:'<table class="t"><thead><tr><th>Word</th><th>Job</th><th>Example</th></tr></thead><tbody><tr><td><b>to</b></td><td>the final figure after a change</td><td>Unemployment rose <b>to</b> 10% in 2008.</td></tr><tr><td><b>by</b></td><td>the size of the change</td><td>Unemployment fell <b>by</b> 2%, from 10% to 8%.</td></tr><tr><td><b>from … to</b></td><td>the start and the end</td><td>Sales climbed <b>from</b> 2,000 <b>to</b> 5,500.</td></tr><tr><td><b>at</b></td><td>a figure that stays, or a peak / a low point</td><td>Sales peaked <b>at</b> 60,000. The rate remained <b>at</b> 5%.</td></tr><tr><td><b>of</b></td><td>a noun of change + size, or a peak / low + figure</td><td>a rise <b>of</b> 8% · a low <b>of</b> 1.2 million</td></tr><tr><td><b>in</b></td><td>a change in what (the thing) · a year or month</td><td>a fall <b>in</b> the number of cars · <b>in</b> 2009</td></tr><tr><td><b>with</b></td><td>“having” a figure (often in a ranking)</td><td>Japan led <b>with</b> 52 medals.</td></tr><tr><td><b>between … and</b></td><td>a period, or a range</td><td><b>between</b> 2004 <b>and</b> 2008 · <b>between</b> 30 <b>and</b> 40%</td></tr></tbody></table><div class="mist"><div class="x"><s>Between 2004 to 2008</s></div><div class="v">Between 2004 and 2008 / From 2004 to 2008</div><div class="x"><s>a rise to 8%</s> (when 8% is the size of the rise)</div><div class="v">a rise of 8% (a rise to 8% only if 8% is the final figure)</div><div class="x"><s>a fall on the number of cars</s></div><div class="v">a fall in the number of cars</div></div>'},
    {type:"gaps",data:"q3g",key:"q3g",label:"3G · Prepositions",title:"Try it 3G · Prepositions",ins:"Fill each gap with one word. Some sentences have two gaps. Press <b>Enter</b> to move to the next gap."}]},
  {no:"3.8",name:"Saying ‘about’",title:"Approximation: saying ‘about’",subnav:true,
   lead:"A graph rarely gives an exact figure. Never write a figure you cannot read: say whether the real figure is a little above, a little below or close to your number.",
   blocks:[
    {type:"html",html:'<table class="t"><thead><tr><th>A little above</th><th>A little below</th><th>Close to it</th></tr></thead><tbody><tr><td>just over 30% · slightly more than 30% · a little over 30% · well over 30% · in excess of 30%</td><td>just under 30% · slightly less than 30% · almost 30% · nearly 30% · well under 30% · just short of 30%</td><td>about 30% · around 30% · roughly 30% · approximately 30% · 30% or so · some 30%</td></tr></tbody></table><div class="note"><b>Time needs approximation too.</b> Do not repeat every year. Say: over the next two years · in the following three years · in the first half of the period · during the middle years · by the end of the period · in the mid-1980s.</div><div class="mist"><div class="v">Germany stood at about 30% in 2000 and edged up to roughly 32% by 2012.</div><div class="v">Car use peaked at roughly 62% in 1999 and this was followed by a gradual decline to just over 51% in 2009.</div></div><p class="sm"><b>Do not overuse them.</b> “About” in front of every number looks nervous. Mix them: one about, one roughly, one just over, one exact figure.</p>'},

const P = (re,msg,fl)=>({re:new RegExp(re,fl||"i"),msg});
const NOUNS="rise|increase|growth|fall|decline|drop|decrease|reduction|fluctuation|recovery|improvement|dip|surge|plunge|jump|climb|collapse|downturn|upturn";
const VERBS="rose|risen|increased|grew|climbed|improved|went up|fell|decreased|declined|dropped|went down|reduced|recovered|fluctuated";
const ADVL="dramatically|significantly|considerably|noticeably|markedly|slightly|minimally|negligibly|marginally|gradually|steadily|consistently|sharply|rapidly|quickly|slowly|substantially|moderately|mildly|wildly|steeply|swiftly|modestly|massively|hugely";
const STRONG="surged|soared|rocketed|skyrocketed|plummeted|plunged|collapsed|edged up|edged down|crept up|inched up|dipped|more than doubled|doubled|tripled|halved|shot up";
const PAT = {
 thereWas:P("^there (?:was|were|has been|will be|is (?:expected|predicted|projected|likely) to be) (?:an?|some) (?:[a-z-]+ )*?(?:"+NOUNS+")\\b","Begin with There was a(n) + adjective + noun (for example There was a steady rise in …)."),
 sawNoun:P("\\b(?:saw|sees|see|witnessed|witnesses|experienced|experiences|underwent|undergoes|recorded) (?:an?|some) (?:[a-z-]+ )*?(?:"+NOUNS+")\\b","Use X + saw / witnessed / experienced + a(n) adjective + noun."),
 verbAdv:P("\\b(?:"+VERBS+")\\b(?: [\\w%.]+){0,8}? (?:"+ADVL+")\\b|\\b(?:"+ADVL+") (?:"+VERBS+")\\b|\\b(?:"+STRONG+")\\b","Use a verb + adverb (rose steadily, fell dramatically) or a strong verb (surged, plunged)."),
 noThere:{re:/^there (was|were)\b|\b(was|were) (observed|seen)\b/i,not:true,msg:"This one needs a verb + adverb, not a noun. Start with the subject: X rose steadily …"},
 future:P("\\b(?:will|(?:is|are) (?:predicted|expected|projected|forecast|set|likely|anticipated) to|(?:is|are) going to)\\b","These dates are in the future: use is predicted to / is expected to / will + verb."),
 notFuture:{re:/\bwill\b|\b(is|are) (predicted|expected|projected|forecast|set) to\b/i,not:true,msg:"These dates are in the past: use the past simple (rose, fell, remained)."},
 fluct:P("\\bfluctuat\\w*","The line goes up and down: use fluctuate (fluctuated wildly / mildly)."),
 stable:P("\\b(?:remain\\w*|stay\\w*|stood|stable|stabili[sz]\\w*|unchanged|constant|level\\w* off|flat)\\b","The line is flat: use remained stable / stayed at + figure."),
 connector:P("\\b(?:and then|then|this was followed by|followed by|continued|continuing|reaching|however|but|although|though|while|whereas|in contrast|after which|before \\w+ing|after \\w+ing)\\b","Join the two changes with a connector: and then · continued to · reaching · however · but · before falling · after which."),
 p1:P("\\bsteady (?:climb|rise|increase|growth)|(?:climbed|rose|grew|increased) steadily|steadily (?:climbed|rose|grew|increased)","Use phrase 1: a steady climb (or climbed steadily)."),
 p2:P("\\bspik\\w*|\\bshot up\\b","Use phrase 2: a spike (or spiked)."),
 p3:P("\\bsharp (?:drop|fall|decline)|(?:dropped|fell|declined|plunged|plummeted) sharply|\\bplummet\\w*|\\bplung\\w*","Use phrase 3: a sharp drop (or dropped sharply)."),
 p4:P("\\bpartial(?:ly)? recover\\w*|recover\\w* (?:partly|partially)|\\brecover\\w*","Use phrase 4: a partial recovery (or recovered partly)."),
 p9:P("\\ball-time low|\\blowest\\b|\\ba low of\\b","Use phrase 9: an all-time low."),
 p10:P("\\brapid (?:rise|increase|growth|climb)|(?:rise|rose|increase|grow|climb)\\w* rapidly|\\brapidly (?:rise|rising|increase|grow|climb)","Use phrase 10: a rapid rise (or rise rapidly)."),
 p12:P("\\brecord high\\b|\\ball-time high\\b|\\bhighest\\b|\\bpeak\\w*","Use phrase 12: a record high.")
};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function norm(t){return t.toLowerCase().replace(/[’‘]/g,"'").replace(/[–—]/g,"-").replace(/\$/g,"").replace(/(\d),(?=\d{3}\b)/g,"$1").replace(/\s+/g," ").trim().replace(/[.!]+$/,"")}
function numsOf(t){return (norm(t).match(/\d+(?:\.\d+)?/g)||[]).map(x=>String(parseFloat(x)))}
function toks(t){return (norm(t).match(/[a-z]+/g)||[]).filter(w=>w.length>2&&!STOP.has(w))}
function overlap(model,stu){const m=toks(model),s=toks(stu);if(!m.length)return 1;let c=0;for(const w of m){if(s.some(x=>x.slice(0,4)===w.slice(0,4)))c++}return c/m.length}

/* ---- sentence-level checks (functions) ---- */
function sentences(t){
  const out=[];const re=/[.!?]\s+(?=[A-Z"“])/g;let last=0,m;const cut=[];
  while((m=re.exec(t)))cut.push([last,m.index+1]),last=m.index+m[0].length;
  cut.push([last,t.length]);
  for(const [a,b] of cut){const raw=t.slice(a,b);const txt=raw.trim();if(txt.length>2&&/[a-z]/i.test(txt))out.push({txt,i:a+raw.indexOf(txt),raw})}
  return out}
const INTRO=/^(after|before|despite|while|although|though|whereas|starting|when|as|since|given)\b/i;

function grammarCheck(text){
  const items=[];

  // regex rules
  for(const r of RULES){
    const re=new RegExp(r.re.source,r.re.flags.includes("g")?r.re.flags:r.re.flags+"g");let m;
    while((m=re.exec(text))){
      if(m[0].length===0){re.lastIndex++;continue}
      if(r.test&&!r.test(m,text,m.index))continue;
      let i=m.index,len=m[0].length;
      if(r.grp){ // highlight the group only
        const g=r.grp===0?m[0]:m[r.grp];if(g===undefined)continue;
        const off=m[0].indexOf(g,r.id==="nofv"?m[1].length:0);i=m.index+(off<0?0:off);len=g.length;if(r.id==="spB"){i=m.index;len=m[0].length}}
      const fix=typeof r.fix==="function"?r.fix(m):r.fix;
      add("grammar",i,len,r.msg,fix,r.why)}
  }
  // sentence-level
  for(const s of sentences(text)){
    const t=s.txt;
    if(/^[a-z]/.test(t)){const w0=(t.match(/^[a-z]+/)||[t[0]])[0];add("grammar",s.i,w0.length,"A sentence starts with a capital letter.",w0[0].toUpperCase()+w0.slice(1),"Capital letter at the start.")}
    const words=t.split(/\s+/).length;
    // intro phrase needs comma
    if(INTRO.test(t)&&!t.replace(/(\d),(?=\d)/g,"$1").includes(",")&&words>6){const mm=t.match(/^(\S+(?:\s+\S+){1,6}?)\s+(?:the|it|this|that|there|they|[a-z]+'s)\b/i);
      add("grammar",s.i,Math.min(t.length,mm?mm[1].length:t.split(" ").slice(0,3).join(" ").length),"Put a comma after the introductory phrase.","…, (comma) before the main clause","An opening phrase (After rising…, Despite…, While …, Starting at…) is followed by a comma.")}
    // comma before 'after which'
    const am=t.match(/[a-z0-9%]\s+(after which)\b/i);if(am){const i=s.i+t.indexOf(am[1],am.index);add("grammar",i,am[1].length,"Put a comma before ‘after which’.",", after which","…in 2001, after which it …")}
    // comma splice: full clause , it/the X change-verb
    if(!INTRO.test(t)||/^starting at/i.test(t)===false){
      const cs=t.match(new RegExp("^(?!(?:after|before|despite|while|although|though|whereas|starting|when|as|since|from|in|by|over|between|during|at|with)\\b)[^,]{10,},\\s+((?:it|this|that)|(?:the|its)\\s+[a-z' ]{3,40}?)\\s+"+ADV+"(?:"+CHV+")\\b","i"));
      if(cs){const i=s.i+t.indexOf(",");add("grammar",i,1,"Two full clauses cannot be joined by a comma (comma splice).","use ‘and’ / ‘but’ / ‘, after which’ / ‘.’ instead of the comma","A comma cannot join two independent sentences. Use a linking word (Structures 1, 4, 9) or start a new sentence.")}}
    // while + same direction
  }
  // tense warning (soft, but listed as grammar-hint)
  const yrs=(text.match(/\b(19|20)\d\d\b/g)||[]).map(Number);
  if(yrs.length&&Math.max(...yrs)<=2024){
    const m=text.match(new RegExp("\\b(?:"+SUBJ+")\\s+"+ADV+"(rises|falls|increases|decreases|drops|declines|grows|reaches|climbs|dips|jumps|peaks|remains)\\b","i"));
    if(m)add("tense",text.indexOf(m[1],m.index),m[1].length,"The years are in the past, so use the past simple.","rose · fell · increased · reached","Describing 2000–2020 data: past simple (rose, fell). Present simple is for facts that are true now.")}

  const out=[];let end=-1;for(const it of items){if(it.i>=end){out.push(it);end=it.i+it.len}else if(it.kind==="grammar"&&out.length&&out[out.length-1].len<=it.len){}}
  return out}

function styleCheck(text){
  const items=[];
  for(const r of STYLE){const re=new RegExp(r.re.source,r.re.flags.includes("g")?r.re.flags:r.re.flags+"g");let m;
    while((m=re.exec(text))){if(!m[0])continue;
      if(r.id==="cont"&&/'s$/i.test(m[0])&&!/^(it|that|there)'s$/i.test(m[0]))continue;
      items.push({kind:"style",i:m.index,len:m[0].length,msg:r.msg,fix:r.fix,why:r.why})}}
  // repeated change verbs
  const dirs=dirsOf(text).filter(d=>!/peak/i.test(d[2]));const cnt={};
  for(const d of dirs){const k=d[2].toLowerCase().replace(/(ed|ing|s|d)$/,"");cnt[k]=(cnt[k]||[]);cnt[k].push(d)}
  for(const k in cnt)if(cnt[k].length>=2){const d=cnt[k][1];items.push({kind:"style",i:d[0],len:d[2].length,msg:"You used ‘"+d[2].toLowerCase()+"’ twice.",fix:"use a synonym: "+(d[1]==="U"?"rose · climbed · grew · went up to":"fell · dropped · declined · dipped"),why:"Varying vocabulary raises your Lexical Resource score."})}
  const words=text.trim().split(/\s+/).length;
  if(words>45)items.push({kind:"style",i:0,len:0,msg:"This sentence is very long ("+words+" words).",fix:"split it into two sentences",why:"Aim for 20–35 words per sentence so the reader does not get lost."});
  if(!/[.!?]\s*$/.test(text.trim()))items.push({kind:"style",i:Math.max(0,text.trimEnd().length-1),len:1,msg:"End the sentence with a full stop.",fix:".",why:"Punctuation is part of accuracy."});
  return items}

function spellCheck(text){
  const items=[];const re=/[A-Za-z][A-Za-z'’-]*/g;let m;const sents=sentences(text);
  while((m=re.exec(text))){const raw=m[0];const w=raw.toLowerCase().replace(/['’]s$/,"");
    if(w.length<4)continue;
    if(MISSP[w]){items.push({kind:"spelling",i:m.index,len:raw.length,msg:"Spelling: ‘"+raw+"’",fix:MISSP[w],why:"Correct spelling: "+MISSP[w]+".",hard:true});continue}
    if(known(w))continue;
    // capitalised word inside a sentence = a name
    const atStart=sents.some(s=>s.i===m.index);
    if(/^[A-Z]/.test(raw)&&!atStart)continue;
    if(w.includes("-"))continue;
    const near=nearWord(w);
    if(near)items.push({kind:"spelling",i:m.index,len:raw.length,msg:"Possible spelling mistake: ‘"+raw+"’",fix:near,why:"Check the spelling. Did you mean ‘"+near+"’?",hard:false})}
  return items}

/* ---- figures & years ---- */
function yearValues(meta){
  const yv={};if(!meta||!meta.years||!meta.svals)return yv;
  for(const s in meta.svals){meta.svals[s].forEach((v,idx)=>{const y=String(meta.years[idx]);(yv[y]=yv[y]||new Set()).add(String(parseFloat(v)))})}
  return yv}
function figureCheck(text,gid){
  const items=[];const meta=gid&&D.gmeta[gid];const yv=yearValues(meta);
  const n=norm(text);const pairs=[];
  const re=/(\d+(?:\.\d+)?)\s*(?:%|percent|per cent|million|billion|thousand|tonnes|tons|m\b|k\b)?\s*(?:million|billion|thousand|tonnes|tons)?\s+(?:in|by|at the end of|during)\s+((?:19|20)\d\d)\b/g;let m;
  while((m=re.exec(n))){pairs.push({v:String(parseFloat(m[1])),y:m[2],i:m.index,end:m.index+m[0].length})}
  if(meta&&Object.keys(yv).length){
    const allowed=new Set(meta.allowed||[]);
    for(const p of pairs){
      if(!yv[p.y])continue;
      if(allowed.has(p.v)&&!yv[p.y].has(p.v)){
        const real=[...yv[p.y]].join(" / ");
        const i=text.toLowerCase().indexOf(p.y,Math.max(0,text.toLowerCase().indexOf(p.v)));
        items.push({kind:"facts",i:Math.max(0,i),len:4,msg:"Check the figure for "+p.y+": you wrote "+p.v+", but the graph shows "+real+" in "+p.y+".",fix:"read the graph at "+p.y,why:"Each figure belongs to one year. Put your finger on the year, then read up to the line."})}}}
  // direction vs numbers
  for(let k=0;k+1<pairs.length;k++){
    const a=pairs[k],b=pairs[k+1];if(a.y===b.y)continue;
    const between=n.slice(a.end,b.i);const d=dirsOf(between).filter(x=>!/peak/i.test(x[2]));
    if(!d.length)continue;
    const real=parseFloat(b.v)>parseFloat(a.v)?"U":parseFloat(b.v)<parseFloat(a.v)?"D":"";
    if(real&&d.every(x=>x[1]!==real)){items.push({kind:"facts",i:Math.max(0,text.toLowerCase().indexOf(d[0][2].toLowerCase())),len:d[0][2].length,msg:"Direction check: "+a.v+" ("+a.y+") → "+b.v+" ("+b.y+") is a "+(real==="U"?"rise":"fall")+", but you wrote ‘"+d[0][2]+"’.",fix:real==="U"?"rose · increased · climbed":"fell · dropped · declined",why:"Compare the two figures first, then choose the verb."})}}

  if(fm){const a=parseFloat(fm[2]),b=parseFloat(fm[3]);const d=dirsOf(fm[1]);const real=b>a?"U":b<a?"D":"";

  return items}
function directionVsModel(it,text){

  const sd=dirsOf(text).filter(x=>!/peak/i.test(x[2]));if(!m.size||!sd.length)return items;
  if(sd.every(x=>!m.has(x[1])))items.push({kind:"facts",i:sd[0][0],len:sd[0][2].length,msg:"Direction check: the facts show "+(m.has("U")?"an increase":"a decrease")+", but you wrote ‘"+sd[0][2]+"’.",fix:m.has("U")?"rose · increased · climbed":"fell · dropped · declined",why:"Re-read the facts. The direction of the verb must match the numbers."});
  return items}

/* ---- main analyser ---- */
function analyze(it,text,gid,inp,opts){
  opts=opts||{};
  const base=inp?checkGraphItem(it,inp,text):checkText(it,text,gid);
  const items=[];const praise=[];
  const structure=[],facts=[];
  for(const s of base.issues){
    if(/^(Missing figure|Use more figures|Your sentence is too different|The figure|Write about this graph|Add the unit)/.test(s))facts.push({kind:"facts",msg:s,why:"Use the figures and years from the graph or the facts. Accuracy of data is part of Task Achievement.",fix:null});
    else structure.push({kind:"structure",msg:s,why:null,fix:null})}
  for(const s of base.warns||[])facts.push({kind:"warn",msg:s,why:"This figure is not in the data. Check it before you continue.",fix:null});
  const nn=it.n||(inp&&it.n);
  if(structure.length&&nn&&LEARN[nn-1]){const L=LEARN[nn-1];structure[0].fix=L.f.replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ");structure[0].why="Structure "+nn+" · "+L.rule.replace(/<[^>]+>/g,"")}
  items.push(...structure,...facts);
  const text0=text;
  const g=grammarCheck(text0);
  const sp=spellCheck(text0);
  const fg=figureCheck(text0,gid);
  const dm=(fg.length?[]:directionVsModel(it,text0));
  const st=styleCheck(text0);
  // A chapter can add its own grammar rules (CHAPTER.grammar: [{re, msg, fix, why}]).
  const cg=[];try{for(const r of ((typeof CHAPTER!=="undefined"&&CHAPTER.grammar)||[])){const re=new RegExp(r.re,"i");const mm=re.exec(text0);if(mm&&!g.some(y=>y.i===mm.index))cg.push({kind:"grammar",i:mm.index,len:mm[0].length,msg:r.msg,fix:r.fix||null,why:r.why||null})}}catch(e){}
  g.push(...cg);
  // dedupe spelling vs grammar overlap

  // positives

/* ---- original text check helpers (kept) ---- */
function checkText(it,text,gid){

  for(const name of (it.pats||[])){const p=PAT[name];if(!p)continue;const hit=p.re.test(n);if(p.not?hit:!hit)issues.push(p.msg)}
  for(const [re,msg] of (it.forbid||[])){if(new RegExp(re,"i").test(n))issues.push(msg)}
  for(const [re,msg] of (it.kw||[])){if(Array.isArray(re)){}else if(!new RegExp(re,"i").test(n))issues.push(msg)}
  const have=uniq(numsOf(text));
  if(it.nums==="model"){const need=uniq(numsOf(it.model));const miss=need.filter(x=>!have.includes(x));
    if(miss.length>(it.missTol||0))issues.push("Missing figure(s): "+miss.join(", ")+". Use the figures from the facts.");
    const extra=have.filter(x=>!need.includes(x));if(extra.length)warns.push("Check the figure(s): "+extra.join(", "))}
  else if(it.nums==="graph"){const meta=D.gmeta[gid];const al=meta.allowed||[];
    // A graph in thousands: "24,000" is the same figure as "24 thousand".
    if(/thousand/i.test(meta.unit||"")){for(let k=0;k<have.length;k++){const v=parseFloat(have[k]);if(v>=1000&&al.includes(String(v/1000)))have[k]=String(v/1000)}}
    const known=have.filter(x=>al.includes(x));const mn=it.minNums==null?2:it.minNums;
    if(known.length<mn)issues.push("Use more figures and years from the graph: your sentence should include the start and the end of the change ("+mn+" figures or years).");
    // Figures that are not on the graph (differences between figures, like "by 8 million", are fine).
    const vals=[...new Set([].concat(...Object.values(meta.svals||{})).map(Number))],yrs=(meta.years||[]).map(Number),der=new Set();
    for(const a of vals)for(const b of vals){der.add(String(+Math.abs(a-b).toFixed(2)));if(b)der.add(String(+(a/b).toFixed(2)))}
    for(const a of yrs)for(const b of yrs)der.add(String(Math.abs(a-b)));
    const unk=have.filter(x=>!al.includes(x)&&!der.has(x));
    if(unk.length)issues.push("The figure "+unk.join(", ")+" is not on the graph. Read the figure at that year again.");
    // The right graph: name what changed.
    const tw=toks([meta.title].concat(meta.series||[]).join(" ")).filter(w=>!/^(number|amount|figure|total|sold|used|made|level)/.test(w));
    const st=toks(text);
    if(tw.length&&!tw.some(w=>st.some(x=>x.slice(0,4)===w.slice(0,4))))issues.push("Write about this graph: "+meta.title.toLowerCase()+". Name what changed (for example ‘"+meta.title.toLowerCase()+"’).");
    // The unit: 20 million, not just 20.
    const u=String(meta.unit||"").toLowerCase();const need=/billion/.test(u)?[/\b(billion|bn)\b/,"billion"]:/million/.test(u)?[/\b(million|millions|mn|m)\b/,"million"]:/thousand/.test(u)?[/\b(thousand|thousands|k)\b/,"thousand"]:/%|per ?cent/.test(u)?[/%|\bper ?cent\b/,"%"]:null;
    const tnums=numsOf(meta.title||"");const figs=known.filter(x=>!/^(19|20)\d\d$/.test(x)&&!tnums.includes(x));
    if(need&&figs.length){
      // Each figure needs its unit, unless the next figure carries it ("from 12 to 20 million").
      const re=/(\d+(?:\.\d+)?)(?!\d)/g;let m,miss=null;
      while((m=re.exec(n))){const v=String(parseFloat(m[1]));if(/^(19|20)\d\d$/.test(m[1])||!figs.includes(v))continue;
        const after=n.slice(m.index+m[1].length,m.index+m[1].length+14);
        if(need[0].test(after.replace(/^\s*/," ").slice(0,need[1]==="%"?3:14)))continue;
        const shared=n.slice(m.index+m[1].length).match(/^\s*(?:to|and|-|–)\s*\d+(?:\.\d+)?\s*(\S+)/);
        if(shared&&need[0].test(" "+shared[1]))continue;
        miss=m[1];break}
      if(miss)issues.push("Add the unit: "+miss+(need[1]==="%"?"%":" "+need[1])+" (the graph is in "+meta.unit+").")}}
  if(it.overlap&&overlap(it.model,text)<it.overlap)issues.push("Your sentence is too different from the facts given. Keep the same information.");
  return {ok:issues.length===0,issues,warns}
}
function checkGraphItem(it,inp,text){

    const egs=(L.eg||[]).map(x=>'<div class="eg"><span class="tg">Example</span><span>'+x+"</span></div>").join("")+(L.real||[]).map(x=>'<div class="eg real"><span class="tg">Real task</span><span>'+x+"</span></div>").join("");
    const it={pats:GENERIC[n]||[],n,nums:"graph",minNums:(CH.overviewStructures||[]).includes(n)?0:2};
    div.innerHTML='<div class="lhd"><div class="big">'+n+'</div><h3>'+L.t+'</h3></div><div class="chiprow">'+CHIPS[n].map(c=>'<span class="chip '+c[1]+'">'+esc(c[0])+"</span>").join("")+'</div>'+
      '<div class="legend"><span><i style="background:var(--chipSt)"></i>subject</span><span><i style="background:var(--chipVt)"></i>change / verb</span><span><i style="background:var(--chipLt)"></i>key linking words</span><span><i style="background:var(--chipNt)"></i>-ing / noun phrase</span></div>'+
      '<div class="two"><div>'+egs+'<div class="rule"><b>Rule.</b> '+L.rule+'</div><div class="trap"><b>Trap.</b> '+TRAP[n]+'</div></div>'+
      '<div><div class="gbox">'+chartSVG(L.g)+'</div><div class="gcap">'+esc(m.title||"")+(m.unit?" ("+esc(m.unit)+")":"")+'</div><div class="gmodel">'+((m.sents||[])[L.s]||"")+'</div><button class="replay">▶ Replay the line</button></div></div>'+
      '<div class="yourturn"><h4>Your turn · write your own Structure '+n+' sentence about this graph</h4>'+mkInput({key:"turn"+n,step:si,unit:ui,counted:false,n,check:t=>analyze(it,t,L.g,null),model:(m.sents||[])[L.s]})+"</div>";
    $("#lpanel",card).appendChild(div);panels[n]=div;$(".replay",div).onclick=()=>animate(div)});
  const show=n=>{ST.seen[n]=1;$$(".sub",nums).forEach(b=>{b.classList.toggle("on",+b.dataset.n===n);b.classList.toggle("seen",!!ST.seen[b.dataset.n])});for(const k in panels)panels[k].style.display=+k===n?"":"none";animate(panels[n]);save()};
  nums.onclick=e=>{const b=e.target.closest(".sub");if(b)show(+b.dataset.n)};
  card._show=show;setTimeout(()=>show(1),0)}
function graphsUnit(si,ui,host,items){
  const grid=document.createElement("div");grid.className="ggrid";
  items.forEach(it=>{const m=D.gmeta[it.graph];const c=document.createElement("div");c.className="gcard";
    let h='<div class="gt"><i>'+it.graph+"</i>"+esc(m.title)+' <span>('+esc(m.unit)+')</span></div><div class="gbox">'+chartSVG(it.graph)+"</div>";
    it.inputs.forEach((inp,j)=>{h+=mkInput({key:"g"+it.graph+"_"+j,step:si,unit:ui,label:inp.label,model:inp.model,n:it.n,hint:inp.hint||it.hint,prompt:m.title+(inp.label?" · "+plain(inp.label):""),check:t=>analyze(it,t,it.graph,inp)})});
    c.innerHTML=h;grid.appendChild(c)});
  host.appendChild(grid);
  const regs=REG.filter(r=>r.step===si&&r.unit===ui);const wrap=document.createElement("div");wrap.appendChild(blockBar(regs));host.appendChild(wrap)}
function writeUnit(si,ui,host,b,items){
  const card=document.createElement("div");card.className="card";
  let h=(b.title?"<h3>"+b.title+"</h3>":"")+(b.ins?'<div class="ins">'+b.ins+"</div>":"")+graphBox(b.graph);
  if(b.worked)h+='<div class="wk"><span class="l">Worked example</span><br>'+b.worked[0]+"<br><b>→</b> "+b.worked[1]+"</div>";
  card.innerHTML=h;
  items.forEach((q,i)=>{const e=document.createElement("div");e.className="q";const pr=b.escape?esc(q.prompt):q.prompt;
    e.innerHTML='<div class="p"><span class="num">'+(i+1)+".</span>"+pr+"</div>"+mkInput({key:b.key+"_"+i,step:si,unit:ui,rows:b.rows||2,model:q.model+(b.modelWhy&&q.why?"  (Mistake: "+q.why+")":""),n:q.n,hint:q.hint||b.hint,prompt:q.prompt,check:t=>analyze(q,t,null,null)});
    card.appendChild(e)});
  card.appendChild(blockBar(REG.filter(r=>r.step===si&&r.unit===ui&&r.key.startsWith(b.key+"_"))));host.appendChild(card)}
function runSel(r,count){const v=r.ta.value;if(!v){r.fb.className="fb";r.ta.className="sel";setOk(r,false);return}
  const answers=[].concat(r.ans).map(String);const ok=answers.includes(v);r.ta.className="sel "+(ok?"ok":"no");
  r.fb.className="fb on "+(ok?"good":"bad");let msg;
  if(r.generic)msg=ok?"Yes — "+esc(v)+"."+(r.why?" "+r.why:""):(r.tried?"The answer is <b>"+answers.map(esc).join("</b> or <b>")+"</b>."+(r.why?" "+r.why:""):(r.clue||"Look again and try once more."));
  else{const L=LEARN[r.ans-1];msg=ok?"Yes — Structure "+r.ans+": "+esc(plain(L.t)):"Look again at the linking words. "+(r.tried?"The answer is Structure "+r.ans+": "+esc(plain(L.t))+".":"Try once more.")}
  r.fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"✓ Correct":"✗ Not yet")+'</span></div><div class="body"><div class="it '+(ok?"praise":"structure")+'"><div>'+msg+"</div></div></div>";
  if(count)r.tried=true;setOk(r,ok);save()}
function chooseUnit(si,ui,host,b,items){
  const card=document.createElement("div");card.className="card";card.innerHTML=(b.title?"<h3>"+b.title+"</h3>":"")+(b.ins?'<div class="ins">'+b.ins+"</div>":"")+graphBox(b.graph);
  const regs=[];
  items.forEach((q,i)=>{const id="s"+(uid++);const reg={id,key:b.key+"_"+i,step:si,unit:ui,counted:true,ok:false,kind:"select",ans:q.ans,why:q.why,clue:q.clue,generic:!!b.generic,prompt:q.prompt};REG.push(reg);regs.push(reg);
    const d=document.createElement("div");d.className="q";
    d.innerHTML='<div class="p"><span class="num">'+(i+1)+".</span>"+(b.generic?q.prompt:esc(q.prompt))+'</div><select class="sel" id="'+id+'" data-noreport="1"><option value="">'+(b.generic?(b.pick||"Choose"):(b.label||"Choose"))+"…</option>"+(q.options||b.options||[]).map(x=>"<option>"+esc(String(x))+"</option>").join("")+'</select><div class="fb" id="f'+id+'"></div>';
    card.appendChild(d)});
  card.appendChild(blockBar(regs));host.appendChild(card);
  regs.forEach(r=>{r.ta=card.querySelector("#"+r.id);r.fb=card.querySelector("#f"+r.id);r.wc=()=>{};r.ta.addEventListener("change",()=>{ST.saved[r.key]=r.ta.value;runSel(r,true)})})}
function graphBox(gid){if(!gid)return "";return [].concat(gid).map(g=>{const m=D.gmeta[g]||{};return '<div class="gbox wide">'+chartSVG(g)+'</div><div class="gcap">'+esc(m.title||"")+(m.unit?" ("+esc(m.unit)+")":"")+"</div>"}).join("")}
/* gaps: one word (or a short phrase) in each ___ ; every gap must be right */
const gnorm=t=>String(t||"").toLowerCase().replace(/[’‘]/g,"'").replace(/(\d),(?=\d{3}\b)/g,"$1").replace(/\s+/g," ").replace(/\s*%/g,"%").replace(/[.,;!]+$/,"").trim();
function runGap(r,count){const vals=r.ins.map(x=>x.value);const any=vals.some(v=>v.trim());
  if(!any){r.fb.className="fb";r.ins.forEach(x=>x.className="gap");setOk(r,false);return}
  if(count){r.tries=(r.tries||0)+1;ST.tries[r.key]=r.tries}
  let right=r.ans.map((alts,k)=>alts.map(gnorm).includes(gnorm(vals[k])));
  // Some items have answers that must go together (between … and / from … to).
  if(r.combos){const hit=r.combos.find(c=>c.every((w,k)=>gnorm(vals[k])===gnorm(w)));right=hit?right.map(()=>true):right.map((x,k)=>x&&r.combos.some(c=>gnorm(c[k])===gnorm(vals[k])&&c.some((w,j)=>j!==k&&gnorm(vals[j])===gnorm(w))))}
  const ok=right.every(Boolean);
  r.ins.forEach((x,k)=>x.className="gap "+(right[k]?"ok":"no"));
  const show=!ok&&(r.tries||0)>=2;
  r.fb.className="fb on "+(ok?"good":"bad");
  r.fb.innerHTML='<div class="hd"><span class="vd">'+(ok?"✓ Correct":right.some(Boolean)?"Almost — check the red gap":"✗ Not yet")+'</span></div>'+((ok&&r.why)||show?'<div class="body"><div class="it '+(ok?"praise":"structure")+'"><div>'+(show?"Answer: <b>"+r.ans.map(a=>a.map(esc).join(" / ")).join("</b> … <b>")+"</b>. ":"")+(r.why?esc(r.why):"")+"</div></div></div>":"");
  const was=r.ok;setOk(r,ok);if(ok&&!was&&count)toast(r.tries===1?"Correct on the first try!":"Correct — well done!");save()}
function gapsUnit(si,ui,host,b,items){
  const card=document.createElement("div");card.className="card";card.innerHTML=(b.title?"<h3>"+b.title+"</h3>":"")+(b.ins?'<div class="ins">'+b.ins+"</div>":"")+graphBox(b.graph);
  const regs=[];
  items.forEach((q,i)=>{const id="g"+(uid++);const parts=q.text.split(/_{3,}/);const ans=q.ans.map(a=>[].concat(a));
    const reg={id,key:b.key+"_"+i,step:si,unit:ui,counted:true,ok:false,kind:"gap",ans,combos:q.combos,why:q.why,prompt:q.text.replace(/_{3,}/g,"___"),tries:0};REG.push(reg);regs.push(reg);
    const w=Math.max(4,...ans.map(a=>Math.max(...a.map(x=>x.length))));
    let html=esc(parts[0]);for(let k=1;k<parts.length;k++)html+='<input class="gap" data-noreport="1" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:'+Math.min(24,w+3)+'ch" aria-label="gap '+k+'">'+esc(parts[k]);
    const d=document.createElement("div");d.className="q";
    d.innerHTML='<div class="p gp"><span class="num">'+(i+1)+".</span><span>"+html+'</span></div><div class="irow"><button class="btn" data-a="check">Check</button><span class="done-tag" id="dt'+id+'"></span></div><div class="fb" id="f'+id+'"></div>';
    card.appendChild(d);
    reg.ins=[...d.querySelectorAll("input.gap")];
    reg.ta={get value(){return JSON.stringify(reg.ins.map(x=>x.value))},set value(v){let a=[];try{a=JSON.parse(v||"[]")}catch(e){}reg.ins.forEach((x,k)=>{x.value=a[k]||""})},set className(c){}};
    reg.fb=d.querySelector(".fb");reg.wc=()=>{};
    reg.ins.forEach((x,k)=>{x.addEventListener("input",()=>{ST.saved[reg.key]=reg.ta.value;if(reg.ok)setOk(reg,false);x.className="gap";save()});
      x.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(k<reg.ins.length-1)reg.ins[k+1].focus();else runGap(reg,true)}})});
    d.querySelector("[data-a=check]").onclick=()=>runGap(reg,true)});
  card.appendChild(blockBar(regs));host.appendChild(card)}
function drillUnit(si,ui,host,d,bkey){
  writeUnit(si,ui,host,{key:bkey+d.n,title:"Drill "+d.n+" · "+d.title,ins:d.formula+" — "+d.rule,worked:d.worked},d.items)}

/* ---------- page ---------- */
function build(){
  document.title=CH.title.replace(/<[^>]+>/g,"")+" · "+CH.kicker+" · Mr Ikromov's IELTS";
  document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header>'+
    '<nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">'+(CH.footer||"")+'</div><div id="toast"></div>';
  const nav=$("#steps"),main=$("#main");
  CH.steps.forEach((s,si)=>{
    nav.insertAdjacentHTML("beforeend",'<button class="step" id="st'+si+'" data-i="'+si+'"><span class="no">'+s.no+"</span>"+s.name+' <span class="ct"></span></button>');
    const sec=document.createElement("section");sec.className="sec";sec.id="sec"+si;sec.style.display="none";
    sec.innerHTML='<div class="sec-title"><span class="n">'+s.no+"</span><h2>"+s.title+"</h2></div>"+(s.lead?'<p class="lead">'+s.lead+"</p>":"")+(s.note?'<div class="note">'+s.note+"</div>":"");
    main.appendChild(sec);
    // units: each shown on its own (sub menu) when the step has more than one
    const units=[];
    for(const b of s.blocks){
      if(b.type==="graphs"){const groups=[];for(const it of D[b.data]){let g=groups.find(x=>x.k===it.group);if(!g){g={k:it.group,label:it.groupLabel,items:[]};groups.push(g)}g.items.push(it)}
        groups.forEach(g=>units.push({label:(g.label||"").replace(/^Structures? /,"").replace(/ ·.*/,""),title:g.label,render:(ui,h)=>graphsUnit(si,ui,h,g.items)}))}
      else if(b.type==="drills")D[b.data].forEach(d=>units.push({label:String(d.n),title:"Drill "+d.n,render:(ui,h)=>drillUnit(si,ui,h,d,b.key||"d")}));
      else if(b.type==="learn")units.push({label:"Learn",render:(ui,h)=>learnUnit(si,ui,h)});
      else if(b.type==="html")units.push({label:b.label||"Info",inline:true,render:(ui,h)=>{const c=document.createElement("div");c.innerHTML=(b.title?'<h3 class="sub-h" style="font-size:16px;margin:18px 0 8px">'+b.title+"</h3>":"")+(b.graph?'<div class="card">'+graphBox(b.graph)+"</div>":"")+(b.html||"");h.appendChild(c)}});
      else if(b.type==="gaps")units.push({label:b.label||b.title,render:(ui,h)=>gapsUnit(si,ui,h,b,D[b.data])});
      else if(b.type==="write")units.push({label:b.label||b.title,render:(ui,h)=>writeUnit(si,ui,h,b,D[b.data])});
      else if(b.type==="choose")units.push({label:b.label||b.title,render:(ui,h)=>chooseUnit(si,ui,h,b,D[b.data])});
    }
    s._units=units;
    const tabs=units.filter(u=>!u.inline);
    const sub=document.createElement("div");sub.className="subnav";if(s.subnav&&tabs.length>1)sec.appendChild(sub);
    const host=document.createElement("div");sec.appendChild(host);
    units.forEach((u,ui)=>{const box=document.createElement("div");box.className="unit";box.dataset.u=ui;u.render(ui,box);host.appendChild(box);u.box=box;
      if(s.subnav&&!u.inline&&tabs.length>1)sub.insertAdjacentHTML("beforeend",'<button class="sub" id="u'+si+'_'+ui+'" data-u="'+ui+'">'+esc(u.label)+" <small></small></button>")});
    if(s.subnav&&tabs.length>1){sub.onclick=e=>{const b=e.target.closest(".sub");if(b)showUnit(si,+b.dataset.u,true)}}
    const nb=document.createElement("div");nb.className="nextbar";
    nb.innerHTML=(si>0?'<button class="btn ghost" data-go="'+(si-1)+'">← '+CH.steps[si-1].name+"</button>":"<span></span>")+(si<CH.steps.length-1?'<button class="btn go" data-go="'+(si+1)+'">Next: '+CH.steps[si+1].name+" →</button>":'<span class="wc">This is the last step. Check your progress at the top.</span>');
    nb.onclick=e=>{const b=e.target.closest("[data-go]");if(b){showStep(+b.dataset.go);window.scrollTo(0,0)}};sec.appendChild(nb);
  });
  nav.onclick=e=>{const b=e.target.closest(".step");if(b){showStep(+b.dataset.i);window.scrollTo(0,0)}};
  bindInputs();buildVocab(D);
}
function showUnit(si,ui,scroll){const s=CH.steps[si];if(!s.subnav)return;ST.unit[si]=ui;
  s._units.forEach((u,k)=>{if(u.inline)return;u.box.style.display=k===ui?"":"none";const b=$("#u"+si+"_"+k);if(b)b.classList.toggle("on",k===ui)});
  $$("svg.chart",s._units[ui].box).forEach(c=>{c.classList.remove("draw");void c.getBoundingClientRect();c.classList.add("draw")});
  if(scroll){const t=$("#sec"+si);window.scrollTo({top:Math.max(0,t.getBoundingClientRect().top+window.scrollY-70)})}save()}
function showStep(si){ST.step=si;CH.steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});
  const b=$("#st"+si);if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"center"});
  const s=CH.steps[si];if(s.subnav){const first=Math.max(0,s._units.findIndex(u=>!u.inline));let u=ST.unit[si];if(u==null||!s._units[u]||s._units[u].inline)u=first;showUnit(si,u,false)}save()}
function applyState(){
  for(const r of REG){const v=ST.saved[r.key];if(v==null||!r.ta)continue;r.ta.value=v;r.tries=ST.tries[r.key]||0;
    if(r.kind==="select"){if(v)runSel(r,false)}else if(r.kind==="gap"){r.tries=ST.tries[r.key]||0;if(ST.ok[r.key])runGap(r,false)}else{r.wc();if(ST.ok[r.key]){r.ta.className="ok";setOk(r,true)}}}
  showStep(Math.min(ST.step||0,CH.steps.length-1));progress();sendTexts()}

build();
// load saved progress: from the site (in the frame) or from this browser
let got=false;
window.addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="ielts-lab-state"||d.id!==CH.id)return;if(d.theme)setTheme(d.theme);if(!got){got=true;restore(d.data);if(!d.data)fallback()}});
function fallback(){try{restore(localStorage.getItem("ielts-lab:"+CH.id))}catch(e){}}
showStep(0);progress();
if(inFrame){try{parent.postMessage({type:"ielts-lab-load",id:CH.id},"*")}catch(e){}setTimeout(()=>{if(!got){got=true;fallback()}},900)}else{got=true;fallback()}
})();

</script>
