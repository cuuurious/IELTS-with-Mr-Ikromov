<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing Task 1 · Chapter 3 · Mr Ikromov's IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Writing Lab — shared look for every chapter (2026-11-07).
   Same colours, shapes and fonts as ieltswithmrikromov.com:
   lapis-to-turquoise band, Unbounded headings, Nunito Sans text,
   rounded rectangles only (12 / 14 / 20 / 28 px), one saffron button. */
:root{
  --ink:#f6f5f1;--panel:#fff;--panel2:#efede6;--line:#e3dfd4;--paper:#17213a;--dim:#3a4560;--mist:#55607a;
  --brass:#2456b0;--onbrass:#fff;--sage:#13807c;--sageT:#e2f2f0;--coral:#b23a48;--coralT:#f8e1e4;--amber:#9a5b12;--amberT:#fbefd9;
  --saffron:#e6a33a;--onsaffron:#17213a;--band:#22489a;
  --chipS:#dfe8fb;--chipSt:#1f4aa0;--chipV:#fbe0e6;--chipVt:#a02a44;--chipL:#fdf0d2;--chipLt:#8a5a0c;--chipN:#dcf3ef;--chipNt:#0f6b66;
  --mark:#fff2b3;--shadow:0 1px 2px rgba(23,33,58,.06),0 6px 18px -10px rgba(23,33,58,.18);
  --gUp:#13807c;--gDown:#b23a48;--gMix:#1f3a75;--g2:#c4622d;--grid:#e8e4da;--gtext:#55607a;
}
:root[data-theme="dark"]{
  --ink:#0f1626;--panel:#172036;--panel2:#1e2944;--line:#2b3858;--paper:#eef0f6;--dim:#c6ccda;--mist:#a3abbf;
  --brass:#7fa6f2;--onbrass:#0f1626;--sage:#7fd6d2;--sageT:#123a3c;--coral:#f29aa6;--coralT:#3e1c22;--amber:#f2c07a;--amberT:#3a2a12;
  --saffron:#f0b95a;--band:#1b3570;
  --chipS:#22335c;--chipSt:#b9cdf7;--chipV:#4a2230;--chipVt:#f5b8c6;--chipL:#453512;--chipLt:#f6d48b;--chipN:#153f3d;--chipNt:#9de3dc;
  --mark:#5a4a12;--shadow:none;
  --gUp:#5fd0c6;--gDown:#f08a99;--gMix:#a9bdf0;--g2:#f2a76b;--grid:#2b3858;--gtext:#a3abbf;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Unbounded,"Nunito Sans",system-ui,sans-serif;letter-spacing:-.01em}
b,strong{font-weight:800}
button{font:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---- band ---- */
.band{color:#fff;background:var(--band);background-image:linear-gradient(115deg,var(--band) 0%,#1f6fae 55%,#1a9bb5 100%);border-radius:0 0 28px 28px;padding:22px 0 20px}
.band .kick{font-size:13px;font-weight:800;opacity:.9;letter-spacing:.02em}
.band h1{margin:6px 0 6px;font-size:28px;line-height:1.15;font-weight:600}
.band p{margin:0;max-width:760px;font-size:15px;opacity:.92}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px}
.prog .bar{flex:1;max-width:360px;height:10px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:999px;transition:width .4s}
.prog b{font-size:14px;white-space:nowrap}

/* ---- step menu ---- */
.steps{position:sticky;top:0;z-index:20;background:var(--ink);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.steps .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.steps .row::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px}
.step .no{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:8px;background:var(--panel2);font-size:12px}
.step .ct{font-size:12px;color:var(--mist);font-weight:700}
.step.on{background:var(--brass);color:var(--onbrass);border-color:var(--brass)}
.step.on .no{background:rgba(255,255,255,.22)}.step.on .ct{color:inherit;opacity:.85}
.step.full .ct{color:var(--sage)}.step.on.full .ct{color:inherit}

main{padding:20px 0 40px}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:4px 0 6px}
.sec-title h2{margin:0;font-size:21px;font-weight:600}
.sec-title .n{font-family:Unbounded,sans-serif;font-size:13px;color:var(--brass);font-weight:600}
.lead{color:var(--dim);margin:0 0 14px;font-size:15px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600}
.card .ins{color:var(--dim);font-size:14px;margin-bottom:12px}
.note{border-radius:14px;background:var(--panel2);padding:12px 14px;font-size:14.5px;color:var(--dim);margin:0 0 16px}
.note b{color:var(--paper)}

/* ---- sub menu (structures, drills) ---- */
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sub{border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:6px 11px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.sub small{color:var(--mist);font-weight:700}
.sub.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);color:var(--brass)}
.sub.full small{color:var(--sage)}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nums .sub{min-width:42px;justify-content:center;font-family:Unbounded,sans-serif;font-weight:600}
.nums .sub.seen:not(.on){background:var(--panel2)}

/* ---- learn panel ---- */
.lhd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lhd .big{font-family:Unbounded,sans-serif;font-size:30px;font-weight:600;color:var(--brass);line-height:1}
.lhd h3{font-size:17px;margin:0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.chip{border-radius:12px;padding:4px 10px;font-weight:800;font-size:14px;white-space:pre}
.chip.s{background:var(--chipS);color:var(--chipSt)}.chip.v{background:var(--chipV);color:var(--chipVt)}
.chip.l{background:var(--chipL);color:var(--chipLt)}.chip.n{background:var(--chipN);color:var(--chipNt)}
.chip.p{padding:4px 2px;color:var(--mist)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mist);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.eg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.eg .tg{flex:0 0 auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);background:var(--panel2);border-radius:8px;padding:2px 7px;height:fit-content;margin-top:2px}
.eg.real .tg{background:var(--sageT);color:var(--sage)}
.eg b{background:var(--chipL);color:var(--chipLt);border-radius:6px;padding:0 3px}
.rule,.trap{border-radius:14px;padding:11px 13px;font-size:14.5px;margin-top:10px}
.rule{background:var(--sageT)}.rule>b:first-child{color:var(--sage)}
.trap{background:var(--coralT)}.trap>b:first-child{color:var(--coral)}
.trap s{color:var(--coral)}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.gcap{font-size:13px;color:var(--mist);margin:6px 2px 0}
.gmodel{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:14.5px;margin-top:8px}
.replay{margin-top:8px;border:1px solid var(--line);background:var(--panel);color:var(--paper);border-radius:12px;padding:5px 11px;font-weight:800;font-size:13px}
.yourturn{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.yourturn h4{margin:0 0 8px;font-size:15px;color:var(--sage)}

table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.t th{text-align:left;background:var(--panel2);padding:9px 12px;font-weight:800}
.t td{padding:9px 12px;border-top:1px solid var(--line)}
.mist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mist .x,.mist .v{border-radius:14px;padding:10px 12px;font-size:14.5px}
.mist .x{background:var(--coralT)}.mist .x s{color:var(--coral)}
.mist .v{background:var(--sageT)}

/* ---- charts ---- */
svg.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{fill:var(--gtext);font-size:11px;font-family:"Nunito Sans",system-ui,sans-serif}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .lbl{font-size:11.5px;font-weight:800;font-family:"Nunito Sans",system-ui,sans-serif}
.chart.draw .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dl 1.3s ease-out forwards}
@keyframes dl{to{stroke-dashoffset:0}}
.chart .key{font-size:11.5px;font-weight:700;fill:var(--paper);font-family:"Nunito Sans",system-ui,sans-serif}

/* ---- graph exercise cards ---- */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.gcard .gt{font-weight:800;font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gcard .gt i{font-style:normal;font-size:11px;font-weight:800;background:var(--panel2);color:var(--mist);border-radius:8px;padding:2px 7px}
.gcard .gt span{font-weight:600;color:var(--mist);font-size:13px}

/* ---- question rows ---- */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-size:15px;margin-bottom:8px}
.q .p .num{font-weight:800;color:var(--brass);margin-right:6px}
.q .p .tg{display:inline-block;font-size:11px;font-weight:800;background:var(--chipS);color:var(--chipSt);border-radius:8px;padding:1px 7px;margin-right:4px}
.q .p .sm{font-size:13px;color:var(--mist)}
.wk{border-radius:14px;background:var(--panel2);padding:10px 13px;font-size:14.5px;margin-bottom:6px}
.wk .l{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mist)}
select.sel{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--paper);min-width:150px}
select.sel.ok{border-color:var(--sage);background:var(--sageT)}select.sel.no{border-color:var(--coral);background:var(--coralT)}

/* ---- input + coach ---- */
.iw{margin-top:6px}
.iw .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mist);margin-bottom:5px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.5;color:var(--paper);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;min-height:62px;outline:none}
textarea:focus{border-color:var(--brass)}
textarea.ok{border-color:var(--sage);background:var(--sageT)}
textarea.no{border-color:var(--coral)}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:8px 16px;font-weight:800;font-size:14px;background:var(--brass);color:var(--onbrass)}
.btn.ghost{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
.btn.go{background:var(--saffron);color:var(--onsaffron);padding:11px 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.wc{font-size:12.5px;color:var(--mist)}
.done-tag{font-size:12.5px;font-weight:800;color:var(--sage)}
.hint{display:none;margin-top:8px;border-radius:14px;background:var(--panel2);padding:10px 12px;font-size:14px}
.hint.on{display:block}
.fb{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.fb.on{display:block}
.fb .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:9px 12px}
.fb.good .hd{background:var(--sageT)}.fb.mid .hd{background:var(--amberT)}.fb.bad .hd{background:var(--coralT)}
.fb .vd{font-weight:800}
.fb.good .vd{color:var(--sage)}.fb.mid .vd{color:var(--amber)}.fb.bad .vd{color:var(--coral)}
.meter{display:flex;gap:5px;flex-wrap:wrap}
.meter span{font-size:12px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--panel)}
.meter .ok{color:var(--sage)}.meter .no{color:var(--coral)}.meter .tip{color:var(--amber)}
.fb .body{padding:10px 12px;background:var(--panel)}
.ann{font-size:15px;line-height:1.7;margin-bottom:6px}
.ann mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px;border-bottom:2px solid var(--amber)}
.ann mark.facts,.ann mark.structure{border-bottom-color:var(--coral)}
.grp{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mist);margin:10px 0 4px}
.it{display:flex;gap:9px;padding:6px 0;font-size:14.5px}
.it .k{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;border-radius:8px;padding:1px 7px;margin-right:6px;background:var(--panel2);color:var(--dim)}
.it.structure .k,.it.facts .k{background:var(--coralT);color:var(--coral)}
.it.grammar .k,.it.tense .k,.it.spelling .k{background:var(--amberT);color:var(--amber)}
.it.style .k{background:var(--chipS);color:var(--chipSt)}
.it.praise .k{background:var(--sageT);color:var(--sage)}
.tryit{margin-top:3px;font-weight:800;color:var(--sage)}
.why{margin-top:2px;color:var(--mist);font-size:13.5px}
.mdl{margin-top:10px;border-radius:12px;background:var(--panel2);padding:9px 11px;font-size:14.5px}

.blockbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.blockbar .score{font-weight:800;color:var(--dim);font-size:14px}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.foot{color:var(--mist);font-size:12.5px;text-align:center;padding:10px 18px 30px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--paper);color:var(--ink);font-weight:800;border-radius:14px;padding:9px 16px;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .band{padding:16px 0 16px;border-radius:0 0 20px 20px}
  .band h1{font-size:22px}
  .band p{font-size:14px}
  .two,.ggrid,.mist{grid-template-columns:1fr}
  .card{padding:14px}
  .step{padding:7px 11px;font-size:13px}
  .sec-title h2{font-size:18px}
  .chip{font-size:13px}
}
@media print{.steps,.irow,.blockbar,.nextbar{display:none}.sec{display:block!important}}

.gimg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.gimg img{max-width:100%;height:auto;max-height:340px}
.ovl{display:grid;grid-template-columns:1fr;gap:16px}
.ovc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.ovc .gt{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ovc .gt i{font-style:normal;font-size:12px;font-weight:800;background:var(--brass);color:var(--onbrass);border-radius:8px;padding:2px 9px}
.ovc .gt span{font-weight:600;color:var(--mist);font-size:12.5px}
.iw+.iw{margin-top:12px}
.iw .lab.s0{color:var(--brass)}.iw .lab.s1{color:#6d4bc2}.iw .lab.s2{color:var(--amber)}.iw .lab.s3{color:var(--sage)}
:root[data-theme="dark"] .iw .lab.s1{color:#c3b0f5}
.clue{font-size:13.5px;color:var(--dim);margin:6px 0 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 12px}
.three .card{margin:0}
.phg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.phg .card{margin:0}
.sub-h{font-size:16px;margin:18px 0 8px}
.sent{border-radius:14px;padding:12px 14px;font-size:15px}
.sent .st{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.sent.s1{background:var(--chipS);border:1px solid color-mix(in srgb,var(--chipSt) 35%,transparent)}.sent.s1 .st{color:var(--chipSt)}
mark.t{background:var(--mark);color:inherit;border-radius:5px;padding:0 3px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);margin:6px 0 12px;border-radius:12px;overflow:hidden;font-size:12.5px;font-weight:800;text-align:center;color:#fff}
.scale span{padding:7px 2px}.scale span:nth-child(1){background:#7aa7b0}.scale span:nth-child(2){background:#4f98a6}.scale span:nth-child(3){background:#2f7f8e}.scale span:nth-child(4){background:#1f6573}.scale span:nth-child(5){background:#134a58}
.fstack{display:grid;gap:8px;margin:0 0 12px}
.fs{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px}
.fs>b{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:var(--brass);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Unbounded,sans-serif}
.fs .ff{font-weight:800;font-size:14.5px}.fs .fe{font-size:15px}
.fstack.small .fs{padding:7px 12px}.fstack.small .fs>b{width:26px;height:26px;font-size:12px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.fc{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.fc b{flex:0 0 auto;background:var(--brass);color:#fff;border-radius:7px;padding:0 7px;font-family:Unbounded,sans-serif;font-size:12px}
.rule{background:var(--panel2)}
.gapgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.q.g .p{line-height:2.1}
input.gap{font:inherit;border:0;border-bottom:2px solid var(--line);background:transparent;color:inherit;text-align:center;padding:0 2px;margin:0 3px;outline:none;border-radius:4px 4px 0 0}
input.gap:focus{border-bottom-color:var(--brass);background:var(--panel2)}
input.gap.ok{border-bottom-color:var(--sage);background:var(--sageT)}
input.gap.no{border-bottom-color:var(--coral);background:var(--coralT)}
@media (max-width:760px){.three,.phg,.gapgrid{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<script>
/* Writing Task 1 · Chapter 3 · The language of change. Same Writing Lab shell as Chapters 4 and 5. */
const CHAPTER={"id": "wt1-ch03", "kicker": "Writing Task 1 · Chapter 3", "title": "The <span style=\"color:#ffd27a\">language of change</span>", "lead": "Verbs, adverbs, nouns and adjectives for every trend. Learn the four basic sentence structures, practise them, then describe 15 graphs, bar charts and tables. The Writing Coach checks the <b>structure</b>, the <b>figures</b>, the <b>grammar</b> and the <b>spelling</b>, and explains every mistake.", "footer": "Mr Ikromov's IELTS · Writing Task 1 · Chapter 3. The Writing Coach is a teaching tool: it finds common mistakes and explains them, but it is not an examiner. Compare your answer with the model answer and ask your teacher.", "steps": [{"no": "3.1–3.3", "name": "Learn", "title": "Verbs, adverbs, nouns and adjectives", "subnav": true, "lead": "Four tabs: the verbs, the adverbs, the nouns and adjectives, and the <b>four sentence structures</b> you will use in the rest of the chapter.", "blocks": [{"type": "html", "tab": "Verbs", "html": "<p class=\"lead\">Choose the <b>verb</b> first. Then add an adverb that matches the size of the change.</p><div class=\"phg\"><div class=\"card\"><h3>Going up</h3><div class=\"chiprow\"><span class=\"chip v\">to increase</span><span class=\"chip v\">to rise</span><span class=\"chip v\">to improve</span><span class=\"chip v\">to go up</span><span class=\"chip v\">to grow</span><span class=\"chip v\">to climb</span><span class=\"chip v\">to double*</span></div></div><div class=\"card\"><h3>Going down</h3><div class=\"chiprow\"><span class=\"chip l\">to decrease</span><span class=\"chip l\">to fall</span><span class=\"chip l\">to drop</span><span class=\"chip l\">to go down</span><span class=\"chip l\">to decline</span><span class=\"chip l\">to reduce</span><span class=\"chip l\">to halve*</span></div></div></div><div class=\"note\">* <b>double</b> and <b>halve</b> already say how big the change is. Do not use adverbs with them.</div><h3 class=\"sub-h\">Verbs with a special meaning</h3><p>Some verbs are not synonyms. Each has a precise meaning. Learn it, or the sentence will be wrong.</p><table class=\"t\"><thead><tr><th>Verb</th><th>Meaning</th><th>Real example</th></tr></thead><tbody><tr><td><b>fluctuate</b></td><td>go up and down</td><td>Germany’s rate <b>fluctuated slightly</b> between about 1.55% and 1.8%.</td></tr><tr><td><b>remain stable</b></td><td>stay at the same level</td><td>The self-employed figure <b>stabilised</b> at that level from 1997.</td></tr><tr><td><b>level off</b></td><td>remain stable <i>after</i> a rise or fall</td><td>It rose to 250,000 in 2004 and then <b>levelled off</b> at about that figure.</td></tr><tr><td><b>recover</b></td><td>improve <i>after</i> dropping</td><td>Finland <b>recovered steadily</b> to reach 24% again in 2011.</td></tr></tbody></table><div class=\"phg\" style=\"margin-top:12px\"><div class=\"rule\" style=\"background:var(--sageT)\"><b>Correct</b><br>Simon earned $25 on Monday, $20 on Tuesday and $40 on Wednesday.<br>Simon’s earnings fell from $25 to $20 but then <b>recovered</b> to $40.</div><div class=\"trap\"><b>Wrong</b><br><s>Simon earned $20 on Tuesday but $40 on Wednesday. Simon’s earnings recovered.</s><br>There is no earlier drop. “Recover” needs a fall first.</div></div>"}, {"type": "html", "tab": "Adverbs", "html": "<p class=\"lead\">The adverb tells the reader <b>how big</b> or <b>how steady</b> the change was.</p><div class=\"three\"><div class=\"card\"><h3>Big changes</h3><div class=\"chiprow\"><span class=\"chip v\">dramatically</span><span class=\"chip v\">significantly</span><span class=\"chip v\">considerably</span><span class=\"chip v\">noticeably</span><span class=\"chip v\">markedly</span></div></div><div class=\"card\"><h3>Small changes</h3><div class=\"chiprow\"><span class=\"chip n\">slightly</span><span class=\"chip n\">minimally</span><span class=\"chip n\">negligibly</span><span class=\"chip n\">marginally</span></div></div><div class=\"card\"><h3>Steady changes</h3><div class=\"chiprow\"><span class=\"chip s\">gradually</span><span class=\"chip s\">steadily</span><span class=\"chip s\">consistently</span></div></div></div><div class=\"scale\"><span>negligibly</span><span>slightly</span><span>noticeably</span><span>considerably</span><span>dramatically</span></div><div class=\"note\"><b>Fluctuate</b> takes its own adverbs: <b>mildly</b> if the fluctuation is small, <b>wildly</b> if it is big.</div><div class=\"sent s1\" style=\"margin-bottom:12px\"><div class=\"st\">Structure A</div><b>X + verb + adverb</b><br>The number of cars rose <b>noticeably</b>. · The proportion of men in sports declined <b>slightly</b>. · The income of the company fluctuated <b>wildly</b> between 2000 and 2005.</div><h3 class=\"sub-h\">Choose the adverb from the numbers</h3><p>The size of the change on the graph decides the adverb. Five real changes, from the smallest to the biggest:</p><table class=\"t\"><thead><tr><th>Real change</th><th>Sentence</th><th>Size</th></tr></thead><tbody><tr><td>Germany 30% → 32%</td><td>Germany’s figure edged up / rose <b>slightly</b>.</td><td>small</td></tr><tr><td>UK 17% → 22%</td><td>The UK’s figure grew <b>gradually</b>.</td><td>steady</td></tr><tr><td>Ferry 3% → 11%</td><td>Ferry use rose <b>noticeably</b>.</td><td>medium</td></tr><tr><td>USA 1.8 million → 1 million</td><td>It plunged / fell <b>dramatically</b>.</td><td>big</td></tr><tr><td>Italy 2% → 22.5%</td><td>Italy’s figure rose <b>dramatically</b> / surged.</td><td>very big</td></tr></tbody></table><div class=\"note\"><b>Verbs that already contain the adverb.</b> Strong verbs make sentences shorter: <i>surge, soar, rocket, plummet, plunge</i> (big); <i>edge up, creep up, inch up, dip</i> (small). Use them for variety, but only when the change really is big or small.</div>"}, {"type": "html", "tab": "Nouns & adjectives", "html": "<p class=\"lead\">Every verb has a <b>noun</b>. A noun needs an <b>adjective</b>, not an adverb. This gives you a second way to write every sentence.</p><div class=\"phg\"><div class=\"card\"><h3>Nouns</h3><div class=\"chiprow\"><span class=\"chip v\">an increase</span><span class=\"chip v\">a rise</span><span class=\"chip v\">an improvement</span><span class=\"chip v\">a growth</span><span class=\"chip v\">a fluctuation</span><span class=\"chip v\">a reduction</span><span class=\"chip v\">a decrease</span><span class=\"chip v\">a fall</span><span class=\"chip v\">a drop</span><span class=\"chip v\">a decline</span><span class=\"chip v\">a recovery</span></div></div><div class=\"card\"><h3>Adjectives</h3><div class=\"chiprow\"><span class=\"chip l\">dramatic</span><span class=\"chip l\">significant</span><span class=\"chip l\">considerable</span><span class=\"chip l\">noticeable</span><span class=\"chip l\">marked</span><span class=\"chip l\">slight</span><span class=\"chip l\">minimal</span><span class=\"chip l\">negligible</span><span class=\"chip l\">marginal</span><span class=\"chip l\">gradual</span><span class=\"chip l\">steady</span><span class=\"chip l\">consistent</span><span class=\"chip l\">mild</span><span class=\"chip l\">wild</span></div></div></div><div class=\"trap\" style=\"margin-top:12px\"><b>Common mistakes</b><br>✗ <s>a significantly increase</s> → ✓ <b>a significant increase</b><br>✗ <s>a remain stable / a level off / a go up</s> → ✓ <b>a period of stability</b> · <b>a rise</b><br>Never put an adverb before a noun. <i>Remain stable</i>, <i>level off</i> and <i>go up / down</i> cannot become nouns.</div><div class=\"note\" style=\"margin-top:12px\"><b>The rule:</b> verb → noun (<i>rose → a rise</i>) and adverb → adjective (<i>noticeably → noticeable</i>).</div>"}, {"type": "html", "tab": "Four structures", "html": "<p class=\"lead\">Verb + adverb and adjective + noun give you <b>four sentence structures</b>. They all say the same thing. Learn the formula of each one, then change a sentence from one structure to another.</p><div class=\"fstack\"><div class=\"fs\"><b>A</b><div><div class=\"ff\">X + verb + adverb</div><div class=\"fe\">The number of cars <mark class=\"t\">rose noticeably</mark>.</div></div></div><div class=\"fs\"><b>B</b><div><div class=\"ff\">X + saw / witnessed / experienced + a(n) + adjective + noun</div><div class=\"fe\">The number of cars <mark class=\"t\">saw a noticeable rise</mark>.</div></div></div><div class=\"fs\"><b>C</b><div><div class=\"ff\">There was a(n) + adjective + noun + in + X</div><div class=\"fe\"><mark class=\"t\">There was a noticeable rise in</mark> the number of cars.</div></div></div><div class=\"fs\"><b>D</b><div><div class=\"ff\">A(n) + adjective + noun + was seen / observed in + X</div><div class=\"fe\"><mark class=\"t\">A noticeable rise was observed in</mark> the number of cars.</div></div></div></div><div class=\"note\"><b>How to change the structure:</b> the verb becomes a noun (<i>rose → a rise</i>) and the adverb becomes an adjective (<i>noticeably → noticeable</i>). The subject X moves to the end after <b>in</b> (Structures C and D).</div><h3 class=\"sub-h\">The same idea with another sentence</h3><div class=\"fstack small\"><div class=\"fs\"><b>A</b><div class=\"fe\">The proportion of men in sports declined slightly.</div></div><div class=\"fs\"><b>B</b><div class=\"fe\">The proportion of men in sports witnessed a slight decline.</div></div><div class=\"fs\"><b>C</b><div class=\"fe\">There was a slight decline in the proportion of men in sports.</div></div><div class=\"fs\"><b>D</b><div class=\"fe\">A slight decline was seen in the proportion of men in sports.</div></div></div>"}, {"type": "html", "tab": "Real graphs", "html": "<p class=\"lead\">Task 5 · Sugar production and consumption in India. Real sentences, and the structure behind each one.</p><div class=\"eg\"><span class=\"tg\">Verb + adv</span><span>Consumption <b>rose slowly but steadily</b> over the decade.</span></div><div class=\"eg\"><span class=\"tg\">Strong verb</span><span>Production <b>soared</b> to a peak of 28 million tonnes in 2007.</span></div><div class=\"eg\"><span class=\"tg\">Noun</span><span>Production fell to 16.5 million in 2009, <b>a collapse</b> of more than 10 million tonnes.</span></div><div class=\"eg\"><span class=\"tg\">Recover</span><span>After a collapse to 16.5 million in 2009, production <b>recovered</b> to about 25.5 million in 2011.</span></div><div class=\"eg\"><span class=\"tg\">Adjective</span><span>The sugar graph shows <b>a dramatic peak</b> and <b>a sharp fall</b> in production.</span></div>"}]}, {"no": "3A–3C", "name": "Practice", "title": "Practise the structures", "subnav": true, "blocks": [{"type": "write", "label": "3A · Change the structure", "key": "q3a", "title": "Try it 3A · Verb or noun?", "ins": "Rewrite each sentence with the structure in brackets (A, B, C or D). Keep the same size of change.", "items": [{"prompt": "The number of tourists rose noticeably. <span class='sm'>(Structure C: There was …)</span>", "st": 2, "g": {"dir": "U", "subj": "number of tourists", "deg": "notice", "degw": "noticeable / noticeably", "need": [], "allow": null}, "model": "There was a noticeable rise in the number of tourists."}, {"prompt": "The proportion of women declined slightly. <span class='sm'>(Structure B: X saw …)</span>", "st": 1, "g": {"dir": "D", "subj": "proportion of women", "deg": "slight", "degw": "slight / slightly", "need": [], "allow": null}, "model": "The proportion of women saw a slight decline."}, {"prompt": "There was a dramatic fall in sugar production. <span class='sm'>(Structure A: verb + adverb)</span>", "st": 0, "g": {"dir": "D", "subj": "sugar production", "deg": "dramat", "degw": "dramatic / dramatically", "need": [], "allow": null}, "model": "Sugar production fell dramatically."}, {"prompt": "A marked increase was observed in the number of films. <span class='sm'>(Structure A: verb + adverb)</span>", "st": 0, "g": {"dir": "U", "subj": "number of films", "deg": "mark", "degw": "marked / markedly", "need": [], "allow": null}, "model": "The number of films increased markedly."}, {"prompt": "Car use fell gradually. <span class='sm'>(Structure D: … was seen / observed)</span>", "st": 3, "g": {"dir": "D", "subj": "car use", "deg": "gradu", "degw": "gradual / gradually", "need": [], "allow": null}, "model": "A gradual fall was seen in car use."}, {"prompt": "The number of visitors rose considerably. <span class='sm'>(Structure B: X experienced …)</span>", "st": 1, "g": {"dir": "U", "subj": "number of visitors", "deg": "consider", "degw": "considerable / considerably", "need": [], "allow": null}, "model": "The number of visitors experienced a considerable rise."}]}, {"type": "pick", "label": "3B · Pick the adverb", "key": "q3b", "title": "Try it 3B · Pick the adverb", "ins": "Choose the adverb that matches the size of the change: <b>slightly, gradually, considerably, dramatically</b> (one each).", "opts": ["slightly", "gradually", "considerably", "dramatically"], "tip": "Compare the first and the last figure. Is the change small, steady, big or very big? Try once more.", "items": [{"prompt": "Task 1: Germany 30% → 32%. &nbsp; Germany’s figure rose …", "ans": "slightly", "why": "30% → 32% is a very small change."}, {"prompt": "Task 1: UK stayed at 17% until 2004 and reached 22% by 2012. &nbsp; The UK’s figure grew …", "ans": "gradually", "why": "a slow, steady change over many years."}, {"prompt": "Task 3: USA 1.8 million → 1 million. &nbsp; The figure fell …", "ans": ["considerably", "dramatically"], "why": "a big fall: considerably or dramatically."}, {"prompt": "Task 1: Italy 2% → 22.5%. &nbsp; Italy’s figure rose …", "ans": "dramatically", "why": "a very big rise."}]}, {"type": "write", "label": "3C · Find the mistake", "key": "q3c", "title": "Try it 3C · Find the mistake", "ins": "Correct the sentences.", "items": [{"prompt": "The number of cars had a significantly increase.", "model": "The number of cars had a significant increase.", "must": [["significant\\b(?!ly)", "Change the adverb to an adjective: significant.", "a significant increase", ""]], "not": [["significantly\\s+increase", "Use an adjective before a noun, not an adverb.", "a significant increase", "Verb + adverb: increased significantly. Adjective + noun: a significant increase."]], "hint": "<b>Find the mistake</b><div>Look at the word before the noun, the adverb after the verb, and the meaning of the verb.</div>"}, {"prompt": "The figure doubled dramatically.", "model": "The figure doubled.", "must": [["doubl", "Keep the verb doubled.", "The figure doubled.", ""]], "not": [["doubled\\s+\\w+ly", "Do not use an adverb with doubled: double already says how big the change is.", "The figure doubled.", "double / halve already show the size."]], "hint": "<b>Find the mistake</b><div>Look at the word before the noun, the adverb after the verb, and the meaning of the verb.</div>"}, {"prompt": "Simon earned $20 on Tuesday and $40 on Wednesday. His earnings recovered.", "model": "Simon earned $20 on Tuesday and $40 on Wednesday. His earnings doubled.", "must": [["doubl|rose|increas|grew|climbed|went up|jump", "Say what happened: his earnings rose / doubled.", "His earnings doubled.", ""]], "not": [["recover", "Recover needs a fall first. There was no earlier drop.", "His earnings rose / doubled.", "Recover = improve after dropping."]], "hint": "<b>Find the mistake</b><div>Look at the word before the noun, the adverb after the verb, and the meaning of the verb.</div>"}, {"prompt": "The price of oil had a level off.", "model": "The price of oil levelled off.", "must": [["level(l)?ed off|leveling off|levelling off|period of stability|remained stable|stayed stable|stabili[sz]ed", "Use the verb levelled off, or a period of stability.", "The price of oil levelled off.", ""]], "not": [["\\ba\\s+level(l)?\\s+off\\b", "Level off is a verb. It cannot follow “a”.", "The price of oil levelled off.  /  There was a period of stability in the price of oil.", "Remain stable, level off and go up cannot become nouns."]], "hint": "<b>Find the mistake</b><div>Look at the word before the noun, the adverb after the verb, and the meaning of the verb.</div>"}]}]}, {"no": "3.4", "name": "Describe the shape", "title": "Describe every change in four structures", "subnav": true, "lead": "Each graph, bar chart or table shows <b>one change</b>. Write <b>four sentences</b>, one in each structure (A, B, C, D). Use the figures and years shown.", "blocks": [{"type": "html", "tab": "Tense", "html": "<p class=\"lead\">Before you write, look at the <b>time words</b>. They decide the tense.</p><div class=\"three\"><div class=\"card\"><h3>Past</h3>The time words are in the past.<br><i>The rate of unemployment <b>rose</b> between 2010 and 2012.</i></div><div class=\"card\"><h3>Present</h3>No dates at all, or a general fact.<br><i>The figures for electricity use <b>show</b> a rapid growth during the day.</i></div><div class=\"card\"><h3>Future</h3>The dates are in the future: forecasts and predictions.<br><i>It <b>is predicted</b> that air pollution <b>will fall</b> by 5% within two years.</i></div></div><div class=\"note\">If there is <b>no date</b> (some bar charts, tables and all processes), use the <b>present simple</b>. All the graphs in the next tabs have past dates, so use the <b>past simple</b>.</div>"}, {"type": "desc", "label": "Graphs A–E", "refs": [0, 1, 2, 3, 4], "note": "<b>Try it 3D.</b> Write the same change in all four structures. Use a different verb where you can (<i>rose, climbed, grew</i>). Where nothing changes, use <i>remained stable</i> and <i>a period of stability</i>."}, {"type": "desc", "label": "Graphs F–J", "refs": [5, 6, 7, 8, 9], "note": "<b>Try it 3D.</b> Four sentences for each: A, B, C, D."}, {"type": "desc", "label": "Graphs K–O", "refs": [10, 11, 12, 13, 14], "note": "<b>Try it 3D.</b> Four sentences for each: A, B, C, D."}]}, {"no": "3.5–3.6", "name": "Prepositions & ‘about’", "title": "Small words, exact figures", "subnav": true, "blocks": [{"type": "html", "tab": "Prepositions", "html": "<p class=\"lead\">One small word can make a sentence wrong. These are the prepositions used most often with figures. Learn the <b>job</b> of each one.</p><table class=\"t\"><thead><tr><th style=\"width:18%\">Word</th><th>Job</th><th>Example</th></tr></thead><tbody><tr><td><b>to</b></td><td>the final figure after a change</td><td>Unemployment rose <b>to</b> 10% in 2008.</td></tr><tr><td><b>by</b></td><td>the size of the change</td><td>Unemployment fell <b>by</b> 2%, from 10% to 8%.</td></tr><tr><td><b>from … to</b></td><td>the start and the end</td><td>Sales climbed <b>from</b> 2,000 <b>to</b> 5,500.</td></tr><tr><td><b>at</b></td><td>a figure that stays, or a peak / a low point</td><td>Sales peaked <b>at</b> 60,000. The rate remained <b>at</b> 5%.</td></tr><tr><td><b>of</b></td><td>a noun of change + size, or a peak / low + figure</td><td>a rise <b>of</b> 8% · a low <b>of</b> 1.2 million</td></tr><tr><td><b>in</b></td><td>a change in what (the thing) · a year or month</td><td>a fall <b>in</b> the number of cars · <b>in</b> 2009</td></tr><tr><td><b>with</b></td><td>“having” a figure (often in a ranking)</td><td>Japan led <b>with</b> 52 medals.</td></tr><tr><td><b>between … and</b></td><td>a period, or a range</td><td><b>between</b> 2004 <b>and</b> 2008 · <b>between</b> 30 <b>and</b> 40%</td></tr></tbody></table>"}, {"type": "gaps", "label": "3E · Prepositions", "key": "q3e", "title": "Try it 3E · Prepositions", "ins": "Fill each gap with one word. Some sentences have two gaps. Press Enter or click out of the box to check.", "items": [{"t": "Rainfall peaked ______ 120 mm in July.", "ans": "at"}, {"t": "There was a rise ______ 8% ______ the number of members.", "ans": "of; in"}, {"t": "Prices rose ______ $2 to $9.", "ans": "by"}, {"t": "Prices rose by $2 ______ $9.", "ans": "to"}, {"t": "Rents climbed ______ $700 ______ $950.", "ans": "from; to"}, {"t": "______ 2004 ______ 2008, unemployment fell steadily.", "ans": "Between; and"}, {"t": "The figure fluctuated ______ 30 and 40 per cent.", "ans": "between"}, {"t": "Exports stayed stable ______ 5 million tonnes.", "ans": "at"}, {"t": "Tourism saw a sharp fall ______ 2009.", "ans": "in"}, {"t": "Japan led the table ______ 52 medals.", "ans": "with"}, {"t": "Spending reached a low ______ £3.5 billion.", "ans": "of"}, {"t": "Coffee consumption rose ______ 2% ______ the year.", "ans": "by; over / during"}, {"t": "______ the last decade, the number of students doubled.", "ans": "Over / During / In"}, {"t": "Sales shot ______ ______ 2,000 to 5,500.", "ans": "up; from"}, {"t": "The population dropped ______ 800,000.", "ans": "by"}, {"t": "There was a decline ______ 15% ______ student numbers.", "ans": "of; in"}, {"t": "Profits fell ______ a low ______ 1.2 million in 2009.", "ans": "to; of"}, {"t": "Car sales saw an increase ______ 5 million.", "ans": "of"}, {"t": "The price of a ticket stood ______ $30 in 1995.", "ans": "at"}, {"t": "Oil production remained unchanged ______ 80 barrels a day.", "ans": "at"}, {"t": "Italy overtook France in 2005, ______ 24% against 22%.", "ans": "with"}, {"t": "Women made up 62% ______ the workforce.", "ans": "of"}, {"t": "The share of men ______ part-time work fell ______ 25% to 18%.", "ans": "in; from"}, {"t": "Wages grew ______ an average ______ 3% a year.", "ans": "by; of"}, {"t": "______ the first half of the year, sales were stable.", "ans": "In / During"}, {"t": "Visitor numbers hit a peak ______ 1.5 million ______ August.", "ans": "of; in"}, {"t": "Sales dipped ______ 9,000 ______ April.", "ans": "to; in"}, {"t": "The cost of housing is expected to rise ______ 12% over the next decade.", "ans": "by"}, {"t": "France spent more ______ health than Germany.", "ans": "on"}, {"t": "Almost half ______ the respondents chose option C.", "ans": "of"}]}, {"type": "html", "tab": "Saying ‘about’", "html": "<p class=\"lead\">A graph rarely gives an exact figure. Never write a figure you cannot read. Use a <b>qualifier</b> that says whether the real figure is a little above, a little below or close to your number.</p><div class=\"three\"><div class=\"card\"><h3>A little above</h3><div class=\"chiprow\"><span class=\"chip v\">just over 30%</span><span class=\"chip v\">slightly more than 30%</span><span class=\"chip v\">a little over 30%</span><span class=\"chip v\">well over 30%</span><span class=\"chip v\">in excess of 30%</span></div></div><div class=\"card\"><h3>A little below</h3><div class=\"chiprow\"><span class=\"chip l\">just under 30%</span><span class=\"chip l\">slightly less than 30%</span><span class=\"chip l\">almost 30%</span><span class=\"chip l\">nearly 30%</span><span class=\"chip l\">well under 30%</span><span class=\"chip l\">just short of 30%</span></div></div><div class=\"card\"><h3>Close to it</h3><div class=\"chiprow\"><span class=\"chip s\">about 30%</span><span class=\"chip s\">around 30%</span><span class=\"chip s\">roughly 30%</span><span class=\"chip s\">approximately 30%</span><span class=\"chip s\">30% or so</span><span class=\"chip s\">some 30%</span></div></div></div><div class=\"note\"><b>Time needs approximation too.</b> Do not repeat every year. Say: <i>over the next two years · in the following three years · in the first half of the period · during the middle years · by the end of the period · in the mid-1980s.</i></div><div class=\"eg\"><span class=\"tg\">Task 1</span><span>Germany stood at <b>about</b> 30% in 2000 and edged up to <b>roughly</b> 32% by 2012.</span></div><div class=\"eg\"><span class=\"tg\">Task 2</span><span>The UK remained the smallest user, but its share still grew from <b>under</b> 1% to <b>just over</b> 6%.</span></div><div class=\"eg\"><span class=\"tg\">Task 3</span><span>The USA began at <b>nearly</b> 1.5 million in 1990 and peaked at <b>about</b> 1.8 million in 1991.</span></div><div class=\"eg\"><span class=\"tg\">Task 4</span><span>Car use peaked at <b>roughly</b> 62% in 1999, followed by a gradual decline to <b>just over</b> 51% in 2009.</span></div><div class=\"trap\" style=\"margin-top:12px\"><b>Do not overuse them.</b> Use a qualifier when the figure is not exact. Do not write <i>about</i> in front of every number: it looks nervous. Mix them: one <i>about</i>, one <i>roughly</i>, one <i>just over</i>, one exact figure.</div>"}, {"type": "write", "label": "3F · Qualifiers", "key": "q3f", "title": "Try it 3F · Say it with a qualifier", "ins": "Rewrite each sentence with the qualifier in brackets.", "items": [{"prompt": "The figure was 49.6%. <span class='sm'>(just under)</span>", "model": "The figure was just under 50%.", "must": [["just under\\s+50\\s*(%|per ?cent)", "Round 49.6% to 50% and add “just under”.", "The figure was just under 50%.", ""]], "not": [], "polish": false, "min": 3, "hint": "<b>Qualifiers</b><div class=\"chiprow\"><span class=\"chip s\">just under · almost · nearly</span><span class=\"chip v\">just over · well over</span><span class=\"chip l\">around · roughly · about</span></div>"}, {"prompt": "Sales were 30,150. <span class='sm'>(just over)</span>", "model": "Sales were just over 30,000.", "must": [["just over\\s+30,?000\\b", "Round 30,150 to 30,000 and add “just over”.", "Sales were just over 30,000.", ""]], "not": [], "polish": false, "min": 3, "hint": "<b>Qualifiers</b><div class=\"chiprow\"><span class=\"chip s\">just under · almost · nearly</span><span class=\"chip v\">just over · well over</span><span class=\"chip l\">around · roughly · about</span></div>"}, {"prompt": "The price was $9.80. <span class='sm'>(almost)</span>", "model": "The price was almost $10.", "must": [["almost\\s+\\$?10\\b", "Round $9.80 to $10 and add “almost”.", "The price was almost $10.", ""]], "not": [], "polish": false, "min": 3, "hint": "<b>Qualifiers</b><div class=\"chiprow\"><span class=\"chip s\">just under · almost · nearly</span><span class=\"chip v\">just over · well over</span><span class=\"chip l\">around · roughly · about</span></div>"}, {"prompt": "Production was 12,480 tonnes. <span c const D={"gmeta": {}, "texts": ["Online shopping (% of retail sales) online shopping Online shopping <b>rose dramatically</b> from 5% in 2000 to 45% in 2015. Online shopping <b>saw a dramatic rise</b> from 5% in 2000 to 45% in 2015. <b>There was a dramatic rise</b> in online shopping, from 5% in 2000 to 45% in 2015. <b>A dramatic rise was seen</b> in online shopping, from 5% in 2000 to 45% in 2015.", "Adult smokers (% of adults) the percentage of adult smokers The percentage of adult smokers <b>fell steadily</b> from 32% in 1990 to 18% in 2020. The percentage of adult smokers <b>experienced a steady fall</b> from 32% in 1990 to 18% in 2020. <b>There was a steady fall</b> in the percentage of adult smokers, from 32% in 1990 to 18% in 2020. <b>A steady fall was observed</b> in the percentage of adult smokers, from 32% in 1990 to 18% in 2020.", "Average house price ($'000) average house prices Average house prices <b>rose considerably</b> from $220,000 in 2008 to $310,000 in 2014. Average house prices <b>witnessed a considerable rise</b> from $220,000 in 2008 to $310,000 in 2014. <b>There was a considerable rise</b> in average house prices, from $220,000 in 2008 to $310,000 in 2014. <b>A considerable rise was seen</b> in average house prices, from $220,000 in 2008 to $310,000 in 2014.", "Unemployment rate (%) the unemployment rate The unemployment rate <b>fell sharply</b> from 9% in 2010 to 4% in 2018. The unemployment rate <b>saw a sharp fall</b> from 9% in 2010 to 4% in 2018. <b>There was a sharp fall</b> in the unemployment rate, from 9% in 2010 to 4% in 2018. <b>A sharp fall was observed</b> in the unemployment rate, from 9% in 2010 to 4% in 2018.", "Student numbers ('000 students) the number of students The number of students <b>rose significantly</b> from 40,000 in 2005 to 60,000 in 2020. The number of students <b>experienced a significant rise</b> from 40,000 in 2005 to 60,000 in 2020. <b>There was a significant rise</b> in the number of students, from 40,000 in 2005 to 60,000 in 2020. <b>A significant rise was seen</b> in the number of students, from 40,000 in 2005 to 60,000 in 2020.", "Fuel price ($ per litre) the price of fuel The price of fuel <b>fell slightly</b> from $1.40 per litre in 2015 to $1.32 in 2020. The price of fuel <b>witnessed a slight fall</b> from $1.40 per litre in 2015 to $1.32 in 2020. <b>There was a slight fall</b> in the price of fuel, from $1.40 per litre in 2015 to $1.32 in 2020. <b>A slight fall was observed</b> in the price of fuel, from $1.40 per litre in 2015 to $1.32 in 2020.", "Water use (litres per person per day) water use Water use <b>remained stable</b> at 150 litres per person per day between 2000 and 2020. Water use <b>experienced a period of stability</b> at 150 litres per person per day between 2000 and 2020. <b>There was a period of stability</b> in water use, at 150 litres per person per day between 2000 and 2020. <b>A period of stability was seen</b> in water use, at 150 litres per person per day between 2000 and 2020.", "Car production ('000 vehicles) car production Car production <b>fell markedly</b> from 90,000 vehicles in 2000 to 55,000 in 2015. Car production <b>experienced a marked fall</b> from 90,000 vehicles in 2000 to 55,000 in 2015. <b>There was a marked fall</b> in car production, from 90,000 vehicles in 2000 to 55,000 in 2015. <b>A marked fall was observed</b> in car production, from 90,000 vehicles in 2000 to 55,000 in 2015.", "Mobile subscribers (millions) the number of mobile phone subscribers The number of mobile phone subscribers <b>rose rapidly</b> from 10 million in 2000 to 95 million in 2020. The number of mobile phone subscribers <b>witnessed a rapid rise</b> from 10 million in 2000 to 95 million in 2020. <b>There was a rapid rise</b> in the number of mobile phone subscribers, from 10 million in 2000 to 95 million in 2020. <b>A rapid rise was seen</b> in the number of mobile phone subscribers, from 10 million in 2000 to 95 million in 2020.", "Electricity use (GWh) electricity consumption Electricity consumption <b>fell gradually</b> from 480 GWh in 2010 to 410 GWh in 2020. Electricity consumption <b>saw a gradual fall</b> from 480 GWh in 2010 to 410 GWh in 2020. <b>There was a gradual fall</b> in electricity consumption, from 480 GWh in 2010 to 410 GWh in 2020. <b>A gradual fall was observed</b> in electricity consumption, from 480 GWh in 2010 to 410 GWh in 2020.", "Cycling to work (% of commuters) the percentage of commuters who cycled The percentage of commuters who cycled <b>rose steadily</b> from 4% in 2000 to 9% in 2020. The percentage of commuters who cycled <b>experienced a steady rise</b> from 4% in 2000 to 9% in 2020. <b>There was a steady rise</b> in the percentage of commuters who cycled, from 4% in 2000 to 9% in 2020. <b>A steady rise was seen</b> in the percentage of commuters who cycled, from 4% in 2000 to 9% in 2020.", "Newspaper sales (millions) newspaper sales Newspaper sales <b>fell dramatically</b> from 12 million in 2000 to 5 million in 2015. Newspaper sales <b>witnessed a dramatic fall</b> from 12 million in 2000 to 5 million in 2015. <b>There was a dramatic fall</b> in newspaper sales, from 12 million in 2000 to 5 million in 2015. <b>A dramatic fall was observed</b> in newspaper sales, from 12 million in 2000 to 5 million in 2015.", "Museum visitors ('000 visitors) the number of museum visitors The number of museum visitors <b>rose slightly</b> from 52,000 in 2012 to 55,000 in 2016. The number of museum visitors <b>saw a slight rise</b> from 52,000 in 2012 to 55,000 in 2016. <b>There was a slight rise</b> in the number of museum visitors, from 52,000 in 2012 to 55,000 in 2016. <b>A slight rise was seen</b> in the number of museum visitors, from 52,000 in 2012 to 55,000 in 2016.", "Coffee consumption (kg per person) coffee consumption Coffee consumption <b>remained stable</b> at 4.2 kg per person between 2000 and 2015. Coffee consumption <b>experienced a period of stability</b> at 4.2 kg per person between 2000 and 2015. <b>There was a period of stability</b> in coffee consumption, at 4.2 kg per person between 2000 and 2015. <b>A period of stability was seen</b> in coffee consumption, at 4.2 kg per person between 2000 and 2015.", "Town population ('000 people) the population of the town The population of the town <b>rose gradually</b> from 48,000 in 1995 to 52,000 in 2015. The population of the town <b>witnessed a gradual rise</b> from 48,000 in 1995 to 52,000 in 2015. <b>There was a gradual rise</b> in the population of the town, from 48,000 in 1995 to 52,000 in 2015. <b>A gradual rise was seen</b> in the population of the town, from 48,000 in 1995 to 52,000 in 2015."], "lesson": ["<p class=\"lead\">Choose the <b>verb</b> first. Then add an adverb that matches the size of the change.</p><div class=\"phg\"><div class=\"card\"><h3>Going up</h3><div class=\"chiprow\"><span class=\"chip v\">to increase</span><span class=\"chip v\">to rise</span><span class=\"chip v\">to improve</span><span class=\"chip v\">to go up</span><span class=\"chip v\">to grow</span><span class=\"chip v\">to climb</span><span class=\"chip v\">to double*</span></div></div><div class=\"card\"><h3>Going down</h3><div class=\"chiprow\"><span class=\"chip l\">to decrease</span><span class=\"chip l\">to fall</span><span class=\"chip l\">to drop</span><span class=\"chip l\">to go down</span><span class=\"chip l\">to decline</span><span class=\"chip l\">to reduce</span><span class=\"chip l\">to halve*</span></div></div></div><div class=\"note\">* <b>double</b> and <b>halve</b> already say how big the change is. Do not use adverbs with them.</div><h3 class=\"sub-h\">Verbs with a special meaning</h3><p>Some verbs are not synonyms. Each has a precise meaning. Learn it, or the sentence will be wrong.</p><table class=\"t\"><thead><tr><th>Verb</th><th>Meaning</th><th>Real example</th></tr></thead><tbody><tr><td><b>fluctuate</b></td><td>go up and down</td><td>Germany’s rate <b>fluctuated slightly</b> between about 1.55% and 1.8%.</td></tr><tr><td><b>remain stable</b></td><td>stay at the same level</td><td>The self-employed figure <b>stabilised</b> at that level from 1997.</td></tr><tr><td><b>level off</b></td><td>remain stable <i>after</i> a rise or fall</td><td>It rose to 250,000 in 2004 and then <b>levelled off</b> at about that figure.</td></tr><tr><td><b>recover</b></td><td>improve <i>after</i> dropping</td><td>Finland <b>recovered steadily</b> to reach 24% again in 2011.</td></tr></tbody></table><div class=\"phg\" style=\"margin-top:12px\"><div class=\"rule\" style=\"background:var(--sageT)\"><b>Correct</b><br>Simon earned $25 on Monday, $20 on Tuesday and $40 on Wednesday.<br>Simon’s earnings fell from $25 to $20 but then <b>recovered</b> to $40.</div><div class=\"trap\"><b>Wrong</b><br><s>Simon earned $20 on Tuesday but $40 on Wednesday. Simon’s earnings recovered.</s><br>There is no earlier drop. “Recover” needs a fall first.</div></div>", "<p class=\"lead\">The adverb tells the reader <b>how big</b> or <b>how steady</b> the change was.</p><div class=\"three\"><div class=\"card\"><h3>Big changes</h3><div class=\"chiprow\"><span class=\"chip v\">dramatically</span><span class=\"chip v\">significantly</span><span class=\"chip v\">considerably</span><span class=\"chip v\">noticeably</span><span class=\"chip v\">markedly</span></div></div><div class=\"card\"><h3>Small changes</h3><div class=\"chiprow\"><span class=\"chip n\">slightly</span><span class=\"chip n\">minimally</span><span class=\"chip n\">negligibly</span><span class=\"chip n\">marginally</span></div></div><div class=\"card\"><h3>Steady changes</h3><div class=\"chiprow\"><span class=\"chip s\">gradually</span><span class=\"chip s\">steadily</span><span class=\"chip s\">consistently</span></div></div></div><div class=\"scale\"><span>negligibly</span><span>slightly</span><span>noticeably</span><span>considerably</span><span>dramatically</span></div><div class=\"note\"><b>Fluctuate</b> takes its own adverbs: <b>mildly</b> if the fluctuation is small, <b>wildly</b> if it is big.</div><div class=\"sent s1\" style=\"margin-bottom:12px\"><div class=\"st\">Structure A</div><b>X + verb + adverb</b><br>The number of cars rose <b>noticeably</b>. · The proportion of men in sports declined <b>slightly</b>. · The income of the company fluctuated <b>wildly</b> between 2000 and 2005.</div><h3 class=\"sub-h\">Choose the adverb from the numbers</h3><p>The size of the change on the graph decides the adverb. Five real changes, from the smallest to the biggest:</p><table class=\"t\"><thead><tr><th>Real change</th><th>Sentence</th><th>Size</th></tr></thead><tbody><tr><td>Germany 30% → 32%</td><td>Germany’s figure edged up / rose <b>slightly</b>.</td><td>small</td></tr><tr><td>UK 17% → 22%</td><td>The UK’s figure grew <b>gradually</b>.</td><td>steady</td></tr><tr><td>Ferry 3% → 11%</td><td>Ferry use rose <b>noticeably</b>.</td><td>medium</td></tr><tr><td>USA 1.8 million → 1 million</td><td>It plunged / fell <b>dramatically</b>.</td><td>big</td></tr><tr><td>Italy 2% → 22.5%</td><td>Italy’s figure rose <b>dramatically</b> / surged.</td><td>very big</td></tr></tbody></table><div class=\"note\"><b>Verbs that already contain the adverb.</b> Strong verbs make sentences shorter: <i>surge, soar, rocket, plummet, plunge</i> (big); <i>edge up, creep up, inch up, dip</i> (small). Use them for variety, but only when the change really is big or small.</div>", "<p class=\"lead\">Every verb has a <b>noun</b>. A noun needs an <b>adjective</b>, not an adverb. This gives you a second way to write every sentence.</p><div class=\"phg\"><div class=\"card\"><h3>Nouns</h3><div class=\"chiprow\"><span class=\"chip v\">an increase</span><span class=\"chip v\">a rise</span><span class=\"chip v\">an improvement</span><span class=\"chip v\">a growth</span><span class=\"chip v\">a fluctuation</span><span class=\"chip v\">a reduction</span><span class=\"chip v\">a decrease</span><span class=\"chip v\">a fall</span><span class=\"chip v\">a drop</span><span class=\"chip v\">a decline</span><span class=\"chip v\">a recovery</span></div></div><div class=\"card\"><h3>Adjectives</h3><div class=\"chiprow\"><span class=\"chip l\">dramatic</span><span class=\"chip l\">significant</span><span class=\"chip l\">considerable</span><span class=\"chip l\">noticeable</span><span class=\"chip l\">marked</span><span class=\"chip l\">slight</span><span class=\"chip l\">minimal</span><span class=\"chip l\">negligible</span><span class=\"chip l\">marginal</span><span class=\"chip l\">gradual</span><span class=\"chip l\">steady</span><span class=\"chip l\">consistent</span><span class=\"chip l\">mild</span><span class=\"chip l\">wild</span></div></div></div><div class=\"trap\" style=\"margin-top:12px\"><b>Common mistakes</b><br>✗ <s>a significantly increase</s> → ✓ <b>a significant increase</b><br>✗ <s>a remain stable / a level off / a go up</s> → ✓ <b>a period of stability</b> · <b>a rise</b><br>Never put an adverb before a noun. <i>Remain stable</i>, <i>level off</i> and <i>go up / down</i> cannot become nouns.</div><div class=\"note\" style=\"margin-top:12px\"><b>The rule:</b> verb → noun (<i>rose → a rise</i>) and adverb → adjective (<i>noticeably → noticeable</i>).</div>", "<p class=\"lead\">Verb + adverb and adjective + noun give you <b>four sentence structures</b>. They all say the same thing. Learn the formula of each one, then change a sentence from one structure to another.</p><div class=\"fstack\"><div class=\"fs\"><b>A</b><div><div class=\"ff\">X + verb + adverb</div><div class=\"fe\">The number of cars <mark class=\"t\">rose noticeably</mark>.</div></div></div><div class=\"fs\"><b>B</b><div><div class=\"ff\">X + saw / witnessed / experienced + a(n) + adjective + noun</div><div class=\"fe\">The number of cars <mark class=\"t\">saw a noticeable rise</mark>.</div></div></div><div class=\"fs\"><b>C</b><div><div class=\"ff\">There was a(n) + adjective + noun + in + X</div><div class=\"fe\"><mark class=\"t\">There was a noticeable rise in</mark> the number of cars.</div></div></div><div class=\"fs\"><b>D</b><div><div class=\"ff\">A(n) + adjective + noun + was seen / observed in + X</div><div class=\"fe\"><mark class=\"t\">A noticeable rise was observed in</mark> the number of cars.</div></div></div></div><div class=\"note\"><b>How to change the structure:</b> the verb becomes a noun (<i>rose → a rise</i>) and the adverb becomes an adjective (<i>noticeably → noticeable</i>). The subject X moves to the end after <b>in</b> (Structures C and D).</div><h3 class=\"sub-h\">The same idea with another sentence</h3><div class=\"fstack small\"><div class=\"fs\"><b>A</b><div class=\"fe\">The proportion of men in sports declined slightly.</div></div><div class=\"fs\"><b>B</b><div class=\"fe\">The proportion of men in sports witnessed a slight decline.</div></div><div class=\"fs\"><b>C</b><div class=\"fe\">There was a slight decline in the proportion of men in sports.</div></div><div class=\"fs\"><b>D</b><div class=\"fe\">A slight decline was seen in the proportion of men in sports.</div></div></div>", "<p class=\"lead\">Task 5 · Sugar production and consumption in India. Real sentences, and the structure behind each one.</p><div class=\"eg\"><span class=\"tg\">Verb + adv</span><span>Consumption <b>rose slowly but steadily</b> over the decade.</span></div><div class=\"eg\"><span class=\"tg\">Strong verb</span><span>Production <b>soared</b> to a peak of 28 million tonnes in 2007.</span></div><div class=\"eg\"><span class=\"tg\">Noun</span><span>Production fell to 16.5 million in 2009, <b>a collapse</b> of more than 10 million tonnes.</span></div><div class=\"eg\"><span class=\"tg\">Recover</span><span>After a collapse to 16.5 million in 2009, production <b>recovered</b> to about 25.5 million in 2011.</span></div><div class=\"eg\"><span class=\"tg\">Adjective</span><span>The sugar graph shows <b>a dramatic peak</b> and <b>a sharp fall</b> in production.</span></div>", "<p class=\"lead\">Before you write, look at the <b>time words</b>. They decide the tense.</p><div class=\"three\"><div class=\"card\"><h3>Past</h3>The time words are in the past.<br><i>The rate of unemployment <b>rose</b> between 2010 and 2012.</i></div><div class=\"card\"><h3>Present</h3>No dates at all, or a general fact.<br><i>The figures for electricity use <b>show</b> a rapid growth during the day.</i></div><div class=\"card\"><h3>Future</h3>The dates are in the future: forecasts and predictions.<br><i>It <b>is predicted</b> that air pollution <b>will fall</b> by 5% within two years.</i></div></div><div class=\"note\">If there is <b>no date</b> (some bar charts, tables and all processes), use the <b>present simple</b>. All the graphs in the next tabs have past dates, so use the <b>past simple</b>.</div>", "<p class=\"lead\">One small word can make a sentence wrong. These are the prepositions used most often with figures. Learn the <b>job</b> of each one.</p><table class=\"t\"><thead><tr><th style=\"width:18%\">Word</th><th>Job</th><th>Example</th></tr></thead><tbody><tr><td><b>to</b></td><td>the final figure after a change</td><td>Unemployment rose <b>to</b> 10% in 2008.</td></tr><tr><td><b>by</b></td><td>the size of the change</td><td>Unemployment fell <b>by</b> 2%, from 10% to 8%.</td></tr><tr><td><b>from … to</b></td><td>the start and the end</td><td>Sales climbed <b>from</b> 2,000 <b>to</b> 5,500.</td></tr><tr><td><b>at</b></td><td>a figure that stays, or a peak / a low point</td><td>Sales peaked <b>at</b> 60,000. The rate remained <b>at</b> 5%.</td></tr><tr><td><b>of</b></td><td>a noun of change + size, or a peak / low + figure</td><td>a rise <b>of</b> 8% · a low <b>of</b> 1.2 million</td></tr><tr><td><b>in</b></td><td>a change in what (the thing) · a year or month</td><td>a fall <b>in</b> the number of cars · <b>in</b> 2009</td></tr><tr><td><b>with</b></td><td>“having” a figure (often in a ranking)</td><td>Japan led <b>with</b> 52 medals.</td></tr><tr><td><b>between … and</b></td><td>a period, or a range</td><td><b>between</b> 2004 <b>and</b> 2008 · <b>between</b> 30 <b>and</b> 40%</td></tr></tbody></table>", "<p class=\"lead\">A graph rarely gives an exact figure. Never write a figure you cannot read. Use a <b>qualifier</b> that says whether the real figure is a little above, a little below or close to your number.</p><div class=\"three\"><div class=\"card\"><h3>A little above</h3><div class=\"chiprow\"><span class=\"chip v\">just over 30%</span><span class=\"chip v\">slightly more than 30%</span><span class=\"chip v\">a little over 30%</span><span class=\"chip v\">well over 30%</span><span class=\"chip v\">in excess of 30%</span></div></div><div class=\"card\"><h3>A little below</h3><div class=\"chiprow\"><span class=\"chip l\">just under 30%</span><span class=\"chip l\">slightly less than 30%</span><span class=\"chip l\">almost 30%</span><span class=\"chip l\">nearly 30%</span><span class=\"chip l\">well under 30%</span><span class=\"chip l\">just short of 30%</span></div></div><div class=\"card\"><h3>Close to it</h3><div class=\"chiprow\"><span class=\"chip s\">about 30%</span><span class=\"chip s\">around 30%</span><span class=\"chip s\">roughly 30%</span><span class=\"chip s\">approximately 30%</span><span class=\"chip s\">30% or so</span><span class=\"chip s\">some 30%</span></div></div></div><div class=\"note\"><b>Time needs approximation too.</b> Do not repeat every year. Say: <i>over the next two years · in the following three years · in the first half of the period · during the middle years · by the end of the period · in the mid-1980s.</i></div><div class=\"eg\"><span class=\"tg\">Task 1</span><span>Germany stood at <b>about</b> 30% in 2000 and edged up to <b>roughly</b> 32% by 2012.</span></div><div class=\"eg\"><span class=\"tg\">Task 2</span><span>The UK remained the smallest user, but its share still grew from <b>under</b> 1% to <b>just over</b> 6%.</span></div><div class=\"eg\"><span class=\"tg\">Task 3</span><span>The USA began at <b>nearly</b> 1.5 million in 1990 and peaked at <b>about</b> 1.8 million in 1991.</span></div><div class=\"eg\"><span class=\"tg\">Task 4</span><span>Car use peaked at <b>roughly</b> 62% in 1999, followed by a gradual decline to <b>just over</b> 51% in 2009.</span></div><div class=\"trap\" style=\"margin-top:12px\"><b>Do not overuse them.</b> Use a qualifier when the figure is not exact. Do not write <i>about</i> in front of every number: it looks nervous. Mix them: one <i>about</i>, one <i>roughly</i>, one <i>just over</i>, one exact figure.</div>"], "items": [[], [], [], [], [], ["The number of tourists rose noticeably. <span class='sm'>(Structure C: There was …)</span>", "The proportion of women declined slightly. <span class='sm'>(Structure B: X saw …)</span>", "There was a dramatic fall in sugar production. <span class='sm'>(Structure A: verb + adverb)</span>", "A marked increase was observed in the number of films. <span class='sm'>(Structure A: verb + adverb)</span>", "Car use fell gradually. <span class='sm'>(Structure D: … was seen / observed)</span>", "The number of visitors rose considerably. <span class='sm'>(Structure B: X experienced …)</span>"], ["Task 1: Germany 30% → 32%. &nbsp; Germany’s figure rose …", "Task 1: UK stayed at 17% until 2004 and reached 22% by 2012. &nbsp; The UK’s figure grew …", "Task 3: USA 1.8 million → 1 million. &nbsp; The figure fell …", "Task 1: Italy 2% → 22.5%. &nbsp; Italy’s figure rose …"], ["The number of cars had a significantly increase.", "The figure doubled dramatically.", "Simon earned $20 on Tuesday and $40 on Wednesday. His earnings recovered.", "The price of oil had a level off."], [], [], [], [], [], ["Rainfall peaked ______ 120 mm in July.", "There was a rise ______ 8% ______ the number of members.", "Prices rose ______ $2 to $9.", "Prices rose by $2 ______ $9.", "Rents climbed ______ $700 ______ $950.", "______ 2004 ______ 2008, unemployment fell steadily.", "The figure fluctuated ______ 30 and 40 per cent.", "Exports stayed stable ______ 5 million tonnes.", "Tourism saw a sharp fall ______ 2009.", "Japan led the table ______ 52 medals.", "Spending reached a low ______ £3.5 billion.", "Coffee consumption rose ______ 2% ______ the year.", "______ the last decade, the number of students doubled.", "Sales shot ______ ______ 2,000 to 5,500.", "The population dropped ______ 800,000.", "There was a decline ______ 15% ______ student numbers.", "Profits fell ______ a low ______ 1.2 million in 2009.", "Car sales saw an increase ______ 5 million.", "The price of a ticket stood ______ $30 in 1995.", "Oil production remained unchanged ______ 80 barrels a day.", "Italy overtook France in 2005, ______ 24% against 22%.", "Women made up 62% ______ the workforce.", "The share of men ______ part-time work fell ______ 25% to 18%.", "Wages grew ______ an average ______ 3% a year.", "______ the first half of the year, sales were stable.", "Visitor numbers hit a peak ______ 1.5 million ______ August.", "Sales dipped ______ 9,000 ______ April.", "The cost of housing is expected to rise ______ 12% over the next decade.", "France spent more ______ health than Germany.", "Almost half ______ the respondents chose option C."], [], ["The figure was 49.6%. <span class='sm'>(just under)</span>", "Sales were 30,150. <span class='sm'>(just over)</span>", "The price was $9.80. <span class='sm'>(almost)</span>", "Production was 12,480 tonnes. <span class='sm'>(around)</span>", "The rate was 18.9%. <span class='sm'>(nearly)</span>", "The percentage was 33.4%. <span class='sm'>(roughly)</span>", "The figure rose in 2006, 2007 and 2008, after a low in 2005. <span class='sm'>(over the …)</span>", "Sales were high in January, February, March, April, May and June. <span class='sm'>(in the first …)</span>"]], "models": ["There was a noticeable rise in the number of tourists.", "The proportion of women saw a slight decline.", "Sugar production fell dramatically.", "The number of films increased markedly.", "A gradual fall was seen in car use.", "The number of visitors experienced a considerable rise.", "", "", "", "", "The number of cars had a significant increase.", "The figure doubled.", "Simon earned $20 on Tuesday and $40 on Wednesday. His earnings doubled.", "The price of oil levelled off.", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "", "The figure was just under 50%.", "Sales were just over 30,000.", "The price was almost $10.", "Production was around 12,500 tonnes.", "The rate was nearly 19%.", "The percentage was roughly a third.", "The figure rose over the following three years, after a low in 2005.", "Sales were high in the first half of the year."]};
const STOP=new Set("the and for was were that with this from into have has had its their they them been being are but not all any also then than who which when while his her our your out can will would could should about over under between during after before".split(" "));
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function norm(t){return t.toLowerCase().replace(/[’‘]/g,"'").replace(/[–—]/g,"-").replace(/\$/g,"").replace(/(\d),(?=\d{3}\b)/g,"$1").replace(/\s+/g," ").trim().replace(/[.!]+$/,"")}
function numsOf(t){return (norm(t).match(/\d+(?:\.\d+)?/g)||[]).map(x=>String(parseFloat(x)))}
function toks(t){return (norm(t).match(/[a-z]+/g)||[]).filter(w=>w.length>2&&!STOP.has(w))}
function overlap(model,stu){const m=toks(model),s=toks(stu);if(!m.length)return 1;let c=0;for(const w of m){if(s.some(x=>x.slice(0,4)===w.slice(0,4)))c++}return c/m.length}
function uniq(a){return [...new Set(a)]}


/* ---- direction lexicon ---- */
const UP=/\b(ris(?:e|es|ing)|rose|risen|increas\w*|grew|grow\w*|climb\w*|jump\w*|surg\w*|soar\w*|improv\w*|rebound\w*|recover\w*|upward\w*|upturn|doubl\w*|tripl\w*|boom\w*|escalat\w*|skyrocket\w*|rocket\w*|upswing|gain\w*|bounc\w* back|pick\w* up|shot up|went up|go(?:es)? up|more popular|peak\w*)\b/gi;
const DOWN=/\b(fall\w*|fell|fallen|drop\w*|declin\w*|decreas\w*|dip\w*|plung\w*|plummet\w*|collaps\w*|slump\w*|slid\w*|slip\w*|tumbl\w*|downward\w*|downturn|halv\w*|shr[ua]nk|shrink\w*|reduc\w*|went down|go(?:es)? down|sank|sink\w*|diminish\w*|dwindl\w*|less popular)\b/gi;
function dirsOf(t){const out=[];const s=t.replace(/[’‘]/g,"'");const all=[];let m;
  UP.lastIndex=0;DOWN.lastIndex=0;
  while((m=UP.exec(s)))all.push([m.index,"U",m[0]]);
  while((m=DOWN.exec(s)))all.push([m.index,"D",m[0]]);

function ruleAnalyze(text,it){

  const card=cardOf(b);const regs=[];const grid=document.createElement("div");grid.className="gapgrid";
  b.items.forEach((q,i)=>{const id="s"+(uid++);const alts=q.ans.split("; ").map(g=>g.split(" / ").map(x=>x.trim().toLowerCase()));
    const reg={id,key:b.key+"_"+i,step:si,unit:ui,counted:true,ok:false,kind:"select",n_gaps:alts.length,cmp:v=>{const p=v.split("|");return p.length===alts.length&&p.every((x,k)=>alts[k].includes(x.trim().toLowerCase()))},show:q.ans.replace(/; /g," … "),why:q.why||"",tip:"Which job does the word do? (to / by / from … to / at / of / in / with / between …). Try once more.",prompt:plain(q.t),tries:0};REG.push(reg);regs.push(reg);
    const parts=q.t.split("______");let h="";parts.forEach((p,k)=>{h+=p;if(k<parts.length-1)h+='<input class="gap" type="text" size="'+(Math.max(...alts[k].map(x=>x.length))+1)+'" data-k="'+k+'" autocomplete="off" autocapitalize="off" spellcheck="false">'});
    const d=document.createElement("div");d.className="q g";
    d.innerHTML='<div class="p"><span class="num">'+(i+1)+".</span>"+h+'</div><input type="hidden" id="'+id+'"><div class="fb" id="f'+id+'"></div>';grid.appendChild(d)});
  card.appendChild(grid);card.appendChild(blockBar(regs));host.appendChild(card);
  regs.forEach(r=>{r.ta=card.querySelector("#"+r.id);r.fb=card.querySelector("#f"+r.id);r.wc=()=>{};
    const q=r.ta.parentNode,ins=[...q.querySelectorAll("input.gap")];
    r.paint=c=>{ins.forEach(x=>{x.className="gap"+(c?" "+c:"")})};
    r.onset=v=>{const p=String(v||"").split("|");ins.forEach((x,k)=>{x.value=p[k]||""});if(!v)r.paint("")};
    const upd=()=>{r.ta.value=ins.map(x=>x.value).join("|");if(!ins.some(x=>x.value.trim()))r.ta.value=""};
    ins.forEach(x=>{x.addEventListener("input",()=>{upd();ST.saved[r.key]=r.ta.value;if(r.ok){setOk(r,false)}r.paint("");r.fb.className="fb";save()});
      x.addEventListener("change",()=>{upd();ST.saved[r.key]=r.ta.value;if(ins.every(y=>y.value.trim()))runSel(r,true)});
      x.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();upd();if(ins.every(y=>y.value.trim()))runSel(r,true)}})})})}
/* describe every graph in four structures */
function descCard(si,ui,g){
  const c=document.createElement("div");c.className="ovc";
  c.innerHTML='<div class="gt"><i>'+g.l+"</i>"+esc(g.title)+' <span>('+g.kindname+')</span></div><div class="gimg"><img src="'+g.img+'" alt="'+esc(g.title)+'"></div>';
  for(let s=0;s<4;s++){const d=document.createElement("div");
    d.innerHTML=mkInput({key:"g"+g.l+"_"+s,step:si,unit:ui,label:'<span class="lab s'+s+'">'+"ABCD"[s]+" · "+FORM[s]+"</span>",rows:2,model:g.model[s].replace(/<[^>]+>/g,""),prompt:"Graph "+g.l+" · Structure "+"ABCD"[s],hint:fchips(s)+'<div class="clue">Use the figures and years shown on the '+g.kindname+".</div>",ph:["The … + verb + adverb …","The … saw / experienced a(n) … …","There was a(n) … in …","A(n) … was seen in …"][s],check:t=>structAnalyze(t,g,s)});
    c.appendChild(d.firstElementChild)}
  return c}
function descUnit(si,ui,host,b){
  const w=document.createElement("div");
  if(b.note){const n=document.createElement("div");n.className="note";n.innerHTML=b.note;w.appendChild(n)}
  const list=document.createElement("div");list.className="ovl";
  b.refs.forEach(i=>list.appendChild(descCard(si,ui,DATA.G[i])));w.appendChild(list);
  w.appendChild(blockBar(REG.filter(r=>r.step===si&&r.unit===ui)));host.appendChild(w)}

/* ---------- page ---------- */
function build(){
  document.title=CH.title.replace(/<[^>]+>/g,"")+" · "+CH.kicker+" · Mr Ikromov's IELTS";
  document.body.innerHTML='<header class="band"><div class="wrap"><div class="kick">'+CH.kicker+'</div><h1>'+CH.title+'</h1><p>'+CH.lead+'</p><div class="prog"><div class="bar"><i id="pbar"></i></div><b id="pnum"></b></div></div></header>'+
    '<nav class="steps"><div class="wrap"><div class="row" id="steps"></div></div></nav><main class="wrap" id="main"></main><div class="foot">'+(CH.footer||"")+'</div><div id="toast"></div>';
  const nav=$("#steps"),main=$("#main");
  CH.steps.forEach((s,si)=>{
    nav.insertAdjacentHTML("beforeend",'<button class="step" id="st'+si+'" data-i="'+si+'"><span class="no">'+s.no+"</span>"+s.name+' <span class="ct"></span></button>');
    const sec=document.createElement("section");sec.className="sec";sec.id="sec"+si;sec.style.display="none";
    sec.innerHTML='<div class="sec-title"><span class="n">'+s.no+"</span><h2>"+s.title+"</h2></div>"+(s.lead?'<p class="lead">'+s.lead+"</p>":"")+(s.note?'<div class="note">'+s.note+"</div>":"");
    main.appendChild(sec);
    // units: each shown on its own (sub menu) when the step has more than one
    const units=[];
    for(const b of s.blocks){
      if(b.type==="html")units.push({label:b.tab||"Info",render:(ui,h)=>{const c=document.createElement("div");c.innerHTML=b.html;h.appendChild(c)}});
      else if(b.type==="write")units.push({label:b.label,render:(ui,h)=>writeItems(si,ui,h,b)});
      else if(b.type==="pick")units.push({label:b.label,render:(ui,h)=>pickUnit(si,ui,h,b)});
      else if(b.type==="gaps")units.push({label:b.label,render:(ui,h)=>gapUnit(si,ui,h,b)});
      else if(b.type==="desc")units.push({label:b.label,render:(ui,h)=>descUnit(si,ui,h,b)});
    }
    s._units=units;
    const tabs=units.filter(u=>!u.inline);
    const sub=document.createElement("div");sub.className="subnav";if(s.subnav&&tabs.length>1)sec.appendChild(sub);
    const host=document.createElement("div");sec.appendChild(host);
    units.forEach((u,ui)=>{const box=document.createElement("div");box.className="unit";box.dataset.u=ui;u.render(ui,box);host.appendChild(box);u.box=box;
      if(s.subnav&&!u.inline&&tabs.length>1)sub.insertAdjacentHTML("beforeend",'<button class="sub" id="u'+si+'_'+ui+'" data-u="'+ui+'">'+esc(u.label)+" <small></small></button>")});
    if(s.subnav&&tabs.length>1){sub.onclick=e=>{const b=e.target.closest(".sub");if(b)showUnit(si,+b.dataset.u,true)}}
    const nb=document.createElement("div");nb.className="nextbar";
    nb.innerHTML=(si>0?'<button class="btn ghost" data-go="'+(si-1)+'">← '+CH.steps[si-1].name+"</button>":"<span></span>")+(si<CH.steps.length-1?'<button class="btn go" data-go="'+(si+1)+'">Next: '+CH.steps[si+1].name+" →</button>":'<span class="wc">This is the last step. Check your progress at the top.</span>');
    nb.onclick=e=>{const b=e.target.closest("[data-go]");if(b){showStep(+b.dataset.go);window.scrollTo(0,0)}};sec.appendChild(nb);
  });
  nav.onclick=e=>{const b=e.target.closest(".step");if(b){showStep(+b.dataset.i);window.scrollTo(0,0)}};
  bindInputs();
}
function showUnit(si,ui,scroll){const s=CH.steps[si];if(!s.subnav)return;ST.unit[si]=ui;
  s._units.forEach((u,k)=>{if(u.inline)return;u.box.style.display=k===ui?"":"none";const b=$("#u"+si+"_"+k);if(b)b.classList.toggle("on",k===ui)});
  $$("svg.chart",s._units[ui].box).forEach(c=>{c.classList.remove("draw");void c.getBoundingClientRect();c.classList.add("draw")});
  if(scroll){const t=$("#sec"+si);window.scrollTo({top:Math.max(0,t.getBoundingClientRect().top+window.scrollY-70)})}save()}
function showStep(si){ST.step=si;CH.steps.forEach((s,k)=>{$("#sec"+k).style.display=k===si?"":"none";$("#st"+k).classList.toggle("on",k===si)});
  const b=$("#st"+si);if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"center"});
  const s=CH.steps[si];if(s.subnav)showUnit(si,Math.min(ST.unit[si]||0,s._units.length-1),false);save()}
function applyState(){
  for(const r of REG){const v=ST.saved[r.key];if(v==null||!r.ta)continue;r.ta.value=v;if(r.onset)r.onset(v);r.tries=ST.tries[r.key]||0;
    if(r.kind==="select"){if(v)runSel(r,false)}else{r.wc();if(ST.ok[r.key]){r.ta.className="ok";setOk(r,true)}}}
  showStep(Math.min(ST.step||0,CH.steps.length-1));progress();sendTexts()}

build();
// load saved progress: from the site (in the frame) or from this browser
let got=false;
window.addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="ielts-lab-state"||d.id!==CH.id)return;if(d.theme)setTheme(d.theme);if(!got){got=true;restore(d.data);if(!d.data)fallback()}});
function fallback(){try{restore(localStorage.getItem("ielts-lab:"+CH.id))}catch(e){}}
showStep(0);progress();
if(inFrame){try{parent.postMessage({type:"ielts-lab-load",id:CH.id},"*")}catch(e){}setTimeout(()=>{if(!got){got=true;fallback()}},900)}else{got=true;fallback()}
})();


</script>
</body>
