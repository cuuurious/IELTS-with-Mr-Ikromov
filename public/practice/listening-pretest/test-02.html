<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Listening – Test 2</title>
<style>
:root{--red:#c8102e;--ink:#1a1a1a;--bg:#fff;--line:#c9c9c9;--soft:#f1f1ef;--ok:#1b7a3a;--bad:#b3261e;--accent:#1f5fbf}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
header{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:20}
.logo{font-weight:900;color:var(--red);font-size:24px;letter-spacing:-1px}
.hmid{font-size:13px;line-height:1.25;margin-left:12px;flex:1}
.hmid b{display:block;font-size:14px}
#audiostat{color:#555}
.hbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
main{padding:72px 16px 90px;max-width:960px;margin:0 auto}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:18px}
.banner b{display:block}
h3{margin:22px 0 4px;font-size:15px}
.instr{margin:0 0 10px}
.ptitle{font-weight:700;font-size:17px;margin:10px 0}
.notes{margin:8px 0 6px}
.notes .h{font-weight:700;margin:12px 0 4px}
.notes .t{margin:6px 0}
.notes .b{margin:6px 0 6px 18px;position:relative}.notes .b:before{content:"•";position:absolute;left:-14px}
.notes .s{margin:6px 0 6px 38px;position:relative}.notes .s:before{content:"–";position:absolute;left:-14px}
input.gap{width:140px;height:28px;border:1px solid #777;border-radius:3px;padding:0 6px;text-align:center;font-weight:700;font-size:14px;margin:0 4px;vertical-align:middle;background:#fff}
input.gap::placeholder{color:#111;opacity:1}
input.gap:focus{outline:2px solid var(--accent)}
.q{margin:16px 0}.q .n{display:inline-block;min-width:22px;font-weight:700;border:1px solid transparent;padding:0 3px}
.q.cur .n{border-color:var(--accent)}
.opt{display:flex;align-items:center;gap:8px;margin:7px 0 7px 22px;cursor:pointer}
.opt input{width:16px;height:16px}
.zone{display:inline-flex;align-items:center;justify-content:center;min-width:150px;height:30px;border:1.5px dashed #555;border-radius:4px;font-weight:700;padding:0 8px;margin:0 6px;vertical-align:middle;background:#fff;cursor:pointer}
.zone.filled{border-style:solid;background:#f7fbff}
.zone.over{background:#e6f0ff}
.zone.letter{min-width:56px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{border:1px solid #666;border-radius:4px;padding:5px 10px;background:#fff;cursor:grab;user-select:none;font-size:14px}
.chip.sel{outline:2px solid var(--accent);background:#eaf1ff}
.chip.letter b{margin-right:6px}
.drow{margin:12px 0;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.drow .lab{min-width:170px}
.mapwrap{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.mapwrap img{max-width:520px;width:100%;border:1px solid var(--line)}
.helpline{font-size:12px;color:#666;margin:2px 0 8px}
nav#bar{position:fixed;bottom:0;left:0;right:0;height:52px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:stretch;z-index:20}
.pt{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:14px;color:#444;padding:0 6px;border-right:1px solid #eee}
.pt.act{flex:3;color:#000;font-weight:700;justify-content:flex-start;padding-left:14px}
.pt .nums{display:none;gap:4px;flex-wrap:nowrap;font-weight:400}
.pt.act .nums{display:flex}
.pt .cnt{font-weight:400;font-size:12px}.pt.act .cnt{display:none}
.nb{min-width:22px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid transparent;border-radius:2px;cursor:pointer;position:relative}
.nb.done{font-weight:700;background:#e9f0fb}
.nb.cur{border-color:var(--accent)}
.nb.flag:after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--red);border-radius:50%}
.nb.ok{background:#dff3e5;color:var(--ok)}.nb.no{background:#fbe2e0;color:var(--bad)}
#submit{width:64px;background:#eee;border:0;cursor:pointer;font-size:22px}
.arrows{position:fixed;right:16px;bottom:70px;display:flex;gap:2px;z-index:15}
.arrows button{width:44px;height:44px;border:0;background:#111;color:#fff;font-size:22px;cursor:pointer;border-radius:3px}
.arrows button.dis{background:#ddd;color:#888}
.overlay{position:fixed;inset:0;background:rgba(60,60,60,.93);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.overlay .play{margin-top:20px;background:#000;color:#fff;border:0;border-radius:4px;padding:12px 24px;font-size:16px;cursor:pointer}
.modal{background:#fff;color:#111;max-width:760px;width:100%;max-height:88vh;overflow:auto;border-radius:8px;padding:24px;text-align:left}
.score{font-size:40px;font-weight:800;margin:6px 0}
table.res{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
table.res td,table.res th{border-bottom:1px solid #ddd;padding:5px 8px;text-align:left}
td.ok{color:var(--ok);font-weight:700}td.no{color:var(--bad);font-weight:700}
.fb{display:inline-block;margin-left:8px;font-size:13px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.locked input.gap{background:#f6f6f6}
.btn{background:var(--accent);color:#fff;border:0;border-radius:5px;padding:10px 18px;font-size:15px;cursor:pointer;margin:6px 6px 0 0}
.btn.sec{background:#eee;color:#111}

.side{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;margin:8px 0}.side>div{flex:1 1 260px;min-width:0}
img.pic{max-width:100%;width:520px;border:1px solid var(--line)}
table.tb{border-collapse:collapse;margin:10px 0;width:100%}
table.tb td,table.tb th{border:1px solid #777;padding:6px 8px;vertical-align:top;text-align:left}
table.tb th{background:#f3f3f1}
table.form{max-width:760px}
table.opt{width:auto;min-width:320px}
.flow{max-width:560px;margin:8px 0}.flb{border:1px solid #444;padding:7px 9px;text-align:center}.arr{text-align:center;line-height:1.1}
.cb{margin:3px 0 3px 12px;position:relative}.cb:before{content:"•";position:absolute;left:-11px}
p.b{font-weight:700}p.c{text-align:center}p.i{font-style:italic}p.sub{font-weight:700}p.bh{font-weight:700;text-align:center}
.ptitle.c{text-align:center}
.nt{font-weight:700;text-align:center;margin-bottom:6px}
.notes{border:1px solid #444;padding:8px 12px;margin:8px 0}
.notes .gp{height:8px}
.bl{letter-spacing:1px}
.lines .drow{margin:8px 0}
input.gap.short{width:64px}
.gw{white-space:nowrap}
@media(max-width:640px){.pt.act{flex:5}.pt:not(.act) .cnt{display:none}input.gap{width:110px}}

.stats{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.stat{flex:1 1 90px;background:#f5f5f3;border:1px solid #ddd;border-radius:6px;padding:8px 10px;text-align:center}.stat b{display:block;font-size:22px}
table.res td.pc{text-align:right;white-space:nowrap}
.bar{display:inline-block;height:8px;background:#1b7a3a;border-radius:4px;vertical-align:middle;margin-left:6px}
.qt{color:#666;font-size:12px}
.res h4{margin:16px 0 4px}
</style></head><body>
<header><div class="logo">IELTS</div><div class="hmid"><b>MrIkromov's IELTS · Listening Test 2</b><span id="audiostat"></span></div><button class="hbtn" id="notesbtn">Notes</button></header>
<main id="main"></main>
<div class="arrows"><button id="prev">←</button><button id="next">→</button></div>
<nav id="bar"></nav>
<div class="overlay" id="start"><div style="font-size:64px">🎧</div><p style="max-width:640px">You will be listening to an audio recording during this test. You will not be permitted to pause or rewind the audio while answering the questions.</p><p>To continue, click Play.</p><button class="play" id="playbtn">▶ Play</button></div>
<audio id="aud" preload="auto" src="/practice/listening-pretest/audio/test-02.mp3"></audio>
<script>
const TEST={"no": 2, "n": 49, "key": {"1": {"type": "gap", "accept": ["Islip"], "qt": "Note completion"}, "2": {"type": "gap", "accept": ["School"], "qt": "Note completion"}, "3": {"type": "gap", "accept": ["Computer"], "qt": "Note completion"}, "4": {"type": "gap", "accept": ["Phone"], "qt": "Note completion"}, "5": {"type": "gap", "accept": ["5.96"], "qt": "Note completion"}, "6": {"type": "gap", "accept": ["Fuel"], "qt": "Note completion"}, "7": {"type": "gap", "accept": ["Discount"], "qt": "Note completion"}, "8": {"type": "gap", "accept": ["Insurance"], "qt": "Note completion"}, "9": {"type": "gap", "accept": ["12.50"], "qt": "Note completion"}, "10": {"type": "gap", "accept": ["Environment"], "qt": "Note completion"}, "11": {"type": "letter", "accept": "A", "qt": "Multiple choice"}, "12": {"type": "letter", "accept": "C", "qt": "Multiple choice"}, "13": {"type": "letter", "accept": "B", "qt": "Multiple choice"}, "14": {"type": "letter", "accept": "B", "qt": "Multiple choice"}, "15": {"type": "letter", "accept": "A", "qt": "Multiple choice"}, "16": {"type": "letter", "accept": "B", "qt": "Multiple choice"}, "17": {"type": "letter", "accept": "C", "qt": "Multiple choice"}, "18": {"type": "pick", "g": 18, "idx": 0, "set": ["B", "E"], "qt": "Choose two letters"}, "19": {"type": "pick", "g": 18, "idx": 1, "set": ["B", "E"], "qt": "Choose two letters"}, "20": {"type": "pick", "g": 20, "idx": 0, "set": ["C", "D"], "qt": "Choose two letters"}, "21": {"type": "pick", "g": 20, "idx": 1, "set": ["C", "D"], "qt": "Choose two letters"}, "22": {"type": "pick", "g": 22, "idx": 0, "set": ["A", "C"], "qt": "Choose two letters"}, "23": {"type": "pick", "g": 22, "idx": 1, "set": ["A", "C"], "qt": "Choose two letters"}, "24": {"type": "gap", "accept": ["brass"], "qt": "Note completion"}, "25": {"type": "gap", "accept": ["sports"], "qt": "Note completion"}, "26": {"type": "gap", "accept": ["offices"], "qt": "Note completion"}, "27": {"type": "gap", "accept": ["piano"], "qt": "Note completion"}, "28": {"type": "gap", "accept": ["needle"], "qt": "Note completion"}, "29": {"type": "gap", "accept": ["Wax"], "qt": "Note completion"}, "30": {"type": "gap", "accept": ["Motor"], "qt": "Note completion"}, "31": {"type": "gap", "accept": ["Distance"], "qt": "Note completion"}, "32": {"type": "gap", "accept": ["album"], "qt": "Note completion"}, "33": {"type": "gap", "accept": ["range"], "qt": "Note completion"}, "34": {"type": "gap", "accept": ["studio"], "qt": "Note completion"}, "35": {"type": "gap", "accept": ["Home"], "qt": "Note completion"}, "36": {"type": "gap", "accept": ["portable"], "qt": "Note completion"}, "37": {"type": "gap", "accept": ["Remains"], "qt": "Note completion"}, "38": {"type": "gap", "accept": ["Cities"], "qt": "Note completion"}, "39": {"type": "gap", "accept": ["Machines"], "qt": "Note completion"}, "40": {"type": "gap", "accept": ["Equipment"], "qt": "Note completion"}, "41": {"type": "gap", "accept": ["Library"], "qt": "Note completion"}, "42": {"type": "gap", "accept": ["local"], "qt": "Note completion"}, "43": {"type": "gap", "accept": ["cucumber"], "qt": "Note completion"}, "44": {"type": "gap", "accept": ["shape"], "qt": "Note completion"}, "45": {"type": "gap", "accept": ["Manuscripts"], "qt": "Note completion"}, "46": {"type": "gap", "accept": ["Field"], "qt": "Note completion"}, "47": {"type": "gap", "accept": ["Adopt"], "qt": "Note completion"}, "48": {"type": "gap", "accept": ["Name"], "qt": "Note completion"}, "49": {"type": "gap", "accept": ["Seeds"], "qt": "Note completion"}}, "zg": {}, "reuse": [], "parts": [{"n": 1, "range": "1–10", "from": 1, "to": 10, "html": "<h3>Questions 1–10</h3><p class='instr'>Complete the notes below.</p><p class='instr'>Write <b>ONE WORD AND/OR A NUMBER</b> for each answer.</p><div class='notes'><div class='nt'>Car Club Scheme</div><div class='b'>How the scheme works: Every member has access to a fleet of cars</div><div class='h'>Nearest location:</div><div class='b'><span class='gw' data-q='1'><input class='gap' data-q='1' placeholder='1' autocomplete='off' spellcheck='false'></span> Street, near the <span class='gw' data-q='2'><input class='gap' data-q='2' placeholder='2' autocomplete='off' spellcheck='false'></span></div><div class='h'>Using the car:</div><div class='b'>Use membership card to unlock the car</div><div class='b'>Enter number on the <span class='gw' data-q='3'><input class='gap' data-q='3' placeholder='3' autocomplete='off' spellcheck='false'></span> in the car</div><div class='h'>Booking:</div><div class='b'>Small charge for using the <span class='gw' data-q='4'><input class='gap' data-q='4' placeholder='4' autocomplete='off' spellcheck='false'></span> to book</div><div class='h'>Cost:</div><div class='b'>Maximum cost: £ <span class='gw' data-q='5'><input class='gap' data-q='5' placeholder='5' autocomplete='off' spellcheck='false'></span> an hour</div><div class='b'>Cost of <span class='gw' data-q='6'><input class='gap' data-q='6' placeholder='6' autocomplete='off' spellcheck='false'></span> is included</div><div class='b'>There is a <span class='gw' data-q='7'><input class='gap' data-q='7' placeholder='7' autocomplete='off' spellcheck='false'></span> for family members</div><div class='b'>£10 a month supplement to cover the higher price of <span class='gw' data-q='8'><input class='gap' data-q='8' placeholder='8' autocomplete='off' spellcheck='false'></span> for younger drivers</div><div class='b'>Members can have a ‘frequent users card’ for an extra £ <span class='gw' data-q='9'><input class='gap' data-q='9' placeholder='9' autocomplete='off' spellcheck='false'></span> a month</div><div class='h'>Other information:</div><div class='b'>Pets are not allowed in the cars</div><div class='b'>Scheme is good for the <span class='gw' data-q='10'><input class='gap' data-q='10' placeholder='10' autocomplete='off' spellcheck='false'></span></div></div>"}, {"n": 2, "range": "11–23", "from": 11, "to": 23, "html": "<h3>Questions 11–17</h3><p class='instr'>Choose the correct letter, <b>A</b>, <b>B</b> or <b>C</b>.</p><p class='ptitle c'>Visiting the City Zoo</p><div class='q' data-q='11'><span class='n'>11</span> What does the speaker say about the zoo’s visiting hours?<label class='opt'><input type='radio' name='q11' value='A' data-q='11'> <b>A</b> Some parts of the zoo stay open later than others.</label><label class='opt'><input type='radio' name='q11' value='B' data-q='11'> <b>B</b> The zoo closes at the same time every day.</label><label class='opt'><input type='radio' name='q11' value='C' data-q='11'> <b>C</b> The zoo remains open during national holidays.</label></div><div class='q' data-q='12'><span class='n'>12</span> What can visitors see at the Migratory Bird House?<label class='opt'><input type='radio' name='q12' value='A' data-q='12'> <b>A</b> nests of live birds</label><label class='opt'><input type='radio' name='q12' value='B' data-q='12'> <b>B</b> a display of a South American habitat</label><label class='opt'><input type='radio' name='q12' value='C' data-q='12'> <b>C</b> an interactive exhibit about birds</label></div><div class='q' data-q='13'><span class='n'>13</span> What is different about the Asia Trail this year?<label class='opt'><input type='radio' name='q13' value='A' data-q='13'> <b>A</b> New species have been added.</label><label class='opt'><input type='radio' name='q13' value='B' data-q='13'> <b>B</b> It is possible to see the pandas.</label><label class='opt'><input type='radio' name='q13' value='C' data-q='13'> <b>C</b> A bamboo habitat has been created.</label></div><div class='q' data-q='14'><span class='n'>14</span> What does the speaker say about the zoo’s baby lions?<label class='opt'><input type='radio' name='q14' value='A' data-q='14'> <b>A</b> They may never learn to swim.</label><label class='opt'><input type='radio' name='q14' value='B' data-q='14'> <b>B</b> They must be able to swim to play outside.</label><label class='opt'><input type='radio' name='q14' value='C' data-q='14'> <b>C</b> They dislike playing in the water at the zoo.</label></div><div class='q' data-q='15'><span class='n'>15</span> In the Primate Zone, visitors may<label class='opt'><input type='radio' name='q15' value='A' data-q='15'> <b>A</b> test their strength against an orangutan.</label><label class='opt'><input type='radio' name='q15' value='B' data-q='15'> <b>B</b> try to communicate with a monkey.</label><label class='opt'><input type='radio' name='q15' value='C' data-q='15'> <b>C</b> handle tools that apes have made.</label></div><div class='q' data-q='16'><span class='n'>16</span> Which animal may children touch in the Kids’ Farm?<label class='opt'><input type='radio' name='q16' value='A' data-q='16'> <b>A</b> cows</label><label class='opt'><input type='radio' name='q16' value='B' data-q='16'> <b>B</b> sheep</label><label class='opt'><input type='radio' name='q16' value='C' data-q='16'> <b>C</b> goats</label></div><div class='q' data-q='17'><span class='n'>17</span> Children who celebrate their birthday at the zoo can<label class='opt'><input type='radio' name='q17' value='A' data-q='17'> <b>A</b> see a film about safaris.</label><label class='opt'><input type='radio' name='q17' value='B' data-q='17'> <b>B</b> feed zoo animals.</label><label class='opt'><input type='radio' name='q17' value='C' data-q='17'> <b>C</b> learn from a scientist.</label></div><h3>Questions 18 and 19</h3><p class='instr'>Choose <b>TWO</b> letters, <b>A–E</b>.</p><p class=''>Which <b>TWO</b> of the following are true about becoming a zoo member?</p><div class='q' data-q='18'><label class='opt'><input type='checkbox' class='pick' value='A' data-g='18' data-max='2'> <b>A</b> Only credit cards are accepted in person.</label><label class='opt'><input type='checkbox' class='pick' value='B' data-g='18' data-max='2'> <b>B</b> Membership is effective immediately.</label><label class='opt'><input type='checkbox' class='pick' value='C' data-g='18' data-max='2'> <b>C</b> Memberships can be purchased with personal cheques.</label><label class='opt'><input type='checkbox' class='pick' value='D' data-g='18' data-max='2'> <b>D</b> It is no longer possible to join by phone.</label><label class='opt'><input type='checkbox' class='pick' value='E' data-g='18' data-max='2'> <b>E</b> It takes several days to receive a membership card.</label></div><h3>Questions 20 and 21</h3><p class='instr'>Choose <b>TWO</b> letters, <b>A–E</b>.</p><p class=''>Which <b>TWO</b> of the following are benefits of being a zoo member?</p><div class='q' data-q='20'><label class='opt'><input type='checkbox' class='pick' value='A' data-g='20' data-max='2'> <b>A</b> Parents can do joint activities with their children.</label><label class='opt'><input type='checkbox' class='pick' value='B' data-g='20' data-max='2'> <b>B</b> Children can ride the zoo’s train for free.</label><label class='opt'><input type='checkbox' class='pick' value='C' data-g='20' data-max='2'> <b>C</b> There is a special facility for children.</label><label class='opt'><input type='checkbox' class='pick' value='D' data-g='20' data-max='2'> <b>D</b> Members can get discounts at the gift shop.</label><label class='opt'><input type='checkbox' class='pick' value='E' data-g='20' data-max='2'> <b>E</b> Members can get free entry at other zoos.</label></div><h3>Questions 22 and 23</h3><p class='instr'>Choose <b>TWO</b> letters, <b>A–E</b>.</p><p class=''>Which <b>TWO</b> facts are given about family membership policies?</p><div class='q' data-q='22'><label class='opt'><input type='checkbox' class='pick' value='A' data-g='22' data-max='2'> <b>A</b> Members may invite only one adult to come with them.</label><label class='opt'><input type='checkbox' class='pick' value='B' data-g='22' data-max='2'> <b>B</b> Members need to go online to renew their membership.</label><label class='opt'><input type='checkbox' class='pick' value='C' data-g='22' data-max='2'> <b>C</b> Members may come with an unlimited number of children.</label><label class='opt'><input type='checkbox' class='pick' value='D' data-g='22' data-max='2'> <b>D</b> Members must live within the city.</label><label class='opt'><input type='checkbox' class='pick' value='E' data-g='22' data-max='2'> <b>E</b> Members must pay extra for the magazine.</label></div>"}, {"n": 3, "range": "24–36", "from": 24, "to": 36, "html": "<h3>Questions 24–36</h3><p class='instr'>Complete the notes below.</p><p class='instr'>Write <b>ONE WORD ONLY</b> for each answer.</p><div class='notes'><div class='nt'>History of US recording technology</div><div class='h'>Before music was recorded</div><div class='b'>Music was always heard live.</div><div class='b'>Popular music began with instruments made of <span class='gw' data-q='24'><input class='gap' data-q='24' placeholder='24' autocomplete='off' spellcheck='false'></span> that were used outdoors.</div><div class='b'>People liked to sing while watching <span class='gw' data-q='25'><input class='gap' data-q='25' placeholder='25' autocomplete='off' spellcheck='false'></span> events.</div><div class='h'>Tin Pan Alley</div><div class='b'>This was an area in New York.</div><div class='b'>The <span class='gw' data-q='26'><input class='gap' data-q='26' placeholder='26' autocomplete='off' spellcheck='false'></span> of publishers Witmark and Mills were located there.</div><div class='b'>Sheet music was produced which families played at home on their <span class='gw' data-q='27'><input class='gap' data-q='27' placeholder='27' autocomplete='off' spellcheck='false'></span>.</div><div class='h'>First recorded music</div><div class='b'>1877: Thomas Edison created a device to record music using a horn to capture sound and a <span class='gw' data-q='28'><input class='gap' data-q='28' placeholder='28' autocomplete='off' spellcheck='false'></span> to make marks on a tin cylinder.</div><div class='b'>Later, he used cylinders made of <span class='gw' data-q='29'><input class='gap' data-q='29' placeholder='29' autocomplete='off' spellcheck='false'></span> which could be copied.</div><div class='b'>With an added electric <span class='gw' data-q='30'><input class='gap' data-q='30' placeholder='30' autocomplete='off' spellcheck='false'></span>, the speed of playback was always the same.</div><div class='h'>The phonograph</div><div class='b'>1887: Emile Berliner recorded music on a flat disc, turning at 78 rpm.</div><div class='b'>The first discs sold were usually of opera music.</div><div class='b'>Acoustic microphones best recorded a singer from a <span class='gw' data-q='31'><input class='gap' data-q='31' placeholder='31' autocomplete='off' spellcheck='false'></span>.</div><div class='b'>Beethoven’s Fifth Symphony was collected on eight discs. This type of collection was called an ‘<span class='gw' data-q='32'><input class='gap' data-q='32' placeholder='32' autocomplete='off' spellcheck='false'></span>’.</div><div class='h'>1920s: the electric microphone</div><div class='b'>An intimate recording style allowed singers of pop music to gain prominence.</div><div class='b'>The new microphone recorded a greater <span class='gw' data-q='33'><input class='gap' data-q='33' placeholder='33' autocomplete='off' spellcheck='false'></span> of instruments, making it possible to reproduce classical music.</div><div class='h'>Developments through the 1960s</div><div class='b'>Progress made with recording in the <span class='gw' data-q='34'><input class='gap' data-q='34' placeholder='34' autocomplete='off' spellcheck='false'></span> did not affect consumers much.</div><div class='b'>People were more likely to listen to music at <span class='gw' data-q='35'><input class='gap' data-q='35' placeholder='35' autocomplete='off' spellcheck='false'></span>.</div><div class='b'>Cassettes were invented and became popular because they were <span class='gw' data-q='36'><input class='gap' data-q='36' placeholder='36' autocomplete='off' spellcheck='false'></span>.</div></div>"}, {"n": 4, "range": "37–49", "from": 37, "to": 49, "html": "<h3>Questions 37–49</h3><p class='instr'>Complete the notes below.</p><p class='instr'>Write <b>ONE WORD ONLY</b> for each answer.</p><div class='notes'><div class='nt'>Archaeobotany and art</div><div class='h'>What is archaeobotany?</div><div class='b'>Archaeobotany generally involves studying the <span class='gw' data-q='37'><input class='gap' data-q='37' placeholder='37' autocomplete='off' spellcheck='false'></span> of historical plant species.</div><div class='b'>However, archaeobotanist Dalla Ragione studies art for information about Italy’s past biodiversity.</div><div class='h'>Changes to agriculture in Italy in the 1950s</div><div class='b'><span class='gw' data-q='38'><input class='gap' data-q='38' placeholder='38' autocomplete='off' spellcheck='false'></span> attracted farmers looking for industrial work. Crops that grew slowly, were unproductive or could not be gathered by <span class='gw' data-q='39'><input class='gap' data-q='39' placeholder='39' autocomplete='off' spellcheck='false'></span> were no longer cultivated.</div><div class='h'>Dalla Ragione’s early life</div><div class='b'>She helped her father find plants and unused <span class='gw' data-q='40'><input class='gap' data-q='40' placeholder='40' autocomplete='off' spellcheck='false'></span> on their farm.</div><div class='b'>She later studied the cultural history and genetics of fruit.</div><div class='h'>Bufalini Palace</div><div class='b'>Dalla Ragione noticed frescoes on the walls of the <span class='gw' data-q='41'><input class='gap' data-q='41' placeholder='41' autocomplete='off' spellcheck='false'></span> in the palace.</div><div class='b'>The artist had painted <span class='gw' data-q='42'><input class='gap' data-q='42' placeholder='42' autocomplete='off' spellcheck='false'></span> varieties of fruits and vegetables.</div><div class='b'>She sourced many of these vegetables, including a rare white <span class='gw' data-q='43'><input class='gap' data-q='43' placeholder='43' autocomplete='off' spellcheck='false'></span>.</div><div class='h'>Further research</div><div class='b'>‘Madonna and Child with the Pear’ – the <span class='gw' data-q='44'><input class='gap' data-q='44' placeholder='44' autocomplete='off' spellcheck='false'></span> of the fruit showed it was actually an apple.</div><div class='b'>Another painting showed a fruit referred to as an apple, but Dalla Ragione looked in <span class='gw' data-q='45'><input class='gap' data-q='45' placeholder='45' autocomplete='off' spellcheck='false'></span> and decided it was a pear.</div><div class='b'>She located this variety of pear in a <span class='gw' data-q='46'><input class='gap' data-q='46' placeholder='46' autocomplete='off' spellcheck='false'></span> in Tuscany.</div><div class='h'>Preserving rare plants</div><div class='b'>The Dalla Ragione Foundation preserves fruit trees by allowing people to <span class='gw' data-q='47'><input class='gap' data-q='47' placeholder='47' autocomplete='off' spellcheck='false'></span> them.</div><div class='b'>Dalla Ragione continues to search for lost varieties.</div><div class='b'>This can be difficult as their <span class='gw' data-q='48'><input class='gap' data-q='48' placeholder='48' autocomplete='off' spellcheck='false'></span> may have changed.</div><div class='b'>She believes plants are part of our cultural identity – e.g. emigrating Italians took <span class='gw' data-q='49'><input class='gap' data-q='49' placeholder='49' autocomplete='off' spellcheck='false'></span> to the Americas.</div></div>"}]};
const $=s=>document.querySelector(s);
const N=TEST.n;const ans={},flags={};let part=0,cur=1,submitted=false;
const aud=$('#aud');
// ---------- normalisation ----------
function norm(s){s=(s||'').toLowerCase().replace(/[£$]/g,'').replace(/[.,;:!?]+$/,'').replace(/\s+/g,' ').trim();s=s.replace(/^(a|an|the)\s+/,'');return s}
function isOK(q,v){
  const k=TEST.key[q];
  if(k.type==='gap'){const n=norm(v);if(!n)return false;if(k.all){return k.all.every(g=>g.some(a=>n.split(' ').includes(norm(a))||n.includes(norm(a))))}return k.accept.some(a=>norm(a)===n)}
  if(k.type==='letter'){return (v||'')===k.accept}
  if(k.type==='set'){return k.set.includes(v||'')}
  if(k.type==='pick'){return false}
  return false}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  const P=TEST.parts[part];
  $('#main').innerHTML='<div class="banner"><b>Part '+P.n+'</b>Listen and answer questions '+P.range+'.</div>'+P.html;
  restore();bindAll();renderBar();updateArrows();
  if(submitted)decorate();
  window.scrollTo(0,0)}
function restore(){
  document.querySelectorAll('input.gap').forEach(i=>{i.value=ans[i.dataset.q]||''});
  document.querySelectorAll('input[type=radio]').forEach(i=>{i.checked=ans[i.dataset.q]===i.value});
  document.querySelectorAll('input.pick').forEach(i=>{const a=ans['p'+i.dataset.g]||[];i.checked=a.includes(i.value)});
  document.querySelectorAll('.zone').forEach(z=>{fillZone(z,ans[z.dataset.q])});
  document.querySelectorAll('.chip').forEach(c=>{const used=!(TEST.reuse||[]).includes(c.dataset.grp)&&Object.entries(ans).some(([q,v])=>v===c.dataset.id&&zoneGrp(q)===c.dataset.grp);c.style.display=used?'none':''});
}
function zoneGrp(q){return (TEST.zg||{})[q]}
function fillZone(z,id){z.textContent=id?id:z.dataset.q;z.classList.toggle('filled',!!id)}
let selChip=null;
function place(z,id){const q=z.dataset.q,grp=z.dataset.grp;
  if(!(TEST.reuse||[]).includes(grp)){for(const k in ans){if(ans[k]===id&&zoneGrp(k)===grp)delete ans[k]}}
  ans[q]=id;restore();renderBar()}
function bindAll(){
  document.querySelectorAll('input.gap').forEach(i=>{i.addEventListener('input',()=>{ans[i.dataset.q]=i.value;cur=+i.dataset.q;renderBar()});i.addEventListener('focus',()=>{cur=+i.dataset.q;renderBar()})});
  document.querySelectorAll('input[type=radio]').forEach(i=>i.addEventListener('change',()=>{ans[i.dataset.q]=i.value;cur=+i.dataset.q;renderBar()}));
  document.querySelectorAll('input.pick').forEach(i=>i.addEventListener('change',()=>{
    const g=i.dataset.g;const all=[...document.querySelectorAll('input.pick[data-g="'+g+'"]')];
    const on=all.filter(x=>x.checked);if(on.length>(+i.dataset.max||2)){i.checked=false;return}
    ans['p'+g]=on.map(x=>x.value);renderBar()}));
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('dragstart',e=>{if(submitted){e.preventDefault();return}e.dataTransfer.setData('text/plain',c.dataset.grp+'|'+c.dataset.id)});
    c.addEventListener('click',()=>{if(submitted)return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));selChip=c;c.classList.add('sel')})});
  document.querySelectorAll('.zone').forEach(z=>{
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
    z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');if(submitted)return;const [g,id]=e.dataTransfer.getData('text/plain').split('|');if(g===z.dataset.grp)place(z,id)});
    z.addEventListener('click',()=>{if(submitted)return;cur=+z.dataset.q;
      if(selChip&&selChip.dataset.grp===z.dataset.grp){place(z,selChip.dataset.id);selChip=null}
      else if(ans[z.dataset.q]){delete ans[z.dataset.q];restore();renderBar()}
      else renderBar()})});
}
// ---------- bar ----------
function answered(q){
  const k=TEST.key[q];
  if(k.type==='pick'){const a=ans['p'+k.g]||[];return a.length>k.idx}
  if(k.type==='none'&&!ans[q])return false
  return !!(ans[q]&&String(ans[q]).trim())}
function renderBar(){
  const b=$('#bar');b.innerHTML='';
  TEST.parts.forEach((P,i)=>{
    const d=document.createElement('div');d.className='pt'+(i===part?' act':'');
    const qs=[];for(let q=P.from;q<=P.to;q++)qs.push(q);
    const n=qs.filter(answered).length;
    d.innerHTML='<span>Part '+P.n+'</span><span class="cnt">'+n+' of '+(P.to-P.from+1)+'</span><span class="nums">'+qs.map(q=>'<span class="nb'+(answered(q)?' done':'')+(q===cur?' cur':'')+(flags[q]?' flag':'')+(res&&res[q]!==undefined&&res[q]!==null?(res[q]?' ok':' no'):'')+'" data-q="'+q+'">'+q+'</span>').join('')+'</span>';
    d.addEventListener('click',e=>{const nb=e.target.closest('.nb');if(i!==part){part=i;cur=P.from;render()}if(nb){goTo(+nb.dataset.q)}});
    b.appendChild(d)});
  const s=document.createElement('button');s.id='submit';s.textContent='✔';s.title='Submit';s.onclick=askSubmit;b.appendChild(s)}
function goTo(q){cur=q;renderBar();const el=document.querySelector('[data-q="'+q+'"],[data-q2="'+q+'"]');if(el){const t=el.closest('.q')||el;t.scrollIntoView({block:'center',behavior:'smooth'});const inp=t.querySelector('input.gap');if(inp&&!submitted)inp.focus()}}
function updateArrows(){$('#prev').classList.toggle('dis',part===0&&cur<=1);$('#next').classList.toggle('dis',part===TEST.parts.length-1&&cur>=N)}
$('#next').onclick=()=>{if(cur<N){const nq=cur+1;const P=TEST.parts[part];if(nq>P.to){part++;cur=nq;render()}else goTo(nq)}};
$('#prev').onclick=()=>{if(cur>1){const nq=cur-1;const P=TEST.parts[part];if(nq<P.from){part--;cur=nq;render()}else goTo(nq)}};
document.addEventListener('contextmenu',e=>{const nb=e.target.closest('.nb');if(nb){e.preventDefault();const q=nb.dataset.q;flags[q]=!flags[q];renderBar()}});
// ---------- audio ----------
$('#playbtn').onclick=()=>{$('#start').style.display='none';
  aud.play().then(()=>{$('#audiostat').textContent='Audio is playing'}).catch(()=>{$('#audiostat').textContent='No audio file attached'});
  aud.addEventListener('ended',()=>{$('#audiostat').textContent='Audio finished'})};
aud.addEventListener('error',()=>{$('#audiostat').textContent='No audio file attached'});
// ---------- submit / results ----------
let res=null;
function band(s){const t=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5]];for(const [m,b] of t)if(s>=m)return b;return 'below 2.5'}
function score(){
  const r={},det=[];
  for(let q=1;q<=N;q++){const k=TEST.key[q];let ok=false,mine,corr;
    if(k.type==='none'){mine=ans[q]||'—';ok=null;corr='(no key available)'}
    else if(k.type==='pick'){const a=ans['p'+k.g]||[];const hit=a.filter(x=>k.set.includes(x)).length;ok=hit>k.idx;mine=a.join(' & ')||'—';corr=k.set.join(' & ')}
    else{mine=ans[q]||'—';ok=isOK(q,ans[q]);corr=k.type==='gap'?k.accept[0]+(k.accept.length>1?'  (also: '+k.accept.slice(1).join(' / ')+')':''):(k.type==='set'?k.set.join(' / '):k.accept)}
    r[q]=ok;det.push([q,mine,corr,ok])}
  return {r,det}}
function askSubmit(){
  if(submitted){showResults();return}
  const un=[];for(let q=1;q<=N;q++)if(!answered(q))un.push(q);
  const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="modal"><h2 style="margin-top:0">Submit your answers?</h2><p>'+(un.length?'You have not answered '+un.length+' question(s): '+un.join(', ')+'.':'You have answered all '+N+' questions.')+'</p><button class="btn" id="yes">Submit and check</button><button class="btn sec" id="no">Keep working</button></div>';
  document.body.appendChild(o);$('#no').onclick=()=>o.remove();$('#yes').onclick=()=>{o.remove();doSubmit()}}
function doSubmit(){submitted=true;aud.pause();document.body.classList.add('locked');
  document.querySelectorAll('input').forEach(i=>i.disabled=true);
  const s=score();res=s.r;window._det=s.det;showResults();render()}
function showResults(){
  const det=window._det;const scorable=det.filter(d=>d[3]!==null).length;const total=det.filter(d=>d[3]===true).length;
  const wrong=det.filter(d=>d[3]===false&&d[1]!=='—'&&d[1]!=='').length;const blank=det.filter(d=>d[3]===false&&(d[1]==='—'||d[1]==='')).length;
  const b40=Math.round(total*40/scorable);
  const o=document.createElement('div');o.className='overlay';
  const pct=(a,b)=>b?Math.round(100*a/b):0;const rng=a=>{const o=[];let i=0;while(i<a.length){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;o.push(j>i?a[i]+'–'+a[j]:''+a[i]);i=j+1}return o.join(', ')};
  const rowP=(label,n,m,sub)=>'<tr><td>'+label+(sub?' <span class="qt">'+sub+'</span>':'')+'</td><td class="pc"><b>'+n+' / '+m+'</b></td><td class="pc">'+pct(n,m)+'% <span class="bar" style="width:'+Math.round(pct(n,m)*0.7)+'px"></span></td></tr>';
  const partRows=TEST.parts.map(P=>{const n=det.filter(d=>d[0]>=P.from&&d[0]<=P.to&&d[3]===true).length;const m=det.filter(d=>d[0]>=P.from&&d[0]<=P.to&&d[3]!==null).length;return rowP('Part '+P.n,n,m,'Q'+P.from+'–'+P.to)}).join('');
  const types=[];det.forEach(d=>{const t=TEST.key[d[0]].qt||'Other';if(!types.includes(t))types.push(t)});
  const typeRows=types.map(t=>{const ds=det.filter(d=>(TEST.key[d[0]].qt||'Other')===t&&d[3]!==null);const n=ds.filter(d=>d[3]===true).length;const qs=det.filter(d=>(TEST.key[d[0]].qt||'Other')===t).map(d=>d[0]);return rowP(t,n,ds.length,'Q'+rng(qs))}).join('');
  const scoreLine=total+' / '+scorable;
  const bandLine=(scorable===40?'':'<div style="color:#555">Scaled to 40: <b>'+b40+' / 40</b></div>')+'<div><b>Approx. band: '+band(b40)+'</b> (Academic Listening conversion)</div>';
  o.innerHTML='<div class="modal"><div>Your result</div><div class="score">'+scoreLine+'</div>'+bandLine+
   '<div class="stats"><div class="stat"><b style="color:var(--ok)">'+total+'</b>correct</div><div class="stat"><b style="color:var(--bad)">'+wrong+'</b>wrong</div><div class="stat"><b>'+blank+'</b>unanswered</div></div>'+
   '<h4>Score by part</h4><table class="res">'+partRows+'</table>'+
   '<h4>Score by question type</h4><table class="res">'+typeRows+'</table>'+
   '<h4>All answers</h4><table class="res"><tr><th>Q</th><th>Type</th><th>Your answer</th><th>Correct answer</th><th></th></tr>'+det.map(d=>'<tr><td>'+d[0]+'</td><td class="qt">'+esc(TEST.key[d[0]].qt||'')+'</td><td>'+esc(String(d[1]))+'</td><td>'+esc(String(d[2]))+'</td><td class="'+(d[3]===null?'':(d[3]?'ok':'no'))+'">'+(d[3]===null?'–':(d[3]?'✔':'✘'))+'</td></tr>').join('')+'</table><button class="btn" id="rev">Review test</button><button class="btn sec" id="retry">Retake</button></div>';
  document.body.appendChild(o);
  $('#rev').onclick=()=>o.remove();$('#retry').onclick=()=>location.reload()}
function decorate(){
  document.querySelectorAll('[data-q]').forEach(el=>{});
  const det=window._det;if(!det)return;
  const P=TEST.parts[part];
  det.filter(d=>d[0]>=P.from&&d[0]<=P.to).forEach(d=>{
    const q=d[0];const k=TEST.key[q];
    let host=document.querySelector('.q[data-q="'+q+'"]')||document.querySelector('.q[data-q2="'+q+'"]');
    if(k.type==='pick'&&k.idx>0)return;if(k.type==='pick'){const a=ans['p'+k.g]||[];const hit=a.filter(x=>k.set.includes(x)).length;const sp0=document.createElement('span');sp0.className='fb '+(hit===k.set.length?'ok':'no');sp0.textContent=hit===k.set.length?'✔ both correct':'✘ '+hit+' of '+k.set.length+' · Answer: '+k.set.join(' & ');host.appendChild(sp0);return}
    if(k.type==='none')return;
    if(!host)return;
    const sp=document.createElement('span');if(d[3]===null)return;sp.className='fb '+(d[3]?'ok':'no');
    sp.textContent=d[3]?'✔':'✘ Answer: '+d[2];
    const tgt=host.querySelector('input.gap,.zone')||host.querySelector('.n')||host;
    if(tgt.parentNode&&(tgt.tagName==='INPUT'||tgt.classList.contains('zone')))tgt.insertAdjacentElement('afterend',sp);else host.appendChild(sp)})}
$('#notesbtn').onclick=()=>{const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="modal"><h3>Notes</h3><textarea id="nt" style="width:100%;height:220px"></textarea><br><button class="btn" id="cl">Close</button></div>';document.body.appendChild(o);$('#nt').value=window._notes||'';$('#cl').onclick=()=>{window._notes=$('#nt').value;o.remove()}};
render();
</script></body></html>
