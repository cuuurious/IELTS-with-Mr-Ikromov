<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Listening – Test 6</title>
<style>
:root{--red:#c8102e;--ink:#1a1a1a;--bg:#fff;--line:#c9c9c9;--soft:#f1f1ef;--ok:#1b7a3a;--bad:#b3261e;--accent:#1f5fbf}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
header{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:20}
.logo{font-weight:900;color:var(--red);font-size:24px;letter-spacing:-1px}
.hmid{font-size:13px;line-height:1.25;margin-left:12px;flex:1}
.hmid b{display:block;font-size:14px}
#audiostat{color:#555}
.hbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
main{padding:72px 16px 90px;max-width:960px;margin:0 auto}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:18px}
.banner b{display:block}
h3{margin:22px 0 4px;font-size:15px}
.instr{margin:0 0 10px}
.ptitle{font-weight:700;font-size:17px;margin:10px 0}
.notes{margin:8px 0 6px}
.notes .h{font-weight:700;margin:12px 0 4px}
.notes .t{margin:6px 0}
.notes .b{margin:6px 0 6px 18px;position:relative}.notes .b:before{content:"•";position:absolute;left:-14px}
.notes .s{margin:6px 0 6px 38px;position:relative}.notes .s:before{content:"–";position:absolute;left:-14px}
input.gap{width:140px;height:28px;border:1px solid #777;border-radius:3px;padding:0 6px;text-align:center;font-weight:700;font-size:14px;margin:0 4px;vertical-align:middle;background:#fff}
input.gap::placeholder{color:#111;opacity:1}
input.gap:focus{outline:2px solid var(--accent)}
.q{margin:16px 0}.q .n{display:inline-block;min-width:22px;font-weight:700;border:1px solid transparent;padding:0 3px}
.q.cur .n{border-color:var(--accent)}
.opt{display:flex;align-items:center;gap:8px;margin:7px 0 7px 22px;cursor:pointer}
.opt input{width:16px;height:16px}
.zone{display:inline-flex;align-items:center;justify-content:center;min-width:150px;height:30px;border:1.5px dashed #555;border-radius:4px;font-weight:700;padding:0 8px;margin:0 6px;vertical-align:middle;background:#fff;cursor:pointer}
.zone.filled{border-style:solid;background:#f7fbff}
.zone.over{background:#e6f0ff}
.zone.letter{min-width:56px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{border:1px solid #666;border-radius:4px;padding:5px 10px;background:#fff;cursor:grab;user-select:none;font-size:14px}
.chip.sel{outline:2px solid var(--accent);background:#eaf1ff}
.chip.letter b{margin-right:6px}
.drow{margin:12px 0;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.drow .lab{min-width:170px}
.mapwrap{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.mapwrap img{max-width:520px;width:100%;border:1px solid var(--line)}
.helpline{font-size:12px;color:#666;margin:2px 0 8px}
nav#bar{position:fixed;bottom:0;left:0;right:0;height:52px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:stretch;z-index:20}
.pt{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:14px;color:#444;padding:0 6px;border-right:1px solid #eee}
.pt.act{flex:3;color:#000;font-weight:700;justify-content:flex-start;padding-left:14px}
.pt .nums{display:none;gap:4px;flex-wrap:nowrap;font-weight:400}
.pt.act .nums{display:flex}
.pt .cnt{font-weight:400;font-size:12px}.pt.act .cnt{display:none}
.nb{min-width:22px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid transparent;border-radius:2px;cursor:pointer;position:relative}
.nb.done{font-weight:700;background:#e9f0fb}
.nb.cur{border-color:var(--accent)}
.nb.flag:after{content:"";position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--red);border-radius:50%}
.nb.ok{background:#dff3e5;color:var(--ok)}.nb.no{background:#fbe2e0;color:var(--bad)}
#submit{width:64px;background:#eee;border:0;cursor:pointer;font-size:22px}
.arrows{position:fixed;right:16px;bottom:70px;display:flex;gap:2px;z-index:15}
.arrows button{width:44px;height:44px;border:0;background:#111;color:#fff;font-size:22px;cursor:pointer;border-radius:3px}
.arrows button.dis{background:#ddd;color:#888}
.overlay{position:fixed;inset:0;background:rgba(60,60,60,.93);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.overlay .play{margin-top:20px;background:#000;color:#fff;border:0;border-radius:4px;padding:12px 24px;font-size:16px;cursor:pointer}
.modal{background:#fff;color:#111;max-width:760px;width:100%;max-height:88vh;overflow:auto;border-radius:8px;padding:24px;text-align:left}
.score{font-size:40px;font-weight:800;margin:6px 0}
table.res{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
table.res td,table.res th{border-bottom:1px solid #ddd;padding:5px 8px;text-align:left}
td.ok{color:var(--ok);font-weight:700}td.no{color:var(--bad);font-weight:700}
.fb{display:inline-block;margin-left:8px;font-size:13px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.locked input.gap{background:#f6f6f6}
.btn{background:var(--accent);color:#fff;border:0;border-radius:5px;padding:10px 18px;font-size:15px;cursor:pointer;margin:6px 6px 0 0}
.btn.sec{background:#eee;color:#111}

.side{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;margin:8px 0}.side>div{flex:1 1 260px;min-width:0}
img.pic{max-width:100%;width:520px;border:1px solid var(--line)}
table.tb{border-collapse:collapse;margin:10px 0;width:100%}
table.tb td,table.tb th{border:1px solid #777;padding:6px 8px;vertical-align:top;text-align:left}
table.tb th{background:#f3f3f1}
table.form{max-width:760px}
table.opt{width:auto;min-width:320px}
.flow{max-width:560px;margin:8px 0}.fb{border:1px solid #444;padding:7px 9px;text-align:center}.arr{text-align:center;line-height:1.1}
.cb{margin:3px 0 3px 12px;position:relative}.cb:before{content:"•";position:absolute;left:-11px}
p.b{font-weight:700}p.c{text-align:center}p.i{font-style:italic}p.sub{font-weight:700}p.bh{font-weight:700;text-align:center}
.ptitle.c{text-align:center}
.nt{font-weight:700;text-align:center;margin-bottom:6px}
.notes{border:1px solid #444;padding:8px 12px;margin:8px 0}
.notes .gp{height:8px}
.bl{letter-spacing:1px}
.lines .drow{margin:8px 0}
input.gap.short{width:64px}
.gw{white-space:nowrap}
@media(max-width:640px){.pt.act{flex:5}.pt:not(.act) .cnt{display:none}input.gap{width:110px}}
</style></head><body>
<header><div class="logo">IELTS</div><div class="hmid"><b>MrIkromov's IELTS · Listening Test 6</b><span id="audiostat"></span></div><button class="hbtn" id="notesbtn">Notes</button></header>
<main id="main"></main>
<div class="arrows"><button id="prev">←</button><button id="next">→</button></div>

<div class="overlay" id="start"><div style="font-size:64px">🎧</div><p style="max-width:640px">You will be listening to an audio recording during this test. You will not be permitted to pause or rewind the audio while answering the questions.</p><p>To continue, click Play.</p><button class="play" id="playbtn">▶ Play</button></div>

<script>
const TEST={"no": 6, "key": {"1": {"type": "gap", "accept": ["southeast"]}, "2": {"type": "gap", "accept": ["washing machine"]}, "3": {"type": "gap", "accept": ["15th May"]}, "4": {"type": "gap", "accept": ["employer"]}, "5": {"type": "gap", "accept": ["675"]}, "6": {"type": "gap", "accept": ["translator"]}, "7": {"type": "gap", "accept": ["bank statement"]}, "8": {"type": "gap", "accept": ["Ainsworth"]}, "9": {"type": "gap", "accept": ["telephone"]}, "10": {"type": "gap", "accept": ["bus stop"]}, "11": {"type": "letter", "accept": "B"}, "12": {"type": "letter", "accept": "C"}, "13": {"type": "letter", "accept": "C"}, "14": {"type": "letter", "accept": "C"}, "15": {"type": "letter", "accept": "A"}, "16": {"type": "letter", "accept": "A"}, "17": {"type": "letter", "accept": "C"}, "18": {"type": "letter", "accept": "B"}, "19": {"type": "letter", "accept": "A"}, "20": {"type": "letter", "accept": "C"}, "21": {"type": "letter", "accept": "B"}, "22": {"type": "letter", "accept": "C"}, "23": {"type": "letter", "accept": "H"}, "24": {"type": "letter", "accept": "D"}, "25": {"type": "letter", "accept": "G"}, "26": {"type": "letter", "accept": "A"}, "27": {"type": "letter", "accept": "C"}, "28": {"type": "letter", "accept": "A"}, "29": {"type": "letter", "accept": "B"}, "30": {"type": "letter", "accept": "A"}, "31": {"type": "gap", "accept": ["coconut"]}, "32": {"type": "gap", "accept": ["stones"]}, "33": {"type": "gap", "accept": ["belt"]}, "34": {"type": "gap", "accept": ["sour"]}, "35": {"type": "gap", "accept": ["biscuits"]}, "36": {"type": "gap", "accept": ["fertiliser", "fertilizer"]}, "37": {"type": "gap", "accept": ["celebration"]}, "38": {"type": "gap", "accept": ["harp"]}, "39": {"type": "gap", "accept": ["ropes"]}, "40": {"type": "gap", "accept": ["houses"]}}, "zg": {"15": 1, "16": 1, "17": 1, "18": 1, "19": 1, "20": 1, "21": 3, "22": 3, "23": 3, "24": 3, "25": 3}, "parts": [{"n": 1, "from": 1, "to": 10, "range": "1–10", "html": "<h3>Questions 1–10</h3><p class='instr'>Complete the notes below.</p><p class='instr'>Write <b>NO MORE THAN TWO WORDS AND/OR A NUMBER</b> for each answer.</p><table class='tb'><tr><td><b>Accommodation request</b></td><td></td></tr><tr><td><i>Example</i>  Name:</td><td>Anna Black</td></tr><tr><td>Type of accommodation:</td><td>a house</td></tr><tr><td>Preferred location:</td><td>the <span class='gw' data-q='1'><input class='gap' data-q='1' placeholder='1' autocomplete='off' spellcheck='false'></span> of the town</td></tr><tr><td>Facilities required:</td><td>furnished property – with a <span class='gw' data-q='2'><input class='gap' data-q='2' placeholder='2' autocomplete='off' spellcheck='false'></span></td></tr><tr><td>Period of time required:</td><td>one year</td></tr><tr><td>Start date of rental period:</td><td><span class='gw' data-q='3'><input class='gap' data-q='3' placeholder='3' autocomplete='off' spellcheck='false'></span></td></tr><tr><td>Present address:</td><td>56, Stone Street</td></tr><tr><td>Phone number:</td><td>(mobile) 07942 326584</td></tr><tr><td>Reference from:</td><td>her <span class='gw' data-q='4'><input class='gap' data-q='4' placeholder='4' autocomplete='off' spellcheck='false'></span></td></tr><tr><td>Maximum rent:</td><td>£ <span class='gw' data-q='5'><input class='gap' data-q='5' placeholder='5' autocomplete='off' spellcheck='false'></span> per month</td></tr><tr><td>Applicant’s job:</td><td><span class='gw' data-q='6'><input class='gap' data-q='6' placeholder='6' autocomplete='off' spellcheck='false'></span></td></tr><tr><td><b>Documents to be supplied</b></td><td></td></tr><tr><td>ID check:</td><td>applicant’s passport</td></tr><tr><td>Credit check:</td><td>a <span class='gw' data-q='7'><input class='gap' data-q='7' placeholder='7' autocomplete='off' spellcheck='false'></span></td></tr><tr><td><b>Viewing arrangements</b></td><td></td></tr><tr><td>Address of property:</td><td>33, <span class='gw' data-q='8'><input class='gap' data-q='8' placeholder='8' autocomplete='off' spellcheck='false'></span> Street</td></tr><tr><td>Viewing day and time:</td><td>Saturday 4 p.m.</td></tr><tr><td>To check:</td><td><p class=''>Is there a <span class='gw' data-q='9'><input class='gap' data-q='9' placeholder='9' autocomplete='off' spellcheck='false'></span> in the house?</p><p class=''>Is there a <span class='gw' data-q='10'><input class='gap' data-q='10' placeholder='10' autocomplete='off' spellcheck='false'></span> nearby?</p></td></tr></table>"}, {"n": 2, "from": 11, "to": 20, "range": "11–20", "html": "<h3>Questions 11–14</h3><p class='instr'>Choose the correct letter, <b>A</b>, <b>B</b> or <b>C</b>.</p><p class=''><b>Information for fire wardens</b></p><div class='q' data-q='11'><span class='n'>11</span> The company is having this meeting about fire procedures because<label class='opt'><input type='radio' name='q11' value='A' data-q='11'> <b>A</b> employees did badly in the last annual fire drill.</label><label class='opt'><input type='radio' name='q11' value='B' data-q='11'> <b>B</b> there have been changes in the building layout.</label><label class='opt'><input type='radio' name='q11' value='C' data-q='11'> <b>C</b> new staff have joined the company.</label></div><div class='q' data-q='12'><span class='n'>12</span> There has been a recent upgrade to<label class='opt'><input type='radio' name='q12' value='A' data-q='12'> <b>A</b> the sprinkler system.</label><label class='opt'><input type='radio' name='q12' value='B' data-q='12'> <b>B</b> the fire extinguishers.</label><label class='opt'><input type='radio' name='q12' value='C' data-q='12'> <b>C</b> the alarm system.</label></div><div class='q' data-q='13'><span class='n'>13</span> During the minor fire in January, some staff working in the factory<label class='opt'><input type='radio' name='q13' value='A' data-q='13'> <b>A</b> were unable to read fire notices.</label><label class='opt'><input type='radio' name='q13' value='B' data-q='13'> <b>B</b> left fire doors open.</label><label class='opt'><input type='radio' name='q13' value='C' data-q='13'> <b>C</b> were unwilling to start the fire alarm.</label></div><div class='q' data-q='14'><span class='n'>14</span> In the fire in January, the problem with office staff was that they<label class='opt'><input type='radio' name='q14' value='A' data-q='14'> <b>A</b> refused to leave personal items behind.</label><label class='opt'><input type='radio' name='q14' value='B' data-q='14'> <b>B</b> moved too slowly during the evacuation.</label><label class='opt'><input type='radio' name='q14' value='C' data-q='14'> <b>C</b> did not move far away enough from the building.</label></div><h3>Questions 15–20</h3><p class=''>What comment does the speaker make about each of the following aspects of fire safety?</p><p class='instr'>Write the correct letter, <b>A</b>, <b>B</b> or <b>C</b>, next to questions 15–20.</p><div class='helpline'>Comments</div><div class='bank' data-bank='g1'><span class='chip' draggable='true' data-id='A' data-grp='g1'><b>A</b> It should be a priority for fire wardens</span><span class='chip' draggable='true' data-id='B' data-grp='g1'><b>B</b> It will be dealt with by an external specialist</span><span class='chip' draggable='true' data-id='C' data-grp='g1'><b>C</b> It does not require attention</span></div><p class=''><b>Aspects of fire safety</b></p><div class='lines'><div class='drow q' data-q='15'><span class='n'>15</span><span class='lab'>ensuring there are no obstacles in fire escape routes <span class='zone letter' data-q='15' data-grp='g1'>15</span></span></div><div class='drow q' data-q='16'><span class='n'>16</span><span class='lab'>checking that fire doors are easily opened <span class='zone letter' data-q='16' data-grp='g1'>16</span></span></div><div class='drow q' data-q='17'><span class='n'>17</span><span class='lab'>showing staff how to look after each other <span class='zone letter' data-q='17' data-grp='g1'>17</span></span></div><div class='drow q' data-q='18'><span class='n'>18</span><span class='lab'>training staff to use fire extinguishers correctly <span class='zone letter' data-q='18' data-grp='g1'>18</span></span></div><div class='drow q' data-q='19'><span class='n'>19</span><span class='lab'>checking that staff are aware of evacuation points <span class='zone letter' data-q='19' data-grp='g1'>19</span></span></div><div class='drow q' data-q='20'><span class='n'>20</span><span class='lab'>checking that flammable liquids are properly stored <span class='zone letter' data-q='20' data-grp='g1'>20</span></span></div></div>"}, {"n": 3, "from": 21, "to": 30, "range": "21–30", "html": "<h3>Questions 21–25</h3><p class=''>What comments do the speakers make about each of the following types of pigeon?</p><p class='instr'>Choose <b>FIVE</b> answers from the box and write the correct letter, <b>A–H</b>, next to questions 21–25.</p><div class='helpline'>Comments</div><div class='bank' data-bank='g3'><span class='chip' draggable='true' data-id='A' data-grp='g3'><b>A</b> eats meat</span><span class='chip' draggable='true' data-id='B' data-grp='g3'><b>B</b> communicates with its wings</span><span class='chip' draggable='true' data-id='C' data-grp='g3'><b>C</b> is found in a variety of locations</span><span class='chip' draggable='true' data-id='D' data-grp='g3'><b>D</b> feeds on a particular type of plant</span><span class='chip' draggable='true' data-id='E' data-grp='g3'><b>E</b> sings to attract a mate</span><span class='chip' draggable='true' data-id='F' data-grp='g3'><b>F</b> is endangered</span><span class='chip' draggable='true' data-id='G' data-grp='g3'><b>G</b> is brightly coloured</span><span class='chip' draggable='true' data-id='H' data-grp='g3'><b>H</b> avoids the ground</span></div><p class=''><b>Types of pigeon</b></p><div class='lines'><div class='drow q' data-q='21'><span class='n'>21</span><span class='lab'>Australian crested pigeon <span class='zone letter' data-q='21' data-grp='g3'>21</span></span></div><div class='drow q' data-q='22'><span class='n'>22</span><span class='lab'>Rock pigeon <span class='zone letter' data-q='22' data-grp='g3'>22</span></span></div><div class='drow q' data-q='23'><span class='n'>23</span><span class='lab'>Black-banded pigeon <span class='zone letter' data-q='23' data-grp='g3'>23</span></span></div><div class='drow q' data-q='24'><span class='n'>24</span><span class='lab'>Galapagos pigeon <span class='zone letter' data-q='24' data-grp='g3'>24</span></span></div><div class='drow q' data-q='25'><span class='n'>25</span><span class='lab'>Nicobar pigeon <span class='zone letter' data-q='25' data-grp='g3'>25</span></span></div></div><h3>Questions 26–30</h3><p class='instr'>Choose the correct letter, <b>A</b>, <b>B</b> or <b>C</b>.</p><p class=''><b>Pigeons</b></p><div class='q' data-q='26'><span class='n'>26</span> When people feed city pigeons, it causes them to<label class='opt'><input type='radio' name='q26' value='A' data-q='26'> <b>A</b> breed more successfully.</label><label class='opt'><input type='radio' name='q26' value='B' data-q='26'> <b>B</b> become overweight.</label><label class='opt'><input type='radio' name='q26' value='C' data-q='26'> <b>C</b> get sick.</label></div><div class='q' data-q='27'><span class='n'>27</span> The Melbourne city council are tackling their pigeon problem by<label class='opt'><input type='radio' name='q27' value='A' data-q='27'> <b>A</b> removing the pigeons from the city.</label><label class='opt'><input type='radio' name='q27' value='B' data-q='27'> <b>B</b> scaring away pigeons.</label><label class='opt'><input type='radio' name='q27' value='C' data-q='27'> <b>C</b> providing homes for the pigeons.</label></div><div class='q' data-q='28'><span class='n'>28</span> Jennifer and Adam agree that the second stage of the council scheme is<label class='opt'><input type='radio' name='q28' value='A' data-q='28'> <b>A</b> expensive.</label><label class='opt'><input type='radio' name='q28' value='B' data-q='28'> <b>B</b> cruel.</label><label class='opt'><input type='radio' name='q28' value='C' data-q='28'> <b>C</b> ineffective.</label></div><div class='q' data-q='29'><span class='n'>29</span> What method of pigeon control was most successful in the city of Basel?<label class='opt'><input type='radio' name='q29' value='A' data-q='29'> <b>A</b> trapping the pigeons</label><label class='opt'><input type='radio' name='q29' value='B' data-q='29'> <b>B</b> educating the public</label><label class='opt'><input type='radio' name='q29' value='C' data-q='29'> <b>C</b> building nesting sites</label></div><div class='q' data-q='30'><span class='n'>30</span> Adam and Jennifer decide to do some more research on how pigeons can<label class='opt'><input type='radio' name='q30' value='A' data-q='30'> <b>A</b> affect our health.</label><label class='opt'><input type='radio' name='q30' value='B' data-q='30'> <b>B</b> damage buildings.</label><label class='opt'><input type='radio' name='q30' value='C' data-q='30'> <b>C</b> cause local flooding.</label></div>"}, {"n": 4, "from": 31, "to": 40, "range": "31–40", "html": "<h3>Questions 31–40</h3><p class='instr'>Complete the notes below.</p><p class='instr'>Write <b>ONE WORD ONLY</b> for each answer.</p><div class='notes'><div class='nt'>The Lontar Palm</div><div class='h'>The tree</div><div class='b'>grows on Roti, an Indonesian island</div><div class='b'>is known as the 'tree of life'</div><div class='b'>produces delicious juice</div><div class='b'>has a fruit resembling a <span class='gw' data-q='31'><input class='gap' data-q='31' placeholder='31' autocomplete='off' spellcheck='false'></span> (female trees only)</div><div class='h'>People climbing the trees</div><div class='b'>fix <span class='gw' data-q='32'><input class='gap' data-q='32' placeholder='32' autocomplete='off' spellcheck='false'></span> to the tree trunks to help them climb</div><div class='b'>keep their tools attached to a <span class='gw' data-q='33'><input class='gap' data-q='33' placeholder='33' autocomplete='off' spellcheck='false'></span></div><div class='b'>often own particular trees</div><div class='b'>contribute to the upkeep of the communal fence</div><div class='h'>Using the juice</div><div class='b'>It quickly becomes <span class='gw' data-q='34'><input class='gap' data-q='34' placeholder='34' autocomplete='off' spellcheck='false'></span> if left unprocessed.</div><div class='b'>A concentrated form of it is drunk in the rainy season.</div><div class='b'>it can be made into sugary <span class='gw' data-q='35'><input class='gap' data-q='35' placeholder='35' autocomplete='off' spellcheck='false'></span></div><div class='h'>Using other parts of the tree</div><div class='t'>The leaf is used:</div><div class='b'>to make containers, bags and roofing</div><div class='b'>as garden <span class='gw' data-q='36'><input class='gap' data-q='36' placeholder='36' autocomplete='off' spellcheck='false'></span></div><div class='b'>for brightly decorated hats worn at a <span class='gw' data-q='37'><input class='gap' data-q='37' placeholder='37' autocomplete='off' spellcheck='false'></span></div><div class='b'>for a musical instrument which sounds like a <span class='gw' data-q='38'><input class='gap' data-q='38' placeholder='38' autocomplete='off' spellcheck='false'></span></div><div class='t'>The stalk is used to make <span class='gw' data-q='39'><input class='gap' data-q='39' placeholder='39' autocomplete='off' spellcheck='false'></span></div><div class='t'>The trunk is used in the construction of <span class='gw' data-q='40'><input class='gap' data-q='40' placeholder='40' autocomplete='off' spellcheck='false'></span></div></div>"}]};
const $=s=>document.querySelector(s);
const ans={},flags={};let part=0,cur=1,submitted=false;
const aud=$('#aud');
// ---------- normalisation ----------
function norm(s){s=(s||'').toLowerCase().replace(/[£$]/g,'').replace(/[.,;:!?]+$/,'').replace(/\s+/g,' ').trim();s=s.replace(/^(a|an|the)\s+/,'');return s}
function isOK(q,v){
  const k=TEST.key[q];
  if(k.type==='gap'){const n=norm(v);if(!n)return false;if(k.all){return k.all.every(g=>g.some(a=>n.split(' ').includes(norm(a))||n.includes(norm(a))))}return k.accept.some(a=>norm(a)===n)}
  if(k.type==='letter'){return (v||'')===k.accept}
  if(k.type==='set'){return k.set.includes(v||'')}
  if(k.type==='pick'){return false}
  return false}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  const P=TEST.parts[part];
  $('#main').innerHTML='<div class="banner"><b>Part '+P.n+'</b>Listen and answer questions '+P.range+'.</div>'+P.html;
  restore();bindAll();renderBar();updateArrows();
  if(submitted)decorate();
  window.scrollTo(0,0)}
function restore(){
  document.querySelectorAll('input.gap').forEach(i=>{i.value=ans[i.dataset.q]||''});
  document.querySelectorAll('input[type=radio]').forEach(i=>{i.checked=ans[i.dataset.q]===i.value});
  document.querySelectorAll('input.pick').forEach(i=>{const a=ans['p'+i.dataset.g]||[];i.checked=a.includes(i.value)});
  document.querySelectorAll('.zone').forEach(z=>{fillZone(z,ans[z.dataset.q])});
  document.querySelectorAll('.chip').forEach(c=>{const used=Object.entries(ans).some(([q,v])=>v===c.dataset.id&&zoneGrp(q)===c.dataset.grp);c.style.display=used?'none':''});
}
function zoneGrp(q){return (TEST.zg||{})[q]}
function fillZone(z,id){z.textContent=id?id:z.dataset.q;z.classList.toggle('filled',!!id)}
let selChip=null;
function place(z,id){const q=z.dataset.q,grp=z.dataset.grp;
  for(const k in ans){if(ans[k]===id&&zoneGrp(k)===grp)delete ans[k]}
  ans[q]=id;restore();renderBar()}
function bindAll(){
  document.querySelectorAll('input.gap').forEach(i=>{i.addEventListener('input',()=>{ans[i.dataset.q]=i.value;cur=+i.dataset.q;renderBar()});i.addEventListener('focus',()=>{cur=+i.dataset.q;renderBar()})});
  document.querySelectorAll('input[type=radio]').forEach(i=>i.addEventListener('change',()=>{ans[i.dataset.q]=i.value;cur=+i.dataset.q;renderBar()}));
  document.querySelectorAll('input.pick').forEach(i=>i.addEventListener('change',()=>{
    const g=i.dataset.g;const all=[...document.querySelectorAll('input.pick[data-g="'+g+'"]')];
    const on=all.filter(x=>x.checked);if(on.length>(+i.dataset.max||2)){i.checked=false;return}
    ans['p'+g]=on.map(x=>x.value);renderBar()}));
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('dragstart',e=>{if(submitted){e.preventDefault();return}e.dataTransfer.setData('text/plain',c.dataset.grp+'|'+c.dataset.id)});
    c.addEventListener('click',()=>{if(submitted)return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));selChip=c;c.classList.add('sel')})});
  document.querySelectorAll('.zone').forEach(z=>{
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
    z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');if(submitted)return;const [g,id]=e.dataTransfer.getData('text/plain').split('|');if(g===z.dataset.grp)place(z,id)});
    z.addEventListener('click',()=>{if(submitted)return;cur=+z.dataset.q;
      if(selChip&&selChip.dataset.grp===z.dataset.grp){place(z,selChip.dataset.id);selChip=null}
      else if(ans[z.dataset.q]){delete ans[z.dataset.q];restore();renderBar()}
      else renderBar()})});
}
// ---------- bar ----------
function answered(q){
  const k=TEST.key[q];
  if(k.type==='pick'){const a=ans['p'+k.g]||[];return a.length>k.idx}
  if(k.type==='none'&&!ans[q])return false
  return !!(ans[q]&&String(ans[q]).trim())}
function renderBar(){
  const b=$('#bar');b.innerHTML='';
  TEST.parts.forEach((P,i)=>{
    const d=document.createElement('div');d.className='pt'+(i===part?' act':'');
    const qs=[];for(let q=P.from;q<=P.to;q++)qs.push(q);
    const n=qs.filter(answered).length;
    d.innerHTML='<span>Part '+P.n+'</span><span class="cnt">'+n+' of '+(P.to-P.from+1)+'</span><span class="nums">'+qs.map(q=>'<span class="nb'+(answered(q)?' done':'')+(q===cur?' cur':'')+(flags[q]?' flag':'')+(res&&res[q]!==undefined&&res[q]!==null?(res[q]?' ok':' no'):'')+'" data-q="'+q+'">'+q+'</span>').join('')+'</span>';
    d.addEventListener('click',e=>{const nb=e.target.closest('.nb');if(i!==part){part=i;cur=P.from;render()}if(nb){goTo(+nb.dataset.q)}});
    b.appendChild(d)});
  const s=document.createElement('button');s.id='submit';s.textContent='✔';s.title='Submit';s.onclick=askSubmit;b.appendChild(s)}
function goTo(q){cur=q;renderBar();const el=document.querySelector('[data-q="'+q+'"],[data-q2="'+q+'"]');if(el){const t=el.closest('.q')||el;t.scrollIntoView({block:'center',behavior:'smooth'});const inp=t.querySelector('input.gap');if(inp&&!submitted)inp.focus()}}
function updateArrows(){$('#prev').classList.toggle('dis',part===0&&cur<=1);$('#next').classList.toggle('dis',part===TEST.parts.length-1&&cur>=40)}
$('#next').onclick=()=>{if(cur<40){const nq=cur+1;const P=TEST.parts[part];if(nq>P.to){part++;cur=nq;render()}else goTo(nq)}};
$('#prev').onclick=()=>{if(cur>1){const nq=cur-1;const P=TEST.parts[part];if(nq<P.from){part--;cur=nq;render()}else goTo(nq)}};
document.addEventListener('contextmenu',e=>{const nb=e.target.closest('.nb');if(nb){e.preventDefault();const q=nb.dataset.q;flags[q]=!flags[q];renderBar()}});
// ---------- audio ----------
$('#playbtn').onclick=()=>{$('#start').style.display='none';
  aud.play().then(()=>{$('#audiostat').textContent='Audio is playing'}).catch(()=>{$('#audiostat').textContent='No audio file attached'});
  aud.addEventListener('ended',()=>{$('#audiostat').textContent='Audio finished'})};
aud.addEventListener('error',()=>{$('#audiostat').textContent='No audio file attached'});
// ---------- submit / results ----------
let res=null;
function band(s){const t=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5]];for(const [m,b] of t)if(s>=m)return b;return 'below 2.5'}
function score(){
  const r={},det=[];
  for(let q=1;q<=40;q++){const k=TEST.key[q];let ok=false,mine,corr;
    if(k.type==='none'){mine=ans[q]||'—';ok=null;corr='(no key available)'}
    else if(k.type==='pick'){const a=ans['p'+k.g]||[];const hit=a.filter(x=>k.set.includes(x)).length;ok=hit>k.idx;mine=a.join(' & ')||'—';corr=k.set.join(' & ')}
    else{mine=ans[q]||'—';ok=isOK(q,ans[q]);corr=k.type==='gap'?k.accept[0]+(k.accept.length>1?'  (also: '+k.accept.slice(1).join(' / ')+')':''):(k.type==='set'?k.set.join(' / '):k.accept)}
    r[q]=ok;det.push([q,mine,corr,ok])}
  return {r,det}}
function askSubmit(){
  if(submitted){showResults();return}
  const un=[];for(let q=1;q<=40;q++)if(!answered(q))un.push(q);
  const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="modal"><h2 style="margin-top:0">Submit your answers?</h2><p>'+(un.length?'You have not answered '+un.length+' question(s): '+un.join(', ')+'.':'You have answered all 40 questions.')+'</p><button class="btn" id="yes">Submit and check</button><button class="btn sec" id="no">Keep working</button></div>';
  document.body.appendChild(o);$('#no').onclick=()=>o.remove();$('#yes').onclick=()=>{o.remove();doSubmit()}}
function doSubmit(){submitted=true;aud.pause();document.body.classList.add('locked');
  document.querySelectorAll('input').forEach(i=>i.disabled=true);
  const s=score();res=s.r;window._det=s.det;showResults();render()}
function showResults(){
  const det=window._det;const scorable=det.filter(d=>d[3]!==null).length;const total=det.filter(d=>d[3]===true).length;const b40=Math.round(total*40/scorable);
  const o=document.createElement('div');o.className='overlay';
  const parts=TEST.parts.map(P=>{const n=det.filter(d=>d[0]>=P.from&&d[0]<=P.to&&d[3]===true).length;const m=det.filter(d=>d[0]>=P.from&&d[0]<=P.to&&d[3]!==null).length;return 'Part '+P.n+': '+n+'/'+m}).join(' &nbsp;·&nbsp; ');
  o.innerHTML='<div class="modal"><div>Your result</div><div class="score">'+total+' / 40</div><div><b>Approx. band: '+band(total)+'</b> (Academic Listening conversion)</div><p>'+parts+'</p><table class="res"><tr><th>Q</th><th>Your answer</th><th>Correct answer</th><th></th></tr>'+det.map(d=>'<tr><td>'+d[0]+'</td><td>'+esc(String(d[1]))+'</td><td>'+esc(String(d[2]))+'</td><td class="'+(d[3]===null?'':(d[3]?'ok':'no'))+'">'+(d[3]===null?'–':(d[3]?'✔':'✘'))+'</td></tr>').join('')+'</table><button class="btn" id="rev">Review test</button><button class="btn sec" id="retry">Retake</button></div>';
  document.body.appendChild(o);
  $('#rev').onclick=()=>o.remove();$('#retry').onclick=()=>location.reload()}
function decorate(){
  document.querySelectorAll('[data-q]').forEach(el=>{});
  const det=window._det;if(!det)return;
  const P=TEST.parts[part];
  det.filter(d=>d[0]>=P.from&&d[0]<=P.to).forEach(d=>{
    const q=d[0];const k=TEST.key[q];
    let host=document.querySelector('.q[data-q="'+q+'"]')||document.querySelector('.q[data-q2="'+q+'"]');
    if(k.type==='pick'&&k.idx>0)return;
    if(k.type==='none')return;
    if(!host)return;
    const sp=document.createElement('span');if(d[3]===null)return;sp.className='fb '+(d[3]?'ok':'no');
    sp.textContent=d[3]?'✔':'✘ Answer: '+d[2];
    const tgt=host.querySelector('input.gap,.zone')||host.querySelector('.n')||host;
    if(tgt.parentNode&&(tgt.tagName==='INPUT'||tgt.classList.contains('zone')))tgt.insertAdjacentElement('afterend',sp);else host.appendChild(sp)})}
$('#notesbtn').onclick=()=>{const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="modal"><h3>Notes</h3><textarea id="nt" style="width:100%;height:220px"></textarea><br><button class="btn" id="cl">Close</button></div>';document.body.appendChild(o);$('#nt').value=window._notes||'';$('#cl').onclick=()=>{window._notes=$('#nt').value;o.remove()}};
render();
</script><script>/* MrIkromov's IELTS 2026-11-05: the four parts play one after another */(function(){var parts=["/practice/listening/audio/part1-test6.mp3", "/practice/listening/audio/part2-test6.mp3", "/practice/listening/audio/part3-test6.mp3", "/practice/listening/audio/part4-test6.mp3"];var i=0;var a=document.getElementById('aud');if(!a)return;a.addEventListener('ended',function(){if(i<parts.length-1){i++;a.src=parts[i];a.play().catch(function(){});setTimeout(function(){var s=document.getElementById('audiostat');if(s)s.textContent='Audio is playing \u00b7 Part '+(i+1)},0)}})})();</script>
